<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>변리사 민사소송법 기출 학습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f9f7f4;
    --surface: #ffffff;
    --surface2: #f3f0eb;
    --border: #e0d9d0;
    --accent: #4a6fa5;
    --accent-light: #e8eef7;
    --text: #2c2c2c;
    --text-muted: #6b6560;
    --answer-bg: #f7fbf4;
    --answer-border: #b8d9b0;
    --header-accent: #3d5a8a;
    --badge-bg: #4a6fa5;
    --badge-text: #ffffff;
    --section-color: #2d6a2d;
    --nav-hover: #e4ecf7;
    --shadow: 0 2px 8px rgba(0,0,0,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Serif KR', serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  header {
    background: var(--surface);
    border-bottom: 2px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow);
  }

  header h1 {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--header-accent);
    letter-spacing: -0.02em;
    flex: 1;
    min-width: 200px;
  }

  .filter-group {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .filter-label {
    font-size: 0.78rem;
    color: var(--text-muted);
    font-family: 'Noto Sans KR', sans-serif;
  }

  .filter-btn {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.8rem;
    padding: 5px 12px;
    border: 1.5px solid var(--border);
    border-radius: 20px;
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.15s;
  }

  .filter-btn:hover { background: var(--nav-hover); color: var(--accent); border-color: var(--accent); }
  .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .btn-random {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    padding: 8px 18px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s;
  }

  .btn-random:hover { background: var(--header-accent); }

  .progress-info {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.8rem;
    color: var(--text-muted);
    white-space: nowrap;
  }

  /* ── Main layout ── */
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    max-width: 1400px;
    width: 100%;
    margin: 0 auto;
    padding: 24px 20px;
    gap: 20px;
  }

  /* ── Question Panel ── */
  .question-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .q-header {
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .stopwatch {
    margin-left: auto;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.78rem;
    font-weight: 500;
    padding: 4px 11px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    user-select: none;
    cursor: pointer;
  }
  .stopwatch:hover { border-color: var(--accent); color: var(--accent); }
  .stopwatch.long { color: #b45309; border-color: #fdba74; background: #fff7ed; }
  .stopwatch.paused { color: var(--text-muted); background: var(--surface2); border-style: dashed; }

  .btn-hint {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.78rem;
    font-weight: 500;
    padding: 5px 12px;
    border: 1.5px solid var(--border);
    border-radius: 14px;
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-hint:hover { border-color: #d97706; color: #d97706; }
  .btn-hint.active { background: #d97706; border-color: #d97706; color: #fff; }

  .hint-cards {
    display: none;
    margin-top: 16px;
    padding: 12px 14px;
    background: #fff7ed;
    border: 1px solid #fed7aa;
    border-radius: 8px;
  }
  .hint-cards.shown { display: block; }
  .hint-cards-title {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.75rem;
    font-weight: 600;
    color: #b45309;
    margin-bottom: 8px;
    letter-spacing: 0.04em;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .btn-hint-clear {
    margin-left: auto;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.7rem;
    font-weight: 500;
    padding: 2px 8px;
    border: 1px solid #b91c1c;
    border-radius: 10px;
    background: #fff;
    color: #b91c1c;
    cursor: pointer;
    text-transform: none;
    letter-spacing: 0;
  }
  .btn-hint-clear:hover { background: #b91c1c; color: #fff; }
  .hint-card {
    padding: 8px 10px;
    border-bottom: 1px dashed #fdba74;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.82rem;
    line-height: 1.55;
  }
  .hint-card:last-child { border-bottom: none; }
  .hint-card-text {
    color: #7c2d12;
    font-weight: 500;
  }
  .hint-card-reason {
    color: #44403c;
    margin-top: 3px;
    font-size: 0.78rem;
  }
  .hint-card-reason-edit {
    width: 100%;
    box-sizing: border-box;
    margin-top: 4px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.78rem;
    line-height: 1.5;
    border: 1px solid #fdba74;
    border-radius: 4px;
    padding: 4px 6px;
    background: #fff;
    color: #44403c;
    resize: vertical;
    min-height: 40px;
  }
  .hint-card-actions {
    display: flex;
    gap: 6px;
    margin-top: 4px;
  }
  .hint-card-del {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.7rem;
    padding: 2px 8px;
    border: 1px solid #b91c1c;
    border-radius: 10px;
    background: #fff;
    color: #b91c1c;
    cursor: pointer;
  }
  .hint-card-del:hover { background: #b91c1c; color: #fff; }

  .btn-hint-edit {
    margin-left: 4px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.72rem;
    font-weight: 500;
    padding: 4px 9px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
  }
  .btn-hint-edit:hover { border-color: #d97706; color: #d97706; }
  .btn-hint-edit.active { background: #d97706; border-color: #d97706; color: #fff; }

  .add-hint-btn {
    position: absolute;
    z-index: 100;
    display: none;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.78rem;
    font-weight: 500;
    padding: 5px 10px;
    border: 1px solid #d97706;
    border-radius: 6px;
    background: #fff7ed;
    color: #b45309;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    user-select: none;
    white-space: nowrap;
  }
  .add-hint-btn:hover { background: #d97706; color: #fff; }

  /* ── Subject side panel (left) ─────────────────────────── */
  .subject-toggle {
    position: fixed;
    left: 14px;
    top: 16px;
    z-index: 50;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.78rem;
    font-weight: 500;
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  }
  .subject-toggle:hover { border-color: var(--accent); color: var(--accent); }

  .subject-panel {
    position: fixed;
    top: 0;
    left: -240px;
    width: 240px;
    height: 100vh;
    background: var(--surface);
    border-right: 1px solid var(--border);
    box-shadow: 4px 0 16px rgba(0,0,0,0.12);
    display: flex;
    flex-direction: column;
    z-index: 60;
    transition: left 0.25s ease;
  }
  .subject-panel.open { left: 0; }
  .subject-handle {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    right: -22px;
    width: 22px;
    height: 64px;
    background: var(--accent);
    color: #fff;
    border-radius: 0 6px 6px 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 0.95rem;
    box-shadow: 2px 2px 6px rgba(0,0,0,0.12);
    user-select: none;
  }
  .subject-handle::before { content: '›'; }
  .subject-panel.open .subject-handle::before { content: '‹'; }
  .subject-handle:hover { background: #3d5d8a; }

  .subject-header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.92rem;
    font-weight: 600;
    color: var(--text);
  }
  .subject-list { padding: 10px 0; }
  .subject-item {
    padding: 12px 18px;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.95rem;
    color: var(--text);
    border-left: 3px solid transparent;
  }
  .subject-item:hover { background: var(--surface2); }
  .subject-item.active {
    background: var(--accent-light);
    border-left-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }
  .subject-item-count {
    display: block;
    font-size: 0.72rem;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .hint-mark {
    background: rgba(217, 119, 6, 0.12);
    border-bottom: 2px solid #d97706;
    padding: 0 1px;
    border-radius: 1px;
    position: relative;
    cursor: help;
  }
  .hint-mark[data-reason]:hover::after {
    content: attr(data-reason);
    position: absolute;
    bottom: calc(100% + 6px);
    left: 0;
    background: #1f2937;
    color: #fff;
    padding: 7px 11px;
    border-radius: 5px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.75rem;
    font-weight: 400;
    line-height: 1.55;
    white-space: pre-wrap;
    width: max-content;
    max-width: 320px;
    z-index: 200;
    pointer-events: none;
    box-shadow: 0 4px 14px rgba(0,0,0,0.22);
  }
  .hint-mark[data-reason]:hover::before {
    content: '';
    position: absolute;
    bottom: 100%;
    left: 14px;
    border: 5px solid transparent;
    border-top-color: #1f2937;
    margin-bottom: -4px;
    z-index: 201;
    pointer-events: none;
  }

  /* ── Study notes (input on question card, extract on answer card) ── */
  .study-block {
    margin-top: 22px;
    padding-top: 16px;
    border-top: 1px dashed var(--border);
  }
  .study-block-title {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.72rem;
    font-weight: 500;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    margin-bottom: 10px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .btn-reset-notes {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.7rem;
    font-weight: 500;
    padding: 3px 9px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
    text-transform: none;
    letter-spacing: 0;
    transition: all 0.15s;
  }
  .btn-reset-notes:hover { border-color: #b91c1c; color: #b91c1c; }
  .study-row {
    display: flex;
    align-items: stretch;
    gap: 10px;
    margin-bottom: 10px;
  }
  .study-cat-label {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--accent);
    width: 78px;
    flex-shrink: 0;
    padding-top: 7px;
  }
  .study-input {
    flex: 1;
    min-height: 50px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.85rem;
    line-height: 1.6;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 10px;
    background: var(--surface);
    color: var(--text);
    resize: vertical;
    box-sizing: border-box;
  }
  .study-input:focus { outline: none; border-color: var(--accent); }
  .study-extract {
    flex: 1;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.85rem;
    line-height: 1.65;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 10px;
    color: var(--text);
    white-space: pre-wrap;
    min-height: 50px;
    box-sizing: border-box;
    overflow-x: auto;
  }
  .study-extract.empty {
    color: var(--text-muted);
    font-style: italic;
  }

  .study-submit {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.75rem;
    font-weight: 500;
    padding: 4px 10px;
    border: 1.5px solid var(--accent);
    border-radius: 6px;
    background: var(--surface);
    color: var(--accent);
    cursor: pointer;
    height: fit-content;
    align-self: flex-start;
    margin-top: 4px;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .study-submit:hover { background: var(--accent); color: #fff; }
  .study-submit.submitted { background: var(--accent); color: #fff; opacity: 0.6; }

  .study-inline-answer {
    display: none;
    flex: 1;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.85rem;
    line-height: 1.65;
    background: #fff7ed;
    border: 1px solid #fdba74;
    border-radius: 6px;
    padding: 7px 10px;
    color: var(--text);
    white-space: pre-wrap;
    min-height: 50px;
    box-sizing: border-box;
    overflow-x: auto;
  }
  .study-inline-answer.shown { display: block; }
  .study-inline-answer.empty { color: var(--text-muted); font-style: italic; }

  /* ── User text highlight (yellow marker) ── */
  .user-hl {
    background: #fef08a;
    border-radius: 2px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .user-hl:hover { background: #fcd34d; }

  .hl-float-btn {
    position: absolute;
    z-index: 100;
    display: none;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.78rem;
    font-weight: 500;
    padding: 5px 10px;
    border: 1px solid #d97706;
    border-radius: 6px;
    background: #fff7ed;
    color: #b45309;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    user-select: none;
    white-space: nowrap;
  }
  .hl-float-btn:hover { background: #d97706; color: #fff; }

  /* ── Statute side panel ─────────────────────────────────── */
  .statute-toggle {
    position: fixed;
    right: 14px;
    top: 16px;
    z-index: 50;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.78rem;
    font-weight: 500;
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  }
  .statute-toggle:hover { border-color: var(--accent); color: var(--accent); }

  .statute-panel {
    position: fixed;
    top: 0;
    right: -420px;
    width: 420px;
    max-width: 92vw;
    height: 100vh;
    background: var(--surface);
    border-left: 1px solid var(--border);
    box-shadow: -4px 0 16px rgba(0,0,0,0.12);
    display: flex;
    flex-direction: column;
    z-index: 60;
    transition: right 0.25s ease;
  }
  .statute-panel.open { right: 0; }

  /* Vertical handle on the panel's left edge for quick collapse/expand */
  .statute-handle {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    left: -22px;
    width: 22px;
    height: 64px;
    background: var(--accent);
    color: #fff;
    border-radius: 6px 0 0 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 0.95rem;
    box-shadow: -2px 2px 6px rgba(0,0,0,0.12);
    user-select: none;
  }
  .statute-handle::before { content: '‹'; }
  .statute-panel.open .statute-handle::before { content: '›'; }
  .statute-handle:hover { background: #3d5d8a; }

  .statute-header {
    padding: 14px 18px 10px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .statute-title-text {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.92rem;
    font-weight: 600;
    color: var(--text);
    flex: 1;
  }
  .statute-close {
    background: none;
    border: none;
    font-size: 1.4rem;
    cursor: pointer;
    color: var(--text-muted);
    line-height: 1;
    padding: 0 6px;
  }
  .statute-close:hover { color: var(--text); }

  .statute-search {
    padding: 10px 18px;
    border-bottom: 1px solid var(--border);
  }
  .statute-search input {
    width: 100%;
    box-sizing: border-box;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.85rem;
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--text);
  }
  .statute-search input:focus { outline: none; border-color: var(--accent); }

  .statute-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
  }
  .statute-item {
    padding: 10px 18px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .statute-item:hover { background: var(--surface2); }
  .statute-item.active { background: var(--accent-light); border-left: 3px solid var(--accent); }
  .statute-item-no {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 2px;
  }
  .statute-item-title {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .statute-item-body {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.82rem;
    color: var(--text);
    line-height: 1.65;
    white-space: pre-wrap;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.25s ease;
  }
  .statute-item.active .statute-item-body { max-height: 1500px; }

  .statute-empty {
    padding: 20px 18px;
    text-align: center;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.85rem;
    color: var(--text-muted);
    font-style: italic;
  }

  /* In-answer article links */
  .article-link {
    color: var(--accent);
    text-decoration: underline;
    text-decoration-style: dotted;
    text-decoration-thickness: 1px;
    text-underline-offset: 2px;
    cursor: pointer;
  }
  .article-link:hover { background: var(--accent-light); }

  /* ── Cloze quiz ─────────────────────────────────── */
  .btn-quiz {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.78rem;
    font-weight: 500;
    padding: 5px 12px;
    border: 1.5px solid var(--answer-border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--section-color);
    cursor: pointer;
    margin-right: 6px;
  }
  .btn-quiz:hover { background: var(--answer-bg); }
  .btn-quiz.active { background: var(--section-color); color: #fff; border-color: var(--section-color); }

  .quiz-bar {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 8px 18px;
    background: var(--accent-light);
    border-bottom: 1px solid var(--border);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.82rem;
  }
  .quiz-bar.shown { display: flex; }
  .btn-quiz-check, .btn-quiz-end {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.78rem;
    font-weight: 500;
    padding: 4px 10px;
    border: 1px solid var(--accent);
    border-radius: 5px;
    background: var(--surface);
    color: var(--accent);
    cursor: pointer;
  }
  .btn-quiz-check:hover { background: var(--accent); color: #fff; }

  /* ── Phone-size layout ─────────────────────────────────── */
  @media (max-width: 600px) {
    /* Header gets stacked & sized down */

    .subject-toggle, .statute-toggle { top: 10px; padding: 5px 10px; font-size: 0.72rem; }

    main { padding: 10px; gap: 12px; }
    .question-panel, .answer-panel { min-height: 300px; border-radius: 8px; }

    .q-body { padding: 14px 14px 8px; }
    .q-footer { padding: 8px 12px; }
    .btn-nav { font-size: 0.78rem; padding: 6px 12px; }
    .nav-pos { font-size: 0.75rem; }

    .passage-section { padding: 10px 12px; font-size: 0.86rem; line-height: 1.7; }
    .subq-text { font-size: 0.9rem; line-height: 1.75; }

    .study-row { flex-direction: column; gap: 6px; }
    .study-cat-label { width: auto; padding-top: 0; font-size: 0.78rem; }
    .study-input, .study-extract, .study-inline-answer { font-size: 0.82rem; min-height: 44px; }
    .study-submit { align-self: flex-start; }

    /* Answer panel header: keep buttons readable */
    .a-header { padding: 10px 12px; gap: 6px; flex-wrap: wrap; }
    .a-title { font-size: 0.8rem; }
    .btn-toggle, .btn-quiz { font-size: 0.74rem; padding: 5px 10px; }
    .a-body { padding: 14px; }
    .answer-content { font-size: 0.84rem; line-height: 1.75; }
    .ans-section-header, .ans-resolution { font-size: 0.84rem; }

    /* Quiz blanks fit comfortably on small screens */
    .quiz-blank { min-width: 30px; font-size: 0.92em; }
    .quiz-bar { padding: 6px 12px; font-size: 0.78rem; flex-wrap: wrap; }

    /* Side panels become full-screen overlays on phones */
    .statute-panel { width: 100vw; right: -100vw; }
    .statute-panel.open { right: 0; }
    .subject-panel { width: 86vw; left: -86vw; }
    .subject-panel.open { left: 0; }

    /* Hint tooltip + cards keep within the viewport */
    .hint-mark[data-reason]:hover::after { max-width: 78vw; font-size: 0.72rem; }
    .hint-cards { padding: 10px 12px; }
    .hint-card { padding: 7px 8px; }
    .hint-card-text { font-size: 0.78rem; }
    .hint-card-reason, .hint-card-reason-edit { font-size: 0.74rem; }

    /* Floating selection buttons sized down */
    .hl-float-btn, .add-hint-btn { font-size: 0.72rem; padding: 4px 8px; }
  }
</style>

<button class="subject-toggle" id="subjectToggle">📚 과목</button>

"", "theory": "(乙의 항소심 지위) ⅰ)상소하지 않은 자도 상소인으로 보는 견해 ⅱ)상소하지 않은 자들이 상소인에게 묵시적으로 소송수행권 부여한 것으로 보아 선정자의 지위를 갖는다는 견해 ⅲ)합일확정 위해 그들도 상소심으로 이심되어 상소심당사자가 된다는 견해가 있다.", "cases": "(대위소 기판력) 어떤 사유로든 대위소 제기사실을 채무자가 안 경우 판결효가 채무자에게 미치므로 다른 채권자가 동일 소송물에 대해 채권자 대위권에 기한 소 제기하면 전소 기판력을 받는다.\n(乙 지위) 항소하지 않은 공동소송인을 항소심 당사자로 표시한 것이 있다.", "resolution": "甲의 항소로 상소불가분원칙에 따라 乙도 항소심으로 이심되고 乙은 항소심당사자의 지위를 가지며 항소인지, 항소비용 부담하지 않고 항소취하권도 없다."}}, {"no": 3, "points": 10, "question": "피고 J은 변론에서 \"X건물에 관하여 매매계약을 체결하고 대금을 지급\n받은 사람은 1k인데, 그에게 그 대리권을 준 바 없다\"라고 주장하였다.\n이에 원고 과 乙은 법원의 허가를 얻어 I를 예비적 피고로 추가하여\n무권대리행위로 인한 손해배상청구를 하였다. 제1심 법원은 심리한 후 J\n에 대한 청구에 대하여 이유 있다고 이를 인용하면서 L에 대한 청구에\n대하여는 아무런 판단을 하지 않았다. 이러한 제1심 판결에 대하여 J이\n항소하였는데 항소심 법원이 제1심 법원과 동일한 심증을 갖는다면 어떠\n한 판결을 하여야 하는지에 대하여 설명하시오.", "answer": "1. 문제의 소재 1\n丁과 戊가 주관적 예비적 병합관계에 있는지 검토 후 그 심판방\n식에 일부판결이 적법한지, 1인 丁이 항소하였을 때 항소심으로\n함께 이심되어 심판대상이 되는지 검토한다.\n2. 주관적 예비적 병합 해당 여부 2\n(1) 의의·취지 및 허용 여부 [제70조 1항]\nⅰ)공동소송인 가운데 일부에 대한 청구가 다른 공동소송인에 대\n한 청구와 법률상 불가능한 경우 제67조 내지 제69조 준용한다.\nⅱ)반대견해 있었으나 02개정법은 제70조 2항에서 모든 공동소송\n인에 대해 판단하여 분쟁의 1회적 해결, 재판통일 도모하였다.\n(2) 요건 충족 여부\n判例에 따르면 ⅰ)丁, 戊는 戊의 대리권 존부에 따라 丁의 이행의\n무 인정되고 戊의 이행의무가 부정되거나 丁의 이행의무 부정되\n고 戊의 이행의무 인정되어 법률상 양립불가능한 관계이며 ⅱ)공\n동소송요건 갖추었다고 보여지는바 주관적 예비적 병합이다.\n3. 丁의 항소로 戊도 이심되어 심판대상이 되는지 여부 2.5\n(1) [제70조 1항 및 2항]\nⅰ)제67조 내지 제69조 준용한다. 취하, 포기, 인낙, 화해는 각자\n할 수 있다. ⅱ)법원은 모든 공동소송인에 대해 심판한다.\n(2) 심판방식\nⅰ)판결 통일 요하며 ⅱ)1인 상소시 전원 확정차단되어 상소심으\n로 이심되고 상소하지 않은 자의 부분도 항소심 심판대상이 된다.\n(3) 사안\n제67조에 따라 합일확정 요청 있는바 상소불가분원칙에 따라 丁\n항소로 戊도 항소심으로 이심되고 戊 부분도 심판대상이 된다.\n4. 1심판결의 위법성 – 일부판결 가부 1.5\n(1) 判例\n예비적 공동소송에서 일부 공동소송인에 관한 청구만 판결하면\n이는 일부판결이 아닌 흠이 있는 전부판결에 해당한다.\n(2) 사안\n1심은 丁에 대해서만 판단하고 戊에 대해 판단하지 않아 이는 일\n부판결이 아닌 흠이 있는 전부판결이다.\n5. 사안해결 1\n丁의 항소로 戊도 이심되어 심판대상되며 1심판결은 위법한 전부\n판결인바 직권으로 취소하고 1심과 동일한 심증 들었다면 丁에\n대해 청구인용 戊에 대해 청구기각한다.", "categories": {"toc": "1. 문제의 소재\n2. 주관적 예비적 병합 해당 여부\n3. 丁의 항소로 戊도 이심되어 심판대상이 되는지 여부\n4. 1심판결의 위법성 – 일부판결 가부\n5. 사안해결", "purpose": "(주관적 예비적 병합 의의·취지) 공동소송인 가운데 일부에 대한 청구가 다른 공동소송인에 대한 청구와 법률상 불가능한 경우 제67조 내지 제69조 준용한다. 02개정법은 제70조 2항에서 모든 공동소송인에 대해 판단하여 분쟁의 1회적 해결, 재판통일 도모하였다.", "article": "제70조 1항, 제70조 2항, 제67조, 제68조, 제69조", "elements": "(요건) 判例에 따르면 ⅰ)丁, 戊는 戊의 대리권 존부에 따라 丁의 이행의무 인정되고 戊의 이행의무가 부정되거나 丁의 이행의무 부정되고 戊의 이행의무 인정되어 법률상 양립불가능한 관계이며 ⅱ)공동소송요건 갖추었다.", "theory": "", "cases": "예비적 공동소송에서 일부 공동소송인에 관한 청구만 판결하면 이는 일부판결이 아닌 흠이 있는 전부판결에 해당한다.", "resolution": "丁의 항소로 戊도 이심되어 심판대상되며 1심판결은 위법한 전부판결인바 직권으로 취소하고 1심과 동일한 심증 들었다면 丁에 대해 청구인용 戊에 대해 청구기각한다."}}]}, {"subject": "민사소송법", "exam": "56회", "year": 2019, "problemNo": 2, "points": 20, "passage": "\"은 乙에게 1억원을 대여해주면서 1년 후에 돌려받기로 약정하였으나 乙로\n부터 차용증을 별도로 받지는 않았다. 그러나 乙은 변제기가 도래하였음에\n도 이를 갚지 않을 뿐 아니라 돈을 빌린 사실이 없다고까지 다투고 있다. 이\n에 은 乙을 상대로 대여금의 반환을 구하는 소를 제기하고자 A변호사를\n소송대리인으로 선임하였다.", "subquestions": [{"no": 1, "points": 10, "question": "A변호사는 乙을 상대로 위 대여금의 반환을 구하는 소장을 법원에 접수\n하였다. A변호사는 변론 진행과정에서 乙이 오래 전에 대여금 채무의 존\n재를 인정하고 변제기를 유예해 줄 것을 간청하는 내용의 확인서를 에\n게 주었다고 하면서 이를 증거방법으로 제출하였다. 동 확인서에는 乙의\n것으로 보이는 인영이 날인되어 있는 상태이다. 그런데 乙은 확인서에 날\n인된 인영이 자신의 도장에서 현출된 것이 아니라는 위조 주장과 함꺼\n설사 그러한 인영을 가진 도장이 자신의 것이라 하더라도 도용된 것이라\n고 주장하고 있다. 乙의 각 주장에 기초해서 확인서의 진정성립 인정을\n위하여 이 취하여야 할 조치는 무엇인지 설명하시오.", "answer": "1. 문제의 소재 – 서증 의의 및 취지 1\nⅰ)서증이란 문서에 표현된 의사를 증거자료로 하여 요증사실을\n증명하는 증거조사이다. ⅱ)乙은 인영의 위조 및 제3자의 인장도\n용을 주장하는바 인부절차, 2단의 추정 및 복멸의 법리 검토한다.\n2. 문서의 진정성립 의의 및 판단 1\n(1) 문서가 문서신청자에 의해 작성자로 주장되는 자 의사에 기해 작\n성된 것 말한다. 진정성립 인정된 문서는 형식적 증거력이 있다.\n(2) 인정, 침묵, 부인, 부지의 인부절차 및 변론전취지에 따라 자유심\n증으로 판단한다.\n3. 사문서인 계약서의 진정성립 추정 및 복멸 여부 4\n(1) 추정 – 2단의 추정\n1)[제357조] 제출자는 사문서가 진정한 것임을 증명해야 한다.\n2)判例는 인영의 진정이 인정되면 날인의 진정이 사실상 추정되고,\n날인의 진정이 인정되면 문서 전체의 진정성립이 제358조에 의해\n유사적 추정된다고 하여 2단의 추정을 인정한다.\n(2) 인영의 진정 복멸\n인영의 진정은 법관이 의심을 품게 하는 반증으로 복멸한다.\n(3) 날인의 진정 복멸\nⅰ)判例는 날인의 진정 추정은 사실상 추정이므로 날인의 진정을\n다투는 자가 반증을 들어 날인의 진정에 관해 법관으로 하여금\n의심을 품게할 사정을 입증시 추정 깨진다고 한다.\nⅱ)인장도용, 강박날인, 자격모용 사실을 본증으로 제출하여 날인\n의 진정을 간접반증으로 복멸시킬 수 있다.\n(4) 제3자의 인장도용이 인정된 경우\n날인의 진정은 사실상 추정으로 작성명의인 이외의 자에 의해 이\n루어진 것이 밝혀지면 깨지므로 문서제출자는 날인행위가 작성명\n의인으로부터 위임받은 정당한 권원에 의한 것이라는 사실을 입\n증해야 한다.\n4. 사안해결 2\n(1) 확인서는 사문서인바 제357조 및 2단의 추정이 적용된다. 인영의\n진정은 반증으로 복멸시킬 수 있고 날인의 진정은 인장도용을 본\n증으로 제출해 간접반증으로 복멸시킬 수 있다.\n(2) 乙이 인영의 진정을 부인하고 있으므로 甲은 인영의 진정을 인정\n받기 위한 증거를 제출하거나 乙의 의사로 날인사실을 증명한다.\n(3) 乙의 인장도용 주장을 반증으로 법관이 의심을 품게 하거나 그자\n가 乙로부터 정당한 권원을 위임받아 날인한 것임을 증명한다.", "categories": {"toc": "1. 문제의 소재 – 서증 의의 및 취지\n2. 문서의 진정성립 의의 및 판단\n3. 사문서인 계약서의 진정성립 추정 및 복멸 여부\n4. 사안해결", "purpose": "서증이란 문서에 표현된 의사를 증거자료로 하여 요증사실을 증명하는 증거조사이다.", "article": "제357조, 제358조", "elements": "", "theory": "", "cases": "(2단의 추정) 인영의 진정이 인정되면 날인의 진정이 사실상 추정되고, 날인의 진정이 인정되면 문서 전체의 진정성립이 제358조에 의해 유사적 추정된다고 하여 2단의 추정을 인정한다.\n(날인의 진정 복멸) 날인의 진정 추정은 사실상 추정이므로 날인의 진정을 다투는 자가 반증을 들어 날인의 진정에 관해 법관으로 하여금 의심을 품게할 사정을 입증시 추정 깨진다.\n(인장도용) 날인의 진정은 사실상 추정으로 작성명의인 이외의 자에 의해 이루어진 것이 밝혀지면 깨지므로 문서제출자는 날인행위가 작성명의인으로부터 위임받은 정당한 권원에 의한 것이라는 사실을 입증해야 한다.", "resolution": "확인서는 사문서인바 제357조 및 2단의 추정이 적용된다. 인영의 진정은 반증으로 복멸시킬 수 있고 날인의 진정은 인장도용을 본증으로 제출해 간접반증으로 복멸시킬 수 있다.\n乙이 인영의 진정을 부인하고 있으므로 甲은 인영의 진정을 인정받기 위한 증거를 제출하거나 乙의 의사로 날인사실을 증명한다.\n乙의 인장도용 주장을 반증으로 법관이 의심을 품게 하거나 그자가 乙로부터 정당한 권원을 위임받아 날인한 것임을 증명한다."}}, {"no": 2, "points": 10, "question": "A변호사가 위 대여금의 반환을 구하는 소장을 법원에 접수하기 전에 버\n이 사망하였고 그에게는 상속인이 있다. 그런데 의 사망사실을 모르는\nA변호사는 을 원고, 乙을 피고로 하여 대여금의 반환을 구하는 소장\n을 법원에 접수하였다. 이 소는 적법한지 여부에 대하여 설명하시오.", "answer": "1. 문제의 소재 1\n상속인이 있는 甲이 제소전 사망하고 그가 선임한 소송대리인 A\n가 소제기한 경우 취급 검토하여, 제소전 사망자가 원고임에도 그\n가 선임한 소송대리인의 소제기가 적법한지 논한다.\n2. 제소전 사망 취급 1.5\n(1) 당사자 확정\nⅰ)의사설, 표시설, 행동설 있으나 ⅱ)判例는 실질적 표시설에 따\n라 당사자로 표시된 사망자가 당사자로 확정됨이 원칙이나, 보정\n하는 경우 상속인을 당사자로 확정하여 표시정정 허용한다.\n(2) 법원의 조치\n대립당사자주의 취하는 민사소송에서 당사자능력은 소송요건이며,\n제소전 사망자가 당사자인 경우 소송요건을 갖추지 않은 것으로\n부적법하여 소각하된다.\n3. 소송대리인 선임 후 제소전 사망한 경우 소의 적부 4.5\n(1) [제95조] 당사자가 사망하더라도 소송대리인의 소송대리권은 소\n멸하지 않는다.\n(2) ⅰ)[제233조] 당사자가 사망시 소송절차는 중단되며 상속인 등이\n절차를 수계하여야 한다. ⅱ)[제238조] 다만, 당사자 사망시 소송\n대리인이 있으면 절차 중단되지 않는다.\n(3) 判例\n당사자가 소송대리인에게 소송위임하고 소제기 전 사망했는데 소\n송대리인이 당사자가 사망한 것을 모르고 그를 원고로 표시하여\n소를 제기하였다면 소제기는 적법하고 시효중단 등 소제기 효력\n은 상속인에게 귀속된다. 이 경우 제233조 1항이 유추적용되어\n사망자의 상속인은 소송절차를 수계한다.\n(4) 학설 ⅰ)判例와 같은 견해 있으나 ⅱ)반대견해는 제소전 사망시\n대리권이 소멸되어 소가 부적법하고 제95조, 제233조, 제238조는\n소송 중 사망한 경우에 적용되므로 제소전 사망은 표시정정으로\n처리해야 한다고 한다.\n(5) 검토 및 사안\nⅰ)생각건대 소송대리인 위임은 제소전에도 가능하고 제95조는\n본인 사망시에도 소송대리권 소멸을 부정하는바 판시 타당하다.\nⅱ)사안에서 甲이 A에게 소송위임하고 제소전 사망한 다음, A가\n甲의 사망을 모르고 그를 원고로 표시해도 소제기는 적법하다.\n4. 사안해결 0.5\n제소전 사망자 甲을 원고로 한 소송대리인 A의 소제기 적법하다.", "categories": {"toc": "1. 문제의 소재\n2. 제소전 사망 취급\n3. 소송대리인 선임 후 제소전 사망한 경우 소의 적부\n4. 사안해결", "purpose": "", "article": "제95조, 제233조, 제238조", "elements": "", "theory": "(당사자 확정) ⅰ)의사설, 표시설, 행동설이 있다.\n(제소전 사망과 소의 적부) ⅰ)判例와 같은 견해 있으나 ⅱ)반대견해는 제소전 사망시 대리권이 소멸되어 소가 부적법하고 제95조, 제233조, 제238조는 소송 중 사망한 경우에 적용되므로 제소전 사망은 표시정정으로 처리해야 한다고 한다.", "cases": "(당사자 확정) 判例는 실질적 표시설에 따라 당사자로 표시된 사망자가 당사자로 확정됨이 원칙이나, 보정하는 경우 상속인을 당사자로 확정하여 표시정정 허용한다.\n(소제기 적부) 당사자가 소송대리인에게 소송위임하고 소제기 전 사망했는데 소송대리인이 당사자가 사망한 것을 모르고 그를 원고로 표시하여 소를 제기하였다면 소제기는 적법하고 시효중단 등 소제기 효력은 상속인에게 귀속된다. 이 경우 제233조 1항이 유추적용되어 사망자의 상속인은 소송절차를 수계한다.", "resolution": "제소전 사망자 甲을 원고로 한 소송대리인 A의 소제기 적법하다."}}]}, {"subject": "민사소송법", "exam": "56회", "year": 2019, "problemNo": 3, "points": 30, "passage": "乙은 X건물의 소유자인 으로부터 동 건물을 임차한 후 점유 • 사용해 오고\n있다. 乙은 X건물의 임대기간이 만료되었음에도 동 건물을 인도하지 않으면\n서 자신의 점유가 정당한 권원에 기인한 것이라고 주장하고 있다. 이에 은\n乙을 상대로 소유권에 기초하여 건물인도청구의 소를 제기하였다. (다음 각)\n물음은 독립적임)", "subquestions": [{"no": 1, "points": 10, "question": "제1회 변론기일에 재판장은 乙에게 \"이 사건 X건물이 T의 소유임은 인\n정하느냐\"고 질문하였다. 이에 乙은 \"그렇다\"라고 답을 하였다. 그러나\n그 후의 변론기일에서 乙은 기존의 진술을 번복해서 X건물이 의 소유\n가 아니라고 진술하고자 한다. 이것이 아무런 제한 없이 가능한지 여부에\n대하여 설명하시오.", "answer": "1. 문제의 소재 0.5\n乙은 X건물이 甲의 소유라고 인정하여 자백이 성립했다고 볼 여\n지가 있는바 소유권을 인정하는 진술이 자백인지, 자백이라면 철\n회의 제한이 있는지 검토한다.\n2. 자백의 의의 및 효과 1\n(1) 자백이란 상대방 주장사실과 일치하고 자신에게 불리한 주요사실\n에 대한 진술이다.\n(2) 자백성립시 제288조 불요증사실이 되어 법원, 당사자 구속하고\n자백이 성립된 내용대로 사실인정한다.\n3. 소유권에 대한 자백 성립 여부 4.5\n(1) 문제점\n자백은 사실에 대해 성립한다. 소유권에 기한 건물인도청구에서\n선결적 법률관계에 자백이 성립하는지 문제된다.\n(2) 判例\nⅰ)소송물 전제가 되는 권리관계를 인정하는 진술은 권리자백으\n로 법원 기속하지 않고 상대방 동의 없이 자유로이 철회가능하다.\nⅱ)다만, 피고가 원고의 소유권을 인정한 진술은 그 소전제가 되\n는 소유권의 내용을 이루는 사실에 대한 진술로 볼 수 있어 재판\n상 자백이다.\n(3) 학설 ⅰ)긍정설은 소유권과 같은 선결적 법률관계가 중간확인의\n소의 소송물이 되었을 때 인낙이 가능한바 소유권에 대한 자백도\n허용된다고 한다. ⅱ)부정설은 권리자백은 법원의 전권인 법률판\n단에 관한 자백이므로 자백 효력이 없다고 한다.\n(4) 검토 및 사안\nⅰ)생각건대 요건사실에 대해선 자백 성립 가능하고 요건사실은\n법률효과 발생시키는 구체적 사실을 의미하므로 소유권 인정 진\n술은 권리 자체가 아닌 그를 이루는 구체적 사실에 대한 내용을\n인정한 것으로 볼 것이다. ⅱ)사안에서 乙이 X건물이 甲소유라고\n인정하면 소유권을 이루는 사실을 인정한 자백으로 볼 수 있다.\n4. 소유권을 인정한 자백 철회 가부 2\n(1) 자백 철회의 제한\n자백은 여효적 소송행위로 직접 소송상 효력이 발생해 절차안정,\n상대방 신뢰보호 위해 원칙적으로 철회 불가하다.\n(2) 예외\n다만, ⅰ)자백에 5호 재심사유 있을 때 ⅱ)자백취소에 상대방이\n동의한 때 ⅲ)자백이 진실에 반하고 착오에 기한 것일 때 ⅳ)소\n송대리인의 자백에 대해 경정권 행사할 때에는 철회 가능하다.\n(3) 사안\n乙의 X건물 소유권 이루는 사실에 대한 자백 성립했고 철회사유\n없는바 절차안정, 상대방 신뢰보호상 철회할 수 없다.\n5. 사안해결 0.5\n乙진술은 자백이며, 이후 甲이 X건물 소유권 없음 주장 불가하다.", "categories": {"toc": "1. 문제의 소재\n2. 자백의 의의 및 효과\n3. 소유권에 대한 자백 성립 여부\n4. 소유권을 인정한 자백 철회 가부\n5. 사안해결", "purpose": "자백이란 상대방 주장사실과 일치하고 자신에게 불리한 주요사실에 대한 진술이다.\n자백성립시 제288조 불요증사실이 되어 법원, 당사자 구속하고 자백이 성립된 내용대로 사실인정한다.", "article": "제288조", "elements": "(자백 철회 예외) ⅰ)자백에 5호 재심사유 있을 때 ⅱ)자백취소에 상대방이 동의한 때 ⅲ)자백이 진실에 반하고 착오에 기한 것일 때 ⅳ)소송대리인의 자백에 대해 경정권 행사할 때에는 철회 가능하다.", "theory": "ⅰ)긍정설은 소유권과 같은 선결적 법률관계가 중간확인의 소의 소송물이 되었을 때 인낙이 가능한바 소유권에 대한 자백도 허용된다고 한다. ⅱ)부정설은 권리자백은 법원의 전권인 법률판단에 관한 자백이므로 자백 효력이 없다고 한다.", "cases": "ⅰ)소송물 전제가 되는 권리관계를 인정하는 진술은 권리자백으로 법원 기속하지 않고 상대방 동의 없이 자유로이 철회가능하다.\nⅱ)다만, 피고가 원고의 소유권을 인정한 진술은 그 소전제가 되는 소유권의 내용을 이루는 사실에 대한 진술로 볼 수 있어 재판상 자백이다.", "resolution": "乙진술은 자백이며, 이후 甲이 X건물 소유권 없음 주장 불가하다."}}, {"no": 2, "points": 10, "question": "이 사건에 대하여 변론준비절차가 진행되던 중 변론준비기일이 열렸으나\n\"과 Z 모두 출석하지 않았다. 그 후 재판장은 준비절차를 종결하고 제1\n회 변론기일을 지정하였다. 제1회 변론기일에 은 출석하지 않았고 乙만\n출석하였으나 乙은 변론을 하지 않았다. 이로써 변론기일에 양쪽 당사자\n가 2회 출석하지 아니한 경우에 해당하는지 여부에 대하여 설명하시오.", "answer": "1. 문제의 소재 0.5\n쌍방불출석 취하간주의 횟수 산입과 관련하여 예비적 절차인 변\n론준비절차의 불출석과 변론기일 불출석 횟수를 합산하여 계산하\n는지 여부를 검토한다.\n2. 쌍방불출석취하간주 2\n(1) 의의 및 취지 [제268조]\n적법한 기일통지를 받고도 양쪽 당사자가 변론기일에 불출석하거\n나 무변론인 경우, 2회 내지 3회 불출석일 경우, 취하간주 처리된\n다. 소송의사 없는 소송의 조기종료 위함이다.\n(2) 요건\nⅰ)양측의 1회 불출석 또는 무변론일 것 ⅱ)이후 새 변론기일에\n서 양측의 불출석 또는 무변론일 것 ⅲ)당사자가 1월 이내에 기\n일지정신청을 하지 않거나 이후 변론기일에서 3회 불출석 또는\n무변론인 경우이어야 한다.\n(3) 효과\n소취하, 상소심에서는 상소취하 간주로 처리한다.\n3. 변론준비기일 불출석 효과가 변론기일에 승계되는지 여부 4\n(1) 변론준비절차 의의 및 취지 [제286조]\n변론의 효율적 진행을 위해 변론기일 전에 사실, 증거를 정리하는\n사전적, 예비적 절차이다.\n(2) 학설 ⅰ)제286조에서 제268조를 준용하고 있으므로 변론준비기\n일 실효성을 위해 승계된다는 견해 ⅱ)변론기일과 변론준비기일\n은 운영주체와 방식이 달라 승계 부정하는 견해 있다.\n(3) 判例\n변론준비기일은 재판장에 의해 비공개로 진행되어 직접주의, 공개\n주의가 후퇴할 수 있고 취하간주제도는 적극적 당사자에게 불리\n한 제도인바 불출석 효과는 변론기일에 승계되지 않는다.\n(4) 검토 및 사안\nⅰ)생각건대 소취하간주 규정은 헌법상 재판받을 권리 침해우려\n없어 명문규정 없이 확대 적용할 수 없다. ⅱ)사안에서 甲, 乙은\n변론준비절차에서 모두 불출석 했으나 이는 변론기일로 승계되지\n않고 쌍방불출석 취하간주 횟수 산입에 포함되지 않는다.\n4. 사안해결 0.5\n변론준비절차에서 불출석은 변론기일에 승계되지 않는바 이후 변\n론기일 불출석, 무변론이어도 2회 불출석으로 취급되지 않는다.", "categories": {"toc": "1. 문제의 소재\n2. 쌍방불출석취하간주\n3. 변론준비기일 불출석 효과가 변론기일에 승계되는지 여부\n4. 사안해결", "purpose": "(쌍방불출석취하간주) 적법한 기일통지를 받고도 양쪽 당사자가 변론기일에 불출석하거나 무변론인 경우, 2회 내지 3회 불출석일 경우, 취하간주 처리된다. 소송의사 없는 소송의 조기종료 위함이다.\n(변론준비절차) 변론의 효율적 진행을 위해 변론기일 전에 사실, 증거를 정리하는 사전적, 예비적 절차이다.", "article": "제268조, 제286조", "elements": "ⅰ)양측의 1회 불출석 또는 무변론일 것 ⅱ)이후 새 변론기일에서 양측의 불출석 또는 무변론일 것 ⅲ)당사자가 1월 이내에 기일지정신청을 하지 않거나 이후 변론기일에서 3회 불출석 또는 무변론인 경우이어야 한다.", "theory": "ⅰ)제286조에서 제268조를 준용하고 있으므로 변론준비기일 실효성을 위해 승계된다는 견해 ⅱ)변론기일과 변론준비기일은 운영주체와 방식이 달라 승계 부정하는 견해 있다.", "cases": "변론준비기일은 재판장에 의해 비공개로 진행되어 직접주의, 공개주의가 후퇴할 수 있고 취하간주제도는 적극적 당사자에게 불리한 제도인바 불출석 효과는 변론기일에 승계되지 않는다.", "resolution": "변론준비절차에서 불출석은 변론기일에 승계되지 않는바 이후 변론기일 불출석, 무변론이어도 2회 불출석으로 취급되지 않는다."}}, {"no": 3, "points": 10, "question": "제1회 및 제2회 변론기일에 \"은 모두 출석하지 않았고, 반면에 乙은 모\n두 출석하였으나 변론을 하지 않았다. 이 때 재판장은 당사자의 기일지정\n신청을 기다리지 않고 제3회 변론기일을 지정하거나 혹은 변론을 종결하\n고 판결을 선고할 수 있는지 여부에 대하여 설명하시오.", "answer": "1. 문제의 소재 0.5\n甲과 乙이 2회 불출석 또는 무변론인바 쌍방불출석 취하간주 제\n도와 관련하여 법원이 직권으로 기일을 지정할 것인지, 변론을 종\n결하고 판결을 선고할 수 있는지 검토한다.\n2. 쌍방불출석 취하간주의 요건 2.5\n(1) 양측의 1회 불출석 또는 무변론일 것\n이 경우 법원은 양쪽 당사자에게 다시 기일통지를 한다.\n(2) 양쪽 당사자의 2회 결석 또는 출석했더라도 무변론일 것\n법원은 변론을 종결하거나 신기일을 정하지 않고 당해 기일을 종\n료시킬 수 있다.\n(3) 당사자가 1월 이내에 기일지정신청을 하지 않거나 이후 변론기일\n에서 3회 불출석 또는 무변론일 것\n1월의 기간은 불변기간이 아니어서 기일지정신청의 추후보완은\n불가하며, 제268조에 의해 소 또는 상소를 취하간주처리 한다.\n3. 2회 불출석 또는 무변론 후 직권으로 기일지정 가부 및 취급 2\n(1) 의의 [제165조 1항]\n기일은 직권 또는 당사자의 신청에 따라 재판장이 지정한다.\n(2) 효과\nⅰ)법원의 직권 기일 지정은 당사자의 기일지정신청에 의한 기일\n지정과 마찬가지의 효과를 갖는다. ⅱ)이후 직권으로 지정된 기일\n에 불출석 또는 무변론시 소취하간주될 수 있다.\n(3) 사안\n재판장은 직권으로 제3회 변론기일 지정가능하며 甲, 乙이 재차\n불출석 또는 무변론시 소취하간주 될 수 있다.\n4. 2회 불출석 또는 무변론 후 변론종결하고 판결 선고 가부 2\n(1) 1회 불출석 또는 무변론인 경우\nⅰ)소송촉진을 위해 반대견해 있으나 ⅱ)명문의 규정에서 당사자\n에게 기일통지를 한다고 규정한바 변론종결하고 판결할 수 없다.\n(2) 2회 불출석 또는 무변론인 경우\nⅰ)절차권 보장 위해 반대견해 있으나 ⅱ)명문의 규정에서 기일\n통지를 한다는 규정이 없어 변론종결 후 소송기록에 의해 판결할\n수 있다.\n(3) 사안\n甲, 乙이 2회 불출석 또는 무변론인바 법원은 변론종결 후 소송기\n록에 의해 판결을 선고할 수 있다.\n5. 사안해결 0.5\n법원은 직권으로 기일지정하거나 변론종결 후 판결할 수 있다.", "categories": {"toc": "1. 문제의 소재\n2. 쌍방불출석 취하간주의 요건\n3. 2회 불출석 또는 무변론 후 직권으로 기일지정 가부 및 취급\n4. 2회 불출석 또는 무변론 후 변론종결하고 판결 선고 가부\n5. 사안해결", "purpose": "(직권 기일 지정) 기일은 직권 또는 당사자의 신청에 따라 재판장이 지정한다.", "article": "제165조 1항, 제268조", "elements": "(1) 양측의 1회 불출석 또는 무변론일 것\n(2) 양쪽 당사자의 2회 결석 또는 출석했더라도 무변론일 것\n(3) 당사자가 1월 이내에 기일지정신청을 하지 않거나 이후 변론기일에서 3회 불출석 또는 무변론일 것 — 1월의 기간은 불변기간이 아니어서 기일지정신청의 추후보완은 불가하며, 제268조에 의해 소 또는 상소를 취하간주처리 한다.", "theory": "(1회 불출석 시 변론종결 가부) ⅰ)소송촉진을 위해 반대견해 있으나 ⅱ)명문의 규정에서 당사자에게 기일통지를 한다고 규정한바 변론종결하고 판결할 수 없다.\n(2회 불출석 시) ⅰ)절차권 보장 위해 반대견해 있으나 ⅱ)명문의 규정에서 기일통지를 한다는 규정이 없어 변론종결 후 소송기록에 의해 판결할 수 있다.", "cases": "", "resolution": "법원은 직권으로 기일지정하거나 변론종결 후 판결할 수 있다."}}]}, {"subject": "민사소송법", "exam": "56회", "year": 2019, "problemNo": 4, "points": 20, "passage": "\"은 乙에게 건설현장용 발전기를 매도하였는데 그 대금 1억원을 지급받지\n못하여 乙을 상대로 1억원의 물품대금지급청구의 소를 제기하였다. 乙은 변\n론에서 위 발전기 대금을 모두 변제하였다고 주장하면서, 만약 변제하지 않\n았더라도 위 발전기의 하자로 인한 6,000만원 상당의 손해가 발생하였는데\n이 손해배상채권으로 의 소구채권과 대등액으로 상계한다고 진술하였다.", "subquestions": [{"no": 1, "points": 10, "question": "제1심 법원은 심리결과 乙의 변제항변은 이유가 없으나, 상계항변은 이유\n가 있다고 판단하여 乙은 에게 4,000만원을 지급하라는 판결을 선고하\n였다. 乙이 제1심 판결에 대하여 전부불복하여 항소한다면 그 항소의 대\n상이 될 수 있는 최대 금액은 얼마인지 설명하시오.", "answer": "1. 문제의 소재 0.5\n1심에서 乙의 상계항변 받아들여 일부인용판결 선고된 바, 乙이\n항소의 대상으로 삼을 수 있는 범위에 대해 상계항변과 관련된\n상소이익 판단기준을 통해 검토한다.\n2. 상소이익의 의의 및 판단기준 3.5\n(1) 의의 및 취지\n하급심 판결의 취소변경을 구할 수 있는 이익이다. 남상소 방지를\n위한 상소요건으로 흠결시 항소각하한다.\n(2) 판단기준\n1)학설 ⅰ)형식적불복설은 신청보다 판결 주문이 불리한 경우 상소\n이익 인정해 전부승소시 상소할 수 없다고 한다. ⅱ)실질적불복설\n은 전부승소한 자라도 실체법상 더 유리한 판결 받을 수 있다면\n상소이익 긍정한다. ⅲ)절충설 ⅳ)신실질적 불복설도 있다.\n2)判例 [불불주형]\n상소인은 자기에게 불이익한 재판에 대해서 상소할 수 있고, 불이\n익함은 주문을 표준으로 결정된다 하여 형식적 불복설 입장이다.\n3)검토 및 사안\nⅰ)실질적불복설은 상소 허용범위가 너무 넓고, 절충설은 당사자\n평등에 반하므로, 형식적불복설이 타당하다. ⅱ)사안에서 ①乙은\n주문상 패소한 4000만 원 부분에 대해 항소이익이 있어 항소할\n수 있다. ②乙의 상계로 주문상 승소했다고 볼 수 있는 일부기각\n된 6000만 원 부분에 대해서도 乙이 항소할 수 있는지 문제된다.\n3. 상계주장이 받아들여진 부분에 대한 피고의 상소이익 3\n(1) [제216조 2항] 판결이유 중 상계항변에 대한 판단에 기판력 발생\n한다. 채권이중행사 방지 및 판결무용화 방지 위함이다.\n(2) 判例\n원고의 청구원인 모두 인정 후 피고의 상계항변 받아들여 상계\n후 잔존하는 원고의 나머지 청구 부분만 일부인용한 경우 피고는\n판결이유 중 원고 소구채권을 인정하는 전제에서 상계항변이 받\n아들여진 부분에 관하여도 상소할 수 있다.\n(3) 사안\n甲의 1억 원 물품대금청구가 인정된다는 전제 하에 乙의 6000만\n원 손해배상채권에 기한 상계 받아들여 4000만 원 일부인용한 판\n결에 대해 乙의 상계가 받아들여진 6000만 원 부분에 대해서 항\n소할 수 있다.\n4. 사안해결 0.5\n乙은 청구 전부에 대해 항소할 수 있어 항소의 대상이 될 수 있\n는 최대 금액은 1억 원이다.", "categories": {"toc": "1. 문제의 소재\n2. 상소이익의 의의 및 판단기준\n3. 상계주장이 받아들여진 부분에 대한 피고의 상소이익\n4. 사안해결", "purpose": "하급심 판결의 취소변경을 구할 수 있는 이익이다. 남상소 방지를 위한 상소요건으로 흠결시 항소각하한다.\n[제216조 2항] 판결이유 중 상계항변에 대한 판단에 기판력 발생한다. 채권이중행사 방지 및 판결무용화 방지 위함이다.", "article": "제216조 2항", "elements": "", "theory": "(상소이익 판단기준) ⅰ)형식적불복설은 신청보다 판결 주문이 불리한 경우 상소이익 인정해 전부승소시 상소할 수 없다고 한다. ⅱ)실질적불복설은 전부승소한 자라도 실체법상 더 유리한 판결 받을 수 있다면 상소이익 긍정한다. ⅲ)절충설 ⅳ)신실질적 불복설도 있다.", "cases": "(상소이익) 상소인은 자기에게 불이익한 재판에 대해서 상소할 수 있고, 불이익함은 주문을 표준으로 결정된다 하여 형식적 불복설 입장이다.\n(상계 부분 상소이익) 원고의 청구원인 모두 인정 후 피고의 상계항변 받아들여 상계 후 잔존하는 원고의 나머지 청구 부분만 일부인용한 경우 피고는 판결이유 중 원고 소구채권을 인정하는 전제에서 상계항변이 받아들여진 부분에 관하여도 상소할 수 있다.", "resolution": "乙은 청구 전부에 대해 항소할 수 있어 항소의 대상이 될 수 있는 최대 금액은 1억 원이다."}}, {"no": 2, "points": 10, "question": "乙의 위 상계주장에 대하여 은 乙에게 대여한 별개의 5,000만원의 대여\n금채권으로 乙의 위 손해배상채권과 대등액에서 상계한다고 진술하였다.\n당사자들이 주장하는 모든 채권이 인정되는 경우 법원이 인용할 수 있는\n금액은 얼마인지 설명하시오.", "answer": "1. 문제의 소재 0.5\n乙의 상계항변에 대해 甲이 乙을 상대로 5000만 원의 상계재항변\n을 한바 상계 재항변이 가능한지 검토하여 법원이 최종적으로 인\n용할 금액을 판단한다.\n2. 소송상 상계항변의 법적 성질 1\n判例는 상계항변은 소송상 방어방법으로 수동채권의 존 해 법원이 증명 촉구 석명을 해야 하는지 검토한다.\n2. 소송대리인 戊에 대한 추인 인정 여부 3.5\n(1) 무권대리행위 소송상 취급\n무권대리행위는 소송행위 유효요건으로 추인되지 않는 한 무효이\n며, 소송요건으로 직권조사사항에 해당한다.\n(2) 무권대리행위에 대한 추인\n1)추인 의의 및 취지\n유동적 무효인 소송행위를 소급하여 유효하게 만드는 행위다.\n2)추인 요건\nⅰ)소송행위인바 소송능력, 대리권 요한다. ⅱ)명시적으로도 가능\n하나 判例는 2심에서 아무런 이의 없이 무권대리에 기초한 1심\n소송결과 진술한 경우 묵시적 추인된 것이라고 본다. ⅲ)시기제한\n없고 상소심에서도 가능하다. ⅳ)소송행위 전부 추인해야 한다.\n(3) 사안\nⅰ)무권대표자 丙이 선임한 소송대리인 戊의 행위는 무권대리행\n위가 되며 그의 소송행위는 추인되지 않는 한 유동적 무효이다.\nⅱ)적법한 대표자 丁이 戊와 출석해 계약유효, 시효완성만 주장하\n고 무권대리 이의하지 않아 항소심에서도 묵시적 추인 가능하다.\n3. 소멸시효 주장에 대한 증명촉구 석명 요부 3.5\n(1) 석명권 의의 및 취지 [제136조 1항]\n소송관계 분명하게 하기 위해 당사자에게 질문하고 증명을 촉구\n하는 법원의 권능이다. 변론주의 보완을 위해 인정한다.\n(2) 석명의무의 범위\n1)①석명권의 범위와 석명의무 범위는 일치하여 석명권 불행사시\n상고이유로 보는 견해 ②석명권은 권능이지 의무가 아니므로 상\n고이유 아니라는 견해 있 ③절충설이 있다.\n2)생각건대 상고심의 과도한 사실인정 간섭 방지, 변론주의 보완 위\n해 석명권 해태로 심리가 현저히 조잡해지면 상고이유가 된다.\n(3) 증명촉구의 석명\n1)다툼 있는 사실에 증명책임 있는 자가 부주의, 오해로 증거를 대\n지 못한 경우 법원은 증명촉구 의무를 진다.\n2)判例는 원고가 시효중단을 주장했다면 마땅히 석명권 행사하여\n원고에게 증명을 촉구했어야 한다고 한다.\n(4) 사안\n피고는 18.4.15.자로 시효완성 주장하며 별다른 근거 제시하지 않\n았고 이는 피고가 증명책임 지는바 법원은 증명촉구의 석명한다.\n4. 사안해결 0.5\n戊의 소송수행은 추인으로 적법하며 법원은 증명촉구의 석명한다.", "categories": {"toc": "1. 문제의 소재\n2. 소송대리인 戊에 대한 추인 인정 여부\n3. 소멸시효 주장에 대한 증명촉구 석명 요부\n4. 사안해결", "purpose": "(석명권 의의) 소송관계 분명하게 하기 위해 당사자에게 질문하고 증명을 촉구하는 법원의 권능이다. 변론주의 보완을 위해 인정한다.\n(추인 의의 및 취지) 유동적 무효인 소송행위를 소급하여 유효하게 만드는 행위다.", "article": "제136조 1항", "elements": "(추인 요건) ⅰ)소송행위인바 소송능력, 대리권 요한다. ⅱ)명시적으로도 가능하나 判例는 2심에서 아무런 이의 없이 무권대리에 기초한 1심 소송결과 진술한 경우 묵시적 추인된 것이라고 본다. ⅲ)시기제한 없고 상소심에서도 가능하다. ⅳ)소송행위 전부 추인해야 한다.", "theory": "(석명의무 범위) ①석명권의 범위와 석명의무 범위는 일치하여 석명권 불행사시 상고이유로 보는 견해 ②석명권은 권능이지 의무가 아니므로 상고이유 아니라는 견해 ③절충설이 있다. 생각건대 상고심의 과도한 사실인정 간섭 방지, 변론주의 보완 위해 석명권 해태로 심리가 현저히 조잡해지면 상고이유가 된다.", "cases": "(추인) 2심에서 아무런 이의 없이 무권대리에 기초한 1심 소송결과 진술한 경우 묵시적 추인된 것이라고 본다.\n(증명촉구 석명) 원고가 시효중단을 주장했다면 마땅히 석명권 행사하여 원고에게 증명을 촉구했어야 한다.", "resolution": "戊의 소송수행은 추인으로 적법하며 법원은 증명촉구의 석명한다."}}, {"no": 3, "points": 15, "question": "최종변론기일에 I는 조각상 A의 대금채권에 관한 소멸시효 산정의\n기산일은 2015. 4. 1.이 맞지만 조각상 B에 대한 계약서상 보수 지급일인\n8. 1.은 6. 1.을 잘못 기재한 것이므로, 조각상 B에 대한 대금채권의 소멸시효\n기산일은 2015. 6. 1.이라고 주장하였다. 법원은 이 주장에 구속되어야\n하는지 판단하고, 법원이 어떤 판결을 내려야 할지 논하시오.", "answer": "1. 문제의 소재 0.5\n피고는 본래와 다른 소멸시효 기산점인 15.6.1.을 주장하고 있는\n바 변론주의 원칙상 법원이 이에 구속되어 판단해야 하는지, 위법\n한 1심 소각하판결 취소시 1심으로 사건 환송해야 하는지 논한다.\n2. 변론주의 의의 및 내용 0.5\nⅰ)사실, 증거의 수집, 제출책임을 당사자에 맡기고 법원은 당사\n자가 제출한 소송자료만을 재판의 기초로 한다는 원칙이다.\nⅱ)주요사실주장책임, 자백의 구속력, 증거제출책임으로 구성된다.\n3. 주요사실 주장책임 1\n자신에게 유리한 주요사실 주장하지 않으면 그 사실은 없는 것으\n로 취급되어 받는 불이익 의미한다. 법원은 당사자가 주장하지 않\n은 사실에 기초하여 판결할 수 없다.\n4. 주요사실 판단 2\n(1) 학설 및 判例\nⅰ)기준재구성설 있으나 ⅱ)통설, 判例인 법규기준설은 주요사실\n이란 법률효과 발생시키는 실체법상 구성요건 해당사실이라 한다.\n(2) 검토 및 사안\nⅰ)생각건대 명확한 기준 제시하는 법규기준설 타당하며 ⅱ)사안\n에서 소멸시효 항변의 소멸시효 기산점이 주요사실인지 문제된다.\n5. 소멸시효 항변에서 기산점이 주요사실인지 여부 3.5\n(1) 判例\nⅰ)소멸시효 기산점은 채무소멸이라는 법률효과 발생의 요건에\n해당하는 소멸시효 기간계산의 시발점으로서 소멸시효 항변의 법\n률요건 구성하는 구체적 사실에 해당하여 변론주의 적용대상이다.\nⅱ)본래 소멸시효 기산점과 당사자 주장 기산점이 다르면 변론주\n의 원칙상 법원은 당사자 주장 기산점 기준으로 판단해야 한다.\n(2) 학설 ⅰ)주요사실설은 소멸시효 기산점은 민법 제166조에 규정된\n바 법규의 직접 요건사실로 주요사실이라고 한다. ⅱ)간접사실설\n은 기산점을 당사자 주장으로 판단하면 상대방에게 불이익이 가\n해질 수 있어 간접사실이라고 한다.\n(3) 검토 및 사안\nⅰ)생각건대 민법상 규정되어 있는 소멸시효 기산점은 주요사실\n이다. ⅱ)사안에서 소멸시효 기산점을 15.6.1.로 주장하는 것은\n소멸시효 기간계산 시발점으로 소멸시효 항변의 법률요건 구성하\n는 구체적 사실로 주요사실이며, 법원은 실제 기산점인 15.8.1.과\n다르더라도 이에 기초하여 판단하되, 최종적으로 증거로 나타난\n15.8.1.과 달라 주장대로 기산점을 인정할 순 없을 것이다.\n6. 법원의 판결 3.5\n(1) 1심판결의 위법성\nⅰ)대표권 흠결로 소각하시 보정명령 또는 의견진술기회 부여했\n어야 한다. ⅱ)설령 그런 조치를 취했다고 하더라도 무권대리행위\n는 추인은 소급효가 있는바 무권대리행위는 소급 유효해진다. ⅲ)\n따라서 1심 소각하판결 위법한바 항소심은 이를 취소한다.\n(2) 항소심 판결 – 1심 소각하판결 취소하는 경우\n1)제418조 본문 및 단서\nⅰ)소각하 1심판결을 취소하는 경우 항소심은 사건을 1심에 환송\n해야 한다. ⅱ)다만, 1심에서 본안판결 가능할 정도로 심리되거나\n당사자 동의가 있으면 본안판결 가능하다.\n2)사안\n1심 첫기일에서 도급계약 성부만 다투어졌을 뿐 소멸시효 심리되\n지 않아 본안판결할 정도로 심리되지 않았고 당사자 동의도 없어\n1심 소각하판결 취소시 제418조 본문에 따라 1심으로 환송한다.\n7. 사안해결 0.5\n법원은 소멸시효 기산점 주장에 기초해 판단하되 증거가 없어 인\n정할 수 없고 위법한 1심 소각하판결 취소하여 1심으로 환송한다.\n위 설문(3)의 “항소심의 본안판결”에 대한 내용을 답안으로 적지 않은 이유는 다음과 같음.\n1. “항소심의 본안판결”에 대한 내용을 배점 15점 배점 안에 적을 수 없음. 항소심의 본안판결에 대한\n내용을 적으면 논점은 아래와 같은데 이를 모두 적으면 변론주의와 소멸시효 기산점 논의를 포함한 모든\n논점을 매우 압축기재해도 최소 20점 정도가 나옴.[논점 추가기재를 원한다면 아래 논점 참조]\n1)본안판결 위해서는 주요사실인 도급계약 및 소멸시효완성 모두 각각 판단해야 함.\n2)도급계약 – 자백 의의취지 및 효과\n3)소멸시효 – 제265조(또는 민법 제168조), 민법 제174조, 두번의 최고 중 소제기로부터 6개월 내인\n두번째 최고까지만 시효중단 소급효 인정됨(민법判例), A채권 시효완성됨(청구기각), B채권 시효중단됨\n(청구인용) + A채권에 대해서는 1심 소각하 원고만 불복시 청구기각 가부(학판검)\n2. “항소심 본안판결”에 대한 내용은 어차피 항소심이 1심 환송판결하는데 굳이 언급하는 것은 부자연스\n러움. 만약, “항소심 본안판결”에 대한 내용을 언급한다고 하더라도 본안판결 내리기 위해 필요한 위 논\n점들을 모두 기재한 다음 1심환송을 적어야 하고 일부만 기재하다가 1심환송으로 결론내리는 것은 논리\n흐름상 부자연스러움.\n다만, 위 “항소심 본안판결”에 대한 내용을 전부는 아니더라도 일부만 어느정도 기재했더라도 논리가 어\n긋나지만 않았으면 모두 후하게 점수를 받았음. 답안 전개가 여러 방향으로 가능한 점, 배점에 문제 생길\n수 있는 점, 기타 논란의 소지가 있던 문제인 점에 비추어 관대한 채점이 이루어짐.\n[출제과정에서 검토위원 요청으로 난이도를 하향 조정한 문제로, 최초 만들어진 문제에서 난이도를 낮추\n어 수정하다보니 답안 전개 방향이 다양하게 갈릴 수 있는 문제가 된 것으로 보여짐.]", "categories": {"toc": "1. 문제의 소재\n2. 변론주의 의의 및 내용\n3. 주요사실 주장책임\n4. 주요사실 판단\n5. 소멸시효 항변에서 기산점이 주요사실인지 여부\n6. 법원의 판결\n7. 사안해결", "purpose": "변론주의: 사실, 증거의 수집, 제출책임을 당사자에 맡기고 법원은 당사자가 제출한 소송자료만을 재판의 기초로 한다는 원칙이다. 주요사실주장책임, 자백의 구속력, 증거제출책임으로 구성된다.", "article": "민법 제166조, 제418조", "elements": "(장래이행의 소 등 — 본 답안에는 명시적 요건 섹션 없음)", "theory": "(주요사실 판단) ⅰ)기준재구성설 있으나 ⅱ)통설, 判例인 법규기준설은 주요사실이란 법률효과 발생시키는 실체법상 구성요건 해당사실이라 한다.\n(소멸시효 기산점) ⅰ)주요사실설은 소멸시효 기산점은 민법 제166조에 규정된바 법규의 직접 요건사실로 주요사실이라고 한다. ⅱ)간접사실설은 기산점을 당사자 주장으로 판단하면 상대방에게 불이익이 가해질 수 있어 간접사실이라고 한다.", "cases": "ⅰ)소멸시효 기산점은 채무소멸이라는 법률효과 발생의 요건에 해당하는 소멸시효 기간계산의 시발점으로서 소멸시효 항변의 법률요건 구성하는 구체적 사실에 해당하여 변론주의 적용대상이다.\nⅱ)본래 소멸시효 기산점과 당사자 주장 기산점이 다르면 변론주의 원칙상 법원은 당사자 주장 기산점 기준으로 판단해야 한다.", "resolution": "법원은 소멸시효 기산점 주장에 기초해 판단하되 증거가 없어 인정할 수 없고 위법한 1심 소각하판결 취소하여 1심으로 환송한다."}}]}, {"subject": "민사소송법", "exam": "57회", "year": 2020, "problemNo": 2, "points": 20, "passage": "A상점 앞에 광고용으로 세워놓은 입간판이 부실한 설치로 말미암아 갑자기\n쓰러지는 사고가 발생하였다. 마침 출근하던 구청 직원 \"은 쓰러지는 입간판에\n부딪혀 손가락이 부러지는 상해와 함께 팔과 몸에 타박상을 입었다. A상점의\n주인인 乙은 과실을 인정하고 손해를 배상하겠다고 했으나 금액이 합의되지\n않아, 띠이 2,000만원의 손해배상을 청구하는 소를 제기하기에 이르렀다. 1은\n동네 개인병원의 병원장 IS의 명의로 된 진단서를 증거로 제출하였다. 진단서\n에는 1주일간의 입원을 요하며 후유장애 발생 가능성이 70% 정도 된다고\n적혀 있었고, \"은 이를 근거로 치료비 1,500만원을 청구하였다. 그리고 구청\n인사과에서 발급한 1주일간의 병가 확인서도 제출하였다. 그러면서 1주일간의\n병가에 따른 휴가 및 급여의 손실이 500만원이라 주장하였다. 이에 乙은\n진단서에 대해 서이 작성한 것이라 볼 수 없으며 병가 확인서도 구청 인사과\n에서 발급한 것 같지 않다고 맞섰다.", "subquestions": [{"no": 1, "points": 10, "question": "문서에 대하여 乙이 하는 주장의 성격을 설명하고, 그에 따른 증명의\n문제를 설명하시오.", "answer": "1. 문제의 소재 0.5\n乙이 진단서의 丙작성을 다투고 확인서의 구청발급을 다투는바\n서증에서 乙주장 성격 및 문서의 진정성립을 추정·복멸 논한다.\n2. 문서의 진정성립 의의 0.5\n문서가 문서신청자에 의해 작성자로 주장되는 자 의사에 기해 작\n성된 것 말한다. 진정성립 인정된 문서는 형식적 증거력이 있다.\n3. 문서의 진정성립 판단 및 증거항변 1\n(1) 인정, 침묵, 부인, 부지의 인부절차 및 변론전취지에 따라 자유심\n증으로 판단한다.\n(2) 증거항변\n상대방이 신청한 증거의 증거능력 또는 증거력 다투는 주장이다.\n4. 사문서의 추정 및 복멸 – 진단서 2.5\n(1) 추정 – 2단의 추정\n1)[제357조] 제출자는 사문서가 진정한 것임을 증명해야 한다.\n2)判例는 인영의 진정이 인정되면 날인의 진정이 사실상 추정되고,\n날인의 진정이 인정되면 문서 전체의 진정성립이 제358조에 의해\n유사적 추정된다고 하여 2단의 추정을 인정한다.\n(2) 복멸\n1)인영의 진정은 법관이 의심 품게하는 반증으로 복멸시킬 수 있다.\n2)判例는 날인의 진정 및 문서 진정성립 추정은 사실상 추정이므로\n다투는 자가 반증으로 문서 진정성립에 의심을 품게 하는 사정\n입증시 추정 깨진다고 한다.\n5. 공문서의 추정 및 복멸 – 확인서 1.5\n(1) 추정 [제356조]\n공무원이 직무상 작성한 문서는 진정성립이 유사적 추정된다.\n(2) 복멸\n공문서 진정성립 유사적 추정은 사실상 추정의 명문화이므로 반\n증으로 진정성립에 의심을 품게 하는 사정 입증시 깨진다.\n6. 사안해결 3\n(1) 乙주장 성격 – 부인 및 증거항변\n乙은 진단서, 확인서의 진정성립을 부인하여 형식적 증거력 다투\n는바 소송상 항변으로 증거항변에 해당한다.\n(2) 진단서\nⅰ)진단서는 개인병원장 丙이 작성한 사문서다. ⅱ)甲은 진정성립\n증명해야 하지만 2단의 추정을 활용할 수 있다. ⅲ)乙은 인영의\n진정, 날인의 진정, 문서 진정성립을 반증으로 복멸시킬 수 있다.\n(3) 확인서\nⅰ)확인서는 구청이 발급해 공문서다. ⅱ)확인서는 진정성립이 유\n사적 추정된다. ⅲ)乙은 공문서 진정성립을 반증으로 복멸시킨다.", "categories": {"toc": "1. 문제의 소재\n2. 문서의 진정성립 의의\n3. 문서의 진정성립 판단 및 증거항변\n4. 사문서의 추정 및 복멸 – 진단서\n5. 공문서의 추정 및 복멸 – 확인서\n6. 사안해결", "purpose": "문서의 진정성립이란 문서가 문서신청자에 의해 작성자로 주장되는 자 의사에 기해 작성된 것 말한다. 진정성립 인정된 문서는 형식적 증거력이 있다.", "article": "제356조, 제357조, 제358조", "elements": "", "theory": "", "cases": "(2단의 추정) 인영의 진정이 인정되면 날인의 진정이 사실상 추정되고, 날인의 진정이 인정되면 문서 전체의 진정성립이 제358조에 의해 유사적 추정된다.\n(공문서 진정성립 복멸) 날인의 진정 및 문서 진정성립 추정은 사실상 추정이므로 다투는 자가 반증으로 문서 진정성립에 의심을 품게 하는 사정 입증시 추정 깨진다.", "resolution": "(乙주장 성격) 乙은 진단서, 확인서의 진정성립을 부인하여 형식적 증거력 다투는바 소송상 항변으로 증거항변에 해당한다.\n(진단서) 사문서, 2단의 추정 활용 가능. 乙은 인영·날인·진정성립을 반증으로 복멸 가능.\n(확인서) 공문서, 진정성립이 유사적 추정. 乙은 공문서 진정성립을 반증으로 복멸시킨다."}}, {"no": 2, "points": 10, "question": "진단서를 N이 작성하였다는 것과 확인서를 구청 인사과에서 발급하였다는\n것이 사실로 확인되었다면 법원은 손해배상액을 2,000만원으로 인정해야\n하는 것인지 논하시오.", "answer": "1. 문제의 소재 0.5\n진단서와 확인서 모두 형식적 증거력이 인정되는바 문서의 종류\n에 따른 실질적 증거력 판단 방법 검토하여 각 문서에 기초하여\n손해배상액을 인용할 수 있는지 논한다.\n2. 실질적 증거력 의의 1\n어떤 문서가 요증사실을 증명하기에 얼마나 유용한가의 증거가치\n를 말한다. 문서가 실질적 증거력이 있으면 그 내용을 진신한 것\n으로 인정하여 사실판단 할 수 있다.\n3. 실질적 증거력 판단 1\n(1) 인부절차 없이 법관의 자유심증으로 판단한다.\n(2) [제202조] 법원은 변론 전취지와 증거조사 결과 참작하여 자유로\n운 심증으로 사회정의, 형평 이념에 입각하여 논리와 경험 법칙에\n따라 판단한다.\n4. 처분문서의 추정 및 복멸 0.5\n(1) 처분문서 의의\n처분문서란 법률행위가 문서 자체에 의해 이루어진 문서이다.\n(2) 判例\nⅰ)처분문서는 형식적 증거력 인정시 실질적 증거력 추정된다.\nⅱ)처분문서는 성립의 진정 인정되면 기재 내용을 부인할 만한\n분명하고도 수긍할 수 있는 반증이 없는 한 처분문서에 기재된\n문언대로 의사표시의 존재와 내용을 인정해야 한다.\n5. 보고문서의 추정 및 복멸 1.5\n(1) 보고문서 의의\n작성자가 보고 듣고 느낀 경험 또는 사실판단을 기재한 문서이다.\n(2) 判例\n진정성립 추정되는 공문서는 의문점이 있더라도 기재내용과 배치\n되는 사실이거나 문서 작성경위에 비추어 기재가 비정상적으로\n이루어졌거나 내용의 신빙성을 의심할 만한 특별한 사정을 증명\n할 다른 증거 없다면 기재내용대로 증명력 가진다고 한다.\n6. 사안해결 2.5\n(1) 진단서, 확인서는 모두 사실판단을 기재한 보고문서이다.\n(2) 진단서는 사문서인바 법원은 자유심증에 의해 실질적 증거력을\n인정하여 기재 내용에 기초한 사실인정 할 수 있다.\n(3) 확인서는 공문서인바 기재내용과 배치되는 사실, 비정상적인 작성\n등 특별한 사정이 없다면 그 기재 내용대로 사실인정 할 수 있다.\n(4) 법원은 특별한 사정이 없는한 확인서에 의해 500만 원은 인정할\n것이다. 다만, 진단서는 자유심증에 의해 판단하는바 반드시 1500\n만 원의 치료비가 인정되진 않는다. 따라서, 합산 손해액을 반드\n시 2000만 원으로 인정해야 하는 것은 아니다.", "categories": {"toc": "1. 문제의 소재\n2. 실질적 증거력 의의\n3. 실질적 증거력 판단\n4. 처분문서의 추정 및 복멸\n5. 보고문서의 추정 및 복멸\n6. 사안해결", "purpose": "어떤 문서가 요증사실을 증명하기에 얼마나 유용한가의 증거가치를 말한다. 문서가 실질적 증거력이 있으면 그 내용을 진실한 것으로 인정하여 사실판단 할 수 있다.", "article": "제202조", "elements": "", "theory": "", "cases": "(처분문서) ⅰ)처분문서는 형식적 증거력 인정시 실질적 증거력 추정된다. ⅱ)처분문서는 성립의 진정 인정되면 기재 내용을 부인할 만한 분명하고도 수긍할 수 있는 반증이 없는 한 처분문서에 기재된 문언대로 의사표시의 존재와 내용을 인정해야 한다.\n(보고문서) 진정성립 추정되는 공문서는 의문점이 있더라도 기재내용과 배치되는 사실이거나 문서 작성경위에 비추어 기재가 비정상적으로 이루어졌거나 내용의 신빙성을 의심할 만한 특별한 사정을 증명할 다른 증거 없다면 기재내용대로 증명력 가진다.", "resolution": "진단서, 확인서는 모두 사실판단을 기재한 보고문서이다. 진단서는 사문서인바 법원은 자유심증에 의해 실질적 증거력을 인정하여 기재 내용에 기초한 사실인정 할 수 있다. 확인서는 공문서인바 기재내용과 배치되는 사실, 비정상적인 작성 등 특별한 사정이 없다면 그 기재 내용대로 사실인정 할 수 있다. 법원은 1) 원칙\nⅰ)기판력은 전소 변론종결시 법률관계 판단에 발생한다. ⅱ)전소\n변론종결 전 제출가능했던 공격방어방법은 후소에서 차단된다.\n(2) 사안\n甲의 등기말소청구 확정판결 기판력은 전소 변론종결시 기준 법\n률관계 판단에 발생하나 乙이 후소로 주장하는 취득시효완성은\n전소 기판력이 작용하는 부분이 아니므로 차단되지 않는다.\n7. 사안해결 0.5\n乙의 후소는 전소 기판력이 저촉되지 않으므로 이를 배척한 후소\n법원의 판결은 부적법하다.", "categories": {"toc": "1. 문제의 소재\n2. 기판력의 의의 및 취지\n3. 기판력 주관적 범위\n4. 기판력 객관적 범위\n5. 기판력 작용국면 해당 여부\n6. 기판력 시적범위 및 차단효\n7. 사안해결", "purpose": "확정된 종국판결 내용이 후소에 대해 갖는 구속력을 의미한다. 판결모순방지 및 법적 안정성을 위함이다.\n[제216조 1항] 오판시정 및 신속한 결론을 내리기 위해 기판력은 판결 주문 판단에 발생한다.", "article": "제216조 1항", "elements": "", "theory": "(모순관계) ⅰ)모순관계 긍정설은 법적 안정성을 중시하여 전후소 소송물은 서로 모순관계에 해당하므로 변론종결 전 시효취득 사실은 차단된다고 한다. ⅱ)모순관계 부정설은 구체적 타당성을 중시하여 등기말소청구의 청구원인과 다른 청구원인을 이유로 이전등기청구하였기 때문에 모순관계에 해당하지 않고 변론종결 전 시효취득사실은 차단되지 않는다고 한다.", "cases": "원인무효에 기한 등기말소청구가 확정되었더라도 그 기판력은 소송물이었던 말소등기청구권 존부에만 미치므로 그 소송에서 패소한 당사자는 전소에서 문제된 것과는 전혀 다른 청구원인에 기하여 상대방에 대해 소유권이전등기청구를 할 수 있다.", "resolution": "乙의 후소는 전소 기판력이 저촉되지 않으므로 이를 배척한 후소 법원의 판결은 부적법하다."}}, {"no": 2, "points": 15, "question": "이 배우자 없이 사망하자 서은 자신이 단독상속인이라고 주장하면서\n乙을 상대로 소유권확인의 소(이하 '전소'라 함)를 제기하였다. A 토지 중\nI의 상속분에 해당하는 1/3 지분에 관하여는 청구인용, 나머지 2/3\n지분에 관하여는 청구기각의 판결이 선고되어 2020. 2. 10. 확정되었다.\n2020. 4. 9. 의 상속인들 전원이 \"거을 의 상속재산에 관한 단독상속인\n으로 한다.\"는 내용의 상속재산분할협의를 완료하였다. 그 후 지은 상속\n재산분할협의 사실을 이유로 하여 다시 乙을 상대로 A 토지 중 전소에서\n기각되었던 2/3 지분에 관하여 소유권확인의 소(이하 '후소'라 함)를 제기\n하였다. 법원은, 후소는 판결이 확정된 전소와 당사자 및 소송물이 동일\n하고, 협의에 의한 상속재산분할은 유효하다고 판단하였다. 그러면서 법원은\n\"상속재산분할은 상속이 개시된 때에 소급하여 그 효력이 있다(민법\n제1015조)는 점을 들어 후소는 전소 판결의 기판력에 저촉된다.\"고 판단\n하였다. 이와 같은 후소 법원의 판단이 적법한지 설명하시오.", "answer": "1. 문제의 소재 1\n단독상속 원인으로 소유권확인의 소 확정 판결 후 기각된 부분에\n대해 재산분할협의 원인으로 소유권확인의 후소 제기시 소송물\n동일성, 변론종결 후 사유 존부에 따른 기판력 저촉여부 논한다.\n2. 기판력의 의의 및 취지 1\n확정된 종국판결 내용이 후소에 대해 갖는 구속력을 의미한다. 판\n결모순방지 및 법적 안정성을 위함이다.\n3. 기판력 주관적 범위 1\n(1) 상대성원칙에 따라 전소 절차에 참여할 수 없었던 제3자 보호를\n위해 기판력은 전소 당사자 사이에 미치는 것이 원칙이다.\n(2) 甲과 乙은 전소 당사자인바 전소 기판력 주관적 범위에 해당한다.\n4. 기판력 객관적 범위 및 작용국면 4\n(1) ⅰ)[제216조 1항] 오판시정 및 신속한 결론을 내리기 위해 기판\n력은 판결 주문 판단에 발생한다.\nⅱ)전소 기판력은 후소에 동\n일, 선결, 모순관계로 작용할 수 있다.\n(2) 전후소 확인의 소의 소송물 동일 여부\n1)학설 ⅰ)구실체법설, 소송법설 불문 법률관계 공권적 확정을 통해\n분쟁해결 구해 소송물은 실체법상 권리로 본다. ⅱ)이지설 입장에\n서 소송물이론 일관해 청구원인으로 소송물 특정하는 견해 있다.\n2)判例 [법확전원다][증취상동]\nⅰ)소유권확인판결 확정시 법률관계가 그대로 확정되어 변론종결\n전 확인원인 되는 다른 사실이 있어도 기판력은 거기까지 미친다.\nⅱ)증여를 원인으로 소유권확인청구 했다가 소취하 후, 지분상속\n원인으로 지분소유권확인 청구를 함은 동일한 소로 볼 수 없다.\n3)검토 및 사안\nⅰ)생각건대 청구원인은 소유권 성질에 영향 주지 않아 다수설\n타당하며, ⅱ)사안에서 ①전소 기판력은 甲의 1/3지분 소유권 존\n재, 2/3지분 소유권 부존재에 발생한다. ②전소는 단독상속, 후소\n는 재산분할협의로 소유권 주장했으나, 법률관계 공권적 확정이라\n는 소유권 확인 특성상 이는 동일한바 전소 기판력이 후소에 동\n일관계로 작용할 수 있다.\n5. 기판력 시적범위 및 차단효 4\n(1) 원칙\nⅰ)기판력은 전소 변론종결시 법률관계 판단에 발생한다. ⅱ)전소\n변론종결 전 제출가능했던 공격방어방법은 후소에서 차단된다.\n(2) 후소에서 차단되지 않는 변론종결 후 사유 의미\n判例는 변론종결 후 사유란 새로운 사실관계를 말하는 것이고 기\n존 사실관계에 대한 새로운 증거자료, 새로운 법적 평가 또는 법\n적 평가가 담긴 다른 판결의 존재는 포함되지 않는다고 한다.\n(3) 상속재산분할협의가 변론종결 후 사유인지 여부\n判例는 전소에서 원고가 단독상속인임을 주장해 소유권확인 구했\n으나 공동상속인에 해당한다는 이유로 상속분에 대해서만 청구인\n용판결 확정되었다면 전소 기판력은 변론종결 후 상속재산분할협\n의에 의해 소유권 취득한 나머지 상속분에 관한 소유권확인의 소\n에는 미치지 않는다고 한다.\n(4) 사안\n甲이 전소에서 단독상속인임을 전제로 소유권확인 구하여 상속분\n에 대해서만 인용판결 받은 후 상속재산분할협의 이유로 소유권\n확인을 구하면 이는 변론종결 후 새로운 사유로 볼 수 있어 차단\n되지 않는다.\n6. 사안해결 0.5\n전후소 소유권확인의 소는 소송물은 동일하나, 후소의 상속재산분\n할협의는 변론종결 후 새로운 사유인바 후소가 전소 기판력에 저\n촉된다고 본 판단은 부적법하다.", "categories": {"toc": "1. 문제의 소재\n2. 기판력의 의의 및 취지\n3. 기판력 주관적 범위\n4. 기판력 객관적 범위 및 작용국면\n5. 기판력 시적범위 및 차단효\n6. 사안해결", "purpose": "확정된 종국판결 내용이 후소에 대해 갖는 구속력을 의미한다. 판결모순방지 및 법적 안정성을 위함이다.\n[제216조 1항] 오판시정 및 신속한 결론을 내리기 위해 기판력은 판결 주문 판단에 발생한다.", "article": "제216조 1항", "elements": "", "theory": "(소송물 동일 여부) ⅰ)구실체법설, 소송법설 불문 법률관계 공권적 확정을 통해 분쟁해결 구해 소송물은 실체법상 권리로 본다. ⅱ)이지설 입장에서 소송물이론 일관해 청구원인으로 소송물 특정하는 견해 있다.", "cases": "ⅰ)소유권확인판결 확정시 법률관계가 그대로 확정되어 변론종결 전 확인원인 되는 다른 사실이 있어도 기판력은 거기까지 미친다.\nⅱ)증여를 원인으로 소유권확인청구 했다가 소취하 후, 지분상속 원인으로 지분소유권확인 청구를 함은 동일한 소로 볼 수 없다.\n(변론종결 후 사유) 변론종결 후 사유란 새로운 사실관계를 말하는 것이고 기존 사실관계에 대한 새로운 증거자료, 새로운 법적 평가 또는 법적 평가가 담긴 다른 판결의 존재는 포함되지 않는다.\n(상속재산분할협의) 전소에서 원고가 단독상속인임을 주장해 소유권확인 구했으나 공동상속인에 해당한다는 이유로 상속분에 대해서만 청구인용판결 확정되었다면 전소 기판력은 변론종결 후 상속재산분할협의에 의해 소유권 취득한 나머지 상속분에 관한 소유권확인의 소에는 미치지 않는다.", "resolution": "전후소 소유권확인의 소는 소송물은 동일하나, 후소의 상속재산분할협의는 변론종결 후 새로운 사유인바 후소가 전소 기판력에 저촉된다고 본 판단은 부적법하다."}}]}, {"subject": "민사소송법", "exam": "57회", "year": 2020, "problemNo": 4, "points": 20, "passage": "\"은 乙을 상대로 서울중앙지방법원에 소유권이전등기 및 소유권보존등기\n말소를 청구하는 소를 제기하였다. 제1심 법원에서 U 승소의 판결이 선고\n되자 乙이 항소하였다. 항소심인 서울고등법원에서 乙의 항소를 기각하는\n판결이 선고되었으며,, 그 후 대법원에서 乙의 상고가 기각되었다. (다음 각\n설문은 독립적임)", "subquestions": [{"no": 1, "points": 14, "question": "乙의 상고가 기각된 후, 위 소송의 항소심 판결에서 증거로 채택되었던\n증인 서의 증언이 허위진술이라 하여 Fj에게 위증죄의 유죄판결이 선고되어\n2018. 7. 24. 확정되었다. 2018. 8. 17. 乙은 서의 증언이 위증이라는 것을\n재심사유로 하여 제1심 법원이었던 서울중앙지방법원에 재심소장을 제출\n하였다. 서울중앙지방법원은 2018. 10. 29. 위 재심사건이 그 관할에 속하지\n않는다는 이유로 서울고등법원에 이를 이송하여 2018. 11. 26. 위 고등\n법원에 접수되었다. 서울고등법원은 이 사건 재심소장이 접수된 2018. 11. 26.은\n乙이 시에 대하여 위증죄의 유죄판결이 확정된 것을 알았을 때로부터 30일이\n이미 경과된 후이므로 이 사건 재심의 소는 부적법하다고 판단하였다. 이와\n같은 서울중앙지방법원의 조치와 서울고등법원의 판단이 적법한지 설명\n하시오.", "answer": "1. 문제의 소재 – 재심 의의 및 취지 [제451조] 1\nⅰ)재심은 당사자 구제 및 법적 안정성의 조화를 위해 확정된 종\n국판결에 중대한 하자를 다투기 위한 제도이다. ⅱ)허위진술에 기\n초한 확정판결에 재심사유 7호를 들어 재심 제기하는 경우 재심\n전속관할 및 이송에 따른 재심기간 준수 여부 검토한다.\n2. 재심관할 법원 3\n(1) 원칙 [제453조 1항]\n재심은 재심을 제기할 판결을 한 법원의 전속관할로 한다.\n(2) 항소심의 사실인정을 이유로 재심 제기하는 경우\n1)상고심의 경우\n재심사유 6호, 7호 등 사실인정을 재심사유로 재심 제기시 사실\n심 판결에 대한 재심사유는 될지언정 상고심판결에 대한 재심사\n유로 삼을 수 없다.\n2)제1심의 경우 [제451조 3항]\n항소심에서 본안판결 한 경우 제1심판결에 재심 제기 할 수 없다.\n(3) 사안\n항소심이 허위증언에 기초하여 본안판결했고 이런 사실인정을 이\n유로 재심 제기한바 항소심인 서울고등법원이 재심관할법원이다.\n3. 재심관할 위반시 조치 4\n(1) 관할위반 이송 [제34조 1항]\n법원은 소송 전일부에 관할권 없다고 인정시 결정으로 사건을 관\n할 법원에 이송한다.\n(2) 判例\n1)상고심에 재심 제기한 경우 항소심에서 채택한 증거가 위조된 것\n이라고 주장하며 상고기각판결을 대상으로 재심의 소제기시 재심\n관할인 항소심으로 이송한다.\n2)제1심에 재심 제기한 경우 재심사유에 비추어 항소심 판결을 대\n상으로 제기한 것이면 항소심에 이송한다.\n(3) 학설 ⅰ)기간도과 불이익 구제 위해 1심법원 사이뿐만 아니라 재\n심관할법원 사이에도 제34조 이송 적용가능하다는 견해 ⅱ)제34\n조 이송은 1심법원 사이에만 적용되고 재심관할에는 법적안정성\n을 이유로 적용하지 않는다는 견해가 있다.\n(4) 검토 및 사안\nⅰ)생각건대 절차경제 위해 허용함이 타당하며 ⅱ)사안에서 乙재\n심은 항소심 사실인정을 이유로 하는바 1심인 서울중앙지방법원\n에 제기시 제34조 1항으로 항소심인 서울고등법원으로 이송한다.\n4. 재심사유 7호 가벌행위의 경우 재심기간 준수 여부 2\n(1) 원칙\n재심사유 안날로부터 30일, 판결확정 후 5년내 제기해야 한다.\n(2) 가벌행위 재심사 .\n4. 사안해결 0.5\n채무자 乙은 이미 제3채무자 甲을 상대로 소를 제기하여 확정판\n결을 받아 권리행사한 이후이므로 재심의 소제기도 乙의 의사에\n맡겨야 하고 채권자 丁은 乙을 대위해 재심 제기할 수 없다.\n-이 하 여 백 -", "categories": {"toc": "1. 문제의 소재 - 재심 의의 및 취지\n2. 대위소 법적 성질\n3. 재심의 당사자적격\n4. 사안해결", "purpose": "재심은 당사자 구제 및 법적 안정성의 조화를 위해 확정된 종국판결에 중대한 하자 다투는 제도다.", "article": "제451조", "elements": "(대위소 요건) 피보전채권, 보전필요성, 채무자권리불행사는 소송요건이며 흠결시 당사자적격이 없어 대위소 부적법하다.", "theory": "ⅰ)고유대위권설은 민법이 채권자에게 인정한 고유의 대위권을 제3채무자에게 행사한다고 보나 ⅱ)判例인 법정소송담당설은 채권자가 채무자에 대한 권리 보전을 위해 채무자의 제3채무자에 대한 권리 대신 행사하는 법정소송담당이라고 한다.", "cases": "채권보전을 위해 대위행사가 필요한 경우 실체법상 권리뿐만 아니라 소송법상 권리에 대해서도 대위가 허용되나, 채무자의 제3채무자 사이의 소송이 계속된 이후의 소송수행과 관련한 개개의 소송행위는 그 권리의 행사를 소송당사자인 채무자 의사에 맡기는 것이 타당하므로 채권자대위가 허용될 수 없다.", "resolution": "채무자 乙은 이미 제3채무자 甲을 상대로 소를 제기하여 확정판결을 받아 권리행사한 이후이므로 재심의 소제기도 乙의 의사에 맡겨야 하고 채권자 丁은 乙을 대위해 재심 제기할 수 없다."}}]}, {"subject": "민사소송법", "exam": "58회", "year": 2021, "problemNo": 1, "points": 30, "passage": "甲은 A에 대하여 2018. 4. 26.부터 현재까지 36억 원의 채권을 가지고 있고, A는\n피고 1에 대하여 50억 원, 피고 2에 대하여 20억 원, 피고 3에 대하여 12억 원,\n피고 4에 대하여 12억 원의 각 채권을 가지고 있다고 주장하면서 “甲에게 피고\n1은 11억 원, 피고 2는 4억 원, 피고 3, 피고 4는 각 2억 원을 지급할 것”을 청\n구하는 채권자대위소송을 제기하였다. 이 소송의 계속 중에 乙은 A에 대하여\n18억 원의 채권을 가지고 있고, A는 피고들에 대하여 위와 같은 채권을 가지고\n있다고 주장하면서 “乙에게 피고 1은 9억 원, 피고 2는 4억 원, 피고 3은 2억 원,\n피고 4는 2억 원을 각 지급할 것”을 청구하는 내용으로 甲이 진행하는 소송에\n참가하고자 한다.", "subquestions": [{"no": 1, "points": 10, "question": "甲의 피고 1 내지 4에 대한 각 소송이 적법하기 위해서는 어떠한 요건이\n필요한지를 설명하시오.", "answer": "1. 문제의 소재 0.5\n甲은 피고 1 내지 4에 대해 대위소를 병합 제기한바 대위소 성질\n에 따른 대위소 요건과 공동소송 요건, 병합청구 요건 논한다.\n2. 대위소의 법적 성질 2\n(1) 학설\n1)법정소송담당설은 대위소를 채권자가 채무자를 대신하여 제3채무\n자에 대한 소송수행권을 갖는 법정소송담당으로 본다.\n2)고유대위권설은 대위소를 채권자가 자신의 이익을 위해 민법이\n그에게 인정한 고유의 대위권을 행사하는 것으로 본다.\n(2) 判例\n채권자가 채무자에 대한 권리보전을 위해 채무자를 대위해 채무\n자의 제3채무자에 대한 권리를 행사하는 법정소송담당이라 한다.\n(3) 검토\n대위권 행사 효력이 채무자에게 직접 귀속되므로 판시 타당하다.\n3. 대위소 요건 2.5\n(1) 判例 및 학설\n1)判例 및 법정소송담당설\n피보전권리, 보전의 필요성, 채무자 권리 불행사를 소송요건으로\n보며 흠결시 당사자적격 흠결로 대위소를 부적법 각하한다고 한\n다. 피대위채권을 본안요건으로 보며 흠결시 대위소 기각한다.\n2)고유대위권설\n피보전권리, 보전의 필요성, 채무자 권리 불행사, 피대위권리 모두\n본안요건으로 흠결시 대위소를 기각한다.\n(2) 검토\n담당설이 타당한바 피보전권리, 보전 필요성 채무자 권리 불행사\n를 소의 적법요건으로 보고 피대위권리는 본안요건으로 본다.\n4. 공동소송 주관적 요건 및 병합청구 객관적 요건 1\n(1) 공동소송 주관적 요건 [제65조]\n권리의무 발생원인이 공통되거나 동종이어야 한다.\n(2) 병합청구 객관적 요건 [제253조]\n여러 청구는 동종절차 따라야 하고 공통관할 인정되어야 한다.\n5. 사안해결 1.5\n(1) 채권자 甲의 대위소는 채무자 A에 대해 갖는 채권 보전을 위해\nA를 대위하여 A의 제3채무자들인 피고 1 내지 4에 대한 채권을\n대위행사하는 법정소송담당이다.\n(2) 甲은 대위소 적법요건으로 A에 대한 피보전권리, 보전의 필요성,\n채무자 A의 피고 1 내지 4에 대한 권리 불행사를 요한다.\n(3) 피고 1 내지 4는 A에 대한 채무 발생원인이 공통되거나 동종이\n어야 하고 각 청구는 동종절차 및 공통관할 만족해야 한다.", "categories": {"toc": "1. 문제의 소재\n2. 대위소의 법적 성질\n3. 대위소 요건\n4. 공동소송 주관적 요건 및 병합청구 객관적 요건\n5. 사안해결", "purpose": "", "article": "제65조, 제253조", "elements": "(대위소 요건) 피보전권리, 보전의 필요성, 채무자 권리 불행사를 소송요건으로 보며 흠결시 당사자적격 흠결로 대위소를 부적법 각하한다고 한다. 피대위채권을 본안요건으로 보며 흠결시 대위소 기각한다.\n(공동소송 주관적 요건 [제65조]) 권리의무 발생원인이 공통되거나 동종이어야 한다.\n(병합청구 객관적 요건 [제253조]) 여러 청구는 동종절차 따라야 하고 공통관할 인정되어야 한다.", "theory": "1)법정소송담당설은 대위소를 채권자가 채무자를 대신하여 제3채무자에 대한 소송수행권을 갖는 법정소송담당으로 본다.\n2)고유대위권설은 대위소를 채권자가 자신의 이익을 위해 민법이 그에게 인정한 고유의 대위권을 행사하는 것으로 본다.", "cases": "채권자가 채무자에 대한 권리보전을 위해 채무자를 대위해 채무자의 제3채무자에 대한 권리를 행사하는 법정소송담당이라 한다.", "resolution": "채권자 甲의 대위소는 채무자 A에 대해 갖는 채권 보전을 위해 A를 대위하여 A의 제3채무자들인 피고 1 내지 4에 대한 채권을 대위행사하는 법정소송담당이다. 甲은 대위소 적법요건으로 A에 대한 피보전권리, 보전의 필요성, 채무자 A의 피고 1 내지 4에 대한 권리 불행사를 요한다. 피고 1 내지 4는 A에 대한 채무 발생원인이 공통되거나 동종이어야 하고 각 청구는 동종절차 및 공통관할 만족해야 한다."}}, {"no": 2, "points": 20, "question": "甲과의 관계에서 乙이 위 소송에 참가하는 형태에 관하여 설명하시오.", "answer": "1. 문제의 소재 1\nⅰ)자신의 이익 옹호하고 일방을 돕기 위한 참가 형태로 보조참\n가, 공동소송적 보조참가, 공동소송참가 등이 있다. ⅱ)乙이 자신\n을 이행상대방으로 대위권을 행사하며 참가한바 소송목적이 합일\n적으로 확정되는 관계가 되어 공동소송참가로 적법한지 검토한다.\n2. 공동소송참가의 의의·취지 및 요건 1.5\n(1) 의의 및 취지 [제83조 1항]\n타인간 소송계속 중 소송목적이 한 쪽 당사자와 제3자에게 합일\n확정되어야 할 경우 그 자가 공동소송인으로 참가한다. 자기이익\n보호할 수 있게 하기 위함이다.\n(2) 요건 [타합소]\nⅰ)타인간 소송계속 중 ⅱ)소송목적이 한 쪽 당사자와 제3자에게\n합일확정되어야 할 경우 ⅲ)일반 소송요건을 갖춰야 한다.\n3. 대위소 기판력이 다른 대위채권자에게 미치는지 여부 3.5\n(1) 학설 ⅰ)기판력설은 담당설 입장에서 채무자가 대위소제기 사실\n을 알면 대위소 기판력을 받는바 한 대위채권자의 기판력은 다른\n대위채권자에게 미친다고 본다. ⅱ)반사효설은 담당설 입장에서\n채무자가 대위소제기 사실 알면 대위소 기판력 받으므로 채무자\n를 통해 다른 대위채권자도 반사효 받는다고 본다. ⅲ)부정설은\n고유대위권설 입장에서 여러 채권자는 각자 대위권을 행사하여\n당사자, 소송물이 달라 상호간 기판력이 미치지 않는다고 한다.\n(2) 判例\n어떤 사유든 대위소 제기 사실을 채무자가 안 경우에 한해 판결\n효력이 채무자에게 미치므로 다른 채권자가 동일 소송물에 대해\n채권자대위권에 기한 소 제기시 전소 기판력을 받는다.\n(3) 검토 및 사안\nⅰ)생각건대 법정소송담당설 따르는 이상 합일확정을 위해 판시\n타당하며 ⅱ)사안에서 甲대위소 제기 사실을 채무자 A가 안 경우\n다른 대위권자 乙은 기판력 받을 것이다.\n4. 여러 채권자들의 대위소송의 경우 합일확정 여부 2.5\n(1) 判例 [대다공물합]\n대위소가 제기된 것을 채무자가 알았을 때 다른 대위채권자가 기\n판력을 받으므로 대위소 계속 중 다른 채권자가 동일 채무자를\n대위하여 채권자대위권을 행사하며 공동소송참가할 경우, 양 청구\n의 소송물이 동일하다면 소송목적이 한 쪽 당사자와 제3자에게\n합일적으로 확정되어야 할 경우에 해당하여 참가신청은 적법하다.\n(2) 사안\n甲대위소 계속 중 대위소 기판력을 받는 乙이 대위권 행사하며\n공동소송참가했고, 양 청구 소송물 동일하면 소송목적이 甲, 乙사\n이 합일확정 요하므로 참가 적법해질 수 있다.\n5. 소송물 동일 여부 판단 4.5\n(1) 소송물 동일성 판단기준\n判例는 대위채권자들 청구의 소송물이 동일한지는 각기 대위행사\n하는 피대위채권 동일여부로 결정되고, 채권자들이 각기 자신을\n이행 상대방으로 지급을 구했어도 채권자들이 채무자를 대위해\n변제 수령하게 될 뿐 자신 채권에 대한 변제로 수령하는 것은 아\n닌바 서로 소송물이 다르다고 할 수 없다고 한다.\n(2) 명시적 일부청구인 경우\n判例는 원고가 일부청구임을 명시해 피대위채권 일부만 청구한\n경우 참가인의 청구금액이 원고 청구금액을 초과하지 않는 한 원\n고의 청구와 소송물이 동일하여 소송목적이 원고와 참가인에게\n합일확정되어야 할 필요성을 인정할 수 있다고 한다.\n(3) 사안\nⅰ)甲, 乙은 모두 A의 피고에 대한 채권을 대위행사 하며, 乙이\n자신을 이행 상대방으로 지급 구했어도 이는 A를 대위해 변제를\n수령할 뿐이므로 甲의 대위소와 소송물이 동일할 수 있다.\nⅱ)甲이 피고1에 대한 A의 50억 채권 중 11억을, 피고2에 대한\nA의 20억 채권 중 4억을, 피고3, 4에 대한 12억 채권 중 2억을\n명시적 일부청구했다고 보여지며, 乙이 대위권 행사하며 피고1에\n대한 50억 채권 중 9억을, 피고2에 대한 20채권 중 3억을, 피고\n3, 4에 대한 12억 채권 중 2억을 청구하여 甲의 청구금액을 초과\n하지 않는바 소송물 동일 요건 인정된다.\n6. 일반 소송요건 충족 여부 1\n(1) 일반 소송요건\n당사자적격, 중복소제기 아닐 것, 제소기간 준수 등이 있다.\n(2) 사안\n乙이 대위권 행사하며 공동소송참가시 위 요건 문제되지 않는다.\n7. 사안해결 1\nⅰ)타인인 甲과 피고들의 대위소송 중 ⅱ)甲의 대위소와 소송물\n이 동일해 소송목적이 甲과 乙사이 합일확정 요하고 ⅲ)乙이 일\n반 소송요건 갖추어 공동소송참가로 적법하다.", "categories": {"toc": "1. 문제의 소재\n2. 공동소송참가의 의의·취지 및 요건\n3. 대위소 기판력이 다른 대위채권자에게 미치는지 여부\n4. 여러 채권자들의 대위소송의 경우 합일확정 여부\n5. 소송물 동일 여부 판단\n6. 일반 소송요건 충족 여부\n7. 사안해결", "purpose": "(공동소송참가) 타인간 소송계속 중 소송목적이 한 쪽 당사자와 제3자에게 합일확정되어야 할 경우 그 자가 공동소송인으로 참가한다. 자기이익 보호할 수 있게 하기 위함이다.", "article": "제83조 1항", "elements": "(공동소송참가) ⅰ)타인간 소송계속 중 ⅱ)소송목적이 한 쪽 당사자와 제3자에게 합일확정되어야 할 경우 ⅲ)일반 소송요건을 갖춰야 한다.\n(일반 소송요건) 당사자적격, 중복소제기 아닐 것, 제소기간 준수 등.", "theory": "ⅰ)기판력설은 담당설 입장에서 채무자가 대위소제기 사실을 알면 대위소 기판력을 받는바 한 대위채권자의 기판력은 다른 대위채권자에게 미친다고 본다. ⅱ)반사효설은 담당설 입장에서 채무자가 대위소제기 사실 알면 대위소 기판력 받으므로 채무자를 통해 다른 대위채권자도 반사효 받는다고 본다. ⅲ)부정설은 고유대위권설 입장에서 여러 채권자는 각자 대위권을 행사하여 당사자, 소송물이 달라 상호간 기판력이 미치지 않는다고 한다.", "cases": "(기판력) 어떤 사유든 대위소 제기 사실을 채무자가 안 경우에 한해 판결효력이 채무자에게 미치므로 다른 채권자가 동일 소송물에 대해 채권자대위권에 기한 소 제기시 전소 기판력을 받는다.\n(공동소송참가) 대위소가 제기된 것을 채무자가 알았을 때 다른 대위채권자가 기판력을 받으므로 대위소 계속 중 다른 채권자가 동일 채무자를 대위하여 채권자대위권을 행사하며 공동소송참가할 경우, 양 청구의 소송물이 동일하다면 소송목적이 한 쪽 당사자와 제3자에게 합일적으로 확정되어야 할 경우에 해당하여 참가신청은 적법하다.\n(소송물 동일성) 대위채권자들 청구의 소송물이 동일한지는 각기 대위행사하는 피대위채권 동일여부로 결정되고, 채권자들이 각기 자신을 이행 상대방으로 지급을 구했어도 채권자들이 채무자를 대위해 변제 수령하게 될 뿐 자신 채권에 대한 변제로 수령하는 것은 아닌바 서로 소송물이 다르다고 할 수 없다.\n(명시적 일부청구) 원고가 일부청구임을 명시해 피대위채권 일부만 청구한 경우 참가인의 청구금액이 원고 청구금액을 초과하지 않는 한 원고의 청구와 소송물이 동일하여 소송목적이 원고와 참가인에게 합일확정되어야 할 필요성을 인정할 수 있다.", "resolution": "ⅰ)타인인 甲과 피고들의 대위소송 중 ⅱ)甲의 대위소와 소송물이 동일해 소송목적이 甲과 乙사이 합일확정 요하고 ⅲ)乙이 일반 소송요건 갖추어 공동소송참가로 적법하다."}}]}, {"subject": "민사소송법", "exam": "58회", "year": 2021, "problemNo": 2, "points": 20, "passage": "피고 회사 소속 시내버스에 의하여 교통사고를 당한 甲이 손해배상청구를 한 것에\n대하여, 제1심 법원(A)은 일부 인용하는 판결을 선고하였다. 위 제1심 판결에\n대하여 피고가 항소하자 甲은 항소기간이 경과한 후에 부대항소를 제기하면서\n아울러 청구를 확장하였는바, 환송전 항소심법원(B)은 원고에게 추가적으로 손해\n배상금을 인정하여 일시금 및 정기금의 지급을 명하는 판결을 선고하였다. 환송전\n항소법원(B)의 판결에 대하여 甲만 상고하였는데, 대법원은 甲의 상고를 일부\n받아들여 환송전 항소심법원(B)의 판결 중 정기금채무로 지급할 것을 명한 부\n분을 파기환송하는 한편, 甲의 나머지 상고를 기각하였다. 이 사건이 환송 후\n항소심법원(C)에 계속 중 피고는 항소취하서를 제출하였다.", "subquestions": [{"no": 1, "points": 10, "question": "파기환송 후 피고의 항소취하에 대한 효력을 설명하시오.", "answer": "1. 문제의 소재 0.5\n환송 전 항소심에서 부대항소가 있었고, 대법원 환송판결이 있음\n에도 환송 후 항소심에서 항소취하 가능하면 부대항소인의 이익\n을 해하고 환송판결 기속력을 허물 수 있는바 이를 살핀다.\n2. 항소취하의 의의 및 효과 1\n(1) 항소취하 의의 [제393조 1항]\n항소심 계속 중 항소 철회해 항소를 소급 소멸시키는 소송행위다.\n처분권주의의 발현이다.\n(2) 효과\n항소심 절차가 소급 소멸한다. 단, 제1심 종국판결은 유효하게 존\n재하며, 항소기간 도과시점에 제1심 종국판결 내용대로 확정된다.\n3. 환송 후 항소심에서 항소취하 가부 3.5\n(1) 학설 ⅰ)긍정설은 제393조 명문에 따라 환송 후 항소취하 가능하\n다고 한다. ⅱ)부정설은 환송 후 항소취하를 허용하면 부대항소가\n소멸되어 부대항소인에게 가혹하며 항소인이 대법원의 환송판결\n기속력을 허물게 되어 부당하다고 한다.\n(2) 判例\n항소심 종국판결을 상고심이 파기·환송하면 항소심 종국판결은 처\n음부터 없던 것이 되므로 새로운 항소심 중국판결 전까지 피항소\n인이 부대항소 제기와 무관하게 주된 항소를 취하할 수 있다.\n(3) 검토 및 사안\nⅰ)생각건대 부대항소는 항소에 의존하는 절차로 항소취하로 인\n한 소멸 불가피하며 처분권주의 존중 위해 판시 타당하다. ⅱ)상\n고심이 파기 환송 후 항소심의 종국판결 전이므로 원고 부대항소\n와 무관하게 피고는 환송 후 항소심에서 항소를 취하할 수 있다.\n4. 항소취하로 부대항소도 소멸하는지 여부 1.5\n(1) 부대항소의 효력 [제404조]\nⅰ)부대항소는 주된 항소에 종속되어 항소가 취하되거나 각하된\n때 효력을 잃는다.\nⅱ)다만 항소기간, 항소이익 등 항소요건을 갖추어 제기한 부대항\n소는 주된 항소가 취하되어도 독립된 항소로 유지된다.\n(2) 사안\n원고는 항소기간 도과 후 부대항소를 제기하였는바 이는 종속 부\n대항소다. 이는 주된 항소 취하로 함께 소멸된다.\n5. 사안해결 0.5\n환송 후 항소취하 가능하고 부대항소도 함께 소멸하여 정기금 부\n분 항소는 소급소멸하고 항소기간 도과시 1심판결 확정된다. 상고\n기각된 일시금은 상고심판결선고시 확정되어 소멸되지 않는다.", "categories": {"toc": "1. 문제의 소재\n2. 항소취하의 의의 및 효과\n3. 환송 후 항소심에서 항소취하 가부\n4. 항소취하로 부대항소도 소멸하는지 여부\n5. 사안해결", "purpose": "(항소취하) 항소심 계속 중 항소 철회해 항소를 소급 소멸시키는 소송행위다. 처분권주의의 발현이다.\n(부대항소 효력) 부대항소는 주된 항소에 종속되어 항소가 취하되거나 각하된 때 효력을 잃는다.", "article": "제393조 1항, 제404조", "elements": "", "theory": "ⅰ)긍정설은 제393조 명문에 따라 환송 후 항소취하 가능하다고 한다. ⅱ)부정설은 환송 후 항소취하를 허용하면 부대항소가 소멸되어 부대항소인에게 가혹하며 항소인이 대법원의 환송판결 기속력을 허물게 되어 부당하다고 한다.", "cases": "항소심 종국판결을 상고심이 파기·환송하면 항소심 종국판결은 처음부터 없던 것이 되므로 새로운 항소심 종국판결 전까지 피항소인이 부대항소 제기와 무관하게 주된 항소를 취하할 수 있다.", "resolution": "환송 후 항소취하 가능하고 부대항소도 함께 소멸하여 정기금 부분 항소는 소급소멸하고 항소기간 도과시 1심판결 확정된다. 상고기각된 일시금은 상고심판결선고시 확정되어 소멸되지 않는다."}}, {"no": 2, "points": 10, "question": "피고의 항소취하가 있었음에도 이를 간과하고 내려진 항소심의 판결에 대하여\n상고한 경우 대법원은 어떻게 판단을 하여야 하는지를 설명하시오.", "answer": "1. 문제의 소재 0.5\n항소심 절차가 소멸되었음에도 이를 간과하고 항소심이 판결을\n내린 경우 그 위법성에 대해 검토하고 상고심이 원심이 위법한\n원심을 파기하여 소송종료선언할지 검토한다.\n2. 항소취하 후 항소심 판결의 위법성 1\n(1) 항소취하 효과\n항소취하로 항소심 절차 소급소멸하며, 부대항소가 항소요건을 갖\n춘 것 아닌한 종속성에 따라 함께 소멸되어 이를 심판할 수 없다.\n(2) 사안\n피고가 항소취하했고 원고 부대항소도 항소기간 도과된 것으로\n함께 소멸되므로 항소심은 이를 심판할 수 없음에도 이를 심판대\n상으로 삼아 판결한바 이는 위법한 판결이다.\n3. 상고 적법성 1\n(1) 상고 요건\n상고는 ⅰ)대상적격 ⅱ)상고기간 준수 ⅲ)상고이익 등 상고요건\n갖추어야 하며, 상고요건 흠결시 상고각하한다.\n(2) 사안\n항소취하 간과판결은 대상적격 등 문제 없어 상고는 적법하다.\n4. 상고심의 판단 3.5\n(1) 원심판결 파기\nⅰ)상고가 이유 있는 경우 상고인용 파기한다. ⅱ)상고심은 직권\n으로 원심의 위법함을 들어 직권파기도 가능하다.\n(2) 원심판결의 환송 또는 자판 원은 이러한 피고들의 주장을\n받아들여 재판할 수 있는지에 관해 설명하시오.", "answer": "1. 문제의 소재 0.5\n전소 승소확정판결 존재할 때 시효중단을 위해 동일 청구권에 기\n해 이행의 소를 제기하는 경우 소의 이익 흠결 여부 및 소의 이\n익 인정되는 경우 본안 심리방법을 논한다.\n2. 승소확정판결 받은 청구권 이행의 소 다시 제기 가부 4\n(1) [제265조] 소제기시 시효중단의 효력이 있다.\n(2) 원칙 – 권리보호이익 흠결\n승소확정판결에는 기판력이 있으므로 당사자가 동일한 소송물에\n대해 신소를 제기하면 권리보호이익 흠결로 각하된다.\n(3) 예외 – 시효중단을 위한 경우\n1)전원합의체 다수의견 [압시박]\n다른 시효중단 사유인 압류는 1회로 제한하지 않음에도 재판상\n청구만 1회로 제한됨은 부당한바, 시효중단을 위해 소제기했고,\n10년의 경과가 임박한 경우 허용한다.\n2)전원합의체 소수의견 [집영]\n이미 집행권원 가져 동일한 소를 제기할 이익이 없고, 채권이 영\n구적으로 존속하게 되어 부당하므로 소의 이익을 부정한다.\n3)검토\n채무자에게도 파산·회생 같은 권리구제 수단을 마련해 주는 것과\n의 균형상 시효중단 방안으로써 소제기를 허용함이 타당하다.\n3. 승소확정판결 후 시효중단 위해 제기된 후소의 심리방법 3\n(1) 기판력 의의 및 취지\n기판력이란 판결모순방지 위해 확정된 종국판결 내용이 후소에\n대해 갖는 구속력이다.\n(2) 判例 [전확권요다][(기변)후멸]\nⅰ)시효중단 위한 후소는 전소 승소확정판결 기판력에 저촉되어\n서는 안 되므로 확정된 권리를 주장할 수 있는 모든 요건이 구비\n되어 있는지에 관하여 다시 심리할 수 없다.\nⅱ)후소에서 전소 변론종결 후 발생한 변제, 면제, 소멸시효와 같\n은 채권소멸사유는 심리대상이 되어 청구기각판결할 수 있다.\n4. 사안해결 1\n(1) 甲의 전소판결은 09.5.4. 승소확정되었다. 甲은 시효중단을 위해\n소멸시효 완성기간인 10년의 기간 도과 임박하여 19.4.15. 후소\n로 동일 청구권 이행의 소를 제기하여 소는 적법하다.\n(2) 피고들은 변론종결 전에 발생한 채무 변제 사실을 제출한바 전소\n기판력에 의해 차단되어 이를 재판할 수 없다.", "categories": {"toc": "1. 문제의 소재\n2. 승소확정판결 받은 청구권 이행의 소 다시 제기 가부\n3. 승소확정판결 후 시효중단 위해 제기된 후소의 심리방법\n4. 사안해결", "purpose": "(시효중단) [제265조] 소제기시 시효중단의 효력이 있다.\n(기판력) 판결모순방지 위해 확정된 종국판결 내용이 후소에 대해 갖는 구속력이다.", "article": "제265조", "elements": "", "theory": "1)전원합의체 다수의견: 다른 시효중단 사유인 압류는 1회로 제한하지 않음에도 재판상 청구만 1회로 제한됨은 부당한바, 시효중단을 위해 소제기했고, 10년의 경과가 임박한 경우 허용한다.\n2)전원합의체 소수의견: 이미 집행권원 가져 동일한 소를 제기할 이익이 없고, 채권이 영구적으로 존속하게 되어 부당하므로 소의 이익을 부정한다.", "cases": "ⅰ)시효중단 위한 후소는 전소 승소확정판결 기판력에 저촉되어서는 안 되므로 확정된 권리를 주장할 수 있는 모든 요건이 구비되어 있는지에 관하여 다시 심리할 수 없다.\nⅱ)후소에서 전소 변론종결 후 발생한 변제, 면제, 소멸시효와 같은 채권소멸사유는 심리대상이 되어 청구기각판결할 수 있다.", "resolution": "甲의 전소판결은 09.5.4. 승소확정되었다. 甲은 시효중단을 위해 소멸시효 완성기간인 10년의 기간 도과 임박하여 19.4.15. 후소로 동일 청구권 이행의 소를 제기하여 소는 적법하다. 피고들은 변론종결 전에 발생한 채무 변제 사실을 제출한바 전소 기판력에 의해 차단되어 이를 재판할 수 없다."}}, {"no": 2, "points": 20, "question": "전소에서 확정된 권리관계를 다투기 위해 乙은 2021. 7. 13., 丙은 같은 달\n29. 각각 전소 제1심 판결에 대한 추후보완 항소를 제기하였다. 이러한 추\n후보완 항소의 적법성에 관해 설명하시오.", "answer": "1. 문제의 소재 1\nⅰ)[제396조] 항소는 판결정본 송달 후 2주내 제기해야 한다.\nⅱ)乙, 丙은 항소기간 도과 후 추후보완항소 하였는바 책임질 수\n없는 사유 인정 여부 및 그 사유 소멸일 검토하여 추후보완항소\n가 적법한 것인지 검토한다.\n2. 乙, 丙에 대한 소송절차 진행 독립성 – 통상공동소송관계 1.5\n(1) 통상공동소송관계 의의\n통상공동소송관계란 공동소송인간 합일확정 요하지 않는 관계다.\n(2) 통상공동소송관계 심리방식 – 독립의 원칙 [제66조]\n통상공동소송인들은 제66조 독립의 원칙에 따라 1인의 소송행위\n가 다른 공동소송인에게 영향을 미치지 않는다.\n(3) 사안\n乙, 丙은 채무자와 연대보증인이므로 합일확정 요청되거나 판결효\n력이 상호간 미치지 않아 통상공동소송관계이며, 각각에 대한 송\n달 등 소송절차는 상호간 영향 없어 각각의 소송경과에 비추어\n추후보완 가부를 검토한다.\n3. 소송행위의 추후보완 [제173조] 1.5\n(1) 의의 및 취지\n책임질 수 없는 사유로 불변기간을 해태한 경우, 판결의 확정 등\n치명적인 불이익 구제하기 위해 소송행위의 추후보완을 인정한다.\n(2) 요건\nⅰ)당사자가 책임질 수 없는 사유로 인해 ⅱ)소송상 불변기간을\n지키지 못했을 것을 요한다.\n(3) 사안\n乙, 丙은 ⅰ)불변기간인 항소기간을 해태하였는바 ⅱ)그것이 乙,\n丙의 책임질 수 없는 사유에 의한 것인지 판단해야 한다.\n4. 책임질 수 없는 사유 인정 여부 3.5\n(1) 判例\n1)처음부터 공시송달된 경우\n처음부터 소장부본 등의 서류가 공시송달된 경우 소제기 사실을\n알면서 고의로 행방을 감추는 등 특별한 사정 없는한 공시송달\n사실을 모른데 과실이 없어 추완항소 가능하다고 한다.\n2)소송도중 공시송달된 경우\n처음엔 통상송달에 의해 소송이 진행되다가 피고가 주소를 옮기\n고도 주소변경신고를 안해 공시송달 된 경우, 소송진행을 알아볼\n의무가 있어 당사자에게 과실 있다고 하여 추완상소를 부정한다.\n(2) 사안\nⅰ)乙은 처음 소장부본이 주소지로 통상송달 되었고 이후에 판결\n정본이 공시송달되어 소송진행을 알아볼 의무가 있는바 책임질\n수 없는 사유 부정된다.\nⅱ)丙은 처음 소장부본부터 공시송달되었고 고의로 소송 회피한\n사정 없어 소송진행을 모른데 책임질 수 없는 사유 인정된다.\n5. 추후보완 시기 충족 여부 4.5\n(1) 원칙 [제173조 1항]\n소송행위의 추후보완은 장애 사유가 없어진 날부터 2주내 한다.\n(2) 공시송달의 경우\n判例는 공시송달의 경우, 단순히 판결이 있었던 사실을 안 때가\n아니고, 나아가 판결이 공시송달 방법으로 송달된 사실을 안 때부\n터 장애사유가 없어진 것으로 본다.\n(3) 공시송달로 판결이 이루어진 것을 안 때의 의미\n判例는 당사자가 판결이 공시송달의 방법으로 송달된 사실을 안\n때는 통상적으로 당사자나 소송대리인이 사건기록을 열람하거나\n판결정본을 영수한 때로 볼 수 있다고 한다.\n(4) 판결이 공시송달된 것을 안 것으로 인정할 수 있는 경우\n判例는 당해 판결이 있었던 사실을 알았고 사회통념상 그 경위에\n대해 당연히 알아볼만한 특별한 사정이 있었다고 인정되는 경우\n그 경위에 대해 알아보는데 통상 소요되는 시간이 경과한 때 판\n결이 공시송달 방법으로 송달된 사실을 알게 된 것으로 본다.\n(5) 사안\n乙, 丙은 후소에서 송달받은 준비서면에 제1심 판결문 사본이 첨\n부되어 있어 판결이 있었던 것을 알았을 것이고, 21.7.5. 대법원\n시스템을 통해 제1심 재판 존재를 알게되어 이때 판결이 공시송\n달 된 것을 알아 책임질 수 없는 사유 소멸일로 볼 수 있고 丙은\n그로부터 2주내 추후보완 항소제기해야 한다.\n6. 사안해결 1\n(1) 乙은 소송진행을 모른데 책임질 수 없는 사유가 부정되어 그의\n추후보완 항소는 부적법하다.\n(2) 丙은 소송진행을 모른데 책임질 수 없는 사유 될 수 있는 점에 따라 단순병합\n으로 볼 것이다. ⅱ)사안에서 본래 급부인 회복등기이행청구 현존\n함을 전제로 이것이 집행불능 되는 경우에 대비하여 전보배상으\n로 3억 원의 지급을 미리 구하는 경우, 이는 현재이행의 소와 장\n래이행의 소의 단순병합으로 볼 것이다.\n4. 대상청구의 장래이행의 소 요건 충족 여부 3\n(1) 장래이행의 소 의의 및 요건 [제251조] [기계미]\n1)변론종결시 기준 이행기가 장래에 도래하는 청구권을 주장하며\n제기하는 소로 미리 집행권원 얻어 두었다가 이행기 도래시 즉시\n강제집행하기 위함이다.\n2)①청구권 발생 기초가 되는 법률관계가 변론종결시 존재하고, ②\n그러한 상태가 이행기까지 계속될 것이 예상되어야 하며, ③미리\n청구할 필요가 있어야 한다.\n(2) 사안\n①근저당권설정등기 불법말소의 법률관계가 변론종결시 존재하고,\n②회득등기절차 이행의 집행불능 조건성취 개연성 충분하고 ③현\n재 乙이 회복등기의무를 해태하고 있어 미리청구할 필요 있다.\n5. 사안해결 0.5\n甲의 청구는 단순병합이며 장래이행소 요건 갖추어 적법하다.", "categories": {"toc": "1. 문제의 소재\n2. 대상청구의 종류\n3. 집행불능 대비 대상청구의 병합 형태\n4. 대상청구의 장래이행의 소 요건 충족 여부\n5. 사안해결", "purpose": "(장래이행의 소) 변론종결시 기준 이행기가 장래에 도래하는 청구권을 주장하며 제기하는 소로 미리 집행권원 얻어 두었다가 이행기 도래시 즉시 강제집행하기 위함이다.", "article": "제251조", "elements": "(장래이행의 소 [기계미]) ①청구권 발생 기초가 되는 법률관계가 변론종결시 존재하고, ②그러한 상태가 이행기까지 계속될 것이 예상되어야 하며, ③미리 청구할 필요가 있어야 한다.", "theory": "ⅰ)순서를 붙여 청구한바, 부진정 예비적 병합이라는 견해 ⅱ)본래 급부청구가 기각될 것을 조건으로 한 청구가 아니므로 단순병합으로 보는 견해 있다.", "cases": "[본현집 현장단] 본래 급부청구의 현존함 전제로 이것이 집행불능이 되는 경우에 대비하여 전보배상을 미리 청구하는 경우, 양자의 병합은 현재 급부청구와 장래 급부청구의 단순병합에 속하는 것으로 허용된다.", "resolution": "甲의 청구는 단순병합이며 장래이행소 요건 갖추어 적법하다."}}, {"no": 2, "points": 10, "question": "제1심 법원이 주위적 청구를 인용하면서 예비적 청구를 기각하였는데, 甲\n만이 예비적 청구 부분에 대해 항소를 제기하였다. 항소심의 심리 결과 법\n원은 주위적 청구와 예비적 청구 모두 이유 없다는 심증을 가지게 되어 두\n청구 모두를 기각하는 판결을 선고하였다. 이러한 법원의 판단이 적법한지\n설명하시오.", "answer": "1. 문제의 소재 0.5\n甲의 청구는 단순병합의 형태로 볼 수 있다. 甲이 예비적 청구에\n대해서만 불복한바 불복하지 않은 주위적 청구도 항소심으로 이\n심되는지 여부 및 항소심 심판대상이 되는지 여부를 검토한다.\n2. 예비적 청구에 대한 불복으로 주위적 청구 이심 여부 3\n(1) 상소불가분원칙 의의 및 취치\n상소로 인한 확정차단 및 이심 효력은 원판결 전부에 미친다. 상\n소심에서의 심판범위 확장이 가능하도록 하기 위함이다.\n(2) 단순병합의 경우\n1)判例\n수개의 청구가 하나의 판결로 이루어진 경우 그 중 한 청구에 대\n해 불복시 모든 청구가 확정차단되고 항소심으로 이심된다.\n2)학설 ⅰ)判例와 같은 견해 있으나 ⅱ)반대견해는 형식적으로 하\n나의 판결이지만 실질적으로 수개의 청구이므로 불복하지 않은\n청구는 항소심으로 이심되지 않고 분리확정된다고 한다.\n3)검토 및 사안\nⅰ)생각건대 전부판결에 대해서는 심판범위 확장을 위해 상소불\n가분원칙 적용이 타당하다. ⅱ)사안에서 甲은 예비적 청구만 불복\n했지만 1심은 전부판결인바 주위적 청구도 확정차단되고 항소심\n으로 이심된다.\n3. 주위적 청구가 항소심 심판대상이 되는지 여부 1.5\n(1) 불이익변경금지원칙 의의 및 취지 [제415조]\n1심판결은 당사자가 불복한 한도 내에서 변경 가능하다. 항소심에\n서 처분권주의 발현이다.\n(2) 사안\n甲은 예비적 청구에 대해서만 불복하여 이 부분만 항소심 심판대\n상이되고 주위적 청구는 항소심 심판대상이 되지 않아 이 부분을\n심판할 수 없다.\n4. 사안해결 0.5\n甲의 예비적 청구 불복으로 주위적 청구도 확정차단되어 항소심\n으로 함께 이심되나 불복 대상이 아니어서 항소심 심판대상이 아\n님에도 항소심이 이를 심판하여 청구기각한바 부적법하다.\n- 이 하 여 백 -", "categories": {"toc": "1. 문제의 소재\n2. 예비적 청구에 대한 불복으로 주위적 청구 이심 여부\n3. 주위적 청구가 항소심 심판대상이 되는지 여부\n4. 사안해결", "purpose": "(상소불가분원칙) 상소로 인한 확정차단 및 이심 효력은 원판결 전부에 미친다. 상소심에서의 심판범위 확장이 가능하도록 하기 위함이다.\n(불이익변경금지원칙) 1심판결은 당사자가 불복한 한도 내에서 변경 가능하다. 항소심에서 처분권주의 발현이다.", "article": "제415조", "elements": "", "theory": "(단순병합 이심) ⅰ)判例와 같은 견해 있으나 ⅱ)반대견해는 형식적으로 하나의 판결이지만 실질적으로 수개의 청구이므로 불복하지 않은 청구는 항소심으로 이심되지 않고 분리확정된다고 한다.", "cases": "수개의 청구가 하나의 판결로 이루어진 경우 그 중 한 청구에 대해 불복시 모든 청구가 확정차단되고 항소심으로 이심된다.", "resolution": "甲의 예비적 청구 불복으로 주위적 청구도 확정차단되어 항소심으로 함께 이심되나 불복 대상이 아니어서 항소심 심판대상이 아님에도 항소심이 이를 심판하여 청구기각한바 부적법하다."}}]}, {"subject": "민사소송법", "exam": "59회", "year": 2022, "problemNo": 1, "points": 30, "passage": "의사 甲에 대해 의료사고에 따른 손해배상채권을 가지고 있는 丙은 甲을 상대로\n조정신청을 하면서, 적극적 손해 중 기왕치료비 1억 원을 청구하고, 향후치료비는\n유사 판례에 근거하여 개별 항목별로 금액을 산정하여 총 1억 원을 청구하되,\n향후 소송 시 신체감정 결과에 따라 확정하여 청구한다는 취지를 밝히고, 또한\n위자료로 1억 원을 청구하였는데, 조정이 성립되지 않아 소송으로 이행되었다.\n한편 이 무렵, 甲은 친구 乙과 통모하여 乙이 甲을 상대로 甲 소유의 부동산(이\n사건 부동산)에 관하여 점유취득시효 완성을 원인으로 한 소유권이전등기절차의\n이행을 구하는 소를 제기하도록 하였고, 甲은 乙의 주장을 모두 인정하는 취지의\n답변서를 제출하여 위 답변서 부본이 乙에게 송달되었으며, 甲과 乙은 위 청구\n내용과 같은 취지의 화해권고결정을 받아 이를 확정시키고 이에 따라 乙 앞으로\n이 사건 부동산에 관한 소유권이전등기(이 사건 등기)가 마쳐졌다. 그러자 丙은\n甲과 乙 사이에 이 사건 부동산에 관해 허위의 양도합의가 있었고 이는 사해행\n위에 해당한다고 주장하면서 乙을 상대로 사해행위 취소 및 원상회복(이 사건 등\n기의 말소) 청구소송을 제기하였다.", "subquestions": [{"no": 1, "points": 10, "question": "丙의 乙에 대한 소(訴)가 선행 화해권고결정의 기판력에 반하는지 검토하\n시오.", "answer": "1. 문제의 소재 0.5\n丙은 乙에 대해 사해행위취소소송을 제기하였는바 그 법적 성질\n에 비추어 후소가 甲, 乙의 화해권고결정 기판력 주관적 범위에\n해당하는지 여부 및 후소에의 작용 여부를 검토한다.\n2. 기판력 의의 및 취지 1\n판결모순 방지 및 법적 안정성 위해 확정된 종국판결 내용이 후\n소에 대해 갖는 구속력이다.\n3. 기판력 주관적 범위 1\n(1) 상대성원칙\n전소에 참여할 수 없었던 제3자 절차권 보장 위해 전소 기판력은\n전소 당사자 간에만 미침이 원칙이다.\n(2) 사안\n화해권고결정 당사자는 甲, 乙이고, 후소 당사자는 丙, 乙인바 당\n사자가 달라 기판력 주관적 범위에 해당되지 않는다.\n4. 기판력 객관적 범위 및 작용국면 5\n(1) 객관적 범위\n1)원칙 [제216조 1항]\n오판시정 및 신속결론 위해 기판력은 판결 주문 판단에 발생한다.\n2)화해권고결정의 경우 [제220조]\nⅰ)화해권고결정은 재판상 화해, 확정판결과 동일한 효력을 가지\n며 ⅱ)결정사항에 기판력 발생한다. ⅲ)判例는 화해로 종전 법률\n관계를 바탕으로 한 권리의무 소멸하고 화해에 따른 새로운 법률\n관계가 형성된다고 하여 창설효 인정한다.\n(2) 작용국면\n전소 기판력이 후소에 동일, 선결, 모순관계로 작용할 수 있다.\n(3) 확정판결로 경료된 등기를 사해행위취소로 말소하는 경우\n判例는 ⅰ)사해행위취소소송은 채권자와 수익자 사이에 상대효를\n가져 ⅱ)채무자와 수익자 사이 확정판결을 통해 마쳐진 소유권이\n전등기가 사해행위취소로 말소되어도 확정판결 효력에 반하거나\n모순되는 것은 아니라고 한다.\n(4) 사안\n甲, 乙의 화해권고결정은 재판상 화해, 확정판결과 동일한 효력\n있어 甲이 소유권이전등기청구권 인정된다는 점에 기판력 발생하\n나 丙의 후소 사해행위취소청구로 위 확정판결에 기해 경료된 등\n기가 말소된다고 해도 기판력에 저촉되는 것은 아니다.\n5. 사안해결 0.5\n후소는 화해권고결정 기판력에 반하지 않는다.", "categories": {"toc": "1. 문제의 소재\n2. 기판력 의의 및 취지\n3. 기판력 주관적 범위\n4. 기판력 객관적 범위 및 작용국면\n5. 사안해결", "purpose": "판결모순 방지 및 법적 안정성 위해 확정된 종국판결 내용이 후소에 대해 갖는 구속력이다.\n(화해권고결정) 화해권고결정은 재판상 화해, 확정판결과 동일한 효력을 가지며 결정사항에 기판력 발생한다.", "article": "제216조 1항, 제220조", "elements": "", "theory": "", "cases": "(화해 창설효) 화해로 종전 법률관계를 바탕으로 한 권리의무 소멸하고 화해에 따른 새로운 법률관계가 형성된다고 하여 창설효 인정한다.\n(사해행위취소) ⅰ)사해행위취소소송은 채권자와 수익자 사이에 상대효를 가져 ⅱ)채무자와 수익자 사이 확정판결을 통해 마쳐진 소유권이전등기가 사해행위취소로 말소되어도 확정판결 효력에 반하거나 모순되는 것은 아니다.", "resolution": "후소는 화해권고결정 기판력에 반하지 않는다."}}, {"no": 2, "points": 10, "question": "丙의 乙에 대한 채권자취소소송(전소)에서 丙의 승소 확정판결이 내려졌고\n그 뒤 甲에 대해 대여금채권을 가지고 있던 丁이 자신의 채권을 보전하기\n위해 乙을 상대로 전소와 같은 취지의 사해행위 취소 및 원상회복 청구소송\n(후소)을 제기하였다. 乙은 후소의 변론기일에 후소에는 전소의 기판력이\n미친다거나 또는 권리보호이익이 없다고 주장한다. 乙의 주장에 대해 법원\n은 어떤 판단을 하여야 하는지를 설명하시오.", "answer": "1. 문제의 소재 0.5\n각 사해행위취소소송을 제기하는 채권자 상호간 기판력이 미치는\n지 주관적 범위, 객관적 범위 검토하고 한 청구가 승소확정된 경\n우 다른 청구가 권리보호이익이 없어지는지 검토한다.\n2. 사해행위취소소송의 의의 및 법적성질 1\n(1) 의의 및 취지 [민법 제406조]\n채권자 보호 위해 채무자가 채권자 해함을 알고 재산권에 관한\n법률행위 한 때 채권자가 취소 및 원상회복을 구하는 소송이다.\n(2) 법적성질\nⅰ)이행소송설, 형성소송설, 병합설 있다. ⅱ)判例는 사해행위추소\n소송은 사해행위를 채권자, 수익자 사이에서 상대적으로 취소하고\n책임재산 회복하는 상대효를 갖는다고 한다.\n3. 기판력 저촉 여부 2\n(1) 주관적 범위\n전소는 丙, 乙이 당사자고 후소는 丁, 乙이 당사자인바 전소 기판\n력 주관적 범위에 해당되지 않는다.\n(2) 객관적 범위 및 작용국면\n1)判例는 사해행위취소소송은 채권자들이 각자 고유의 권리 행사하\n여 재산처분 행위를 취소하고 원상회복을 구하는 것이라고 한다.\n2)사안에서 丙, 丁은 각자 고유의 채권자취소권을 행사하는 것이므\n로 전소 기판력이 후소에 작용하지 않는다.\n4. 권리보호이익 흠결 여부 3.5\n(1) 권리보호이익 의의 및 취지\n남소방지 위해 소를 제기할 현실적 필요성이 있을 것을 요한다.\n(2) 判例\n1)한 채권자 승소확정판결 받은 경우\n한 채권자가 동일 사해행위에 관해 채권자취소 및 원상회복청구\n하여 승소판결 확정되었다는 것만으로 다른 채권자의 동일한 청\n구가 권리보호이익이 흠결되는 것은 아니다.\n2)한 채권자 승소확정판결 후 책임재산 회복까지 마친 경우\n한 채권자가 동일 사해행위에 관해 채권자취소 및 원상회복청구\n하여 승소판결 확정되고 재산 회복을 마치면 다른 채권자의 채권\n자취소 및 원상회복청구는 그와 중첩되는 범위 내에서 권리보호\n이익이 없다.\n(3) 사안\n전소 사해행위취소소송 원고 丙은 승소확정판결을 받았을 뿐 책\n임재산 회복까지 마친 것은 아니므로 다른 채권자인 丁의 사해행\n위취소소송이 권리보호이익 흠결되는 것은 아니다.\n5. 사안해결 0.5\n기판력저촉, 권리보호이익 흠결에 대한 乙주장 부당해 배척한다.", "categories": {"toc": "1. 문제의 소재\n2. 사해행위취소소송의 의의 및 법적성질\n3. 기판력 저촉 여부\n4. 권리보호이익 흠결 여부\n5. 사안해결", "purpose": "(사해행위취소소송 의의) 채권자 보호 위해 채무자가 채권자 해함을 알고 재산권에 관한 법률행위 한 때 채권자가 취소 및 원상회복을 구하는 소송이다.\n(권리보호이익) 남소방지 위해 소를 제기할 현실적 필요성이 있을 것을 요한다.", "article": "민법 제406조", "elements": "", "theory": "(법적성질) ⅰ)이행소송설, 형성소송설, 병합설 있다.", "cases": "(법적성질) 사해행위취소소송은 사해행위를 채권자, 수익자 사이에서 상대적으로 취소하고 책임재산 회복하는 상대효를 갖는다.\n(고유 권리행사) 사해행위취소소송은 채권자들이 각자 고유의 권리 행사하여 재산처분 행위를 취소하고 원상회복을 구하는 것이라고 한다.\n(권리보호이익) 1)한 채권자가 동일 사해행위에 관해 채권자취소 및 원상회복청구하여 승소판결 확정되었다는 것만으로 다른 채권자의 동일한 청구가 권리보호이익이 흠결되는 것은 아니다. 2)한 채권자가 동일 사해행위에 관해 채권자취소 및 원상회복청구하여 승소판결 확정되고 재산 회복을 마치면 다른 채권자의 채권자취소 및 원상회복청구는 그와 중첩되는 범위 내에서 권리보호이익이 없다.", "resolution": "기판력저촉, 권리보호이익 흠결에 대한 乙주장 부당해 배척한다."}}, {"no": 3, "points": 10, "question": "丙이 甲을 상대로 제기한 위 손해배상 청구소송(전소)에서 甲이 답변서도\n한 제출하지 않고 변론기일에 불출석하여, 丙의 신체감정 등이 이루어지지 않\n은 상태에서, ‘피고(甲)는 원고(丙)에게 위 조정신청 내용과 같은 금액 및\n이에 대한 지연손해금을 지급하라’는 내용의 자백간주에 의한 전부승소판\n결이 선고되어 확정되었다. 그 후 丙은 甲에 대해 전소에서 인정된 금액을\n제외한 나머지 적극적 손해에 대한 배상금 1억 원과 추가 위자료 1억 원\n및 이에 대한 지연손해금을 청구하는 소(후소)를 제기하였다. 이 경우 전\n소판결의 기판력이 후소에 미치는지 검토하시오.", "answer": "1. 문제의 소재 1\n전후소 丙, 甲로 당사자 동일해 기판력 주관적 범위 해당한다. 손\n해배상청구의 소송물 나누어 기판력의 객관적 범위 검토한 후 각\n소송물에 대한 전소가 명시적 일부청구인지에 따라 후소에 작용\n할 수 있는지 논한다.\n2. 기판력 객관적 범위 2.5\n(1) [216조 1항] 기판력은 전소 판결 주문 판단에 발생한다.\n(2) 신체상해로 인한 손해배상청구 소송물\n1)判例\n불법행위로 인한 신체상해 손해배상청구시 소송물은 치료비인 적\n극적 손해, 일실이익 상실의 소극적 손해 정신적 손해 3개다.\n2)학설 ⅰ)손해3개설 있다. ⅱ)전체 손해액에 주된 관심 있어 손해1\n개설 ⅲ)재산상 손해, 정신적 손해는 성질이 달라 손해2개설있다.\n3)검토 및 사안\nⅰ)생각건대 명확한 손해 특정을 위해 판시 타당하며 ⅱ)사안에\n서 전소 기판력은 1억 원 적극적 손해배상청구권 및 1억 원 위자\n료청구권 존재에 발생한다.\n3. 기판력 작용국면 4.5\n(1) 전소 기판력은 후소에 동일, 선결, 모순관계로 작용할 수 있다.\n(2) 전소 일부청구 기판력이 후소 잔부청구에 작용 여부\n1)判例\n①치료비청구하며 일부만 특저아고 그 외 부분은 별도로 청구하\n겠다는 취지를 명시적으로 유보하면 소송물은 일부 치료비에 한\n정되며 ②명시적 일부청구시 소송물은 채권 일부이지 전부는 아\n니므로 일부청구 기판력은 후소 잔부청구에 미치지 않는다.\n2)학설 ⅰ)일부청구긍정설은 ①당사자 의사 고려해 소송물은 일부\n이므로 ②잔부청구 후소에 기판력 작용하지 않는다고 한다. ⅱ)명\n시설은 ①일부청구임을 명시적으로 특정한 경우 소송물은 일부이\n며 ②명시적 일부청구인 경우에만 잔부청구 후소에 기판력 작용\n하지 않는다고 한다. ⅲ)일부청구부정설은 ①1회적 분쟁해결 위해\n소송물은 전부인바 ②잔부청구는 전소 기판력에 저촉된다고 한다.\n(3) 검토 및 사안\nⅰ)생각건대 당사자 의사 및 1회적 해결 조화한 명시설 타당하다.\nⅱ)사안에서 전소 적극적 손해는 1억 원만 일부청구하고 향후 치\n료비는 추후 청구한다는 취지 밝혀 명시적 일부청구인바 전소 소\n송물은 1억 원에 국한되고 후소 적극적 손해청구에 작용하지 않\n는다. 전소 위자료는 일부청구임을 명시하지 않아 소송물은 전부\n이며 후소 위자료청구에 전소 기판력 동일관계로 작용할 수 있다.\n4. 사안해결 0.5\n전소 기판력은 적극적 손해 및 지연손해금에 안 미치나, 위자료\n및 지연손해금에는 동일관계로 작용하여 미친다.", "categories": {"toc": "1. 문제의 소재\n2. 기판력 객관적 범위\n3. 기판력 작용국면\n4. 사안해결", "purpose": "[216조 1항] 기판력은 전소 판결 주문 판단에 발생한다.", "article": "제216조 1항", "elements": "", "theory": "(손해배상 소송물) ⅰ)손해3개설 있다. ⅱ)전체 손해액에 주된 관심 있어 손해1개설 ⅲ)재산상 손해, 정신적 손해는 성질이 달라 손해2개설 있다.\n(일부청구 기판력) ⅰ)일부청구긍정설은 ①당사자 의사 고려해 소송물은 일부이므로 ②잔부청구 후소에 기판력 작용하지 않는다고 한다. ⅱ)명시설은 ①일부청구임을 명시적으로 특정한 경우 소송물은 일부이며 ②명시적 일부청구인 경우에만 잔부청구 후소에 기판력 작용하지 않는다고 한다. ⅲ)일부청구부정설은 ①1회적 분쟁해결 위해 소송물은 전부인바 ②잔부청구는 전소 기판력에 저촉된다고 한다.", "cases": "(손해배상 소송물) 불법행위로 인한 신체상해 손해배상청구시 소송물은 치료비인 적극적 손해, 일실이익 상실의 소극적 손해 정신적 손해 3개다.\n(일부청구) ①치료비청구하며 일부만 특정하고 그 외 부분은 별도로 청구하겠다는 취지를 명시적으로 유보하면 소송물은 일부 치료비에 한정되며 ②명시적 일부청구시 소송물은 채권 일부이지 전부는 아니므로 일부청구 기판력은 후소 잔부청구에 미치지 않는다.", "resolution": "전소 기판력은 적극적 손해 및 지연손해금에 안 미치나, 위자료 및 지연손해금에는 동일관계로 작용하여 미친다."}}]}, {"subject": "민사소송법", "exam": "59회", "year": 2022, "problemNo": 2, "points": 20, "passage": "甲이 정당한 이유 없이 X 토지(이 사건 토지)를 甲 소유 건물의 주차장 진출입로\n로 수년 간 사용하고 있었는데, 이 사건 토지의 소유자라고 주장하는 乙이 이\n사건 토지 부분에 펜스(이 사건 펜스)를 설치함으로써 甲의 주차장 출입을\n막았다. 그러자 甲은 제1심 법원에 乙이 이 사건 펜스 소 적법하다.", "resolution": "본권에 기한 항소심 반소는 심급의 이익 해하지 않으면 적법하다."}}]}, {"subject": "민사소송법", "exam": "59회", "year": 2022, "problemNo": 3, "points": 30, "passage": "甲은 마을 모퉁이에 자신의 자동차를 잠시 주차하였는데 그 옆에 기울어져 있던\n공작물이 갑자기 쓰러지는 바람에 자신의 자동차가 파손됨은 물론 인신사고로\n상해를 입게 되었다. 이에 甲은 공작물의 설치 또는 보존에 하자가 있음을\n이유로 하여 공작물의 점유자인 乙을 주위적 피고로, 이것이 인용되지 아니할\n경우에 대비하여 공작물의 공유자인 丙, 丁을 예비적 피고로 하여 손해배상을\n구하는 소를 제기하였다.", "subquestions": [{"no": 1, "points": 8, "question": "제1심 법원이 乙에 대한 甲의 청구를 일부 인용하면서 丙, 丁에 대한 청구에\n대해서는 판결을 하지 않은 경우, 이러한 법원의 판결이 허용되는지 여부에\n대하여 설명하시오.", "answer": "1. 문제의 소재 0.5\n乙과 丙, 丁에 대한 청구가 주관적 예비적 병합에 해당하는지 검\n토하여 한 청구 판단하지 않은 일부판결이 적법한지 논한다.\n2. 주관적 예비적 병합 해당 여부 1.5\n(1) 의의·취지 및 허용 여부 [제70조 1항]\nⅰ)공동소송인 가운데 일부에 대한 청구가 다른 공동소송인에 대\n한 청구와 법률상 불가능한 경우 제67조 내지 제69조 준용한다.\nⅱ)종래 불허견해 있었으나 02개정법은 분쟁의 1회적 해결, 재판\n통일 위해 모든 공동소송인에 대해 심판하도록 하여 허용하였다.\n(2) 요건 충족 여부\n判例에 따르면 ⅰ)乙과 丙, 丁은 乙손해바상의무 긍정 또는 부정\n시 丙, 丁손해배상의무 부정 또는 긍정되어 법률상 양립불가능한\n관계이며 ⅱ)공동소송요건 갖추어 주관적 예비적 병합관계다.\n3. 주관적 예비적 병합 심판방식 및 일부판결 가부 3\n(1) [제70조 1항 및 2항]\nⅰ)합일확정 요청되므로 제67조 내지 제69조 준용한다. 취하, 포\n기, 인낙, 화해는 각자 할 수 있다. ⅱ)법원은 모든 공동소송인에\n대해 심판한다.\n(2) 일부판결 가부\n判例는 예비적 공동소송에서 일부 공동소송인에 관한 청구만 판\n결하면 이는 일부판결이 아닌 흠이 있는 전부판결이라 한다.\n(3) 사안\n법원은 제70조 2항에 따라 乙, 丙, 丁에 대한 모든 청구를 심판하\n여야 하며 乙청구 일부인용하면서 丙, 丁에 대한 청구 판결하지\n않아 이는 흠이 있는 전부판결이다.\n4. 사안해결 0.5\n乙, 丙, 丁은 주관적 예비적 병합관계에 있으며 일부 공동소송인\n에 대해 판결하지 않는 것은 허용되지 않는다.", "categories": {"toc": "1. 문제의 소재\n2. 주관적 예비적 병합 해당 여부\n3. 주관적 예비적 병합 심판방식 및 일부판결 가부\n4. 사안해결", "purpose": "(주관적 예비적 병합) 공동소송인 가운데 일부에 대한 청구가 다른 공동소송인에 대한 청구와 법률상 불가능한 경우 제67조 내지 제69조 준용한다. 02개정법은 분쟁의 1회적 해결, 재판통일 위해 모든 공동소송인에 대해 심판하도록 하여 허용하였다.", "article": "제70조 1항, 제70조 2항, 제67조, 제68조, 제69조", "elements": "(요건) 判例에 따르면 ⅰ)乙과 丙, 丁은 乙손해배상의무 긍정 또는 부정시 丙, 丁손해배상의무 부정 또는 긍정되어 법률상 양립불가능한 관계이며 ⅱ)공동소송요건 갖추어 주관적 예비적 병합관계다.", "theory": "", "cases": "예비적 공동소송에서 일부 공동소송인에 관한 청구만 판결하면 이는 일부판결이 아닌 흠이 있는 전부판결이라 한다.", "resolution": "乙, 丙, 丁은 주관적 예비적 병합관계에 있으며 일부 공동소송인에 대해 판결하지 않는 것은 허용되지 않는다."}}, {"no": 2, "points": 14, "question": "乙에 대한 甲의 청
