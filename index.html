아니하다. <개정 2016. 3. 29.>"}, {"no": 334, "no_str": "제334조", "title": "감정의무", "body": "①감정에 필요한 학식과 경험이 있는 사람은 감정할 의무를 진다.\n②제314조 또는 제324조의 규정에 따라 증언 또는 선서를 거부할 수 있는 사람과 제322조에 규정된 사람은 감정인\n이 되지 못한다."}, {"no": 335, "no_str": "제335조", "title": "감정인의 지정", "body": "감정인은 수소법원ㆍ수명법관 또는 수탁판사가 지정한다."}, {"no": 335, "no_str": "제335조의2", "title": "감정인의 의무", "body": "① 감정인은 감정사항이 자신의 전문분야에 속하지 아니하는 경우 또는 그에 속하더라도\n다른 감정인과 함께 감정을 하여야 하는 경우에는 곧바로 법원에 감정인의 지정 취소 또는 추가 지정을 요구하여야\n한다.\n② 감정인은 감정을 다른 사람에게 위임하여서는 아니 된다.\n[본조신설 2016. 3. 29.]"}, {"no": 336, "no_str": "제336조", "title": "감정인의 기피", "body": "감정인이 성실하게 감정할 수 없는 사정이 있는 때에 당사자는 그를 기피할 수 있다. 다만, 당\n사자는 감정인이 감정사항에 관한 진술을 하기 전부터 기피할 이유가 있다는 것을 알고 있었던 때에는 감정사항에\n관한 진술이 이루어진 뒤에 그를 기피하지 못한다."}, {"no": 337, "no_str": "제337조", "title": "기피의 절차", "body": "①기피신청은 수소법원ㆍ수명법관 또는 수탁판사에게 하여야 한다.\n②기피하는 사유는 소명하여야 한다.\n③기피하는 데 정당한 이유가 있다고 한 결정에 대하여는 불복할 수 없고, 이유가 없다고 한 결정에 대하여는 즉시\n항고를 할 수 있다."}, {"no": 338, "no_str": "제338조", "title": "선서의 방식", "body": "선서서에는 “양심에 따라 성실히 감정하고, 만일 거짓이 있으면 거짓감정의 벌을 받기로 맹세합\n니다.”라고 적어야 한다."}, {"no": 339, "no_str": "제339조", "title": "감정진술의 방식", "body": "①재판장은 감정인으로 하여금 서면이나 말로써 의견을 진술하게 할 수 있다.\n②재판장은 여러 감정인에게 감정을 명하는 경우에는 다 함께 또는 따로따로 의견을 진술하게 할 수 있다.\n③ 법원은 제1항 및 제2항에 따른 감정진술에 관하여 당사자에게 서면이나 말로써 의견을 진술할 기회를 주어야 한\n다.<신설 2016. 3. 29.>"}, {"no": 339, "no_str": "제339조의2", "title": "감정인신문의 방식", "body": "① 감정인은 재판장이 신문한다.\n② 합의부원은 재판장에게 알리고 신문할 수 있다.\n③ 당사자는 재판장에게 알리고 신문할 수 있다. 다만, 당사자의 신문이 중복되거나 쟁점과 관계가 없는 때, 그 밖에\n필요한 사정이 있는 때에는 재판장은 당사자의 신문을 제한할 수 있다.\n[본조신설 2016. 3. 29.]"}, {"no": 339, "no_str": "제339조의3", "title": "비디오 등 중계장치 등에 의한 감정인신문", "body": "① 법원은 다음 각 호의 어느 하나에 해당하는 사람을 감정인으\n로 신문하는 경우 상당하다고 인정하는 때에는 당사자의 의견을 들어 비디오 등 중계장치에 의한 중계시설을 통하\n여 신문하거나 인터넷 화상장치를 이용하여 신문할 수 있다.\n1. 감정인이 법정에 직접 출석하기 어려운 특별한 사정이 있는 경우\n2. 감정인이 외국에 거주하는 경우\n② 제1항에 따른 감정인신문에 관하여는 제327조의2제2항 및 제3항을 준용한다.\n[본조신설 2016. 3. 29.]"}, {"no": 340, "no_str": "제340조", "title": "감정증인", "body": "특별한 학식과 경험에 의하여 알게 된 사실에 관한 신문은 증인신문에 관한 규정을 따른다. 다만, 비\n디오 등 중계장치 등에 의한 감정증인신문에 관하여는 제339조의3을 준용한다. <개정 2016. 3. 29.>"}, {"no": 341, "no_str": "제341조", "title": "감정의 촉탁", "body": "①법원이 필요하다고 인정하는 경우에는 공공기관ㆍ학교, 그 밖에 상당한 설비가 있는 단체 또는\n외국의 공공기관에 감정을 촉탁할 수 있다. 이 경우에는 선서에 관한 규정을 적용하지 아니한다.\n②제1항의 경우에 법원은 필요하다고 인정하면 공공기관ㆍ학교, 그 밖의 단체 또는 외국 공공기관이 지정한 사람으\n로 하여금 감정서를 설명하게 할 수 있다.\n③ 제2항의 경우에는 제339조의3을 준용한다.<신설 2016. 3. 29.>"}, {"no": 342, "no_str": "제342조", "title": "감정에 필요한 처분", "body": "①감정인은 감정을 위하여 필요한 경우에는 법원의 허가를 받아 남의 토지, 주거, 관리중\n인 가옥, 건조물, 항공기, 선박, 차량, 그 밖의 시설물안에 들어갈 수 있다.\n②제1항의 경우 저항을 받을 때에는 감정인은 경찰공무원에게 원조를 요청할 수 있다.<개정 2006. 2. 21., 2020. 12.\n22.>"}, {"no": 343, "no_str": "제343조", "title": "서증신청의 방식", "body": "당사자가 서증(書證)을 신청하고자 하는 때에는 문서를 제출하는 방식 또는 문서를 가진 사\n람에게 그것을 제출하도록 명할 것을 신청하는 방식으로 한다."}, {"no": 344, "no_str": "제344조", "title": "문서의 제출의무", "body": "①다음 각호의 경우에 문서를 가지고 있는 사람은 그 제출을 거부하지 못한다.\n1. 당사자가 소송에서 인용한 문서를 가지고 있는 때\n2. 신청자가 문서를 가지고 있는 사람에게 그것을 넘겨 달라고 하거나 보겠다고 요구할 수 있는 사법상의 권리를 가\n지고 있는 때\n3. 문서가 신청자의 이익을 위하여 작성되었거나, 신청자와 문서를 가지고 있는 사람 사이의 법률관계에 관하여 작\n성된 것인 때. 다만, 다음 각목의 사유 가운데 어느 하나에 해당하는 경우에는 그러하지 아니하다.\n가. 제304조 내지 제306조에 규정된 사항이 적혀있는 문서로서 같은 조문들에 규정된 동의를 받지 아니한 문서\n나. 문서를 가진 사람 또는 그와 제314조 각호 가운데 어느 하나의 관계에 있는 사람에 관하여 같은 조에서 규정\n된 사항이 적혀 있는 문서\n다. 제315조제1항 각호에 규정된 사항중 어느 하나에 규정된 사항이 적혀 있고 비밀을 지킬 의무가 면제되지 아\n니한 문서\n②제1항의 경우 외에도 문서(공무원 또는 공무원이었던 사람이 그 직무와 관련하여 보관하거나 가지고 있는 문서를\n제외한다)가 다음 각호의 어느 하나에도 해당하지 아니하는 경우에는 문서를 가지고 있는 사람은 그 제출을 거부하\n지 못한다.\n1. 제1항제3호나목 및 다목에 규정된 문서\n2. 오로지 문서를 가진 사람이 이용하기 위한 문서"}, {"no": 345, "no_str": "제345조", "title": "문서제출신청의 방식", "body": "문서제출신청에는 다음 각호의 사항을 밝혀야 한다.\n1. 문서의 표시\n2. 문서의 취지\n3. 문서를 가진 사람\n4. 증명할 사실\n5. 문서를 제출하여야 하는 의무의 원인"}, {"no": 346, "no_str": "제346조", "title": "문서목록의 제출", "body": "제345조의 신청을 위하여 필요하다고 인정하는 경우에는, 법원은 신청대상이 되는 문서의\n취지나 그 문서로 증명할 사실을 개괄적으로 표시한 당사자의 신청에 따라, 상대방 당사자에게 신청내용과 관련하여\n가지고 있는 문서 또는 신청내용과 관련하여 서증으로 제출할 문서에 관하여 그 표시와 취지 등을 적어 내도록 명할\n수 있다."}, {"no": 347, "no_str": "제347조", "title": "제출신청의 허가여부에 대한 재판", "body": "①법원은 문서제출신청에 정당한 이유가 있다고 인정한 때에는 결정으로\n문서를 가진 사람에게 그 제출을 명할 수 있다.\n②문서제출의 신청이 문서의 일부에 대하여만 이유 있다고 인정한 때에는 그 부분만의 제출을 명하여야 한다.\n③제3자에 대하여 문서의 제출을 명하는 경우에는 제3자 또는 그가 지정하는 자를 심문하여야 한다.\n④법원은 문서가 제344조에 해당하는지를 판단하기 위하여 필요하다고 인정하는 때에는 문서를 가지고 있는 사람\n에게 그 문서를 제시하도록 명할 수 있다. 이 경우 법원은 그 문서를 다른 사람이 보도록 하여서는 안된다."}, {"no": 348, "no_str": "제348조", "title": "불복신청", "body": "문서제출의 신청에 관한 결정에 대하여는 즉시항고를 할 수 있다."}, {"no": 349, "no_str": "제349조", "title": "당사자가 문서를 제출하지 아니한 때의 효과", "body": "당사자가 제347조제1항ㆍ제2항 및 제4항의 규정에 의한 명령에\n따르지 아니한 때에는 법원은 문서의 기재에 대한 상대방의 주장을 진실한 것으로 인정할 수 있다."}, {"no": 350, "no_str": "제350조", "title": "당사자가 사용을 방해한 때의 효과", "body": "당사자가 상대방의 사용을 방해할 목적으로 제출의무가 있는 문서를 훼손\n하여 버리거나 이를 사용할 수 없게 한 때에는, 법원은 그 문서의 기재에 대한 상대방의 주장을 진실한 것으로 인정\n할 수 있다."}, {"no": 351, "no_str": "제351조", "title": "제3자가 문서를 제출하지 아니한 때의 제재", "body": "제3자가 제347조제1항ㆍ제2항 및 제4항의 규정에 의한 명령에\n따르지 아니한 때에는 제318조의 규정을 준용한다."}, {"no": 352, "no_str": "제352조", "title": "문서송부의 촉탁", "body": "서증의 신청은 제343조의 규정에 불구하고 문서를 가지고 있는 사람에게 그 문서를 보내도\n록 촉탁할 것을 신청함으로써도 할 수 있다. 다만, 당사자가 법령에 의하여 문서의 정본 또는 등본을 청구할 수 있는\n경우에는 그러하지 아니하다."}, {"no": 352, "no_str": "제352조의2", "title": "협력의무", "body": "①제352조에 따라 법원으로부터 문서의 송부를 촉탁받은 사람 또는 제297조에 따른 증거조사의\n대상인 문서를 가지고 있는 사람은 정당한 사유가 없는 한 이에 협력하여야 한다.\n②문서의 송부를 촉탁받은 사람이 그 문서를 보관하고 있지 아니하거나 그 밖에 송부촉탁에 따를 수 없는 사정이\n있는 때에는 법원에 그 사유를 통지하여야 한다.\n[본조신설 2007. 5. 17.]"}, {"no": 353, "no_str": "제353조", "title": "제출문서의 보관", "body": "법원은 필요하다고 인정하는 때에는 제출되거나 보내 온 문서를 맡아 둘 수 있다."}, {"no": 354, "no_str": "제354조", "title": "수명법관ㆍ수탁판사에 의한 조사", "body": "①법원은 제297조의 규정에 따라 수명법관 또는 수탁판사에게 문서에 대한\n증거조사를 하게 하는 경우에 그 조서에 적을 사항을 정할 수 있다.\n②제1항의 조서에는 문서의 등본 또는 초본을 붙여야 한다."}, {"no": 355, "no_str": "제355조", "title": "문서제출의 방법 등", "body": "①법원에 문서를 제출하거나 보낼 때에는 원본, 정본 또는 인증이 있는 등본으로 하여야\n한다.\n②법원은 필요하다고 인정하는 때에는 원본을 제출하도록 명하거나 이를 보내도록 촉탁할 수 있다.\n③법원은 당사자로 하여금 그 인용한 문서의 등본 또는 초본을 제출하게 할 수 있다.\n④문서가 증거로 채택되지 아니한 때에는 법원은 당사자의 의견을 들어 제출된 문서의 원본ㆍ정본ㆍ등본ㆍ초본 등\n을 돌려주거나 폐기할 수 있다."}, {"no": 356, "no_str": "제356조", "title": "공문서의 진정의 추정", "body": "①문서의 작성방식과 취지에 의하여 공무원이 직무상 작성한 것으로 인정한 때에는 이\n를 진정한 공문서로 추정한다.\n②공문서가 진정한지 의심스러운 때에는 법원은 직권으로 해당 공공기관에 조회할 수 있다.\n③외국의 공공기관이 작성한 것으로 인정한 문서에는 제1항 및 제2항의 규정을 준용한다."}, {"no": 357, "no_str": "제357조", "title": "사문서의 진정의 증명", "body": "사문서는 그것이 진정한 것임을 증명하여야 한다."}, {"no": 358, "no_str": "제358조", "title": "사문서의 진정의 추정", "body": "사문서는 본인 또는 대리인의 서명이나 날인 또는 무인(拇印)이 있는 때에는 진정한 것\n으로 추정한다."}, {"no": 359, "no_str": "제359조", "title": "필적 또는 인영의 대조", "body": "문서가 진정하게 성립된 것인지 어떤지는 필적 또는 인영(印影)을 대조하여 증명할 수\n있다."}, {"no": 360, "no_str": "제360조", "title": "대조용문서의 제출절차", "body": "①대조에 필요한 필적이나 인영이 있는 문서, 그 밖의 물건을 법원에 제출하거나 보내\n는 경우에는 제343조, 제347조 내지 제350조, 제352조 내지 제354조의 규정을 준용한다.\n②제3자가 정당한 사유 없이 제1항의 규정에 의한 제출명령에 따르지 아니한 때에 법원은 결정으로 200만원 이하\n의 과태료에 처한다.\n③제2항의 결정에 대하여는 즉시항고를 할 수 있다."}, {"no": 361, "no_str": "제361조", "title": "상대방이 손수 써야 하는 의무", "body": "①대조하는 데에 적당한 필적이 없는 때에는 법원은 상대방에게 그 문자를 손\n수 쓰도록 명할 수 있다.\n②상대방이 정당한 이유 없이 제1항의 명령에 따르지 아니한 때에는 법원은 문서의 진정여부에 관한 확인신청자의\n주장을 진실한 것으로 인정할 수 있다. 필치(筆致)를 바꾸어 손수 쓴 때에도 또한 같다."}, {"no": 362, "no_str": "제362조", "title": "대조용문서의 첨부", "body": "대조하는 데에 제공된 서류는 그 원본ㆍ등본 또는 초본을 조서에 붙여야 한다."}, {"no": 363, "no_str": "제363조", "title": "문서성립의 부인에 대한 제재", "body": "①당사자 또는 그 대리인이 고의나 중대한 과실로 진실에 어긋나게 문서의 진\n정을 다툰 때에는 법원은 결정으로 200만원 이하의 과태료에 처한다.\n②제1항의 결정에 대하여는 즉시항고를 할 수 있다.\n③제1항의 경우에 문서의 진정에 대하여 다툰 당사자 또는 대리인이 소송이 법원에 계속된 중에 그 진정을 인정하\n는 때에는 법원은 제1항의 결정을 취소할 수 있다."}, {"no": 364, "no_str": "제364조", "title": "검증의 신청", "body": "당사자가 검증을 신청하고자 하는 때에는 검증의 목적을 표시하여 신청하여야 한다."}, {"no": 365, "no_str": "제365조", "title": "검증할 때의 감정 등", "body": "수명법관 또는 수탁판사는 검증에 필요하다고 인정할 때에는 감정을 명하거나 증인을\n신문할 수 있다."}, {"no": 366, "no_str": "제366조", "title": "검증의 절차 등", "body": "①검증할 목적물을 제출하거나 보내는 데에는 제343조, 제347조 내지 제350조, 제352조 내지\n제354조의 규정을 준용한다.\n②제3자가 정당한 사유 없이 제1항의 규정에 의한 제출명령에 따르지 아니한 때에는 법원은 결정으로 200만원 이\n하의 과태료에 처한다. 이 결정에 대하여는 즉시항고를 할 수 있다.\n③법원은 검증을 위하여 필요한 경우에는 제342조제1항에 규정된 처분을 할 수 있다. 이 경우 저항을 받은 때에는\n경찰공무원에게 원조를 요청할 수 있다.<개정 2006. 2. 21., 2020. 12. 22.>"}, {"no": 367, "no_str": "제367조", "title": "당사자신문", "body": "법원은 직권으로 또는 당사자의 신청에 따라 당사자 본인을 신문할 수 있다. 이 경우 당사자에게\n선서를 하게 하여야 한다."}, {"no": 368, "no_str": "제368조", "title": "대질", "body": "재판장은 필요하다고 인정한 때에 당사자 서로의 대질 또는 당사자와 증인의 대질을 명할 수 있다."}, {"no": 369, "no_str": "제369조", "title": "출석ㆍ선서ㆍ진술의 의무", "body": "당사자가 정당한 사유 없이 출석하지 아니하거나 선서 또는 진술을 거부한 때에는\n법원은 신문사항에 관한 상대방의 주장을 진실한 것으로 인정할 수 있다."}, {"no": 370, "no_str": "제370조", "title": "거짓 진술에 대한 제재", "body": "①선서한 당사자가 거짓 진술을 한 때에는 법원은 결정으로 500만원 이하의 과태료에\n처한다.\n②제1항의 결정에 대하여는 즉시항고를 할 수 있다.\n③제1항의 결정에는 제363조제3항의 규정을 준용한다."}, {"no": 371, "no_str": "제371조", "title": "신문조서", "body": "당사자를 신문한 때에는 선서의 유무와 진술 내용을 조서에 적어야 한다."}, {"no": 372, "no_str": "제372조", "title": "법정대리인의 신문", "body": "소송에서 당사자를 대표하는 법정대리인에 대하여는 제367조 내지 제371조의 규정을 준\n용한다. 다만, 당사자 본인도 신문할 수 있다."}, {"no": 373, "no_str": "제373조", "title": "증인신문 규정의 준용", "body": "이 절의 신문에는 제309조, 제313조, 제319조 내지 제322조, 제327조, 제327조의2와\n제330조 내지 제332조의 규정을 준용한다. <개정 2021. 8. 17.>"}, {"no": 374, "no_str": "제374조", "title": "그 밖의 증거", "body": "도면ㆍ사진ㆍ녹음테이프ㆍ비디오테이프ㆍ컴퓨터용 자기디스크, 그 밖에 정보를 담기 위하여 만\n들어진 물건으로서 문서가 아닌 증거의 조사에 관한 사항은 제3절 내지 제5절의 규정에 준하여 대법원규칙으로 정\n한다."}, {"no": 375, "no_str": "제375조", "title": "증거보전의 요건", "body": "법원은 미리 증거조사를 하지 아니하면 그 증거를 사용하기 곤란할 사정이 있다고 인정한\n때에는 당사자의 신청에 따라 이 장의 규정에 따라 증거조사를 할 수 있다."}, {"no": 376, "no_str": "제376조", "title": "증거보전의 관할", "body": "①증거보전의 신청은 소를 제기한 뒤에는 그 증거를 사용할 심급의 법원에 하여야 한다. 소\n를 제기하기 전에는 신문을 받을 사람이나 문서를 가진 사람의 거소 또는 검증하고자 하는 목적물이 있는 곳을 관할\n하는 지방법원에 하여야 한다.\n②급박한 경우에는 소를 제기한 뒤에도 제1항 후단에 규정된 지방법원에 증거보전의 신청을 할 수 있다.\n\n— 시행 예정 —\n①증거보전의 신청은 소를 제기한 뒤에는 그 증거를 사용할 심급의 법원에 하여야 한다. 소\n를 제기하기 전에는 신문을 받을 사람이나 문서를 가진 사람의 거소 또는 검증하고자 하는 목적물이 있는 곳을 관할\n하는 지방법원에 하여야 한다.\n②급박한 경우에는 소를 제기한 뒤에도 제1항 후단에 규정된 지방법원에 증거보전의 신청을 할 수 있다.\n③ 해사민사사건 및 국제상사사건에 관한 증거보전의 신청은 해사국제상사법원에 하여야 한다. 다만, 제24조의2제\n3항에 따라 지방법원에서 해사민사사건 또는 국제상사사건을 심판하는 경우에는 그러하지 아니하다.<신설 2026.\n3. 17.>\n④ 제3항에 따라 증거보전을 신청하는 경우에는 제1항 및 제2항을 준용한다.<신설 2026. 3. 17.>\n\n— 시행 예정 —\n"}, {"no": 377, "no_str": "제377조", "title": "신청의 방식", "body": "①증거보전의 신청에는 다음 각호의 사항을 밝혀야 한다.\n1. 상대방의 표시\n2. 증명할 사실\n3. 보전하고자 하는 증거\n4. 증거보전의 사유\n②증거보전의 사유는 소명하여야 한다."}, {"no": 378, "no_str": "제378조", "title": "상대방을 지정할 수 없는 경우", "body": "증거보전의 신청은 상대방을 지정할 수 없는 경우에도 할 수 있다. 이 경우 법\n원은 상대방이 될 사람을 위하여 특별대리인을 선임할 수 있다."}, {"no": 379, "no_str": "제379조", "title": "직권에 의한 증거보전", "body": "법원은 필요하다고 인정한 때에는 소송이 계속된 중에 직권으로 증거보전을 결정할 수\n있다."}, {"no": 380, "no_str": "제380조", "title": "불복금지", "body": "증거보전의 결정에 대하여는 불복할 수 없다."}, {"no": 381, "no_str": "제381조", "title": "당사자의 참여", "body": "증거조사의 기일은 신청인과 상대방에게 통지하여야 한다. 다만, 긴급한 경우에는 그러하지 아\n니하다."}, {"no": 382, "no_str": "제382조", "title": "증거보전의 기록", "body": "증거보전에 관한 기록은 본안소송의 기록이 있는 법원에 보내야 한다."}, {"no": 383, "no_str": "제383조", "title": "증거보전의 비용", "body": "증거보전에 관한 비용은 소송비용의 일부로 한다."}, {"no": 384, "no_str": "제384조", "title": "변론에서의 재신문", "body": "증거보전절차에서 신문한 증인을 당사자가 변론에서 다시 신문하고자 신청한 때에는 법\n원은 그 증인을 신문하여야 한다."}, {"no": 385, "no_str": "제385조", "title": "화해신청의 방식", "body": "①민사상 다툼에 관하여 당사자는 청구의 취지ㆍ원인과 다투는 사정을 밝혀 상대방의 보통\n재판적이 있는 곳의 지방법원에 화해를 신청할 수 있다.\n②당사자는 제1항의 화해를 위하여 대리인을 선임하는 권리를 상대방에게 위임할 수 없다.\n③법원은 필요한 경우 대리권의 유무를 조사하기 위하여 당사자본인 또는 법정대리인의 출석을 명할 수 있다.\n④화해신청에는 그 성질에 어긋나지 아니하면 소에 관한 규정을 준용한다."}, {"no": 386, "no_str": "제386조", "title": "화해가 성립된 경우", "body": "화해가 성립된 때에는 법원사무관등은 조서에 당사자, 법정대리인, 청구의 취지와 원인,\n화해조항, 날짜와 법원을 표시하고 판사와 법원사무관등이 기명날인 또는 서명한다. <개정 2017. 10. 31.>"}, {"no": 387, "no_str": "제387조", "title": "화해가 성립되지 아니한 경우", "body": "①화해가 성립되지 아니한 때에는 법원사무관등은 그 사유를 조서에 적어야 한\n다.\n②신청인 또는 상대방이 기일에 출석하지 아니한 때에는 법원은 이들의 화해가 성립되지 아니한 것으로 볼 수 있다.\n③법원사무관등은 제1항의 조서등본을 당사자에게 송달하여야 한다."}, {"no": 388, "no_str": "제388조", "title": "소제기신청", "body": "①제387조의 경우에 당사자는 소제기신청을 할 수 있다.\n②적법한 소제기신청이 있으면 화해신청을 한 때에 소가 제기된 것으로 본다. 이 경우 법원사무관등은 바로 소송기\n록을 관할법원에 보내야 한다.\n③제1항의 신청은 제387조제3항의 조서등본이 송달된 날부터 2주 이내에 하여야 한다. 다만, 조서등본이 송달되기\n전에도 신청할 수 있다.\n④제3항의 기간은 불변기간으로 한다."}, {"no": 389, "no_str": "제389조", "title": "화해비용", "body": "화해비용은 화해가 성립된 경우에는 특별한 합의가 없으면 당사자들이 각자 부담하고, 화해가 성립\n되지 아니한 경우에는 신청인이 부담한다. 다만, 소제기신청이 있는 경우에는 화해비용을 소송비용의 일부로 한다."}, {"no": 390, "no_str": "제390조", "title": "항소의 대상", "body": "①항소(抗訴)는 제1심 법원이 선고한 종국판결에 대하여 할 수 있다. 다만, 종국판결 뒤에 양 쪽\n당사자가 상고(上告)할 권리를 유보하고 항소를 하지 아니하기로 합의한 때에는 그러하지 아니하다.\n②제1항 단서의 합의에는 제29조제2항의 규정을 준용한다."}, {"no": 391, "no_str": "제391조", "title": "독립한 항소가 금지되는 재판", "body": "소송비용 및 가집행에 관한 재판에 대하여는 독립하여 항소를 하지 못한다."}, {"no": 392, "no_str": "제392조", "title": "항소심의 판단을 받는 재판", "body": "종국판결 이전의 재판은 항소법원의 판단을 받는다. 다만, 불복할 수 없는 재판과\n항고(抗告)로 불복할 수 있는 재판은 그러하지 아니하다."}, {"no": 393, "no_str": "제393조", "title": "항소의 취하", "body": "①항소는 항소심의 종국판결이 있기 전에 취하할 수 있다.\n②항소의 취하에는 제266조제3항 내지 제5항 및 제267조제1항의 규정을 준용한다."}, {"no": 394, "no_str": "제394조", "title": "항소권의 포기", "body": "항소권은 포기할 수 있다."}, {"no": 395, "no_str": "제395조", "title": "항소권의 포기방식", "body": "①항소권의 포기는 항소를 하기 이전에는 제1심 법원에, 항소를 한 뒤에는 소송기록이 있\n는 법원에 서면으로 하여야 한다.\n②항소권의 포기에 관한 서면은 상대방에게 송달하여야 한다.\n③항소를 한 뒤의 항소권의 포기는 항소취하의 효력도 가진다."}, {"no": 396, "no_str": "제396조", "title": "항소기간", "body": "①항소는 판결서가 송달된 날부터 2주 이내에 하여야 한다. 다만, 판결서 송달전에도 할 수 있다.\n②제1항의 기간은 불변기간으로 한다."}, {"no": 397, "no_str": "제397조", "title": "항소의 방식, 항소장의 기재사항", "body": "①항소는 항소장을 제1심 법원에 제출함으로써 한다.\n②항소장에는 다음 각호의 사항을 적어야 한다.\n1. 당사자와 법정대리인\n2. 제1심 판결의 표시와 그 판결에 대한 항소의 취지"}, {"no": 398, "no_str": "제398조", "title": "준비서면규정의 준용", "body": "항소장에는 준비서면에 관한 규정을 준용한다."}, {"no": 399, "no_str": "제399조", "title": "원심재판장등의 항소장심사권", "body": "①항소장이 제397조제2항의 규정에 어긋난 경우와 항소장에 법률의 규정에 따\n른 인지를 붙이지 아니한 경우에는 원심재판장은 항소인에게 상당한 기간을 정하여 그 기간 이내에 흠을 보정하도\n록 명하여야 한다. 원심재판장은 법원사무관등으로 하여금 위 보정명령을 하게 할 수 있다. <개정 2014. 12. 30.>\n②항소인이 제1항의 기간 이내에 흠을 보정하지 아니한 때와, 항소기간을 넘긴 것이 분명한 때에는 원심재판장은\n명령으로 항소장을 각하하여야 한다.\n③제2항의 명령에 대하여는 즉시항고를 할 수 있다.\n[제목개정 2014. 12. 30.]"}, {"no": 400, "no_str": "제400조", "title": "항소기록의 송부", "body": "①항소장이 각하되지 아니한 때에 원심법원의 법원사무관등은 항소장이 제출된 날부터 2주\n이내에 항소기록에 항소장을 붙여 항소법원으로 보내야 한다.\n②제399조제1항의 규정에 의하여 원심재판장등이 흠을 보정하도록 명한 때에는 그 흠이 보정된 날부터 1주 이내에\n항소기록을 보내야 한다.<개정 2014. 12. 30.>\n③ 제1항 또는 제2항에 따라 항소기록을 송부받은 항소법원의 법원사무관등은 바로 그 사유를 당사자에게 통지하\n여야 한다.<신설 2024. 1. 16.>"}, {"no": 401, "no_str": "제401조", "title": "항소장부본의 송달", "body": "항소장의 부본은 피항소인에게 송달하여야 한다."}, {"no": 402, "no_str": "제402조", "title": "항소심재판장등의 항소장심사권", "body": "①항소장이 제397조제2항의 규정에 어긋나거나 항소장에 법률의 규정에 따\n른 인지를 붙이지 아니하였음에도 원심재판장등이 제399조제1항의 규정에 의한 명령을 하지 아니한 경우, 또는 항\n소장의 부본을 송달할 수 없는 경우에는 항소심재판장은 항소인에게 상당한 기간을 정하여 그 기간 이내에 흠을 보\n정하도록 명하여야 한다. 항소심재판장은 법원사무관등으로 하여금 위 보정명령을 하게 할 수 있다. <개정 2014. 12.\n30.>\n②항소인이 제1항의 기간 이내에 흠을 보정하지 아니한 때, 또는 제399조제2항의 규정에 따라 원심재판장이 항소\n장을 각하하지 아니한 때에는 항소심재판장은 명령으로 항소장을 각하하여야 한다.\n③제2항의 명령에 대하여는 즉시항고를 할 수 있다.\n[제목개정 2014. 12. 30.]"}, {"no": 402, "no_str": "제402조의2", "title": "항소이유서의 제출", "body": "① 항소장에 항소이유를 적지 아니한 항소인은 제400조제3항의 통지를 받은 날부터\n40일 이내에 항소이유서를 항소법원에 제출하여야 한다.\n② 항소법원은 항소인의 신청에 따른 결정으로 제1항에 따른 제출기간을 1회에 한하여 1개월 연장할 수 있다.\n[본조신설 2024. 1. 16.]"}, {"no": 402, "no_str": "제402조의3", "title": "항소이유서 미제출에 따른 항소각하 결정", "body": "① 항소인이 제402조의2제1항에 따른 제출기간(같은 조 제2항\n에 따라 제출기간이 연장된 경우에는 그 연장된 기간을 말한다) 내에 항소이유서를 제출하지 아니한 때에는 항소법\n원은 결정으로 항소를 각하하여야 한다. 다만, 직권으로 조사하여야 할 사유가 있거나 항소장에 항소이유가 기재되\n어 있는 때에는 그러하지 아니하다.\n② 제1항 본문의 결정에 대하여는 즉시항고를 할 수 있다.\n[본조신설 2024. 1. 16.]"}, {"no": 403, "no_str": "제403조", "title": "부대항소", "body": "피항소인은 항소권이 소멸된 뒤에도 변론이 종결될 때까지 부대항소(附帶抗訴)를 할 수 있다."}, {"no": 404, "no_str": "제404조", "title": "부대항소의 종속성", "body": "부대항소는 항소가 취하되거나 부적법하여 각하된 때에는 그 효력을 잃는다. 다만, 항소기\n간 이내에 한 부대항소는 독립된 항소로 본다."}, {"no": 405, "no_str": "제405조", "title": "부대항소의 방식", "body": "부대항소에는 항소에 관한 규정을 적용한다."}, {"no": 406, "no_str": "제406조", "title": "가집행의 선고", "body": "①항소법원은 제1심 판결중에 불복신청이 없는 부분에 대하여는 당사자의 신청에 따라 결정으\n로 가집행의 선고를 할 수 있다.\n②제1항의 신청을 기각한 결정에 대하여는 즉시항고를 할 수 있다."}, {"no": 407, "no_str": "제407조", "title": "변론의 범위", "body": "①변론은 당사자가 제1심 판결의 변경을 청구하는 한도안에서 한다.\n②당사자는 제1심 변론의 결과를 진술하여야 한다."}, {"no": 408, "no_str": "제408조", "title": "제1심 소송절차의 준용", "body": "항소심의 소송절차에는 특별한 규정이 없으면 제2편제1장 내지 제3장의 규정을 준용\n한다."}, {"no": 409, "no_str": "제409조", "title": "제1심 소송행위의 효력", "body": "제1심의 소송행위는 항소심에서도 그 효력을 가진다."}, {"no": 410, "no_str": "제410조", "title": "제1심의 변론준비절차의 효력", "body": "제1심의 변론준비절차는 항소심에서도 그 효력을 가진다."}, {"no": 411, "no_str": "제411조", "title": "관할위반 주장의 금지", "body": "당사자는 항소심에서 제1심 법원의 관할위반을 주장하지 못한다. 다만, 전속관할에 대\n하여는 그러하지 아니하다."}, {"no": 412, "no_str": "제412조", "title": "반소의 제기", "body": "①반소는 상대방의 심급의 이익을 해할 우려가 없는 경우 또는 상대방의 동의를 받은 경우에 제\n기할 수 있다.\n②상대방이 이의를 제기하지 아니하고 반소의 본안에 관하여 변론을 한 때에는 반소제기에 동의한 것으로 본다."}, {"no": 413, "no_str": "제413조", "title": "변론 없이 하는 항소각하", "body": "부적법한 항소로서 흠을 보정할 수 없으면 변론 없이 판결로 항소를 각하할 수 있다."}, {"no": 414, "no_str": "제414조", "title": "항소기각", "body": "①항소법원은 제1심 판결을 정당하다고 인정한 때에는 항소를 기각하여야 한다.\n②제1심 판결의 이유가 정당하지 아니한 경우에도 다른 이유에 따라 그 판결이 정당하다고 인정되는 때에는 항소를\n기각하여야 한다."}, {"no": 415, "no_str": "제415조", "title": "항소를 받아들이는 범위", "body": "제1심 판결은 그 불복의 한도안에서 바꿀 수 있다. 다만, 상계에 관한 주장을 인정한\n때에는 그러하지 아니하다."}, {"no": 416, "no_str": "제416조", "title": "제1심 판결의 취소", "body": "항소법원은 제1심 판결을 정당하지 아니하다고 인정한 때에는 취소하여야 한다."}, {"no": 417, "no_str": "제417조", "title": "판결절차의 위법으로 말미암은 취소", "body": "제1심 판결의 절차가 법률에 어긋날 때에 항소법원은 제1심 판결을 취소\n하여야 한다."}, {"no": 418, "no_str": "제418조", "title": "필수적 환송", "body": "소가 부적법하다고 각하한 제1심 판결을 취소하는 경우에는 항소법원은 사건을 제1심 법원에 환\n송(還送)하여야 한다. 다만, 제1심에서 본안판결을 할 수 있을 정도로 심리가 된 경우, 또는 당사자의 동의가 있는 경\n우에는 항소법원은 스스로 본안판결을 할 수 있다."}, {"no": 419, "no_str": "제419조", "title": "관할위반으로 말미암은 이송", "body": "관할위반을 이유로 제1심 판결을 취소한 때에는 항소법원은 판결로 사건을 관할\n법원에 이송하여야 한다."}, {"no": 420, "no_str": "제420조", "title": "판결서를 적는 방법", "body": "판결이유를 적을 때에는 제1심 판결을 인용할 수 있다. 다만, 제1심 판결이 제208조제3항\n에 따라 작성된 경우에는 그러하지 아니하다."}, {"no": 421, "no_str": "제421조", "title": "소송기록의 반송", "body": "소송이 완결된 뒤 상고가 제기되지 아니하고 상고기간이 끝난 때에는 법원사무관등은 판결\n서, 제402조에 따른 명령 또는 제402조의3에 따른 결정의 정본을 소송기록에 붙여 제1심 법원에 보내야 한다. <개정\n2024. 1. 16.>"}, {"no": 422, "no_str": "제422조", "title": "상고의 대상", "body": "①상고는 고등법원이 선고한 종국판결과 지방법원 합의부가 제2심으로서 선고한 종국판결에 대\n하여 할 수 있다.\n②제390조제1항 단서의 경우에는 제1심의 종국판결에 대하여 상고할 수 있다."}, {"no": 423, "no_str": "제423조", "title": "상고이유", "body": "상고는 판결에 영향을 미친 헌법ㆍ법률ㆍ명령 또는 규칙의 위반이 있다는 것을 이유로 드는 때에만\n할 수 있다."}, {"no": 424, "no_str": "제424조", "title": "절대적 상고이유", "body": "①판결에 다음 각호 가운데 어느 하나의 사유가 있는 때에는 상고에 정당한 이유가 있는 것\n으로 한다.\n1. 법률에 따라 판결법원을 구성하지 아니한 때\n2. 법률에 따라 판결에 관여할 수 없는 판사가 판결에 관여한 때\n3. 전속관할에 관한 규정에 어긋난 때\n4. 법정대리권ㆍ소송대리권 또는 대리인의 소송행위에 대한 특별한 권한의 수여에 흠이 있는 때\n5. 변론을 공개하는 규정에 어긋난 때\n6. 판결의 이유를 밝히지 아니하거나 이유에 모순이 있는 때\n②제60조 또는 제97조의 규정에 따라 추인한 때에는 제1항제4호의 규정을 적용하지 아니한다."}, {"no": 425, "no_str": "제425조", "title": "항소심절차의 준용", "body": "상고와 상고심의 소송절차에는 특별한 규정이 없으면 제1장의 규정을 준용한다."}, {"no": 426, "no_str": "제426조", "title": "소송기록 접수의 통지", "body": "상고법원의 법원사무관등은 원심법원의 법원사무관등으로부터 소송기록을 받은 때에\n는 바로 그 사유를 당사자에게 통지하여야 한다."}, {"no": 427, "no_str": "제427조", "title": "상고이유서 제출", "body": "상고장에 상고이유를 적지 아니한 때에 상고인은 제426조의 통지를 받은 날부터 20일 이내\n에 상고이유서를 제출하여야 한다."}, {"no": 428, "no_str": "제428조", "title": "상고이유서, 답변서의 송달 등", "body": "①상고이유서를 제출받은 상고법원은 바로 그 부본이나 등본을 상대방에게 송\n달하여야 한다.\n②상대방은 제1항의 서면을 송달받은 날부터 10일 이내에 답변서를 제출할 수 있다.\n③상고법원은 제2항의 답변서의 부본이나 등본을 상고인에게 송달하여야 한다."}, {"no": 429, "no_str": "제429조", "title": "상고이유서를 제출하지 아니함으로 말미암은 상고기각", "body": "상고인이 제427조의 규정을 어기어 상고이유서를 제\n출하지 아니한 때에는 상고법원은 변론 없이 판결로 상고를 기각하여야 한다. 다만, 직권으로 조사하여야 할 사유가\n있는 때에는 그러하지 아니하다."}, {"no": 430, "no_str": "제430조", "title": "상고심의 심리절차", "body": "①상고법원은 상고장ㆍ상고이유서ㆍ답변서, 그 밖의 소송기록에 의하여 변론없이 판결할\n수 있다.\n②상고법원은 소송관계를 분명하게 하기 위하여 필요한 경우에는 특정한 사항에 관하여 변론을 열어 참고인의 진\n술을 들을 수 있다."}, {"no": 431, "no_str": "제431조", "title": "심리의 범위", "body": "상고법원은 상고이유에 따라 불복신청의 한도 안에서 심리한다."}, {"no": 432, "no_str": "제432조", "title": "사실심의 전권", "body": "원심판결이 적법하게 확정한 사실은 상고법원을 기속한다."}, {"no": 433, "no_str": "제433조", "title": "비약적 상고의 특별규정", "body": "상고법원은 제422조제2항의 규정에 따른 상고에 대하여는 원심판결의 사실확정이\n법률에 어긋난다는 것을 이유로 그 판결을 파기하지 못한다."}, {"no": 434, "no_str": "제434조", "title": "직권조사사항에 대한 예외", "body": "법원이 직권으로 조사하여야 할 사항에 대하여는 제431조 내지 제433조의 규정을\n적용하지 아니한다."}, {"no": 435, "no_str": "제435조", "title": "가집행의 선고", "body": "상고법원은 원심판결중 불복신청이 없는 부분에 대하여는 당사자의 신청에 따라 결정으로 가\n집행의 선고를 할 수 있다."}, {"no": 436, "no_str": "제436조", "title": "파기환송, 이송", "body": "①상고법원은 상고에 정당한 이유가 있다고 인정할 때에는 원심판결을 파기하고 사건을 원심\n법원에 환송하거나, 동등한 다른 법원에 이송하여야 한다.\n②사건을 환송받거나 이송받은 법원은 다시 변론을 거쳐 재판하여야 한다. 이 경우에는 상고법원이 파기의 이유로\n삼은 사실상 및 법률상 판단에 기속된다.\n③원심판결에 관여한 판사는 제2항의 재판에 관여하지 못한다."}, {"no": 437, "no_str": "제437조", "title": "파기자판", "body": "다음 각호 가운데 어느 하나에 해당하면 상고법원은 사건에 대하여 종국판결을 하여야 한다.\n1. 확정된 사실에 대하여 법령적용이 어긋난다 하여 판결을 파기하는 경우에 사건이 그 사실을 바탕으로 재판하기\n충분한 때\n2. 사건이 법원의 권한에 속하지 아니한다 하여 판결을 파기하는 때"}, {"no": 438, "no_str": "제438조", "title": "소송기록의 송부", "body": "사건을 환송하거나 이송하는 판결이 내려졌을 때에는 법원사무관등은 2주 이내에 그 판결의\n정본을 소송기록에 붙여 사건을 환송받거나 이송받을 법원에 보내야 한다."}, {"no": 439, "no_str": "제439조", "title": "항고의 대상", "body": "소송절차에 관한 신청을 기각한 결정이나 명령에 대하여 불복하면 항고할 수 있다."}, {"no": 440, "no_str": "제440조", "title": "형식에 어긋나는 결정ㆍ명령에 대한 항고", "body": "결정이나 명령으로 재판할 수 없는 사항에 대하여 결정 또는 명령\n을 한 때에는 항고할 수 있다."}, {"no": 441, "no_str": "제441조", "title": "준항고", "body": "①수명법관이나 수탁판사의 재판에 대하여 불복하는 당사자는 수소법원에 이의를 신청할 수 있다. 다\n만, 그 재판이 수소법원의 재판인 경우로서 항고할 수 있는 것인 때에 한한다.\n②제1항의 이의신청에 대한 재판에 대하여는 항고할 수 있다.\n③상고심이나 제2심에 계속된 사건에 대한 수명법관이나 수탁판사의 재판에는 제1항의 규정을 준용한다."}, {"no": 442, "no_str": "제442조", "title": "재항고", "body": "항고법원ㆍ고등법원 또는 항소법원의 결정 및 명령에 대하여는 재판에 영향을 미친 헌법ㆍ법률ㆍ명\n령 또는 규칙의 위반을 이유로 드는 때에만 재항고(再抗告)할 수 있다."}, {"no": 443, "no_str": "제443조", "title": "항소 및 상고의 절차규정준용", "body": "①항고법원의 소송절차에는 제1장의 규정을 준용한다.\n②재항고와 이에 관한 소송절차에는 제2장의 규정을 준용한다."}, {"no": 444, "no_str": "제444조", "title": "즉시항고", "body": "①즉시항고는 재판이 고지된 날부터 1주 이내에 하여야 한다.\n②제1항의 기간은 불변기간으로 한다."}, {"no": 445, "no_str": "제445조", "title": "항고제기의 방식", "body": "항고는 항고장을 원심법원에 제출함으로써 한다."}, {"no": 446, "no_str": "제446조", "title": "항고의 처리", "body": "원심법원이 항고에 정당한 이유가 있다고 인정하는 때에는 그 재판을 경정하여야 한다."}, {"no": 447, "no_str": "제447조", "title": "즉시항고의 효력", "body": "즉시항고는 집행을 정지시키는 효력을 가진다."}, {"no": 448, "no_str": "제448조", "title": "원심재판의 집행정지", "body": "항고법원 또는 원심법원이나 판사는 항고에 대한 결정이 있을 때까지 원심재판의 집행\n을 정지하거나 그 밖에 필요한 처분을 명할 수 있다."}, {"no": 449, "no_str": "제449조", "title": "특별항고", "body": "①불복할 수 없는 결정이나 명령에 대하여는 재판에 영향을 미친 헌법위반이 있거나, 재판의 전제가\n된 명령ㆍ규칙ㆍ처분의 헌법 또는 법률의 위반여부에 대한 판단이 부당하다는 것을 이유로 하는 때에만 대법원에\n특별항고(特別抗告)를 할 수 있다.\n②제1항의 항고는 재판이 고지된 날부터 1주 이내에 하여야 한다.\n③제2항의 기간은 불변기간으로 한다."}, {"no": 450, "no_str": "제450조", "title": "준용규정", "body": "특별항고와 그 소송절차에는 제448조와 상고에 관한 규정을 준용한다."}, {"no": 451, "no_str": "제451조", "title": "재심사유", "body": "①다음 각호 가운데 어느 하나에 해당하면 확정된 종국판결에 대하여 재심의 소를 제기할 수 있다.\n다만, 당사자가 상소에 의하여 그 사유를 주장하였거나, 이를 알고도 주장하지 아니한 때에는 그러하지 아니하다.\n1. 법률에 따라 판결법원을 구성하지 아니한 때\n2. 법률상 그 재판에 관여할 수 없는 법관이 관여한 때\n3. 법정대리권ㆍ소송대리권 또는 대리인이 소송행위를 하는 데에 필요한 권한의 수여에 흠이 있는 때. 다만, 제60조\n또는 제97조의 규정에 따라 추인한 때에는 그러하지 아니하다.\n4. 재판에 관여한 법관이 그 사건에 관하여 직무에 관한 죄를 범한 때\n5. 형사상 처벌을 받을 다른 사람의 행위로 말미암아 자백을 하였거나 판결에 영향을 미칠 공격 또는 방어방법의 제\n출에 방해를 받은 때\n6. 판결의 증거가 된 문서, 그 밖의 물건이 위조되거나 변조된 것인 때\n7. 증인ㆍ감정인ㆍ통역인의 거짓 진술 또는 당사자신문에 따른 당사자나 법정대리인의 거짓 진술이 판결의 증거가\n된때\n8. 판결의 기초가 된 민사나 형사의 판결, 그 밖의 재판 또는 행정처분이 다른 재판이나 행정처분에 따라 바뀐 때\n9. 판결에 영향을 미칠 중요한 사항에 관하여 판단을 누락한 때\n10. 재심을 제기할 판결이 전에 선고한 확정판결에 어긋나는 때\n11. 당사자가 상대방의 주소 또는 거소를 알고 있었음에도 있는 곳을 잘 모른다고 하거나 주소나 거소를 거짓으로\n하여 소를 제기한 때\n②제1항제4호 내지 제7호의 경우에는 처벌받을 행위에 대하여 유죄의 판결이나 과태료부과의 재판이 확정된 때 또\n는 증거부족 외의 이유로 유죄의 확정판결이나 과태료부과의 확정재판을 할 수 없을 때에만 재심의 소를 제기할 수\n있다.\n③항소심에서 사건에 대하여 본안판결을 하였을 때에는 제1심 판결에 대하여 재심의 소를 제기하지 못한다."}, {"no": 452, "no_str": "제452조", "title": "기본이 되는 재판의 재심사유", "body": "판결의 기본이 되는 재판에 제451조에 정한 사유가 있을 때에는 그 재판에 대\n하여 독립된 불복방법이 있는 경우라도 그 사유를 재심의 이유로 삼을 수 있다."}, {"no": 453, "no_str": "제453조", "title": "재심관할법원", "body": "①재심은 재심을 제기할 판결을 한 법원의 전속관할로 한다.\n②심급을 달리하는 법원이 같은 사건에 대하여 내린 판결에 대한 재심의 소는 상급법원이 관할한다. 다만, 항소심판\n결과 상고심판결에 각각 독립된 재심사유가 있는 때에는 그러하지 아니하다."}, {"no": 454, "no_str": "제454조", "title": "재심사유에 관한 중간판결", "body": "①법원은 재심의 소가 적법한지 여부와 재심사유가 있는지 여부에 관한 심리 및\n재판을 본안에 관한 심리 및 재판과 분리하여 먼저 시행할 수 있다.\n②제1항의 경우에 법원은 재심사유가 있다고 인정한 때에는 그 취지의 중간판결을 한 뒤 본안에 관하여 심리ㆍ재판\n한다."}, {"no": 455, "no_str": "제455조", "title": "재심의 소송절차", "body": "재심의 소송절차에는 각 심급의 소송절차에 관한 규정을 준용한다."}, {"no": 456, "no_str": "제456조", "title": "재심제기의 기간", "body": "①재심의 소는 당사자가 판결이 확정된 뒤 재심의 사유를 안 날부터 30일 이내에 제기하여\n야 한다.\n②제1항의 기간은 불변기간으로 한다.\n③판결이 확정된 뒤 5년이 지난 때에는 재심의 소를 제기하지 못한다.\n④재심의 사유가 판결이 확정된 뒤에 생긴 때에는 제3항의 기간은 그 사유가 발생한 날부터 계산한다."}, {"no": 457, "no_str": "제457조", "title": "재심제기의 기간", "body": "대리권의 흠 또는 제451조제1항제10호에 규정한 사항을 이유로 들어 제기하는 재심의 소에\n는 제456조의 규정을 적용하지 아니한다."}, {"no": 458, "no_str": "제458조", "title": "재심소장의 필수적 기재사항", "body": "재심소장에는 다음 각호의 사항을 적어야 한다.\n1. 당사자와 법정대리인\n2. 재심할 판결의 표시와 그 판결에 대하여 재심을 청구하는 취지\n3. 재심의 이유"}, {"no": 459, "no_str": "제459조", "title": "변론과 재판의 범위", "body": "①본안의 변론과 재판은 재심청구이유의 범위안에서 하여야 한다.\n②재심의 이유는 바꿀 수 있다."}, {"no": 460, "no_str": "제460조", "title": "결과가 정당한 경우의 재심기각", "body": "재심의 사유가 있는 경우라도 판결이 정당하다고 인정한 때에는 법원은 재심\n의 청구를 기각하여야 한다."}, {"no": 461, "no_str": "제461조", "title": "준재심", "body": "제220조의 조서 또는 즉시항고로 불복할 수 있는 결정이나 명령이 확정된 경우에 제451조제1항에 규\n정된 사유가 있는 때에는 확정판결에 대한 제451조 내지 제460조의 규정에 준하여 재심을 제기할 수 있다."}, {"no": 462, "no_str": "제462조", "title": "적용의 요건", "body": "금전, 그 밖에 대체물(代替物)이나 유가증권의 일정한 수량의 지급을 목적으로 하는 청구에 대하\n여 법원은 채권자의 신청에 따라 지급명령을 할 수 있다. 다만, 대한민국에서 공시송달 외의 방법으로 송달할 수 있\n는 경우에 한한다."}, {"no": 463, "no_str": "제463조", "title": "관할법원", "body": "독촉절차는 채무자의 보통재판적이 있는 곳의 지방법원이나 제7조 내지 제9조, 제12조 또는 제18조\n의 규정에 의한 관할법원의 전속관할로 한다.\n\n— 시행 예정 —\n① 독촉절차는 채무자의 보통재판적이 있는 곳의 지방법원이나 제7조 내지 제9조, 제12조 또는 제\n18조의 규정에 의한 관할법원의 전속관할로 한다. <개정 2026. 3. 17.>\n② 제1항에도 불구하고 해사민사사건 및 국제상사사건에 관한 독촉절차는 채무자의 보통재판적이 있는 곳의 해사\n국제상사법원이나 제7조부터 제9조까지, 제12조 또는 제18조에 따른 해사국제상사법원의 전속관할로 한다. 다만, 「\n선원법」이 적용되는 사건으로서 선원 또는 그 유족이 당사자인 사건과 「소액사건심판법」 제2조제1항에 따른 소액\n사건의 경우에는 제1항에 따른 법원(해사국제상사법원이 위치한 지방법원 및 그 지원은 제외한다)에도 해당 독촉절\n차에 대한 관할권이 있다.<신설 2026. 3. 17.>\n\n— 시행 예정 —\n"}, {"no": 464, "no_str": "제464조", "title": "지급명령의 신청", "body": "지급명령의 신청에는 그 성질에 어긋나지 아니하면 소에 관한 규정을 준용한다."}, {"no": 465, "no_str": "제465조", "title": "신청의 각하", "body": "①지급명령의 신청이 제462조 본문 또는 제463조의 규정에 어긋나거나, 신청의 취지로 보아 청\n구에 정당한 이유가 없는 것이 명백한 때에는 그 신청을 각하하여야 한다. 청구의 일부에 대하여 지급명령을 할 수\n없는 때에 그 일부에 대하여도 또한 같다.\n②신청을 각하하는 결정에 대하여는 불복할 수 없다."}, {"no": 466, "no_str": "제466조", "title": "지급명령을 하지 아니하는 경우", "body": "①채권자는 법원으로부터 채무자의 주소를 보정하라는 명령을 받은 경우에\n소제기신청을 할 수 있다.\n②지급명령을 공시송달에 의하지 아니하고는 송달할 수 없거나 외국으로 송달하여야 할 때에는 법원은 직권에 의\n한 결정으로 사건을 소송절차에 부칠 수 있다.\n③제2항의 결정에 대하여는 불복할 수 없다."}, {"no": 467, "no_str": "제467조", "title": "일방적 심문", "body": "지급명령은 채무자를 심문하지 아니하고 한다."}, {"no": 468, "no_str": "제468조", "title": "지급명령의 기재사항", "body": "지급명령에는 당사자, 법정대리인, 청구의 취지와 원인을 적고, 채무자가 지급명령이 송\n달된 날부터 2주 이내에 이의신청을 할 수 있다는 것을 덧붙여 적어야 한다."}, {"no": 469, "no_str": "제469조", "title": "지급명령의 송달", "body": "①지급명령은 당사자에게 송달하여야 한다.\n②채무자는 지급명령에 대하여 이의신청을 할 수 있다."}, {"no": 470, "no_str": "제470조", "title": "이의신청의 효력", "body": "①채무자가 지급명령을 송달받은 날부터 2주 이내에 이의신청을 한 때에는 지급명령은 그\n범위안에서 효력을 잃는다.\n②제1항의 기간은 불변기간으로 한다."}, {"no": 471, "no_str": "제471조", "title": "이의신청의 각하", "body": "①법원은 이의신청이 부적법하다고 인정한 때에는 결정으로 이를 각하하여야 한다.\n②제1항의 결정에 대하여는 즉시항고를 할 수 있다."}, {"no": 472, "no_str": "제472조", "title": "소송으로의 이행", "body": "①채권자가 제466조제1항의 규정에 따라 소제기신청을 한 경우, 또는 법원이 제466조제2항\n의 규정에 따라 지급명령신청사건을 소송절차에 부치는 결정을 한 경우에는 지급명령을 신청한 때에 소가 제기된\n것으로 본다.\n②채무자가 지급명령에 대하여 적법한 이의신청을 한 경우에는 지급명령을 신청한 때에 이의신청된 청구목적의 값\n에 관하여 소가 제기된 것으로 본다."}, {"no": 473, "no_str": "제473조", "title": "소송으로의 이행에 따른 처리", "body": "①제472조의 규정에 따라 소가 제기된 것으로 보는 경우, 지급명령을 발령한 법\n원은 채권자에게 상당한 기간을 정하여, 소를 제기하는 경우 소장에 붙여야 할 인지액에서 소제기신청 또는 지급명\n령신청시에 붙인 인지액을 뺀 액수의 인지를 보정하도록 명하여야 한다.\n②채권자가 제1항의 기간 이내에 인지를 보정하지 아니한 때에는 위 법원은 결정으로 지급명령신청서를 각하하여\n야 한다. 이 결정에 대하여는 즉시항고를 할 수 있다.\n③제1항에 규정된 인지가 보정되면 법원사무관 등은 바로 소송기록을 관할법원에 보내야 한다. 이 경우 사건이 합\n의부의 관할에 해당되면 법원사무관등은 바로 소송기록을 관할법원 합의부에 보내야 한다.\n④제472조의 경우 독촉절차의 비용은 소송비용의 일부로 한다."}, {"no": 474, "no_str": "제474조", "title": "지급명령의 효력", "body": "지급명령에 대하여 이의신청이 없거나, 이의신청을 취하하거나, 각하결정이 확정된 때에는\n지급명령은 확정판결과 같은 효력이 있다."}, {"no": 475, "no_str": "제475조", "title": "공시최고의 적용범위", "body": "공시최고(公示催告)는 권리 또는 청구의 신고를 하지 아니하면 그 권리를 잃게 될 것을\n법률로 정한 경우에만 할 수 있다."}, {"no": 476, "no_str": "제476조", "title": "공시최고절차를 관할하는 법원", "body": "①공시최고는 법률에 다른 규정이 있는 경우를 제외하고는 권리자의 보통재\n판적이 있는 곳의 지방법원이 관할한다. 다만, 등기 또는 등록을 말소하기 위한 공시최고는 그 등기 또는 등록을 한\n공공기관이 있는 곳의 지방법원에 신청할 수 있다.\n②제492조의 경우에는 증권이나 증서에 표시된 이행지의 지방법원이 관할한다. 다만, 증권이나 증서에 이행지의 표\n시가 없는 때에는 발행인의 보통재판적이 있는 곳의 지방법원이, 그 법원이 없는 때에는 발행 당시에 발행인의 보통\n재판적이 있었던 곳의 지방법원이 각각 관할한다.\n③제1항 및 제2항의 관할은 전속관할로 한다."}, {"no": 477, "no_str": "제477조", "title": "공시최고의 신청", "body": "①공시최고의 신청에는 그 신청의 이유와 제권판결(除權判決)을 청구하는 취지를 밝혀야 한\n다.\n②제1항의 신청은 서면으로 하여야 한다.\n③법원은 여러 개의 공시최고를 병합하도록 명할 수 있다."}, {"no": 478, "no_str": "제478조", "title": "공시최고의 허가여부", "body": "①공시최고의 허가여부에 대한 재판은 결정으로 한다. 허가하지 아니하는 결정에 대하\n여는 즉시항고를 할 수 있다.\n②제1항의 경우에는 신청인을 심문할 수 있다."}, {"no": 479, "no_str": "제479조", "title": "공시최고의 기재사항", "body": "①공시최고의 신청을 허가한 때에는 법원은 공시최고를 하여야 한다.\n②공시최고에는 다음 각호의 사항을 적어야 한다.\n1. 신청인의 표시\n2. 공시최고기일까지 권리 또는 청구의 신고를 하여야 한다는 최고\n3. 신고를 하지 아니하면 권리를 잃게 될 사항\n4. 공시최고기일"}, {"no": 480, "no_str": "제480조", "title": "공고방법", "body": "공시최고는 대법원규칙이 정하는 바에 따라 공고하여야 한다."}, {"no": 481, "no_str": "제481조", "title": "공시최고기간", "body": "공시최고의 기간은 공고가 끝난 날부터 3월 뒤로 정하여야 한다."}, {"no": 482, "no_str": "제482조", "title": "제권판결전의 신고", "body": "공시최고기일이 끝난 뒤에도 제권판결에 앞서 권리 또는 청구의 신고가 있는 때에는 그\n권리를 잃지 아니한다."}, {"no": 483, "no_str": "제483조", "title": "신청인의 불출석과 새 기일의 지정", "body": "①신청인이 공시최고기일에 출석하지 아니하거나, 기일변경신청을 하는\n때에는 법원은 1회에 한하여 새 기일을 정하여 주어야 한다.\n②제1항의 새 기일은 공시최고기일부터 2월을 넘기지 아니하여야 하며, 공고는 필요로 하지 아니한다."}, {"no": 484, "no_str": "제484조", "title": "취하간주", "body": "신청인이 제483조의 새 기일에 출석하지 아니한 때에는 공시최고신청을 취하한 것으로 본다."}, {"no": 485, "no_str": "제485조", "title": "신고가 있는 경우", "body": "신청이유로 내세운 권리 또는 청구를 다투는 신고가 있는 때에는 법원은 그 권리에 대한 재\n판이 확정될 때까지 공시최고절차를 중지하거나, 신고한 권리를 유보하고 제권판결을 하여야 한다."}, {"no": 486, "no_str": "제486조", "title": "신청인의 진술의무", "body": "공시최고의 신청인은 공시최고기일에 출석하여 그 신청을 하게 된 이유와 제권판결을 청\n구하는 취지를 진술하여야 한다."}, {"no": 487, "no_str": "제487조", "title": "제권판결", "body": "①법원은 신청인이 진술을 한 뒤에 제권판결신청에 정당한 이유가 없다고 인정할 때에는 결정으로\n신청을 각하하여야 하며, 이유가 있다고 인정할 때에는 제권판결을 선고하여야 한다.\n②법원은 제1항의 재판에 앞서 직권으로 사실을 탐지할 수 있다."}, {"no": 488, "no_str": "제488조", "title": "불복신청", "body": "제권판결의 신청을 각하한 결정이나, 제권판결에 덧붙인 제한 또는 유보에 대하여는 즉시항고를 할\n수 있다."}, {"no": 489, "no_str": "제489조", "title": "제권판결의 공고", "body": "법원은 제권판결의 요지를 대법원규칙이 정하는 바에 따라 공고할 수 있다."}, {"no": 490, "no_str": "제490조", "title": "제권판결에 대한 불복소송", "body": "①제권판결에 대하여는 상소를 하지 못한다.\n②제권판결에 대하여는 다음 각호 가운데 어느 하나에 해당하면 신청인에 대한 소로써 최고법원에 불복할 수 있다.\n1. 법률상 공시최고절차를 허가하지 아니할 경우일 때\n2. 공시최고의 공고를 하지 아니하였거나, 법령이 정한 방법으로 공고를 하지 아니한 때\n3. 공시최고기간을 지키지 아니한 때\n4. 판결을 한 판사가 법률에 따라 직무집행에서 제척된 때\n5. 전속관할에 관한 규정에 어긋난 때\n6. 권리 또는 청구의 신고가 있음에도 법률에 어긋나는 판결을 한 때\n7. 거짓 또는 부정한 방법으로 제권판결을 받은 때\n8. 제451조제1항제4호 내지 제8호의 재심사유가 있는 때"}, {"no": 491, "no_str": "제491조", "title": "소제기기간", "body": "①제490조제2항의 소는 1월 이내에 제기하여야 한다.\n②제1항의 기간은 불변기간으로 한다.\n③제1항의 기간은 원고가 제권판결이 있다는 것을 안 날부터 계산한다. 다만, 제490조제2항제4호ㆍ제7호 및 제8호\n의 사유를 들어 소를 제기하는 경우에는 원고가 이러한 사유가 있음을 안 날부터 계산한다.\n④이 소는 제권판결이 선고된 날부터 3년이 지나면 제기하지 못한다."}, {"no": 492, "no_str": "제492조", "title": "증권의 무효선고를 위한 공시최고", "body": "①도난ㆍ분실되거나 없어진 증권, 그 밖에 상법에서 무효로 할 수 있다고\n규정한 증서의 무효선고를 청구하는 공시최고절차에는 제493조 내지 제497조의 규정을 적용한다.\n②법률상 공시최고를 할 수 있는 그 밖의 증서에 관하여 그 법률에 특별한 규정이 없으면 제1항의 규정을 적용한다."}, {"no": 493, "no_str": "제493조", "title": "증서에 관한 공시최고신청권자", "body": "무기명증권 또는 배서(背書)로 이전할 수 있거나 약식배서(略式背書)가 있는\n증권 또는 증서에 관하여는 최종소지인이 공시최고절차를 신청할 수 있으며, 그 밖의 증서에 관하여는 그 증서에 따\n라서 권리를 주장할 수 있는 사람이 공시최고절차를 신청할 수 있다."}, {"no": 494, "no_str": "제494조", "title": "신청사유의 소명", "body": "①신청인은 증서의 등본을 제출하거나 또는 증서의 존재 및 그 중요한 취지를 충분히 알리\n기에 필요한 사항을 제시하여야 한다.\n②신청인은 증서가 도난ㆍ분실되거나 없어진 사실과, 그 밖에 공시최고절차를 신청할 수 있는 이유가 되는 사실 등\n을 소명하여야 한다."}, {"no": 495, "no_str": "제495조", "title": "신고최고, 실권경고", "body": "공시최고에는 공시최고기일까지 권리 또는 청구의 신고를 하고 그 증서를 제출하도록 최\n고하고, 이를 게을리 하면 권리를 잃게 되어 증서의 무효가 선고된다는 것을 경고하여야 한다."}, {"no": 496, "no_str": "제496조", "title": "제권판결의 선고", "body": "제권판결에서는 증권 또는 증서의 무효를 선고하여야 한다."}, {"no": 497, "no_str": "제497조", "title": "제권판결의 효력", "body": "제권판결이 내려진 때에는 신청인은 증권 또는 증서에 따라 의무를 지는 사람에게 증권 또\n는 증서에 따른 권리를 주장할 수 있다."}, {"no": 498, "no_str": "제498조", "title": "판결의 확정시기", "body": "판결은 상소를 제기할 수 있는 기간 또는 그 기간 이내에 적법한 상소제기가 있을 때에는 확\n정되지 아니한다."}, {"no": 499, "no_str": "제499조", "title": "판결확정증명서의 부여자", "body": "①원고 또는 피고가 판결확정증명서를 신청한 때에는 제1심 법원의 법원사무관등\n이 기록에 따라 내어 준다.\n②소송기록이 상급심에 있는 때에는 상급법원의 법원사무관등이 그 확정부분에 대하여만 증명서를 내어 준다."}, {"no": 500, "no_str": "제500조", "title": "재심 또는 상소의 추후보완신청으로 말미암은 집행정지", "body": "①재심 또는 제173조에 따른 상소의 추후보완신청이\n있는 경우에 불복하는 이유로 내세운 사유가 법률상 정당한 이유가 있다고 인정되고, 사실에 대한 소명이 있는 때에\n는 법원은 당사자의 신청에 따라 담보를 제공하게 하거나 담보를 제공하지 아니하게 하고 강제집행을 일시정지하도\n록 명할 수 있으며, 담보를 제공하게 하고 강제집행을 실시하도록 명하거나 실시한 강제처분을 취소하도록 명할 수\n있다.\n②담보없이 하는 강제집행의 정지는 그 집행으로 말미암아 보상할 수 없는 손해가 생기는 것을 소명한 때에만 한다.\n③제1항 및 제2항의 재판은 변론없이 할 수 있으며, 이 재판에 대하여는 불복할 수 없다.\n④상소의 추후보완신청의 경우에 소송기록이 원심법원에 있으면 그 법원이 제1항 및 제2항의 재판을 한다."}, {"no": 501, "no_str": "제501조", "title": "상소제기 또는 변경의 소제기로 말미암은 집행정지", "body": "가집행의 선고가 붙은 판결에 대하여 상소를 한 경우 또\n는 정기금의 지급을 명한 확정판결에 대하여 제252조제1항의 규정에 따른 소를 제기한 경우에는 제500조의 규정을\n준용한다."}, {"no": 502, "no_str": "제502조", "title": "담보를 공탁할 법원", "body": "①이 편의 규정에 의한 담보의 제공이나 공탁은 원고나 피고의 보통재판적이 있는 곳의\n지방법원 또는 집행법원에 할 수 있다.\n②담보를 제공하거나 공탁을 한 때에는 법원은 당사자의 신청에 따라서 증명서를 주어야 한다.\n③이 편에 규정된 담보에는 달리 규정이 있는 경우를 제외하고는 제122조ㆍ제123조ㆍ제125조 및 제126조의 규정\n을 준용한다.\n부칙 <제20003호,2024. 1. 16.>"}], "특허법": [{"no": 1, "no_str": "제1조", "title": "목적", "body": "이 법은 발명을 보호ㆍ장려하고 그 이용을 도모함으로써 기술의 발전을 촉진하여 산업발전에 이바지함을\n목적으로 한다.\n[전문개정 2014. 6. 11.]\n\n— 시행 예정 —\n이 법은 공포한 날부터 시행한다."}, {"no": 2, "no_str": "제2조", "title": "정의", "body": "이 법에서 사용하는 용어의 뜻은 다음과 같다. <개정 2019. 12. 10., 2025. 1. 21.>\n1. “발명”이란 자연법칙을 이용한 기술적 사상의 창작으로서 고도(高度)한 것을 말한다.\n2. “특허발명”이란 특허를 받은 발명을 말한다.\n3. “실시”란 다음 각 목의 구분에 따른 행위를 말한다.\n가. 물건의 발명인 경우: 그 물건을 생산ㆍ사용ㆍ양도ㆍ대여ㆍ수출 또는 수입하거나 그 물건의 양도 또는 대여의\n청약(양도 또는 대여를 위한 전시를 포함한다. 이하 같다)을 하는 행위\n나. 방법의 발명인 경우: 그 방법을 사용하는 행위 또는 그 방법의 사용을 청약하는 행위\n다. 물건을 생산하는 방법의 발명인 경우: 나목의 행위 외에 그 방법에 의하여 생산한 물건을 사용ㆍ양도ㆍ대여ㆍ\n수출 또는 수입하거나 그 물건의 양도 또는 대여의 청약을 하는 행위\n[전문개정 2014. 6. 11.]\n\n— 시행 예정 —\n①부터 ⑧까지 생략\n⑨ 특허법 일부를 다음과 같이 개정한다.\n제14조제4호 중 “「근로자의날제정에관한법률」에 따른 근로자의 날”을 “「노동절 제정에 관한 법률」에 따른 노동절\n”로 한다."}, {"no": 3, "no_str": "제3조", "title": "미성년자 등의 행위능력", "body": "① 미성년자ㆍ피한정후견인 또는 피성년후견인은 법정대리인에 의하지 아니하면 특허\n에 관한 출원ㆍ청구, 그 밖의 절차(이하 “특허에 관한 절차”라 한다)를 밟을 수 없다. 다만, 미성년자와 피한정후견인\n이 독립하여 법률행위를 할 수 있는 경우에는 그러하지 아니하다.\n② 제1항의 법정대리인은 후견감독인의 동의 없이 제132조의2에 따른 특허취소신청(이하 “특허취소신청”이라 한다\n)이나 상대방이 청구한 심판 또는 재심에 대한 절차를 밟을 수 있다.<개정 2016. 2. 29.>\n[전문개정 2014. 6. 11.]"}, {"no": 4, "no_str": "제4조", "title": "법인이 아닌 사단 등", "body": "법인이 아닌 사단 또는 재단으로서 대표자나 관리인이 정하여져 있는 경우에는 그 사단 또\n는 재단의 이름으로 출원심사의 청구인, 특허취소신청인, 심판의 청구인ㆍ피청구인 또는 재심의 청구인ㆍ피청구인\n이 될 수 있다. <개정 2016. 2. 29.>\n[전문개정 2014. 6. 11.]"}, {"no": 5, "no_str": "제5조", "title": "재외자의 특허관리인", "body": "① 국내에 주소 또는 영업소가 없는 자(이하 “재외자”라 한다)는 재외자(법인의 경우에는\n그 대표자)가 국내에 체류하는 경우를 제외하고는 그 재외자의 특허에 관한 대리인으로서 국내에 주소 또는 영업소\n가 있는 자(이하 “특허관리인”이라 한다)에 의해서만 특허에 관한 절차를 밟거나 이 법 또는 이 법에 따른 명령에 따\n라 행정청이 한 처분에 대하여 소(訴)를 제기할 수 있다.\n② 특허관리인은 위임된 권한의 범위에서 특허에 관한 모든 절차 및 이 법 또는 이 법에 따른 명령에 따라 행정청이\n한 처분에 관한 소송에서 본인을 대리한다.\n[전문개정 2014. 6. 11.]"}, {"no": 6, "no_str": "제6조", "title": "대리권의 범위", "body": "국내에 주소 또는 영업소가 있는 자로부터 특허에 관한 절차를 밟을 것을 위임받은 대리인은 특\n별히 권한을 위임받아야만 다음 각 호의 어느 하나에 해당하는 행위를 할 수 있다. 특허관리인의 경우에도 또한 같다\n. <개정 2016. 2. 29.>\n1. 특허출원의 변경ㆍ포기ㆍ취하\n2. 특허권의 포기\n3. 특허권 존속기간의 연장등록출원의 취하\n4. 신청의 취하\n5. 청구의 취하\n6. 제55조제1항에 따른 우선권 주장 또는 그 취하\n7. 제132조의17에 따른 심판청구\n8. 복대리인의 선임\n[전문개정 2014. 6. 11.]"}, {"no": 7, "no_str": "제7조", "title": "대리권의 증명", "body": "특허에 관한 절차를 밟는 자의 대리인(특허관리인을 포함한다. 이하 같다)의 대리권은 서면으로\n써 증명하여야 한다.\n[전문개정 2014. 6. 11.]"}, {"no": 7, "no_str": "제7조의2", "title": "행위능력 등의 흠에 대한 추인", "body": "행위능력 또는 법정대리권이 없거나 특허에 관한 절차를 밟는 데 필요한 권한\n의 위임에 흠이 있는 자가 밟은 절차는 보정(補正)된 당사자나 법정대리인이 추인하면 행위를 한 때로 소급하여 그\n효력이 발생한다.\n[전문개정 2014. 6. 11.]"}, {"no": 8, "no_str": "제8조", "title": "대리권의 불소멸", "body": "특허에 관한 절차를 밟는 자의 위임을 받은 대리인의 대리권은 다음 각 호의 어느 하나에 해당\n하는 사유가 있어도 소멸하지 아니한다.\n1. 본인의 사망이나 행위능력의 상실\n2. 본인인 법인의 합병에 의한 소멸\n3. 본인인 수탁자(受託者)의 신탁임무 종료\n4. 법정대리인의 사망이나 행위능력의 상실\n5. 법정대리인의 대리권 소멸이나 변경\n[전문개정 2014. 6. 11.]"}, {"no": 9, "no_str": "제9조", "title": "개별대리", "body": "특허에 관한 절차를 밟는 자의 대리인이 2인 이상이면 지식재산처장 또는 특허심판원장에 대하여 각\n각의 대리인이 본인을 대리한다. <개정 2025. 10. 1.>\n[전문개정 2014. 6. 11.]"}, {"no": 10, "no_str": "제10조", "title": "대리인의 선임 또는 교체 명령 등", "body": "① 지식재산처장 또는 제145조제1항에 따라 지정된 심판장(이하 “심판장”이\n라 한다)은 특허에 관한 절차를 밟는 자가 그 절차를 원활히 수행할 수 없거나 구술심리(口述審理)에서 진술할 능력\n이 없다고 인정되는 등 그 절차를 밟는 데 적당하지 아니하다고 인정되면 대리인을 선임하여 그 절차를 밟을 것을\n명할 수 있다. <개정 2025. 10. 1.>\n② 지식재산처장 또는 심판장은 특허에 관한 절차를 밟는 자의 대리인이 그 절차를 원활히 수행할 수 없거나 구술\n심리에서 진술할 능력이 없다고 인정되는 등 그 절차를 밟는 데 적당하지 아니하다고 인정되면 그 대리인을 바꿀\n것을 명할 수 있다.<개정 2019. 12. 10., 2025. 10. 1.>\n③ 지식재산처장 또는 심판장은 제1항 및 제2항의 경우에 변리사로 하여금 대리하게 할 것을 명할 수 있다.<개정\n2025. 10. 1.>\n④ 지식재산처장 또는 심판장은 제1항 또는 제2항에 따라 대리인의 선임 또는 교체 명령을 한 경우에는 제1항에 따\n른 특허에 관한 절차를 밟는 자 또는 제2항에 따른 대리인이 그 전에 지식재산처장 또는 특허심판원장에 대하여 한\n특허에 관한 절차의 전부 또는 일부를 무효로 할 수 있다.<개정 2019. 12. 10., 2025. 10. 1.>\n[전문개정 2014. 6. 11.]\n[제목개정 2019. 12. 10.]"}, {"no": 11, "no_str": "제11조", "title": "복수당사자의 대표", "body": "① 2인 이상이 특허에 관한 절차를 밟을 때에는 다음 각 호의 어느 하나에 해당하는 사항을\n제외하고는 각자가 모두를 대표한다. 다만, 대표자를 선정하여 지식재산처장 또는 특허심판원장에게 신고하면 그 대\n표자만이 모두를 대표할 수 있다. <개정 2016. 2. 29., 2025. 10. 1.>\n1. 특허출원의 변경ㆍ포기ㆍ취하\n2. 특허권 존속기간의 연장등록출원의 취하\n3. 신청의 취하\n4. 청구의 취하\n5. 제55조제1항에 따른 우선권 주장 또는 그 취하\n6. 제132조의17에 따른 심판청구\n② 제1항 단서에 따라 대표자를 선정하여 신고하는 경우에는 대표자로 선임된 사실을 서면으로 증명하여야 한다.\n[전문개정 2014. 6. 11.]"}, {"no": 12, "no_str": "제12조", "title": "「민사소송법」의 준용", "body": "대리인에 관하여는 이 법에 특별한 규정이 있는 경우를 제외하고는 「민사소송법」 제1편"}, {"no": 13, "no_str": "제13조", "title": "재외자의 재판관할", "body": "재외자의 특허권 또는 특허에 관한 권리에 관하여 특허관리인이 있으면 그 특허관리인의\n주소 또는 영업소를, 특허관리인이 없으면 지식재산처 소재지를 「민사소송법」 제11조에 따른 재산이 있는 곳으로\n본다. <개정 2025. 10. 1.>\n[전문개정 2014. 6. 11.]"}, {"no": 14, "no_str": "제14조", "title": "기간의 계산", "body": "이 법 또는 이 법에 따른 명령에서 정한 기간의 계산은 다음 각 호에 따른다. <개정 2025. 11. 11.>\n1. 기간의 첫날은 계산에 넣지 아니한다. 다만, 그 기간이 오전 0시부터 시작하는 경우에는 계산에 넣는다.\n2. 기간을 월 또는 연(年)으로 정한 경우에는 역(曆)에 따라 계산한다.\n3. 월 또는 연의 처음부터 기간을 기산(起算)하지 아니하는 경우에는 마지막의 월 또는 연에서 그 기산일에 해당하\n는 날의 전날로 기간이 만료한다. 다만, 월 또는 연으로 정한 경우에 마지막 월에 해당하는 날이 없으면 그 월의\n마지막 날로 기간이 만료한다.\n4. 특허에 관한 절차에서 기간의 마지막 날이 공휴일(「노동절 제정에 관한 법률」에 따른 노동절 및 토요일을 포함한\n다)에 해당하면 기간은 그 다음 날로 만료한다.\n[전문개정 2014. 6. 11.]"}, {"no": 15, "no_str": "제15조", "title": "기간의 연장 등", "body": "① 지식재산처장은 청구에 따라 또는 직권으로 제132조의17에 따른 심판의 청구기간을 30일\n이내에서 한 차례만 연장할 수 있다. 다만, 도서ㆍ벽지 등 교통이 불편한 지역에 있는 자의 경우에는 총리령으로 정\n하는 바에 따라 그 횟수 및 기간을 추가로 연장할 수 있다. <개정 2016. 2. 29., 2025. 10. 1.>\n② 지식재산처장ㆍ특허심판원장ㆍ심판장 또는 제57조제1항에 따른 심사관(이하 “심사관”이라 한다)은 이 법에 따\n라 특허에 관한 절차를 밟을 기간을 정한 경우에는 청구에 따라 그 기간을 단축 또는 연장하거나 직권으로 그 기간\n을 연장할 수 있다. 이 경우 지식재산처장 등은 그 절차의 이해관계인의 이익이 부당하게 침해되지 아니하도록 단축\n또는 연장 여부를 결정하여야 한다.<개정 2025. 10. 1.>\n③ 심판장은 이 법에 따라 특허에 관한 절차를 밟을 기일을 정한 경우에는 청구에 따라 또는 직권으로 그 기일을 변\n경할 수 있다.\n[전문개정 2014. 6. 11.]"}, {"no": 16, "no_str": "제16조", "title": "절차의 무효", "body": "① 지식재산처장 또는 특허심판원장은 제46조에 따른 보정명령을 받은 자가 지정된 기간에 그 보\n정을 하지 아니하면 특허에 관한 절차를 무효로 할 수 있다. 다만, 제82조제2항에 따른 심사청구료를 내지 아니하여\n보정명령을 받은 자가 지정된 기간에 그 심사청구료를 내지 아니하면 특허출원서에 첨부한 명세서에 관한 보정을\n무효로 할 수 있다. <개정 2025. 10. 1.>\n② 지식재산처장 또는 특허심판원장은 제1항에 따라 특허에 관한 절차가 무효로 된 경우로서 지정된 기간을 지키지\n못한 것이 정당한 사유에 의한 것으로 인정될 때에는 그 사유가 소멸한 날부터 2개월 이내에 보정명령을 받은 자의\n청구에 따라 그 무효처분을 취소할 수 있다. 다만, 지정된 기간의 만료일부터 1년이 지났을 때에는 그러하지 아니하\n다.<개정 2021. 10. 19., 2025. 10. 1.>\n③ 지식재산처장 또는 특허심판원장은 제1항 본문ㆍ단서에 따른 무효처분 또는 제2항 본문에 따른 무효처분의 취\n소처분을 할 때에는 그 보정명령을 받은 자에게 처분통지서를 송달하여야 한다.<개정 2025. 10. 1.>\n[전문개정 2014. 6. 11.]"}, {"no": 17, "no_str": "제17조", "title": "절차의 추후보완", "body": "특허에 관한 절차를 밟은 자가 책임질 수 없는 사유로 다음 각 호의 어느 하나에 해당하는 기\n간을 지키지 못한 경우에는 그 사유가 소멸한 날부터 2개월 이내에 지키지 못한 절차를 추후 보완할 수 있다. 다만,\n그 기간의 만료일부터 1년이 지났을 때에는 그러하지 아니하다. <개정 2016. 2. 29.>\n1. 제132조의17에 따른 심판의 청구기간\n2. 제180조제1항에 따른 재심의 청구기간\n[전문개정 2014. 6. 11.]"}, {"no": 18, "no_str": "제18조", "title": "절차의 효력 승계", "body": "특허권 또는 특허에 관한 권리에 관하여 밟은 절차의 효력은 그 특허권 또는 특허에 관한 권\n리의 승계인에게 미친다.\n[전문개정 2014. 6. 11.]"}, {"no": 19, "no_str": "제19조", "title": "절차의 속행", "body": "지식재산처장 또는 심판장은 특허에 관한 절차가 지식재산처 또는 특허심판원에 계속(係屬) 중일\n때 특허권 또는 특허에 관한 권리가 이전되면 그 특허권 또는 특허에 관한 권리의 승계인에 대하여 그 절차를 속행\n(續行)하게 할 수 있다. <개정 2025. 10. 1.>\n[전문개정 2014. 6. 11.]"}, {"no": 20, "no_str": "제20조", "title": "절차의 중단", "body": "특허에 관한 절차가 다음 각 호의 어느 하나에 해당하는 경우에는 지식재산처 또는 특허심판원에\n계속 중인 절차는 중단된다. 다만, 절차를 밟을 것을 위임받은 대리인이 있는 경우에는 그러하지 아니하다. <개정\n2025. 10. 1.>\n1. 당사자가 사망한 경우\n2. 당사자인 법인이 합병에 따라 소멸한 경우\n3. 당사자가 절차를 밟을 능력을 상실한 경우\n4. 당사자의 법정대리인이 사망하거나 그 대리권을 상실한 경우\n5. 당사자의 신탁에 의한 수탁자의 임무가 끝난 경우\n6. 제11조제1항 각 호 외의 부분 단서에 따른 대표자가 사망하거나 그 자격을 상실한 경우\n7. 파산관재인 등 일정한 자격에 따라 자기 이름으로 남을 위하여 당사자가 된 자가 그 자격을 잃거나 사망한 경우\n[전문개정 2014. 6. 11.]"}, {"no": 21, "no_str": "제21조", "title": "중단된 절차의 수계", "body": "제20조에 따라 지식재산처 또는 특허심판원에 계속 중인 절차가 중단된 경우에는 다음 각\n호의 구분에 따른 자가 그 절차를 수계(受繼)하여야 한다. <개정 2025. 10. 1.>\n1. 제20조제1호의 경우: 사망한 당사자의 상속인ㆍ상속재산관리인 또는 법률에 따라 절차를 속행할 자. 다만, 상속\n인은 상속을 포기할 수 있을 때까지 그 절차를 수계하지 못한다.\n2. 제20조제2호의 경우: 합병에 따라 설립되거나 합병 후 존속하는 법인\n3. 제20조제3호 및 제4호의 경우: 절차를 밟을 능력을 회복한 당사자 또는 법정대리인이 된 자\n4. 제20조제5호의 경우: 새로운 수탁자\n5. 제20조제6호의 경우: 새로운 대표자 또는 각 당사자\n6. 제20조제7호의 경우: 같은 자격을 가진 자\n[전문개정 2014. 6. 11.]"}, {"no": 22, "no_str": "제22조", "title": "수계신청", "body": "① 제20조에 따라 중단된 절차에 관한 수계신청은 제21조 각 호의 어느 하나에 해당하는 자가 할 수\n있다. 이 경우 그 상대방은 지식재산처장 또는 제143조에 따른 심판관(이하 “심판관”이라 한다)에게 제21조 각 호의\n어느 하나에 해당하는 자에 대하여 수계신청할 것을 명하도록 요청할 수 있다. <개정 2025. 10. 1.>\n② 지식재산처장 또는 심판장은 제20조에 따라 중단된 절차에 관한 수계신청이 있으면 그 사실을 상대방에게 알려\n야 한다.<개정 2025. 10. 1.>\n③ 지식재산처장 또는 심판관은 제20조에 따라 중단된 절차에 관한 수계신청에 대하여 직권으로 조사하여 이유 없\n다고 인정하면 결정으로 기각하여야 한다.<개정 2025. 10. 1.>\n④ 지식재산처장 또는 심판관은 결정 또는 심결의 등본을 송달한 후에 중단된 절차에 관한 수계신청에 대해서는 수\n계하게 할 것인지를 결정하여야 한다.<개정 2025. 10. 1.>\n⑤ 지식재산처장 또는 심판관은 제21조 각 호의 어느 하나에 해당하는 자가 중단된 절차를 수계하지 아니하면 직권\n으로 기간을 정하여 수계를 명하여야 한다.<개정 2025. 10. 1.>\n⑥ 제5항에 따른 기간에 수계가 없는 경우에는 그 기간이 끝나는 날의 다음 날에 수계가 있는 것으로 본다.\n⑦ 지식재산처장 또는 심판장은 제6항에 따라 수계가 있는 것으로 본 경우에는 그 사실을 당사자에게 알려야 한다.\n<개정 2025. 10. 1.>\n[전문개정 2014. 6. 11.]"}, {"no": 23, "no_str": "제23조", "title": "절차의 중지", "body": "① 지식재산처장 또는 심판관이 천재지변이나 그 밖의 불가피한 사유로 그 직무를 수행할 수 없을\n때에는 지식재산처 또는 특허심판원에 계속 중인 절차는 그 사유가 없어질 때까지 중지된다. <개정 2025. 10. 1.>\n② 당사자에게 일정하지 아니한 기간 동안 지식재산처 또는 특허심판원에 계속 중인 절차를 속행할 수 없는 장애사\n유가 생긴 경우에는 지식재산처장 또는 심판관은 결정으로 장애사유가 해소될 때까지 그 절차의 중지를 명할 수 있\n다.<개정 2025. 10. 1.>\n③ 지식재산처장 또는 심판관은 제2항에 따른 결정을 취소할 수 있다.<개정 2025. 10. 1.>\n④ 제1항 또는 제2항에 따른 중지나 제3항에 따른 취소를 하였을 때에는 지식재산처장 또는 심판장은 그 사실을 각\n각 당사자에게 알려야 한다.<개정 2025. 10. 1.>\n[전문개정 2014. 6. 11.]"}, {"no": 24, "no_str": "제24조", "title": "중단 또는 중지의 효과", "body": "특허에 관한 절차가 중단되거나 중지된 경우에는 그 기간의 진행은 정지되고, 그 절차\n의 수계통지를 하거나 그 절차를 속행하였을 때부터 다시 모든 기간이 진행된다.\n[전문개정 2014. 6. 11.]"}, {"no": 25, "no_str": "제25조", "title": "외국인의 권리능력", "body": "재외자 중 외국인은 다음 각 호의 어느 하나에 해당하는 경우를 제외하고는 특허권 또는 특\n허에 관한 권리를 누릴 수 없다.\n1. 그 외국인이 속하는 국가에서 대한민국 국민에 대하여 그 국가의 국민과 같은 조건으로 특허권 또는 특허에 관한\n권리를 인정하는 경우\n2. 대한민국이 그 외국인에 대하여 특허권 또는 특허에 관한 권리를 인정하는 경우에는 그 외국인이 속하는 국가에\n서 대한민국 국민에 대하여 그 국가의 국민과 같은 조건으로 특허권 또는 특허에 관한 권리를 인정하는 경우\n3. 조약 또는 이에 준하는 것(이하 “조약”이라 한다)에 따라 특허권 또는 특허에 관한 권리가 인정되는 경우\n[전문개정 2014. 6. 11.]"}, {"no": 26, "no_str": "제26조", "title": "", "body": "삭제 <2011. 12. 2.>"}, {"no": 27, "no_str": "제27조", "title": "", "body": "삭제 <2001. 2. 3.>"}, {"no": 28, "no_str": "제28조", "title": "서류제출의 효력발생시기", "body": "① 이 법 또는 이 법에 따른 명령에 따라 지식재산처장 또는 특허심판원장에게 제출\n하는 출원서, 청구서, 그 밖의 서류(물건을 포함한다. 이하 이 조에서 같다)는 지식재산처장 또는 특허심판원장에게\n도달한 날부터 제출의 효력이 발생한다. <개정 2014. 6. 11., 2025. 10. 1.>\n② 제1항의 출원서, 청구서, 그 밖의 서류를 우편으로 지식재산처장 또는 특허심판원장에게 제출하는 경우에는 다\n음 각 호의 구분에 따른 날에 지식재산처장 또는 특허심판원장에게 도달한 것으로 본다. 다만, 특허권 및 특허에 관\n한 권리의 등록신청서류와 「특허협력조약」 제2조(vii)에 따른 국제출원(이하 “국제출원”이라 한다)에 관한 서류를\n우편으로 제출하는 경우에는 그 서류가 지식재산처장 또는 특허심판원장에게 도달한 날부터 효력이 발생한다.<개\n정 2014. 6. 11., 2025. 10. 1.>\n1. 우편물의 통신일부인(通信日附印)에 표시된 날이 분명한 경우: 표시된 날\n2. 우편물의 통신일부인에 표시된 날이 분명하지 아니한 경우: 우체국에 제출한 날을 우편물 수령증에 의하여 증명\n한날\n③ 삭제<1998. 9. 23.>\n④ 제1항 및 제2항에서 규정한 사항 외에 우편물의 지연, 우편물의 망실(亡失) 및 우편업무의 중단으로 인한 서류제\n출에 필요한 사항은 총리령으로 정한다.<개정 2014. 6. 11., 2025. 10. 1.>\n[제목개정 2014. 6. 11.]"}, {"no": 28, "no_str": "제28조의2", "title": "고유번호의 기재", "body": "① 특허에 관한 절차를 밟는 자 중 총리령으로 정하는 자는 지식재산처장 또는 특허심판\n원장에게 자신의 고유번호의 부여를 신청하여야 한다. <개정 2025. 10. 1.>\n② 지식재산처장 또는 특허심판원장은 제1항에 따른 신청을 받으면 신청인에게 고유번호를 부여하고, 그 사실을 알\n려야 한다.<개정 2025. 10. 1.>\n③ 지식재산처장 또는 특허심판원장은 특허에 관한 절차를 밟는 자가 제1항에 따라 고유번호를 신청하지 아니하면\n그에게 직권으로 고유번호를 부여하고, 그 사실을 알려야 한다.<개정 2025. 10. 1.>\n④ 제2항 또는 제3항에 따라 고유번호를 부여받은 자가 특허에 관한 절차를 밟는 경우에는 총리령으로 정하는 서류\n에 자신의 고유번호를 적어야 한다. 이 경우 이 법 또는 이 법에 따른 명령에도 불구하고 그 서류에 주소(법인인 경\n우에는 영업소의 소재지를 말한다)를 적지 아니할 수 있다.<개정 2025. 10. 1.>\n⑤ 특허에 관한 절차를 밟는 자의 대리인에 관하여는 제1항부터 제4항까지의 규정을 준용한다.\n⑥ 고유번호의 부여 신청, 고유번호의 부여 및 통지, 그 밖에 고유번호에 관하여 필요한 사항은 총리령으로 정한다.\n<개정 2025. 10. 1.>\n[전문개정 2014. 6. 11.]"}, {"no": 28, "no_str": "제28조의3", "title": "전자문서에 의한 특허에 관한 절차의 수행", "body": "① 특허에 관한 절차를 밟는 자는 이 법에 따라 지식재산처장 또\n는 특허심판원장에게 제출하는 특허출원서, 그 밖의 서류를 총리령으로 정하는 방식에 따라 전자문서화하고, 이를\n정보통신망을 이용하여 제출하거나 이동식 저장장치 등 전자적 기록매체에 수록하여 제출할 수 있다. <개정 2025.\n10. 1.>\n② 제1항에 따라 제출된 전자문서는 이 법에 따라 제출된 서류와 같은 효력을 가진다.\n③ 제1항에 따라 정보통신망을 이용하여 제출된 전자문서는 그 문서의 제출인이 정보통신망을 통하여 접수번호를\n확인할 수 있는 때에 지식재산처 또는 특허심판원에서 사용하는 접수용 전산정보처리조직의 파일에 기록된 내용으\n로 접수된 것으로 본다.<개정 2025. 10. 1.>\n④ 제1항에 따라 전자문서로 제출할 수 있는 서류의 종류ㆍ제출방법, 그 밖에 전자문서에 의한 서류의 제출에 필요\n한 사항은 총리령으로 정한다.<개정 2025. 10. 1.>\n[전문개정 2014. 6. 11.]"}, {"no": 28, "no_str": "제28조의4", "title": "전자문서 이용신고 및 전자서명", "body": "① 전자문서로 특허에 관한 절차를 밟으려는 자는 미리 지식재산처장 또는\n특허심판원장에게 전자문서 이용신고를 하여야 하며, 지식재산처장 또는 특허심판원장에게 제출하는 전자문서에 제\n출인을 알아볼 수 있도록 전자서명을 하여야 한다. <개정 2025. 10. 1.>\n② 제28조의3에 따라 제출된 전자문서는 제1항에 따른 전자서명을 한 자가 제출한 것으로 본다.\n③ 제1항에 따른 전자문서 이용신고 절차, 전자서명 방법 등에 관하여 필요한 사항은 총리령으로 정한다.<개정\n2025. 10. 1.>\n[전문개정 2014. 6. 11.]"}, {"no": 28, "no_str": "제28조의5", "title": "정보통신망을 이용한 통지 등의 수행", "body": "① 지식재산처장ㆍ특허심판원장ㆍ심판장ㆍ심판관 또는 심사관은 제\n28조의4제1항에 따라 전자문서 이용신고를 한 자에게 서류의 통지 및 송달(이하 “통지등”이라 한다)을 하려는 경우\n에는 정보통신망을 이용하여 통지등을 할 수 있다. <개정 2025. 10. 1.>\n② 제1항에 따라 정보통신망을 이용하여 한 서류의 통지등은 서면으로 한 것과 같은 효력을 가진다.\n③ 제1항에 따른 서류의 통지등은 그 통지등을 받을 자가 자신이 사용하는 전산정보처리조직을 통하여 그 서류를\n확인한 때에 지식재산처 또는 특허심판원에서 사용하는 발송용 전산정보처리조직의 파일에 기록된 내용으로 도달\n한 것으로 본다.<개정 2025. 10. 1.>\n④ 제1항에 따라 정보통신망을 이용하여 하는 통지등의 종류ㆍ방법 등에 관하여 필요한 사항은 총리령으로 정한다.\n<개정 2025. 10. 1.>\n[전문개정 2014. 6. 11.]"}, {"no": 29, "no_str": "제29조", "title": "특허요건", "body": "① 산업상 이용할 수 있는 발명으로서 다음 각 호의 어느 하나에 해당하는 것을 제외하고는 그 발명\n에 대하여 특허를 받을 수 있다.\n1. 특허출원 전에 국내 또는 국외에서 공지(公知)되었거나 공연(公然)히 실시된 발명\n2. 특허출원 전에 국내 또는 국외에서 반포된 간행물에 게재되었거나 전기통신회선을 통하여 공중(公衆)이 이용할\n수 있는 발명\n② 특허출원 전에 그 발명이 속하는 기술분야에서 통상의 지식을 가진 사람이 제1항 각 호의 어느 하나에 해당하는\n발명에 의하여 쉽게 발명할 수 있으면 그 발명에 대해서는 제1항에도 불구하고 특허를 받을 수 없다.\n③ 특허출원한 발명이 다음 각 호의 요건을 모두 갖춘 다른 특허출원의 출원서에 최초로 첨부된 명세서 또는 도면\n에 기재된 발명과 동일한 경우에 그 발명은 제1항에도 불구하고 특허를 받을 수 없다. 다만, 그 특허출원의 발명자\n와 다른 특허출원의 발명자가 같거나 그 특허출원을 출원한 때의 출원인과 다른 특허출원의 출원인이 같은 경우에\n는 그러하지 아니하다.\n1. 그 특허출원일 전에 출원된 특허출원일 것\n2. 그 특허출원 후 제64조에 따라 출원공개되거나 제87조제3항에 따라 등록공고된 특허출원일 것\n④ 특허출원한 발명이 다음 각 호의 요건을 모두 갖춘 실용신안등록출원의 출원서에 최초로 첨부된 명세서 또는 도\n면에 기재된 고안(考案)과 동일한 경우에 그 발명은 제1항에도 불구하고 특허를 받을 수 없다. 다만, 그 특허출원의\n발명자와 실용신안등록출원의 고안자가 같거나 그 특허출원을 출원한 때의 출원인과 실용신안등록출원의 출원인\n이 같은 경우에는 그러하지 아니하다.\n1. 그 특허출원일 전에 출원된 실용신안등록출원일 것\n2. 그 특허출원 후 「실용신안법」 제15조에 따라 준용되는 이 법 제64조에 따라 출원공개되거나 「실용신안법」 제\n21조제3항에 따라 등록공고된 실용신안등록출원일 것\n⑤ 제3항을 적용할 때 다른 특허출원이 제199조제2항에 따른 국제특허출원(제214조제4항에 따라 특허출원으로 보\n는 국제출원을 포함한다)인 경우 제3항 본문 중 “출원서에 최초로 첨부된 명세서 또는 도면”은 “국제출원일까지 제\n출한 발명의 설명, 청구범위 또는 도면”으로, 같은 항 제2호 중 “출원공개”는 “출원공개 또는 「특허협력조약」 제\n21조에 따라 국제공개”로 본다.\n⑥ 제4항을 적용할 때 실용신안등록출원이 「실용신안법」 제34조제2항에 따른 국제실용신안등록출원(같은 법 제\n40조제4항에 따라 실용신안등록출원으로 보는 국제출원을 포함한다)인 경우 제4항 본문 중 “출원서에 최초로 첨부\n된 명세서 또는 도면”은 “국제출원일까지 제출한 고안의 설명, 청구범위 또는 도면”으로, 같은 항 제2호 중 “출원공\n개”는 “출원공개 또는 「특허협력조약」 제21조에 따라 국제공개”로 본다.\n⑦ 제3항 또는 제4항을 적용할 때 제201조제4항에 따라 취하한 것으로 보는 국제특허출원 또는 「실용신안법」 제\n35조제4항에 따라 취하한 것으로 보는 국제실용신안등록출원은 다른 특허출원 또는 실용신안등록출원으로 보지\n아니한다.\n[전문개정 2014. 6. 11.]"}, {"no": 30, "no_str": "제30조", "title": "공지 등이 되지 아니한 발명으로 보는 경우", "body": "① 특허를 받을 수 있는 권리를 가진 자의 발명이 다음 각 호의 어\n느 하나에 해당하게 된 경우 그 날부터 12개월 이내에 특허출원을 하면 그 특허출원된 발명에 대하여 제29조제1항\n또는 제2항을 적용할 때에는 그 발명은 같은 조 제1항 각 호의 어느 하나에 해당하지 아니한 것으로 본다.\n1. 특허를 받을 수 있는 권리를 가진 자에 의하여 그 발명이 제29조제1항 각 호의 어느 하나에 해당하게 된 경우. 다\n만, 조약 또는 법률에 따라 국내 또는 국외에서 출원공개되거나 등록공고된 경우는 제외한다.\n2. 특허를 받을 수 있는 권리를 가진 자의 의사에 반하여 그 발명이 제29조제1항 각 호의 어느 하나에 해당하게 된\n경우\n② 제1항제1호를 적용받으려는 자는 특허출원서에 그 취지를 적어 출원하여야 하고, 이를 증명할 수 있는 서류를\n총리령으로 정하는 방법에 따라 특허출원일부터 30일 이내에 지식재산처장에게 제출하여야 한다.<개정 2025. 10.\n1.>\n③ 제2항에도 불구하고 총리령으로 정하는 보완수수료를 납부한 경우에는 다음 각 호의 어느 하나에 해당하는 기간\n에 제1항제1호를 적용받으려는 취지를 적은 서류 또는 이를 증명할 수 있는 서류를 제출할 수 있다.<신설 2015. 1.\n28., 2025. 10. 1.>\n1. 제47조제1항에 따라 보정할 수 있는 기간\n2. 제66조에 따른 특허결정 또는 제176조제1항에 따른 특허거절결정 취소심결(특허등록을 결정한 심결에 한정하되,\n재심심결을 포함한다)의 등본을 송달받은 날부터 3개월 이내의 기간. 다만, 제79조에 따른 설정등록을 받으려는\n날이 3개월보다 짧은 경우에는 그 날까지의 기간\n[전문개정 2014. 6. 11.]"}, {"no": 31, "no_str": "제31조", "title": "", "body": "삭제 <2006. 3. 3.>"}, {"no": 32, "no_str": "제32조", "title": "특허를 받을 수 없는 발명", "body": "공공의 질서 또는 선량한 풍속에 어긋나거나 공중의 위생을 해칠 우려가 있는 발명\n에 대해서는 제29조제1항에도 불구하고 특허를 받을 수 없다.\n[전문개정 2014. 6. 11.]"}, {"no": 33, "no_str": "제33조", "title": "특허를 받을 수 있는 자", "body": "① 발명을 한 사람 또는 그 승계인은 이 법에서 정하는 바에 따라 특허를 받을 수 있는\n권리를 가진다. 다만, 지식재산처 직원 및 특허심판원 직원은 상속이나 유증(遺贈)의 경우를 제외하고는 재직 중 특\n허를 받을 수 없다. <개정 2025. 10. 1.>\n② 2명 이상이 공동으로 발명한 경우에는 특허를 받을 수 있는 권리를 공유한다.\n[전문개정 2014. 6. 11.]"}, {"no": 34, "no_str": "제34조", "title": "무권리자의 특허출원과 정당한 권리자의 보호", "body": "발명자가 아닌 자로서 특허를 받을 수 있는 권리의 승계인이 아\n닌 자(이하 “무권리자”라 한다)가 한 특허출원이 제33조제1항 본문에 따른 특허를 받을 수 있는 권리를 가지지 아니\n한 사유로 제62조제2호에 해당하여 특허를 받지 못하게 된 경우에는 그 무권리자의 특허출원 후에 한 정당한 권리\n자의 특허출원은 무권리자가 특허출원한 때에 특허출원한 것으로 본다. 다만, 무권리자가 특허를 받지 못하게 된 날\n부터 30일이 지난 후에 정당한 권리자가 특허출원을 한 경우에는 그러하지 아니하다.\n[전문개정 2014. 6. 11.]"}, {"no": 35, "no_str": "제35조", "title": "무권리자의 특허와 정당한 권리자의 보호", "body": "제33조제1항 본문에 따른 특허를 받을 수 있는 권리를 가지지 아니\n한 사유로 제133조제1항제2호에 해당하여 특허를 무효로 한다는 심결이 확정된 경우에는 그 무권리자의 특허출원\n후에 한 정당한 권리자의 특허출원은 무효로 된 그 특허의 출원 시에 특허출원한 것으로 본다. 다만, 심결이 확정된\n날부터 30일이 지난 후에 정당한 권리자가 특허출원을 한 경우에는 그러하지 아니하다. <개정 2016. 2. 29.>\n[전문개정 2014. 6. 11.]"}, {"no": 36, "no_str": "제36조", "title": "선출원", "body": "① 동일한 발명에 대하여 다른 날에 둘 이상의 특허출원이 있는 경우에는 먼저 특허출원한 자만이 그\n발명에 대하여 특허를 받을 수 있다.\n② 동일한 발명에 대하여 같은 날에 둘 이상의 특허출원이 있는 경우에는 특허출원인 간에 협의하여 정한 하나의\n특허출원인만이 그 발명에 대하여 특허를 받을 수 있다. 다만, 협의가 성립하지 아니하거나 협의를 할 수 없는 경우\n에는 어느 특허출원인도 그 발명에 대하여 특허를 받을 수 없다.\n③ 특허출원된 발명과 실용신안등록출원된 고안이 동일한 경우 그 특허출원과 실용신안등록출원이 다른 날에 출원\n된 것이면 제1항을 준용하고, 그 특허출원과 실용신안등록출원이 같은 날에 출원된 것이면 제2항을 준용한다.\n④ 특허출원 또는 실용신안등록출원이 다음 각 호의 어느 하나에 해당하는 경우 그 특허출원 또는 실용신안등록출\n원은 제1항부터 제3항까지의 규정을 적용할 때에는 처음부터 없었던 것으로 본다. 다만, 제2항 단서(제3항에 따라\n준용되는 경우를 포함한다)에 해당하여 그 특허출원 또는 실용신안등록출원에 대하여 거절결정이나 거절한다는 취\n지의 심결이 확정된 경우에는 그러하지 아니하다.\n1. 포기, 무효 또는 취하된 경우\n2. 거절결정이나 거절한다는 취지의 심결이 확정된 경우\n⑤ 발명자 또는 고안자가 아닌 자로서 특허를 받을 수 있는 권리 또는 실용신안등록을 받을 수 있는 권리의 승계인\n이 아닌 자가 한 특허출원 또는 실용신안등록출원은 제1항부터 제3항까지의 규정을 적용할 때에는 처음부터 없었\n던 것으로 본다.\n⑥ 지식재산처장은 제2항의 경우에 특허출원인에게 기간을 정하여 협의의 결과를 신고할 것을 명하고, 그 기간에\n신고가 없으면 제2항에 따른 협의는 성립되지 아니한 것으로 본다.<개정 2025. 10. 1.>\n[전문개정 2014. 6. 11.]"}, {"no": 37, "no_str": "제37조", "title": "특허를 받을 수 있는 권리의 이전 등", "body": "① 특허를 받을 수 있는 권리는 이전할 수 있다.\n② 특허를 받을 수 있는 권리는 질권의 목적으로 할 수 없다.\n③ 특허를 받을 수 있는 권리가 공유인 경우에는 각 공유자는 다른 공유자 모두의 동의를 받아야만 그 지분을 양도\n할 수 있다.\n[전문개정 2014. 6. 11.]"}, {"no": 38, "no_str": "제38조", "title": "특허를 받을 수 있는 권리의 승계", "body": "① 특허출원 전에 이루어진 특허를 받을 수 있는 권리의 승계는 그 승계인이\n특허출원을 하여야 제3자에게 대항할 수 있다.\n② 동일한 자로부터 동일한 특허를 받을 수 있는 권리를 승계한 자가 둘 이상인 경우 그 승계한 권리에 대하여 같은\n날에 둘 이상의 특허출원이 있으면 특허출원인 간에 협의하여 정한 자에게만 승계의 효력이 발생한다.\n③ 동일한 자로부터 동일한 발명 및 고안에 대한 특허를 받을 수 있는 권리 및 실용신안등록을 받을 수 있는 권리를\n승계한 자가 둘 이상인 경우 그 승계한 권리에 대하여 같은 날에 특허출원 및 실용신안등록출원이 있으면 특허출원\n인 및 실용신안등록출원인 간에 협의하여 정한 자에게만 승계의 효력이 발생한다.\n④ 특허출원 후에는 특허를 받을 수 있는 권리의 승계는 상속, 그 밖의 일반승계의 경우를 제외하고는 특허출원인변\n경신고를 하여야만 그 효력이 발생한다.\n⑤ 특허를 받을 수 있는 권리의 상속, 그 밖의 일반승계가 있는 경우에는 승계인은 지체 없이 그 취지를 지식재산처\n장에게 신고하여야 한다.<개정 2025. 10. 1.>\n⑥ 동일한 자로부터 동일한 특허를 받을 수 있는 권리를 승계한 자가 둘 이상인 경우 그 승계한 권리에 대하여 같은\n날에 둘 이상의 특허출원인변경신고가 있으면 신고를 한 자 간에 협의하여 정한 자에게만 신고의 효력이 발생한다.\n⑦ 제2항ㆍ제3항 또는 제6항의 경우에는 제36조제6항을 준용한다.\n[전문개정 2014. 6. 11.]"}, {"no": 39, "no_str": "제39조", "title": "", "body": "삭제 <2006. 3. 3.>"}, {"no": 40, "no_str": "제40조", "title": "", "body": "삭제 <2006. 3. 3.>"}, {"no": 41, "no_str": "제41조", "title": "국방상 필요한 발명 등", "body": "① 정부는 국방상 필요한 경우 외국에 특허출원하는 것을 금지하거나 발명자ㆍ출원인\n및 대리인에게 그 특허출원의 발명을 비밀로 취급하도록 명할 수 있다. 다만, 정부의 허가를 받은 경우에는 외국에\n특허출원을 할 수 있다.\n② 정부는 특허출원된 발명이 국방상 필요한 경우에는 특허를 하지 아니할 수 있으며, 전시ㆍ사변 또는 이에 준하는\n비상시에 국방상 필요한 경우에는 특허를 받을 수 있는 권리를 수용할 수 있다.\n③ 제1항에 따른 외국에의 특허출원 금지 또는 비밀취급에 따른 손실에 대해서는 정부는 정당한 보상금을 지급하여\n야 한다.\n④ 제2항에 따라 특허하지 아니하거나 수용한 경우에는 정부는 정당한 보상금을 지급하여야 한다.\n⑤ 제1항에 따른 외국에의 특허출원 금지 또는 비밀취급명령을 위반한 경우에는 그 발명에 대하여 특허를 받을 수\n있는 권리를 포기한 것으로 본다.\n⑥ 제1항에 따른 외국에의 특허출원 금지 또는 비밀취급명령을 위반한 경우에는 외국에의 특허출원 금지 또는 비밀\n취급에 따른 손실보상금의 청구권을 포기한 것으로 본다.\n⑦ 제1항에 따른 외국에의 특허출원 금지 및 비밀취급의 절차, 제2항부터 제4항까지의 규정에 따른 수용, 보상금 지\n급의 절차, 그 밖에 필요한 사항은 대통령령으로 정한다.\n[전문개정 2014. 6. 11.]"}, {"no": 42, "no_str": "제42조", "title": "특허출원", "body": "① 특허를 받으려는 자는 다음 각 호의 사항을 적은 특허출원서를 지식재산처장에게 제출하여야 한\n다. <개정 2014. 6. 11., 2025. 10. 1.>\n1. 특허출원인의 성명 및 주소(법인인 경우에는 그 명칭 및 영업소의 소재지)\n2. 특허출원인의 대리인이 있는 경우에는 그 대리인의 성명 및 주소나 영업소의 소재지[대리인이 특허법인ㆍ\n인(유한)인 경우에는 그 명칭, 사무소의 소재지 및 지정된 변리사의 성명]\n3. 발명의 명칭\n4. 발명자의 성명 및 주소\n② 제1항에 따른 특허출원서에는 발명의 설명ㆍ청구범위를 적은 명세서와 필요한 도면 및 요약서를 첨부하여야 한\n다.<개정 2014. 6. 11.>\n③ 제2항에 따른 발명의 설명은 다음 각 호의 요건을 모두 충족하여야 한다.<개정 2014. 6. 11.>\n1. 그 발명이 속하는 기술분야에서 통상의 지식을 가진 사람이 그 발명을 쉽게 실시할 수 있도록 명확하고 상세하게\n적을 것\n2. 그 발명의 배경이 되는 기술을 적을 것\n④ 제2항에 따른 청구범위에는 보호받으려는 사항을 적은 항(이하 “청구항”이라 한다)이 하나 이상 있어야 하며, 그\n청구항은 다음 각 호의 요건을 모두 충족하여야 한다.<개정 2014. 6. 11.>\n1. 발명의 설명에 의하여 뒷받침될 것\n2. 발명이 명확하고 간결하게 적혀 있을 것\n⑤ 삭제<2014. 6. 11.>\n⑥ 제2항에 따른 청구범위에는 보호받으려는 사항을 명확히 할 수 있도록 발명을 특정하는 데 필요하다고 인정되는\n구조ㆍ방법ㆍ기능ㆍ물질 또는 이들의 결합관계 등을 적어야 한다.<개정 2014. 6. 11.>\n⑦ 삭제<2014. 6. 11.>\n⑧ 제2항에 따른 청구범위의 기재방법에 관하여 필요한 사항은 대통령령으로 정한다.<개정 2014. 6. 11.>\n⑨ 제2항에 따른 발명의 설명, 도면 및 요약서의 기재방법 등에 관하여 필요한 사항은 총리령으로 정한다.<개정\n2014. 6. 11., 2025. 10. 1.>\n[제목개정 2014. 6. 11.]"}, {"no": 42, "no_str": "제42조의2", "title": "특허출원일 등", "body": "① 특허출원일은 명세서 및 필요한 도면을 첨부한 특허출원서가 지식재산처장에게 도달한\n날로 한다. 이 경우 명세서에 청구범위는 적지 아니할 수 있으나, 발명의 설명은 적어야 한다. <개정 2025. 10. 1.>\n② 특허출원인은 제1항 후단에 따라 특허출원서에 최초로 첨부한 명세서에 청구범위를 적지 아니한 경우에는 제\n64조제1항 각 호의 구분에 따른 날부터 1년 2개월이 되는 날까지 명세서에 청구범위를 적는 보정을 하여야 한다.\n다만, 본문에 따른 기한 이전에 제60조제3항에 따른 출원심사 청구의 취지를 통지받은 경우에는 그 통지를 받은 날\n부터 3개월이 되는 날 또는 제64조제1항 각 호의 구분에 따른 날부터 1년 2개월이 되는 날 중 빠른 날까지 보정을\n하여야 한다.\n③ 특허출원인이 제2항에 따른 보정을 하지 아니한 경우에는 제2항에 따른 기한이 되는 날의 다음 날에 해당 특허\n출원을 취하한 것으로 본다.\n[본조신설 2014. 6. 11.]"}, {"no": 42, "no_str": "제42조의3", "title": "외국어특허출원 등", "body": "① 특허출원인이 명세서 및 도면(도면 중 설명부분에 한정한다. 이하 제2항 및 제5항에\n서 같다)을 국어가 아닌 총리령으로 정하는 언어로 적겠다는 취지를 특허출원을 할 때 특허출원서에 적은 경우에는\n그 언어로 적을 수 있다. <개정 2025. 10. 1.>\n② 특허출원인이 특허출원서에 최초로 첨부한 명세서 및 도면을 제1항에 따른 언어로 적은 특허출원(이하 “외국어\n특허출원”이라 한다)을 한 경우에는 제64조제1항 각 호의 구분에 따른 날부터 1년 2개월이 되는 날까지 그 명세서\n및 도면의 국어번역문을 총리령으로 정하는 방법에 따라 제출하여야 한다. 다만, 본문에 따른 기한 이전에 제60조제\n3항에 따른 출원심사 청구의 취지를 통지받은 경우에는 그 통지를 받은 날부터 3개월이 되는 날 또는 제64조제1항\n각 호의 구분에 따른 날부터 1년 2개월이 되는 날 중 빠른 날까지 제출하여야 한다.<개정 2025. 10. 1.>\n③ 제2항에 따라 국어번역문을 제출한 특허출원인은 제2항에 따른 기한 이전에 그 국어번역문을 갈음하여 새로운\n국어번역문을 제출할 수 있다. 다만, 다음 각 호의 어느 하나에 해당하는 경우에는 그러하지 아니하다.\n1. 명세서 또는 도면을 보정(제5항에 따라 보정한 것으로 보는 경우는 제외한다)한 경우\n2. 특허출원인이 출원심사의 청구를 한 경우\n④ 특허출원인이 제2항에 따른 명세서의 국어번역문을 제출하지 아니한 경우에는 제2항에 따른 기한이 되는 날의\n다음 날에 해당 특허출원을 취하한 것으로 본다.\n⑤ 특허출원인이 제2항에 따른 국어번역문 또는 제3항 본문에 따른 새로운 국어번역문을 제출한 경우에는 외국어\n특허출원의 특허출원서에 최초로 첨부한 명세서 및 도면을 그 국어번역문에 따라 보정한 것으로 본다. 다만, 제3항\n본문에 따라 새로운 국어번역문을 제출한 경우에는 마지막 국어번역문(이하 이 조 및 제47조제2항 후단에서 “최종\n국어번역문”이라 한다) 전에 제출한 국어번역문에 따라 보정한 것으로 보는 모든 보정은 처음부터 없었던 것으로\n본다.\n⑥ 특허출원인은 제47조제1항에 따라 보정을 할 수 있는 기간에 최종 국어번역문의 잘못된 번역을 총리령으로 정\n하는 방법에 따라 정정할 수 있다. 이 경우 정정된 국어번역문에 관하여는 제5항을 적용하지 아니한다.<개정 2025.\n10. 1.>\n⑦ 제6항 전단에 따라 제47조제1항제1호 또는 제2호에 따른 기간에 정정을 하는 경우에는 마지막 정정 전에 한 모\n든 정정은 처음부터 없었던 것으로 본다.<신설 2016. 2. 29.>\n[본조신설 2014. 6. 11.]"}, {"no": 43, "no_str": "제43조", "title": "요약서", "body": "제42조제2항에 따른 요약서는 기술정보로서의 용도로 사용하여야 하며, 특허발명의 보호범위를 정하는\n데에는 사용할 수 없다.\n[전문개정 2014. 6. 11.]"}, {"no": 44, "no_str": "제44조", "title": "공동출원", "body": "특허를 받을 수 있는 권리가 공유인 경우에는 공유자 모두가 공동으로 특허출원을 하여야 한다.\n[전문개정 2014. 6. 11.]"}, {"no": 45, "no_str": "제45조", "title": "하나의 특허출원의 범위", "body": "① 특허출원은 하나의 발명마다 하나의 특허출원으로 한다. 다만, 하나의 총괄적 발명\n의 개념을 형성하는 일 군(群)의 발명에 대하여 하나의 특허출원으로 할 수 있다.\n② 제1항 단서에 따라 일 군의 발명에 대하여 하나의 특허출원으로 할 수 있는 요건은 대통령령으로 정한다.\n[전문개정 2014. 6. 11.]"}, {"no": 46, "no_str": "제46조", "title": "절차의 보정", "body": "지식재산처장 또는 특허심판원장은 특허에 관한 절차가 다음 각 호의 어느 하나에 해당하는 경우\n에는 기간을 정하여 보정을 명하여야 한다. 이 경우 보정명령을 받은 자는 그 기간에 그 보정명령에 대한 의견서를\n지식재산처장 또는 특허심판원장에게 제출할 수 있다. <개정 2025. 10. 1.>\n1. 제3조제1항 또는 제6조를 위반한 경우\n2. 이 법 또는 이 법에 따른 명령으로 정하는 방식을 위반한 경우\n3. 제82조에 따라 내야 할 수수료를 내지 아니한 경우\n[전문개정 2014. 6. 11.]"}, {"no": 47, "no_str": "제47조", "title": "특허출원의 보정", "body": "① 특허출원인은 제66조에 따른 특허결정의 등본을 송달하기 전까지 특허출원서에 첨부한 명\n세서 또는 도면을 보정할 수 있다. 다만, 제63조제1항에 따른 거절이유통지(이하 “거절이유통지”라 한다)를 받은 후\n에는 다음 각 호의 구분에 따른 기간(제3호의 경우에는 그 때)에만 보정할 수 있다. <개정 2016. 2. 29.>\n1. 거절이유통지(거절이유통지에 대한 보정에 따라 발생한 거절이유에 대한 거절이유통지는 제외한다)를 최초로 받\n거나 제2호의 거절이유통지가 아닌 거절이유통지를 받은 경우: 해당 거절이유통지에 따른 의견서 제출기간\n2. 거절이유통지(제66조의3제2항에 따른 통지를 한 경우에는 그 통지 전의 거절이유통지는 제외한다)에 대한 보정\n에 따라 발생한 거절이유에 대하여 거절이유통지를 받은 경우: 해당 거절이유통지에 따른 의견서 제출기간\n3. 제67조의2에 따른 재심사를 청구하는 경우: 청구할 때\n② 제1항에 따른 명세서 또는 도면의 보정은 특허출원서에 최초로 첨부한 명세서 또는 도면에 기재된 사항의 범위\n에서 하여야 한다. 이 경우, 외국어특허출원에 대한 보정은 최종 국어번역문(제42조의3제6항 전단에 따른 정정이\n있는 경우에는 정정된 국어번역문을 말한다) 또는 특허출원서에 최초로 첨부한 도면(도면 중 설명부분은 제외한다\n)에 기재된 사항의 범위에서도 하여야 한다.\n③ 제1항제2호 및 제3호에 따른 보정 중 청구범위에 대한 보정은 다음 각 호의 어느 하나에 해당하는 경우에만 할\n수 있다.\n1. 청구항을 한정 또는 삭제하거나 청구항에 부가하여 청구범위를 감축하는 경우\n2. 잘못 기재된 사항을 정정하는 경우\n3. 분명하지 아니하게 기재된 사항을 명확하게 하는 경우\n4. 제2항에 따른 범위를 벗어난 보정에 대하여 그 보정 전 청구범위로 되돌아가거나 되돌아가면서 청구범위를 제\n1호부터 제3호까지의 규정에 따라 보정하는 경우\n④ 제1항제1호 또는 제2호에 따른 기간에 보정을 하는 경우에는 각각의 보정절차에서 마지막 보정 전에 한 모든 보\n정은 취하된 것으로 본다.\n⑤ 외국어특허출원인 경우에는 제1항 본문에도 불구하고 제42조의3제2항에 따라 국어번역문을 제출한 경우에만\n명세서 또는 도면을 보정할 수 있다.\n[전문개정 2014. 6. 11.]"}, {"no": 48, "no_str": "제48조", "title": "", "body": "삭제 <2001. 2. 3.>"}, {"no": 49, "no_str": "제49조", "title": "", "body": "삭제 <2006. 3. 3.>"}, {"no": 50, "no_str": "제50조", "title": "", "body": "삭제 <1997. 4. 10.>"}, {"no": 51, "no_str": "제51조", "title": "보정각하", "body": "① 심사관은 제47조제1항제2호 및 제3호에 따른 보정이 같은 조 제2항 또는 제3항을 위반하거나 그\n보정(같은 조 제3항제1호 및 제4호에 따른 보정 중 청구항을 삭제하는 보정은 제외한다)에 따라 새로운 거절이유가\n발생한 것으로 인정하면 결정으로 그 보정을 각하하여야 한다. 다만, 다음 각 호의 어느 하나에 해당하는 보정인 경\n우에는 그러하지 아니하다. <개정 2016. 2. 29.>\n1. 제66조의2에 따른 직권보정을 하는 경우: 그 직권보정 전에 한 보정\n2. 제66조의3에 따른 직권 재심사를 하는 경우: 취소된 특허결정 전에 한 보정\n3. 제67조의2에 따른 재심사의 청구가 있는 경우: 그 청구 전에 한 보정\n② 제1항에 따른 각하결정은 서면으로 하여야 하며, 그 이유를 붙여야 한다.\n③ 제1항에 따른 각하결정에 대해서는 불복할 수 없다. 다만, 제132조의17에 따른 특허거절결정에 대한 심판에서\n그 각하결정(제66조의3에 따른 직권 재심사를 하는 경우 취소된 특허결정 전에 한 각하결정과 제67조의2에 따른\n재심사의 청구가 있는 경우 그 청구 전에 한 각하결정은 제외한다)에 대하여 다투는 경우에는 그러하지 아니하다.\n<개정 2016. 2. 29.>\n[전문개정 2014. 6. 11.]"}, {"no": 52, "no_str": "제52조", "title": "분할출원", "body": "① 특허출원인은 둘 이상의 발명을 하나의 특허출원으로 한 경우에는 그 특허출원의 출원서에 최초\n로 첨부된 명세서 또는 도면에 기재된 사항의 범위에서 다음 각 호의 어느 하나에 해당하는 기간에 그 일부를 하나\n이상의 특허출원으로 분할할 수 있다. 다만, 그 특허출원이 외국어특허출원인 경우에는 그 특허출원에 대한 제42조\n의3제2항에 따른 국어번역문이 제출된 경우에만 분할할 수 있다. <개정 2015. 1. 28., 2016. 2. 29., 2021. 10. 19.>\n1. 제47조제1항에 따라 보정을 할 수 있는 기간\n2. 특허거절결정등본을 송달받은 날부터 3개월(제15조제1항에 따라 제132조의17에 따른 기간이 연장된 경우 그 연\n장된 기간을 말한다) 이내의 기간\n3. 제66조에 따른 특허결정 또는 제176조제1항에 따른 특허거절결정 취소심결(특허등록을 결정한 심결에 한정하되,\n재심심결을 포함한다)의 등본을 송달받은 날부터 3개월 이내의 기간. 다만, 제79조에 따른 설정등록을 받으려는\n날이 3개월보다 짧은 경우에는 그 날까지의 기간\n② 제1항에 따라 분할된 특허출원(이하 “분할출원”이라 한다)이 있는 경우 그 분할출원은 특허출원한 때에 출원한\n것으로 본다. 다만, 그 분할출원에 대하여 다음 각 호의 규정을 적용할 경우에는 해당 분할출원을 한 때에 출원한 것\n으로 본다.\n1. 분할출원이 제29조제3항에 따른 다른 특허출원 또는 「실용신안법」 제4조제4항에 따른 특허출원에 해당하여 이\n법 제29조제3항 또는 「실용신안법」 제4조제4항을 적용하는 경우\n2. 제30조제2항을 적용하는 경우\n3. 제54조제3항을 적용하는 경우\n4. 제55조제2항을 적용하는 경우\n③ 제1항에 따라 분할출원을 하려는 자는 분할출원을 할 때에 특허출원서에 그 취지 및 분할의 기초가 된 특허출원\n의 표시를 하여야 한다.\n④ 분할의 기초가 된 특허출원이 제54조 또는 제55조에 따라 우선권을 주장한 특허출원인 경우에는 제1항에 따라\n분할출원을 한 때에 그 분할출원에 대해서도 우선권 주장을 한 것으로 보며, 분할의 기초가 된 특허출원에 대하여\n제54조제4항에 따라 제출된 서류 또는 서면이 있는 경우에는 분할출원에 대해서도 해당 서류 또는 서면이 제출된\n것으로 본다.<신설 2021. 10. 19.>\n⑤ 제4항에 따라 우선권을 주장한 것으로 보는 분할출원에 관하여는 제54조제7항 또는 제55조제7항에 따른 기한이\n지난 후에도 분할출원을 한 날부터 30일 이내에 그 우선권 주장의 전부 또는 일부를 취하할 수 있다.<신설 2021.\n10. 19.>\n⑥ 분할출원의 경우에 제54조에 따른 우선권을 주장하는 자는 같은 조 제4항에 따른 서류를 같은 조 제5항에 따른\n기간이 지난 후에도 분할출원을 한 날부터 3개월 이내에 지식재산처장에게 제출할 수 있다.<개정 2021. 10. 19.,\n2025. 10. 1.>\n⑦ 분할출원이 외국어특허출원인 경우에는 특허출원인은 제42조의3제2항에 따른 국어번역문 또는 같은 조 제3항\n본문에 따른 새로운 국어번역문을 같은 조 제2항에 따른 기한이 지난 후에도 분할출원을 한 날부터 30일이 되는 날\n까지는 제출할 수 있다. 다만, 제42조의3제3항 각 호의 어느 하나에 해당하는 경우에는 새로운 국어번역문을 제출\n할 수 없다.<개정 2021. 10. 19.>\n⑧ 특허출원서에 최초로 첨부한 명세서에 청구범위를 적지 아니한 분할출원에 관하여는 제42조의2제2항에 따른 기\n한이 지난 후에도 분할출원을 한 날부터 30일이 되는 날까지는 명세서에 청구범위를 적는 보정을 할 수 있다.<개정\n2021. 10. 19.>\n[전문개정 2014. 6. 11.]"}, {"no": 52, "no_str": "제52조의2", "title": "분리출원", "body": "① 특허거절결정을 받은 자는 제132조의17에 따른 심판청구가 기각된 경우 그 심결의 등본을 송\n달받은 날부터 30일(제186조제5항에 따라 심판장이 부가기간을 정한 경우에는 그 기간을 말한다) 이내에 그 특허출\n원의 출원서에 최초로 첨부된 명세서 또는 도면에 기재된 사항의 범위에서 그 특허출원의 일부를 새로운 특허출원\n으로 분리할 수 있다. 이 경우 새로운 특허출원의 청구범위에는 다음 각 호의 어느 하나에 해당하는 청구항만을 적을\n수 있다.\n1. 그 심판청구의 대상이 되는 특허거절결정에서 거절되지 아니한 청구항\n2. 거절된 청구항에서 그 특허거절결정의 기초가 된 선택적 기재사항을 삭제한 청구항\n3. 제1호 또는 제2호에 따른 청구항을 제47조제3항 각 호(같은 항 제4호는 제외한다)의 어느 하나에 해당하도록 적\n은 청구항\n4. 제1호부터 제3호까지 중 어느 하나의 청구항에서 그 특허출원의 출원서에 최초로 첨부된 명세서 또는 도면에 기\n재된 사항의 범위를 벗어난 부분을 삭제한 청구항\n② 제1항에 따라 분리된 특허출원(이하 “분리출원”이라 한다)에 관하여는 제52조제2항부터 제5항까지의 규정을 준\n용한다. 이 경우 “분할”은 “분리”로, “분할출원”은 “분리출원”으로 본다.\n③ 분리출원을 하는 경우에는 제42조의2제1항 후단 또는 제42조의3제1항에도 불구하고 특허출원서에 최초로 첨부\n한 명세서에 청구범위를 적지 아니하거나 명세서 및 도면(도면 중 설명부분에 한정한다)을 국어가 아닌 언어로 적\n을 수 없다.\n④ 분리출원은 새로운 분리출원, 분할출원 또는 「실용신안법」 제10조에 따른 변경출원의 기초가 될 수 없다.\n[본조신설 2021. 10. 19.]"}, {"no": 53, "no_str": "제53조", "title": "변경출원", "body": "① 실용신안등록출원인은 그 실용신안등록출원의 출원서에 최초로 첨부된 명세서 또는 도면에 기재\n된 사항의 범위에서 그 실용신안등록출원을 특허출원으로 변경할 수 있다. 다만, 다음 각 호의 어느 하나에 해당하는\n경우에는 그러하지 아니하다. <개정 2014. 6. 11., 2016. 2. 29., 2021. 10. 19.>\n1. 그 실용신안등록출원에 관하여 최초의 거절결정등본을 송달받은 날부터 3개월(「실용신안법」 제3조에 따라 준용\n되는 이 법 제15조제1항에 따라 제132조의17에 따른 기간이 연장된 경우에는 그 연장된 기간을 말한다)이 지난\n경우\n2. 그 실용신안등록출원이 「실용신안법」 제8조의3제2항에 따른 외국어실용신안등록출원인 경우로서 변경하여 출\n원할 때 같은 항에 따른 국어번역문이 제출되지 아니한 경우\n② 제1항에 따라 변경된 특허출원(이하 “변경출원”이라 한다)이 있는 경우에 그 변경출원은 실용신안등록출원을 한\n때에 특허출원한 것으로 본다. 다만, 그 변경출원이 다음 각 호의 어느 하나에 해당하는 경우에는 그러하지 아니하\n다.<개정 2014. 6. 11.>\n1. 제29조제3항에 따른 다른 특허출원 또는 「실용신안법」 제4조제4항에 따른 특허출원에 해당하여 이 법 제29조제\n3항 또는 「실용신안법」 제4조제4항을 적용하는 경우\n2. 제30조제2항을 적용하는 경우\n3. 제54조제3항을 적용하는 경우\n4. 제55조제2항을 적용하는 경우\n③ 제1항에 따라 변경출원을 하려는 자는 변경출원을 할 때 특허출원서에 그 취지 및 변경출원의 기초가 된 실용신\n안등록출원의 표시를 하여야 한다.<개정 2014. 6. 11.>\n④ 변경출원이 있는 경우에는 그 실용신안등록출원은 취하된 것으로 본다.<개정 2014. 6. 11.>\n⑤ 삭제<2014. 6. 11.>\n⑥ 변경출원의 경우에 제54조에 따른 우선권을 주장하는 자는 같은 조 제4항에 따른 서류를 같은 조 제5항에 따른\n기간이 지난 후에도 변경출원을 한 날부터 3개월 이내에 지식재산처장에게 제출할 수 있다.<개정 2013. 3. 22.,\n2025. 10. 1.>\n⑦ 특허출원인은 변경출원이 외국어특허출원인 경우에는 제42조의3제2항에 따른 국어번역문 또는 같은 조 제3항\n본문에 따른 새로운 국어번역문을 같은 조 제2항에 따른 기한이 지난 후에도 변경출원을 한 날부터 30일이 되는 날\n까지는 제출할 수 있다. 다만, 제42조의3제3항 각 호의 어느 하나에 해당하는 경우에는 새로운 국어번역문을 제출\n할 수 없다.<신설 2014. 6. 11.>\n⑧ 특허출원인은 특허출원서에 최초로 첨부한 명세서에 청구범위를 적지 아니한 변경출원의 경우 제42조의2제2항\n에 따른 기한이 지난 후에도 변경출원을 한 날부터 30일이 되는 날까지 명세서에 청구범위를 적는 보정을 할 수 있\n다.<신설 2014. 6. 11.>\n[전문개정 2006. 3. 3.]"}, {"no": 54, "no_str": "제54조", "title": "조약에 의한 우선권 주장", "body": "① 조약에 따라 다음 각 호의 어느 하나에 해당하는 경우에는 제29조 및 제36조를 적\n용할 때에 그 당사국에 출원한 날을 대한민국에 특허출원한 날로 본다.\n1. 대한민국 국민에게 특허출원에 대한 우선권을 인정하는 당사국의 국민이 그 당사국 또는 다른 당사국에 특허출\n원한 후 동일한 발명을 대한민국에 특허출원하여 우선권을 주장하는 경우\n2. 대한민국 국민에게 특허출원에 대한 우선권을 인정하는 당사국에 대한민국 국민이 특허출원한 후 동일한 발명을\n대한민국에 특허출원하여 우선권을 주장하는 경우\n② 제1항에 따라 우선권을 주장하려는 자는 우선권 주장의 기초가 되는 최초의 출원일부터 1년 이내에 특허출원을\n하지 아니하면 우선권을 주장할 수 없다.\n③ 제1항에 따라 우선권을 주장하려는 자는 특허출원을 할 때 특허출원서에 그 취지, 최초로 출원한 국가명 및 출원\n의 연월일을 적어야 한다.\n④ 제3항에 따라 우선권을 주장한 자는 제1호의 서류 또는 제2호의 서면을 지식재산처장에게 제출하여야 한다. 다\n만, 제2호의 서면은 총리령으로 정하는 국가의 경우만 해당한다.<개정 2025. 10. 1.>\n1. 최초로 출원한 국가의 정부가 인증하는 서류로서 특허출원의 연월일을 적은 서면, 발명의 명세서 및 도면의 등본\n2. 최초로 출원한 국가의 특허출원의 출원번호 및 그 밖에 출원을 확인할 수 있는 정보 등 총리령으로 정하는 사항\n을 적은 서면\n⑤ 제4항에 따른 서류 또는 서면은 다음 각 호에 해당하는 날 중 최우선일(最優先日)부터 1년 4개월 이내에 제출하\n여야 한다.\n1. 조약 당사국에 최초로 출원한 출원일\n2. 그 특허출원이 제55조제1항에 따른 우선권 주장을 수반하는 경우에는 그 우선권 주장의 기초가 되는 출원의 출\n원일\n3. 그 특허출원이 제3항에 따른 다른 우선권 주장을 수반하는 경우에는 그 우선권 주장의 기초가 되는 출원의 출원\n일\n⑥ 제3항에 따라 우선권을 주장한 자가 제5항의 기간에 제4항에 따른 서류를 제출하지 아니한 경우에는 그 우선권\n주장은 효력을 상실한다.\n⑦ 제1항에 따라 우선권 주장을 한 자 중 제2항의 요건을 갖춘 자는 제5항에 따른 최우선일부터 1년 4개월 이내에\n해당 우선권 주장을 보정하거나 추가할 수 있다.\n[전문개정 2014. 6. 11.]"}, {"no": 55, "no_str": "제55조", "title": "특허출원 등을 기초로 한 우선권 주장", "body": "① 특허를 받으려는 자는 자신이 특허나 실용신안등록을 받을 수 있는\n권리를 가진 특허출원 또는 실용신안등록출원으로 먼저 한 출원(이하 “선출원”이라 한다)의 출원서에 최초로 첨부된\n명세서 또는 도면에 기재된 발명을 기초로 그 특허출원한 발명에 관하여 우선권을 주장할 수 있다. 다만, 다음 각 호\n의 어느 하나에 해당하는 경우에는 그러하지 아니하다. <개정 2021. 10. 19.>\n1. 그 특허출원이 선출원의 출원일부터 1년이 지난 후에 출원된 경우\n2. 선출원이 제52조제2항(「실용신안법」 제11조에 따라 준용되는 경우를 포함한다)에 따른 분할출원 또는 제52조의\n2제2항(「실용신안법」 제11조에 따라 준용되는 경우를 포함한다)에 따른 분리출원이거나 제53조제2항 또는 「실\n용신안법」 제10조제2항에 따른 변경출원인 경우\n3. 그 특허출원을 할 때에 선출원이 포기ㆍ무효 또는 취하된 경우\n4. 그 특허출원을 할 때에 선출원이 설정등록되었거나 특허거절결정, 실용신안등록거절결정 또는 거절한다는 취지\n의 심결이 확정된 경우\n② 제1항에 따른 우선권을 주장하려는 자는 특허출원을 할 때 특허출원서에 그 취지와 선출원의 표시를 하여야 한\n다.\n③ 제1항에 따른 우선권 주장을 수반하는 특허출원된 발명 중 해당 우선권 주장의 기초가 된 선출원의 출원서에 최\n초로 첨부된 명세서 또는 도면에 기재된 발명과 같은 발명에 관하여 제29조제1항ㆍ제2항, 같은 조 제3항 본문, 같은\n조 제4항 본문, 제30조제1항, 제36조제1항부터 제3항까지, 제96조제1항제3호, 제98조, 제103조, 제105조제1항ㆍ제\n2항, 제129조 및 제136조제5항(제132조의3제3항 또는 제133조의2제4항에 따라 준용되는 경우를 포함한다), 「실용\n신안법」 제7조제3항ㆍ제4항 및 제25조, 「디자인보호법」 제95조 및 제103조제3항을 적용할 때에는 그 특허출원은\n그 선출원을 한 때에 특허출원한 것으로 본다.<개정 2016. 2. 29.>\n④ 제1항에 따른 우선권 주장을 수반하는 특허출원의 출원서에 최초로 첨부된 명세서 또는 도면에 기재된 발명 중\n해당 우선권 주장의 기초가 된 선출원의 출원서에 최초로 첨부된 명세서 또는 도면에 기재된 발명과 같은 발명은\n그 특허출원이 출원공개되거나 특허가 등록공고되었을 때에 해당 우선권 주장의 기초가 된 선출원에 관하여 출원\n공개가 된 것으로 보고 제29조제3항 본문, 같은 조 제4항 본문 또는 「실용신안법」 제4조제3항 본문ㆍ제4항 본문을\n적용한다.\n⑤ 선출원이 다음 각 호의 어느 하나에 해당하면 그 선출원의 출원서에 최초로 첨부된 명세서 또는 도면에 기재된\n발명 중 그 선출원에 관하여 우선권 주장의 기초가 된 출원의 출원서에 최초로 첨부된 명세서 또는 도면에 기재된\n발명에 대해서는 제3항과 제4항을 적용하지 아니한다.\n1. 선출원이 제1항에 따른 우선권 주장을 수반하는 출원인 경우\n2. 선출원이 「공업소유권의 보호를 위한 파리 협약」 제4조D(1)에 따른 우선권 주장을 수반하는 출원인 경우\n⑥ 제4항을 적용할 때 선출원이 다음 각 호의 어느 하나에 해당하더라도 제29조제7항을 적용하지 아니한다.\n1. 선출원이 제201조제4항에 따라 취하한 것으로 보는 국제특허출원인 경우\n2. 선출원이 「실용신안법」 제35조제4항에 따라 취하한 것으로 보는 국제실용신안등록출원인 경우\n⑦ 제1항에 따른 요건을 갖추어 우선권 주장을 한 자는 선출원일(선출원이 둘 이상인 경우에는 최선출원일을 말한\n다)부터 1년 4개월 이내에 그 우선권 주장을 보정하거나 추가할 수 있다.\n⑧ 제1항에 따른 우선권 주장의 기초가 된 선출원은 제79조에 따른 설정등록을 받을 수 없다. 다만, 해당 선출원을\n기초로 한 우선권 주장이 취하된 경우에는 그러하지 아니하다.<신설 2021. 10. 19.>\n[전문개정 2014. 6. 11.]"}, {"no": 56, "no_str": "제56조", "title": "선출원의 취하 등", "body": "① 제55조제1항에 따른 우선권 주장의 기초가 된 선출원은 그 출원일부터 1년 3개월이 지난\n때에 취하된 것으로 본다. 다만, 그 선출원이 다음 각 호의 어느 하나에 해당하는 경우에는 그러하지 아니하다. <개\n정 2021. 10. 19.>\n1. 포기, 무효 또는 취하된 경우\n2. 설정등록되었거나 특허거절결정, 실용신안등록거절결정 또는 거절한다는 취지의 심결이 확정된 경우\n3. 해당 선출원을 기초로 한 우선권 주장이 취하된 경우\n② 제55조제1항에 따른 우선권 주장을 수반하는 특허출원의 출원인은 선출원의 출원일부터 1년 3개월이 지난 후에\n는 그 우선권 주장을 취하할 수 없다.\n③ 제55조제1항에 따른 우선권 주장을 수반하는 특허출원이 선출원의 출원일부터 1년 3개월 이내에 취하된 때에는\n그 우선권 주장도 동시에 취하된 것으로 본다.\n[전문개정 2014. 6. 11.]"}, {"no": 57, "no_str": "제57조", "title": "심사관에 의한 심사", "body": "① 지식재산처장은 심사관에게 특허출원을 심사하게 한다. <개정 2025. 10. 1.>\n② 심사관의 자격에 관하여 필요한 사항은 대통령령으로 정한다.\n[전문개정 2014. 6. 11.]"}, {"no": 58, "no_str": "제58조", "title": "전문기관의 등록 등", "body": "① 지식재산처장은 출원인이 특허출원할 때 필요하거나 특허출원을 심사(국제출원에 대한\n국제조사 및 국제예비심사를 포함한다)할 때에 필요하다고 인정하면 제2항에 따른 전문기관에 미생물의 기탁ㆍ분양\n, 선행기술의 조사, 특허분류의 부여, 그 밖에 대통령령으로 정하는 업무를 의뢰할 수 있다. <개정 2016. 12. 2., 2025.\n10. 1.>\n② 제1항에 따라 지식재산처장이 의뢰하는 업무를 수행하려는 자는 지식재산처장에게 전문기관의 등록을 하여야\n한다.<신설 2016. 12. 2., 2025. 10. 1.>\n③ 지식재산처장은 제1항의 업무를 효과적으로 수행하기 위하여 필요하다고 인정하는 경우에는 대통령령으로 정하\n는 전담기관으로 하여금 전문기관 업무에 대한 관리 및 평가에 관한 업무를 대행하게 할 수 있다.<신설 2018. 4.\n17., 2025. 10. 1.>\n④ 지식재산처장은 특허출원의 심사에 필요하다고 인정하는 경우에는 관계 행정기관, 해당 기술분야의 전문기관 또\n는 특허에 관한 지식과 경험이 풍부한 사람에게 협조를 요청하거나 의견을 들을 수 있다. 이 경우 지식재산처장은\n예산의 범위에서 수당 또는 비용을 지급할 수 있다.<개정 2016. 12. 2., 2018. 4. 17., 2025. 10. 1.>\n⑤ 제2항에 따른 전문기관의 등록기준, 선행기술의 조사 또는 특허분류의 부여 등의 의뢰에 필요한 사항은 대통령\n령으로 정한다.<개정 2016. 12. 2., 2018. 4. 17.>\n[전문개정 2014. 6. 11.]\n[제목개정 2016. 12. 2.]"}, {"no": 58, "no_str": "제58조의2", "title": "전문기관 등록의 취소 등", "body": "① 지식재산처장은 제58조제2항에 따른 전문기관이 제1호에 해당하는 경우에는\n전문기관의 등록을 취소하여야 하며, 제2호 또는 제3호에 해당하는 경우에는 그 등록을 취소하거나 6개월 이내의 기\n간을 정하여 업무의 전부 또는 일부의 정지를 명할 수 있다. <개정 2016. 2. 29., 2016. 12. 2., 2018. 4. 17., 2025. 10.\n1.>\n1. 거짓이나 그 밖의 부정한 방법으로 등록을 한 경우\n2. 제58조제5항에 따른 등록기준에 맞지 아니하게 된 경우\n3. 전문기관의 임직원이 특허출원 중인 발명(국제출원 중인 발명을 포함한다)에 관하여 직무상 알게 된 비밀을 누설\n하거나 도용한 경우\n② 지식재산처장은 제1항에 따라 전문기관의 등록을 취소하거나 업무정지를 명하려면 청문을 하여야 한다.<개정\n2016. 12. 2., 2025. 10. 1.>\n③ 제1항에 따른 처분의 세부 기준과 절차 등에 관하여 필요한 사항은 총리령으로 정한다.<개정 2025. 10. 1.>\n[전문개정 2014. 6. 11.]\n[제목개정 2016. 12. 2.]"}, {"no": 59, "no_str": "제59조", "title": "특허출원심사의 청구", "body": "① 특허출원에 대하여 심사청구가 있을 때에만 이를 심사한다.\n② 누구든지 특허출원에 대하여 특허출원일부터 3년 이내에 지식재산처장에게 출원심사의 청구를 할 수 있다. 다만\n, 특허출원인은 다음 각 호의 어느 하나에 해당하는 경우에는 출원심사의 청구를 할 수 없다.<개정 2016. 2. 29.,\n2025. 10. 1.>\n1. 명세서에 청구범위를 적지 아니한 경우\n2. 제42조의3제2항에 따른 국어번역문을 제출하지 아니한 경우(외국어특허출원의 경우로 한정한다)\n③ 제34조 및 제35조에 따른 정당한 권리자의 특허출원, 분할출원, 분리출원 또는 변경출원에 관하여는 제2항에 따\n른 기간이 지난 후에도 정당한 권리자가 특허출원을 한 날, 분할출원을 한 날, 분리출원을 한 날 또는 변경출원을 한\n날부터 각각 30일 이내에 출원심사의 청구를 할 수 있다.<개정 2021. 10. 19.>\n④ 출원심사의 청구는 취하할 수 없다.\n⑤ 제2항 또는 제3항에 따라 출원심사의 청구를 할 수 있는 기간에 출원심사의 청구가 없으면 그 특허출원은 취하\n한 것으로 본다.\n[전문개정 2014. 6. 11.]"}, {"no": 60, "no_str": "제60조", "title": "출원심사의 청구절차", "body": "① 출원심사의 청구를 하려는 자는 다음 각 호의 사항을 적은 출원심사청구서를 지식재\n산처장에게 제출하여야 한다. <개정 2025. 10. 1.>\n1. 청구인의 성명 및 주소(법인인 경우에는 그 명칭 및 영업소의 소재지)\n2. 출원심사의 청구대상이 되는 특허출원의 표시\n② 지식재산처장은 출원공개 전에 출원심사의 청구가 있으면 출원공개 시에, 출원공개 후에 출원심사의 청구가 있\n으면 지체 없이 그 취지를 특허공보에 게재하여야 한다.<개정 2025. 10. 1.>\n③ 지식재산처장은 특허출원인이 아닌 자로부터 출원심사의 청구가 있으면 그 취지를 특허출원인에게 알려야 한다.\n<개정 2025. 10. 1.>\n[전문개정 2014. 6. 11.]"}, {"no": 61, "no_str": "제61조", "title": "우선심사", "body": "지식재산처장은 다음 각 호의 어느 하나에 해당하는 특허출원에 대해서는 심사관에게 다른 특허출원\n에 우선하여 심사하게 할 수 있다. <개정 2020. 12. 22., 2025. 10. 1.>\n1. 제64조에 따른 출원공개 후 특허출원인이 아닌 자가 업(業)으로서 특허출원된 발명을 실시하고 있다고 인정되는\n경우\n2. 대통령령으로 정하는 특허출원으로서 긴급하게 처리할 필요가 있다고 인정되는 경우\n3. 대통령령으로 정하는 특허출원으로서 재난의 예방ㆍ대응ㆍ복구 등에 필요하다고 인정되는 경우\n[전문개정 2014. 6. 11.]"}, {"no": 62, "no_str": "제62조", "title": "특허거절결정", "body": "심사관은 특허출원이 다음 각 호의 어느 하나의 거절이유(이하 “거절이유”라 한다)에 해당하는\n경우에는 특허거절결정을 하여야 한다. <개정 2021. 10. 19.>\n1. 제25조ㆍ제29조ㆍ제32조ㆍ제36조제1항부터 제3항까지 또는 제44조에 따라 특허를 받을 수 없는 경우\n2. 제33조제1항 본문에 따른 특허를 받을 수 있는 권리를 가지지 아니하거나 같은 항 단서에 따라 특허를 받을 수\n없는 경우\n3. 조약을 위반한 경우\n4. 제42조제3항ㆍ제4항ㆍ제8항 또는 제45조에 따른 요건을 갖추지 아니한 경우\n5. 제47조제2항에 따른 범위를 벗어난 보정인 경우\n6. 제52조제1항에 따른 범위를 벗어난 분할출원 또는 제52조의2제1항에 따른 범위를 벗어나는 분리출원인 경우\n7. 제53조제1항에 따른 범위를 벗어난 변경출원인 경우\n[전문개정 2014. 6. 11.]"}, {"no": 63, "no_str": "제63조", "title": "거절이유통지", "body": "① 심사관은 다음 각 호의 어느 하나에 해당하는 경우 특허출원인에게 거절이유를 통지하고, 기\n간을 정하여 의견서를 제출할 수 있는 기회를 주어야 한다. 다만, 제51조제1항에 따라 각하결정을 하려는 경우에는\n그러하지 아니하다. <개정 2016. 2. 29.>\n1. 제62조에 따라 특허거절결정을 하려는 경우\n2. 제66조의3제1항에 따른 직권 재심사를 하여 취소된 특허결정 전에 이미 통지한 거절이유로 특허거절결정을 하\n려는 경우\n② 심사관은 청구범위에 둘 이상의 청구항이 있는 특허출원에 대하여 제1항 본문에 따라 거절이유를 통지할 때에는\n그 통지서에 거절되는 청구항을 명확히 밝히고, 그 청구항에 관한 거절이유를 구체적으로 적어야 한다.\n[전문개정 2014. 6. 11.]"}, {"no": 63, "no_str": "제63조의2", "title": "특허출원에 대한 정보제공", "body": "특허출원에 관하여 누구든지 그 특허출원이 거절이유에 해당하여 특허될 수 없\n다는 취지의 정보를 증거와 함께 지식재산처장에게 제공할 수 있다. 다만, 제42조제3항제2호, 같은 조 제8항 및 제\n45조에 따른 요건을 갖추지 아니한 경우에는 그러하지 아니하다. <개정 2025. 10. 1.>\n[전문개정 2014. 6. 11.]"}, {"no": 63, "no_str": "제63조의3", "title": "외국의 심사결과 제출명령", "body": "심사관은 제54조에 따른 우선권 주장을 수반한 특허출원의 심사에 필요한 경우\n에는 기간을 정하여 그 우선권 주장의 기초가 되는 출원을 한 국가의 심사결과에 대한 자료(그 심사결과가 없는 경\n우에는 그 취지를 적은 의견서를 말한다)를 총리령으로 정하는 방법에 따라 제출할 것을 특허출원인에게 명할 수 있\n다. <개정 2025. 10. 1.>\n[본조신설 2016. 2. 29.]"}, {"no": 64, "no_str": "제64조", "title": "출원공개", "body": "① 지식재산처장은 다음 각 호의 구분에 따른 날부터 1년 6개월이 지난 후 또는 그 전이라도 특허출\n원인이 신청한 경우에는 총리령으로 정하는 바에 따라 그 특허출원에 관하여 특허공보에 게재하여 출원공개를 하여\n야 한다. <개정 2025. 10. 1.>\n1. 제54조제1항에 따른 우선권 주장을 수반하는 특허출원의 경우: 그 우선권 주장의 기초가 된 출원일\n2. 제55조제1항에 따른 우선권 주장을 수반하는 특허출원의 경우: 선출원의 출원일\n3. 제54조제1항 또는 제55조제1항에 따른 둘 이상의 우선권 주장을 수반하는 특허출원의 경우: 해당 우선권 주장의\n기초가 된 출원일 중 최우선일\n4. 제1호부터 제3호까지의 어느 하나에 해당하지 아니하는 특허출원의 경우: 그 특허출원일\n② 제1항에도 불구하고 다음 각 호의 어느 하나에 해당하는 경우에는 출원공개를 하지 아니한다.\n1. 명세서에 청구범위를 적지 아니한 경우\n2. 제42조의3제2항에 따른 국어번역문을 제출하지 아니한 경우(외국어특허출원의 경우로 한정한다)\n3. 제87조제3항에 따라 등록공고를 한 특허의 경우\n③ 제41조제1항에 따라 비밀취급된 특허출원의 발명에 대해서는 그 발명의 비밀취급이 해제될 때까지 그 특허출원\n의 출원공개를 보류하여야 하며, 그 발명의 비밀취급이 해제된 경우에는 지체 없이 제1항에 따라 출원공개를 하여\n야 한다. 다만, 그 특허출원이 설정등록된 경우에는 출원공개를 하지 아니한다.\n④ 제1항의 출원공개에 관하여 출원인의 성명ㆍ주소 및 출원번호 등 특허공보에 게재할 사항은 대통령령으로 정한\n다.\n[전문개정 2014. 6. 11.]"}, {"no": 65, "no_str": "제65조", "title": "출원공개의 효과", "body": "① 특허출원인은 출원공개가 있은 후 그 특허출원된 발명을 업으로서 실시한 자에게 특허출\n원된 발명임을 서면으로 경고할 수 있다.\n② 특허출원인은 제1항에 따른 경고를 받거나 제64조에 따라 출원공개된 발명임을 알고 그 특허출원된 발명을 업\n으로 실시한 자에게 그 경고를 받거나 출원공개된 발명임을 알았을 때부터 특허권의 설정등록을 할 때까지의 기간\n동안 그 특허발명의 실시에 대하여 합리적으로 받을 수 있는 금액에 상당하는 보상금의 지급을 청구할 수 있다.<개\n정 2019. 1. 8.>\n③ 제2항에 따른 청구권은 그 특허출원된 발명에 대한 특허권이 설정등록된 후에만 행사할 수 있다.\n④ 제2항에 따른 청구권의 행사는 특허권의 행사에 영향을 미치지 아니한다.\n⑤ 제2항에 따른 청구권을 행사하는 경우에는 제127조ㆍ제129조ㆍ제132조 및 「민법」 제760조ㆍ제766조를 준용한\n다. 이 경우 「민법」 제766조제1항 중 “피해자나 그 법정대리인이 그 손해 및 가해자를 안 날”은 “해당 특허권의 설\n정등록일”로 본다.\n⑥ 제64조에 따른 출원공개 후 다음 각 호의 어느 하나에 해당하는 경우에는 제2항에 따른 청구권은 처음부터 발생\n하지 아니한 것으로 본다.<개정 2016. 2. 29.>\n1. 특허출원이 포기ㆍ무효 또는 취하된 경우\n2. 특허출원에 대하여 제62조에 따른 특허거절결정이 확정된 경우\n3. 제132조의13제1항에 따른 특허취소결정이 확정된 경우\n4. 제133조에 따른 특허를 무효로 한다는 심결(같은 조 제1항제4호에 따른 경우는 제외한다)이 확정된 경우\n[전문개정 2014. 6. 11.]"}, {"no": 66, "no_str": "제66조", "title": "특허결정", "body": "심사관은 특허출원에 대하여 거절이유를 발견할 수 없으면 특허결정을 하여야 한다.\n[전문개정 2014. 6. 11.]"}, {"no": 66, "no_str": "제66조의2", "title": "직권보정 등", "body": "① 심사관은 제66조에 따른 특허결정을 할 때에 특허출원서에 첨부된 명세서, 도면 또는 요약\n서에 적힌 사항이 명백히 잘못된 경우에는 직권으로 보정(이하 “직권보정”이라 한다)할 수 있다. 이 경우 직권보정은\n제47조제2항에 따른 범위에서 하여야 한다. <개정 2016. 2. 29., 2021. 8. 17.>\n② 제1항에 따라 심사관이 직권보정을 하려면 제67조제2항에 따른 특허결정의 등본 송달과 함께 그 직권보정 사항\n을 특허출원인에게 알려야 한다.\n③ 특허출원인은 직권보정 사항의 전부 또는 일부를 받아들일 수 없으면 제79조제1항에 따라 특허료를 낼 때까지\n그 직권보정 사항에 대한 의견서를 지식재산처장에게 제출하여야 한다.<개정 2025. 10. 1.>\n④ 특허출원인이 제3항에 따라 의견서를 제출한 경우 해당 직권보정 사항의 전부 또는 일부는 처음부터 없었던 것\n으로 본다. 이 경우 그 특허결정도 함께 취소된 것으로 본다. 다만, 특허출원서에 첨부된 요약서에 관한 직권보정 사\n항의 전부 또는 일부만 처음부터 없었던 것으로 보는 경우에는 그러하지 아니하다.<개정 2016. 2. 29.>\n⑤ 삭제<2016. 2. 29.>\n⑥ 직권보정이 제47조제2항에 따른 범위를 벗어나거나 명백히 잘못되지 아니한 사항을 직권보정한 경우 그 직권보\n정은 처음부터 없었던 것으로 본다.<신설 2021. 8. 17.>\n[전문개정 2014. 6. 11.]\n[제목개정 2016. 2. 29.]"}, {"no": 66, "no_str": "제66조의3", "title": "특허결정 이후 직권 재심사", "body": "① 심사관은 특허결정된 특허출원에 관하여 명백한 거절이유를 발견한 경우에\n는 직권으로 특허결정을 취소하고, 그 특허출원을 다시 심사(이하 “직권 재심사”라 한다)할 수 있다. 다만, 다음 각 호\n의 어느 하나에 해당하는 경우에는 그러하지 아니하다.\n1. 거절이유가 제42조제3항제2호, 같은 조 제8항 및 제45조에 따른 요건에 관한 것인 경우\n2. 그 특허결정에 따라 특허권이 설정등록된 경우\n3. 그 특허출원이 취하되거나 포기된 경우\n② 제1항에 따라 심사관이 직권 재심사를 하려면 특허결정을 취소한다는 사실을 특허출원인에게 통지하여야 한다.\n③ 특허출원인이 제2항에 따른 통지를 받기 전에 그 특허출원이 제1항제2호 또는 제3호에 해당하게 된 경우에는 특\n허결정의 취소는 처음부터 없었던 것으로 본다.\n[본조신설 2016. 2. 29.]"}, {"no": 67, "no_str": "제67조", "title": "특허여부결정의 방식", "body": "① 특허결정 및 특허거절결정(이하 “특허여부결정”이라 한다)은 서면으로 하여야 하며,\n그 이유를 붙여야 한다.\n② 지식재산처장은 특허여부결정이 있는 경우에는 그 결정의 등본을 특허출원인에게 송달하여야 한다.<개정 2025.\n10. 1.>\n[전문개정 2014. 6. 11.]"}, {"no": 67, "no_str": "제67조의2", "title": "재심사의 청구", "body": "① 특허출원인은 그 특허출원에 관하여 특허결정의 등본을 송달받은 날부터 제79조에 따른\n설정등록을 받기 전까지의 기간 또는 특허거절결정등본을 송달받은 날부터 3개월(제15조제1항에 따라 제132조의\n17에 따른 기간이 연장된 경우 그 연장된 기간을 말한다) 이내에 그 특허출원의 명세서 또는 도면을 보정하여 해당\n특허출원에 관한 재심사(이하 “재심사”라 한다)를 청구할 수 있다. 다만, 다음 각 호의 어느 하나에 해당하는 경우에\n는 그러하지 아니하다. <개정 2016. 2. 29., 2021. 10. 19.>\n1. 재심사를 청구할 때에 이미 재심사에 따른 특허여부의 결정이 있는 경우\n2. 제132조의17에 따른 심판청구가 있는 경우(제176조제1항에 따라 특허거절결정이 취소된 경우는 제외한다)\n3. 그 특허출원이 분리출원인 경우\n② 특허출원인은 제1항에 따른 재심사의 청구와 함께 의견서를 제출할 수 있다.\n③ 제1항에 따라 재심사가 청구된 경우 그 특허출원에 대하여 종전에 이루어진 특허결정 또는 특허거절결정은 취소\n된 것으로 본다. 다만, 재심사의 청구절차가 제16조제1항에 따라 무효로 된 경우에는 그러하지 아니하다.<개정\n2021. 10. 19.>\n④ 제1항에 따른 재심사의 청구는 취하할 수 없다.\n[전문개정 2014. 6. 11.]"}, {"no": 67, "no_str": "제67조의3", "title": "특허출원의 회복", "body": "① 특허출원인이 정당한 사유로 다음 각 호의 어느 하나에 해당하는 기간을 지키지 못하\n여 특허출원이 취하되거나 특허거절결정이 확정된 것으로 인정되는 경우에는 그 사유가 소멸한 날부터 2개월 이내\n에 출원심사의 청구 또는 재심사의 청구를 할 수 있다. 다만, 그 기간의 만료일부터 1년이 지난 때에는 그러하지 아\n니하다. <개정 2021. 10. 19.>\n1. 제59조제2항 또는 제3항에 따라 출원심사의 청구를 할 수 있는 기간\n2. 제67조의2제1항에 따라 재심사의 청구를 할 수 있는 기간\n② 제1항에 따른 출원심사의 청구 또는 재심사의 청구가 있는 경우에는 제59조제5항에도 불구하고 그 특허출원은\n취하되지 아니한 것으로 보거나 특허거절결정이 확정되지 아니한 것으로 본다.\n[본조신설 2013. 3. 22.]"}, {"no": 68, "no_str": "제68조", "title": "심판규정의 심사에의 준용", "body": "특허출원의 심사에 관하여는 제148조제1호부터 제5호까지 및 제7호를 준용한다.\n[전문개정 2014. 6. 11.]"}, {"no": 69, "no_str": "제69조", "title": "", "body": "삭제 <2006. 3. 3.>"}, {"no": 70, "no_str": "제70조", "title": "", "body": "삭제 <2006. 3. 3.>"}, {"no": 71, "no_str": "제71조", "title": "", "body": "삭제 <2006. 3. 3.>"}, {"no": 72, "no_str": "제72조", "title": "", "body": "삭제 <2006. 3. 3.>"}, {"no": 73, "no_str": "제73조", "title": "", "body": "삭제 <2006. 3. 3.>"}, {"no": 74, "no_str": "제74조", "title": "", "body": "삭제 <2006. 3. 3.>"}, {"no": 75, "no_str": "제75조", "title": "", "body": "삭제 <2006. 3. 3.>"}, {"no": 76, "no_str": "제76조", "title": "", "body": "삭제 <2006. 3. 3.>"}, {"no": 77, "no_str": "제77조", "title": "", "body": "삭제 <2006. 3. 3.>"}, {"no": 78, "no_str": "제78조", "title": "심사 또는 소송절차의 중지", "body": "① 특허출원의 심사에 필요한 경우에는 특허취소신청에 대한 결정이나 심결이 확\n정될 때까지 또는 소송절차가 완결될 때까지 그 심사절차를 중지할 수 있다. <개정 2016. 2. 29.>\n② 법원은 소송에 필요한 경우에는 특허출원에 대한 특허여부결정이 확정될 때까지 그 소송절차를 중지할 수 있다.\n③ 제1항 및 제2항에 따른 중지에 대해서는 불복할 수 없다.\n[전문개정 2014. 6. 11.]"}, {"no": 78, "no_str": "제78조의2", "title": "", "body": "삭제 <2006. 3. 3.>"}, {"no": 79, "no_str": "제79조", "title": "특허료", "body": "① 제87조제1항에 따른 특허권의 설정등록을 받으려는 자는 설정등록을 받으려는 날(이하 “설정등록일\n”이라 한다)부터 3년분의 특허료를 내야 하고, 특허권자는 그 다음 해부터의 특허료를 해당 권리의 설정등록일에 해\n당하는 날을 기준으로 매년 1년분씩 내야 한다.\n② 제1항에도 불구하고 특허권자는 그 다음 해부터의 특허료는 그 납부연도 순서에 따라 수년분 또는 모든 연도분\n을 함께 낼 수 있다.\n③ 제1항 및 제2항에 따른 특허료, 그 납부방법 및 납부기간, 그 밖에 필요한 사항은 총리령으로 정한다.<개정 2025.\n10. 1.>\n[전문개정 2014. 6. 11.]"}, {"no": 80, "no_str": "제80조", "title": "이해관계인에 의한 특허료의 납부", "body": "① 이해관계인은 특허료를 내야 할 자의 의사와 관계없이 특허료를 낼 수 있\n다.\n② 이해관계인은 제1항에 따라 특허료를 낸 경우에는 내야 할 자가 현재 이익을 얻는 한도에서 그 비용의 상환을\n청구할 수 있다.\n[전문개정 2014. 6. 11.]"}, {"no": 81, "no_str": "제81조", "title": "특허료의 추가납부 등", "body": "① 특허권의 설정등록을 받으려는 자 또는 특허권자는 제79조제3항에 따른 납부기간이\n지난 후에도 6개월 이내(이하 “추가납부기간”이라 한다)에 특허료를 추가로 낼 수 있다.\n② 제1항에 따라 특허료를 추가로 낼 때에는 내야 할 특허료의 2배의 범위에서 총리령으로 정하는 금액을 납부하여\n야 한다.<개정 2025. 10. 1.>\n③ 추가납부기간에 특허료를 내지 아니한 경우(추가납부기간이 끝나더라도 제81조의2제2항에 따른 보전기간이 끝\n나지 아니한 경우에는 그 보전기간에 보전하지 아니한 경우를 말한다)에는 특허권의 설정등록을 받으려는 자의 특\n허출원은 포기한 것으로 보며, 특허권자의 특허권은 제79조제1항 또는 제2항에 따라 낸 특허료에 해당되는 기간이\n끝나는 날의 다음 날로 소급하여 소멸된 것으로 본다.\n[전문개정 2014. 6. 11.]"}, {"no": 81, "no_str": "제81조의2", "title": "특허료의 보전", "body": "① 지식재산처장은 특허권의 설정등록을 받으려는 자 또는 특허권자가 제79조제3항 또는\n제81조제1항에 따른 기간에 특허료의 일부를 내지 아니한 경우에는 특허료의 보전(補塡)을 명하여야 한다. <개정\n2025. 10. 1.>\n② 제1항에 따라 보전명령을 받은 자는 그 보전명령을 받은 날부터 1개월 이내(이하 “보전기간”이라 한다)에 특허료\n를 보전할 수 있다.\n③ 제2항에 따라 특허료를 보전하는 자는 내지 아니한 금액의 2배의 범위에서 총리령으로 정한 금액을 내야 한다.\n<개정 2025. 10. 1.>\n[전문개정 2014. 6. 11.]"}, {"no": 81, "no_str": "제81조의3", "title": "특허료의 추가납부 또는 보전에 의한 특허출원과 특허권의 회복 등", "body": "① 특허권의 설정등록을 받으려는 자\n또는 특허권자가 정당한 사유로 추가납부기간에 특허료를 내지 아니하였거나 보전기간에 보전하지 아니한 경우에는\n그 사유가 소멸한 날부터 2개월 이내에 그 특허료를 내거나 보전할 수 있다. 다만, 추가납부기간의 만료일 또는 보전\n기간의 만료일 중 늦은 날부터 1년이 지난 때에는 그러하지 아니하다. <개정 2021. 10. 19.>\n② 제1항에 따라 특허료를 내거나 보전한 자는 제81조제3항에도 불구하고 그 특허출원을 포기하지 아니한 것으로\n보며, 그 특허권은 계속하여 존속하고 있던 것으로 본다.\n③ 추가납부기간에 특허료를 내지 아니하였거나 보전기간에 보전하지 아니하여 특허발명의 특허권이 소멸한 경우\n그 특허권자는 추가납부기간 또는 보전기간 만료일부터 3개월 이내에 제79조에 따른 특허료의 2배를 내고, 그 소멸\n한 권리의 회복을 신청할 수 있다. 이 경우 그 특허권은 계속하여 존속하고 있던 것으로 본다.\n④ 제2항 또는 제3항에 따른 특허출원 또는 특허권의 효력은 추가납부기간 또는 보전기간이 지난 날부터 특허료를\n내거나 보전한 날까지의 기간(이하 이 조에서 “효력제한기간”이라 한다) 중에 타인이 특허출원된 발명 또는 특허발\n명을 실시한 행위에 대해서는 그 효력이 미치지 아니한다.\n⑤ 효력제한기간 중 국내에서 선의로 제2항 또는 제3항에 따른 특허출원된 발명 또는 특허발명을 업으로 실시하거\n나 이를 준비하고 있는 자는 그 실시하거나 준비하고 있는 발명 및 사업목적의 범위에서 그 특허출원된 발명 또는\n특허발명에 대한 특허권에 대하여 통상실시권을 가진다.\n⑥ 제5항에 따라 통상실시권을 가진 자는 특허권자 또는 전용실시권자에게 상당한 대가를 지급하여야 한다.\n⑦ 제1항 본문에 따른 납부나 보전 또는 제3항 전단에 따른 신청에 필요한 사항은 총리령으로 정한다.<개정 2025.\n10. 1.>\n[전문개정 2014. 6. 11.]"}, {"no": 82, "no_str": "제82조", "title": "수수료", "body": "① 특허에 관한 절차를 밟는 자는 수수료를 내야 한다.\n② 특허출원인이 아닌 자가 출원심사의 청구를 한 후 그 특허출원서에 첨부한 명세서를 보정하여 청구범위에 적은\n청구항의 수가 증가한 경우에는 그 증가한 청구항에 관하여 내야 할 심사청구료는 특허출원인이 내야 한다.\n③ 제1항에 따른 수수료, 그 납부방법 및 납부기간, 그 밖에 필요한 사항은 총리령으로 정한다.<개정 2025. 10. 1.>\n[전문개정 2014. 6. 11.]"}, {"no": 83, "no_str": "제83조", "title": "특허료 또는 수수료의 감면", "body": "① 지식재산처장은 다음 각 호의 어느 하나에 해당하는 특허료 및 수수료는 제79조\n및 제82조에도 불구하고 면제한다. <개정 2025. 10. 1.>\n1. 국가에 속하는 특허출원 또는 특허권에 관한 수수료 또는 특허료\n2. 제133조제1항, 제134조제1항ㆍ제2항 또는 제137조제1항에 따른 심사관의 무효심판청구에 대한 수수료\n② 지식재산처장은 다음 각 호의 어느 하나에 해당하는 자가 한 특허출원 또는 그 특허출원하여 받은 특허권에 대\n해서는 제79조 및 제82조에도 불구하
