구를 일부 인용하는 제1심 법원의 판결에 대하여 乙이\n항소한 경우 甲이 항소심에서 乙에 대한 소를 취하하는 것이 가능한지\n검토하고, 만약 乙에 대한 소가 적법하게 취하되었다면 소를 취하하지 않은\n丙, 丁에 관한 청구 부분이 여전히 항소심 법원의 심판대상이 되는지에 대해\n설명하시오.", "answer": "1. 문제의 소재 1\n주관적 예비적 병합에서 일부에 대한 소취하가 가능한지, 항소심\n에서 일부에 대해 소취하된 경우 여전히 다른 공동소송인에 대한\n청구가 항소심 심판대상인지 여부 검토한다.\n2. 일부 공동소송인 乙에 대한 소취하 가부 3\n(1) 주관적 예비적 병합에서 일부에 대한 소취하 가부\nⅰ)[제70조 1항 본문] 제67조 준용하여 1인의 소송행위는 모두\n의 이익을 위해서만 효력을 가지며 불리한 행위는 전원이 해야\n효력이 있다. 상대방의 행위는 전원에게 효력이 있다. 1인의 중단\n은 전원에게 효력있고 변론의 분리 불허된다.\nⅱ)[제70조 1항 단서] 다만, 취하, 포기, 인낙, 화해는 각자 할 수\n있다.\n(2) 소취하 의의·취지 및 요건 [제266조]\n1)의의 및 취지\n소제기를 철회하여 소송절차를 소급소멸시키는 소송행위이다.\n2)요건\nⅰ)판결확정 전 ⅱ)피고가 본안에 관해 변론한 경우라면 피고의\n동의를 받아 가능하다.\n(3) 사안\n판결확정 전이며, 乙이 본안에 관해 변론하여 그의 동의 있으면\n제70조 1항 단서에 따라 乙에 대한 소취하 가능하다.\n3. 乙에 대한 소취하에도 丙, 丁에 대한 청구 심판대상인지 여부 6\n(1) 주관적 예비적 병합 판결 및 상소\n제67조가 준용되는 합일확정이 요청되는 관계인바 판결의 통일을\n요하며, 1인 상소시 전원 확정차단되어 상소심으로 이심되고 불복\n하지 않은 자에 대한 청구도 심판대상이 된다.\n(2) 乙의 항소로 丙, 丁에 대한 청구 항소심 이심 여부\n1)상소불가분원칙 의의 및 취지\n상소로 인한 확정차단, 이심효력은 원판결 전부에 미친다. 항소심\n에서 심판범위 확장을 가능케 하기 위함이다.\n2)사안\n乙, 丙, 丁 사이에는 제67조에 따라 합일확정 요청되므로 상소불\n가분원칙 적용되어 乙항소시 청구 전부가 이심된다.\n(3) 丙, 丁에 대한 청구가 항소심 심판대상인지 여부\n1)불이익변경금지원칙 [제415조]\n1심판결은 볼복한 한도에서 변경가능하다. 항소심에서의 처분권주\n의 발현이다.\n2)일부 공동소송인에 대한 소가 취하된 경우\n判例는 주관적 예비적 병합에서 주위적 피고에 대한 소를 취하함\n으로써 주관적 예비적 공동소송관계가 해소되었더라도 피고들에\n대한 청구 부분은 여전히 원심의 심판대상이 된다고 한다.\n3)사안\n주위적 피고인 乙에 대한 소취하가 허용되어 소가 취하되어 주관\n적 예비적 병합 관계가 해소된다고 하더라도 丙, 丁에 대한 청구\n는 여전히 항소심의 심판대상이 된다고 한다.\n4. 사안해결 0.5\n주관적 예비적 병합에서 주위적 피고 乙에 대한 소취하 가능하며,\n丙, 丁에 대한 청구는 항소심으로 이심된 후 乙에 대한 소가 취하\n되더라도 여전히 항소심 심판대상이 된다.", "categories": {"toc": "1. 문제의 소재\n2. 일부 공동소송인 乙에 대한 소취하 가부\n3. 乙에 대한 소취하에도 丙, 丁에 대한 청구 심판대상인지 여부\n4. 사안해결", "purpose": "(소취하) 소제기를 철회하여 소송절차를 소급소멸시키는 소송행위이다.\n(상소불가분원칙) 상소로 인한 확정차단, 이심효력은 원판결 전부에 미친다. 항소심에서 심판범위 확장을 가능케 하기 위함이다.\n(불이익변경금지원칙) 1심판결은 불복한 한도에서 변경가능하다. 항소심에서의 처분권주의 발현이다.", "article": "제70조 1항 본문, 제70조 1항 단서, 제266조, 제67조, 제415조", "elements": "(소취하 요건) ⅰ)판결확정 전 ⅱ)피고가 본안에 관해 변론한 경우라면 피고의 동의를 받아 가능하다.", "theory": "", "cases": "주관적 예비적 병합에서 주위적 피고에 대한 소를 취하함으로써 주관적 예비적 공동소송관계가 해소되었더라도 피고들에 대한 청구 부분은 여전히 원심의 심판대상이 된다.", "resolution": "주관적 예비적 병합에서 주위적 피고 乙에 대한 소취하 가능하며, 丙, 丁에 대한 청구는 항소심으로 이심된 후 乙에 대한 소가 취하되더라도 여전히 항소심 심판대상이 된다."}}, {"no": 3, "points": 8, "question": "제1심 법원이 주위적 청구에 대해서는 기각, 예비적 청구에 대해서는 인용\n하는 판결을 하였고, 이에 丙만이 항소한 경우 그 효력이 타 공동소송인에\n게도 미치는지 여부에 대하여 설명하시오.", "answer": "1. 문제의 소재 0.5\n丙만 항소한 경우 나머지 공동소송인 乙, 丁과의 관계를 살펴 그\n들에 대한 청구도 함께 항소심으로 이심되는지 검토한다.\n2. 丙과 乙사이의 관계 1\n전술한 바와 같이 ⅰ)丙은 乙과 법률상 양립불가능한 주관적 예\n비적 병합 관계에 있다. ⅱ)그들 사이에는 합일확정 요청이 있어\n제67조에 따라 심리된다.\n3. 丙과 丁사이의 관계 1\n(1) 통상공동소송관계 및 독립의 원칙 [제66조]\nⅰ)합일확정 요구되지 않는 공동소송인들은 통상공동소송관계다.\nⅱ)독립의 원칙에 따라 1인의 소송은 다른 자에게 영향 없다.\n(2) 사안\n丙, 丁은 乙의 손해배상의무가 인정되지 않으면 손해배상의무를\n지는 자들로, 연대채무관계에 있고 합일확정 요청되지 않는 바 통\n상공동소송 관계에 있어 독립의 원칙에 따라 심리된다.\n4. 乙과 丁사이의 관계 1\n전술한 바와 같이 ⅰ)乙과 丁은 법률상 양립불가능한 주관적 예\n비적 병합 관계에 있다. ⅱ)그들 사이에는 합일확정 요청이 있어\n제67조에 따라 심리된다.\n5. 丙의 항소로 乙 및 丁 부분 이심 여부 2\n(1) 乙에 대한 청구\n제67조 준용하여 판결통일 요하며 상소불가분원칙 적용되는바 丙\n의 항소로 확정차단되고 항소심으로 함께 이심된다.\n(2) 丁에 대한 청구\n제66조에 따라 원칙적으로 丙의 항소는 丁에게 영향 없으나 항소\n로 이심되는 乙에 대한 청구와 丁에 대한 청구가 제67조에 따라\n합일확정적 결론이 도출되어야 하는바 丁도 함께 확정차단되고\n항소심으로 이심된다고 봄이 타당하다.\n6. 사안해결 0.5\n丙항소는 乙, 丁에 대한 청구에 효력 미쳐 함께 이심된다.", "categories": {"toc": "1. 문제의 소재\n2. 丙과 乙사이의 관계\n3. 丙과 丁사이의 관계\n4. 乙과 丁사이의 관계\n5. 丙의 항소로 乙 및 丁 부분 이심 여부\n6. 사안해결", "purpose": "(통상공동소송 독립의 원칙) 합일확정 요구되지 않는 공동소송인들은 통상공동소송관계다. 독립의 원칙에 따라 1인의 소송은 다른 자에게 영향 없다.", "article": "제66조, 제67조", "elements": "", "theory": "", "cases": "", "resolution": "丙항소는 乙, 丁에 대한 청구에 효력 미쳐 함께 이심된다."}}]}, {"subject": "민사소송법", "exam": "59회", "year": 2022, "problemNo": 4, "points": 20, "passage": "甲은 수년 전부터 노인성 치매를 이유로 A노인요양센터(법인이 아님)에서 기거해\n오고 있다. 그런데 A노인요양센터의 열악한 환경으로 인하여 甲은 뜻하지 않은\n폐질 환에 걸 려 투병 중이다. 이에 甲은 현저 한 질병 악 화 등을 이유로 하여\n손해배상을 구하는 소를 제기하려고 한다.", "subquestions": [{"no": 1, "points": 10, "question": "甲이 소를 제기함에 있어 A노인요양센터가 소송의 상대 방이 될 수 있는\n능력이 있는지 여부를 검토하시오.", "answer": "1. 문제의 소재 0.5\n민사소송법상 당사자가 되기 위해서는 당사자능력자 이어야 하는\n바 실질적 당사자능력자 및 형식적 당사자능력자 검토하여 노인\n요양센터가 비법인사단으로 형식적 당사자능력자인지 논한다.\n2. 당사자능력 의의 및 취지 1\n일반적인 모든 소송에서 소송상 당사자가 될 수 있는 능력이다.\n대립당사자구조 취하는 민사소송법이 요구하는 소송요건이다.\n3. 당사자능력 내용 1.5\n(1) 실질적 당사자능력자\nⅰ)[제51조] 소송법상 규정이 없는 사항은 민법 따른다. ⅱ)민법\n상 권리능력자는 소송법상 당사자능력이 인정된다. ⅲ)자연인, 법\n인 등이 이에 해당한다.\n(2) 형식적 당사자능력자\nⅰ)[제52조] 비법인사단은 대표자가 정해진 경우 그 이름으로 당\n사자가 될 수 있다. ⅱ)사회적으로 경제활동하는 주체하이므로 소\n송수행 편의를 위해 인정한다.\n4. 노인요양센터의 비법인사단 해당 여부 2\n(1) 비법인사단 의의 및 요건\nⅰ)사단성(대표기관 있고 지분개념 없음)을 가지는 규약이 있고\nⅱ)의사결정기관 집행기관인 대표자를 두는 등 조직을 갖추고\nⅲ)운영에 관해 단체로서 주요사항이 확정되어야 한다.\n(2) 사안\n노인요양센터는 대표자가 있다고 보여지지 않으며 운영에 관해\n단체로서 주요사항이 확정되어 있다고 보기도 어려워 비법인사단\n의 실질을 갖지 않는 것으로 보인다.\n5. 노인요양센터가 조합인 경우\n(1) 학설 및 判例\nⅰ)통설 및 判例는 조합과 비법인사단은 구분되며 명문의 규정도\n없이 당사자능력 인정할 수 없다고 한다. ⅱ)반대견해는 소송소행\n편의 및 단체임을 이유로 조합도 당사자능력 인정하자고 한다.\n(2) 검토 및 사안\nⅰ)생각건대 명문 없이 당사자능력 인정함은 법적안정성에 반하\n는바 ⅱ)노인요양센터가 조합이더라도 당사자능력 부정된다.\n6. 사안해결 0.5\n노인요양센터는 법인, 비법인사단에 해당되지 않고 설령 조합이더\n라도 민사소송상 당사자가 될 수 없다.", "categories": {"toc": "1. 문제의 소재\n2. 당사자능력 의의 및 취지\n3. 당사자능력 내용\n4. 노인요양센터의 비법인사단 해당 여부\n5. 노인요양센터가 조합인 경우\n6. 사안해결", "purpose": "일반적인 모든 소송에서 소송상 당사자가 될 수 있는 능력이다. 대립당사자구조 취하는 민사소송법이 요구하는 소송요건이다.", "article": "제51조, 제52조", "elements": "(비법인사단 요건) ⅰ)사단성(대표기관 있고 지분개념 없음)을 가지는 규약이 있고 ⅱ)의사결정기관 집행기관인 대표자를 두는 등 조직을 갖추고 ⅲ)운영에 관해 단체로서 주요사항이 확정되어야 한다.", "theory": "ⅰ)통설 및 判例는 조합과 비법인사단은 구분되며 명문의 규정도 없이 당사자능력 인정할 수 없다고 한다. ⅱ)반대견해는 소송수행 편의 및 단체임을 이유로 조합도 당사자능력 인정하자고 한다.", "cases": "조합과 비법인사단은 구분되며 명문의 규정도 없이 당사자능력 인정할 수 없다.", "resolution": "노인요양센터는 법인, 비법인사단에 해당되지 않고 설령 조합이더라도 민사소송상 당사자가 될 수 없다."}}, {"no": 2, "points": 10, "question": "甲이 A노인요양센터를 피고로 하여 손해배상을 구하는 소를 제기하였는데\n계속 중 甲이 사망하였다. 甲에게 유일한 상속인으로 乙이 있는 경우\n소송당사자의 지위가 수 계 절차 없이도 乙에게 승 계 되는지 여부와 법원이\n甲의 사 망 사 실 을 간과하고 판결하였을 경우 이 판결의 효력에 대하여 검토\n하시오.", "answer": "1. 문제의 소재 0.5\n소송 중 甲이 사망한 경우 당사자 지위 당연승계 여부 및 사망으\n로 인한 절차 중단 간과 판결의 효력이 위법유효인지 논한다.\n2. 乙의 당사자 지위 당연 승계 여부 2\n(1) 判例\n소송 중 당사자 사망시 그 지위를 당연히 이어받는 상속인과의\n관계에서 대립당사자구조를 형성하게 된다고 한다.\n(2) 학설 ⅰ)실체법상 포괄승계를 이유로 당연승계 긍정설 ⅱ)형식적\n당사자개념을 이유로 당연승계 부정설이 있다.\n(3) 검토 및 사안\nⅰ)생각건대 제95조에 의해 당사자 사망시에도 소송대리권이 불\n소멸하고, 제238조에 따라 절차가 중단되지 않으므로 긍정설이\n타당하다. ⅱ)사안에서 甲사망시 피고는 그 지위를 당연히 이어받\n는 乙과의 관계에서 대립당사자구조를 형성할 것이다.\n3. 절차 중단 및 중단시점 1.5\n(1) 중단 요건\n소송대상이 상속될 수 있는 법률관계이고 상속인이 있어야 한다.\n(2) 중단 시점\n소송대리인이 없으면 당사자 사망시 절차가 중단된다.\n(3) 사안\n손해배상채무 법률관계는 乙에게 상속될 수 있고 소송대리인 없\n는바 甲사망시 절차 중단된다.\n4. 중단간과 판결의 효력 3\n(1) 判例\n소송 중 사망을 간과하고 판결시 대립당사자구조가 흠결된 것은\n아니다. 소송에 관여할 수 있는 적법한 수계인의 권한을 배제한\n절차상 위법이 있지만 그 판결이 당연무효라 할 수 없고 대리권\n흠결을 이유로 상소, 재심을 구할 수 있다.\n(2) 학설 ⅰ)소송중 사망 간과한 판결은 위법하나 대립당사자구조가\n흠결된 것은 아니어서 판결은 유효하다고 보는 견해 ⅱ)당연승계\n가 인정되지 않고 대립당사자구조 흠결되므로 판결이 무효라고\n보는 견해가 있다.\n(3) 검토 및 사안\nⅰ)생각건대 당사자지위 당연승계 긍정하는바 판시 타당하다. ⅱ)\n사안에서 甲사망 간과한 판결은 적법한 수계인 乙권한 배제한 절\n차 위법이 있으나 판결이 당연무효는 아니고 대리권 흠결을 가질\n뿐이므로 상소, 재심으로 구제받을 수 있다.\n5. 사안해결 0.5\n乙은 당사자 지위 당연승계하고 판결은 위법하지만 유효하다.\n- 이 하 여 백 -", "categories": {"toc": "1. 문제의 소재\n2. 乙의 당사자 지위 당연 승계 여부\n3. 절차 중단 및 중단시점\n4. 중단간과 판결의 효력\n5. 사안해결", "purpose": "", "article": "제95조, 제238조", "elements": "(중단 요건) 소송대상이 상속될 수 있는 법률관계이고 상속인이 있어야 한다.\n(중단 시점) 소송대리인이 없으면 당사자 사망시 절차가 중단된다.", "theory": "(당연승계) ⅰ)실체법상 포괄승계를 이유로 당연승계 긍정설 ⅱ)형식적 당사자개념을 이유로 당연승계 부정설이 있다.\n(중단간과 판결) ⅰ)소송중 사망 간과한 판결은 위법하나 대립당사자구조가 흠결된 것은 아니어서 판결은 유효하다고 보는 견해 ⅱ)당연승계가 인정되지 않고 대립당사자구조 흠결되므로 판결이 무효라고 보는 견해가 있다.", "cases": "(당연승계) 소송 중 당사자 사망시 그 지위를 당연히 이어받는 상속인과의 관계에서 대립당사자구조를 형성하게 된다.\n(중단간과 판결) 소송 중 사망을 간과하고 판결시 대립당사자구조가 흠결된 것은 아니다. 소송에 관여할 수 있는 적법한 수계인의 권한을 배제한 절차상 위법이 있지만 그 판결이 당연무효라 할 수 없고 대리권 흠결을 이유로 상소, 재심을 구할 수 있다.", "resolution": "乙은 당사자 지위 당연승계하고 판결은 위법하지만 유효하다."}}]}, {"subject": "민사소송법", "exam": "60회", "year": 2023, "problemNo": 1, "points": 30, "passage": "甲은 乙에 대하여 구상금채권을 가지고 있는 채권자이다. 甲과 丙 사이에 甲이\n乙에 대하여 가지고 있는 구상금채권을 양도양수하는 계약을 체결하였다. 乙은\n자신의 유일한 재산인 X부동산을 丁에게 매도하는 계약을 체결하였다. (다음 각\n물음은 독립적임)", "subquestions": [{"no": 1, "points": 10, "question": "甲이 乙에 대하여 구상금청구의 소를 제기한 후 제1심 소송계속 중 丙은 甲\n으로부터 구상금채권을 양수하였음을 이유로 권리승계를 주장하면서 승계참\n가를 신청하였다. 甲은 丙의 승계 여부에 대하여 다투지 않으면서도 소송탈\n퇴, 소 취하 등을 하지 않았다. 제1심법원은 丙이 甲으로부터 구상금채권을\n양수한 채권자임을 전제로 丙의 청구에 대하여 판단하였고, 甲의 청구에 대\n하여는 판단하지 않았다. 이에 대하여 甲이 항소를 제기하였는데, 항소심법\n원은 불복의 대상이 되는 재판이 없어 항소가 부적법하다고 판단하여 甲의\n항소를 각하하였다. 이와 같은 항소심법원의 판단에 잘못이 없는지를 그 논\n거와 함께 설명하시오.", "answer": "(항소심법원의 항소자와 판단과 부관한 통가승계 요건, 혹은 소송탈퇴, 소취하 관련 질만은 배점↓)\n1. 문제의 소재 - 항소의 대상적격 [항,심,단] (필공 독자됨)\n甲의 항소 대상적격 관련하여 승계참가 후 원고가 소송에 남아있는 경우 원고와 참가인의 소송관계가 필수적공동소송에 해당하므로 甲의 항소가 대상적격이 없다고 본 항소심판단은 부당함을 알아본다.\n2. 참가승계의 의의 및 취지(제81조)\n소송계속 중 소송목적인 권리 또는 의무승계가 있는 경우 승계인이 소송에 스스로 참가하는 제도로, 소송경제를 도모하기 위함이다.\n3. 전주가 승계효력 다투지 않으나 탈퇴, 취하 하지 않는 경우 [형]\n(1) 학설\n①원고와 참가인 사이에 대립관계가 없는 바 통상공동소송이라는 견해와 ②원고와 참가인의 청구는 모두 인용될 수 없는 관계이므로 대립관계로 보아 독립당사자참가소송이나 예비적 공동소송처럼 필수적 공동소송이라는 견해가 있다.\n(2) 判例\n1) 종래 判例\n승계참가인이 참가신청을 하자 원고가 탈퇴를 신청하였으나 피고 부동의로 탈퇴하지 못한 경우 원고와 참가인의 청구는 통상공동소송으로서 존속한다.\n2) 전원합의체 判例 (전합 케이 논거 확실의 이래쪽으로 옮기)\n제3자가 소송에 참가했으나 원고가 승계를 다투지 않으면서도 소송탈퇴, 소취하를 하지 않거나 피고의 부동의로 원고가 소송에 남는 경우 i)승계참가규정과 ii)다수당사자소송제도와의 정합성 iii)승계참가인과 피참가인의 중첩된 청구를 모순없이 합일적으로 확정할 필요성을 고려하면 승계로 인해 중첩된 원고와 승계참가인의 청구 사이에는 필수적 공동소송에 관한 법67조가 적용(~준용)된다고 하였다.\n(3) 검토 (공석은 당사자간 대립관계 없어 통상이라 했으나 독립참가나 예공도 다툼 없어도 결론 규정 준용되는 바 判例가)\n개정법은 편면적 독립당사자참가를 허용하고 예비적 공동소송을 신설해 필수적 공동소송규정을 준용했으므로 양립할 수 없는 청구를 하는 공동소송인들 사이에 제67조 규정을 준용할 근거가 마련된 바 判例는 타당하다.\n4. 설문해결 - 필수적 공동소송의 심판방법(연합관계) [성]\n일부판결이 허용되지 않는 바, 甲의 청구에 대해 판단하지 않았어도 이는 판단누락에 준하는 위법이 있는 전부판결이다. 따라서 상소대상적격이 있으므로 항소심법원의 판단은 부당하다."}, {"no": 2, "points": 10, "question": "丙이 乙에 대하여 양수금 청구의 소를 제기하면서 甲과 丙 사이에 체결한\n양도양수계약서 사본을 증거로 제출하였다. 이에 대하여 乙이 부지로 다투\n었는데, 법원은 변론 전체의 취지에 의하여 원본의 존재와 진정성립을 인정\n하였다. 이와 같은 법원의 조치에는 위법이 없는지를 그 논거와 함께 설명\n하시오.", "answer": "1. 문제의 소재 - 자유심증주의 및 변론전체취지\n법관이 변론전체 취지와 증거자료를 참작하여 자유롭게 사실인정을 할 수 있는 원칙으로 복잡한 현대 사회에서 구체적 타당성 있는 사실인정을 하기 위함이다.(제202조) 그런데, 변론전체 취지만으로도 문서의 진정성립 인정이 가능한지 문제된다.\n2. 변론전체 취지\n(1) 의의\n당사자의 주장 내용, 태도 등 변론과정에서 나타난 일체의 자료 또는 상황이다.\n(2) 변론전체 취지만으로 사실인정을 할 수 있는지 여부\n1) 통설, 判例 (주요사실 문제 아니므로 학설,겸도 풍요, 진정성립 판례의 선결로 주요사실 원칙 판례만 서술함)\n주요사실에 대해서는 \"변론전체 취지만으로 사실 인정을 할 수 없고 다른 증거방법의 보충적 권능을 더할 뿐이다\"라 하여 보충적 증거원인설 입장이다. 다만, i) 문서의 진정성립에 대해서는 변론전체 취지만으로 인정할 수 있다고 보았다.\n2) 사안 (아래와 같이 논점은 위치별이 잘 되어있는 곳을 보여주는 것이 고득점Tip)\n위 判例는 원본이 법원에 제출된 경우 그 진정성립을 변론전체취지로 인정할수 있다는 의미이다. 설문처럼 丙이 사본을 제출한 경우에도 동일한지 문제된다.\n3. 서증제출의 원칙 - 원본제출주의 (선례는 별도로 본대 작성, 핵심은 4번 목차임)\n법원에 문서를 제출하거나 보낼 때는 원본으로 해야 하나(제355조 1항), 判例는 사본의 신청자가 원본을 분실했다든지 선의로 훼손한 경우, 문서제출의무가 없는 제3자가 원본을 소지한 경우 등 원본의 제출이 불가능하거나 비실제적인 상황에서는 원본 제출이 요구되지 않는다고 본다.\n4. 사본 제출이 가능한 경우\n(1) 원본에 갈음하여 제출하는 경우\n원본을 제출하는 것이 원칙이나(제355조1항), 判例는 i)원본의 존재와 성립의 진정에 관해 다툼이 없고 ii)사본을 원본의 대용으로 함에 상대방의 이의가 없는 경우 사본만의 제출도 허용된다 본다.\n(2) 원본으로 제출하는 경우\n判例는 사본을 원본으로서 제출하는 경우 사본이 독립한 서증이 되나 원본이 제출된 것으로 되진 않고, 증거에 의해 사본과 같은 원본이 존재하고 원본의 진정성립이 인정되지 않는 한 그와 같은 내용의 사본이 존재한다는 것 이상의 증거가치는 없다고 본다.\n(3) 사안\n乙이 부지로 다투었는 바, 丙은 사본을 원본에 갈음하여 제출할 수 없다. 따라서, 사본을 원본으로 제출해야 하는데 이 때는 증거에 의해서만 원본의 존재와 진정성립 인정이 가능하다.\n5. 설문해결 (원본의 진정성립을 변론취지로 인정 가능한지 물었기에, 사본의 증거능력, 형식적 증거력은 논점↓)\n따라서, 법원이 변론전체 취지에 의해 원본의 존재와 인정성립을 인정한 것은 위법하다."}, {"no": 3, "points": 10, "question": "丙이 丁을 상대로 양수금채권을 피보전채권으로 하여 乙과 丁 사이의 위 매\n매계약의 취소와 가액배상을 구하는 채권자취소의 소를 제기하여 그 소장부\n본이 2022. 9. 5. 丁에게 송달되었다. 丙은 또 이 사건 소송계속 중 丁을 상\n대로 乙에 대하여 가지고 있던 공사대금채권을 피보전채권으로 하여 위 매\n매계약의 취소와 가액배상을 구하는 채권자취소의 소를 제기하여 그 소장부\n본이 2022. 9. 12. 丁에게 송달되었다. 이와 같은 경우 법원은 어떠한 판단을\n하여야 하는지를 그 논거와 함께 설명하시오.", "answer": "1. 문제의 소재\n채권자취소소송에서 피보전채권을 달리 하는 경우 이는 공격방법의 변경일 뿐 소송물은 동일한 바, 법원은 중복소제기 저촉으로 소각하함을 알아본다.\n2. 중복소제기의 의의 및 취지(제259조)\n법원에 계속 중인 사건에 대해 당사자는 동일한 소를 제기할 수 없다. 판결의 모순·저촉 방지를 위함이다.\n3. 요건\ni)전소 계속 중 후소가 제기되었고 ii)당사자도 丙,丁으로 동일하나 iii)소송물이 동일한지 문제된다.\n4. 소송물 동일여부 [대.사.무.문.소] (단순한 공격방어방법의 변경Case)\n(1) 채권자취소소송의 의의(민법 제406조)\n채무자가 채권자를 해함을 알면서 자기의 재산을 감소시키는 행위를 한 경우, 채권자가 그 행위의 취소 및 원상회복을 구하는 소이다.\n(2) 判例 (채권자취소소송 케이에서 전후소 채권자가 다른 경우 나오는 \"고유의 권리\" keyword는 여기서 무관)\n채권자취소소송을 하면서 피보전채권을 추가·교환하는 것은 사해행위취소권과 원상회복청구권을 이유있게 하는 공격방법의 변경일 뿐 소송물 변경이 아니다.\n(3) 사안\n丙은 피보전채권을 양수금채권으로 하여 전소를 제기하고, 공사대금채권으로 하여 후소를 제기했으나, 이는 공격방법의 변경일 뿐 소송물은 동일하다.\n5. 설문해결\n중복소제기는 소극적 소송요건으로, 흠결시 법원은 소각하판결을 해야 한다."}]}, {"subject": "민사소송법", "exam": "60회", "year": 2023, "problemNo": 2, "points": 20, "passage": "甲종중은 乙의 불법행위로 甲종중 소유의 X토지에 관한 甲종중의 사용ㆍ수익권이\n방해됨으로써 甲종중에 재산상 손해가 발생하였다는 이유로 차임상당 손해배상액\n의 지급을 구하는 소(이하 ‘이 사건 소’라 한다)를 제기하였다.", "subquestions": [{"no": 1, "points": 10, "question": "甲종중은 2020. 8. 17. 이 사건 소를 제기하면서 소장에 대표자 표시를 누락하\n였다가 제1심법원의 석명준비명령에 따라 甲종중의 대표자를 A로 기재한 서\n면을 제출하였다. 그러나 이 사건 소제기 당시 甲종중의 대표자는 A가 아니라\nB이었다. 甲종중은 2022. 10. 19. 항소심법원에 甲종중의 대표자를 A에서 B로\n정정하는 당사자표시정정신청서를 제출하면서 A의 기존 소송행위를 추인하는\n취지라고 주장하였다. 甲종중과 乙 모두 항소심에 이르기까지 B의 대표자 지\n위에 관하여 다툰 적은 없고, 그에 관하여 주장하거나 증명을 하지도 않았다.\n이에 대하여 항소심법원은 B에게 적법한 대표권이 있는지를 의심할만한 사정\n이 있음에도 B에게 당사자표시정정신청서 제출 당시에도 추인을 할 수 있는\n대표권이 있었다고 볼 증거가 부족하고, 당사자표시정정신청만으로 추인을 인\n정하기도 어렵다는 것을 이유로 이 사건 소가 대표권 없는 사람에 의하여 제\n기된 것으로 보아 부적법하다고 하여 소각하 판결을 선고하였다. 이와 같은 항\n소심법원의 판단에 잘못이 없는지를 그 논거와 함께 설명하시오.", "answer": "1. 문제의 소재 (관결의 위법성을 물어보는 문제 -> [직,변,재])\n대표권은 소송요건으로서 의심할 사정이 있는 경우 이를 조사해야 하나, 법원은 그 전에 지적의무를 행사했어야 함을 알아본다.\n2. 대표권의 취급\n(1) 제64조\n법인의 대표자 또는 제52조(비법인사단)의 대표자에게는 이 법 가운데 법정대리와 법정대리인에 관한 규정을 준용한다.\n(2) 흠결시 취급 (문제: \"의심할만한 사정이 있음에도\" -> 논점추출 keyword)\n소송요건으로서 직권조사사항이고 흠결시 소각하한다. 직권조사사항은 의문이 있을 경우 이를 직권으로 조사할 의무가 있다. 사안에서 항소심법원은 B에게 대표권이 있는지 의심할 만한 사정이 있으므로 이를 조사해야 한다. 다만 소각하 전에 지적의무를 행사해야 하는지 문제된다.(다음 목차 변결문구->논리 보여주기)\n3. 지적의무 행사 요부 (문제: \"다툼 적은 없고,\" \"주장,증명화지도 않았다 -> 논점추출 keyword 단권화)\n(1) 의의 및 취지(제136조4항)\n당사자가 간과한 법률상 사항에 관해 의견진술 기회를 부여하여 법률적 사항에 대한 예상 외의 재판을 방지하고 당사자의 절차권을 보장하기 위함이다.\n(2) 요건 (설문해결 부관한 지적의무 요건 일반은 상세 서술X. 아래 목차 (5)와 같이 자세한 사안포섭 할)\ni)당사자가 간과하였음이 분명한 ii)법률상 사항으로 iii)재판결과에 영향이 있어야 한다.\n(3) 행사방식\n법원은 당사자가 간과한 법률적 관점을 지적하여 당사자에게 의견진술기회를 주어야 한다. 이 때 그 상대방은 법률적 관점의 부지적이 불리하게 작용하는 당사자이다.\n(4) 관련 判例 [보,기,부,르,대]\n단체의 대표자 지위에 관해 쟁점이 되지 않은 경우, 법원은 당사자에게 그에 관해 증명이 필요함을 지적하고 적극적으로 석명권을 행사해 당사자에게 의견진술기회를 부여할 의무가 있다.\n(5) 사안\n대표권 흠결은 i)甲,乙이 간과했음이 분명한 ii)법률상 사항으로 iii)이로 인해 소각하되었는 바 재판결과에 영향을 미치므로 iv)법원은 甲에게 지적의무를 행사했어야 한다.\n4. 설문해결 (석명권,지적의무는 특히 논점누락 피우나 위와 같이 사례를 분석을 통한 논증추출 keyword 정리 활)\n따라서 법원이 지적의무 행사도 없이 대표권 흠결로 보아 바로 소를 각하한 것은 위법하다."}, {"no": 2, "points": 10, "question": "제1심법원은 청구기각판결을 하였고, 이에 대하여 甲종중이 항소하였다.\n항소심법원은 甲종중이 제출한 증거들만으로는 甲종중이 X토지를 현실적으\n로 사용 ㆍ수익하여 왔다거나, 이후 甲종중이 주장하는 乙의 불법행위로 인\n하여 X토지에 관한 甲종중의 사용 ㆍ수익권이 방해받음으로써 甲종중에 재\n산상 손해가 실제로 발생하였다고 보기는 어렵다고 판단하였다. 그럼에도\n항소심법원은 甲종중의 이 사건 청구를 기각하지 않고 이 사건 소가 甲종중\n의 종중총회결의 없이 제기되었음을 이유로 부적법하다고 보아 이를 각하하\n였다. 이에 대하여 甲종중만 상고하였다. 甲종중은 항소심변론종결 이후 상\n고심에 이르기까지 “甲종중이 종중원들의 소재를 파악하기 위한 가능한 노\n력을 기울인 끝에 국내에 거주하고 소재가 분명하여 통지가 가능한 종중원\n들에게 개별적으로 소집통지를 한 후 2023. 3. 24. 임시총회를 개최하였고,\n위 임시총회에서 A나 B가 甲종중의 대표자로서 기존에 이 사건 소에 관하\n여 한 소송행위를 추인하기로 결의하였다.”라는 취지로 주장하면서 이에 부\n합하는 참고자료를 제출하였다. 이러한 경우 상고심법원은 어떠한 판결을\n하여야 하는지를 그 논거와 함께 설명하시오.", "answer": "1. 문제의 소재\n상고심에서 추인함으로써 특별수권흠결로 소를 각하한 항소심 판단은 위법해졌는 바, 상고심법원은 파기환송판결 해야 함을 알아본다.\n2. 소송행위의 추인\n(1) 의의 및 취지(제60조,제64조)\n법정대리인이 추인하면 소급하여 유효가 된다. 무능력자 소송행위라도 본인에게 유리할 수 있기 때문이다.\n(2) 방법 및 시기\n명시·묵시적 추인 모두 가능하고, 시기 제한도 없으므로 判例는 상고심에서도 할 수 있는 것이라고 한다.\n(3) 사안 (추인 전까지는 항소심 판단 적법) (cf. 소송요건 판단시기 논점도 ; 추인으로 사실심 변론시 기준으로도 위법)\n상고심에서 임시총회에서의 대표자 A나 B에 의한 추인이 있었는 바, 항소심의 소각하 판결은 결과적으로 위법한 판단이 되었다.\n3. 상고심법원의 판단\n(1) 원칙 - 파기환송(제436조1항)\n상고법원은 상고에 정당한 이유가 있다고 인정할 때에는 원심판결을 파기하고 사건을 원심법원에 환송해야 한다.\n(2) 예외 - 파기자판(제437조)\ni)확정된 사실에 대해 법령적용이 어긋나 판결을 파기하는 경우 사건이 그 사실을 바탕으로 재판하기 충분한 때(제1호) ii)사건이 법원의 권한에 속하지 않아 파기하는 경우(제2호) iii)소송요건 흠결을 이유로 파기하는 경우(判例) 자판한다.\n(3) 사안 및 설문해결\n항소심 판단은 위법하므로 상고심은 원판결을 파기하고, 확정된 사실관계를 바탕으로 재판하기 충분하다는 사정이 없는 바 자판하지 않고 환송해야 한다.(cf. 동인사실관 2018다227887에서는 상고심이 확정된 사실관계 바탕으로 청구기각할 상응이 인정소나(제437조1호) 소각하와 못변급 논리(86다카2675)로 상고기각함 -> 보충자료 참고)"}]}, {"subject": "민사소송법", "exam": "60회", "year": 2023, "problemNo": 3, "points": 30, "passage": "甲은 2022. 8. 18. 乙에게 1억 원을 이자는 월 1%, 변제기는 2022. 10. 17.로 정\n하여 대여하기로 약정하였다. 乙은 2022. 10. 17. 甲에게 위 대여금의 이자로 2\n백만 원을 지급하였다. 또한 乙은 甲 소유의 X부동산을 점유하고 있다가 乙명의\n로 소유권이전등기를 하였다.", "subquestions": [{"no": 1, "points": 10, "question": "甲은 乙을 상대로 1억 원의 대여금의 지급을 구하는 소를 제기하였다. 이에\n대하여 제1심법원은 乙의 변제항변을 일부 받아들여 甲의 청구 중 6천만 원\n을 인용하였다. 이에 甲만 항소하였는데, 乙이 甲에 대하여 가지고 있는 6천\n만 원의 매매대금채권을 자동채권으로 하여 상계항변을 하였다. 이에 대하\n여 항소심법원은 乙의 변제항변은 전부 이유 없고 오히려 乙이 제출한 상계\n항변이 전부 이유 있는 것으로 인정하여 甲의 청구 중 4천만 원을 인용하였\n다. 이와 같은 항소심법원의 판단에 잘못이 없는지를 그 논거와 함께 설명하\n시오.", "answer": "1. 문제의 소재\n상소불가분원칙에 의해 甲의 대여금채권 1억원은 모두 이심될 것이다. 다만 심판대상에 있어 불이익변경금지원칙의 예외사유와 관련하여 제415조 단서에 비추어 항소심법원은 乙의 상계항변을 받아들일 수 있음을 알아본다.\n2. 乙이 불복하지 않은 6천만 원 부분 이심 여부\n(1) 상소불가분원칙\n상소 제기에 의한 확정차단과 이심의 효력은 상소인의 불복범위에 관계없이 원판결 전부에 대해 발생한다.\n(2) 사안\n甲이 불복한 부분과 관계없이 1억 원 전부 이심된다.\n3. 乙이 불복하지 않은 6천만 원 부분 심판대상 여부\n(1) 원칙 - 불이익변경금지원칙(제415조 본문)\n상소심 심판범위는 상소인의 불복신청 범위에 한하며 그 한도를 넘어 불이익하게 변경할 수 없는 것으로 상소심에서의 처분권주의 발현이다.\n(2) 예외 [상,제,항,상]+[배점상 예외사유 나열要등]\ni)상대방의 상소나 부대상소가 있을 때 ii)처분권주의에 의하지 않는 절차 iii)항소심에서 상계주장을 인정하는 경우(제415조 단서) iii)필수적/예비적 공동소송, 독립당사자참가의 경우 불이익변경금지원칙이 배제된다.\n(3) 사안 - 항소심에서 상계주장을 인정하는 경우\n항소심에서 상계 주장을 인정한 때에는 동 원칙이 적용되지 않는다.(제415조 단서) 따라서 항소심에서 乙의 6천만 원의 상계가 인정되어도 불이익변경이 아니다. 항소심은 乙의 상계항변을 받아들일 수 있고 이 때 법원은 4천만 원 청구인용판결을 할 것이다.\n4. 설문해결 (불변금의 예외 사안허로 불변금 판단기준 서술 불요)\n따라서, 乙의 상계항변을 인정하여 4천만 원을 인용한 항소심법원의 판단은 타당하다."}, {"no": 2, "points": 10, "question": "甲은 乙을 상대로 1억 원의 대여금의 지급을 구하는 소를 제기하여 5천만\n원의 일부승소판결을 받았고, 甲과 乙 쌍방이 항소하였다. 甲은 항소심의 변\n론기일 전날에 법원에 소취하서를 제출하였으며, 乙은 甲의 소취하에 동의\n하였다. 甲은 변론기일에 출석하여 착오로 소취하가 이루어진 것이니 소취\n하는 무효이고, 만일 소취하가 유효하다면 착오를 이유로 소취하를 취소 또\n는 철회한다고 주장하면서 법원에 기일지정신청을 하였다. 이에 대하여 법\n원은 어떠한 조치를 하여야 하는지를 그 논거와 함께 설명하시오.", "answer": "1. 문제의 소재 - 기일지정신청의 의의(규칙 제67조)\n확정판결에 의하지 않고 소송이 종료된 경우, 그 무효를 다투면서 기일을 열어줄 것을 신청하는 제도로 법원은 i)소송종료가 잘못된 경우 절차를 속행하고 ii)그렇지 않으면 소송종료선언한다.\n2. 민법상 규정을 유추하여 취소가부\n(1) 학설\n①하자고려설은 소취하 등과 같은 절차 종료 행위는 그 뒤에 연속되는 다른 소송행위가 없어 절차안정을 해하지 않는바 유추 적용할 수 있다 보고 ②하자불고려설은 소송은 절차안정을 위해 표시주의를 관철해야 하는바 민법상 의사표시 하자 규정을 유추적용할 수 없다 본다.\n(2) 判例\n민사소송법상 소송행위에는 민법상 법률행위에 관한 규정이 적용될 여지가 없으므로 사기, 강박 또는 착오 등 의사표시 하자를 이유로 그 무효나 취소를 주장할 수 없다 하여 불고려설 입장이다.\n(3) 검토\n소 취하에 하자가 있는 경우 제451조1항5호를 유추 적용할 수 있고, 착오에 의한 취소를 인정하면 절차안정을 해할 수 있는바 불고려설이 타당하다.\n(4) 사안\n따라서 甲은 민법규정을 유추하여 소취하를 취소할 순 없으나, 재심규정을 유추하여 소취하 철회 가능한지 문제된다.\n3. 소송행위의 철회 (변죄행위가 없었어도 존재시 소송행위 하자가 있을 경우, 민법 규정 유추 가부와 재심사유 도부 여부를 조사하므로 항상 기계적으로 쓰는 것이 베점상 유리함)\n(1) 소송행위 철회의 원칙과 제한 (배점상 생략)\n(2) 소송행위 철회제한의 예외 - 제451조1항5호 재심사유 유추\n통설·判例는 소송종료행위가 사기,강박 등 타인의 형사상 처벌받을 행위에 의해 이루어진 경우 제451조1항5호를 유추적용하여 철회할 수 있다고 한다. 다만 유죄확정판결을 요하는지 문제된다.\n(3) 유죄확정판결 필요여부\n통설은 유죄판결을 요하는 것은 구제의 길을 좁힐 수 있는바 필요 없다고 보나, 判例는 i)유죄판결이 확정되고 ii)소송행위가 그에 부합되는 의사 없이 외형적으로 존재할 때 가능하다고 본다.\n(4) 검토 (배점상 생략)\n(5) 관련 判例 - 착오\n소송행위가 사기,강박 등 형사상 처벌받을 타인의 행위로 이루어져도 범죄행위가 소송행위를 하는데 착오를 일으킨 정도에 불과할 뿐 그에 부합되는 의사가 존재하는 경우 소송행위 효력을 다툴 수 없다.\n(6) 사안\n甲이 착오로 소취하한 것과 관련하여, i)유죄판결이 확정된 사정이 없고 ii)의사없이 외형만 존재하는 경우도 아닌 바, 재심규정을 유추한 철회도 불가하다.\n4. 설문해결 (위 논점은 진행적인 목차가 있기에, 빠르게 위 쟁점된 목차들까지 기계적으로 현출하는 것이 관건)\n따라서, 법원은 당사자의 기일지정신청이 이유 없다는 이유로, 소송종료선언해야 한다."}, {"no": 3, "points": 10, "question": "甲은 X부동산에 대하여 乙을 상대로 소유권에 기한 이전등기말소청구의 소\n를 제기하였다. 이에 乙은 甲이 주장하는 소유권을 시인하였다. 이에 대하여\n법원은 어떠한 판단을 하여야 하는지를 그 논거와 함께 설명하시오.", "answer": "1. 문제의 소재 - 재판상 자백의 의의(제288조)\n당사자가 변론 또는 변론준비기일에서 상대방 주장과 일치하고 자기에게 불리한 주요사실을 인정하는 진술을 말한다.\n2. 요건 [변,일,불,주,사]\n乙은 i)변론기일에서 ii)甲의 주장과 일치하는 iii)자신에게 불리한 진술을 하였으나 iv)구체적 사실에 대한 진술이어야 하는 것과 관련하여 구체적 사실이 아닌, 선결적 법률관계에도 재판상 자백이 인정되는지 문제된다.\n3. 선결적 법률관계에 대한 자백 가부 (권리자백 일반론 진술 可)\n(1) 학설\n①긍정설은 이는 소전제를 이루고 있다는 점에서 사실관계와 다를 바 없어 자백이 된다고 보고 ②부정설은 권리자백은 법원 전권에 속하는 법률판단에 관한 자백으로서 자백이 되지 않는다고 본다. ③절충설은 당사자 구속력으로는 당사자는 임의철회가 불가능하나, 법원은 자유롭게 판단할 수 있다고 본다.\n(2) 判例 (관례 태도 명확히 숙지)\ni)\"소송물의 전제가 되는 권리관계를 인정하는 진술은 권리자백으로서 법원을 기속하지 않는다\" 하여 부정하나 ii)소유권등기말소소송에서 \"피고가 원고의 소유권을 인정한 진술은 그 소전제가 되는 소유권의 내용을 이루는 사실(ex.~로부터 매수, 증여받음)에 대한 진술로 볼 수 있으므로 재판상 자백이 성립된다\"고 본다.\n(3) 검토\n소유권에 기해 인도·말소 청구를 할 경우 요건사실은 관념적 소유권의 원고귀속 자체가 아니라 요건에 해당하는 구체적 사실이므로 토지소유권을 취득하게 된 원인에 관한 구체적 사실이다. 따라서 판례가 타당하다.\n(4) 사안\n따라서 乙의 甲소유권 인정 진술은 甲의 소유권의 내용을 이루는 사실에 대한 자백으로 처리해 원고는 소유권자로 보아야 한다.\n4. 재판상자백의 효과 (3가지 측면에서 검토 효과를 서술해야 법원의 판단 서술 가능됨으로 필수두자임)\ni)자백의 상대방은 증명책임이 면제되고(제288조 본문) ii)당사자 구속력으로 임의 철회가 제한되며(제288조 단서) iii)법원에 대한 구속력으로 법원은 자백사실을 그대로 인정해야 한다.\n5. 설문해결\n법원은 乙의 자백에 구속되어 청구인용판결을 해야 한다."}]}, {"subject": "민사소송법", "exam": "60회", "year": 2023, "problemNo": 4, "points": 20, "passage": "甲은 서울 중구 소재 지상에 위치한 지하 8층, 지상 14층 규모의 집합건물인 X\n상가의 구분소유자들로 구성된 관리단(상가번영회)이다. 乙은 이 사건 상가의\n구분점포의 구분소유자이고, 2017. 9. 1.부터 이 사건 점포에서 커피숍을 운영하\n고 있다. 乙은 2019. 6. 30.부터 관리비를 지급하지 않고 있다.", "subquestions": [{"no": 1, "points": 10, "question": "甲은 2021. 7. 30. 乙을 상대로 상가관리비 등의 지급을 구하는 민사조정을\n신청하였다. 2021. 10. 8. 그 조정신청서 부본이 乙의 주소(이하 ‘이 사건 주\n소’라 한다)로 송달되었고, 이를 乙이 수령하였다. 乙은 2021. 11. 12. 제2차\n조정기일에 출석하였으나 조정이 불성립되었고, 조정이 성립되지 않은 것으\n로 사건이 종결된 후 乙의 주소가 변경되었다. 그럼에도 乙이 조정법원에 주\n소변경신고를 하지 않은 상태에서 민사조정법(제36조 제1항 제2호)에 따라\n조정이 소송으로 이행되었다. 제1심법원은 2022. 5. 10. 변론기일통지서,\n2022. 6. 3. 청구취지 및 원인변경신청서를 각 이 사건 주소로 우 편송달(통상\n송달)을 실시하였으나 ‘수취인불명’으로 乙에게 송달되지 아니하자, 2022. 6.\n14. 위 변론기일통지서와 청구취지 및 원인변경신청서를 등기우 편의 방식으\n로 각 발송송달을 실시하였다. 2022. 6. 20. 판결선고기일통지서를 이 사건\n주소로 우편송달(통상송달)을 실시하였으나 ‘수취인불명’으로 乙에게 송달되\n지 아니하자, 2022. 7. 4. 위 판결선고기일통지서를 등기우 편 의 방 식 으로 발\n송송달을 실시하였다. 제1심법원은 2022. 7. 8. 甲 승소판결을 선고하고 그\n판결정본을 2022. 7. 12. 이 사건 주소로 우 편송달을 실시하였으나 ‘수취인불\n명’으로 송달되지 아니하자, 2022. 7. 25. 공시송달의 방법으로 위 판결정본\n을 송달하여 2022. 8. 9. 그 송달의 효력이 생기게 되었다. 乙은 2023. 1. 9.\n에 이르러서야 제1심 판결정본을 송달받지 못하여 항소기 간을 준수하지 못\n하였다는 이유로 추완항소장을 제1심법원에 제출하였다. 이에 대하여 항소심\n법원은 이 사건 추후보 완 항소가 허 용되지 않는다고 판단하였다. 이와 같은\n항소심법원의 판단에 잘못이 없는지를 그 논거와 함께 설명하시오.", "answer": "1. 문제의 소재\n추후보완항소의 요건과 관련하여, 조정이 불성립되어 소송으로 이행된 경우 당사자에게 소송진행상황을 모른 것에 대해 책임질 수 없는 사유가 인정되므로 추후보완항소가 가능함을 알아본다.\n2. 추후보완항소 가부\n(1) 의의 및 취지(제173조)\n당사자가 책임질 수 없는 사유로 불변기간을 지킬 수 없었던 경우 소송행위를 보완하는 제도로서 당사자의 기간 부준수로 인한 불이익을 구제하기 위함이다.\n(2) 요건\ni)상소기간은 불변기간이고 ii)책임질 수 없는 사유여야 하는데 공시송달의 경우에 따른 취급이 문제된다.\n(3) 공시송달의 경우 (判例)\n1) 심급 처음부터 공시송달된 경우\n소장이 처음부터 공시송달이 되었다면 특별한 사정이 없는 한 공시송달 사실을 모른 것에 과실이 없으므로 추후보완을 인정한다.\n2) 소송 진행 도중 공시송달된 경우\n그러나 소송 중 공시송달이 된 경우 처음부터 공시송달이 된 경우와 달리 당사자에게 소송 진행상황을 조사할 의무가 있으므로 당사자가 법원에 소송의 진행 상황을 알아보지 않았다면 과실이 없다고 할 수 없다.\n(4) 관련 判例 (이 관례는 별도로 필출하지 못해도, 최소 아래 목차 (5) key 활용하여 결론은 톨리지 않아야 할)\n조정불성립으로 사건이 종결된 경우 반드시 소송절차로 이행된다 볼 수 없으므로 조정불성립으로 소송으로 이행되면서 공시송달이 된 경우 피신청인에게 소송 진행 상황을 조사할 의무가 있다고 할 수 없는바 책임질 수 없는 사유로 본다.\n(5) 사안 (key: '소송진행상황 조사의무')\n乙은 조정불성립시 소송절차로 이행됨을 알 수 없었을 것이므로 소송진행상황 조사의무가 없다. 따라서 추후보완사유가 인정된다.\n3. 설문해결 (남배 주관에서 말않으므로 추완원과 줄 권요. -> 설문(2)에 회직생질 할)\n따라서, 추후보완항소가 허용되지 않는다고 본 항소심법원의 판단은 부당하다."}, {"no": 2, "points": 10, "question": "甲은 2021. 9. 27. 乙을 상대로 상가관리비 등의 지급을 구하는 소를 제기하\n였다. 제1심법원은 2021. 10. 11. 이행권고결정을 하였고, 乙은 2021. 10. 18.\n소장에 기재된 乙 주소지에서 이행권고결정서 등본을 송달받고 2021. 10.\n19. 제1심법원에 답변서를 제출하였다. 乙은 2021. 10. 20. A교도소에 구속\n수 감 되었다. 제1심법원은 2021. 11. 16.과 2021. 12. 14. 두 차 례 변론기일을\n열고 변론을 종결하였는데, 변론기일통지서 등을 乙 주소지에 폐문부재로\n송달하지 못하여 발송송달 방법으로 송달하였고, 乙은 변론기일에 출석하지\n않았다. 제1심법원은 2022. 1. 11. 甲의 청구를 인용하는 판결을 선고하였고,\n판결정본을 乙 주소지에 폐문부재로 송달하지 못하여 재판장의 공시송달명\n령에 따라 공시송달 방법으로 송달하였고, 2022. 2. 10. 0시에 송달의 효력\n이 발생하였다. 乙은 2022. 8. 19. A교도소에서 출소하여 2022. 8. 22. 제1심\n판결정본을 발급받고 2022. 9. 2. 제1심법원에 추 완항소장을 제출하였다. 이\n에 대하여 항소심은 이 사건 추 완항소를 부적법하다고 보아 각하하였다. 이\n와 같은 항소심법원의 판단에 잘못이 없는지를 그 논거와 함께 설명하시오.", "answer": "1. 문제의 소재\n피고 乙이 소송계속 중 수감된 경우, 소송진행상황을 알 수 없었을 것인 바 추완항소가 가능함을 알아본다.\n2. 추후보완항소의 요건 (설문(1)에서 언급한 요건 일반은 생략)\n(1) 判例 (민사소송법 시행에서도, 이후 같이 시행됨도 기준 그 이전 해예 선고된 외선판례가 나온 이래적인 경우임)\n피고가 소송계속 중 수감되자, 법원이 판결정본을 182조에 따라 교도소장 등에게 송달하지 않고 주소 등에 공시송달했다면, 수감된 자는 제185조에서 정한 송달장소변경 신고의무를 부담하지 않고 요건을 갖추지 못한 공시송달로 상소기간을 지키지 못했으므로 책임질 수 없는 사유다.(단순 교도소 수감이라 추완 요건 만족하는 것 X -> [判교]60카958)\n(2) 사안 (key: '소송진행상황 조사의무') (이 또한, 위 관례를 별도로 필출하지 못해도 아래 결론은 정확히 내려야 함)\n乙이 소송계속 중 A교도소에 수감되었고, 乙은 제185조에서 정한 송달장소변경 신고의무를 부담하지 않으므로 소송진행상황을 조사할 의무가 없다. 따라서 책임질 수 없는 사유가 인정된다.\n3. 추후보완항소의 절차\n(1)\n사유 소멸일로부터 2주 내에 해야 한다. 判例는 공시송달의 경우 사유소멸일이란 판결이 있었던 사실을 안 때가 아니라 판결이 공시송달에 의해 이루어진 것을 안 때로 본다.\n(2) 사안\n乙은 2022. 8. 22. 제1심 판결정본을 발급받음으로써 판결이 공시송달에 의해 이뤄졌음을 알았다. 乙은 이로부터 2주 내인 2022. 9. 2.에 추완항소장을 제출하였는 바 적법하다.\n4. 설문해결\n乙의 추완항소는 요건을 만족하였고 사유 소멸일로 2주 내에 제기하였는 바 적법하다. 따라서 추완항소를 부적법하다고 보아 각하한 항소심법원의 판단은 부당하다."}]}, {"subject": "민사소송법", "exam": "61회", "year": 2024, "problemNo": 1, "points": 30, "passage": "甲은 자기 집 부근의 도로를 건너다가 乙이 운전하는 乙 소유의 승용차에 치였다.\n甲은 이 사고로 다리와 허리 부위를 다쳐서 전치 15주의 가료를 요하는 부상을\n입었다.", "subquestions": [{"no": 1, "points": 10, "question": "甲은 乙이 자신에게 교통사고를 낸 것을 미안하게 생각하고는 있지만, 甲에\n게도 사고의 잘못이 있는 것이 아니냐며 제대로 배상을 해주지 않을 것 같은\n태도를 보이자, 합의를 통해 배상을 받는 것을 포기하고 甲이 자동차 사고로\n입은 손해가 乙의 과속 내지 전방주시의무 위반 등 불법행위로 인한 것이라\n고 주장하며 乙을 상대로 재산적 손해로 치료비 3천만 원, 위자료 1천만 원\n도합 4천만 원의 손해배상의 지급을 구하는 소를 법원에 제기하였다.\n제1심 법원은 사건을 심리한 후 甲의 청구 중 재산적 손해 부분은 전부 인용\n하였으나, 위자료는 500만 원만 인용하여, 乙에게 도합 3,500만 원의 지급을\n명하는 판결을 선고하였다.\n甲이 이 판결 중 위자료 부분에 대해 항소하였는데, 乙은 항소나 부대항소를\n제기하지 않았다. 그런데 항소심 심리가 진행되던 중 甲은 위 사고로 인한\n치료비가 2천만 원이 더 필요한 것을 알게 되었다. 이 경우 甲은 항소심에서\n재산적 손해배상 청구액을 5천만 원으로 확장할 수 있는지 검토하시오.", "answer": "1. 문제의 소재\n재산상 손해는 전부승소하고 위자료는 일부패소시 소송물을 단일하다고 보면 일부패소로서 상소이익이 인정되나 그렇지 않은 경우 상소이익이 문제될 수 있는바 이하 신체상해로 인한 손해배상청구의 소송물부터 알아본다.\n2. 신체상해로 인한 손해배상청구의 소송물\n손해1분설, 손해2분설이 있으나, 判例는 소송물은 통상 치료비와 같은 적극적 손해와 일실수익과 같은 소극적 손해 및 정신적 손해의 3가지로 나누어진다 하여 손해3분설 입장이다.\n3. 항소심에서 재산적 손해부분의 이심여부 (단순병합 이상병합 중요논의↓)\n재산상 손해와 위자료는 별개의 소송물로 단순병합이고, 재산상 손해에 대해 청구취지를 확장하려면 상소하지 않은 재산상 손해 부분도 확정되지 않고 항소심에 이심되어야 하는데, 반대견해가 있으나 상소불가분원칙에 의해 전부이심된다.\n4. 상소의 이익 판단기준\n(1) 학설\n① 형식적불복설은 당사자의 신청보다 판결주문이 불리하면 상소이익이 있다 보고 ② 실질적불복설은 원판결보다 실체법상 유리한 판결을 받을 가능성이 있으면 인정하며 ③ 절충설은 원고는 형식적 불복설, 피고는 실질적 불복설에 의한다 보고 ④ 신실질적불복설은 기판력 등 판결효력으로 불이익을 입으면 상소이익을 인정한다.\n(2) 判例\n1) 원칙 - 형식적 불복설\n상소인은 자기에게 불이익한 재판에 대해서만 상소를 제기할 수 있고, 상소인에게 불이익한지 여부는 재판의 주문을 표준으로 하여 결정된다 하여 형식적 불복설 입장이나 일부 예외를 두고 있다.\n2) 예외\n불법행위로 인한 손해배상에 있어 재산상 손해나 위자료는 단일 원인에 근거한 것인데 편의상 이를 별개 소송물로 분류한 것에 지나지 않으므로 이를 실질적으로 파악하여 항소심에서 위자료와 재산상 손해에 관해 청구확장이 허용된다 하여 항소이익을 인정하였다.\n(3) 검토\n재산상 손해에 대해 청구취지 확장을 허용하지 않으면 원고의 잔부 청구 기회가 박탈되므로 당사자 구제를 위해 항소이익을 인정함이 타당하다. 그러나 이는 별개 소송물로 파악하는 기본입장과는 모순되므로 묵시적 일부청구의 논리로 상소이익을 인정해야 한다.\n5. 설문해결\n甲이 재산적 손해액을 5000만원으로 확장하는 것은 추가적 변경이고 이는 청구원인은 동일하고 청구취지만을 변경한 경우로 청구기초 동일성이 인정되므로 가능하다."}, {"no": 2, "points": 10, "question": "甲은 위 교통사고로 인한 손해배상으로 乙에 대해 3천만 원의 지급을 구하는\n소를 제기하였다. 그 후 얼마 지나지 않아 乙로부터 손해배상을 해줄 터이니\n자신의 사무실에서 만나자는 연락을 받았다. 그런데 甲이 乙의 사무실로 들\n어가니 주위의 몇몇 사람들이 쳐다보면서 좋은 말로 할 때 합의를 하라고 종\n용하여, 甲은 합의를 하지 않으면 어떤 위해를 당하게 될지도 모른다는 생각\n에 乙이 제시한 1천만 원의 합의조건을 받아들이겠다고 약속하였다. 변론기\n일에 출석한 甲과 乙은 乙이 甲에게 1천만 원의 배상금을 지급하고, 甲은 소\n를 취하하며, 이후 위 교통사고와 관련된 일체의 책임을 묻지 않기로 하는\n취지로 소송상 화해를 하여, 그 내용이 조서에 기재되었다.\n이 화해가 성립된 후, 억울함을 느낀 甲은 위 소송상의 화해가 乙 측의 강박\n에 의하여 성립되었다고 주장하며 법원에 위 화해조서의 무효확인을 구하는\n소를 제기하였다. 이 소는 받아들여질 수 있는지를 검토하시오.", "answer": "1. 문제의 소재 [별,기,다,해]\n재판상 화해의 법적성질에 비추어 실체법상 하자가 있더라도 기판력이 발생하고 이에 따라 화해무효확인의 소는 받아들여질 수 없음을 알아본다.\n2. 소송상 화해의 법적성질 (이하 논의의 선결)\n(1) 학설 (사법행위설 생략 可)\n①소송행위설은 사법상 화해와 다른 기판력을 발생시키는 소송행위로서 소송법에 따라 규율된다 보고 ②양성설은 사법상 화해계약과 소송종료 목적의 소송행위 성질을 동시에 가지는 행위로 본다.\n(2) 判例\n재판상 화해는 소송물인 법률관계를 확정시키는 효력이 있으므로 순연한 소송행위로 볼 것이라 판시하여 소송행위설 입장이다. 다만 실효조건부 화해 및 창설적 효력을 인정한 것은 양성설의 태도이다.\n(3) 검토\n화해조서가 작성되면 화해조서는 제220조에 따라 확정판결과 같은 효력을 가지고 제461조에 따라 준재심의 소만 제기할 수 있는바 소송행위설이 타당하다.\n3. 실체법상 하자 있는 경우 기판력 인정여부 및 다툴 수 있는지 여부\n(1) 학설 (민사소송규칙 67조③ 참고: 명문상 \"소취하\"만을 규정하고 있는데 '화해무효확인의 소' 여기서는 확인되지 이미 인정)\n①무제한기판력설은 i)제220조 및 제461조에서 예외 규정을 두고 있지 않은바 실체법상 하자가 있는 경우에도 언제나 기판력이 발생하고 ii)화해조서에 재심사유가 존재하는 경우에 한해 준재심을 구하여 화해의 무효를 주장할 수 있다 하고 ②제한적 기판력설은 i)당사자 보호를 위해 실체법상 하자가 없는 경우에만 기판력이 발생하며 ii)실체법상 하자 존재시 기일지정신청이나 화해무효확인의 소를 제기하여 무효를 주장할 수 있다고 본다. ③기판력 부정설은 i)화해효력에 기판력을 부정하는바 ii)실체법상 하자 존재시 기일지정신청이나 화해무효확인을 구할 수 있다.\n(2) 判例\n재판상 화해조서는 확정판결과 같은 효력이 있어 기판력이 생기므로 그 내용이 강행법규에 위반된다 할지라도 그 화해가 무효라는 주장을 할 수 없다 하여 무제한기판력설 입장이다.\n(3) 검토\n기판력은 그 내용의 유·무효를 묻지 않고 판결에 반하는 주장이 허용되지 않는 것이므로 제220조 및 제461조에 비추어 무제한 기판력설이 타당하다.\n(4) 사안 및 설문해결\n따라서 甲은 준재심으로만 구제받을 수 있을 뿐, 乙의 강박을 이유로 화해무효확인을 구하는 것은 무제한 기판력설에 따라 받아들여질 수 없다."}, {"no": 3, "points": 10, "question": "甲이 위 교통사고로 인한 손해배상청구의 소를 제기하려고 한다는 것을 알게 된\n乙은 자기가 준비 중인 시의원 선거 출마가 무산될까 두려운 나머지 甲에게\n원하는 대로 해줄 테니 제발 소를 제기하지 말아달라고 부탁하면서, 자신이\n서명한 손해배상 각서를 甲에게 교부하였다. 그런데 甲이 얼마를 요구할지\n몰랐기 때문에 이 각서의 손해배상 액수 부분이 비워진 채 교부되었다. 이\n각서를 받은 甲은 얼마 후 乙에게 5천만 원의 지급을 요구하였으나, 乙이 너\n무 액수가 많다고 거절하자, 甲은 임의로 이 각서에 손해배상 액수를 5천만\n원으로 기재하여 乙을 상대로 5천만 원의 지급을 구하는 소를 제기하였다.\n이 각서가 법원에 제출된 후 乙은 각서상의 서명은 자기 것이 맞으나, 甲이\n무단으로 액수를 기재하였으므로 증거로서 효력이 없다고 주장하였다. 법원\n은 이 각서를 증거로 인정하여 乙에게 5천만 원의 지급을 명할 수 있는지 설\n명하시오.", "answer": "1. 문제의 소재 [처분문서]\n법원이 손해배상 각서에 기초하여 乙에게 5천만원 지급을 명할 수 있는 것은 처분문서인 각서의 실질적 증거력에 의한 것이다. 다만 그 전제로 각서의 형식적 증거력이 인정되는지 문제된다.\n2. 형식적 증거력의 개념\n문서가 거증자가 주장하는 자에 기해 작성된 것을 문서의 진정성립이라 하고, 진정성립이 인정된 문서를 형식적 증거력이 있다고 본다.\n3. 형식적 증거력의 판단 - 인부 절차\n문서 제출시 인부절차를 통해 형식적 증거력을 판단한다. 인정, 침묵, 부인, 부지의 4가지로 답변할 수 있으며, 부지는 부인으로 추정되고 침묵은 성립인정으로 간주된다.\n4. 형식적 증거력의 추정 - 2단의 추정 (判例)\n(1)\n법률요건분류설에 따라 사문서는 거증자가 진정성립을 증명해야 한다.(제357조) 다만 判例는 입증책임 완화를 위해 \"인영의 진정이 인정되면 날인의 진정이 사실상 추정되고, 날인의 진정이 추정되면 제358조에 의해 문서전체의 진정성립이 추정된다\"하여 이른바 2단의 추정을 인정하고 있다.\n(2)\n乙은 자신의 인영사실을 자백하였는바 진정성립이 추정될 것이다. 다만 이러한 2단의 추정을 복멸하기 위한 방법으로서 백지문서에 대한 증명책임이 문제된다.\n5. 형식적 증거력 추정의 복멸 - 백지문서 항변 [사,추,다,본,체]\n(1)\n제358조에 의해 진정성립이 추정된 경우, 이는 사실상 추정을 명문화한 것에 불과하므로 다투는 자가 \"반증으로\" 문서의 진정성립에 관해 의심을 품게 하는 사정을 입증하면 그 추정이 번복된다.\n(2)\n문서의 진정성립을 깨기 위해 자신의 날인의 진정을 인정하고 이와 양립가능한 별개사실인 백지문서를 증명하는 것은 간접반증에 해당하고, 이러한 사실 자체는 본증으로 법관에게 확신을 주어야 한다.\n6. 사안 및 설문해결\n乙은 백지문서의 항변을 하고 있는바 이러한 사실을 乙이 본증으로 법관에게 확신을 줄 경우 진정성립의 추정이 복멸될 것이나, 설문에선 그러한 사정이 없는바 각서의 진정성립은 추정될 것이고 법원은 乙에게 5천만원 지급을 명할 수 있을 것이다."}]}, {"subject": "민사소송법", "exam": "61회", "year": 2024, "problemNo": 2, "points": 20, "passage": "甲은 프랜차이즈 사업을 하고 있는데, 乙에게 영업권을 부여하는 계약을 체결하\n면서 영업자금으로 2억 원을 대여해 주었으나 乙이 약속한 기한을 어기고 반환\n하지 않는다고 주장하면서 乙을 상대로 2억 원의 대여금 반환을 청구하는 소를\n제기하려고 한다.", "subquestions": [{"no": 1, "points": 10, "question": "甲이 乙에게 위 금전을 빌려주면서 함께 작성한 프랜차이즈 및 소비대차 계\n약서에는 “이 계약과 관련된 분쟁이 발생하였을 경우에는 乙의 주소지 법원\n을 관할법원으로 한다.”라는 문구가 있다. 당초 위 계약을 체결하였을 때에는\n甲과 乙의 주소지가 모두 A 시에 있었으므로 문제가 되지 않았으나, 이후 乙\n이 B 시로 이사를 가서 현재 乙의 주소지인 B 법원에 소를 제기하게 되면\n甲은 상당한 불편을 감수하여야 한다. 甲은 고심 끝에, 민사소송법에서 의무\n이행지 법원이 관할법원으로 규정되어 있음을 발견하고 지참채무의 원 칙에\n따른 의무이행지인 자신의 주소지를 관할하는 A 법원에 소장을 제출하였다.\nA 법원에 이 소의 관할권이 있는지를 검토하시오.", "answer": "1. 문제의 소재\n甲, 乙간의 관할합의는 전속적 관할합의로 해석되어 A법원에는 이 소의 관할권이 없음을 알아본다.\n2. 이 사건 토지관할 [보,특,편,경] (재판적과 관할권 용어 구별)\n①보통재판적은 피고 乙의 주소지인 B에 있고(제2조, 제3조) ②특별재판적은 재산권에 관한 소는 의무이행지 법원에 제기할 수 있는데, 금전채무는 지참채무 원칙상 甲의 주소인 A에 있다.(제8조)\n3. 합의관할 [의,요,모,효,료] (약관으로 관할합의 한 것 아니므로 약관규제법 관련 2009다1485 출제되도)\n(1) 의의 및 취지\n관할법원을 정하는 당사자 간의 소송상 합의로서, 재판의 분담 및 당사자 편의를 도모하기 위함이다.\n(2) 유효성 [요건1.일,특,특,서]\n甲, 乙은 i)1심 임의관할(토지관할)에 대해 ii)관할법원을 乙주소지 법원으로 특정하였고 iii)소비대차 관련 법률관계로 특정하여 iv)계약서(서면)로 합의하였으므로 유효하다.\n(3) 관할합의의 모습 - 합의 모습이 불분명한 경우\n1) 학설\n①전속적합의설은 당사자들이 특정법원을 지정한 이상 언제나 전속적 합의를 한 것으로 보고 ②부가적합의설은 당사자 의사로 법정관할을 배제하는 것은 무리이므로 부가적 합의를 한 것으로 보며 ③절충설은 법정관할 중에서 특정한 경우 전속적 합의로, 그 외는 부가적 합의를 한 것으로 본다.\n2) 判例\n대여금청구 사건에서 \"이 사건 관할합의는 여러 법정관할 중 하나인 채권자 주소의 법원을 관할법원으로 약정한 것으로서 전속적 관할합의에 해당한다.\"하여 절충설 입장이다.\n3) 검토 및 사안\n당사자가 법정관할 중 법원을 합의법원으로 하였다면 다른 법정관할을 배제할 의사가 있는 것으로 봄이 당사자의 통상의 의사에 부합하는 바 절충설이 타당하다. 甲, 乙은 법정관할법원 중 하나인 乙 주소지 법원을 관할법원으로 하였는바 전속적 관할합의에 해당한다.\n4. 설문해결\n합의에 따라 관할이 변동되어 乙주소지인 B법원에 관할권이 인정되므로 A법원에는 이 소의 관할권이 없다."}, {"no": 2, "points": 10, "question": "甲이 乙을 상대로 2억 원의 대여금 반환청구의 소를 제기하였다. 제1심인 C\n지방법원 단독판사가 심리하여 甲의 청구를 인용하는 판결을 선고하였다. 乙이\n이에 불 복하여 항소를 제기하여, 사건이 C 지방법원 합의부에 계속되었다.\n乙은 항소심 계속 중 甲과 乙 사이의 프랜차이즈 계약을 할 때 甲이 수 익 이\n잘 나지 않을 것을 알면서 자금을 빌려주고 자신을 현혹시켜 계약을 하게 하여\n이로 인해 손해를 입었다고 주장하며 그로 인한 손해배상으로 5억 5천만 원\n을 청구하는 반소를 제기하였는데, 甲은 乙의 반소제기에 동의하였다. 이 경\n우 법원은 C 지방법원의 상급법원인 D 고등법원으로 사건을 이송하여야 하\n는지 여부를 설명하시오.", "answer": "1. 문제의 소재\n1심에서 단독판사 사건이었으나, 2심 도중 지방법원 합의부 관할에 속하는 반소가 제기되어도 심급관할은 제1심법원에 의해 결정되는 전속관할로 이미 정해진 관할에는 영향이 없음을 알아본다.\n2. 사물관할의 의의\n제1심 지방법원 단독판사와 합의부 사이에서 사건의 경중을 기준으로 나눈 분담관할로 ①소가가 5억원 이하일 때는 단독판사 관할이고 그 항소법원은 2억 이하의 경우 지방법원본원합의부, 2억 초과 5억 이하의 경우 고등법원이고 ②소가가 5억원 초과일 때는 지방법원 합의부 관할이고 그 항소법원은 고등법원이다.\n3. 소가 판단시기\n(1) 원칙\n소제기시 기준으로 판단하며, 소제기 후에 사정변경이 있어도 영향없다.\n(2) 예외\n제1심 단독판사 계속 중 청구취지확장 또는 반소자체(제269조2항)에 의해 소가가 5억원을 초과하는 경우, 변론관할이 생기지 않은 이상 합의부로 이송한다.\n(3) 관련 判例\n관할은 제1심 기준으로 판단하는바, 지방법원 본원합의부가 지방법원 단독판사 판결에 대한 항소사건을 제2심으로 심리하던 중 지방법원 합의부 관할에 속하는 소송으로 청구변경 혹은 반소제기되더라도, 심급관할은 제1심법원에 의해 결정되는 전속관할 이어서 이미 정해진 항소심관할에는 영향이 없다.\n4. 설문해결\n甲은 乙에게 2억원의 대여금반환청구 소를 제기하였는바 이는 단독판사 관할이고 그 항소심법원의 관할은 제1심법원에 의해 결정되는 전속관할로서 C 지방법원 합의부로 결정되므로, 법원은 D 고등법원으로 사건을 이송할 필요가 없다."}]}, {"subject": "민사소송법", "exam": "61회", "year": 2024, "problemNo": 3, "points": 30, "passage": "丙은 자기가 사망하면 자기 소유의 재산 가운데 A 토지를 甲에게 유증한다는\n내용의 유 언 을 하였다. 丙 이 사 망 한 뒤 에 丙 의 상속인인 乙이 A 토지의 상속등\n기를 경료하였다. 甲은 乙을 상대로 A 토지에 대한 소유권이전등기절차의 이행\n을 구하는 소(제1의 소)를 제기하였다. 제1심 법원은 청구를 기각하는 판결을\n하였고, 甲이 항소하였다. 이 소송이 항소심 계속 중일 때 甲은 A 토지가 지자\n체의 공공사업을 위하여 수용될지도 모른다는 소식을 들었다. 그래서 이 소송절\n차에서 甲은 乙을 상대로 A 토지가 수용될 경우에는 변론종결 당시의 시가에\n따른 금원의 지급을 구하는 소(제2의 소)를 추가하는 신청을 하였다.", "subquestions": [{"no": 1, "points": 10, "question": "제1의 소가 항소심 계속 중일 때 이 러한 제2의 소를 추가하는 것이 가능한\n이유를 설명하시오.", "answer": "1. 문제의 소재\n甲은 항소심에서 새로운 청구를 추가하였는바 청구변경의 적법요건을 검토하여 제2의 소를 추가하는 것이 가능함을 알아본다.\n2. 청구변경의 의의 및 취지(제262조)\n법원과 당사자의 동일성을 유지하면서 소송물을 변경하는 것으로 소송경제와 원고 편의를 도모하기 위함이다.\n3. 청구변경 해당 여부 및 청구변경 형태 [배,형,일,적,항]\n이는 청구취지의 변경으로서 청구변경이고 추가적 변경이다.\n4. 청구변경 적법요건 [기,절,사,동,경]\n(1)\ni)절차 지연사정이 없고 ii)사실심인 항소심에서 하였으며 iii)동종절차, 공통관할에 해당하나 iv)청구기초 동일성이 인정되는지 문제된다.\n(2) 청구기초 동일성의 의미\n1) 학설\n①이익설은 사실적 이익분쟁이 공통되는 경우 ②사실자료동일설은 양 청구간 사실자료에 공통성이 있는 경우 ③병용설은 사실자료와 이익관계 모두 공통되는 경우 청구기초의 동일성이 있다고 본다.\n2) 判例\n청구 기초의 변경이 없는 경우를 \"동일한 생활사실 또는 경제적 이익에 관한 분쟁에 있어서 그 해결 방법에 차이가 있을 뿐인 경우\"로 보아 이익설에 가깝다.\n3) 검토\n양 청구간 사실자료의 공통성이 있는 경우 소 변경을 통해 구 자료를 이용하는 것이 소송경제에 부합되는바 사실자료동일설이 타당하다. 다만 어느 설에 의하든 구체적 적용결과에는 큰 차이가 없다.\n4) 사안\n제1의 소와 제2의 소는 주청구와 대상청구 관계로 한쪽이 다른 쪽의 변형물, 부속물인 경우에 해당하여 청구기초동일성이 인정된다.\n5. 설문해결\n청구변경의 적법요건을 갖췄으므로 항소심에서 제2의 소를 추가하는 것이 가능하다."}, {"no": 2, "points": 10, "question": "항소심에서 변론을 종결할 때까지 A 토지의 수용 여부는 확정되지 못할 것\n으로 예상된다. 그럼에도 불구하고 이러한 제2의 소를 제기할 수 있는 이유\n를 설명하시오.\n개의 청구를 전부 인용하는 판결을 하였다. 乙은 이", "answer": "1. 문제의 소재\nA토지가 수용될 것이라는 조건을 붙였으나 이는 변론종결시까지 미성취될 것으로 예상되므로 이는 장래이행의 소이다. 이와 관련하여 그 적법요건인 청구적격과 미리 청구할 필요에 대해 알아본다.\n2. 장래이행의 소의 의의 및 취지(제251조)\n변론종결시 기준, 이행기가 장래에 도달하는 청구에 있어서 채무자의 임의이행 거부를 대비하여 구하는 소를 말한다. 이행기 도래 전에 확정판결을 얻어두었다가 이행기 도래 즉시 강제집행하기 위함이다.\n3. 요건\n청구권 발생의 기초가 되는 청구적격과 남소를 방지하기 위한 미리 청구할 필요가 있어야 한다.\n4. 청구적격\n(1)\ni)청구권 발생의 기초가 되는 사실상, 법률상 관계가 변론종결시 기준 존재하고 ii)장래이행기까지 의무불이행 상태가 계속될 것을 확실히 예상할 수 있어야 한다.(일판은)\n(2)\n조건부청구는 조건성취의 개연성이 희박하지 않는 한 청구적격이 인정된다.\n5. 미리 청구할 필요\n이행기 도래시 채무자의 임의이행을 기대할 수 없는 경우로서 이행의무의 성질과 이행의무자의 태도를 고려하여 판단한다.(일판은)\n6. 사안\n제2의 소는 토지가 수용될 것이라는 조건성취의 개연성이 충분하므로 청구적격이 인정되고, 乙이 주된 청구인 토지 소유권이전등기청구의 임의이행을 거부하므로 대상청구의 임의이행도 거부할 것으로 볼 수 있어 미리 청구할 필요도 인정된다.\n7. 설문해결\n따라서, 장래이행의 소의 적법요건을 갖췄으므로 제2의 소를 제기할 수 있다."}, {"no": 3, "points": 10, "question": "항소법원은 심리 후 두 개의 청구를 전부 인용하는 판결을 하였다. 乙은 이 가운데 제2의 소에 대한 판결에만 상고하였다. 이러한 경우 甲은 '제1의 소에 대한 판결에는 상고하지 않았으므로 이 판결은 확정되었다'는 이유로 A토지에 대한 소유권이전등기절차를 실행할 수 있는지 검토하시오.", "answer": "1. 문제의 소재\n甲의 소는 두 청구 모두 인용된 것을 보아 집행불능 대비 대상청구이고 이는 단순병합인 바, 단순병합에서 전부판결에 대해 일부불복시 전부 이심됨에 비추어 A토지에 대한 소유권이전등기절차를 실행할 수 없음을 알아본다.\n2. 집행불능 대비 대상청구의 병합형태\n(1) 학설\n①본래 청구가 기각될 것을 조건으로 한 청구가 아니므로 단순병합으로 보는 견해 ②순서를 붙여 청구하였는바 부진정예비적병합이라는 견해가 있다.\n(2) 判例\n본래 급부청구에 이를 대신할 전보배상을 부가하여 대상청구를 병합하여 소구한 경우 대상청구는 본래 급부청구권이 현존함을 전제로 이것이 판결확정 전 이행불능되거나 판결확정 후 집행불능이 될 경우에 대비해 전보배상을 미리 청구하는 경우로 양자의 병합은 현재 급부청구와 장래 급부청구의 단순병합이다.\n(3) 검토 및 사안\n청구가 모두 인용될 수 있다는 점에서 단순병합으로 설명하면 족하므로 단순병합으로 볼 것이다. 사안에서 甲의 소는 집행불능을 대비한 대상청구를 병합한 것으로 단순병합이다.\n3. 단순병합에서 일부상소시 이심범위 (반대견해 극소수입->배점조절 可)\n(1) 학설 및 判例\n①1개 판결이어도 수개 판결이 있다 볼 수 있으므로 그 일부만 이심된다는 일부이심설이 있으나 ②判例는 재산상 손해에 대해 형식상 전부 승소하였으나 위자료에 대해 일부 패소하여, 그 부분에 대해서만 항소한 경우 사건전부가 차단되고 소송물 전부가 항소심에 계속된다 하여 전부이심설 입장이다.\n(2) 사안\n乙이 제2의 소에 대해서만 불복해도 제1의 소도 함께 이심된다. 다만, 불이익변경금지원칙(제415조)에 의해 불복한 제2의 소만 심판대상이 된다.\n4. 전부판결 일부불복시 판결확정시기\n(1) 학설 및 判例\n①부대항소가 더 이상 허용될 수 없는 시점인 상고이유서제출기간 만료시 확정된다고 보는 견해가 있으나 ②判例는 항소되지 않은 부분도 이심은 되나 피고가 변론종결시까지 항소취지를 확장하지 않는 한 나머지 부분에 관하여는 심판대상이 되지 않고 항소심판결선고와 동시에 확정된다 하여 상소심판결선고시설 입장이다.\n(2) 사안\n甲의 제1의 소는 제2의 소의 상고심판결선고시에 확정된다.\n5. 설문해결\n따라서, 甲은 A토지 소유권이전등기절차를 실행할 수 없다."}]}, {"subject": "민사소송법", "exam": "61회", "year": 2024, "problemNo": 4, "points": 20, "passage": "乙은 丙 에게 금 5천만 원을 대여하였고, 이를 위한 담 보로 甲 소유의 A 토지\n에 대하여 저 당권설정등기를 하였다. 그 당시 丙 은 甲이 자기에게 A 토지에\n대하여 저 당권을 설정할 수 있는 대리권을 수여하였다고 乙에게 진 술 하였다.\n丙 이 5천만 원의 대여금을 반환하지 않자 乙은 A 토지에 대한 저 당권을 실행\n하려고 하였다. 甲은 丙 에게 이 러 한 저 당권 설정을 위한 대리권을 수여한 적이\n없다고 하면서 乙을 상대로 저 당권설정등기의 말소를 구하는 소를 제기하였다.", "subquestions": [{"no": 1, "points": 10, "question": "이 소송에서 甲은 “자기는 丙에게 A 토지에 대하여 저당권을 설정할 수 있\n는 대리권을 수여한 적이 없다.”고 주장하였고, 乙은 “그 당시 甲이 이를 위\n한 대리권을 丙에게 수여하였다.”고 주장하였다. 법원은 甲이 丙에게 대리권\n을 수여한 적이 없다고 판단하였다. 그런데 乙은 변론에서 ‘ 甲이 이 러 한 저\n당권설정행위를 추 인하였다 ’ 는 사실을 주장한 적이 없다. 법원은 증인신문을\n통하여 甲이 丙 의 저 당권설정행위를 추 인하였다는 사실을 알게 되었다. 이\n러한 경우에 법원은 ‘甲이 丙에게 A 토지에 대하여 저당권을 설정할 수 있\n는 대리권을 수여한 사실은 없고, 丙 이 대리권 없이 한 저 당권설정행위를 나\n중에 추 인하였다 ’ 고 판결을 할 수 있는지 검토하시오.", "answer": "1. 문제의 소재\n甲의 추인사실에 대한 증거는 있었으나, 주장은 없었는바 이와 관련하여 간접적 주장이 인정되는지 알아본다.\n2. 변론주의\n(1) 의의, 취지 및 내용\n사실과 증거의 수집·제출책임을 당사자에게 맡기고 법원은 이에 근거하여 판단하는 원칙으로 사적자치의 소송법상 반영이다. 사실의 주장책임, 자백의 구속력과 증거제출책임을 내용으로 한다.\n(2) 적용범위 [요,구,배]\n주요사실에 대해서만 적용되고 통설·判例인 법규기준설에 따라 법률효과를 발생시키는 실체법상 구성요건 해당사실을 주요사실로 본다.\n(3) 사안\n대리행위로 저당권설정등기계약을 한 경우 甲의 추인사실은 무권대리 주장에 대한 항변사실로 주요사실이다.\n3. 甲의 추인사실 인정 여부\n(1) 甲의 추인사실 주장 유무\n1) 사실의 주장책임\n자신에게 유리한 사실을 주장하지 않으면 그 사실은 없는 것으로 취급되어 받는 불이익을 말한다. 법원은 주장과 달리 판단할 수 없으며, 주장되지 않은 사실을 판결의 기초로 삼을 수 없다.\n2) 소송자료와 증거자료의 구별 및 완화\n변론주의에 따라 사실자료와 증거자료는 구별되므로 법원이 증거에 의해 주요사실을 알아도 당사자가 주장하지 않는 한 이를 기초로 판단할 수 없으나, 그 완화방안으로 간접적 주장이 문제된다.\n3) 간접적 주장 인정여부\n①부정설은 변론주의 원칙과 충돌하는 것으로 인정할 수 없으며 석명권을 행사해야 한다고 보나, ②判例는 당사자의 주요사실에 대한 주장은 직접적으로 명백한 경우뿐만 아니라 당사자의 변론을 전체적으로 관찰하여 간접적으로 주장한 것으로 볼 수 있는 경우에도 주요사실의 주장이 있는 것으로 보아야 한다 하여 긍정설 입장이다.\n4) 간접적 주장 인정요건\n다만, 변론주의와의 충돌을 막기 위해 i)당사자 행위에 비추어 주요사실 주장이 예상되고 ii)상대방의 방어권 침해가 없어야 한다.\n5) 사안\n乙이 丙의 유권대리사실만을 주장하고 있는 바 이러한 乙행위에 비추어, 丙이 무권대리이나 甲이 추인한 사실을 주장한 것으로 예상하기 어렵다. 따라서 간접적 주장이 인정되지 않는다.\n(2) 甲의 추인사실 증거 유무\n甲의 추인사실에 대한 증거는 증인신문에 의해 입증되었다. 다만 동 사실에 대한 주장이 없는 바 이를 인정할 수 없다.\n4. 설문해결\n따라서 법원은 甲이 丙의 무권대리행위를 나중에 추인했다는 판결을 할 수 없다."}, {"no": 2, "points": 10, "question": "제1회 변론기일에 甲은 “자기는 丙에게 A 토지에 대하여 저당권을 설정할\n수 있는 대리권을 수여한 사실이 없다.”고 주장하였고, 乙은 “甲이 丙 에게\n이 러 한 대리권을 수여한 적은 없지만, 며 칠 뒤 에 丙 의 저 당권설정행위를 추\n인하였다.”고 진 술 하였다. 제2회 변론기일에 乙은 이 러 한 진 술 을 철 회하고,\n“甲이 丙 에게 이를 위한 대리권을 수여하였다.”고 주장하였다. 이와 같이 乙\n은 ‘ 甲이 丙 에게 A 토지에 대하여 저 당권을 설정할 수 있는 대리권을 수여\n한 적이 없다 ’ 고 한 진 술 을 철 회할 수 있는지 검토하시오.", "answer": "1. 문제의 소재 - 재판상 자백의 의의(제288조)\n재판상 자백은 당사자가 변론 또는 변론준비기일에서 상대방 주장과 일치하고 자기에게 불리한 주요사실을 인정하는 진술을 말한다. 乙은 자신에게 불리한 사실인 丙의 무권대리사실을 진술하였는 바 재판상 자백이 성립하는지 문제된다.\n2. 재판상 자백의 요건 [변,일,불,주,사]\n(1)\ni)변론 또는 변론준비기일에서 ii)상대방 주장과 일치되는 iii)자신에게 불리한 iv)주요사실에 대한 v)구체적 사실의 진술이어야 한다.\n(2) 사안\n乙이 甲의 저당권설정등기말소청구에서 丙의 무권대리를 진술한 것은 변론기일에서 甲의 주장과 일치되는 자신에게 불리한 주요사실에 대해 진술한 것으로 재판상 자백이 성립된다.\n3. 재판상자백의 효과\n(1) 원칙(3가지 측면에서 검토)\ni)자백의 상대방은 증명책임이 면제되고(제288조 본문) ii)당사자 구속력으로 임의 철회가 제한되며(제288조 단서) iii)법원에 대한 구속력으로 법원은 자백사실을 그대로 인정해야 한다.\n(2) 예외 - 자백 철회가부 [동,형,진,대] or [오,동,착,경]\ni)상대방의 동의가 있을 때 ii)형사상 처벌받을 행위로 이루어진 경우(제451조1항5호 유추) iii)자백이 진실에 반하고 착오로 인한 것 일 때(제288조 단서) iv)대리인 자백에 대해 당사자가 경정할 때(제94조)에는 예외적으로 철회 가능하다.\n4. 설문해결\n다만, 乙에게 위 철회사유가 보이지 않으므로 乙은 2회 변론기일에서 丙의 무권대리사실에 관한 진술을 철회할 수 없다."}]}, {"subject": "민사소송법", "exam": "62회", "year": 2025, "problemNo": 1, "points": 30, "passage": "甲은 A로부터 X 토지(이하 ‘이 사건 대지’라 한다)에 대한 소유권을 취득하였는\n데, 그 이전부터 乙이 위 지상에 Y 건물을 소유하고 있었다. 그 후 甲과 乙 사\n이에는 위 건물의 소유를 목적으로 이 사건 대지에 대하여 임대차계약을 체결하\n였다.", "subquestions": [{"no": 1, "points": 10, "question": "이 사건 대지의 임대차 기간이 종료하여 乙이 계약의 갱신을 청구하였으나,\n甲은 계약의 갱신을 원하지 않는다. 甲이 임대차 기간 종료를 원인으로 위\n건물의 철거 및 이 사건 대지의 인도를 구하는 소를 제기하였다. 이에 대하\n여 乙이 이 사건 변론에서 甲에게 상당한 가액으로 위 건물을 매수할 것을\n청구하였다. 법원은 甲과 乙 사이에는 위 건물에 대하여 시가 상당액을 대금\n으로 하는 매매가 이루어졌다고 판단하였다. 이 경우에 법원은 甲의 청구에\n대하여 어떠한 판결을 하여야 하는지를 검토하시오.", "answer": "1. 문제의 소재\n처분권주의 측면에서 원고의 건물철거청구에 대해 상환이행판결 가능한지, 소송물이 달라 판결할 수 없다면 소 변경하도록 적극적 석명권을 행사해야 하는지 알아본다.\n2. 건물철거청구에 대금지급 상환 건물인도청구가 포함되는지 여부\n(1) 문제점 - 처분권주의의 의의(제203조)\n절차의 개시, 심판대상, 절차종결에 대해 당사자에게 주도권을 주어 그 처분을 맡기는 것으로 사적자치의 소송법적인 측면이다.\n(2) 학설\n① 긍정설은 분쟁의 일회적 해결을 도모하고 상환이행판결함이 당사자들의 의사에 부합하므로 포함된다 보고 ② 부정설은 청구취지와 청구원인, 강제집행방법이 상이한 바 당사자의 소변경 없이는 불가능하다고 본다.\n(3) 판례\n건물철거와 그 토지인도청구에는 건물매수대금 지급과 동시에 건물명도를 구하는 청구가 포함되어 있다고 볼 수 없다 하여 부정설 입장이다.\n(4) 검토\n양 청구의 청구취지와 청구원인이 상이하여 소송물이 다르고, 소송경제는 석명권 행사로 해결할 수 있으므로 부정설이 타당하다.\n3. 상환이행청구로의 청구변경 석명의무 여부\n(1) 문제점 - 청구변경 가부\n임대차기간 만료라는 사실자료가 공통되며 같은 생활사실에 관해 분쟁해결방법만 달리하여 청구기초의 동일성이 인정되므로, 청구변경은 가능하나 이에 대해 법원의 석명의무가 있는지 문제된다.\n(2) 학설 및 판례\n긍정설, 부정설, 절충설이 있고, 판례는 ① 당사자가 주장하지 않은 법률효과에 관한 요건사실이나 공격방어방법제출 권유는 변론주의에 위배되는 것으로 석명권 한계를 일탈한 것인바 허용되지 않는다 하여 원칙적으로는 부정하나, ② 건물매수청구권 Case에서는 당사자 의사와 논리상 예기되는 범위인지를 고려하여 법원으로서는 종전 건물철거청구를 유지할지 아니면 대금지급과 상환으로 건물인도를 청구할 의사가 있는지에 관해 석명해야 한다 하여 제한적으로 인정한다.\n(3) 사안\nⅰ) 임대차기간 만료라는 사실이 공통되어 소변경시 종전 소송자료를 이용할 수 있어 합리적 관련성이 있으며, ⅱ) 피고가 건물매수청구권 행사를 하였으므로 방어권 행사에 문제가 없는 점 등에 비추어 적극적 석명이 필요하다.\n4. 설문해결\n법원의 석명에 따라 甲이 청구의 변경을 하면 상환이행판결하나, 청구의 변경을 하지 않은 경우 청구기각판결한다.", "categories": {"toc": "1. 문제의 소재\n2. 건물철거청구에 대금지급 상환 건물인도청구가 포함되는지 여부\n3. 상환이행청구로의 청구변경 석명의무 여부\n4. 설문해결", "purpose": "(처분권주의) 절차의 개시, 심판대상, 절차종결에 대해 당사자에게 주도권을 주어 그 처분을 맡기는 것으로 사적자치의 소송법적인 측면이다.", "article": "제203조", "elements": "", "theory": "(상환이행) ① 긍정설은 분쟁의 일회적 해결을 도모하고 상환이행판결함이 당사자들의 의사에 부합하므로 포함된다 보고 ② 부정설은 청구취지와 청구원인, 강제집행방법이 상이한 바 당사자의 소변경 없이는 불가능하다고 본다.\n(석명의무) 긍정설, 부정설, 절충설이 있다.", "cases": "(상환이행) 건물철거와 그 토지인도청구에는 건물매수대금 지급과 동시에 건물명도를 구하는 청구가 포함되어 있다고 볼 수 없다 하여 부정설 입장이다.\n(석명의무) ① 당사자가 주장하지 않은 법률효과에 관한 요건사실이나 공격방어방법제출 권유는 변론주의에 위배되는 것으로 석명권 한계를 일탈한 것인바 허용되지 않는다 하여 원칙적으로는 부정하나, ② 건물매수청구권 Case에서는 당사자 의사와 논리상 예기되는 범위인지를 고려하여 법원으로서는 종전 건물철거청구를 유지할지 아니면 대금지급과 상환으로 건물인도를 청구할 의사가 있는지에 관해 석명해야 한다 하여 제한적으로 인정한다.", "resolution": "법원의 석명에 따라 甲이 청구의 변경을 하면 상환이행판결하나, 청구의 변경을 하지 않은 경우 청구기각판결한다."}}, {"no": 2, "points": 10, "question": "甲은 乙을 상대로 Y 건물의 철거청구 소송을 진행하던 중 乙로부터 이 건물\n의 소유권을 이전받은 丙을 인수승계 신청하면서 丙에 대하여는 소유권이전\n등기를 말소하라는 소를 제기하였다. 이 경우에 법원은 甲의 인수승계 신청\n에 대하여 어떠한 결정을 하여야 하는지를 검토하시오.", "answer": "1. 문제의 소재\n丙은 소송계속 중 계쟁물 승계인으로 인수승계의 요건은 만족하나, 인수승계의 절차와 관련하여 추가적 인수는 불가하여 법원은 각하 결정을 내릴 것임을 알아본다.\n2. 인수승계의 의의 및 취지(제82조)\n소송계속 중 소송목적인 권리의무 승계가 있는 경우 종전당사자 신청에 의해 승계인을 새로운 당사자로 끌어들이는 것으로서 소송경제를 도모하기 위함이다.\n3. 요건\n(1) ⅰ) 타인 간 소송 계속 중 ⅱ) 제3자에게 소송의 목적인 권리,의무의 승계가 있어야 한다.\n(2) 사안\nⅰ) 甲,乙간의 소송 계속 중 ⅱ) 丙은 계쟁물인 건물을 승계하였고, 甲,乙간의 건물철거 소송은 물권적 청구권에 기한 것이므로 구이론(判例)에 따라 丙은 승계인에 해당한다. 다만, 丙에 대해서는 등기말소를 구했는 바, 추가적 인수 가부가 문제된다.\n4. 절차 - 추가적 인수 허용여부\n(1) 문제점\n인수승계의 절차에는, ⅰ) 소송 목적인 채무 자체를 승계하는 교환적 인수와 ⅱ) 소송 목적인 채무 승계가 아니라, 그 채무를 전제로 새로운 채무가 생기는 추가적 인수가 있다.\n(2) 학설\n① 긍정설은 이는 분쟁주체 지위의 이전으로서 소송경제상 가능하다고 보나 ② 부정설은 소송목적인 권리 또는 의무를 승계한 때라고 규정한 제82조에 반하므로 부정한다.\n(3) 판례\n① 당사자가 제3자로 하여금 소송인수를 하기 위해서는 제3자에 대해 인수한 소송의 목적이 된 채무이행을 구하는 경우만 허용되고 별개 채무의 이행을 구함은 허용될 수 없다고 하나 ② 공유물분할 소송에서 지분 일부양수인을 추가하는 경우는 허용했다.\n(4) 검토\n추가적 인수를 부정한 듯한 판례는 존재하나, 이는 소송목적인 권리·의무를 승계했다고 볼 수 없다는 이유로 부정한 것인바, 소송목적의 권리·의무를 승계했다고 볼 수 있다면 허용함이 타당하다.\n(5) 사안\n乙이 건물철거의무를 진다고 하여, 丙이 등기말소의무를 부담하는 것이 아니므로, 丙은 소송목적의 의무를 승계했다고 볼 수 없다. 따라서, 추가적 인수는 불허된다.\n5. 설문해결\n주장 자체로 인수승계 신청이 부적법한 경우이므로, 법원은 각하결정을 해야 한다.", "categories": {"toc": "1. 문제의 소재\n2. 인수승계의 의의 및 취지\n3. 요건\n4. 절차 - 추가적 인수 허용여부\n5. 설문해결", "purpose": "(인수승계) 소송계속 중 소송목적인 권리의무 승계가 있는 경우 종전당사자 신청에 의해 승계인을 새로운 당사자로 끌어들이는 것으로서 소송경제를 도모하기 위함이다.", "article": "제82조", "elements": "ⅰ) 타인 간 소송 계속 중 ⅱ) 제3자에게 소송의 목적인 권리,의무의 승계가 있어야 한다.", "theory": "① 긍정설은 이는 분쟁주체 지위의 이전으로서 소송경제상 가능하다고 보나 ② 부정설은 소송목적인 권리 또는 의무를 승계한 때라고 규정한 제82조에 반하므로 부정한다.", "cases": "① 당사자가 제3자로 하여금 소송인수를 하기 위해서는 제3자에 대해 인수한 소송의 목적이 된 채무이행을 구하는 경우만 허용되고 별개 채무의 이행을 구함은 허용될 수 없다고 하나 ② 공유물분할 소송에서 지분 일부양수인을 추가하는 경우는 허용했다.", "resolution": "주장 자체로 인수승계 신청이 부적법한 경우이므로, 법원은 각하결정을 해야 한다."}}, {"no": 3, "points": 10, "question": "甲이 乙을 상대로 이 사건 대지의 인도를 구하는 소(이하 ‘전소’라 한다)를\n제기하여 승소판결을 받아 위 판결이 확정되었다. 그 후 甲이 乙을 상대로\nY 건물에 관한 철거청구의 소(이하 ‘후소’라 한다)를 제기하였는데, 후소에\n서 乙이 전소의 변론종결일 전부터 존재하던 건물소유 목적의 이 사건 대지\n임차권에 기하여 건물매수청구권을 행사하였다. 이에 대하여 甲은 전소의\n기판력에 저촉된다고 주장하였다. 이 경우에 법원은 어떠한 판단을 하여야\n하는지를 검토하시오.", "answer": "1. 문제의 소재\n기판력 시적범위에 있어, 전소 변론종결 전에 발생한 형성권을 전소에서 행사하지 않고 후소에서 행사하면 차단되는지 문제된다.\n2. 기판력의 의의 및 취지\n확정판결이 후소에 미치는 구속력으로 판결의 모순·저촉을 방지하여 법적안정성을 도모하기 위함이다.\n3. 기판력의 시적범위 및 차단효\n기판력은 사실심 변론종결시(표준시) 기준으로 발생하고 그 전에는 발생하지 않는다. 따라서 변론종결 전 존재했으나 그때까지 제출하지 않은 공격방어방법 제출은 허용되지 않는다(실권효).\n4. 전소 변론종결 전에 발생한 형성권 실권 여부\n(1) 학설\n① 비실권설은 형성권의 실제 행사시점을 기준으로 보아 형성권 행사를 소송법으로 단축할 수 없는바 모든 형성권이 실권되지 않는다 보고 ② 실권설은 법적안정성을 위해 형성원인이 존재하는 때를 기준으로 보아 차단된다고 보고 ③ 제한적 건물매수청구권실권설은 절차의 촉진 및 신의칙을 근거로 당사자가 건물매수청구권의 존재를 알고 있음에도 행사하지 않은 경우 실권된다 보고 ④ 건물매수청구권비실권설은 다른 형성권은 실권되나, 건물매수청구권은 정책적으로 인정된 것인바 실권되지 않는다고 본다.\n(2) 판례\n1) 원칙\n표준시 전에 취소권과 해제권, 백지보충권을 행사할 수 있었는데 방치하고 있다가 표준시 후에 행사하는 것은 기판력에 의해 차단된다고 한다.\n2) 예외 - 건물매수청구권\n확정판결에 의한 건물철거가 집행되지 않은 이상 임차인은 건물매수청구권을 행사할 수 있다. 건물철거소송과 대금청구소송은 서로 소송물을 달리하므로 기판력에 의해 건물매수청구권의 행사가 차단된다고 할 수 없다.\n(3) 검토\n비실권설은 법적 안정성에 반하고, 실권설은 형성권 행사를 강제하는 문제가, 제한적 실권설은 주관적 사정에 따라 실권여부가 달라지는 문제가 있다. 건물매수청구권은 소구채권 하자의 주장이 아니므로 건물매수청구권비실권설이 타당하다.\n(4) 사안 - 설문해결\n乙의 건물매수청구권은 실권되지 않으므로, 법원은 적극적 석명권 행사하여 건물대금과 상환으로 건물을 인도하라는 상환이행판결을 해야 한다.", "categories": {"toc": "1. 문제의 소재\n2. 기판력의 의의 및 취지\n3. 기판력의 시적범위 및 차단효\n4. 전소 변론종결 전에 발생한 형성권 실권 여부\n5. (사안 - 설문해결)", "purpose": "(기판력) 확정판결이 후소에 미치는 구속력으로 판결의 모순·저촉을 방지하여 법적안정성을 도모하기 위함이다.", "article": "", "elements": "(기판력 시적범위) 기판력은 사실심 변론종결시(표준시) 기준으로 발생하고 그 전에는 발생하지 않는다. 따라서 변론종결 전 존재했으나 그때까지 제출하지 않은 공격방어방법 제출은 허용되지 않는다(실권효).", "theory": "① 비실권설은 형성권의 실제 행사시점을 기준으로 보아 형성권 행사를 소송법으로 단축할 수 없는바 모든 형성권이 실권되지 않는다 보고 ② 실권설은 법적안정성을 위해 형성원인이 존재하는 때를 기준으로 보아 차단된다고 보고 ③ 제한적 건물매수청구권실권설은 절차의 촉진 및 신의칙을 근거로 당사자가 건물매수청구권의 존재를 알고 있음에도 행사하지 않은 경우 실권된다 보고 ④ 건물매수청구권비실권설은 다른 형성권은 실권되나, 건물매수청구권은 정책적으로 인정된 것인바 실권되지 않는다고 본다.", "cases": "1) 원칙: 표준시 전에 취소권과 해제권, 백지보충권을 행사할 수 있었는데 방치하고 있다가 표준시 후에 행사하는 것은 기판력에 의해 차단된다.\n2) 예외 - 건물매수청구권: 확정판결에 의한 건물철거가 집행되지 않은 이상 임차인은 건물매수청구권을 행사할 수 있다. 건물철거소송과 대금청구소송은 서로 소송물을 달리하므로 기판력에 의해 건물매수청구권의 행사가 차단된다고 할 수 없다.", "resolution": "乙의 건물매수청구권은 실권되지 않으므로, 법원은 적극적 석명권 행사하여 건물대금과 상환으로 건물을 인도하라는 상환이행판결을 해야 한다."}}]}, {"subject": "민사소송법", "exam": "62회", "year": 2025, "problemNo": 2, "points": 20, "passage": "甲과 A는 X 부동산(이하 ‘이 사건 부동산’이라 한다)의 공유자로서 공동으로 乙\n을 상대로 이 사건 부동산의 인도를 구하는 소를 제기하여 제1심에서 승소판결\n을 받았다. 乙의 항소로 이 사건이 항소심에 계속중인 2023. 10. 23. A가 사망하\n였다. A의 상속인으로는 甲과 丙, 丁이 있다.", "subquestions": [{"no": 1, "points": 10, "question": "A에게는 소송대리인은 없으며, 2024. 1. 30. 甲만 수계신청하여 본안에 관한\n심리가 진행된 끝에 항소심법원은 甲만을 A의 소송수계인으로 하여 판결을\n선고하였다. 甲의 이 사건 수계신청이 적법한지와 丙과 丁에 대한 관계에서\n그 소송은 어떻게 되는지를 검토하시오.", "answer": "1. 문제의 소재\n공동상속인들의 관계는 통상공동소송이므로 甲은 개별적으로 수계가 가능하고, 丙·丁에 대해서는 절차가 중단됨을 알아본다.\n2. 당사자지위의 당연승계 여부\n(1) 학설\n① 당연승계긍정설은 사망이라는 포괄승계 원인의 발생으로 법률상 지위가 당연히 승계인에게 승계된다 보고 ② 당연승계부정설은 이는 형식적당사자 개념과 맞지 않으므로 수계절차를 거쳐야 당사자가 변경된다고 본다.\n(2) 판례\n소송계속 중 당사자가 사망함으로 인해 당사자로서 자격을 상실하게 된 때에는 대립당사자구조가 없어진 것은 아니고 그때부터 그의 지위를 당연히 이어받게 되는 상속인들과의 관계에서 이당사자대립구조를 형성한다 하여 긍정설 입장이다.\n(3) 검토\n제238조는 당연승계를 전제로 소송대리인을 승계인의 대리인으로 보고 있으며, 법원의 속행명령에 따라 절차 중단이 해소될 수 있는 점(제244조)을 고려할 때 긍정설이 타당하다.\n(4) 사안\n따라서 A의 사망으로 인해 그 지위가 甲, 丙, 丁에게 당연승계된다.\n3. 소송절차 중단여부\nⅰ) 소송계속 중 당사자 A가 사망하고 ⅱ) 소송물은 부동산인도청구로 상속 가능하고 ⅲ) 상속인 甲, 丙, 丁이 있고 ⅳ) 소송대리인이 없으므로 절차는 중단된다.\n4. 중단의 해소 - 수계신청 가부\n(1) 상속인들의 공동소송수행형태\n통설·판례는 상속인들은 상속재산에 관해 각자 지분권을 가지고 있음을 근거로 공유관계로 보아, 통상공동소송에 해당한다.\n(2) 통상공동소송의 심판방법(제66조)\n공동소송인 가운데 한 사람의 소송행위 또는 이에 대한 상대방의 소송행위와 공동소송인 가운데 한 사람에 관한 사항은 다른 공동소송인에게 영향을 미치지 아니한다.\n(3) 사안\n甲은 다른 상속인 丙, 丁과 관계없이 단독으로 수계 가능하다.\n5. 丙, 丁의 소송 중단 여부\n판례는 일부만 수계신청을 한 경우 수계절차를 밟지 않은 다른 상속인의 소송관계는 중단된 채 피상속인 사망 당시의 심급법원에 계속되어 있다고 한다. 따라서, 丙, 丁에 대한 소송은 항소심에서 중단되어 있다.\n6. 설문해결\n따라서 甲의 수계신청은 적법하고 丙, 丁에 대한 소송은 중단된 채 항소심법원에 계속되어 있다.", "categories": {"toc": "1. 문제의 소재\n2. 당사자지위의 당연승계 여부\n3. 소송절차 중단여부\n4. 중단의 해소 - 수계신청 가부\n5. 丙, 丁의 소송 중단 여부\n6. 설문해결", "purpose": "", "article": "제238조, 제244조, 제66조", "elements": "(중단 요건) ⅰ) 소송계속 중 당사자 A가 사망하고 ⅱ) 소송물은 부동산인도청구로 상속 가능하고 ⅲ) 상속인 甲, 丙, 丁이 있고 ⅳ) 소송대리인이 없으므로 절차는 중단된다.", "theory": "① 당연승계긍정설은 사망이라는 포괄승계 원인의 발생으로 법률상 지위가 당연히 승계인에게 승계된다 보고 ② 당연승계부정설은 이는 형식적당사자 개념과 맞지 않으므로 수계절차를 거쳐야 당사자가 변경된다고 본다.", "cases": "(당연승계) 소송계속 중 당사자가 사망함으로 인해 당사자로서 자격을 상실하게 된 때에는 대립당사자구조가 없어진 것은 아니고 그때부터 그의 지위를 당연히 이어받게 되는 상속인들과의 관계에서 이당사자대립구조를 형성한다 하여 긍정설 입장이다.\n(공동상속인 통상공동소송) 통설·판례는 상속인들은 상속재산에 관해 각자 지분권을 가지고 있음을 근거로 공유관계로 보아, 통상공동소송에 해당한다.\n(일부 수계) 일부만 수계신청을 한 경우 수계절차를 밟지 않은 다른 상속인의 소송관계는 중단된 채 피상속인 사망 당시의 심급법원에 계속되어 있다.", "resolution": "따라서 甲의 수계신청은 적법하고 丙, 丁에 대한 소송은 중단된 채 항소심법원에 계속되어 있다."}}, {"no": 2, "points": 10, "question": "甲과 丙, 丁이 그 소송을 수계하였는데, 甲은 2024. 3. 30. 자기 소유인 이\n사건 부동산의 1/2공유지분을 丁에게 양도하고 같은 해 5. 12. 丁 명의로 지\n분소유권이전등기를 마친 다음 2025. 1. 25. 소를 취하하였다. 丁은 이 사건\n2025. 4. 20.자 소변경 신청서를 통하여 甲으로부터 양도받은 1/2공유지분에\n기한 이 사건 부동산의 인도청구를 추가하고 청구취지를 변경하기에 이르렀\n다. 항소심법원은 공유지분의 양도인 甲이 소를 취하하였으므로 재소금지의\n효과가 공유지분 양수인 丁에게도 미친다고 판단하였다. 이와 같은 법원의\n판단에 잘못이 없는지를 검토하시오.", "answer": "1. 문제의 소재\n재소금지 요건과 관련하여, 丁은 甲으로부터 공유지분을 양수받은 특정승계인으로 당사자 요건은 만족하나, 새로운 권리보호이익이 인정되므로 丁에게 재소금지 효과는 미치지 않음을 알아본다.\n2. 재소금지의 의의 및 취지(제267조 2항)\n본안 종국판결 후 소취하한 경우 동일한 소를 제기할 수 없는 것으로 종국판결의 농락 및 소취하 남용 방지 위함이다.\n3. 요건\nⅰ) 甲의 1심 승소판결(본안) 후 항소심에서 소취하되었고 ⅱ) 소송물도 부동산인도청구로 동일하나 ⅲ) 甲의 재소금지 효과가 특정승계인인 丁에게 미치는지(당사자) ⅳ) 권리보호이익이 동일한지 문제된다.\n4. 변론종결 뒤 승계인과 재소금지\n(1) 문제점\n전소 원고의 변론종결 뒤 일반승계인은 재소금지 효과를 받으나 변론종결 뒤 특정승계인도 효과가 미치는지 문제된다.\n(2) 학설\n① 포함설은 이러한 경우도 종국판결을 농락할 우려가 있는 점은 동일하므로 효력이 미친다고 보며 ② 비포함설은 전소 취하를 알면서 받아들였다는 등 특단의 사정이 없는 한 미치지 효력이 미치지 않는다고 본다.\n(3) 판례\n소유권을 양수한 특정승계인이 다시 건물철거를 구한 경우 소 취하한 자에는 변론종결 후 특정승계인을 포함한다고 보아 포함설 입장이나, 새로운 권리보호이익이 생겼다 하여 재소를 허용했다.\n(4) 검토\n재소금지의 취지가 종국판결 농락 방지에 있다면, 일반승계인 뿐만 아니라 특정승계인에게도 효력이 미치는 포함설이 타당하다. 포함설에 의하더라도 새로운 권리보호이익 있으면 재소 가능한 바 특정승계인을 보호할 수 있다.\n(5) 사안 - 설문해결\n丁은 甲으로부터 공유지분을 양수받아 자신의 공유지분에 기해 부동산인도청구를 구한 자로서, 새로운 권리보호이익이 인정되므로 재소금지의 효과가 미친다고 본 법원의 판단은 부당하다.", "categories": {"toc": "1. 문제의 소재\n2. 재소금지의 의의 및 취지\n3. 요건\n4. 변론종결 뒤 승계인과 재소금지\n5. (사안 - 설문해결)", "purpose": "(재소금지) 본안 종국판결 후 소취하한 경우 동일한 소를 제기할 수 없는 것으로 종국판결의 농락 및 소취하 남용 방지 위함이다.", "article": "제267조 2항", "elements": "ⅰ) 甲의 1심 승소판결(본안) 후 항소심에서 소취하되었고 ⅱ) 소송물도 부동산인도청구로 동일하나 ⅲ) 甲의 재소금지 효과가 특정승계인인 丁에게 미치는지(당사자) ⅳ) 권리보호이익이 동일한지 문제된다.", "theory": "① 포함설은 이러한 경우도 종국판결을 농락할 우려가 있는 점은 동일하므로 효력이 미친다고 보며 ② 비포함설은 전소 취하를 알면서 받아들였다는 등 특단의 사정이 없는 한 미치지 효력이 미치지 않는다고 본다.", "cases": "소유권을 양수한 특정승계인이 다시 건물철거를 구한 경우 소 취하한 자에는 변론종결 후 특정승계인을 포함한다고 보아 포함설 입장이나, 새로운 권리보호이익이 생겼다 하여 재소를 허용했다.", "resolution": "丁은 甲으로부터 공유지분을 양수받아 자신의 공유지분에 기해 부동산인도청구를 구한 자로서, 새로운 권리보호이익이 인정되므로 재소금지의 효과가 미친다고 본 법원의 판단은 부당하다."}}]}, {"subject": "민사소송법", "exam": "62회", "year": 2025, "problemNo": 3, "points": 30, "passage": "甲이 乙을 상대로 구상금 청구의 소를 제기하여 승소판결을 받아 2011. 11. 11. 동\n판결이 확정되었다. 그 이후 乙이 丙으로부터 돈을 차용하면서 이를 담보하기 위해\n2012. 4. 18. 丙과 대물반환예약(이하, ‘제1 대물반환예약’이라 한다)을 체결하고 乙\n소유의 부동산 공유지분에 관하여 2012. 4. 20. 지분권이전담보가등기(이하, ‘제1\n담보가등기’라 한다)를 설정하였다. 乙이 2012. 9. 16. 위 부동산에 관한 공유물분\n할이 있은 후 2013. 4. 1. 다시 동일한 내용의 대물반환예약(이하, ‘제2 대물반환예\n약’이라 한다)을 체결한 뒤, 2013. 4. 3. 제1 담보가등기는 해제를 원인으로 하여\n말소하였다. 乙은 같은 날 乙의 단독소유로 분할된 부동산에 제2 대물반환예약을\n원인으로 하여 새로운 담보가등기(이하, ‘제2 담보가등기’라 한다)를 설정하고 그\n부동산 및 다른 공유자의 소유로 분할된 부동산에 전사된 담보가등기를 모두 말소\n하였다.", "subquestions": [{"no": 1, "points": 10, "question": "甲이 2014. 10. 9. 乙에 대한 구상금채권을 피보전채권으로 하여 丙을 상대로\n제2 대물반환예약이 사해행위에 해당한다며 사해행위취소의 소를 제기하였으나\n甲의 패소 판결이 선고되었다. 그 이후 甲은 항소하였으며, 항소심은 제2 대물\n반환예약은 제1 대물반환예약에 기한 이 사건 분할 전 토지 지분에 관한 제1\n담보가등기를 공유물분할에 따라 이 사건 토지에 관한 제2 담보가등기로 이전\n하기 위한 계약에 불과하므로, 제2 대물반환예약의 체결은 사해행위에 해당하\n지 않는다고 판단하였다. 甲은 이에 대하여 상고하였고, 상고심은 제2 대물반환\n예약의 사해행위 요건 구비 여부는 최초의 제1 대물반환예약 당시를 기준으로\n판단하여야 하며 사해행위취소 및 원상회복을 구하는 甲으로서는 제2 대물반환\n예약의 취소를 구할 수 있다고 판단하여 환송 전 원심판결을 파기하여 환송하\n였다. 그리고 甲은 2016. 11. 5. 환송 후 원심에서 제1 대물반환예약의 취소를\n구하는 예비적 청구를 추가하였다. 그러나 환송 후 원심은 환송판결의 판단의\n기초가 된 사실관계를 그대로 인정하면서도 환송 후 심리과정에서 새로운 사실\n과 증거를 채택하지 아니한 채 환송 전 원심판결과 동일하게 제2 대물반환예약\n자체로 인하여 소외인 乙의 공동담보가 더욱 부족하게 되었다고 볼 수 없다고\n판단하여, 제2 대물반환예약이 일반채권자를 해하는 사해행위임을 전제로 한\n甲의 주위적 청구를 배척하고, 甲이 환송 후 원심에서 추가한 제1 대물반환예\n약의 취소를 구하는 예비적 청구는 제척기간 도과를 이유로 각하하였다. 이와\n같은 환송 후 원심법원의 판단에 잘못이 없는지 검토하시오.", "answer": "1. 문제의 소재\n환송판결의 기속력과 관련하여, 새로운 사실과 증거 채택 없이, 파기이유와 다른 판단을 한 환송 후 원심은 위법함을 알아본다.\n2. 환송판결의 기속력의 의의 및 취지(제436조 2항)\n환송 또는 이송받은 법원이 다시 심판을 하는 경우 상고법원이 파기 이유로 한 사실상 및 법률상 판단에 기속된다. 소송경제 및 심급제도의 실효성을 확보하기 위함이다.\n3. 법적성질\n통설·판례는 심급제도를 유지하기 위해 \"하급심을 구속하는 특수한 효력\"이라 하여 특수효력설 입장이다.\n4. 주관적 범위\n당해 사건에 관한 한, 환송받은 법원과 그 하급심에 미치므로, 사안에서 환송 후 원심법원에 기속력이 미친다.\n5. 객관적 범위\n(1) 원칙\n파기이유로 한 사실상·법률상 판단에 구속된다. 나아가 판례는 파기이유와 논리적·필연적 관계가 있어 파기이유의 전제로서 당연히 판단했다고 볼 수 있는 법률상 판단도 포함된다고 본다.\n(2) 사안\n상고심이 제2 대물반환 예약의 사해행위 요건 구비 여부는 최초의 제1 대물반환예약 당시를 기준으로 판단한다고 한 것은 법률상 판단으로, 환송 후 원심은 이에 기속된다.\n6. 법원의 조치\n(1) 효력\n환송법원은 파기이유와 다른 판단을 할 수 없다. 그러나 기속력 때문에 원심판결의 결론을 바꾸어야 하는 것은 아니다.\n(2) 소멸\nⅰ) 환송판결에 나타난 법률상 견해가 판례의 변경으로 바뀐 경우 ⅱ) 새로운 주장·입증으로 기속적 판단의 기초가 된 사실관계의 변동 ⅲ) 법령의 변경이 있는 경우 기속력이 미치지 않는다.\n(3) 사안\n환송 후 원심법원은 새로운 사실과 증거를 채택하지 않아 위 예외 사유에 해당하지 않으므로, 환송판결의 기속력이 미친다.\n7. 설문해결\nⅰ) 주위적 청구에서 제2 대물반환예약을 기준으로 사해행위 여부를 판단한 것은 파기이유와 다른 판단을 한 것으로 환송판결의 기속력에 반하여 위법하다. ⅱ) 다만, 예비적 청구는 제척기간과 파기이유에서 판단된 사항이 아닌 바, 기속력에 반하지 않는다.", "categories": {"toc": "1. 문제의 소재\n2. 환송판결의 기속력의 의의 및 취지\n3. 법적성질\n4. 주관적 범위\n5. 객관적 범위\n6. 법원의 조치\n7. 설문해결", "purpose": "(환송판결의 기속력) 환송 또는 이송받은 법원이 다시 심판을 하는 경우 상고법원이 파기 이유로 한 사실상 및 법률상 판단에 기속된다. 소송경제 및 심급제도의 실효성을 확보하기 위함이다.", "article": "제436조 2항", "elements": "(기속력 소멸 사유) ⅰ) 환송판결에 나타난 법률상 견해가 판례의 변경으로 바뀐 경우 ⅱ) 새로운 주장·입증으로 기속적 판단의 기초가 된 사실관계의 변동 ⅲ) 법령의 변경이 있는 경우 기속력이 미치지 않는다.", "theory": "(법적성질) 통설·판례는 심급제도를 유지하기 위해 \"하급심을 구속하는 특수한 효력\"이라 하여 특수효력설 입장이다.", "cases": "(객관적 범위) 파기이유로 한 사실상·법률상 판단에 구속된다. 나아가 판례는 파기이유와 논리적·필연적 관계가 있어 파기이유의 전제로서 당연히 판단했다고 볼 수 있는 법률상 판단도 포함된다고 본다.", "resolution": "ⅰ) 주위적 청구에서 제2 대물반환예약을 기준으로 사해행위 여부를 판단한 것은 파기이유와 다른 판단을 한 것으로 환송판결의 기속력에 반하여 위법하다. ⅱ) 다만, 예비적 청구는 제척기간과 파기이유에서 판단된 사항이 아닌 바, 기속력에 반하지 않는다."}}, {"no": 2, "points": 10, "question": "甲이 2014. 10. 9. 乙에 대한 구상금채권을 피보전채권으로 하여 丙을 상대로\n사해행위취소의 소(이하 ‘제1 사해행위취소소송’이라 한다)를 제기하여 그 소장\n부본이 2014. 10. 20. 丙에게 송달되었다. 그리고 甲은 2014. 11. 10. 다시 乙에\n대한 대여금채권을 피보전채권으로 하여 丙을 상대로 사해행위취소의 소(이하\n‘제2 사해행위취소소송’이라 한다)를 제기하였다. 그 이후 丙은 2015. 1. 20. 제1\n사해행위취소소송 및 제2 사해행위취소소송에 대하여 각 준비서면을 각 제출하\n였다. 그리고 甲은 2015. 2. 15. 제2 사해행위취소소송에 대해서만 소취하서를\n제출하였다. 甲이 제출한 소취하서의 법적 효과를 검토하시오.", "answer": "1. 문제의 소재\n제2 사해행위취소소송은 중복소송으로 부적법하나, 부적법한 소송도 피고 丙의 동의 여부에 따라 소취하로 종료됨을 알아본다.\n2. 제2 사해행위취소소송의 중복소제기 여부\n(1) 중복소제기의 의의 및 취지(제259조)\n법원에 계속 중인 사건에 대해 당사자는 동일한 소를 제기할 수 없다. 판결의 모순·저촉 방지를 위함이다.\n(2) 요건\nⅰ) 전소 계속 중 후소가 제기되었고 ⅱ) 당사자도 甲, 丙으로 동일하나 ⅲ) 소송물이 동일한지 문제된다.\n(3) 소송물 동일여부\n1) 판례\n판례는 채권자취소소송을 하면서 피보전채권을 추가·교환하는 것은 사해행위취소권과 원상회복청구권을 이유있게 하는 공격방법의 변경일 뿐 소송물 변경이 아니라고 본다.\n2) 사안\n사안에서 甲을 乙에 대한 피보전채권을 구상금채권에서 대여금채권으로 변경한 것은 공격방법의 변경일 뿐 소송물은 동일하다.\n(4) 소결\n따라서 甲의 제2 사해행위취소소송은 중복소제기로 부적법하다. 다만, 부적법하여 각하될 소를 취하하는 것이 가능한지 문제된다.\n3. 제2 사해행위취소소송의 소취하 가부 및 효과\n(1) 소취하의 의의(제266조)\n원고가 제기한 소의 전부 또는 일부를 철회하는 법원에 대한 단독적인 소송행위이다.\n(2) 요건\n1) 일반요건\nⅰ) 판결 확정 전까지 ⅱ) 상대방이 본안에 관해 준비서면을 제출하거나 변론을 하여 응소한 경우 상대방의 동의를 요한다.\n2) 사안\n사안에서, 제2 사해행위취소소송은 아직 확정 전이고, 피고 丙은 준비서면을 제출하였는바 준비서면이 본안에 관한 것이라면, 丙의 동의를 받을 경우 소를 취하할 수 있다.\n(3) 효과\n소가 취하되면 소가 처음부터 계속되지 않은 것으로 본다.\n(4) 사안 및 설문해결\n따라서, 제2 사해행위취소소송은 丙의 동의가 있을 경우 소가 처음부터 계속되지 않은 것으로 본다. 한편, 제2 사해행위취소소송은 본안판결받지 않았으므로, 소취하가 된다 하여도 제1 사해행위취소소송에 있어 재소금지 여부는 문제되지 않는다.", "categories": {"toc": "1. 문제의 소재\n2. 제2 사해행위취소소송의 중복소제기 여부\n3. 제2 사해행위취소소송의 소취하 가부 및 효과\n4. (사안 및 설문해결)", "purpose": "(중복소제기) 법원에 계속 중인 사건에 대해 당사자는 동일한 소를 제기할 수 없다. 판결의 모순·저촉 방지를 위함이다.\n(소취하) 원고가 제기한 소의 전부 또는 일부를 철회하는 법원에 대한 단독적인 소송행위이다.", "article": "제259조, 제266조", "elements": "(중복소제기) ⅰ) 전소 계속 중 후소가 제기되었고 ⅱ) 당사자도 甲, 丙으로 동일하나 ⅲ) 소송물이 동일한지 문제된다.\n(소취하 일반요건) ⅰ) 판결 확정 전까지 ⅱ) 상대방이 본안에 관해 준비서면을 제출하거나 변론을 하여 응소한 경우 상대방의 동의를 요한다.", "theory": "", "cases": "판례는 채권자취소소송을 하면서 피보전채권을 추가·교환하는 것은 사해행위취소권과 원상회복청구권을 이유있게 하는 공격방법의 변경일 뿐 소송물 변경이 아니라고 본다.", "resolution": "따라서, 제2 사해행위취소소송은 丙의 동의가 있을 경우 소가 처음부터 계속되지 않은 것으로 본다. 한편, 제2 사해행위취소소송은 본안판결받지 않았으므로, 소취하가 된다 하여도 제1 사해행위취소소송에 있어 재소금지 여부는 문제되지 않는다."}}, {"no": 3, "points": 10, "question": "甲은 소송대리인 A를 선임하여 乙에 대한 구상금채권을 피보전채권으로 하여\n丙을 상대로 사해행위취소의 소를 제기하였으나 2015. 10. 9. 패소하였고, 甲은\n이 판결에 대하여 2015. 10. 23. 항소장을 제출하였다. 원심재판장은 2015. 10. 30.\n‘이 명령을 송달받은 날로부터 7일 안에 인지대 및 송달료를 납부하라’는 내용\n의 보정명령을 발령하면서 이를 甲의 원심 소송대리인 A에게 송달하였을 뿐\n甲에게는 송달하지 아니하였다. 법원은 甲이 원심에 제출한 소송대리인 위임장\n을 통해 원심 소송대리인 A에게 상소제기에 관한 특별한 권한이 부여된 사실\n을 확인할 수 있었다. 그 이후 원심재판장은 2015. 12. 10. 甲이 위 기간 내에\n인지를 보정하지 않았다는 이유로 항소장각하 명령을 하였다. 이와 같은 원심\n재판장의 판단에 잘못이 없는지 검토하시오.", "answer": "1. 문제의 소재\n원심재판장의 항소장심사에 있어, 소송대리인이 상소제기의 특별수권을 받았을 경우, 인지보정명령을 누구에게 해야 하는지 문제된다.\n2. 원심재판장의 항소장심사(제399조)\n① 원심재판장은 항소장에 필요적 기재사항이 흠결된 경우와 인지를 붙이지 아니한 경우 원심재판장은 항소인에게 상당한 기간을 정하여 보정명령을 내려야 한다.(제1항) ② 항소인지 보정하지 않거나, 항소기간을 넘긴 경우 원심재판장은 항소장 각하명령을 해야 한다.(제2항)\n3. 소송대리인의 대리권의 범위(제90조)\n① 소송위임에 의한 소송대리인은 소송에 필요한 일체의 행위를 할 수 있다.(제1항) ② 다만, 본인에게 중대한 결과를 미치는 반소제기, 소 취하, 포기 또는 인낙, 화해, 탈퇴, 상소제기 및 취하, 복대리인의 선임은 본인의 특별수권을 받아야 한다.(제2항)\n4. 상소제기 특별수권 있는 소송대리인에게 상소장 인지보정명령 가부\n(1) 원칙 - 판례\n상소제기에 관한 특별수권을 받은 소송대리인은 상소장을 제출할 권한과 의무가 있으므로, 상소장에 인지를 붙이지 아니한 흠이 있다면 소송대리인은 이를 보정할 수 있고 원심재판장도 소송대리인에게 인지의 보정을 명할 수 있다.\n(2) 예외 - 판례\n그러나 소송대리인이 상소제기 특별수권을 받았더라도, 소송대리인이 아닌 당사자 본인이 상소장을 작성하여 제출한 경우에는 소송대리인에게 상소장과 관련한 보정명령을 수령할 권능이 없으므로, 원심재판장이 소송대리인에게 보정명령을 송달한 것은 부적법한 송달이어서 그 송달의 효력이 발생하지 아니한다.\n5. 설문해결\n소송대리인 A는 상소제기의 특별수권이 있으나, 당사자 甲이 항소장을 제출하였으므로, 원심재판장이 A에게만 보정명령을 송달한 것은 부적법한 것으로 효력이 없다. 따라서, A에게만 송달 후 항소장 각하명령을 한 원심재판장의 판단은 위법하다.", "categories": {"toc": "1. 문제의 소재\n2. 원심재판장의 항소장심사\n3. 소송대리인의 대리권의 범위\n4. 상소제기 특별수권 있는 소송대리인에게 상소장 인지보정명령 가부\n5. 설문해결", "purpose": "(소송대리인 대리권) 소송위임에 의한 소송대리인은 소송에 필요한 일체의 행위를 할 수 있다. 다만, 본인에게 중대한 결과를 미치는 반소제기, 소 취하, 포기 또는 인낙, 화해, 탈퇴, 상소제기 및 취하, 복대리인의 선임은 본인의 특별수권을 받아야 한다.", "article": "제399조, 제90조, 제90조 1항, 제90조 2항", "elements": "(원심재판장의 항소장심사) ① 원심재판장은 항소장에 필요적 기재사항이 흠결된 경우와 인지를 붙이지 아니한 경우 원심재판장은 항소인에게 상당한 기간을 정하여 보정명령을 내려야 한다.(제1항) ② 항소인지 보정하지 않거나, 항소기간을 넘긴 경우 원심재판장은 항소장 각하명령을 해야 한다.(제2항)", "theory": "", "cases": "(원칙) 상소제기에 관한 특별수권을 받은 소송대리인은 상소장을 제출할 권한과 의무가 있으므로, 상소장에 인지를 붙이지 아니한 흠이 있다면 소송대리인은 이를 보정할 수 있고 원심재판장도 소송대리인에게 인지의 보정을 명할 수 있다.\n(예외) 그러나 소송대리인이 상소제기 특별수권을 받았더라도, 소송대리인이 아닌 당사자 본인이 상소장을 작성하여 제출한 경우에는 소송대리인에게 상소장과 관련한 보정명령을 수령할 권능이 없으므로, 원심재판장이 소송대리인에게 보정명령을 송달한 것은 부적법한 송달이어서 그 송달의 효력이 발생하지 아니한다.", "resolution": "소송대리인 A는 상소제기의 특별수권이 있으나, 당사자 甲이 항소장을 제출하였으므로, 원심재판장이 A에게만 보정명령을 송달한 것은 부적법한 것으로 효력이 없다. 따라서, A에게만 송달 후 항소장 각하명령을 한 원심재판장의 판단은 위법하다."}}]}, {"subject": "민사소송법", "exam": "62회", "year": 2025, "problemNo": 4, "points": 20, "passage": "甲은 2024. 2. 5. 乙을 상대로 투자금반환의 소를 제기한 후, 소송계속 중 2024. 5. 4.\nA에게 이 사건 투자금반환채권을 양도하였다. 그리고 A는 소송계속 중 甲의 승계\n인이라고 주장하며 위 소송에 참가 신청하였다.", "subquestions": [{"no": 1, "points": 10, "question": "甲의 乙에 대한 위 투자금반환소송은 2024. 12. 20. 변론종결되었으며, 乙은\n2025. 1. 15. A에게 이 사건 투자금반환채권의 양도에 대하여 이의를 보류하지\n않고 승낙하였다. 위 투자금반환소송은 2025. 2. 20. 甲의 승소판결로 확정되었다.\nA는 2025. 3. 10. 乙을 상대로 甲으로부터 양도받은 이 사건 투자금반환채권을\n행사하여 별소를 제기하였다. 이 경우에 법원이 어떠한 판단을 하여야 하는지\n검토하시오.", "answer": "1. 문제의 소재\n기판력의 주관적 범위와 관련하여, 채권양도시, 변론종결 후 승계인 여부는 채권양도합의가 이루어진 때가 아니라 대항요건이 갖춰진 때를 기준으로 판단해야 하므로, A는 변론종결 후 승계인에 해당하여 후소는 기판력에 저촉되어 각하됨을 알아본다.\n2. 기판력의 주관적 범위\n(1) 상대성 원칙(제218조 1항)\n기판력은 당사자에게만 미치고 제3자에게는 미치지 않는다. 절차보장을 받지 못한 채 제3자에게 소송결과를 강요하는 것은 부당하기 때문이다.\n(2) 예외 - 변론종결 후 승계인\n다만, 변론종결 후 당사자로부터 소송물인 실체법상 권리의무를 승계한 자는, 소송물을 제3자에게 처분함으로써 생기는 판결의 무력화를 방지하기 위해 판결의 효력이 미친다.\n(3) 변론종결 뒤 승계인지 여부\n1) 판례\n판례는 채권양수인이 참가신청을 한 경우 승계가 소송계속 중에 이루어진 것인지는 채권양도합의가 이루어진 때가 아니라 대항요건이 갖춰진 때를 기준으로 판단하는 것처럼, 변론종결 후 승계인 해당 여부 역시 대항요건이 갖춰진 때를 기준으로 판단해야 한다.\n2) 사안\n乙은 변론종결(2024.12.20.) 뒤인 2025.1.15.에 A에게 투자금반환채권 양도에 대해 승낙하였으므로, 변론종결 뒤 승계한 자이다.\n(4) 승계인의 범위\nA는 甲으로부터 소송물인 투자금반환채권 자체를 승계한 자로 승계인의 범위에 해당한다.\n(5) 소결\n전소 당사자 甲, A는 주관적 범위에 해당한다.\n3. 기판력의 객관적 범위 및 작용국면\n전후소 모두 투자금반환청구로 동일관계로 기판력이 작용한다.\n4. 기판력의 시적범위 - 표준시와 차단효\n변론종결 전 존재했으나 그때까지 제출하지 않은 공격방어방법 제출은 허용되지 않으므로, A의 후소 주장은 차단된다.\n5. 법원의 조치\n(1) 학설 및 판례\n① 반복금지설은 기판력을 독자적인 소송요건으로 보아 기판력에 저촉되는 경우 분쟁의 1회적 해결을 위해 승패불문 소각하를 하며 ② 판례인 모순금지설은 전소 승소시 전소 판결에서 원고가 승소한 부분은 권리보호의 이익이 없다 하여 소각하를, 전소 패소시 전소 판결 내용과 모순된 판단을 해서는 안되는 구속력을 이유로 청구기각을 해야 한다고 본다.\n(2) 사안 - 설문해결\n전소 당사자 甲은 승소하였으므로, 법원은 후소 당사자 A의 별소는 권리보호이익이 없다 하여 소각하해야 한다.", "categories": {"toc": "1. 문제의 소재\n2. 기판력의 주관적 범위\n3. 기판력의 객관적 범위 및 작용국면\n4. 기판력의 시적범위 - 표준시와 차단효\n5. 법원의 조치\n(사안 - 설문해결)", "purpose": "(상대성 원칙) 기판력은 당사자에게만 미치고 제3자에게는 미치지 않는다. 절차보장을 받지 못한 채 제3자에게 소송결과를 강요하는 것은 부당하기 때문이다.\n(변론종결 후 승계인) 변론종결 후 당사자로부터 소송물인 실체법상 권리의무를 승계한 자는, 소송물을 제3자에게 처분함으로써 생기는 판결의 무력화를 방지하기 위해 판결의 효력이 미친다.", "article": "제218조 1항", "elements": "(시적범위) 변론종결 전 존재했으나 그때까지 제출하지 않은 공격방어방법 제출은 허용되지 않으므로, A의 후소 주장은 차단된다.", "theory": "① 반복금지설은 기판력을 독자적인 소송요건으로 보아 기판력에 저촉되는 경우 분쟁의 1회적 해결을 위해 승패불문 소각하를 하며 ② 판례인 모순금지설은 전소 승소시 전소 판결에서 원고가 승소한 부분은 권리보호의 이익이 없다 하여 소각하를, 전소 패소시 전소 판결 내용과 모순된 판단을 해서는 안되는 구속력을 이유로 청구기각을 해야 한다고 본다.", "cases": "판례는 채권양수인이 참가신청을 한 경우 승계가 소송계속 중에 이루어진 것인지는 채권양도합의가 이루어진 때가 아니라 대항요건이 갖춰진 때를 기준으로 판단하는 것처럼, 변론종결 후 승계인 해당 여부 역시 대항요건이 갖춰진 때를 기준으로 판단해야 한다.", "resolution": "전소 당사자 甲은 승소하였으므로, 법원은 후소 당사자 A의 별소는 권리보호이익이 없다 하여 소각하해야 한다."}}, {"no": 2, "points": 10, "question": "甲은 주채무자 B에게 투자금반환을 요구하였으나, B가 반환을 거부하자 보증인\n丙을 상대로 보증채무이행의 소를 제기하였다. B는 丙을 위하여 위 소송에 참\n가하였으나 丙의 패소판결이 선고되었다. 이 판결정본은 2025. 5. 27. 丙에게,\n2025. 6. 4. B에게 각각 송달되었다. 그리고 丙과 B는 2025. 6. 14. 공동명의로\n항소장을 제출하였다. 이 경우에 법원이 어떠한 판단을 하여야 하는지 검토하시오.", "answer": "1. 문제의 소재\nB는 丙에 대해 보조참가인의 지위에 있고, 보조참가인의 종속성에 따라 항소기간이 도과되었으므로 법원은 항소각하함을 알아본다.\n2. B의 참가의 형태\n甲의 丙에 대한 청구에 B는 ⅰ) 당사자 적격이 없고 ⅱ) 판결효가 미치는 경우도 아닌바 보조참가에 해당한다. 사안과 같이, 주채무자가 보증채무자의 승소를 위해 참가하는 것은 대표적인 보조참가이다.\n3. 보조참가인의 소송상 지위\n(1) 보조참가인의 독립성(제76조 1항 본문)\nⅰ) 보조참가인은 자기 이익 옹호를 위해 당사자에 준하는 절차권이 인정되는바 ⅱ) 피참가인이 할 수 있는 일체의 소송행위(cf. 사법행위×)를 할 수 있다. 기일통지나 서류송달 등을 당사자와 별도로 받는다.\n(2) 보조참가인의 종속성\nⅰ) 다만 피참가인 이익보호를 위해 보조참가인 지위는 피참가인에게 종속된다. ⅱ) 따라서 참가할 때의 소송정도에 따라 할 수 없는 행위, 피참가인 소송행위와 어긋나는 행위, 피참가인에게 불이익한 행위, 소를 확장·변경하는 행위, 피참가인의 사법상 권리행사는 불가하다.\n(3) 보조참가인이 피참가인의 상소기간에 종속되는지 여부\n1) 학설\n① 통설은 승소보조자에 불과하다는 참가인의 종속성에 비추어 피참가인의 상소기간에만 상소를 제기할 수 있다고 보나 ② 소수설은 독립성을 강조하여 소송경제상 참가인의 상소기간 내이면 보조참가인도 상소 제기할 수 있다고 본다.\n2) 판례\n보조참가인의 상고가 피참가인의 상고기간을 어긴 때에는 보조참가인의 상고가 상고기간 내의 상고라 하더라도 그 상고는 부적법하다 하여 통설의 입장이다.\n3) 검토\n보조참가인은 그 종속적 지위에서, 피참가인이 할 수 없는 행위는 할 수 없으므로 통설이 타당하다.\n4. 설문해결\n항소는 판결정본송달일로 2주 내로 할 수 있는데, 丙은 25.5.27.에 판결정본을 송달받아 2주가 도과되었으며, B도 피참가인 丙의 항소기간에 종속되므로 항소기간이 도과되었다. 따라서 법원은 항소각하판결을 해야 한다.", "categories": {"toc": "1. 문제의 소재\n2. B의 참가의 형태\n3. 보조참가인의 소송상 지위\n4. 설문해결", "purpose": "(보조참가인 독립성) 보조참가인은 자기 이익 옹호를 위해 당사자에 준하는 절차권이 인정되는바 피참가인이 할 수 있는 일체의 소송행위(cf. 사법행위×)를 할 수 있다. 기일통지나 서류송달 등을 당사자와 별도로 받는다.\n(보조참가인 종속성) 다만 피참가인 이익보호를 위해 보조참가인 지위는 피참가인에게 종속된다. 따라서 참가할 때의 소송정도에 따라 할 수 없는 행위, 피참가인 소송행위와 어긋나는 행위, 피참가인에게 불이익한 행위, 소를 확장·변경하는 행위, 피참가인의 사법상 권리행사는 불가하다.", "article": "제76조 1항", "elements": "", "theory": "① 통설은 승소보조자에 불과하다는 참가인의 종속성에 비추어 피참가인의 상소기간에만 상소를 제기할 수 있다고 보나 ② 소수설은 독립성을 강조하여 소송경제상 참가인의 상소기간 내이면 보조참가인도 상소 제기할 수 있다고 본다.", "cases": "보조참가인의 상고가 피참가인의 상고기간을 어긴 때에는 보조참가인의 상고가 상고기간 내의 상고라 하더라도 그 상고는 부적법하다 하여 통설의 입장이다.", "resolution": "항소는 판결정본송달일로 2주 내로 할 수 있는데, 丙은 25.5.27.에 판결정본을 송달받아 2주가 도과되었으며, B도 피참가인 丙의 항소기간에 종속되므로 항소기간이 도과되었다. 따라서 법원은 항소각하판결을 해야 한다."}}]}, {"subject": "특허법", "exam": "62회", "year": 2025, "problemNo": 1, "points": 30, "passage": "甲은 명칭을 ‘다가 폐렴구균 다당류-단백질 접합체 조성물’로 하는 특허발명\n(이하 ‘이 사건 특허발명’이라 함)의 발명자이자 특허권자이다. 이 사건 특허발\n명은 13종의 개별 원액을 포함하는 조성물에 관한 물건의 발명 및 13종의 개별 원\n액을 혼합하여 조성물을 제조하는 공정에 관한 방법의 발명을 청구항으로 포함\n하고 있다. 조성물은 13종의 개별 원액을 혼합하여 제조되는 공정을 통해 생산된다.\n甲은 乙에게 이 사건 특허발명의 독점적 통상실시권을 허락하였다.\n위 지문을 토대로 다음 물음에 답하시오. (단, 각 물음은 독립적이다.)", "subquestions": [{"no": 1, "points": 10, "question": "甲은 丙에게 이 사건 특허발명의 실시를 위한 전용실시권을 설정하고 이를\n등록하였다. 이와 관련하여, 丙의 전용실시권과 乙의 독점적 통상실시권을\n비교 설명하시오.", "answer": "1. 문제의 소재 - 의의\n(1) 전용실시권\n특허권자 이외의 자가 특허권자와의 계약에 의해 그 설정된 범위 안에서 업으로서 특허발명을 독점적으로 실시할 수 있는 권리를 말한다(法100).\n(2) 독점적 통상실시권\n특허권자가 실시권자에 대하여 그 실시권자 외의 제3자에게 통상실시권을 허락하지 않을 부작위 의무를 부담하는 경우의 통상실시권을 말한다(判例).\n(3) 사안의 경우\n丙의 전용실시권과 乙의 독점적 통상실시권을 아래에서 비교한다.\n2. 발생\n(1) 전용실시권\n전용실시권의 설정은 등록하여야만 효력이 발생한다(法101①(2)).\n(2) 독점적 통상실시권\n\"등록하여야만 효력이 발생하는 전용실시권 설정과 달리, 독점적 통상실시권의 허락은 당사자 간 의사의 합치만 있으면 성립되고, 의사의 합치는 명시적은 물론 묵시적으로도 이루어질 수 있다.\"\n(3) 사안의 경우\n丙의 전용실시권은 등록하여야만 효력이 발생하지만 乙의 독점적 통상실시권은 등록하지 않아도 당사자간 의사 합치만 있으면 효력이 발생한다.\n3. 효력\n(1) 전용실시권\n설정행위로 정한 범위에서 특허발명을 업으로서 실시할 권리를 독점하고(法100②), 금지청구권(法126), 손해배상청구권(法128), 신용회복청구권(法131)이 인정되며, 고의에 의한 전용실시권침해는 침해죄를 구성한다(法225).\n(2) 독점적 통상실시권\n① 계약으로 정한 범위에서 특허발명을 실시할 수 있는 채권적 권리이고, 타인의 침해에 대해 직접적으로 금지청구권, 손해배상청구권 등의 민·형사상 조치를 취할 수는 없다.\n② 이 점이 전용실시권과 차이점이다. 다만 민법상의 손해배상청구권을 행사할 수 있고, 침해금지청구권을 대위행사할 수 있다.\n(3) 사안의 경우\n丙은 전용실시권 설정범위로 정한범위에서 독점적인 권리를 가지게 되지만, 乙은 계약으로 정한 범위에서 채권적 권리만을 가지게 된다.\n4. 변동\n(1) 전용실시권\n특허권자의 동의를 받아야만 전용실시권을 이전할 수 있는 것이 원칙이나, 실시사업과 함께 이전하는 경우 또는 상속 기타 일반승계의 경우 동의 없이 이전할 수 있다(法100③).\n(2) 독점적 통상실시권\n실시사업과 함께 이전할 수 있는 것이 원칙이나, 실시사업과 함께 이전하는 경우 또는 상속 기타 일반승계의 경우 동의 없이 이전할 수 있다(法102). 즉, 전용실시권의 이전의 제한 법리와 동일한 법리가 적용된다.\n(3) 사안의 경우\n乙과 丙은 모두 특허권자의 동의가 있어야 실시권을 이전할 수 있는 것이 원칙이나, 실시사업과 함께 이전하는 경우 또는 상속 기타 일반승계의 경우 동의 없이 이전할 수 있을 것이다.\n5. 소멸\n(1) 전용실시권\n특허권에 부수하는 권리이므로 특허권이 소멸하는 경우 소멸한다. 또한 전용실시권의 소멸을 등록하는 경우 소멸하고, 특허권자와 전용실시권자가 일치하는 경우 혼동으로 소멸한다.\n(2) 독점적 통상실시권\n전용실시권과 마찬가지로 특허권에 부수하는 권리이므로 특허권이 소멸하는 경우 소멸한다. 또한, 독점적 통상실시권 계약이 해지 등의 사유로 종료되는 경우 소멸한다(이 경우 등록이 필요하지 않음). 특허권자와 독점적 통상실시권자가 일치하는 경우 혼동으로 소멸한다.\n(3) 사안의 경우\n乙과 丙의 실시권은 모두 특허권에 부수하는 권리이므로 특허권의 소멸로 인해 함께 소멸할 것이다. 그 외에 혼동에 따른 소멸 법리도 동일하게 적용될 것이다."}, {"no": 2, "points": 10, "question": "丁은 무단으로 이 사건 특허발명을 실시하고 있다. 乙은 丁을 상대로 특허법\n상의 손해배상청구권을 행사할 수 있는지 논하시오.", "answer": "1. 문제의 소재\n丙은 소송계속 중 계쟁물 승계인으로 인수승계의 요건은 만족하나, 인수승계의 절차와 관련하여 추가적 인수는 불가하여 법원은 각하 결정을 내릴 것임을 알아본다.\n2. 인수승계의 의의 및 취지(제82조)\n소송계속 중 소송목적인 권리의무 승계가 있는 경우 종전당사자 신청에 의해 승계인을 새로운 당사자로 끌어들이는 것으로서 소송경제를 도모하기 위함이다.\n3. 요건\n(1) ⅰ) 타인 간 소송 계속 중 ⅱ) 제3자에게 소송의 목적인 권리,의무의 승계가 있어야 한다.\n(2) 사안\nⅰ) 甲,乙간의 소송 계속 중 ⅱ) 丙은 계쟁물인 건물을 승계하였고, 甲,乙간의 건물철거 소송은 물권적 청구권에 기한 것이므로 구이론(判例)에 따라 丙은 승계인에 해당한다. 다만, 丙에 대해서는 등기말소를 구했는 바, 추가적 인수 가부가 문제된다.\n4. 절차 - 추가적 인수 허용여부\n(1) 문제점\n인수승계의 절차에는, ⅰ) 소송 목적인 채무 자체를 승계하는 교환적 인수와 ⅱ) 소송 목적인 채무 승계가 아니라, 그 채무를 전제로 새로운 채무가 생기는 추가적 인수가 있다.\n(2) 학설\n① 긍정설은 이는 분쟁주체 지위의 이전으로서 소송경제상 가능하다고 보나 ② 부정설은 소송목적인 권리 또는 의무를 승계한 때라고 규정한 제82조에 반하므로 부정한다.\n(3) 판례\n① 당사자가 제3자로 하여금 소송인수를 하기 위해서는 제3자에 대해 인수한 소송의 목적이 된 채무이행을 구하는 경우만 허용되고 별개 채무의 이행을 구함은 허용될 수 없다고 하나 ② 공유물분할 소송에서 지분 일부양수인을 추가하는 경우는 허용했다.\n(4) 검토\n추가적 인수를 부정한 듯한 판례는 존재하나, 이는 소송목적인 권리·의무를 승계했다고 볼 수 없다는 이유로 부정한 것인바, 소송목적의 권리·의무를 승계했다고 볼 수 있다면 허용함이 타당하다.\n(5) 사안\n乙이 건물철거의무를 진다고 하여, 丙이 등기말소의무를 부담하는 것이 아니므로, 丙은 소송목적의 의무를 승계했다고 볼 수 없다. 따라서, 추가적 인수는 불허된다.\n5. 설문해결\n주장 자체로 인수승계 신청이 부적법한 경우이므로, 법원은 각하결정을 해야 한다."}, {"no": 3, "points": 5, "question": "戊는 무단으로 13종의 개별 원액을 국내에서 생산하여 이를 甲이 특허출원\n및 등록을 하지 않은 A국에 수출하였고, 이를 수입한 A국적의 a는 A국에서\n이를 혼합하여 이 사건 특허발명에 속하는 조성물을 생산하였다. 戊가 甲의\n특허권을 직접침해하는지 여부에 대해 논하시오.", "answer": "1. 문제의 소재\n丙의 수출 및 생산행위는 특허법상 물건발명의 실시 태양에 해당하지만(法2(3)), 개별 원액의 국내 생산이 특허발명의 실시로 취급될 수 있는 것인지 문제된다.\n2. 물건발명에 관한 판례\n(1) 속지주의 원칙과 구성요소 완비의 원칙\n① \"물건의 발명에 관한 특허권자가 물건에 대하여 가지는 독점적인 생산·사용·양도 등의 특허실시에 관한 권리는 특허권이 등록된 국가의 영역 내에서만 효력이 미치고(특허권의 속지주의 원칙).\n② 특허권침해소송의 상대방이 제조하는 물건이 특허권을 침해하는 물건에 해당하려면 특허발명의 청구범위에 기재된 각 구성요소와 그 구성요소 간의 유기적 결합관계가 그 물건에 그대로 포함되어 있어야 한다 (구성요소 완비의 원칙).\"\n(2) 국내에서 특허제품이 생산된 것과 같이 보는 경우 (2019다222782)\n① \"국내에서 특허발명의 실시를 위한 부품 또는 구성 전부가 생산되거나 대부분의 생산단계를 마쳐 주요 구성을 모두 갖춘 반제품이 생산되고, ② 이것이 하나의 주체에게 수출되어 마지막 단계의 가공·조립이 이루어질 것이 예정되어 있으며, ③ 그와 같은 가공·조립이 극히 사소하거나 간단하여 위와 같은 부품 전체의 생산 또는 반제품의 생산만으로도 특허발명의 각 구성요소가 유기적으로 결합한 일체로서 가지는 작용효과를 구현할 수 있는 상태에 이르렀다면, 예외적으로 국내에서 특허발명의 실시제품이 생산된 것과 같이 보는 것이 특허권의 실질적 보호에 부합한다.\"\n(3) 엄격한 판단 (2025다202970)\n\"이는 속지주의 원칙과 구성요소 완비의 원칙을 고려하여 엄격하게 판단하여야 한다.\"\n3. 사안의 해결\n(1) 물건특허 침해 여부\n① 개별 원액은 a에게 수출되어 마지막 혼합단계가 예정되어 있다. ② 따라서 개별 원액의 생산만으로도 대부분의 생산단계를 마쳐 주요 구성을 모두 갖춘 반제품의 생산으로 볼 수 있고 혼합단계가 극히 사소하거나 간단하여 특허발명의 각 구성요소가 유기적으로 결합한 일체로서 구현할 수 있는 상태에 이르렀다면, 국내에서 특허발명이 생산된 것으로 보아 물건특허의 직접침해를 구성하게 된다. ③ 만약 그렇지 않다면 직접침해를 구성하지 않게 된다.\n(2) 방법특허 침해 여부\n丙는 개별 원액을 혼합하여 조성물을 제조하는 공정을 실시하고 있지 않으므로 구성요소 완비의 원칙상 직접침해를 구성하지 않는다."}, {"no": 4, "points": 5, "question": "위 (3)의 지 문 에 서 戊 가 甲 의 특 허 권 을 간 접 침 해 하 는 지 여 부 에 대 해\n논 하 시 오 .", "answer": "1. 간접침해 의의 및 취지 (判例)\n(1) 의의\n특허발명의 생산·실시에만 사용하는 물건을 생산·양도 등을 하는 행위는 특허권을 침해한 것으로 본다.\n(2) 판례가 설시한 취지\n\"발명의 모든 구성요소를 가진 물건을 실시한 것이 아니고 그 전 단계에 있는 행위를 하였더라도 발명의 모든 구성요소를 가진 물건을 실시하게 될 개연성이 큰 경우에는 장래의 특허침해에 대한 권리 구제의 실효성을 높이기 위하여 일정한 요건 아래 이를 침해로 간주하라는 취지이다.\" (2014다42110)\n2. 직접침해 전제성\n(1) 판례\n\"法127(1)에서 말하는 '생산'이란 국내생산을 의미한다고 봄이 타당하다. 따라서 이러한 생산이 국외에서 일어나는 경우 전 단계의 행위가 국내에서 이루어지더라도 간접침해가 성립할 수 없다.\"\n(2) 검토 (2014다42110)\n\"특허권의 속지주의 원칙상 물건발명에 관한 특허권자가 가지는 독점적인 특허실시에 관한 권리는 특허권이 등록된 국가의 영역 내에서만 효력이 미치는 점을 고려하면\" 판례는 타당하다.\n3. 사안의 해결\n(1) 물건특허 간접침해 여부\n① 개별 원액 생산이 직접침해를 구성한다면, 개별 원액 중 적어도 일부가 특허발명의 전용품에 해당하는 경우 개별 원액 생산은 간접침해에도 해당한다. ② 개별 원액 생산이 직접침해를 구성하지 않는다면, 그 중 적어도 일부가 전용품에 해당하더라도 간접침해에 해당하지 않게 된다.\n(2) 방법특허 간접침해 여부\n최종적인 조성물의 제조공정(방법발명의 실시)은 국외에서 이루어지므로, 전 단계의 개별 원액 생산이 국내에서 이루어지더라도 간접침해에 해당하지 않는다. [끝]"}]}, {"subject": "특허법", "exam": "62회", "year": 2025, "problemNo": 2, "points": 20, "passage": "甲이 출원하여 등록받은 이 사건 특허발명은 ‘생물학적 활성 화합물과 컨쥬게이\n팅되는 잔기를 갖는 폴리알킬렌 글리콜’이라는 명칭의 발명이다. 이 사건 특허\n발명은 식품의약품안전처장이 기허가한 의약품의 유효성분인 인터페론베타-1a\n에 폴리에틸렌글리콜(PEG)을 공유결합하여 페길화(PEGylation)한 것인데, 인터\n페론베타-1a는 단백질 의약물질로 체내에서 활성을 가지며 비정상적인 면역작용을\n조절함으로써 재발성 다발성 경화증의 치료효과를 가진다. 한편, 폴리에틸렌글리\n콜은 혈액 중의 짧은 반감기, 면역원성 및 항원성 유발과 같은 단백질 의약물질의\n단점을 보완하기 위하여 단백질 의약물질에 결합되는 것으로 그 자체만으로는\n체내에서 활성을 가지지 않는다. 이 사건 특허발명과 관련된 이 사건 의약품인\n‘폴리베타’는 기허가 의약품과 동일한 효능·효과인 재발성 다발성 경화증의 치료\n효과를 가지면서도 페길화함으로써 인터페론베타-1a의 혈액 중 평균체류시간\n및 반감기를 증가시킨 의약품이다. 甲은, 식품의약품안전처장으로부터 ‘폴리베\n타’의 수입품목허가를 받는 데 장기간이 소요되었다는 이유 로 , 그 실 시 할 수\n없었던 기간만큼 이 사건 특허권의 존속기간 연장등록출원을 하였다.\n위 지문을 토대로 다음 물음에 답하시오. (단, 각 물음은 독립적이다.)", "subquestions": [{"no": 1, "points": 10, "question": "특 허 권 의 존 속 기 간 연 장 등 록 출 원 제 도 를 설 명 한 후 , 甲 의 이 사 건 특 허 권\n의 존속기간 연장등록출원에 대해 특허청은 어떠한 결정을 해야 하는지\n논 하 시 오 .", "answer": "1. 특허권의 존속기간 연장등록출원제도\n(1) 문제의 소재\n존속기간 연장등록출원제도에는 허가등에 따른 연장(法89)과 등록지연에 따른 연장제도(法92의2)가 있다. 이 하에서는 이 중 사안과 관계된 허가등에 따른 연장제도를 검토한다.\n(2) 의의(제89조)\n약사법 등에 의한 허가 등을 받기 위하여 특허발명을 실시할 수 없었던 기간만큼 특허권의 존속기간을 연장해 주는 제도이다(法89).\n(3) 판례가 설시한 취지\n\"의약품 등의 발명을 실시하기 위해서는 약사법 등에 따라 허가 등을 받아야 하는데, 특허권자는 이러한 허가 등을 받는 과정에서 특허발명을 실시할 수 없었던 불이익을 받게 된다. 따라서 위와 같은 불이익을 구제하고 의약품 등의 발명을 보호·장려하기 위한 것이다.\" (2017후844)\n(4) 요건 및 절차 등\n① 특허권자만이 할 수 있으며, 공유인 경우 공유자 모두가 공동출원하여야 한다(法91(4)(5)).\n② 약사법등에 따라 허가등을 받은 발명이 연장대상이고, 특허발명을 실시할 수 없었던 기간으로서 5년 내로 연장할 수 있다. 허가등을 받은 날부터 14년을 초과하여 연장할 수 없다(法89①).\n③ 허가등을 받은 날부터 3개월 이내 출원해야 하지만, 존속기간 만료 전 6개월 이후에는 출원할 수 없다(法90③).\n2. 지식재산처의 결정\n(1) 시행령 제7조\n슈7는, \"특허발명을 실시하기 위하여 약사법에 따라 품목허가를 받은 의약품(신물질[약효를 나타내는 활성부분의 화학구조가 새로운 물질]을 유효성분으로 하여 제조한 의약품으로서 최초로 품목허가를 받은 의약품으로 한정)의 발명\"을 연장 가능한 발명 중 하나로 규정하고 있다.\n(2) '약효'의 해석 (判例)\n\"슈7에서 말하는 '약효'는 특정 질환명·증상명을 기준으로 하는 품목허가 대상으로서의 '효능·효과'를 의미한다고 볼 수 있다.\"\n(3) '약효를 나타내는 활성부분'의 해석 (判例)\n\"'약효'는 질환·증상명을 기준으로 하는 '효능·효과'를 의미하므로, '약효를 나타내는 활성부분'은 '인체 내 세포 등에 작용하여 품목허가상 효능·효과를 발현하는 부분'으로 해석하는 것이 합리적이다.\"\n(4) 그 자체로는 활성을 가지지 않는 부분을 부가한 경우 (判例)\n\"기허가된 의약품의 공지된 활성부분이 발현하는 효능·효과의 정도에 영향을 미치기 위하여 자체로는 활성을 가지지 않는 부분을 부가한 의약품 발명은 특허권 존속기간 연장대상이 되는 발명이라고 보기 어렵다.\"\n(5) 검토\n품목허가 등을 위하여 필요한 유효성·안전성 등의 시험으로 인하여 장기간이 소요되는 발명에 한하여 이를 구제하도록 정하고 있는 존속기간 연장제도의 취지 및 목적에 비추어, 판례는 타당하다.\n(6) 사안의 경우\n1) 신물질 해당 여부"}, {"no": 2, "points": 10, "question": "乙은 甲의 ‘폴리베타’와 비교할 때 ‘숙신산염’에서 ‘푸마르산염’으로 변경한\n‘염 변경 의약품’인 ‘폴리JK’를 국내에서 생산하여 판매하였다. 푸마르산염과\n숙신산염의 성질을 보면 인체에 흡수되는 유효 성 분 의 약 리 작 용 에 의 해\n나타나는 치료효과가 다르다고 볼 수 없으며, 숙 신 산 염의 체내 투여 및\n흡 수 과 정 은 푸 마 르 산 염의 경우에도 동일하다는 것은 널리 알려져 있으므로,\n숙신산염을 푸마르산염으로 변경하는 것은 통상의 기술자라면 누구나 쉽게\n선택할 수 있다. 이 경우 존속기간이 연장된 이 사건 특허권의 효력이 乙의\n‘폴리JK’의 생산에 미치는지 논하시오. (단, 본 물음에서는 이 사건 특허권\n의 존속기간이 연장되었다고 가정하고, 특허권 존속기간 연장등록의 타당성,\n의약품과 염의 실제 존부 및 효능에 대해서는 다투지 않는다.)", "answer": ""}]}, {"subject": "특허법", "exam": "62회", "year": 2025, "problemNo": 3, "points": 30, "passage": "甲은 발명 X 에 대해 청구 범 위를 제1항 내지 제5항으로 구성하여 2024년 10 월\n11일 한국 특허청에 특허출원 하였다. 다음 물음에 답하시오. (단, 각 물음은\n독립적이다.)", "subquestions": [{"no": 1, "points": 10, "question": "甲은 청구항 제2항이 발명의 설명에 의하여 뒷 받침 되지 않는다는 이유로\n의 견 제출통지서를 받 았 으나 이에 대해 아 무 런 대 응 을 하 지 아니 하 였 고 ,\n의 견 서 제 출 기 간 이 경 과 하 였 다 . 심 사 관 은 2 0 2 5 년 7월 4일 특 허 거 절\n결 정 을 하 였 고 , 甲 은 2025년 7월 7 일 특허 거 절결정등본을 송달 받 았 다.\n다음 물음에 답하시오.\n1) 甲은 의 견 서 제출 기간이 경과된 후 청구항 제2항을 취 하하는 내용의 출원\n취 하서를 특허청에 제출하였으나, 특허청장은 이를 반려하였다. 특허청장의\n처분이 적법한지 논하시오.\n2) 특허 거 절결정등본을 송달 받은 甲이 등록받기 위해 취 할 수 있는 특허법\n상의 조치를 논하시오.", "answer": "- 1)\n1. 출원의 일부취하서의 취급\n(1) 문제의 소재\n출원의 취하는 출원 전체를 소급소멸시키는 행위이므로, 일부 청구항에 허용할 것인지 문제된다.\n(2) 判例 (2001후1044)\n\"보정기간 경과 후에도 출원의 일부 취하를 허용하는 것은 출원의 보정에 엄격한 시기적 제한을 두고 있는 특허법의 취지에도 반하므로 출원인이 출원의 일부 취하라는 이름의 서류를 제출하였다고 하더라도 보정과 같은 목적을 달성하고자 하는 것이라면 보정과 마찬가지로 보아야 한다.\"\n(3) 검토\n\"특허법에는 보정이라는 제도를 두고 있을 뿐 특허결정이 되기 전에 특허출원의 일부를 취하할 수 있다고 규정해 놓은 바 없으므로\" 판례는 타당하다.\n(4) 사안의 경우\n청구항 2에 관한 출원취하는 사실상 청구항 2를 삭제하는 보정과 같은 목적을 달성하고자 하는 것으로, 보정과 마찬가지로 보아야 한다.\n2. 보정기간 경과 후 제출된 보정서의 취급\n(1) 시행규칙 제11조\n이 법 또는 이 법에 의한 명령이 정하는 기간 이내에 제출되지 아니한 서류인 경우, 지식재산처장은 소명기회 부여 후 그 서류를 반려하여야 한다.\n(2) 사안의 경우\n① 출원취하서는 보정서와 같이 취급해야 하는데, 의견서 제출기간이 경과한 후 제출되었으므로, 지식재산처장은 이를 반려해야 한다. ② 따라서 지식재산처장의 처분은 적법하다.\n\n- 2)\n1. 재심사청구(제67조의2)\n(1) 의의 및 취지\n심사관이 특허거부를 결정한 출원에 대하여 출원인이 명세서·도면을 보정하여 재심사를 청구하는 경우 심사관에게 보정된 출원을 다시 심사하게 하는 제도이다.\n(2) 사안의 경우\n甲은 거절결정등본 송달일(2025. 7. 7.)로부터 3개월 이내(2025. 10. 7.)에 청구항 제2항을 삭제보정하면서 재심사를 청구함으로써, 심사관이 거절이유를 통지하지 아니한 청구항 제1항, 제3항, 제4항 및 제5항에 대해 등록결정을 받을 수 있을 것이다.\n2. 거절결정불복심판(제132조의17)\n(1) 의의 및 취지\n심사관으로부터서 거절결정을 받은 출원인이 불복하여 거절결정을 취소하여 줄 것을 요구하는 심판이다. 당사자에게 권리구제의 기회를 부여하고 행정처분의 적정성과 공정성을 확보하기 위함이다.\n(2) 사안의 경우\n甲은 거절결정등본 송달일(2025. 7. 7.)로부터 3개월 이내(2025. 10. 7.)에 거절결정불복심판을 청구함으로써 심사관의 거절결정을 다툴 수 있다. 다만 이 경우에는 원칙적으로 보정의 기회가 부여되지 않고, 심판관이 새로운 거절이유를 발견한 경우에만 보정이 가능할 것이다(法170).\n3. 분할출원(제52조)\n(1) 의의 및 취지\n하나의 출원에 둘 이상의 발명이 포함된 경우 일부를 별개의 출원으로 분할하는 것이다. 출원일체원칙의 회피, 청구범위에 기재되지 않은 발명의 보호, 권리범위 재설계기회를 위하여 인정된다.\n(2) 사안의 경우\n甲은 거절결정등본 송달일(2025. 7. 7.)로부터 3개월 이내(2025. 10. 7.)에 분할출원을 함으로서 등록을 도모할 수 있을 것이다. 이 경우 원출원과 협의제(法36②) 회피를 위해 원출원과 분할출원의 청구항이 동일하지 않도록 보정이 필요한 경우가 있을 것이다.\n4. 기타 조치\n① 甲은 특허출원일(2024. 10. 11.)로부터 1년 이내(2025. 10. 11.)에 국내우선권주장출원을 함으로써 등록을 도모할 수 있을 것이다.\n② 특허출원일로 1년 6개월이 경과하지 않아 특허출원이 출원공개(法64)되지 않았다면, 출원을 취하하고 재출원하는 방안을 고려할 수 있다.\n③ 만약 상술한 거절결정불복심판이 기각되는 경우, 제소기간내 청구항 제2항을 제외한 나머지 청구항을 분리출원(法52의2)할 수 있을 것이다."}, {"no": 2, "points": 6, "question": "심 사관은 청구항 제1항 내지 제5항 모두 인용발명 Y 에 비하여 진보성이\n인정되지 않는다며 의 견 제출통지서를 발송하였다. 甲은 거절이유를 극복하기\n위해 의견서 및 보정서를 제출하였으나, 심 사관은 거 절이유가 해소되지 않 았\n다며 특허 거 절결정을 하였다. 甲은 거 절결정 불복심 판을 청구하였으나, 특허\n심 판원은 甲에게 의 견 제 출 의 기 회를 부여하지 아니 하고 “ 청구항 제1항 및\n제2항은 진보성이 인정되지만, 청구항 제3항 내지 제5항은 인용발명 Y 에\n비하여 진보성이 인정되지 않는다 ” 며 청구를 기각하는 심 결을 하였다. 특허\n심 판원의 심 결이 적법한지 논하시오.", "answer": "1. 제170조 준용 제63조\n심사관은 특허출원에 대하여 거절결정 하려는 경우 원칙적으로 특허출원인에게 거절이유를 통지하고 의견제출 기회를 주어야 한다. 특허거절결정에 대한 심판에 관하여는 法63를 준용한다(法170①). 法170①에서 준용하는 法63는 다른 거절이유를 발견한 경우에만 적용한다(法170②).\n2. 법적 성격 (判例 2015후2341)\n\"위와 같은 절차적 권리를 보장하는 특허법 규정은 강행규정이므로 의견제출의 기회를 부여한 바 없는 새로운 거절이유를 들어서 거절결정이 결과에 있어 정당하다는 이유로 거절결정불복심판청구를 기각한 심결은 위법하다.\"\n3. 주된 취지가 거절결정의 이유와 부합하는 경우 (判例 2006후329)\n\"거절결정불복심판 기각심결 이유가 주된 취지에서 거절결정의 이유와 부합하는 경우에는 거절결정의 이유와 다른 별개의 새로운 이유로 심결을 한 것으로 볼 수 없으므로, 이러한 경우에까지 출원인에게 새로이 거절이유를 통지하여 그에 대한 의견서 제출의 기회를 주어야 하는 것은 아니다.\"\n4. 출원일체의 원칙 (判例)\n\"청구범위가 여러 개의 청구항으로 되어 있는 경우 그 하나의 항이라도 거절이유가 있는 때에는 그 출원이 전부 거절되어야 한다.\" (2008후934)\n5. 사안의 해결\n① 기각심결의 주된 취지는 청구항 3 내지 5가 인용발명 Y에 의해 진보성이 부정된다는 점인데, 심사절차에서도 청구항 1 내지 5가 인용발명 Y에 의해 진보성이 부정된다는 이유로 거절결정이 있었다. ② 따라서 기각심결의 주된취지가 거절결정의 이유와 부합한다.\n③ 또한, 청구항 3 내지 5의 거절이유가 있는 이상 청구항 1 및 2의 진보성이 있더라도 출원 전체가 거절되어야 하는 것이므로, 특허심판원의 기각심결은 적법하다."}, {"no": 3, "points": 14, "question": "甲은 발명 X 에 대해 특허등록을 받은 후 특허권 지분 50 % 를 乙에게 이전\n하였다. 특허권 지분을 이전한 후 甲은 乙의 동의 없이 대한민 국 국적의 A사\n에게 발명 X 의 생산을 의 뢰 하였고, A사는 발명 X 를 생산하여 甲에게 납 품\n하였다. 이 러 한 사 실 을 알 게 된 乙 이 취 할 수 있 는 법적 조치에 대하여\n논하시오.", "answer": "1. 문제의 소재\n甲과 乙은 공유특허권자들이므로 甲이 乙의 동의를 받지 아니하고 A에게 의뢰한 이상, A를 실시권자로 볼 수는 없다. 다만 기관대행설에 의해 A사의 실시를 甲의 실시로 취급할 것인지 살핀다.\n2. 기관대행설\n(1) 일반\n특허권자 등이 제3자와 실시계약을 맺고 제3자는 특허권자 등의 감독을 받으며 생산된 물건 전량을 특허권자 등에게 인도하는 경우 제3자의 실시는 특허권자 등의 실시로 볼 수 있다.\n(2) 기관대행설이 성립하는 경우\n1) 일반\n甲은 발명 X의 생산에 관해 A사와 실시계약을 맺은 것으로 볼 수 있다. 만약 A사가 발명 X를 생산하여 전량을 甲에게 납품하였고 이러한 과정에서 甲이 A사를 감독하였다면, A사의 실시는 甲의 실시로 취급된다.\n2) 甲에 대한 조치 - 불가\n① 특허권이 공유인 경우에는 각 공유자는 계약으로 특별히 약정한 경우를 제외하고는 다른 공유자의 동의를 받지 아니하고 그 특허발명을 자신이 실시할 수 있다(法99③).\n② 따라서 기관대행설이 성립하여 甲이 발명 X를 실시한 것으로 취급되는 경우, 특약이 없는 한 乙은 A사에게 취할 수 있는 조치가 없다.\n(3) 기관대행설이 성립하지 않는 경우\n1) 일반\n만약 A사가 발명 X를 생산하여 甲에게 전량을 납품하지 않거나 이 과정에서 甲이 감독하지 않은 경우 기관대행설이 성립하지 않고, 발명 X의 생산은 A사의 실시로 취급된다.\n2) A에 대한 조치 - 민사적 조치\n① 乙은 A를 상대로 침해금지청구권(法126)을 단독행사할 수 있을 것이다. ② 乙은 자신의 지분비율을 내세서 손해배상청구권(法128)을 행사할 수 있을 것이다. ③ 乙은 신용회복청구권(法131), 부당이득반환청구권(民法 741) 등의 기타 민사적 조치를 취할 수 있을 것이다.\n3) A에 대한 조치 - 형사적 조치\n乙은 A를 침해죄로 고소할 수 있을 것이다(法225). 또한 乙은 몰수(法231), 양벌규정(法23)과 같은 형사처벌 규정을 활용할 수 있다.\n3. 공유물분할청구\n(1) 민법 제268조제1항 - 공유물분할청구권\n공유자는 공유물의 분할을 청구할 수 있다(民法268). 이를 공유물분할청구권이라고 하는데 해당 규정이 특허권의 공유에 적용될 수 있는 지 문제된다.\n(2) 특허권 공유의 법적성질\n\"특허권이 공유인 경우에 각 공유자는 권리의 행사에 일정한 제약을 받아 그 범위에서는 합유와 유사한 성질을 가진다. 그러나 특허법의 다른 규정이나 특허의 본질에 반하는 등의 특별한 사정이 없는 한 공유에 관한 민법의 일반규정이 특허권의 공유에도 적용된다.\" (2013다41578)\n(3) 특허법상 공유물분할청구권의 인정가부\n1) 제99조 제2항 및 제4항의 취지 (判例)\n\"공유자 외의 제3자가 특허권 지분을 양도받거나 그에 관한 실시권을 설정받을 경우 제3자가 투입하는 자본의 규모·기술 및 능력 등에 따라 경제적 효과가 현저하게 달라지게 되어 타공유자 지분의 경제적 가치에도 상당한 변동을 가져올 수 있는 특허권의 공유관계의 특수성을 고려하여, 타공유자의 동의 없는 지분의 양도 및 실시권 설정 등을 금지한다는 데에 있다.\"\n2) 공유물분할청구권의 인정가부 (判例)\n\"공유관계를 해소하기 위한 수단으로서 각 공유자에게 민법상의 공유물분할청구권을 인정하더라도 제3자에 의하여 다른 공유자 지분의 경제적 가치에 위와 같은 변동이 발생한다고 보기 어려워서 法99②④에 반하지 아니하고, 달리 분할청구를 금지하는 특허법 규정도 없으므로, 특허권의 공유관계에 민법상 공유물분할청구권에 관한 규정이 적용될 수 있다.\" (2013다41578)\n3) 검토\n민법의 일반규정이 특허권의 공유에 적용되는 점, 타공유자의 동의가 없는 경우 공유관계를 탈피하기 위한 수단으로 공유물분할청구권이 인정되어야 하는 점을 고려할 때, 판례는 타당하다.\n4) 사안의 경우\n乙은 甲을 상대로 공유물분할청구권을 행사함으로써 공유관계를 탈피할 수 있을 것이다. [끝]"}]}, {"subject": "특허법", "exam": "62회", "year": 2025, "problemNo": 4, "points": 20, "passage": "甲, 乙 및 丙은 대학교 동기로서, 공동으로 ‘ 브 로콜리 줄 기에서 천 연물 X 를 추 출\n하는 방법’(이하, ‘발명 Y ’라 함)을 발명하기로 하였다. 甲은 관련 선행 논문을\n제시하며 아이디어만을 제공하고, 연구에 필요한 설비 및 자금을 지원하였다. 乙은\n천연물 X를 추출하는 방법에 관한 아 이 디 어를 제시하고 구체적인 실 험 을 통해\n발명 Y 를 완성하였다. 丙 역시 다 양 한 아 이 디 어를 제공하고 실제 실 험 을 통해\n발명 Y 를 구체화하고 완성하는데 기여하였다. 다음 물음에 답하시오. (단, 각\n물음은 독립적이다.)", "subquestions": [{"no": 1, "points": 14, "question": "甲과 丙은 乙 몰래 발명 Y 에 대한 특허를 받을 수 있는 권리를 대한 민 국\n국적의 A사에 이전하였다. A사는 특허출원서에 甲과 丙을 발명자로 기재하고\n2024년 11 월 4일 한국 특허청에 특허출원하였다. 그 후 乙은 甲과 丙이 A사에\n특허를 받을 수 있는 권리를 이전하여 발명 Y 가 특허출 원된 사 실을 알 게\n되었다. 乙이 A사 및 특허출원에 대해 취할 수 있는 조치를 논하시오.", "answer": "1. 문제의 소재\n乙이 발명 Y의 특허를 받을 수 있는 권리의 공유자 중 1인인지 검토하고, A사의 특허출원에 존재하는 거절이유를 검토하여 조치를 살핀다.\n2. 발명 Y의 공동발명자 판단\n(1) 제33조제2항\n발명자 또는 승계인은 특허를 받을 수 있는 권리를 가지며, 2인 이상이 공동으로 발명한 경우에는 특허를 받을 수 있는 권리를 공유한다.\n(2) 공동발명 성립요건\n1) 공동발명자가 되기 위한 요건 (判例 2011다67705)\n\"공동발명자가 되기 위해서는 실질적으로 상호 협력하는 관계가 있어야 하므로, 발명의 목적·효과를 달성하기 위한 구체적 수단과 방법의 제공 또는 조언·지도를 통하여 발명을 가능하게 한 경우 등과 같이 기술적 사상의 창작행위에 실질적으로 기여하기에 이르러야 공동발명자에 해당한다.\"\n2) 공동발명자가 아닌 경우 (判例 2011다67705)\n\"① 기본적인 과제·아이디어만을 제공하였거나 ② 연구자를 일반적으로 관리하고 데이터의 정리와 실험만을 한 경우 ③ 자금 등을 제공하여 발명의 완성을 후원하였을 뿐인 정도에 그치는 경우 공동발명자로 볼 수 없다.\"\n(3) 사안의 경우\n① 甲은 관련 선행 논문을 제시하여 아이디어만을 제공하고, 연구에 필요한 설비 및 자금을 지원하였을 뿐이므로, 공동발명자로 볼 수 없다.\n② 乙은 천연물 X를 추출하는 방법에 관한 아이디어를 제시하고 구체적인 실험을 통해 발명 Y를 완성하였으므로, 공동발명자로 볼 수 있다.\n③ 丙 역시 다양한 아이디어를 제공하고 실제 실험을 통해 발명 Y를 구체화하고 완성하는데 기여하였으므로, 공동발명자로 볼 수 있다.\n④ 따라서, 발명 Y는 乙과 丙의 공동발명에 해당하고, 특허를 받을 수 있는 권리는 乙과 丙에게 원시적으로 귀속한다.\n3. 특허출원에 존재하는 거절이유\n(1) 제33조 제1항\n해당발명을 실질적으로 이룬 자만이 산업발전에 기여한 사람이므로 발명자 또는 승계인에 한하여 특허를 받을 수 있는 권리를 부여한다. 위반 시 거절이유, 정보제공사유 및 무효사유에 해당한다.\n(2) 제44조\n특허를 받을 수 있는 권리가 공유인 경우에는 공유자 모두가 공동으로 특허출원을 하여야 한다.\n(3) 사안의 경우\n1) ① 특허를 받을 수 있는 권리는 乙과 丙의 공유이므로, 甲은 이에 대해 처분할 수 있는 권한이 없다. ② 또한, 丙은 乙의 공유지분에 대해 처분할 수 있는 권한이 없고, 자신의 지분이라도 乙의 동의 없이 처분할 수 없다(法37③). ③ 따라서 발명 Y에 관한 특허를 받을 수 있는 권리는 乙과 丙에게 귀속된 상태로 유지된다.\n2) ① 따라서 A사의 특허출원은 무권리자의 출원이므로, 제33조 위반이다. ② 또한, 발명 Y는 乙과 丙이 공유하고 있는데 A사가 출원하였으므로, 제44조 위반에도 해당한다.\n4. 심사청구(제59조) 및 정보제공(제63조의2)\n① 乙은 A사의 특허출원을 거절시키기 위해, A사의 특허출원에 대해 심사청구를 할 수 있다(法59). ② A사의 특허출원에 상술한 바와 같이 法33 및 法44 위반의 거절이유가 있음을 이유로 정보제공(法63조의2)을 할 수 있다.\n5. 정당권리자 출원(제34조)\n① 乙은 A사의 특허출원이 무권리자 출원이라는 점을 근거로 A사의 특허출원의 거절결정 확정일로부터 30일 이내에 정당권리자 출원을 할 수 있다.\n② 다만, 이 경우 특허를 받을 수 있는 권리의 공유자인 丙과 공동으로 출원하여야 한다.\n6. 출원인 명의변경청구 가부\n1) 문제의 소재\n法99의2는 등록이 완료된 특허에 대해서만 적용이 있고, 심사단계에서의 정당한 권리자의 구제에 대해서는 규정하고 있지 않으므로, 심사단계에서 출원인 명의변경청구를 할 수 있다고 볼 것인지 문제이다.\n2) 학설\n① 法99의2는 등록권리에 관한 이전청구만을 규정으로 있으므로, 반대 해석상 심사단계에서 출원인 명의변경 청구는 불가능하다는 견해.\n② 모인특허 등록이 완료된 후에 등록권리의 이전을 통해서만 권리자를 구제해야 할 필연성이 없음을 근거로 명의변경청구가 가능하다는 견해가 대립한다.\n3) 검토 및 입법론\n① 우리 특허법은 출원인 명의변경을 인정하고 있고(法38), 명의변경은 공동신청주의가 원칙이지만 판결에 의한 등록은 일방의 신청으로 가능한 점(슈15)을 고려할 때,\n② 현행법상으로, 정당권리자는 무권리자를 상대로 \"출원인 명의변경 이행의 소\"를 제기하고 그 승소판결을 근거로 단독으로 명의변경을 신청할 수 있다고 봄이 타당하다.\n4) 사안의 경우\n乙은 A사에 대해 자신의 지분비율만큼 출원인지분명의이전청구를 할 수 있을 것이다.\n7. 발명자 기재 관련 조치\n(1) 발명자를 잘못 기재한 출원의 법적 취급\n특허를 받을 수 있는 권리를 가지지 않은 자가 출원한 경우 法33① 본문 위반으로 거절이유·정보제공사유·무효사유에 해당하지만, 발명자 표시가 잘못된 경우는, 거절이유, 정보제공사유 및 무효사유에 해당하지 않는다.\n(2) 발명자 정정 신청 가부\n출원인 또는 특허권자가 발명자의 기재를 추가하거나 정정하려는 경우 발명자 정정을 신청할 수 있다(施則 28). 반대해석상, 출원인 또는 특허권자가 아닌 경우, 발명자 정정을 신청할 수 없다.\n(3) 사안의 경우\n1) A사의 특허출원서에 발명자가 甲과 丙으로 잘못 기재되어 있지만 이는 거절이유·정보제공사유·무효사유에 해당하지 않는다. 또한, 乙은 출원인이 아니므로 발명자 정정 신청을 할 수 없다. 따라서 乙은 발명자를 잘못 기재한 것과 관련하여 취할 수 있는 조치가 없다.\n2) 한편, 乙이 출원인명의변경을 통해 출원인이 되는 경우, 발명자 정정신청을 할 수 있을 것이다."}, {"no": 2, "points": 6, "question": "甲, 乙 및 丙은 서로 간의 합의를 통해 甲이 발명 Y 를 단독으로 특허출원\n하게 되었다. 발명 Y 가 특허등록 된 후 甲은 대한 민 국 국적의 B 사에 특허\n권에 대한 유상의 통상 실시권 을 설정해 주 었 다. 그 후, B 사의 연 구 원 은\n우 연 히 미 국 국 적 의 C 사가 발명 Y 와 실질적으로 동일한
