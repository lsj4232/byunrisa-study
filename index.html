 발명 Y' 를 C 사\n카탈로그에 기재하여 발명 Y의 특허출원일 전에 반포하였다는 사실을 알게\n되었다. B사가 甲의 특허에 대해 특허심판원에 취할 수 있는 조치를 논하시오.", "answer": "1. 문제의 소재 - 신규성 무효사유 존재\n미국 국적의 C사가 발명 Y와 실질적으로 동일한 발명 Y'를 C사 카탈로그에 게재하여 발명 Y의 특허출원일 전에 반포된 경우, 발명 Y에는 신규성 무효사유가 존재하게 된다.\n2. 특허무효심판의 청구인 적격(제133조제1항) - 이해관계 판단 (判例 2017후2819)\n① 무효심판은 하자있는 특허를 소급소멸시키는 절차로서 이해관계인 또는 심사관만이 청구할 수 있다(法133①). 심판청구의 남용을 방지하고 심판경제의 도모를 위함이다.\n② 무효심판에서 이해관계인이란, \"특허발명의 권리존속으로 인하여 법률상 어떠한 불이익을 받거나 받을 우려가 있어 소멸에 관하여 직접적이고도 현실적인 이해관계를 가진 사람\"을 말한다.\n3. 실시권자의 이해관계 인정 여부\n(1) 종래 판례\n① \"이해관계인이란 당해 특허발명의 권리존속으로 인하여 그 권리자로부터 권리의 대항을 받거나 받을 염려가 있어 그 피해를 받는 직접적이고 현실적인 이해관계가 있는 사람을 말한다\"는 전제하에,\n② 주류적 판례는 \"실시권자는 법률상 아무런 장애 없이 이를 실시할 수 있으므로 특별한 사정이 없는 한, 특허를 무효로 할 구체적 이익이 있다 할 수 없다\"고 하였고,\n③ \"대가의 지급조건이 붙어 있어 통상실시권에 수반하는 의무이행을 하여야 한다면 이해관계가 소멸되었다고 볼 수 없으나 무효심판을 구할 이해관계가 있다\"고 본 사례도 있었다.\n(2) 최근 판례\n\"이해관계인에는 당해 특허발명과 같은 종류의 물품을 제조·판매하거나 제조·판매할 사람도 포함된다. 이러한 법리에 의하면 특별한 사정이 없는 한 실시권자가 특허권자로부터 권리의 대항을 받거나 받을 염려가 없다는 이유만으로 무효심판을 청구할 수 있는 이해관계가 소멸되었다고 볼 수 없다.\"\n(3) 검토\n① \"실시권자는 무효심판을 통해 특허에 대한 무효심결을 받음으로써 이러한 제약에서 벗어날 수 있는 점 및 ② 실시권을 설정받았다는 이유로 특허의 무효 여부를 다투지 않겠다는 의사를 표시하였다고 단정할 수도 없는\" 점을 고려할 때, 전원합의체 판례는 타당하다.\n(4) 사안의 경우\nB사는 유상의 통상실시권자이지만, 이러한 사정만으로 이해관계를 부정할 수는 없다. 甲의 특허가 소멸하는 경우 B사는 더 이상 실시료를 지급하지 않아도 되는 법률상 이익을 얻게 되므로 甲의 특허의 소멸에 직접적·현실적 이해관계가 있다. B사의 무효심판 이해관계는 인정된다.\n4. 사안의 해결\nB사는 甲의 특허에 대해 특허심판원에 특허무효심판을 청구할 수 있다. [끝]"}]}];
const STATUTE_DATA = {"민사소송법": [{"no": 1, "no_str": "제1조", "title": "민사소송의 이상과 신의성실의 원칙", "body": "①법원은 소송절차가 공정하고 신속하며 경제적으로 진행되도록 노력하여\n야 한다.\n②당사자와 소송관계인은 신의에 따라 성실하게 소송을 수행하여야 한다.\n\n— 시행 예정 —\n이 법은 2025년 3월 1일부터 시행한다."}, {"no": 2, "no_str": "제2조", "title": "보통재판적", "body": "소(訴)는 피고의 보통재판적(普通裁判籍)이 있는 곳의 법원이 관할한다.\n\n— 시행 예정 —\n이 법은 이 법 시행 후 최초로 항소장 또는 항고장이 제출되는 사건부터 적\n용한다."}, {"no": 3, "no_str": "제3조", "title": "사람의 보통재판적", "body": "사람의 보통재판적은 그의 주소에 따라 정한다. 다만, 대한민국에 주소가 없거나 주소를 알\n수 없는 경우에는 거소에 따라 정하고, 거소가 일정하지 아니하거나 거소도 알 수 없으면 마지막 주소에 따라 정한다\n.\n\n— 시행 예정 —\n민사소송 등 인지법 일부를 다음과 같이 개정한다.\n제14조제1항에 제6호의2를 다음과 같이 신설한다.\n6의2. 「민사소송법」 제402조의3제1항 본문에 따라 각하된 경우"}, {"no": 4, "no_str": "제4조", "title": "대사ㆍ공사 등의 보통재판적", "body": "대사(大使)ㆍ공사(公使), 그 밖에 외국의 재판권 행사대상에서 제외되는 대한민국\n국민이 제3조의 규정에 따른 보통재판적이 없는 경우에는 이들의 보통재판적은 대법원이 있는 곳으로 한다."}, {"no": 5, "no_str": "제5조", "title": "법인 등의 보통재판적", "body": "①법인, 그 밖의 사단 또는 재단의 보통재판적은 이들의 주된 사무소 또는 영업소가 있는\n곳에 따라 정하고, 사무소와 영업소가 없는 경우에는 주된 업무담당자의 주소에 따라 정한다.\n②제1항의 규정을 외국법인, 그 밖의 사단 또는 재단에 적용하는 경우 보통재판적은 대한민국에 있는 이들의 사무\n소ㆍ영업소 또는 업무담당자의 주소에 따라 정한다."}, {"no": 6, "no_str": "제6조", "title": "국가의 보통재판적", "body": "국가의 보통재판적은 그 소송에서 국가를 대표하는 관청 또는 대법원이 있는 곳으로 한다."}, {"no": 7, "no_str": "제7조", "title": "근무지의 특별재판적", "body": "사무소 또는 영업소에 계속하여 근무하는 사람에 대하여 소를 제기하는 경우에는 그 사무\n소 또는 영업소가 있는 곳을 관할하는 법원에 제기할 수 있다."}, {"no": 8, "no_str": "제8조", "title": "거소지 또는 의무이행지의 특별재판적", "body": "재산권에 관한 소를 제기하는 경우에는 거소지 또는 의무이행지의 법원\n에 제기할 수 있다."}, {"no": 9, "no_str": "제9조", "title": "어음ㆍ수표 지급지의 특별재판적", "body": "어음ㆍ수표에 관한 소를 제기하는 경우에는 지급지의 법원에 제기할 수 있다."}, {"no": 10, "no_str": "제10조", "title": "선원ㆍ군인ㆍ군무원에 대한 특별재판적", "body": "①선원에 대하여 재산권에 관한 소를 제기하는 경우에는 선적(船籍)이\n있는 곳의 법원에 제기할 수 있다.\n②군인ㆍ군무원에 대하여 재산권에 관한 소를 제기하는 경우에는 군사용 청사가 있는 곳 또는 군용 선박의 선적이\n있는 곳의 법원에 제기할 수 있다."}, {"no": 11, "no_str": "제11조", "title": "재산이 있는 곳의 특별재판적", "body": "대한민국에 주소가 없는 사람 또는 주소를 알 수 없는 사람에 대하여 재산권에\n관한 소를 제기하는 경우에는 청구의 목적 또는 담보의 목적이나 압류할 수 있는 피고의 재산이 있는 곳의 법원에\n제기할 수 있다."}, {"no": 12, "no_str": "제12조", "title": "사무소ㆍ영업소가 있는 곳의 특별재판적", "body": "사무소 또는 영업소가 있는 사람에 대하여 그 사무소 또는 영업소의\n업무와 관련이 있는 소를 제기하는 경우에는 그 사무소 또는 영업소가 있는 곳의 법원에 제기할 수 있다."}, {"no": 13, "no_str": "제13조", "title": "선적이 있는 곳의 특별재판적", "body": "선박 또는 항해에 관한 일로 선박소유자, 그 밖의 선박이용자에 대하여 소를 제\n기하는 경우에는 선적이 있는 곳의 법원에 제기할 수 있다.\n\n— 시행 예정 —\n선박 또는 선박의 건조, 매매, 수선, 관리, 항해ㆍ입항ㆍ출항ㆍ정박(예선 및 도선\n을 포함한다) 등에 관한 일로 선박소유자, 그 밖의 선박이용자에 대하여 소를 제기하는 경우에는 선적이 있는 곳의\n법원에 제기할 수 있다. <개정 2026. 3. 17.>\n\n— 시행 예정 —\n"}, {"no": 14, "no_str": "제14조", "title": "선박이 있는 곳의 특별재판적", "body": "선박채권(船舶債權), 그 밖에 선박을 담보로 한 채권에 관한 소를 제기하는 경우\n에는 선박이 있는 곳의 법원에 제기할 수 있다."}, {"no": 15, "no_str": "제15조", "title": "사원 등에 대한 특별재판적", "body": "①회사, 그 밖의 사단이 사원에 대하여 소를 제기하거나 사원이 다른 사원에 대하\n여 소를 제기하는 경우에는 그 소가 사원의 자격으로 말미암은 것이면 회사, 그 밖의 사단의 보통재판적이 있는 곳의\n법원에 소를 제기할 수 있다.\n②사단 또는 재단이 그 임원에 대하여 소를 제기하거나 회사가 그 발기인 또는 검사인에 대하여 소를 제기하는 경\n우에는 제1항의 규정을 준용한다."}, {"no": 16, "no_str": "제16조", "title": "사원 등에 대한 특별재판적", "body": "회사, 그 밖의 사단의 채권자가 그 사원에 대하여 소를 제기하는 경우에는 그 소가\n사원의 자격으로 말미암은 것이면 제15조에 규정된 법원에 제기할 수 있다."}, {"no": 17, "no_str": "제17조", "title": "사원 등에 대한 특별재판적", "body": "회사, 그 밖의 사단, 재단, 사원 또는 사단의 채권자가 그 사원ㆍ임원ㆍ발기인 또는\n검사인이었던 사람에 대하여 소를 제기하는 경우와 사원이었던 사람이 그 사원에 대하여 소를 제기하는 경우에는\n제15조 및 제16조의 규정을 준용한다."}, {"no": 18, "no_str": "제18조", "title": "불법행위지의 특별재판적", "body": "①불법행위에 관한 소를 제기하는 경우에는 행위지의 법원에 제기할 수 있다.\n②선박 또는 항공기의 충돌이나 그 밖의 사고로 말미암은 손해배상에 관한 소를 제기하는 경우에는 사고선박 또는\n항공기가 맨 처음 도착한 곳의 법원에 제기할 수 있다."}, {"no": 19, "no_str": "제19조", "title": "해난구조에 관한 특별재판적", "body": "해난구조(海難救助)에 관한 소를 제기하는 경우에는 구제된 곳 또는 구제된 선박\n이 맨 처음 도착한 곳의 법원에 제기할 수 있다.\n\n— 시행 예정 —\n해난구조(海難救助)에 관한 소를 제기하는 경우에는 구조된 곳 또는 구조된 선박\n이 맨 처음 도착한 곳의 법원에 제기할 수 있다. <개정 2026. 3. 17.>\n\n— 시행 예정 —\n"}, {"no": 20, "no_str": "제20조", "title": "부동산이 있는 곳의 특별재판적", "body": "부동산에 관한 소를 제기하는 경우에는 부동산이 있는 곳의 법원에 제기할 수\n있다."}, {"no": 21, "no_str": "제21조", "title": "등기ㆍ등록에 관한 특별재판적", "body": "등기ㆍ등록에 관한 소를 제기하는 경우에는 등기 또는 등록할 공공기관이 있는\n곳의 법원에 제기할 수 있다."}, {"no": 22, "no_str": "제22조", "title": "상속ㆍ유증 등의 특별재판적", "body": "상속(相續)에 관한 소 또는 유증(遺贈), 그 밖에 사망으로 효력이 생기는 행위에 관\n한 소를 제기하는 경우에는 상속이 시작된 당시 피상속인의 보통재판적이 있는 곳의 법원에 제기할 수 있다."}, {"no": 23, "no_str": "제23조", "title": "상속ㆍ유증 등의 특별재판적", "body": "상속채권, 그 밖의 상속재산에 대한 부담에 관한 것으로 제22조의 규정에 해당되\n지 아니하는 소를 제기하는 경우에는 상속재산의 전부 또는 일부가 제22조의 법원관할구역안에 있으면 그 법원에\n제기할 수 있다."}, {"no": 24, "no_str": "제24조", "title": "지식재산권 등에 관한 특별재판적", "body": "①특허권, 실용신안권, 디자인권, 상표권, 품종보호권(이하 “특허권등”이라\n한다)을 제외한 지식재산권과 국제거래에 관한 소를 제기하는 경우에는 제2조 내지 제23조의 규정에 따른 관할법원\n소재지를 관할하는 고등법원이 있는 곳의 지방법원에 제기할 수 있다. 다만, 서울고등법원이 있는 곳의 지방법원은\n서울중앙지방법원으로 한정한다. <개정 2011. 5. 19., 2015. 12. 1.>\n② 특허권등의 지식재산권에 관한 소를 제기하는 경우에는 제2조부터 제23조까지의 규정에 따른 관할법원 소재지\n를 관할하는 고등법원이 있는 곳의 지방법원의 전속관할로 한다. 다만, 서울고등법원이 있는 곳의 지방법원은 서울\n중앙지방법원으로 한정한다.<신설 2015. 12. 1.>\n③ 제2항에도 불구하고 당사자는 서울중앙지방법원에 특허권등의 지식재산권에 관한 소를 제기할 수 있다.<신설\n2015. 12. 1.>\n[제목개정 2011. 5. 19.]\n\n— 시행 예정 —\n①특허권, 실용신안권, 디자인권, 상표권, 품종보호권(이하 “특허권등”이라 한다\n)을 제외한 지식재산권에 관한 소를 제기하는 경우에는 제2조 내지 제23조의 규정에 따른 관할법원 소재지를 관할하\n는 고등법원이 있는 곳의 지방법원에 제기할 수 있다. 다만, 서울고등법원이 있는 곳의 지방법원은 서울중앙지방법\n원으로 한정한다. <개정 2011. 5. 19., 2015. 12. 1., 2026. 3. 17.>\n② 특허권등의 지식재산권에 관한 소를 제기하는 경우에는 제2조부터 제23조까지의 규정에 따른 관할법원 소재지\n를 관할하는 고등법원이 있는 곳의 지방법원의 전속관할로 한다. 다만, 서울고등법원이 있는 곳의 지방법원은 서울\n중앙지방법원으로 한정한다.<신설 2015. 12. 1.>\n③ 제2항에도 불구하고 당사자는 서울중앙지방법원에 특허권등의 지식재산권에 관한 소를 제기할 수 있다.<신설\n2015. 12. 1.>\n[제목개정 2011. 5. 19., 2026. 3. 17.]\n\n— 시행 예정 —\n"}, {"no": 24, "no_str": "제24조의2", "title": "해사국제상사법원의 관할", "body": "① 「법원조직법」 제40조의10제1항제1호의 해사민사사건(이하 “해사민사사건”이\n라 한다)과 같은 항 제3호의 국제상사사건(이하 “국제상사사건”이라 한다)에 대한 심리와 재판은 해사국제상사법원\n의 전속관할로 한다.\n② 해사민사사건 및 국제상사사건에 대한 해사국제상사법원의 토지관할은 제2조부터 제23조까지를 따른다.\n③ 제1항 및 제2항에도 불구하고 「선원법」이 적용되는 사건으로서 선원 또는 그 유족이 당사자인 사건과 「소액사\n건심판법」 제2조제1항에 따른 소액사건의 경우 당사자는 제2조부터 제23조까지에 따른 지방법원ㆍ지원(해사국제\n상사법원이 위치한 지방법원 및 그 지원은 제외한다)에도 소를 제기할 수 있다.\n④ 원고는 해사민사사건과 국제상사사건에 관한 소송 및 그와 관련되는 민사소송으로서 해사민사사건이나 국제상\n사사건에 속하지 아니하는 소송(이하 “관련청구소송”이라 한다)을 해사국제상사법원에 병합하여 제기할 수 있다.\n[본조신설 2026. 3. 17.]\n\n— 시행 예정 —\n"}, {"no": 24, "no_str": "제24조의3", "title": "지방법원과 해사국제상사법원 사이의 관할의 지정", "body": "제28조는 사건이 지방법원과 해사국제상사법원 가운데\n어느 법원의 관할에 속하는지 분명하지 아니한 경우에 준용한다.\n[본조신설 2026. 3. 17.]\n\n— 시행 예정 —\n"}, {"no": 25, "no_str": "제25조", "title": "관련재판적", "body": "①하나의 소로 여러 개의 청구를 하는 경우에는 제2조 내지 제24조의 규정에 따라 그 여러 개 가운\n데 하나의 청구에 대한 관할권이 있는 법원에 소를 제기할 수 있다.\n②소송목적이 되는 권리나 의무가 여러 사람에게 공통되거나 사실상 또는 법률상 같은 원인으로 말미암아 그 여러\n사람이 공동소송인(共同訴訟人)으로서 당사자가 되는 경우에는 제1항의 규정을 준용한다."}, {"no": 26, "no_str": "제26조", "title": "소송목적의 값의 산정", "body": "①법원조직법에서 소송목적의 값에 따라 관할을 정하는 경우 그 값은 소로 주장하는 이\n익을 기준으로 계산하여 정한다.\n②제1항의 값을 계산할 수 없는 경우 그 값은 민사소송등인지법의 규정에 따른다."}, {"no": 27, "no_str": "제27조", "title": "청구를 병합한 경우의 소송목적의 값", "body": "①하나의 소로 여러 개의 청구를 하는 경우에는 그 여러 청구의 값을 모\n두 합하여 소송목적의 값을 정한다.\n②과실(果實)ㆍ손해배상ㆍ위약금(違約金) 또는 비용의 청구가 소송의 부대목적(附帶目的)이 되는 경우에는 그 값은\n소송목적의 값에 넣지 아니한다."}, {"no": 28, "no_str": "제28조", "title": "관할의 지정", "body": "①다음 각호 가운데 어느 하나에 해당하면 관계된 법원과 공통되는 바로 위의 상급법원이 그 관계\n된 법원 또는 당사자의 신청에 따라 결정으로 관할법원을 정한다.\n1. 관할법원이 재판권을 법률상 또는 사실상 행사할 수 없는 때\n2. 법원의 관할구역이 분명하지 아니한 때\n②제1항의 결정에 대하여는 불복할 수 없다."}, {"no": 29, "no_str": "제29조", "title": "합의관할", "body": "①당사자는 합의로 제1심 관할법원을 정할 수 있다.\n②제1항의 합의는 일정한 법률관계로 말미암은 소에 관하여 서면으로 하여야 한다."}, {"no": 30, "no_str": "제30조", "title": "변론관할", "body": "피고가 제1심 법원에서 관할위반이라고 항변(抗辯)하지 아니하고 본안(本案)에 대하여 변론(辯論)하\n거나 변론준비기일(辯論準備期日)에서 진술하면 그 법원은 관할권을 가진다."}, {"no": 31, "no_str": "제31조", "title": "전속관할에 따른 제외", "body": "전속관할(專屬管轄)이 정하여진 소에는 제2조, 제7조 내지 제25조, 제29조 및 제30조의\n규정을 적용하지 아니한다.\n\n— 시행 예정 —\n전속관할(專屬管轄)이 정하여진 소에는 제2조, 제7조부터 제24조까지, 제25조, 제29조\n및 제30조를 적용하지 아니한다. <개정 2026. 3. 17.>\n\n— 시행 예정 —\n"}, {"no": 32, "no_str": "제32조", "title": "관할에 관한 직권조사", "body": "법원은 관할에 관한 사항을 직권으로 조사할 수 있다."}, {"no": 33, "no_str": "제33조", "title": "관할의 표준이 되는 시기", "body": "법원의 관할은 소를 제기한 때를 표준으로 정한다."}, {"no": 34, "no_str": "제34조", "title": "관할위반 또는 재량에 따른 이송", "body": "①법원은 소송의 전부 또는 일부에 대하여 관할권이 없다고 인정하는 경우에\n는 결정으로 이를 관할법원에 이송한다.\n②지방법원 단독판사는 소송에 대하여 관할권이 있는 경우라도 상당하다고 인정하면 직권 또는 당사자의 신청에\n따른 결정으로 소송의 전부 또는 일부를 같은 지방법원 합의부에 이송할 수 있다.\n③지방법원 합의부는 소송에 대하여 관할권이 없는 경우라도 상당하다고 인정하면 직권으로 또는 당사자의 신청에\n따라 소송의 전부 또는 일부를 스스로 심리ㆍ재판할 수 있다.\n④전속관할이 정하여진 소에 대하여는 제2항 및 제3항의 규정을 적용하지 아니한다."}, {"no": 35, "no_str": "제35조", "title": "손해나 지연을 피하기 위한 이송", "body": "법원은 소송에 대하여 관할권이 있는 경우라도 현저한 손해 또는 지연을 피하\n기 위하여 필요하면 직권 또는 당사자의 신청에 따른 결정으로 소송의 전부 또는 일부를 다른 관할법원에 이송할 수\n있다. 다만, 전속관할이 정하여진 소의 경우에는 그러하지 아니하다."}, {"no": 35, "no_str": "제35조의2", "title": "관련청구소송의 이송 및 병합", "body": "① 해사민사사건 또는 국제상사사건에 관한 소송과 관련청구소송이 해사국\n제상사법원과 다른 법원에 각각 계속되고 있는 경우에 관련청구소송이 계속된 법원이 상당하다고 인정하는 때에는\n직권 또는 당사자의 신청에 따라 이를 해사국제상사법원으로 이송할 수 있다.\n② 원고는 해사국제상사법원에 계속된 해사민사사건 또는 국제상사사건에 관한 소송의 변론을 종결할 때(변론 없\n이 한 판결의 경우에는 판결을 선고할 때)까지 관련청구소송을 해사국제상사법원에 병합하여 제기할 수 있다.\n[본조신설 2026. 3. 17.]\n\n— 시행 예정 —\n"}, {"no": 36, "no_str": "제36조", "title": "지식재산권 등에 관한 소송의 이송", "body": "①법원은 특허권등을 제외한 지식재산권과 국제거래에 관한 소가 제기된\n경우 직권 또는 당사자의 신청에 따른 결정으로 그 소송의 전부 또는 일부를 제24조제1항에 따른 관할법원에 이송\n할 수 있다. 다만, 이로 인하여 소송절차를 현저하게 지연시키는 경우에는 그러하지 아니하다. <개정 2011. 5. 19.,\n2015. 12. 1.>\n②제1항은 전속관할이 정하여져 있는 소의 경우에는 적용하지 아니한다.<개정 2015. 12. 1.>\n③ 제24조제2항 또는 제3항에 따라 특허권등의 지식재산권에 관한 소를 관할하는 법원은 현저한 손해 또는 지연을\n피하기 위하여 필요한 때에는 직권 또는 당사자의 신청에 따른 결정으로 소송의 전부 또는 일부를 제2조부터 제\n23조까지의 규정에 따른 지방법원으로 이송할 수 있다.<신설 2015. 12. 1.>\n[제목개정 2011. 5. 19.]\n\n— 시행 예정 —\n①법원은 특허권등을 제외한 지식재산권에 관한 소가 제기된 경우 직권 또는\n당사자의 신청에 따른 결정으로 그 소송의 전부 또는 일부를 제24조제1항에 따른 관할법원에 이송할 수 있다. 다만,\n이로 인하여 소송절차를 현저하게 지연시키는 경우에는 그러하지 아니하다. <개정 2011. 5. 19., 2015. 12. 1., 2026.\n3. 17.>\n②제1항은 전속관할이 정하여져 있는 소의 경우에는 적용하지 아니한다.<개정 2015. 12. 1.>\n③ 제24조제2항 또는 제3항에 따라 특허권등의 지식재산권에 관한 소를 관할하는 법원은 현저한 손해 또는 지연을\n피하기 위하여 필요한 때에는 직권 또는 당사자의 신청에 따른 결정으로 소송의 전부 또는 일부를 제2조부터 제\n23조까지의 규정에 따른 지방법원으로 이송할 수 있다.<신설 2015. 12. 1.>\n[제목개정 2011. 5. 19., 2026. 3. 17.]\n\n— 시행 예정 —\n"}, {"no": 36, "no_str": "제36조의2", "title": "해사민사사건과 국제상사사건에 관한 소송의 이송", "body": "제24조의2제1항에 따라 해사민사사건 및 국제상사사건\n에 관한 소를 관할하는 해사국제상사법원은 현저한 손해 또는 지연을 피하기 위하여 필요한 때에는 직권 또는 당사\n자의 신청에 따른 결정으로 소송의 전부 또는 일부를 제2조부터 제23조까지에 따른 지방법원으로 이송할 수 있다.\n[본조신설 2026. 3. 17.]\n\n— 시행 예정 —\n"}, {"no": 37, "no_str": "제37조", "title": "이송결정이 확정된 뒤의 긴급처분", "body": "법원은 소송의 이송결정이 확정된 뒤라도 급박한 사정이 있는 때에는 직권\n으로 또는 당사자의 신청에 따라 필요한 처분을 할 수 있다. 다만, 기록을 보낸 뒤에는 그러하지 아니하다."}, {"no": 38, "no_str": "제38조", "title": "이송결정의 효력", "body": "①소송을 이송받은 법원은 이송결정에 따라야 한다.\n②소송을 이송받은 법원은 사건을 다시 다른 법원에 이송하지 못한다."}, {"no": 39, "no_str": "제39조", "title": "즉시항고", "body": "이송결정과 이송신청의 기각결정(棄却決定)에 대하여는 즉시항고(卽時抗告)를 할 수 있다."}, {"no": 40, "no_str": "제40조", "title": "이송의 효과", "body": "①이송결정이 확정된 때에는 소송은 처음부터 이송받은 법원에 계속(係屬)된 것으로 본다.\n②제1항의 경우에는 이송결정을 한 법원의 법원서기관ㆍ법원사무관ㆍ법원주사 또는 법원주사보(이하 “법원사무관\n등”이라 한다)는 그 결정의 정본(正本)을 소송기록에 붙여 이송받을 법원에 보내야 한다."}, {"no": 41, "no_str": "제41조", "title": "제척의 이유", "body": "법관은 다음 각호 가운데 어느 하나에 해당하면 직무집행에서 제척(除斥)된다. <개정 2005. 3.\n31.>\n1. 법관 또는 그 배우자나 배우자이었던 사람이 사건의 당사자가 되거나, 사건의 당사자와 공동권리자ㆍ공동의무자\n또는 상환의무자의 관계에 있는 때\n2. 법관이 당사자와 친족의 관계에 있거나 그러한 관계에 있었을 때\n3. 법관이 사건에 관하여 증언이나 감정(鑑定)을 하였을 때\n4. 법관이 사건당사자의 대리인이었거나 대리인이 된 때\n5. 법관이 불복사건의 이전심급의 재판에 관여하였을 때. 다만, 다른 법원의 촉탁에 따라 그 직무를 수행한 경우에는\n그러하지 아니하다."}, {"no": 42, "no_str": "제42조", "title": "제척의 재판", "body": "법원은 제척의 이유가 있는 때에는 직권으로 또는 당사자의 신청에 따라 제척의 재판을 한다."}, {"no": 43, "no_str": "제43조", "title": "당사자의 기피권", "body": "①당사자는 법관에게 공정한 재판을 기대하기 어려운 사정이 있는 때에는 기피신청을 할 수\n있다.\n②당사자가 법관을 기피할 이유가 있다는 것을 알면서도 본안에 관하여 변론하거나 변론준비기일에서 진술을 한\n경우에는 기피신청을 하지 못한다."}, {"no": 44, "no_str": "제44조", "title": "제척과 기피신청의 방식", "body": "①합의부의 법관에 대한 제척 또는 기피는 그 합의부에, 수명법관(受命法官)ㆍ수탁판\n사(受託判事) 또는 단독판사에 대한 제척 또는 기피는 그 법관에게 이유를 밝혀 신청하여야 한다.\n②제척 또는 기피하는 이유와 소명방법은 신청한 날부터 3일 이내에 서면으로 제출하여야 한다."}, {"no": 45, "no_str": "제45조", "title": "제척 또는 기피신청의 각하 등", "body": "①제척 또는 기피신청이 제44조의 규정에 어긋나거나 소송의 지연을 목적으로\n하는 것이 분명한 경우에는 신청을 받은 법원 또는 법관은 결정으로 이를 각하(却下)한다.\n②제척 또는 기피를 당한 법관은 제1항의 경우를 제외하고는 바로 제척 또는 기피신청에 대한 의견서를 제출하여야\n한다."}, {"no": 46, "no_str": "제46조", "title": "제척 또는 기피신청에 대한 재판", "body": "①제척 또는 기피신청에 대한 재판은 그 신청을 받은 법관의 소속 법원 합의\n부에서 결정으로 하여야 한다.\n②제척 또는 기피신청을 받은 법관은 제1항의 재판에 관여하지 못한다. 다만, 의견을 진술할 수 있다.\n③제척 또는 기피신청을 받은 법관의 소속 법원이 합의부를 구성하지 못하는 경우에는 바로 위의 상급법원이 결정\n하여야 한다."}, {"no": 47, "no_str": "제47조", "title": "불복신청", "body": "①제척 또는 기피신청에 정당한 이유가 있다는 결정에 대하여는 불복할 수 없다.\n②제45조제1항의 각하결정(却下決定) 또는 제척이나 기피신청이 이유 없다는 결정에 대하여는 즉시항고를 할 수 있\n다.\n③제45조제1항의 각하결정에 대한 즉시항고는 집행정지의 효력을 가지지 아니한다."}, {"no": 48, "no_str": "제48조", "title": "소송절차의 정지", "body": "법원은 제척 또는 기피신청이 있는 경우에는 그 재판이 확정될 때까지 소송절차를 정지하여\n야 한다. 다만, 제척 또는 기피신청이 각하된 경우 또는 종국판결(終局判決)을 선고하거나 긴급을 요하는 행위를 하\n는 경우에는 그러하지 아니하다."}, {"no": 49, "no_str": "제49조", "title": "법관의 회피", "body": "법관은 제41조 또는 제43조의 사유가 있는 경우에는 감독권이 있는 법원의 허가를 받아 회피(回\n避)할 수 있다."}, {"no": 50, "no_str": "제50조", "title": "법원사무관등에 대한 제척ㆍ기피ㆍ회피", "body": "①법원사무관등에 대하여는 이 절의 규정을 준용한다.\n②제1항의 법원사무관등에 대한 제척 또는 기피의 재판은 그가 속한 법원이 결정으로 하여야 한다."}, {"no": 51, "no_str": "제51조", "title": "당사자능력ㆍ소송능력 등에 대한 원칙", "body": "당사자능력(當事者能力), 소송능력(訴訟能力), 소송무능력자(訴訟無能力\n者)의 법정대리와 소송행위에 필요한 권한의 수여는 이 법에 특별한 규정이 없으면 민법, 그 밖의 법률에 따른다."}, {"no": 52, "no_str": "제52조", "title": "법인이 아닌 사단 등의 당사자능력", "body": "법인이 아닌 사단이나 재단은 대표자 또는 관리인이 있는 경우에는 그 사단\n이나 재단의 이름으로 당사자가 될 수 있다."}, {"no": 53, "no_str": "제53조", "title": "선정당사자", "body": "①공동의 이해관계를 가진 여러 사람이 제52조의 규정에 해당되지 아니하는 경우에는, 이들은 그\n가운데에서 모두를 위하여 당사자가 될 한 사람 또는 여러 사람을 선정하거나 이를 바꿀 수 있다.\n②소송이 법원에 계속된 뒤 제1항의 규정에 따라 당사자를 바꾼 때에는 그 전의 당사자는 당연히 소송에서 탈퇴한\n것으로 본다."}, {"no": 54, "no_str": "제54조", "title": "선정당사자 일부의 자격상실", "body": "제53조의 규정에 따라 선정된 여러 당사자 가운데 죽거나 그 자격을 잃은 사람이\n있는 경우에는 다른 당사자가 모두를 위하여 소송행위를 한다."}, {"no": 55, "no_str": "제55조", "title": "제한능력자의 소송능력", "body": "① 미성년자 또는 피성년후견인은 법정대리인에 의해서만 소송행위를 할 수 있다. 다\n만, 다음 각 호의 경우에는 그러하지 아니하다.\n1. 미성년자가 독립하여 법률행위를 할 수 있는 경우\n2. 피성년후견인이 「민법」 제10조제2항에 따라 취소할 수 없는 법률행위를 할 수 있는 경우\n② 피한정후견인은 한정후견인의 동의가 필요한 행위에 관하여는 대리권 있는 한정후견인에 의해서만 소송행위를\n할 수 있다.\n[전문개정 2016. 2. 3.]"}, {"no": 56, "no_str": "제56조", "title": "법정대리인의 소송행위에 관한 특별규정", "body": "① 미성년후견인, 대리권 있는 성년후견인 또는 대리권 있는 한정후\n견인이 상대방의 소 또는 상소 제기에 관하여 소송행위를 하는 경우에는 그 후견감독인으로부터 특별한 권한을 받\n을 필요가 없다.\n② 제1항의 법정대리인이 소의 취하, 화해, 청구의 포기ㆍ인낙(認諾) 또는 제80조에 따른 탈퇴를 하기 위해서는 후\n견감독인으로부터 특별한 권한을 받아야 한다. 다만, 후견감독인이 없는 경우에는 가정법원으로부터 특별한 권한을\n받아야 한다.\n[전문개정 2016. 2. 3.]"}, {"no": 57, "no_str": "제57조", "title": "외국인의 소송능력에 대한 특별규정", "body": "외국인은 그의 본국법에 따르면 소송능력이 없는 경우라도 대한민국의 법\n률에 따라 소송능력이 있는 경우에는 소송능력이 있는 것으로 본다."}, {"no": 58, "no_str": "제58조", "title": "법정대리권 등의 증명", "body": "①법정대리권이 있는 사실 또는 소송행위를 위한 권한을 받은 사실은 서면으로 증명하\n여야 한다. 제53조의 규정에 따라서 당사자를 선정하고 바꾸는 경우에도 또한 같다.\n②제1항의 서면은 소송기록에 붙여야 한다."}, {"no": 59, "no_str": "제59조", "title": "소송능력 등의 흠에 대한 조치", "body": "소송능력ㆍ법정대리권 또는 소송행위에 필요한 권한의 수여에 흠이 있는 경우\n에는 법원은 기간을 정하여 이를 보정(補正)하도록 명하여야 하며, 만일 보정하는 것이 지연됨으로써 손해가 생길 염\n려가 있는 경우에는 법원은 보정하기 전의 당사자 또는 법정대리인으로 하여금 일시적으로 소송행위를 하게 할 수\n있다."}, {"no": 60, "no_str": "제60조", "title": "소송능력 등의 흠과 추인", "body": "소송능력, 법정대리권 또는 소송행위에 필요한 권한의 수여에 흠이 있는 사람이 소송\n행위를 한 뒤에 보정된 당사자나 법정대리인이 이를 추인(追認)한 경우에는, 그 소송행위는 이를 한 때에 소급하여\n효력이 생긴다."}, {"no": 61, "no_str": "제61조", "title": "선정당사자에 대한 준용", "body": "제53조의 규정에 따른 당사자가 소송행위를 하는 경우에는 제59조 및 제60조의 규정\n을 준용한다."}, {"no": 62, "no_str": "제62조", "title": "제한능력자를 위한 특별대리인", "body": "① 미성년자ㆍ피한정후견인 또는 피성년후견인이 당사자인 경우, 그 친족, 이해\n관계인(미성년자ㆍ피한정후견인 또는 피성년후견인을 상대로 소송행위를 하려는 사람을 포함한다), 대리권 없는 성\n년후견인, 대리권 없는 한정후견인, 지방자치단체의 장 또는 검사는 다음 각 호의 경우에 소송절차가 지연됨으로써\n손해를 볼 염려가 있다는 것을 소명하여 수소법원(受訴法院)에 특별대리인을 선임하여 주도록 신청할 수 있다.\n1. 법정대리인이 없거나 법정대리인에게 소송에 관한 대리권이 없는 경우\n2. 법정대리인이 사실상 또는 법률상 장애로 대리권을 행사할 수 없는 경우\n3. 법정대리인의 불성실하거나 미숙한 대리권 행사로 소송절차의 진행이 현저하게 방해받는 경우\n② 법원은 소송계속 후 필요하다고 인정하는 경우 직권으로 특별대리인을 선임ㆍ개임하거나 해임할 수 있다.\n③ 특별대리인은 대리권 있는 후견인과 같은 권한이 있다. 특별대리인의 대리권의 범위에서 법정대리인의 권한은\n정지된다.\n④ 특별대리인의 선임ㆍ개임 또는 해임은 법원의 결정으로 하며, 그 결정은 특별대리인에게 송달하여야 한다.\n⑤ 특별대리인의 보수, 선임 비용 및 소송행위에 관한 비용은 소송비용에 포함된다.\n[전문개정 2016. 2. 3.]"}, {"no": 62, "no_str": "제62조의2", "title": "의사무능력자를 위한 특별대리인의 선임 등", "body": "① 의사능력이 없는 사람을 상대로 소송행위를 하려고 하거나\n의사능력이 없는 사람이 소송행위를 하는 데 필요한 경우 특별대리인의 선임 등에 관하여는 제62조를 준용한다. 다\n만, 특정후견인 또는 임의후견인도 특별대리인의 선임을 신청할 수 있다.\n② 제1항의 특별대리인이 소의 취하, 화해, 청구의 포기ㆍ인낙 또는 제80조에 따른 탈퇴를 하는 경우 법원은 그 행\n위가 본인의 이익을 명백히 침해한다고 인정할 때에는 그 행위가 있는 날부터 14일 이내에 결정으로 이를 허가하지\n아니할 수 있다. 이 결정에 대해서는 불복할 수 없다.\n[본조신설 2016. 2. 3.]"}, {"no": 63, "no_str": "제63조", "title": "법정대리권의 소멸통지", "body": "①소송절차가 진행되는 중에 법정대리권이 소멸한 경우에는 본인 또는 대리인이 상대\n방에게 소멸된 사실을 통지하지 아니하면 소멸의 효력을 주장하지 못한다. 다만, 법원에 법정대리권의 소멸사실이\n알려진 뒤에는 그 법정대리인은 제56조제2항의 소송행위를 하지 못한다.\n②제53조의 규정에 따라 당사자를 바꾸는 경우에는 제1항의 규정을 준용한다."}, {"no": 64, "no_str": "제64조", "title": "법인 등 단체의 대표자의 지위", "body": "법인의 대표자 또는 제52조의 대표자 또는 관리인에게는 이 법 가운데 법정대리\n와 법정대리인에 관한 규정을 준용한다."}, {"no": 65, "no_str": "제65조", "title": "공동소송의 요건", "body": "소송목적이 되는 권리나 의무가 여러 사람에게 공통되거나 사실상 또는 법률상 같은 원인으\n로 말미암아 생긴 경우에는 그 여러 사람이 공동소송인으로서 당사자가 될 수 있다. 소송목적이 되는 권리나 의무가\n같은 종류의 것이고, 사실상 또는 법률상 같은 종류의 원인으로 말미암은 것인 경우에도 또한 같다."}, {"no": 66, "no_str": "제66조", "title": "통상공동소송인의 지위", "body": "공동소송인 가운데 한 사람의 소송행위 또는 이에 대한 상대방의 소송행위와 공동소송\n인 가운데 한 사람에 관한 사항은 다른 공동소송인에게 영향을 미치지 아니한다."}, {"no": 67, "no_str": "제67조", "title": "필수적 공동소송에 대한 특별규정", "body": "①소송목적이 공동소송인 모두에게 합일적으로 확정되어야 할 공동소송의\n경우에 공동소송인 가운데 한 사람의 소송행위는 모두의 이익을 위하여서만 효력을 가진다.\n②제1항의 공동소송에서 공동소송인 가운데 한 사람에 대한 상대방의 소송행위는 공동소송인 모두에게 효력이 미\n친다.\n③제1항의 공동소송에서 공동소송인 가운데 한 사람에게 소송절차를 중단 또는 중지하여야 할 이유가 있는 경우 그\n중단 또는 중지는 모두에게 효력이 미친다."}, {"no": 68, "no_str": "제68조", "title": "필수적 공동소송인의 추가", "body": "①법원은 제67조제1항의 규정에 따른 공동소송인 가운데 일부가 누락된 경우에는\n제1심의 변론을 종결할 때까지 원고의 신청에 따라 결정으로 원고 또는 피고를 추가하도록 허가할 수 있다. 다만, 원\n고의 추가는 추가될 사람의 동의를 받은 경우에만 허가할 수 있다.\n②제1항의 허가결정을 한 때에는 허가결정의 정본을 당사자 모두에게 송달하여야 하며, 추가될 당사자에게는 소장\n부본도 송달하여야 한다.\n③제1항의 규정에 따라 공동소송인이 추가된 경우에는 처음의 소가 제기된 때에 추가된 당사자와의 사이에 소가 제\n기된 것으로 본다.\n④제1항의 허가결정에 대하여 이해관계인은 추가될 원고의 동의가 없었다는 것을 사유로 하는 경우에만 즉시항고\n를 할 수 있다.\n⑤제4항의 즉시항고는 집행정지의 효력을 가지지 아니한다.\n⑥제1항의 신청을 기각한 결정에 대하여는 즉시항고를 할 수 있다."}, {"no": 69, "no_str": "제69조", "title": "필수적 공동소송에 대한 특별규정", "body": "제67조제1항의 공동소송인 가운데 한 사람이 상소를 제기한 경우에 다른 공\n동소송인이 그 상소심에서 하는 소송행위에는 제56조제1항의 규정을 준용한다."}, {"no": 70, "no_str": "제70조", "title": "예비적ㆍ선택적 공동소송에 대한 특별규정", "body": "①공동소송인 가운데 일부의 청구가 다른 공동소송인의 청구와 법\n률상 양립할 수 없거나 공동소송인 가운데 일부에 대한 청구가 다른 공동소송인에 대한 청구와 법률상 양립할 수 없\n는 경우에는 제67조 내지 제69조를 준용한다. 다만, 청구의 포기ㆍ인낙, 화해 및 소의 취하의 경우에는 그러하지 아\n니하다.\n②제1항의 소송에서는 모든 공동소송인에 관한 청구에 대하여 판결을 하여야 한다."}, {"no": 71, "no_str": "제71조", "title": "보조참가", "body": "소송결과에 이해관계가 있는 제3자는 한 쪽 당사자를 돕기 위하여 법원에 계속중인 소송에 참가할\n수 있다. 다만, 소송절차를 현저하게 지연시키는 경우에는 그러하지 아니하다."}, {"no": 72, "no_str": "제72조", "title": "참가신청의 방식", "body": "①참가신청은 참가의 취지와 이유를 밝혀 참가하고자 하는 소송이 계속된 법원에 제기하여야\n한다.\n②서면으로 참가를 신청한 경우에는 법원은 그 서면을 양쪽 당사자에게 송달하여야 한다.\n③참가신청은 참가인으로서 할 수 있는 소송행위와 동시에 할 수 있다."}, {"no": 73, "no_str": "제73조", "title": "참가허가여부에 대한 재판", "body": "①당사자가 참가에 대하여 이의를 신청한 때에는 참가인은 참가의 이유를 소명하여\n야 하며, 법원은 참가를 허가할 것인지 아닌지를 결정하여야 한다.\n②법원은 직권으로 참가인에게 참가의 이유를 소명하도록 명할 수 있으며, 참가의 이유가 있다고 인정되지 아니하\n는 때에는 참가를 허가하지 아니하는 결정을 하여야 한다.\n③제1항 및 제2항의 결정에 대하여는 즉시항고를 할 수 있다."}, {"no": 74, "no_str": "제74조", "title": "이의신청권의 상실", "body": "당사자가 참가에 대하여 이의를 신청하지 아니한 채 변론하거나 변론준비기일에서 진술을\n한 경우에는 이의를 신청할 권리를 잃는다."}, {"no": 75, "no_str": "제75조", "title": "참가인의 소송관여", "body": "①참가인은 그의 참가에 대한 이의신청이 있는 경우라도 참가를 허가하지 아니하는 결정이\n확정될 때까지 소송행위를 할 수 있다.\n②당사자가 참가인의 소송행위를 원용(援用)한 경우에는 참가를 허가하지 아니하는 결정이 확정되어도 그 소송행위\n는 효력을 가진다."}, {"no": 76, "no_str": "제76조", "title": "참가인의 소송행위", "body": "①참가인은 소송에 관하여 공격ㆍ방어ㆍ이의ㆍ상소, 그 밖의 모든 소송행위를 할 수 있다.\n다만, 참가할 때의 소송의 진행정도에 따라 할 수 없는 소송행위는 그러하지 아니하다.\n②참가인의 소송행위가 피참가인의 소송행위에 어긋나는 경우에는 그 참가인의 소송행위는 효력을 가지지 아니한\n다."}, {"no": 77, "no_str": "제77조", "title": "참가인에 대한 재판의 효력", "body": "재판은 다음 각호 가운데 어느 하나에 해당하지 아니하면 참가인에게도 그 효력이\n미친다.\n1. 제76조의 규정에 따라 참가인이 소송행위를 할 수 없거나, 그 소송행위가 효력을 가지지 아니하는 때\n2. 피참가인이 참가인의 소송행위를 방해한 때\n3. 피참가인이 참가인이 할 수 없는 소송행위를 고의나 과실로 하지 아니한 때"}, {"no": 78, "no_str": "제78조", "title": "공동소송적 보조참가", "body": "재판의 효력이 참가인에게도 미치는 경우에는 그 참가인과 피참가인에 대하여 제67조 및\n제69조를 준용한다."}, {"no": 79, "no_str": "제79조", "title": "독립당사자참가", "body": "①소송목적의 전부나 일부가 자기의 권리라고 주장하거나, 소송결과에 따라 권리가 침해된다\n고 주장하는 제3자는 당사자의 양 쪽 또는 한 쪽을 상대방으로 하여 당사자로서 소송에 참가할 수 있다.\n②제1항의 경우에는 제67조 및 제72조의 규정을 준용한다."}, {"no": 80, "no_str": "제80조", "title": "독립당사자참가소송에서의 탈퇴", "body": "제79조의 규정에 따라 자기의 권리를 주장하기 위하여 소송에 참가한 사람이\n있는 경우 그가 참가하기 전의 원고나 피고는 상대방의 승낙을 받아 소송에서 탈퇴할 수 있다. 다만, 판결은 탈퇴한\n당사자에 대하여도 그 효력이 미친다."}, {"no": 81, "no_str": "제81조", "title": "승계인의 소송참가", "body": "소송이 법원에 계속되어 있는 동안에 제3자가 소송목적인 권리 또는 의무의 전부나 일부를\n승계하였다고 주장하며 제79조의 규정에 따라 소송에 참가한 경우 그 참가는 소송이 법원에 처음 계속된 때에 소급\n하여 시효의 중단 또는 법률상 기간준수의 효력이 생긴다."}, {"no": 82, "no_str": "제82조", "title": "승계인의 소송인수", "body": "①소송이 법원에 계속되어 있는 동안에 제3자가 소송목적인 권리 또는 의무의 전부나 일부\n를 승계한 때에는 법원은 당사자의 신청에 따라 그 제3자로 하여금 소송을 인수하게 할 수 있다.\n②법원은 제1항의 규정에 따른 결정을 할 때에는 당사자와 제3자를 심문(審問)하여야 한다.\n③제1항의 소송인수의 경우에는 제80조의 규정 가운데 탈퇴 및 판결의 효력에 관한 것과, 제81조의 규정 가운데 참\n가의 효력에 관한 것을 준용한다."}, {"no": 83, "no_str": "제83조", "title": "공동소송참가", "body": "①소송목적이 한 쪽 당사자와 제3자에게 합일적으로 확정되어야 할 경우 그 제3자는 공동소송인\n으로 소송에 참가할 수 있다.\n②제1항의 경우에는 제72조의 규정을 준용한다."}, {"no": 84, "no_str": "제84조", "title": "소송고지의 요건", "body": "①소송이 법원에 계속된 때에는 당사자는 참가할 수 있는 제3자에게 소송고지(訴訟告知)를 할\n수 있다.\n②소송고지를 받은 사람은 다시 소송고지를 할 수 있다."}, {"no": 85, "no_str": "제85조", "title": "소송고지의 방식", "body": "①소송고지를 위하여서는 그 이유와 소송의 진행정도를 적은 서면을 법원에 제출하여야 한다\n.\n②제1항의 서면은 상대방에게 송달하여야 한다."}, {"no": 86, "no_str": "제86조", "title": "소송고지의 효과", "body": "소송고지를 받은 사람이 참가하지 아니한 경우라도 제77조의 규정을 적용할 때에는 참가할\n수 있었을 때에 참가한 것으로 본다."}, {"no": 87, "no_str": "제87조", "title": "소송대리인의 자격", "body": "법률에 따라 재판상 행위를 할 수 있는 대리인 외에는 변호사가 아니면 소송대리인이 될 수\n없다."}, {"no": 88, "no_str": "제88조", "title": "소송대리인의 자격의 예외", "body": "①단독판사가 심리ㆍ재판하는 사건 가운데 그 소송목적의 값이 일정한 금액 이하인\n사건에서, 당사자와 밀접한 생활관계를 맺고 있고 일정한 범위안의 친족관계에 있는 사람 또는 당사자와 고용계약\n등으로 그 사건에 관한 통상사무를 처리ㆍ보조하여 오는 등 일정한 관계에 있는 사람이 법원의 허가를 받은 때에는\n제87조를 적용하지 아니한다.\n②제1항의 규정에 따라 법원의 허가를 받을 수 있는 사건의 범위, 대리인의 자격 등에 관한 구체적인 사항은 대법원\n규칙으로 정한다.\n③법원은 언제든지 제1항의 허가를 취소할 수 있다."}, {"no": 89, "no_str": "제89조", "title": "소송대리권의 증명", "body": "①소송대리인의 권한은 서면으로 증명하여야 한다.\n②제1항의 서면이 사문서인 경우에는 법원은 공증인, 그 밖의 공증업무를 보는 사람(이하 “공증사무소”라 한다)의\n인증을 받도록 소송대리인에게 명할 수 있다.\n③당사자가 말로 소송대리인을 선임하고, 법원사무관등이 조서에 그 진술을 적어 놓은 경우에는 제1항 및 제2항의\n규정을 적용하지 아니한다."}, {"no": 90, "no_str": "제90조", "title": "소송대리권의 범위", "body": "①소송대리인은 위임을 받은 사건에 대하여 반소(反訴)ㆍ참가ㆍ강제집행ㆍ가압류ㆍ가처분\n에 관한 소송행위 등 일체의 소송행위와 변제(辨濟)의 영수를 할 수 있다.\n②소송대리인은 다음 각호의 사항에 대하여는 특별한 권한을 따로 받아야 한다.\n1. 반소의 제기\n2. 소의 취하, 화해, 청구의 포기ㆍ인낙 또는 제80조의 규정에 따른 탈퇴\n3. 상소의 제기 또는 취하\n4. 대리인의 선임"}, {"no": 91, "no_str": "제91조", "title": "소송대리권의 제한", "body": "소송대리권은 제한하지 못한다. 다만, 변호사가 아닌 소송대리인에 대하여는 그러하지 아니\n하다."}, {"no": 92, "no_str": "제92조", "title": "법률에 의한 소송대리인의 권한", "body": "법률에 의하여 재판상 행위를 할 수 있는 대리인의 권한에는 제90조와 제91조\n의 규정을 적용하지 아니한다."}, {"no": 93, "no_str": "제93조", "title": "개별대리의 원칙", "body": "①여러 소송대리인이 있는 때에는 각자가 당사자를 대리한다.\n②당사자가 제1항의 규정에 어긋나는 약정을 한 경우 그 약정은 효력을 가지지 못한다."}, {"no": 94, "no_str": "제94조", "title": "당사자의 경정권", "body": "소송대리인의 사실상 진술은 당사자가 이를 곧 취소하거나 경정(更正)한 때에는 그 효력을 잃\n는다."}, {"no": 95, "no_str": "제95조", "title": "소송대리권이 소멸되지 아니하는 경우", "body": "다음 각호 가운데 어느 하나에 해당하더라도 소송대리권은 소멸되지 아\n니한다.\n1. 당사자의 사망 또는 소송능력의 상실\n2. 당사자인 법인의 합병에 의한 소멸\n3. 당사자인 수탁자(受託者)의 신탁임무의 종료\n4. 법정대리인의 사망, 소송능력의 상실 또는 대리권의 소멸ㆍ변경"}, {"no": 96, "no_str": "제96조", "title": "소송대리권이 소멸되지 아니하는 경우", "body": "①일정한 자격에 의하여 자기의 이름으로 남을 위하여 소송당사자가 된\n사람에게 소송대리인이 있는 경우에 그 소송대리인의 대리권은 당사자가 자격을 잃더라도 소멸되지 아니한다.\n②제53조의 규정에 따라 선정된 당사자가 그 자격을 잃은 경우에는 제1항의 규정을 준용한다."}, {"no": 97, "no_str": "제97조", "title": "법정대리인에 관한 규정의 준용", "body": "소송대리인에게는 제58조제2항ㆍ제59조ㆍ제60조 및 제63조의 규정을 준용한\n다."}, {"no": 98, "no_str": "제98조", "title": "소송비용부담의 원칙", "body": "소송비용은 패소한 당사자가 부담한다."}, {"no": 99, "no_str": "제99조", "title": "원칙에 대한 예외", "body": "법원은 사정에 따라 승소한 당사자로 하여금 그 권리를 늘리거나 지키는 데 필요하지 아니한\n행위로 말미암은 소송비용 또는 상대방의 권리를 늘리거나 지키는 데 필요한 행위로 말미암은 소송비용의 전부나\n일부를 부담하게 할 수 있다."}, {"no": 100, "no_str": "제100조", "title": "원칙에 대한 예외", "body": "당사자가 적당한 시기에 공격이나 방어의 방법을 제출하지 아니하였거나, 기일이나 기간의\n준수를 게을리 하였거나, 그 밖에 당사자가 책임져야 할 사유로 소송이 지연된 때에는 법원은 지연됨으로 말미암은\n소송비용의 전부나 일부를 승소한 당사자에게 부담하게 할 수 있다."}, {"no": 101, "no_str": "제101조", "title": "일부패소의 경우", "body": "일부패소의 경우에 당사자들이 부담할 소송비용은 법원이 정한다. 다만, 사정에 따라 한 쪽\n당사자에게 소송비용의 전부를 부담하게 할 수 있다."}, {"no": 102, "no_str": "제102조", "title": "공동소송의 경우", "body": "①공동소송인은 소송비용을 균등하게 부담한다. 다만, 법원은 사정에 따라 공동소송인에게\n소송비용을 연대하여 부담하게 하거나 다른 방법으로 부담하게 할 수 있다.\n②제1항의 규정에 불구하고 법원은 권리를 늘리거나 지키는 데 필요하지 아니한 행위로 생긴 소송비용은 그 행위를\n한 당사자에게 부담하게 할 수 있다."}, {"no": 103, "no_str": "제103조", "title": "참가소송의 경우", "body": "참가소송비용에 대한 참가인과 상대방 사이의 부담과, 참가이의신청의 소송비용에 대한 참\n가인과 이의신청 당사자 사이의 부담에 대하여는 제98조 내지 제102조의 규정을 준용한다."}, {"no": 104, "no_str": "제104조", "title": "각 심급의 소송비용의 재판", "body": "법원은 사건을 완결하는 재판에서 직권으로 그 심급의 소송비용 전부에 대하여\n재판하여야 한다. 다만, 사정에 따라 사건의 일부나 중간의 다툼에 관한 재판에서 그 비용에 대한 재판을 할 수 있다."}, {"no": 105, "no_str": "제105조", "title": "소송의 총비용에 대한 재판", "body": "상급법원이 본안의 재판을 바꾸는 경우 또는 사건을 환송받거나 이송받은 법원이\n그 사건을 완결하는 재판을 하는 경우에는 소송의 총비용에 대하여 재판하여야 한다."}, {"no": 106, "no_str": "제106조", "title": "화해한 경우의 비용부담", "body": "당사자가 법원에서 화해한 경우(제231조의 경우를 포함한다) 화해비용과 소송비용의\n부담에 대하여 특별히 정한 바가 없으면 그 비용은 당사자들이 각자 부담한다."}, {"no": 107, "no_str": "제107조", "title": "제3자의 비용상환", "body": "①법정대리인ㆍ소송대리인ㆍ법원사무관등이나 집행관이 고의 또는 중대한 과실로 쓸데없\n는 비용을 지급하게 한 경우에는 수소법원은 직권으로 또는 당사자의 신청에 따라 그에게 비용을 갚도록 명할 수 있\n다.\n②법정대리인 또는 소송대리인으로서 소송행위를 한 사람이 그 대리권 또는 소송행위에 필요한 권한을 받았음을\n증명하지 못하거나, 추인을 받지 못한 경우에 그 소송행위로 말미암아 발생한 소송비용에 대하여는 제1항의 규정을\n준용한다.\n③제1항 및 제2항의 결정에 대하여는 즉시항고를 할 수 있다."}, {"no": 108, "no_str": "제108조", "title": "무권대리인의 비용부담", "body": "제107조제2항의 경우에 소가 각하된 경우에는 소송비용은 그 소송행위를 한 대리인\n이 부담한다."}, {"no": 109, "no_str": "제109조", "title": "변호사의 보수와 소송비용", "body": "①소송을 대리한 변호사에게 당사자가 지급하였거나 지급할 보수는 대법원규칙이\n정하는 금액의 범위안에서 소송비용으로 인정한다.\n②제1항의 소송비용을 계산할 때에는 여러 변호사가 소송을 대리하였더라도 한 변호사가 대리한 것으로 본다."}, {"no": 110, "no_str": "제110조", "title": "소송비용액의 확정결정", "body": "①소송비용의 부담을 정하는 재판에서 그 액수가 정하여지지 아니한 경우에 제1심 법\n원은 그 재판이 확정되거나, 소송비용부담의 재판이 집행력을 갖게된 후에 당사자의 신청을 받아 결정으로 그 소송\n비용액을 확정한다.\n②제1항의 확정결정을 신청할 때에는 비용계산서, 그 등본과 비용액을 소명하는 데 필요한 서면을 제출하여야 한다\n.\n③제1항의 결정에 대하여는 즉시항고를 할 수 있다."}, {"no": 111, "no_str": "제111조", "title": "상대방에 대한 최고", "body": "①법원은 소송비용액을 결정하기 전에 상대방에게 비용계산서의 등본을 교부하고, 이에\n대한 진술을 할 것과 일정한 기간 이내에 비용계산서와 비용액을 소명하는 데 필요한 서면을 제출할 것을 최고(催告\n)하여야 한다.\n②상대방이 제1항의 서면을 기간 이내에 제출하지 아니한 때에는 법원은 신청인의 비용에 대하여서만 결정할 수 있\n다. 다만, 상대방도 제110조제1항의 확정결정을 신청할 수 있다."}, {"no": 112, "no_str": "제112조", "title": "부담비용의 상계", "body": "법원이 소송비용을 결정하는 경우에 당사자들이 부담할 비용은 대등한 금액에서 상계(相計\n)된 것으로 본다. 다만, 제111조제2항의 경우에는 그러하지 아니하다."}, {"no": 113, "no_str": "제113조", "title": "화해한 경우의 비용액확정", "body": "①제106조의 경우에 당사자가 소송비용부담의 원칙만을 정하고 그 액수를 정하지\n아니한 때에는 법원은 당사자의 신청에 따라 결정으로 그 액수를 정하여야 한다.\n②제1항의 경우에는 제110조제2항ㆍ제3항, 제111조 및 제112조의 규정을 준용한다."}, {"no": 114, "no_str": "제114조", "title": "소송이 재판에 의하지 아니하고 끝난 경우", "body": "①제113조의 경우 외에 소송이 재판에 의하지 아니하고 끝나거나\n참가 또는 이에 대한 이의신청이 취하된 경우에는 법원은 당사자의 신청에 따라 결정으로 소송비용의 액수를 정하\n고, 이를 부담하도록 명하여야 한다.\n②제1항의 경우에는 제98조 내지 제103조, 제110조제2항ㆍ제3항, 제111조 및 제112조의 규정을 준용한다."}, {"no": 115, "no_str": "제115조", "title": "법원사무관등에 의한 계산", "body": "제110조제1항의 신청이 있는 때에는 법원은 법원사무관등에게 소송비용액을 계산\n하게 하여야 한다."}, {"no": 116, "no_str": "제116조", "title": "비용의 예납", "body": "①비용을 필요로 하는 소송행위에 대하여 법원은 당사자에게 그 비용을 미리 내게 할 수 있다.\n②비용을 미리 내지 아니하는 때에는 법원은 그 소송행위를 하지 아니할 수 있다."}, {"no": 117, "no_str": "제117조", "title": "담보제공의무", "body": "① 원고가 대한민국에 주소ㆍ사무소와 영업소를 두지 아니한 때 또는 소장ㆍ준비서면, 그 밖의\n소송기록에 의하여 청구가 이유 없음이 명백한 때 등 소송비용에 대한 담보제공이 필요하다고 판단되는 경우에 피\n고의 신청이 있으면 법원은 원고에게 소송비용에 대한 담보를 제공하도록 명하여야 한다. 담보가 부족한 경우에도\n또한 같다. <개정 2010. 7. 23.>\n② 제1항의 경우에 법원은 직권으로 원고에게 소송비용에 대한 담보를 제공하도록 명할 수 있다.<신설 2010. 7.\n23.>\n③청구의 일부에 대하여 다툼이 없는 경우에는 그 액수가 담보로 충분하면 제1항의 규정을 적용하지 아니한다.<개\n정 2010. 7. 23.>"}, {"no": 118, "no_str": "제118조", "title": "소송에 응함으로 말미암은 신청권의 상실", "body": "담보를 제공할 사유가 있다는 것을 알고도 피고가 본안에 관하여\n변론하거나 변론준비기일에서 진술한 경우에는 담보제공을 신청하지 못한다."}, {"no": 119, "no_str": "제119조", "title": "피고의 거부권", "body": "담보제공을 신청한 피고는 원고가 담보를 제공할 때까지 소송에 응하지 아니할 수 있다."}, {"no": 120, "no_str": "제120조", "title": "담보제공결정", "body": "①법원은 담보를 제공하도록 명하는 결정에서 담보액과 담보제공의 기간을 정하여야 한다.\n②담보액은 피고가 각 심급에서 지출할 비용의 총액을 표준으로 하여 정하여야 한다."}, {"no": 121, "no_str": "제121조", "title": "불복신청", "body": "담보제공신청에 관한 결정에 대하여는 즉시항고를 할 수 있다."}, {"no": 122, "no_str": "제122조", "title": "담보제공방식", "body": "담보의 제공은 금전 또는 법원이 인정하는 유가증권을 공탁(供託)하거나, 대법원규칙이 정하는\n바에 따라 지급을 보증하겠다는 위탁계약을 맺은 문서를 제출하는 방법으로 한다. 다만, 당사자들 사이에 특별한 약\n정이 있으면 그에 따른다."}, {"no": 123, "no_str": "제123조", "title": "담보물에 대한 피고의 권리", "body": "피고는 소송비용에 관하여 제122조의 규정에 따른 담보물에 대하여 질권자와 동\n일한 권리를 가진다."}, {"no": 124, "no_str": "제124조", "title": "담보를 제공하지 아니한 효과", "body": "담보를 제공하여야 할 기간 이내에 원고가 이를 제공하지 아니하는 때에는 법\n원은 변론없이 판결로 소를 각하할 수 있다. 다만, 판결하기 전에 담보를 제공한 때에는 그러하지 아니하다."}, {"no": 125, "no_str": "제125조", "title": "담보의 취소", "body": "①담보제공자가 담보하여야 할 사유가 소멸되었음을 증명하면서 취소신청을 하면, 법원은 담보\n취소결정을 하여야 한다.\n②담보제공자가 담보취소에 대한 담보권리자의 동의를 받았음을 증명한 때에도 제1항과 같다.\n③소송이 완결된 뒤 담보제공자가 신청하면, 법원은 담보권리자에게 일정한 기간 이내에 그 권리를 행사하도록 최\n고하고, 담보권리자가 그 행사를 하지 아니하는 때에는 담보취소에 대하여 동의한 것으로 본다.\n④제1항과 제2항의 규정에 따른 결정에 대하여는 즉시항고를 할 수 있다."}, {"no": 126, "no_str": "제126조", "title": "담보물변경", "body": "법원은 담보제공자의 신청에 따라 결정으로 공탁한 담보물을 바꾸도록 명할 수 있다. 다만, 당사\n자가 계약에 의하여 공탁한 담보물을 다른 담보로 바꾸겠다고 신청한 때에는 그에 따른다."}, {"no": 127, "no_str": "제127조", "title": "준용규정", "body": "다른 법률에 따른 소제기에 관하여 제공되는 담보에는 제119조, 제120조제1항, 제121조 내지 제\n126조의 규정을 준용한다."}, {"no": 128, "no_str": "제128조", "title": "구조의 요건", "body": "①법원은 소송비용을 지출할 자금능력이 부족한 사람의 신청에 따라 또는 직권으로 소송구조(訴\n訟救助)를 할 수 있다. 다만, 패소할 것이 분명한 경우에는 그러하지 아니하다.\n② 제1항 단서에 해당하는 경우 같은 항 본문에 따른 소송구조 신청에 필요한 소송비용과 제133조에 따른 불복신청\n에 필요한 소송비용에 대하여도 소송구조를 하지 아니한다.<신설 2023. 4. 18.>\n③제1항의 신청인은 구조의 사유를 소명하여야 한다.<개정 2023. 4. 18.>\n④소송구조에 대한 재판은 소송기록을 보관하고 있는 법원이 한다.<개정 2023. 4. 18.>\n⑤제1항에서 정한 소송구조요건의 구체적인 내용과 소송구조절차에 관하여 상세한 사항은 대법원규칙으로 정한다.\n<개정 2023. 4. 18.>"}, {"no": 129, "no_str": "제129조", "title": "구조의 객관적 범위", "body": "①소송과 강제집행에 대한 소송구조의 범위는 다음 각호와 같다. 다만, 법원은 상당한 이\n유가 있는 때에는 다음 각호 가운데 일부에 대한 소송구조를 할 수 있다.\n1. 재판비용의 납입유예\n2. 변호사 및 집행관의 보수와 체당금(替當金)의 지급유예\n3. 소송비용의 담보면제\n4. 대법원규칙이 정하는 그 밖의 비용의 유예나 면제\n②제1항제2호의 경우에는 변호사나 집행관이 보수를 받지 못하면 국고에서 상당한 금액을 지급한다."}, {"no": 130, "no_str": "제130조", "title": "구조효력의 주관적 범위", "body": "①소송구조는 이를 받은 사람에게만 효력이 미친다.\n②법원은 소송승계인에게 미루어 둔 비용의 납입을 명할 수 있다."}, {"no": 131, "no_str": "제131조", "title": "구조의 취소", "body": "소송구조를 받은 사람이 소송비용을 납입할 자금능력이 있다는 것이 판명되거나, 자금능력이 있\n게 된 때에는 소송기록을 보관하고 있는 법원은 직권으로 또는 이해관계인의 신청에 따라 언제든지 구조를 취소하\n고, 납입을 미루어 둔 소송비용을 지급하도록 명할 수 있다."}, {"no": 132, "no_str": "제132조", "title": "납입유예비용의 추심", "body": "①소송구조를 받은 사람에게 납입을 미루어 둔 비용은 그 부담의 재판을 받은 상대방으\n로부터 직접 지급받을 수 있다.\n②제1항의 경우에 변호사 또는 집행관은 소송구조를 받은 사람의 집행권원으로 보수와 체당금에 관한 비용액의 확\n정결정신청과 강제집행을 할 수 있다.\n③변호사 또는 집행관은 보수와 체당금에 대하여 당사자를 대위(代位)하여 제113조 또는 제114조의 결정신청을 할\n수 있다."}, {"no": 133, "no_str": "제133조", "title": "불복신청", "body": "이 절에 규정한 재판에 대하여는 즉시항고를 할 수 있다. 다만, 상대방은 제129조제1항제3호의 소송\n구조결정을 제외하고는 불복할 수 없다."}, {"no": 134, "no_str": "제134조", "title": "변론의 필요성", "body": "①당사자는 소송에 대하여 법원에서 변론하여야 한다. 다만, 결정으로 완결할 사건에 대하여는\n법원이 변론을 열 것인지 아닌지를 정한다.\n②제1항 단서의 규정에 따라 변론을 열지 아니할 경우에, 법원은 당사자와 이해관계인, 그 밖의 참고인을 심문할 수\n있다.\n③이 법에 특별한 규정이 있는 경우에는 제1항과 제2항의 규정을 적용하지 아니한다."}, {"no": 135, "no_str": "제135조", "title": "재판장의 지휘권", "body": "①변론은 재판장(합의부의 재판장 또는 단독판사를 말한다. 이하 같다)이 지휘한다.\n②재판장은 발언을 허가하거나 그의 명령에 따르지 아니하는 사람의 발언을 금지할 수 있다."}, {"no": 136, "no_str": "제136조", "title": "석명권（釋明權）ㆍ구문권（求問權） 등", "body": "①재판장은 소송관계를 분명하게 하기 위하여 당사자에게 사실상\n또는 법률상 사항에 대하여 질문할 수 있고, 증명을 하도록 촉구할 수 있다.\n②합의부원은 재판장에게 알리고 제1항의 행위를 할 수 있다.\n③당사자는 필요한 경우 재판장에게 상대방에 대하여 설명을 요구하여 줄 것을 요청할 수 있다.\n④법원은 당사자가 간과하였음이 분명하다고 인정되는 법률상 사항에 관하여 당사자에게 의견을 진술할 기회를 주\n어야 한다."}, {"no": 137, "no_str": "제137조", "title": "석명준비명령", "body": "재판장은 제136조의 규정에 따라 당사자에게 설명 또는 증명하거나 의견을 진술할 사항을 지\n적하고 변론기일 이전에 이를 준비하도록 명할 수 있다."}, {"no": 138, "no_str": "제138조", "title": "합의부에 의한 감독", "body": "당사자가 변론의 지휘에 관한 재판장의 명령 또는 제136조 및 제137조의 규정에 따른 재\n판장이나 합의부원의 조치에 대하여 이의를 신청한 때에는 법원은 결정으로 그 이의신청에 대하여 재판한다."}, {"no": 139, "no_str": "제139조", "title": "수명법관의 지정 및 촉탁", "body": "①수명법관으로 하여금 그 직무를 수행하게 하고자 할 경우에는 재판장이 그 판사\n를 지정한다.\n②법원이 하는 촉탁은 특별한 규정이 없으면 재판장이 한다."}, {"no": 140, "no_str": "제140조", "title": "법원의 석명처분", "body": "①법원은 소송관계를 분명하게 하기 위하여 다음 각호의 처분을 할 수 있다.\n1. 당사자 본인 또는 그 법정대리인에게 출석하도록 명하는 일\n2. 소송서류 또는 소송에 인용한 문서, 그 밖의 물건으로서 당사자가 가지고 있는 것을 제출하게 하는 일\n3. 당사자 또는 제3자가 제출한 문서, 그 밖의 물건을 법원에 유치하는 일\n4. 검증을 하고 감정을 명하는 일\n5. 필요한 조사를 촉탁하는 일\n②제1항의 검증ㆍ감정과 조사의 촉탁에는 이 법의 증거조사에 관한 규정을 준용한다."}, {"no": 141, "no_str": "제141조", "title": "변론의 제한ㆍ분리ㆍ병합", "body": "법원은 변론의 제한ㆍ분리 또는 병합을 명하거나, 그 명령을 취소할 수 있다."}, {"no": 142, "no_str": "제142조", "title": "변론의 재개", "body": "법원은 종결된 변론을 다시 열도록 명할 수 있다."}, {"no": 143, "no_str": "제143조", "title": "통역", "body": "①변론에 참여하는 사람이 우리말을 하지 못하거나, 듣거나 말하는 데 장애가 있으면 통역인에게 통역하\n게 하여야 한다. 다만, 위와 같은 장애가 있는 사람에게는 문자로 질문하거나 진술하게 할 수 있다.\n②통역인에게는 이 법의 감정인에 관한 규정을 준용한다."}, {"no": 143, "no_str": "제143조의2", "title": "진술 보조", "body": "① 질병, 장애, 연령, 그 밖의 사유로 인한 정신적ㆍ신체적 제약으로 소송관계를 분명하게 하기\n위하여 필요한 진술을 하기 어려운 당사자는 법원의 허가를 받아 진술을 도와주는 사람과 함께 출석하여 진술할 수\n있다.\n② 법원은 언제든지 제1항의 허가를 취소할 수 있다.\n③ 제1항 및 제2항에 따른 진술보조인의 자격 및 소송상 지위와 역할, 법원의 허가 요건ㆍ절차 등 허가 및 취소에\n관한 사항은 대법원규칙으로 정한다.\n[본조신설 2016. 2. 3.]"}, {"no": 144, "no_str": "제144조", "title": "변론능력이 없는 사람에 대한 조치", "body": "①법원은 소송관계를 분명하게 하기 위하여 필요한 진술을 할 수 없는 당\n사자 또는 대리인의 진술을 금지하고, 변론을 계속할 새 기일을 정할 수 있다.\n②제1항의 규정에 따라 진술을 금지하는 경우에 필요하다고 인정하면 법원은 변호사를 선임하도록 명할 수 있다.\n③제1항 또는 제2항의 규정에 따라 대리인에게 진술을 금지하거나 변호사를 선임하도록 명하였을 때에는 본인에게\n그 취지를 통지하여야 한다.\n④소 또는 상소를 제기한 사람이 제2항의 규정에 따른 명령을 받고도 제1항의 새 기일까지 변호사를 선임하지 아니\n한 때에는 법원은 결정으로 소 또는 상소를 각하할 수 있다.\n⑤제4항의 결정에 대하여는 즉시항고를 할 수 있다."}, {"no": 145, "no_str": "제145조", "title": "화해의 권고", "body": "①법원은 소송의 정도와 관계없이 화해를 권고하거나, 수명법관 또는 수탁판사로 하여금 권고하\n게 할 수 있다.\n②제1항의 경우에 법원ㆍ수명법관 또는 수탁판사는 당사자 본인이나 그 법정대리인의 출석을 명할 수 있다."}, {"no": 146, "no_str": "제146조", "title": "적시제출주의", "body": "공격 또는 방어의 방법은 소송의 정도에 따라 적절한 시기에 제출하여야 한다."}, {"no": 147, "no_str": "제147조", "title": "제출기간의 제한", "body": "①재판장은 당사자의 의견을 들어 한 쪽 또는 양 쪽 당사자에 대하여 특정한 사항에 관하여\n주장을 제출하거나 증거를 신청할 기간을 정할 수 있다.\n②당사자가 제1항의 기간을 넘긴 때에는 주장을 제출하거나 증거를 신청할 수 없다. 다만, 당사자가 정당한 사유로\n그 기간 이내에 제출 또는 신청하지 못하였다는 것을 소명한 경우에는 그러하지 아니하다."}, {"no": 148, "no_str": "제148조", "title": "한 쪽 당사자가 출석하지 아니한 경우", "body": "①원고 또는 피고가 변론기일에 출석하지 아니하거나, 출석하고서도 본\n안에 관하여 변론하지 아니한 때에는 그가 제출한 소장ㆍ답변서, 그 밖의 준비서면에 적혀 있는 사항을 진술한 것으\n로 보고 출석한 상대방에게 변론을 명할 수 있다.\n②제1항의 규정에 따라 당사자가 진술한 것으로 보는 답변서, 그 밖의 준비서면에 청구의 포기 또는 인낙의 의사표\n시가 적혀 있고 공증사무소의 인증을 받은 때에는 그 취지에 따라 청구의 포기 또는 인낙이 성립된 것으로 본다.\n③제1항의 규정에 따라 당사자가 진술한 것으로 보는 답변서, 그 밖의 준비서면에 화해의 의사표시가 적혀 있고 공\n증사무소의 인증을 받은 경우에, 상대방 당사자가 변론기일에 출석하여 그 화해의 의사표시를 받아들인 때에는 화\n해가 성립된 것으로 본다."}, {"no": 149, "no_str": "제149조", "title": "실기한 공격ㆍ방어방법의 각하", "body": "①당사자가 제146조의 규정을 어기어 고의 또는 중대한 과실로 공격 또는 방\n어방법을 뒤늦게 제출함으로써 소송의 완결을 지연시키게 하는 것으로 인정할 때에는 법원은 직권으로 또는 상대방\n의 신청에 따라 결정으로 이를 각하할 수 있다.\n②당사자가 제출한 공격 또는 방어방법의 취지가 분명하지 아니한 경우에, 당사자가 필요한 설명을 하지 아니하거\n나 설명할 기일에 출석하지 아니한 때에는 법원은 직권으로 또는 상대방의 신청에 따라 결정으로 이를 각하할 수\n있다."}, {"no": 150, "no_str": "제150조", "title": "자백간주", "body": "①당사자가 변론에서 상대방이 주장하는 사실을 명백히 다투지 아니한 때에는 그 사실을 자백한 것\n으로 본다. 다만, 변론 전체의 취지로 보아 그 사실에 대하여 다툰 것으로 인정되는 경우에는 그러하지 아니하다.\n②상대방이 주장한 사실에 대하여 알지 못한다고 진술한 때에는 그 사실을 다툰 것으로 추정한다.\n③당사자가 변론기일에 출석하지 아니하는 경우에는 제1항의 규정을 준용한다. 다만, 공시송달의 방법으로 기일통\n지서를 송달받은 당사자가 출석하지 아니한 경우에는 그러하지 아니하다."}, {"no": 151, "no_str": "제151조", "title": "소송절차에 관한 이의권", "body": "당사자는 소송절차에 관한 규정에 어긋난 것임을 알거나, 알 수 있었을 경우에 바로\n이의를 제기하지 아니하면 그 권리를 잃는다. 다만, 그 권리가 포기할 수 없는 것인 때에는 그러하지 아니하다."}, {"no": 152, "no_str": "제152조", "title": "변론조서의 작성", "body": "①법원사무관등은 변론기일에 참여하여 기일마다 조서를 작성하여야 한다. 다만, 변론을 녹\n음하거나 속기하는 경우 그 밖에 이에 준하는 특별한 사정이 있는 경우에는 법원사무관등을 참여시키지 아니하고\n변론기일을 열 수 있다.\n②재판장은 필요하다고 인정하는 경우 법원사무관등을 참여시키지 아니하고 변론기일 및 변론준비기일 외의 기일\n을 열 수 있다.\n③제1항 단서 및 제2항의 경우에는 법원사무관등은 그 기일이 끝난 뒤에 재판장의 설명에 따라 조서를 작성하고,\n그 취지를 덧붙여 적어야 한다."}, {"no": 153, "no_str": "제153조", "title": "형식적 기재사항", "body": "조서에는 법원사무관등이 다음 각호의 사항을 적고, 재판장과 법원사무관등이 기명날인 또\n는 서명한다. 다만, 재판장이 기명날인 또는 서명할 수 없는 사유가 있는 때에는 합의부원이 그 사유를 적은 뒤에 기\n명날인 또는 서명하며, 법관 모두가 기명날인 또는 서명할 수 없는 사유가 있는 때에는 법원사무관등이 그 사유를 적\n는다. <개정 2017. 10. 31.>\n1. 사건의 표시\n2. 법관과 법원사무관등의 성명\n3. 출석한 검사의 성명\n4. 출석한 당사자ㆍ대리인ㆍ통역인과 출석하지 아니한 당사자의 성명\n5. 변론의 날짜와 장소\n6. 변론의 공개여부와 공개하지 아니한 경우에는 그 이유"}, {"no": 154, "no_str": "제154조", "title": "실질적 기재사항", "body": "조서에는 변론의 요지를 적되, 특히 다음 각호의 사항을 분명히 하여야 한다.\n1. 화해, 청구의 포기ㆍ인낙, 소의 취하와 자백\n2. 증인ㆍ감정인의 선서와 진술\n3. 검증의 결과\n4. 재판장이 적도록 명한 사항과 당사자의 청구에 따라 적는 것을 허락한 사항\n5. 서면으로 작성되지 아니한 재판\n6. 재판의 선고"}, {"no": 155, "no_str": "제155조", "title": "조서기재의 생략 등", "body": "①조서에 적을 사항은 대법원규칙이 정하는 바에 따라 생략할 수 있다. 다만, 당사자의 이\n의가 있으면 그러하지 아니하다.\n②변론방식에 관한 규정의 준수, 화해, 청구의 포기ㆍ인낙, 소의 취하와 자백에 대하여는 제1항 본문의 규정을 적용\n하지 아니한다."}, {"no": 156, "no_str": "제156조", "title": "서면 등의 인용ㆍ첨부", "body": "조서에는 서면, 사진, 그 밖에 법원이 적당하다고 인정한 것을 인용하고 소송기록에 붙\n여 이를 조서의 일부로 삼을 수 있다."}, {"no": 157, "no_str": "제157조", "title": "관계인의 조서낭독 등 청구권", "body": "조서는 관계인이 신청하면 그에게 읽어 주거나 보여주어야 한다."}, {"no": 158, "no_str": "제158조", "title": "조서의 증명력", "body": "변론방식에 관한 규정이 지켜졌다는 것은 조서로만 증명할 수 있다. 다만, 조서가 없어진 때에\n는 그러하지 아니하다."}, {"no": 159, "no_str": "제159조", "title": "변론의 속기와 녹음", "body": "①법원은 필요하다고 인정하는 경우에는 변론의 전부 또는 일부를 녹음하거나, 속기자로\n하여금 받아 적도록 명할 수 있으며, 당사자가 녹음 또는 속기를 신청하면 특별한 사유가 없는 한 이를 명하여야 한\n다.\n②제1항의 녹음테이프와 속기록은 조서의 일부로 삼는다.\n③제1항 및 제2항의 규정에 따라 녹음테이프 또는 속기록으로 조서의 기재를 대신한 경우에, 소송이 완결되기 전까\n지 당사자가 신청하거나 그 밖에 대법원규칙이 정하는 때에는 녹음테이프나 속기록의 요지를 정리하여 조서를 작\n성하여야 한다.\n④제3항의 규정에 따라 조서가 작성된 경우에는 재판이 확정되거나, 양 쪽 당사자의 동의가 있으면 법원은 녹음테\n이프와 속기록을 폐기할 수 있다. 이 경우 당사자가 녹음테이프와 속기록을 폐기한다는 통지를 받은 날부터 2주 이\n내에 이의를 제기하지 아니하면 폐기에 대하여 동의한 것으로 본다."}, {"no": 160, "no_str": "제160조", "title": "다른 조서에 준용하는 규정", "body": "법원ㆍ수명법관 또는 수탁판사의 신문(訊問) 또는 심문과 증거조사에는 제152조\n내지 제159조의 규정을 준용한다."}, {"no": 161, "no_str": "제161조", "title": "신청 또는 진술의 방법", "body": "①신청, 그 밖의 진술은 특별한 규정이 없는 한 서면 또는 말로 할 수 있다.\n②말로 하는 경우에는 법원사무관등의 앞에서 하여야 한다.\n③제2항의 경우에 법원사무관등은 신청 또는 진술의 취지에 따라 조서 또는 그 밖의 서면을 작성한 뒤 기명날인 또\n는 서명하여야 한다.<개정 2017. 10. 31.>"}, {"no": 162, "no_str": "제162조", "title": "소송기록의 열람과 증명서의 교부청구", "body": "①당사자나 이해관계를 소명한 제3자는 대법원규칙이 정하는 바에 따\n라, 소송기록의 열람ㆍ복사, 재판서ㆍ조서의 정본ㆍ등본ㆍ초본의 교부 또는 소송에 관한 사항의 증명서의 교부를 법\n원사무관등에게 신청할 수 있다.\n②누구든지 권리구제ㆍ학술연구 또는 공익적 목적으로 대법원규칙으로 정하는 바에 따라 법원사무관등에게 재판\n이 확정된 소송기록의 열람을 신청할 수 있다. 다만, 공개를 금지한 변론에 관련된 소송기록에 대하여는 그러하지\n아니하다.<신설 2007. 5. 17.>\n③법원은 제2항에 따른 열람 신청시 당해 소송관계인이 동의하지 아니하는 경우에는 열람하게 하여서는 아니 된다.\n이 경우 당해 소송관계인의 범위 및 동의 등에 관하여 필요한 사항은 대법원규칙으로 정한다.<신설 2007. 5. 17.>\n④소송기록을 열람ㆍ복사한 사람은 열람ㆍ복사에 의하여 알게 된 사항을 이용하여 공공의 질서 또는 선량한 풍속\n을 해하거나 관계인의 명예 또는 생활의 평온을 해하는 행위를 하여서는 아니 된다.<신설 2007. 5. 17.>\n⑤제1항 및 제2항의 신청에 대하여는 대법원규칙이 정하는 수수료를 내야 한다.<개정 2007. 5. 17.>\n⑥재판서ㆍ조서의 정본ㆍ등본ㆍ초본에는 그 취지를 적고 법원사무관등이 기명날인 또는 서명하여야 한다.<개정\n2007. 5. 17., 2017. 10. 31.>"}, {"no": 163, "no_str": "제163조", "title": "비밀보호를 위한 열람 등의 제한", "body": "①다음 각호 가운데 어느 하나에 해당한다는 소명이 있는 경우에는 법원은\n당사자의 신청에 따라 결정으로 소송기록중 비밀이 적혀 있는 부분의 열람ㆍ복사, 재판서ㆍ조서중 비밀이 적혀 있는\n부분의 정본ㆍ등본ㆍ초본의 교부(이하 “비밀 기재부분의 열람 등”이라 한다)를 신청할 수 있는 자를 당사자로 한정\n할 수 있다.\n1. 소송기록 중에 당사자의 사생활에 관한 중대한 비밀이 적혀 있고, 제3자에게 비밀 기재부분의 열람 등을 허용하\n면 당사자의 사회생활에 지장이 클 우려가 있는 때\n2. 소송기록중에 당사자가 가지는 영업비밀(부정경쟁방지및영업비밀보호에관한법률 제2조제2호에 규정된 영업비\n밀을 말한다)이 적혀 있는 때\n② 소송관계인의 생명 또는 신체에 대한 위해의 우려가 있다는 소명이 있는 경우에는 법원은 해당 소송관계인의 신\n청에 따라 결정으로 소송기록의 열람ㆍ복사ㆍ송달에 앞서 주소 등 대법원규칙으로 정하는 개인정보로서 해당 소송\n관계인이 지정하는 부분(이하 “개인정보 기재부분”이라 한다)이 제3자(당사자를 포함한다. 이하 제3항ㆍ제4항 중 이\n항과 관련된 부분에서 같다)에게 공개되지 아니하도록 보호조치를 할 수 있다.<신설 2023. 7. 11.>\n③제1항 또는 제2항의 신청이 있는 경우에는 그 신청에 관한 재판이 확정될 때까지 제3자는 개인정보 기재부분 또\n는 비밀 기재부분의 열람 등을 신청할 수 없다.<개정 2023. 7. 11.>\n④소송기록을 보관하고 있는 법원은 이해관계를 소명한 제3자의 신청에 따라 제1항 또는 제2항의 사유가 존재하지\n아니하거나 소멸되었음을 이유로 제1항 또는 제2항의 결정을 취소할 수 있다.<개정 2023. 7. 11.>\n⑤제1항 또는 제2항의 신청을 기각한 결정 또는 제4항의 신청에 관한 결정에 대하여는 즉시항고를 할 수 있다.<개\n정 2023. 7. 11.>\n⑥제4항의 취소결정은 확정되어야 효력을 가진다.<개정 2023. 7. 11.>"}, {"no": 163, "no_str": "제163조의2", "title": "판결서의 열람ㆍ복사", "body": "① 제162조에도 불구하고 누구든지 판결이 선고된 사건의 판결서(확정되지 아니한\n사건에 대한 판결서를 포함하며, 「소액사건심판법」이 적용되는 사건의 판결서와 「상고심절차에 관한 특례법」 제\n4조 및 이 법 제429조 본문에 따른 판결서는 제외한다. 이하 이 조에서 같다)를 인터넷, 그 밖의 전산정보처리시스템\n을 통한 전자적 방법 등으로 열람 및 복사할 수 있다. 다만, 변론의 공개를 금지한 사건의 판결서로서 대법원규칙으\n로 정하는 경우에는 열람 및 복사를 전부 또는 일부 제한할 수 있다. <개정 2020. 12. 8.>\n② 제1항에 따라 열람 및 복사의 대상이 되는 판결서는 대법원규칙으로 정하는 바에 따라 판결서에 기재된 문자열\n또는 숫자열이 검색어로 기능할 수 있도록 제공되어야 한다.<신설 2020. 12. 8.>\n③ 법원사무관등이나 그 밖의 법원공무원은 제1항에 따른 열람 및 복사에 앞서 판결서에 기재된 성명 등 개인정보\n가 공개되지 아니하도록 대법원규칙으로 정하는 보호조치를 하여야 한다.<개정 2020. 12. 8.>\n④ 제3항에 따라 개인정보 보호조치를 한 법원사무관등이나 그 밖의 법원공무원은 고의 또는 중대한 과실로 인한\n것이 아니면 제1항에 따른 열람 및 복사와 관련하여 민사상ㆍ형사상 책임을 지지 아니한다.<개정 2020. 12. 8.>\n⑤ 제1항의 열람 및 복사에는 제162조제4항ㆍ제5항 및 제163조를 준용한다.<개정 2020. 12. 8.>\n⑥ 판결서의 열람 및 복사의 방법과 절차, 개인정보 보호조치의 방법과 절차, 그 밖에 필요한 사항은 대법원규칙으\n로 정한다.<개정 2020. 12. 8.>\n[본조신설 2011. 7. 18.]\n[제목개정 2020. 12. 8.]"}, {"no": 164, "no_str": "제164조", "title": "조서에 대한 이의", "body": "조서에 적힌 사항에 대하여 관계인이 이의를 제기한 때에는 조서에 그 취지를 적어야 한다."}, {"no": 164, "no_str": "제164조의2", "title": "전문심리위원의 참여", "body": "①법원은 소송관계를 분명하게 하거나 소송절차(증거조사ㆍ화해 등을 포함한다. 이\n하 이 절에서 같다)를 원활하게 진행하기 위하여 직권 또는 당사자의 신청에 따른 결정으로 제164조의4제1항에 따\n라 전문심리위원을 지정하여 소송절차에 참여하게 할 수 있다.\n②전문심리위원은 전문적인 지식을 필요로 하는 소송절차에서 설명 또는 의견을 기재한 서면을 제출하거나 기일에\n출석하여 설명이나 의견을 진술할 수 있다. 다만, 재판의 합의에는 참여할 수 없다.\n③전문심리위원은 기일에 재판장의 허가를 받아 당사자, 증인 또는 감정인 등 소송관계인에게 직접 질문할 수 있다.\n④법원은 제2항에 따라 전문심리위원이 제출한 서면이나 전문심리위원의 설명 또는 의견의 진술에 관하여 당사자\n에게 구술 또는 서면에 의한 의견진술의 기회를 주어야 한다.\n[본조신설 2007. 7. 13.]"}, {"no": 164, "no_str": "제164조의3", "title": "전문심리위원 참여결정의 취소", "body": "①법원은 상당하다고 인정하는 때에는 직권이나 당사자의 신청으로 제\n164조의2제1항에 따른 결정을 취소할 수 있다.\n②제1항에도 불구하고 당사자가 합의로 제164조의2제1항에 따른 결정을 취소할 것을 신청하는 때에는 법원은 그\n결정을 취소하여야 한다.\n[본조신설 2007. 7. 13.]"}, {"no": 164, "no_str": "제164조의4", "title": "전문심리위원의 지정 등", "body": "①법원은 제164조의2제1항에 따라 전문심리위원을 소송절차에 참여시키는 경우\n당사자의 의견을 들어 각 사건마다 1인 이상의 전문심리위원을 지정하여야 한다.\n②전문심리위원에게는 대법원규칙으로 정하는 바에 따라 수당을 지급하고, 필요한 경우에는 그 밖의 여비, 일당 및\n숙박료를 지급할 수 있다.\n③전문심리위원의 지정에 관하여 그 밖에 필요한 사항은 대법원규칙으로 정한다.\n[본조신설 2007. 7. 13.]"}, {"no": 164, "no_str": "제164조의5", "title": "전문심리위원의 제척 및 기피", "body": "①전문심리위원에게 제41조부터 제45조까지 및 제47조를 준용한다.\n②제척 또는 기피 신청을 받은 전문심리위원은 그 신청에 관한 결정이 확정될 때까지 그 신청이 있는 사건의 소송\n절차에 참여할 수 없다. 이 경우 전문심리위원은 당해 제척 또는 기피 신청에 대하여 의견을 진술할 수 있다.\n[본조신설 2007. 7. 13.]"}, {"no": 164, "no_str": "제164조의6", "title": "수명법관 등의 권한", "body": "수명법관 또는 수탁판사가 소송절차를 진행하는 경우에는 제164조의2제2항부터 제\n4항까지의 규정에 따른 법원 및 재판장의 직무는 그 수명법관이나 수탁판사가 행한다.\n[본조신설 2007. 7. 13.]"}, {"no": 164, "no_str": "제164조의7", "title": "비밀누설죄", "body": "전문심리위원 또는 전문심리위원이었던 자가 그 직무수행 중에 알게 된 다른 사람의 비밀을\n누설하는 경우에는 2년 이하의 징역이나 금고 또는 1천만원 이하의 벌금에 처한다.\n[본조신설 2007. 7. 13.]"}, {"no": 164, "no_str": "제164조의8", "title": "벌칙 적용에서의 공무원 의제", "body": "전문심리위원은 「형법」 제129조부터 제132조까지의 규정에 따른 벌칙의\n적용에서는 공무원으로 본다.\n[본조신설 2007. 7. 13.]"}, {"no": 165, "no_str": "제165조", "title": "기일의 지정과 변경", "body": "①기일은 직권으로 또는 당사자의 신청에 따라 재판장이 지정한다. 다만, 수명법관 또는\n수탁판사가 신문하거나 심문하는 기일은 그 수명법관 또는 수탁판사가 지정한다.\n②첫 변론기일 또는 첫 변론준비기일을 바꾸는 것은 현저한 사유가 없는 경우라도 당사자들이 합의하면 이를 허가\n한다."}, {"no": 166, "no_str": "제166조", "title": "공휴일의 기일", "body": "기일은 필요한 경우에만 공휴일로도 정할 수 있다."}, {"no": 167, "no_str": "제167조", "title": "기일의 통지", "body": "①기일은 기일통지서 또는 출석요구서를 송달하여 통지한다. 다만, 그 사건으로 출석한 사람에게\n는 기일을 직접 고지하면 된다.\n②법원은 대법원규칙이 정하는 간이한 방법에 따라 기일을 통지할 수 있다. 이 경우 기일에 출석하지 아니한 당사자\nㆍ증인 또는 감정인 등에 대하여 법률상의 제재, 그 밖에 기일을 게을리 함에 따른 불이익을 줄 수 없다."}, {"no": 168, "no_str": "제168조", "title": "출석승낙서의 효력", "body": "소송관계인이 일정한 기일에 출석하겠다고 적은 서면을 제출한 때에는 기일통지서 또는\n출석요구서를 송달한 것과 같은 효력을 가진다."}, {"no": 169, "no_str": "제169조", "title": "기일의 시작", "body": "기일은 사건과 당사자의 이름을 부름으로써 시작된다."}, {"no": 170, "no_str": "제170조", "title": "기간의 계산", "body": "기간의 계산은 민법에 따른다."}, {"no": 171, "no_str": "제171조", "title": "기간의 시작", "body": "기간을 정하는 재판에 시작되는 때를 정하지 아니한 경우에 그 기간은 재판의 효력이 생긴 때부\n터 진행한다."}, {"no": 172, "no_str": "제172조", "title": "기간의 신축, 부가기간", "body": "①법원은 법정기간 또는 법원이 정한 기간을 늘이거나 줄일 수 있다. 다만, 불변기간은\n그러하지 아니하다.\n②법원은 불변기간에 대하여 주소 또는 거소가 멀리 떨어진 곳에 있는 사람을 위하여 부가기간(附加期間)을 정할\n수 있다.\n③재판장ㆍ수명법관 또는 수탁판사는 제1항 및 제2항의 규정에 따라 법원이 정한 기간 또는 자신이 정한 기간을 늘\n이거나 줄일 수 있다."}, {"no": 173, "no_str": "제173조", "title": "소송행위의 추후보완", "body": "①당사자가 책임질 수 없는 사유로 말미암아 불변기간을 지킬 수 없었던 경우에는 그\n사유가 없어진 날부터 2주 이내에 게을리 한 소송행위를 보완할 수 있다. 다만, 그 사유가 없어질 당시 외국에 있던\n당사자에 대하여는 이 기간을 30일로 한다.\n②제1항의 기간에 대하여는 제172조의 규정을 적용하지 아니한다."}, {"no": 174, "no_str": "제174조", "title": "직권송달의 원칙", "body": "송달은 이 법에 특별한 규정이 없으면 법원이 직권으로 한다."}, {"no": 175, "no_str": "제175조", "title": "송달사무를 처리하는 사람", "body": "①송달에 관한 사무는 법원사무관등이 처리한다.\n②법원사무관등은 송달하는 곳의 지방법원에 속한 법원사무관등 또는 집행관에게 제1항의 사무를 촉탁할 수 있다."}, {"no": 176, "no_str": "제176조", "title": "송달기관", "body": "①송달은 우편 또는 집행관에 의하거나, 그 밖에 대법원규칙이 정하는 방법에 따라서 하여야 한다.\n②우편에 의한 송달은 우편집배원이 한다.\n③송달기관이 송달하는 데 필요한 때에는 경찰공무원에게 원조를 요청할 수 있다.<개정 2006. 2. 21., 2020. 12.\n22.>"}, {"no": 177, "no_str": "제177조", "title": "법원사무관등에 의한 송달", "body": "①해당 사건에 출석한 사람에게는 법원사무관등이 직접 송달할 수 있다.\n②법원사무관등이 그 법원안에서 송달받을 사람에게 서류를 교부하고 영수증을 받은 때에는 송달의 효력을 가진다."}, {"no": 178, "no_str": "제178조", "title": "교부송달의 원칙", "body": "①송달은 특별한 규정이 없으면 송달받을 사람에게 서류의 등본 또는 부본을 교부하여야 한\n다.\n②송달할 서류의 제출에 갈음하여 조서, 그 밖의 서면을 작성한 때에는 그 등본이나 초본을 교부하여야 한다."}, {"no": 179, "no_str": "제179조", "title": "소송무능력자에게 할 송달", "body": "소송무능력자에게 할 송달은 그의 법정대리인에게 한다."}, {"no": 180, "no_str": "제180조", "title": "공동대리인에게 할 송달", "body": "여러 사람이 공동으로 대리권을 행사하는 경우의 송달은 그 가운데 한 사람에게 하\n면 된다."}, {"no": 181, "no_str": "제181조", "title": "군관계인에게 할 송달", "body": "군사용의 청사 또는 선박에 속하여 있는 사람에게 할 송달은 그 청사 또는 선박의 장에\n게 한다."}, {"no": 182, "no_str": "제182조", "title": "구속된 사람 등에게 할 송달", "body": "교도소ㆍ구치소 또는 국가경찰관서의 유치장에 체포ㆍ구속 또는 유치(留置)된 사\n람에게 할 송달은 교도소ㆍ구치소 또는 국가경찰관서의 장에게 한다. <개정 2006. 2. 21.>"}, {"no": 183, "no_str": "제183조", "title": "송달장소", "body": "①송달은 받을 사람의 주소ㆍ거소ㆍ영업소 또는 사무소(이하 “주소등”이라 한다)에서 한다. 다만, 법\n정대리인에게 할 송달은 본인의 영업소나 사무소에서도 할 수 있다.\n②제1항의 장소를 알지 못하거나 그 장소에서 송달할 수 없는 때에는 송달받을 사람이 고용ㆍ위임 그 밖에 법률상\n행위로 취업하고 있는 다른 사람의 주소등(이하 “근무장소”라 한다)에서 송달할 수 있다.\n③송달받을 사람의 주소등 또는 근무장소가 국내에 없거나 알 수 없는 때에는 그를 만나는 장소에서 송달할 수 있\n다.\n④주소등 또는 근무장소가 있는 사람의 경우에도 송달받기를 거부하지 아니하면 만나는 장소에서 송달할 수 있다."}, {"no": 184, "no_str": "제184조", "title": "송달받을 장소의 신고", "body": "당사자ㆍ법정대리인 또는 소송대리인은 주소등 외의 장소(대한민국안의 장소로 한정한\n다)를 송달받을 장소로 정하여 법원에 신고할 수 있다. 이 경우에는 송달 영수인을 정하여 신고할 수 있다."}, {"no": 185, "no_str": "제185조", "title": "송달장소변경의 신고의무", "body": "①당사자ㆍ법정대리인 또는 소송대리인이 송달받을 장소를 바꿀 때에는 바로 그\n취지를 법원에 신고하여야 한다.\n②제1항의 신고를 하지 아니한 사람에게 송달할 서류는 달리 송달할 장소를 알 수 없는 경우 종전에 송달받던 장소\n에 대법원규칙이 정하는 방법으로 발송할 수 있다."}, {"no": 186, "no_str": "제186조", "title": "보충송달ㆍ유치송달", "body": "①근무장소 외의 송달할 장소에서 송달받을 사람을 만나지 못한 때에는 그 사무원, 피용\n자(被用者) 또는 동거인으로서 사리를 분별할 지능이 있는 사람에게 서류를 교부할 수 있다.\n②근무장소에서 송달받을 사람을 만나지 못한 때에는 제183조제2항의 다른 사람 또는 그 법정대리인이나 피용자\n그 밖의 종업원으로서 사리를 분별할 지능이 있는 사람이 서류의 수령을 거부하지 아니하면 그에게 서류를 교부할\n수 있다.\n③서류를 송달받을 사람 또는 제1항의 규정에 의하여 서류를 넘겨받을 사람이 정당한 사유 없이 송달받기를 거부하\n는 때에는 송달할 장소에 서류를 놓아둘 수 있다."}, {"no": 187, "no_str": "제187조", "title": "우편송달", "body": "제186조의 규정에 따라 송달할 수 없는 때에는 법원사무관등은 서류를 등기우편 등 대법원규칙이\n정하는 방법으로 발송할 수 있다."}, {"no": 188, "no_str": "제188조", "title": "송달함 송달", "body": "①제183조 내지 제187조의 규정에 불구하고 법원안에 송달할 서류를 넣을 함(이하 “송달함”이라\n한다)을 설치하여 송달할 수 있다.\n②송달함을 이용하는 송달은 법원사무관등이 한다.\n③송달받을 사람이 송달함에서 서류를 수령하여 가지 아니한 경우에는 송달함에 서류를 넣은 지 3일이 지나면 송달\n된 것으로 본다.\n④송달함의 이용절차와 수수료, 송달함을 이용하는 송달방법 및 송달함으로 송달할 서류에 관한 사항은 대법원규칙\n으로 정한다."}, {"no": 189, "no_str": "제189조", "title": "발신주의", "body": "제185조제2항 또는 제187조의 규정에 따라 서류를 발송한 경우에는 발송한 때에 송달된 것으로 본\n다."}, {"no": 190, "no_str": "제190조", "title": "공휴일 등의 송달", "body": "①당사자의 신청이 있는 때에는 공휴일 또는 해뜨기 전이나 해진 뒤에 집행관 또는 대법원\n규칙이 정하는 사람에 의하여 송달할 수 있다.\n②제1항의 규정에 따라 송달하는 때에는 법원사무관등은 송달할 서류에 그 사유를 덧붙여 적어야 한다.\n③제1항과 제2항의 규정에 어긋나는 송달은 서류를 교부받을 사람이 이를 영수한 때에만 효력을 가진다."}, {"no": 191, "no_str": "제191조", "title": "외국에서 하는 송달의 방법", "body": "외국에서 하여야 하는 송달은 재판장이 그 나라에 주재하는 대한민국의 대사ㆍ공\n사ㆍ영사 또는 그 나라의 관할 공공기관에 촉탁한다."}, {"no": 192, "no_str": "제192조", "title": "전쟁에 나간 군인 또는 외국에 주재하는 군관계인 등에게 할 송달", "body": "①전쟁에 나간 군대, 외국에 주둔하는 군대\n에 근무하는 사람 또는 군에 복무하는 선박의 승무원에게 할 송달은 재판장이 그 소속 사령관에게 촉탁한다.\n②제1항의 송달에 대하여는 제181조의 규정을 준용한다."}, {"no": 193, "no_str": "제193조", "title": "송달통지", "body": "송달한 기관은 송달에 관한 사유를 대법원규칙이 정하는 방법으로 법원에 알려야 한다."}, {"no": 194, "no_str": "제194조", "title": "공시송달의 요건", "body": "①당사자의 주소등 또는 근무장소를 알 수 없는 경우 또는 외국에서 하여야 할 송달에 관하\n여 제191조의 규정에 따를 수 없거나 이에 따라도 효력이 없을 것으로 인정되는 경우에는 법원사무관등은 직권으로\n또는 당사자의 신청에 따라 공시송달을 할 수 있다. <개정 2014. 12. 30.>\n②제1항의 신청에는 그 사유를 소명하여야 한다.\n③ 재판장은 제1항의 경우에 소송의 지연을 피하기 위하여 필요하다고 인정하는 때에는 공시송달을 명할 수 있다.\n<신설 2014. 12. 30.>\n④ 원고가 소권(항소권을 포함한다)을 남용하여 청구가 이유 없음이 명백한 소를 반복적으로 제기한 것에 대하여\n법원이 변론 없이 판결로 소를 각하하는 경우에는 재판장은 직권으로 피고에 대하여 공시송달을 명할 수 있다.<신\n설 2023. 4. 18.>\n⑤ 재판장은 직권으로 또는 신청에 따라 법원사무관등의 공시송달처분을 취소할 수 있다.<신설 2014. 12. 30.,\n2023. 4. 18.>"}, {"no": 195, "no_str": "제195조", "title": "공시송달의 방법", "body": "공시송달은 법원사무관등이 송달할 서류를 보관하고 그 사유를 법원게시판에 게시하거나,\n그 밖에 대법원규칙이 정하는 방법에 따라서 하여야 한다."}, {"no": 196, "no_str": "제196조", "title": "공시송달의 효력발생", "body": "①첫 공시송달은 제195조의 규정에 따라 실시한 날부터 2주가 지나야 효력이 생긴다.\n다만, 같은 당사자에게 하는 그 뒤의 공시송달은 실시한 다음 날부터 효력이 생긴다.\n②외국에서 할 송달에 대한 공시송달의 경우에는 제1항 본문의 기간은 2월로 한다.\n③제1항 및 제2항의 기간은 줄일 수 없다."}, {"no": 197, "no_str": "제197조", "title": "수명법관 등의 송달권한", "body": "수명법관 및 수탁판사와 송달하는 곳의 지방법원판사도 송달에 대한 재판장의 권한\n을 행사할 수 있다."}, {"no": 198, "no_str": "제198조", "title": "종국판결", "body": "법원은 소송의 심리를 마치고 나면 종국판결(終局判決)을 한다."}, {"no": 199, "no_str": "제199조", "title": "종국판결 선고기간", "body": "판결은 소가 제기된 날부터 5월 이내에 선고한다. 다만, 항소심 및 상고심에서는 기록을\n받은 날부터 5월 이내에 선고한다."}, {"no": 200, "no_str": "제200조", "title": "일부판결", "body": "①법원은 소송의 일부에 대한 심리를 마친 경우 그 일부에 대한 종국판결을 할 수 있다.\n②변론을 병합한 여러 개의 소송 가운데 한 개의 심리를 마친 경우와, 본소(本訴)나 반소의 심리를 마친 경우에는 제\n1항의 규정을 준용한다."}, {"no": 201, "no_str": "제201조", "title": "중간판결", "body": "①법원은 독립된 공격 또는 방어의 방법, 그 밖의 중간의 다툼에 대하여 필요한 때에는 중간판결(中\n間判決)을 할 수 있다.\n②청구의 원인과 액수에 대하여 다툼이 있는 경우에 그 원인에 대하여도 중간판결을 할 수 있다."}, {"no": 202, "no_str": "제202조", "title": "자유심증주의", "body": "법원은 변론 전체의 취지와 증거조사의 결과를 참작하여 자유로운 심증으로 사회정의와 형평\n의 이념에 입각하여 논리와 경험의 법칙에 따라 사실주장이 진실한지 아닌지를 판단한다."}, {"no": 202, "no_str": "제202조의2", "title": "손해배상 액수의 산정", "body": "손해가 발생한 사실은 인정되나 구체적인 손해의 액수를 증명하는 것이 사안의 성\n질상 매우 어려운 경우에 법원은 변론 전체의 취지와 증거조사의 결과에 의하여 인정되는 모든 사정을 종합하여 상\n당하다고 인정되는 금액을 손해배상 액수로 정할 수 있다.\n[본조신설 2016. 3. 29.]"}, {"no": 203, "no_str": "제203조", "title": "처분권주의", "body": "법원은 당사자가 신청하지 아니한 사항에 대하여는 판결하지 못한다."}, {"no": 204, "no_str": "제204조", "title": "직접주의", "body": "①판결은 기본이 되는 변론에 관여한 법관이 하여야 한다.\n②법관이 바뀐 경우에 당사자는 종전의 변론결과를 진술하여야 한다.\n③단독사건의 판사가 바뀐 경우에 종전에 신문한 증인에 대하여 당사자가 다시 신문신청을 한 때에는 법원은 그 신\n문을 하여야 한다. 합의부 법관의 반수 이상이 바뀐 경우에도 또한 같다."}, {"no": 205, "no_str": "제205조", "title": "판결의 효력발생", "body": "판결은 선고로 효력이 생긴다."}, {"no": 206, "no_str": "제206조", "title": "선고의 방식", "body": "판결은 재판장이 판결원본에 따라 주문을 읽어 선고하며, 필요한 때에는 이유를 간략히 설명할\n수 있다."}, {"no": 207, "no_str": "제207조", "title": "선고기일", "body": "①판결은 변론이 종결된 날부터 2주 이내에 선고하여야 하며, 복잡한 사건이나 그 밖의 특별한 사정\n이 있는 때에도 변론이 종결된 날부터 4주를 넘겨서는 아니 된다.\n②판결은 당사자가 출석하지 아니하여도 선고할 수 있다."}, {"no": 208, "no_str": "제208조", "title": "판결서의 기재사항 등", "body": "①판결서에는 다음 각호의 사항을 적고, 판결한 법관이 서명날인하여야 한다.\n1. 당사자와 법정대리인\n2. 주문\n3. 청구의 취지 및 상소의 취지\n4. 이유\n5. 변론을 종결한 날짜. 다만, 변론 없이 판결하는 경우에는 판결을 선고하는 날짜\n6. 법원\n②판결서의 이유에는 주문이 정당하다는 것을 인정할 수 있을 정도로 당사자의 주장, 그 밖의 공격ㆍ방어방법에 관\n한 판단을 표시한다.\n③제2항의 규정에 불구하고 제1심 판결로서 다음 각호 가운데 어느 하나에 해당하는 경우에는 청구를 특정함에 필\n요한 사항과 제216조제2항의 판단에 관한 사항만을 간략하게 표시할 수 있다.\n1. 제257조의 규정에 의한 무변론 판결\n2. 제150조제3항이 적용되는 경우의 판결\n3. 피고가 제194조 내지 제196조의 규정에 의한 공시송달로 기일통지를 받고 변론기일에 출석하지 아니한 경우의\n판결\n④법관이 판결서에 서명날인함에 지장이 있는 때에는 다른 법관이 판결에 그 사유를 적고 서명날인하여야 한다."}, {"no": 209, "no_str": "제209조", "title": "법원사무관등에 대한 교부", "body": "판결서는 선고한 뒤에 바로 법원사무관등에게 교부하여야 한다."}, {"no": 210, "no_str": "제210조", "title": "판결서의 송달", "body": "①법원사무관등은 판결서를 받은 날부터 2주 이내에 당사자에게 송달하여야 한다.\n②판결서는 정본으로 송달한다."}, {"no": 211, "no_str": "제211조", "title": "판결의 경정", "body": "①판결에 잘못된 계산이나 기재, 그 밖에 이와 비슷한 잘못이 있음이 분명한 때에 법원은 직권으\n로 또는 당사자의 신청에 따라 경정결정(更正決定)을 할 수 있다.\n②경정결정은 판결의 원본과 정본에 덧붙여 적어야 한다. 다만, 정본에 덧붙여 적을 수 없을 때에는 결정의 정본을\n작성하여 당사자에게 송달하여야 한다.\n③경정결정에 대하여는 즉시항고를 할 수 있다. 다만, 판결에 대하여 적법한 항소가 있는 때에는 그러하지 아니하다\n."}, {"no": 212, "no_str": "제212조", "title": "재판의 누락", "body": "①법원이 청구의 일부에 대하여 재판을 누락한 경우에 그 청구부분에 대하여는 그 법원이 계속\n하여 재판한다.\n②소송비용의 재판을 누락한 경우에는 법원은 직권으로 또는 당사자의 신청에 따라 그 소송비용에 대한 재판을 한\n다. 이 경우 제114조의 규정을 준용한다.\n③제2항의 규정에 따른 소송비용의 재판은 본안판결에 대하여 적법한 항소가 있는 때에는 그 효력을 잃는다. 이 경\n우 항소법원은 소송의 총비용에 대하여 재판을 한다."}, {"no": 213, "no_str": "제213조", "title": "가집행의 선고", "body": "①재산권의 청구에 관한 판결은 가집행(假執行)의 선고를 붙이지 아니할 상당한 이유가 없는\n한 직권으로 담보를 제공하거나, 제공하지 아니하고 가집행을 할 수 있다는 것을 선고하여야 한다. 다만, 어음금ㆍ수\n표금 청구에 관한 판결에는 담보를 제공하게 하지 아니하고 가집행의 선고를 하여야 한다.\n②법원은 직권으로 또는 당사자의 신청에 따라 채권전액을 담보로 제공하고 가집행을 면제받을 수 있다는 것을 선\n고할 수 있다.\n③제1항 및 제2항의 선고는 판결주문에 적어야 한다."}, {"no": 214, "no_str": "제214조", "title": "소송비용담보규정의 준용", "body": "제213조의 담보에는 제122조ㆍ제123조ㆍ제125조 및 제126조의 규정을 준용한다."}, {"no": 215, "no_str": "제215조", "title": "가집행선고의 실효, 가집행의 원상회복과 손해배상", "body": "①가집행의 선고는 그 선고 또는 본안판결을 바꾸는 판결\n의 선고로 바뀌는 한도에서 그 효력을 잃는다.\n②본안판결을 바꾸는 경우에는 법원은 피고의 신청에 따라 그 판결에서 가집행의 선고에 따라 지급한 물건을 돌려\n줄 것과, 가집행으로 말미암은 손해 또는 그 면제를 받기 위하여 입은 손해를 배상할 것을 원고에게 명하여야 한다.\n③가집행의 선고를 바꾼 뒤 본안판결을 바꾸는 경우에는 제2항의 규정을 준용한다."}, {"no": 216, "no_str": "제216조", "title": "기판력의 객관적 범위", "body": "①확정판결(確定判決)은 주문에 포함된 것에 한하여 기판력(旣判力)을 가진다.\n②상계를 주장한 청구가 성립되는지 아닌지의 판단은 상계하자고 대항한 액수에 한하여 기판력을 가진다."}, {"no": 217, "no_str": "제217조", "title": "외국재판의 승인", "body": "①외국법원의 확정판결 또는 이와 동일한 효력이 인정되는 재판(이하 “확정재판등”이라 한\n다)은 다음 각호의 요건을 모두 갖추어야 승인된다. <개정 2014. 5. 20.>\n1. 대한민국의 법령 또는 조약에 따른 국제재판관할의 원칙상 그 외국법원의 국제재판관할권이 인정될 것\n2. 패소한 피고가 소장 또는 이에 준하는 서면 및 기일통지서나 명령을 적법한 방식에 따라 방어에 필요한 시간여유\n를 두고 송달받았거나(공시송달이나 이와 비슷한 송달에 의한 경우를 제외한다) 송달받지 아니하였더라도 소송에\n응하였을 것\n3. 그 확정재판등의 내용 및 소송절차에 비추어 그 확정재판등의 승인이 대한민국의 선량한 풍속이나 그 밖의 사회\n질서에 어긋나지 아니할 것\n4. 상호보증이 있거나 대한민국과 그 외국법원이 속하는 국가에 있어 확정재판등의 승인요건이 현저히 균형을 상실\n하지 아니하고 중요한 점에서 실질적으로 차이가 없을 것\n② 법원은 제1항의 요건이 충족되었는지에 관하여 직권으로 조사하여야 한다.<신설 2014. 5. 20.>\n[제목개정 2014. 5. 20.]"}, {"no": 217, "no_str": "제217조의2", "title": "손해배상에 관한 확정재판등의 승인", "body": "① 법원은 손해배상에 관한 확정재판등이 대한민국의 법률 또는 대한\n민국이 체결한 국제조약의 기본질서에 현저히 반하는 결과를 초래할 경우에는 해당 확정재판등의 전부 또는 일부를\n승인할 수 없다.\n② 법원은 제1항의 요건을 심리할 때에는 외국법원이 인정한 손해배상의 범위에 변호사보수를 비롯한 소송과 관련\n된 비용과 경비가 포함되는지와 그 범위를 고려하여야 한다.\n[본조신설 2014. 5. 20.]"}, {"no": 218, "no_str": "제218조", "title": "기판력의 주관적 범위", "body": "①확정판결은 당사자, 변론을 종결한 뒤의 승계인(변론 없이 한 판결의 경우에는 판결\n을 선고한 뒤의 승계인) 또는 그를 위하여 청구의 목적물을 소지한 사람에 대하여 효력이 미친다.\n②제1항의 경우에 당사자가 변론을 종결할 때(변론 없이 한 판결의 경우에는 판결을 선고할 때)까지 승계사실을 진\n술하지 아니한 때에는 변론을 종결한 뒤(변론 없이 한 판결의 경우에는 판결을 선고한 뒤)에 승계한 것으로 추정한\n다.\n③다른 사람을 위하여 원고나 피고가 된 사람에 대한 확정판결은 그 다른 사람에 대하여도 효력이 미친다.\n④가집행의 선고에는 제1항 내지 제3항의 규정을 준용한다."}, {"no": 219, "no_str": "제219조", "title": "변론 없이 하는 소의 각하", "body": "부적법한 소로서 그 흠을 보정할 수 없는 경우에는 변론 없이 판결로 소를 각하할\n수 있다."}, {"no": 219, "no_str": "제219조의2", "title": "소권 남용에 대한 제재", "body": "원고가 소권(항소권을 포함한다)을 남용하여 청구가 이유 없음이 명백한 소를 반복\n적으로 제기한 경우에는 법원은 결정으로 500만원 이하의 과태료에 처한다.\n[본조신설 2023. 4. 18.]"}, {"no": 220, "no_str": "제220조", "title": "화해, 청구의 포기ㆍ인낙조서의 효력", "body": "화해, 청구의 포기ㆍ인낙을 변론조서ㆍ변론준비기일조서에 적은 때에는\n그 조서는 확정판결과 같은 효력을 가진다."}, {"no": 221, "no_str": "제221조", "title": "결정ㆍ명령의 고지", "body": "①결정과 명령은 상당한 방법으로 고지하면 효력을 가진다.\n②법원사무관등은 고지의 방법ㆍ장소와 날짜를 재판의 원본에 덧붙여 적고 날인하여야 한다."}, {"no": 222, "no_str": "제222조", "title": "소송지휘에 관한 재판의 취소", "body": "소송의 지휘에 관한 결정과 명령은 언제든지 취소할 수 있다."}, {"no": 223, "no_str": "제223조", "title": "법원사무관등의 처분에 대한 이의", "body": "법원사무관등의 처분에 관한 이의신청에 대하여는 그 법원사무관등이 속\n한 법원이 결정으로 재판한다."}, {"no": 224, "no_str": "제224조", "title": "판결규정의 준용", "body": "①성질에 어긋나지 아니하는 한, 결정과 명령에는 판결에 관한 규정을 준용한다. 다만, 법관\n의 서명은 기명으로 갈음할 수 있고, 이유를 적는 것을 생략할 수 있다.\n②이 법에 따른 과태료재판에는 비송사건절차법 제248조 및 제250조 가운데 검사에 관한 규정을 적용하지 아니한\n다."}, {"no": 225, "no_str": "제225조", "title": "결정에 의한 화해권고", "body": "①법원ㆍ수명법관 또는 수탁판사는 소송에 계속중인 사건에 대하여 직권으로 당사자\n의 이익, 그 밖의 모든 사정을 참작하여 청구의 취지에 어긋나지 아니하는 범위안에서 사건의 공평한 해결을 위한 화\n해권고결정(和解勸告決定)을 할 수 있다.\n②법원사무관등은 제1항의 결정내용을 적은 조서 또는 결정서의 정본을 당사자에게 송달하여야 한다. 다만, 그 송\n달은 제185조제2항ㆍ제187조 또는 제194조에 규정한 방법으로는 할 수 없다."}, {"no": 226, "no_str": "제226조", "title": "결정에 대한 이의신청", "body": "①당사자는 제225조의 결정에 대하여 그 조서 또는 결정서의 정본을 송달받은 날부터\n2주 이내에 이의를 신청할 수 있다. 다만, 그 정본이 송달되기 전에도 이의를 신청할 수 있다.\n②제1항의 기간은 불변기간으로 한다."}, {"no": 227, "no_str": "제227조", "title": "이의신청의 방식", "body": "①이의신청은 이의신청서를 화해권고결정을 한 법원에 제출함으로써 한다.\n②이의신청서에는 다음 각호의 사항을 적어야 한다.\n1. 당사자와 법정대리인\n2. 화해권고결정의 표시와 그에 대한 이의신청의 취지\n③이의신청서에는 준비서면에 관한 규정을 준용한다.\n④제226조제1항의 규정에 따라 이의를 신청한 때에는 이의신청의 상대방에게 이의신청서의 부본을 송달하여야 한\n다."}, {"no": 228, "no_str": "제228조", "title": "이의신청의 취하", "body": "①이의신청을 한 당사자는 그 심급의 판결이 선고될 때까지 상대방의 동의를 얻어 이의신청\n을 취하할 수 있다.\n②제1항의 취하에는 제266조제3항 내지 제6항을 준용한다. 이 경우 “소”는 “이의신청”으로 본다."}, {"no": 229, "no_str": "제229조", "title": "이의신청권의 포기", "body": "①이의신청권은 그 신청전까지 포기할 수 있다.\n②이의신청권의 포기는 서면으로 하여야 한다.\n③제2항의 서면은 상대방에게 송달하여야 한다."}, {"no": 230, "no_str": "제230조", "title": "이의신청의 각하", "body": "①법원ㆍ수명법관 또는 수탁판사는 이의신청이 법령상의 방식에 어긋나거나 신청권이 소멸\n된 뒤의 것임이 명백한 경우에는 그 흠을 보정할 수 없으면 결정으로 이를 각하하여야 하며, 수명법관 또는 수탁판사\n가 각하하지 아니한 때에는 수소법원이 결정으로 각하한다.\n②제1항의 결정에 대하여는 즉시항고를 할 수 있다."}, {"no": 231, "no_str": "제231조", "title": "화해권고결정의 효력", "body": "화해권고결정은 다음 각호 가운데 어느 하나에 해당하면 재판상 화해와 같은 효력을 가\n진다.\n1. 제226조제1항의 기간 이내에 이의신청이 없는 때\n2. 이의신청에 대한 각하결정이 확정된 때\n3. 당사자가 이의신청을 취하하거나 이의신청권을 포기한 때"}, {"no": 232, "no_str": "제232조", "title": "이의신청에 의한 소송복귀 등", "body": "①이의신청이 적법한 때에는 소송은 화해권고결정 이전의 상태로 돌아간다. 이\n경우 그 이전에 행한 소송행위는 그대로 효력을 가진다.\n②화해권고결정은 그 심급에서 판결이 선고된 때에는 그 효력을 잃는다."}, {"no": 233, "no_str": "제233조", "title": "당사자의 사망으로 말미암은 중단", "body": "①당사자가 죽은 때에 소송절차는 중단된다. 이 경우 상속인ㆍ상속재산관\n리인, 그 밖에 법률에 의하여 소송을 계속하여 수행할 사람이 소송절차를 수계(受繼)하여야 한다.\n②상속인은 상속포기를 할 수 있는 동안 소송절차를 수계하지 못한다."}, {"no": 234, "no_str": "제234조", "title": "법인의 합병으로 말미암은 중단", "body": "당사자인 법인이 합병에 의하여 소멸된 때에 소송절차는 중단된다. 이 경우\n합병에 의하여 설립된 법인 또는 합병한 뒤의 존속법인이 소송절차를 수계하여야 한다."}, {"no": 235, "no_str": "제235조", "title": "소송능력의 상실, 법정대리권의 소멸로 말미암은 중단", "body": "당사자가 소송능력을 잃은 때 또는 법정대리인이 죽거\n나 대리권을 잃은 때에 소송절차는 중단된다. 이 경우 소송능력을 회복한 당사자 또는 법정대리인이 된 사람이 소송\n절차를 수계하여야 한다."}, {"no": 236, "no_str": "제236조", "title": "수탁자의 임무가 끝남으로 말미암은 중단", "body": "신탁으로 말미암은 수탁자의 위탁임무가 끝난 때에 소송절차는 중\n단된다. 이 경우 새로운 수탁자가 소송절차를 수계하여야 한다."}, {"no": 237, "no_str": "제237조", "title": "자격상실로 말미암은 중단", "body": "①일정한 자격에 의하여 자기 이름으로 남을 위하여 소송당사자가 된 사람이 그\n자격을 잃거나 죽은 때에 소송절차는 중단된다. 이 경우 같은 자격을 가진 사람이 소송절차를 수계하여야 한다.\n②제53조의 규정에 따라 당사자가 될 사람을 선정한 소송에서 선정된 당사자 모두가 자격을 잃거나 죽은 때에 소송\n절차는 중단된다. 이 경우 당사자를 선정한 사람 모두 또는 새로 당사자로 선정된 사람이 소송절차를 수계하여야 한\n다."}, {"no": 238, "no_str": "제238조", "title": "소송대리인이 있는 경우의 제외", "body": "소송대리인이 있는 경우에는 제233조제1항, 제234조 내지 제237조의 규정을\n적용하지 아니한다."}, {"no": 239, "no_str": "제239조", "title": "당사자의 파산으로 말미암은 중단", "body": "당사자가 파산선고를 받은 때에 파산재단에 관한 소송절차는 중단된다. 이\n경우 「채무자 회생 및 파산에 관한 법률」에 따른 수계가 이루어지기 전에 파산절차가 해지되면 파산선고를 받은 자\n가 당연히 소송절차를 수계한다. <개정 2005. 3. 31.>"}, {"no": 240, "no_str": "제240조", "title": "파산절차의 해지로 말미암은 중단", "body": "「채무자 회생 및 파산에 관한 법률」에 따라 파산재단에 관한 소송의 수계\n가 이루어진 뒤 파산절차가 해지된 때에 소송절차는 중단된다. 이 경우 파산선고를 받은 자가 소송절차를 수계하여\n야 한다. <개정 2005. 3. 31.>"}, {"no": 241, "no_str": "제241조", "title": "상대방의 수계신청권", "body": "소송절차의 수계신청은 상대방도 할 수 있다."}, {"no": 242, "no_str": "제242조", "title": "수계신청의 통지", "body": "소송절차의 수계신청이 있는 때에는 법원은 상대방에게 이를 통지하여야 한다."}, {"no": 243, "no_str": "제243조", "title": "수계신청에 대한 재판", "body": "①소송절차의 수계신청은 법원이 직권으로 조사하여 이유가 없다고 인정한 때에는 결\n정으로 기각하여야 한다.\n②재판이 송달된 뒤에 중단된 소송절차의 수계에 대하여는 그 재판을 한 법원이 결정하여야 한다."}, {"no": 244, "no_str": "제244조", "title": "직권에 의한 속행명령", "body": "법원은 당사자가 소송절차를 수계하지 아니하는 경우에 직권으로 소송절차를 계속하\n여 진행하도록 명할 수 있다."}, {"no": 245, "no_str": "제245조", "title": "법원의 직무집행 불가능으로 말미암은 중지", "body": "천재지변, 그 밖의 사고로 법원이 직무를 수행할 수 없을 경우에\n소송절차는 그 사고가 소멸될 때까지 중지된다."}, {"no": 246, "no_str": "제246조", "title": "당사자의 장애로 말미암은 중지", "body": "①당사자가 일정하지 아니한 기간동안 소송행위를 할 수 없는 장애사유가 생\n긴 경우에는 법원은 결정으로 소송절차를 중지하도록 명할 수 있다.\n②법원은 제1항의 결정을 취소할 수 있다."}, {"no": 247, "no_str": "제247조", "title": "소송절차 정지의 효과", "body": "①판결의 선고는 소송절차가 중단된 중에도 할 수 있다.\n②소송절차의 중단 또는 중지는 기간의 진행을 정지시키며, 소송절차의 수계사실을 통지한 때 또는 소송절차를 다\n시 진행한 때부터 전체기간이 새로이 진행된다."}, {"no": 248, "no_str": "제248조", "title": "소제기의 방식", "body": "① 소를 제기하려는 자는 법원에 소장을 제출하여야 한다.\n② 법원은 소장에 붙이거나 납부한 인지액이 「민사소송 등 인지법」 제13조제2항 각 호에서 정한 금액에 미달하는\n경우 소장의 접수를 보류할 수 있다.\n③ 법원에 제출한 소장이 접수되면 소장이 제출된 때에 소가 제기된 것으로 본다.\n[전문개정 2023. 4. 18.]"}, {"no": 249, "no_str": "제249조", "title": "소장의 기재사항", "body": "①소장에는 당사자와 법정대리인, 청구의 취지와 원인을 적어야 한다.\n②소장에는 준비서면에 관한 규정을 준용한다."}, {"no": 250, "no_str": "제250조", "title": "증서의 진정여부를 확인하는 소", "body": "확인의 소는 법률관계를 증명하는 서면이 진정한지 아닌지를 확정하기 위하\n여서도 제기할 수 있다."}, {"no": 251, "no_str": "제251조", "title": "장래의 이행을 청구하는 소", "body": "장래에 이행할 것을 청구하는 소는 미리 청구할 필요가 있어야 제기할 수 있다."}, {"no": 252, "no_str": "제252조", "title": "정기금판결과 변경의 소", "body": "①정기금(定期金)의 지급을 명한 판결이 확정된 뒤에 그 액수산정의 기초가 된 사정\n이 현저하게 바뀜으로써 당사자 사이의 형평을 크게 침해할 특별한 사정이 생긴 때에는 그 판결의 당사자는 장차 지\n급할 정기금 액수를 바꾸어 달라는 소를 제기할 수 있다.\n②제1항의 소는 제1심 판결법원의 전속관할로 한다."}, {"no": 253, "no_str": "제253조", "title": "소의 객관적 병합", "body": "여러 개의 청구는 같은 종류의 소송절차에 따르는 경우에만 하나의 소로 제기할 수 있다."}, {"no": 254, "no_str": "제254조", "title": "재판장등의 소장심사권", "body": "①소장이 제249조제1항의 규정에 어긋나는 경우와 소장에 법률의 규정에 따른 인지\n를 붙이지 아니한 경우에는 재판장은 상당한 기간을 정하고, 그 기간 이내에 흠을 보정하도록 명하여야 한다. 재판장\n은 법원사무관등으로 하여금 위 보정명령을 하게 할 수 있다. <개정 2014. 12. 30.>\n②원고가 제1항의 기간 이내에 흠을 보정하지 아니한 때에는 재판장은 명령으로 소장을 각하하여야 한다.\n③제2항의 명령에 대하여는 즉시항고를 할 수 있다.\n④재판장은 소장을 심사하면서 필요하다고 인정하는 경우에는 원고에게 청구하는 이유에 대응하는 증거방법을 구\n체적으로 적어 내도록 명할 수 있으며, 원고가 소장에 인용한 서증(書證)의 등본 또는 사본을 붙이지 아니한 경우에\n는 이를 제출하도록 명할 수 있다.\n[제목개정 2014. 12. 30.]"}, {"no": 255, "no_str": "제255조", "title": "소장부본의 송달", "body": "①법원은 소장의 부본을 피고에게 송달하여야 한다.\n②소장의 부본을 송달할 수 없는 경우에는 제254조제1항 내지 제3항의 규정을 준용한다."}, {"no": 256, "no_str": "제256조", "title": "답변서의 제출의무", "body": "①피고가 원고의 청구를 다투는 경우에는 소장의 부본을 송달받은 날부터 30일 이내에 답\n변서를 제출하여야 한다. 다만, 피고가 공시송달의 방법에 따라 소장의 부본을 송달받은 경우에는 그러하지 아니하\n다.\n②법원은 소장의 부본을 송달할 때에 제1항의 취지를 피고에게 알려야 한다.\n③법원은 답변서의 부본을 원고에게 송달하여야 한다.\n④답변서에는 준비서면에 관한 규정을 준용한다."}, {"no": 257, "no_str": "제257조", "title": "변론 없이 하는 판결", "body": "①법원은 피고가 제256조제1항의 답변서를 제출하지 아니한 때에는 청구의 원인이 된\n사실을 자백한 것으로 보고 변론 없이 판결할 수 있다. 다만, 직권으로 조사할 사항이 있거나 판결이 선고되기까지\n피고가 원고의 청구를 다투는 취지의 답변서를 제출한 경우에는 그러하지 아니하다.\n②피고가 청구의 원인이 된 사실을 모두 자백하는 취지의 답변서를 제출하고 따로 항변을 하지 아니한 때에는 제\n1항의 규정을 준용한다.\n③법원은 피고에게 소장의 부본을 송달할 때에 제1항 및 제2항의 규정에 따라 변론 없이 판결을 선고할 기일을 함\n께 통지할 수 있다."}, {"no": 258, "no_str": "제258조", "title": "변론기일의 지정", "body": "① 재판장은 제257조제1항 및 제2항에 따라 변론 없이 판결하는 경우 외에는 바로 변론기일\n을 정하여야 한다. 다만, 사건을 변론준비절차에 부칠 필요가 있는 경우에는 그러하지 아니하다.\n② 재판장은 변론준비절차가 끝난 경우에는 바로 변론기일을 정하여야 한다.\n[전문개정 2008. 12. 26.]"}, {"no": 259, "no_str": "제259조", "title": "중복된 소제기의 금지", "body": "법원에 계속되어 있는 사건에 대하여 당사자는 다시 소를 제기하지 못한다."}, {"no": 260, "no_str": "제260조", "title": "피고의 경정", "body": "①원고가 피고를 잘못 지정한 것이 분명한 경우에는 제1심 법원은 변론을 종결할 때까지 원고의\n신청에 따라 결정으로 피고를 경정하도록 허가할 수 있다. 다만, 피고가 본안에 관하여 준비서면을 제출하거나, 변론\n준비기일에서 진술하거나 변론을 한 뒤에는 그의 동의를 받아야 한다.\n②피고의 경정은 서면으로 신청하여야 한다.\n③제2항의 서면은 상대방에게 송달하여야 한다. 다만, 피고에게 소장의 부본을 송달하지 아니한 경우에는 그러하지\n아니하다.\n④피고가 제3항의 서면을 송달받은 날부터 2주 이내에 이의를 제기하지 아니하면 제1항 단서와 같은 동의를 한 것\n으로 본다."}, {"no": 261, "no_str": "제261조", "title": "경정신청에 관한 결정의 송달 등", "body": "①제260조제1항의 신청에 대한 결정은 피고에게 송달하여야 한다. 다만, 피\n고에게 소장의 부본을 송달하지 아니한 때에는 그러하지 아니하다.\n②신청을 허가하는 결정을 한 때에는 그 결정의 정본과 소장의 부본을 새로운 피고에게 송달하여야 한다.\n③신청을 허가하는 결정에 대하여는 동의가 없었다는 사유로만 즉시항고를 할 수 있다.\n④신청을 허가하는 결정을 한 때에는 종전의 피고에 대한 소는 취하된 것으로 본다."}, {"no": 262, "no_str": "제262조", "title": "청구의 변경", "body": "①원고는 청구의 기초가 바뀌지 아니하는 한도안에서 변론을 종결할 때(변론 없이 한 판결의 경\n우에는 판결을 선고할 때)까지 청구의 취지 또는 원인을 바꿀 수 있다. 다만, 소송절차를 현저히 지연시키는 경우에\n는 그러하지 아니하다.\n②청구취지의 변경은 서면으로 신청하여야 한다.\n③제2항의 서면은 상대방에게 송달하여야 한다."}, {"no": 263, "no_str": "제263조", "title": "청구의 변경의 불허가", "body": "법원이 청구의 취지 또는 원인의 변경이 옳지 아니하다고 인정한 때에는 직권으로 또\n는 상대방의 신청에 따라 변경을 허가하지 아니하는 결정을 하여야 한다."}, {"no": 264, "no_str": "제264조", "title": "중간확인의 소", "body": "①재판이 소송의 진행중에 쟁점이 된 법률관계의 성립여부에 매인 때에 당사자는 따로 그 법\n률관계의 확인을 구하는 소를 제기할 수 있다. 다만, 이는 그 확인청구가 다른 법원의 관할에 전속되지 아니하는 때\n에 한한다.\n②제1항의 청구는 서면으로 하여야 한다.\n③제2항의 서면은 상대방에게 송달하여야 한다."}, {"no": 265, "no_str": "제265조", "title": "소제기에 따른 시효중단의 시기", "body": "시효의 중단 또는 법률상 기간을 지킴에 필요한 재판상 청구는 소를 제기한\n때 또는 제260조제2항ㆍ제262조제2항 또는 제264조제2항의 규정에 따라 서면을 법원에 제출한 때에 그 효력이 생\n긴다."}, {"no": 266, "no_str": "제266조", "title": "소의 취하", "body": "①소는 판결이 확정될 때까지 그 전부나 일부를 취하할 수 있다.\n②소의 취하는 상대방이 본안에 관하여 준비서면을 제출하거나 변론준비기일에서 진술하거나 변론을 한 뒤에는 상\n대방의 동의를 받아야 효력을 가진다.\n③소의 취하는 서면으로 하여야 한다. 다만, 변론 또는 변론준비기일에서 말로 할 수 있다.\n④소장을 송달한 뒤에는 취하의 서면을 상대방에게 송달하여야 한다.\n⑤제3항 단서의 경우에 상대방이 변론 또는 변론준비기일에 출석하지 아니한 때에는 그 기일의 조서등본을 송달하\n여야 한다.\n⑥소취하의 서면이 송달된 날부터 2주 이내에 상대방이 이의를 제기하지 아니한 경우에는 소취하에 동의한 것으로\n본다. 제3항 단서의 경우에 있어서, 상대방이 기일에 출석한 경우에는 소를 취하한 날부터, 상대방이 기일에 출석하\n지 아니한 경우에는 제5항의 등본이 송달된 날부터 2주 이내에 상대방이 이의를 제기하지 아니하는 때에도 또한 같\n다."}, {"no": 267, "no_str": "제267조", "title": "소취하의 효과", "body": "①취하된 부분에 대하여는 소가 처음부터 계속되지 아니한 것으로 본다.\n②본안에 대한 종국판결이 있은 뒤에 소를 취하한 사람은 같은 소를 제기하지 못한다."}, {"no": 268, "no_str": "제268조", "title": "양 쪽 당사자가 출석하지 아니한 경우", "body": "①양 쪽 당사자가 변론기일에 출석하지 아니하거나 출석하였다 하더라\n도 변론하지 아니한 때에는 재판장은 다시 변론기일을 정하여 양 쪽 당사자에게 통지하여야 한다.\n②제1항의 새 변론기일 또는 그 뒤에 열린 변론기일에 양 쪽 당사자가 출석하지 아니하거나 출석하였다 하더라도\n변론하지 아니한 때에는 1월 이내에 기일지정신청을 하지 아니하면 소를 취하한 것으로 본다.\n③제2항의 기일지정신청에 따라 정한 변론기일 또는 그 뒤의 변론기일에 양쪽 당사자가 출석하지 아니하거나 출석\n하였다 하더라도 변론하지 아니한 때에는 소를 취하한 것으로 본다.\n④상소심의 소송절차에는 제1항 내지 제3항의 규정을 준용한다. 다만, 상소심에서는 상소를 취하한 것으로 본다."}, {"no": 269, "no_str": "제269조", "title": "반소", "body": "①피고는 소송절차를 현저히 지연시키지 아니하는 경우에만 변론을 종결할 때까지 본소가 계속된 법원\n에 반소를 제기할 수 있다. 다만, 소송의 목적이 된 청구가 다른 법원의 관할에 전속되지 아니하고 본소의 청구 또는\n방어의 방법과 서로 관련이 있어야 한다.\n②본소가 단독사건인 경우에 피고가 반소로 합의사건에 속하는 청구를 한 때에는 법원은 직권 또는 당사자의 신청\n에 따른 결정으로 본소와 반소를 합의부에 이송하여야 한다. 다만, 반소에 관하여 제30조의 규정에 따른 관할권이\n있는 경우에는 그러하지 아니하다."}, {"no": 270, "no_str": "제270조", "title": "반소의 절차", "body": "반소는 본소에 관한 규정을 따른다."}, {"no": 271, "no_str": "제271조", "title": "반소의 취하", "body": "본소가 취하된 때에는 피고는 원고의 동의 없이 반소를 취하할 수 있다."}, {"no": 272, "no_str": "제272조", "title": "변론의 집중과 준비", "body": "①변론은 집중되어야 하며, 당사자는 변론을 서면으로 준비하여야 한다.\n②단독사건의 변론은 서면으로 준비하지 아니할 수 있다. 다만, 상대방이 준비하지 아니하면 진술할 수 없는 사항은\n그러하지 아니하다."}, {"no": 273, "no_str": "제273조", "title": "준비서면의 제출 등", "body": "준비서면은 그것에 적힌 사항에 대하여 상대방이 준비하는 데 필요한 기간을 두고 제출\n하여야 하며, 법원은 상대방에게 그 부본을 송달하여야 한다."}, {"no": 274, "no_str": "제274조", "title": "준비서면의 기재사항", "body": "①준비서면에는 다음 각호의 사항을 적고, 당사자 또는 대리인이 기명날인 또는 서명한\n다.\n1. 당사자의 성명ㆍ명칭 또는 상호와 주소\n2. 대리인의 성명과 주소\n3. 사건의 표시\n4. 공격 또는 방어의 방법\n5. 상대방의 청구와 공격 또는 방어의 방법에 대한 진술\n6. 덧붙인 서류의 표시\n7. 작성한 날짜\n8. 법원의 표시\n②제1항제4호 및 제5호의 사항에 대하여는 사실상 주장을 증명하기 위한 증거방법과 상대방의 증거방법에 대한 의\n견을 함께 적어야 한다."}, {"no": 275, "no_str": "제275조", "title": "준비서면의 첨부서류", "body": "①당사자가 가지고 있는 문서로서 준비서면에 인용한 것은 그 등본 또는 사본을 붙여야\n한다.\n②문서의 일부가 필요한 때에는 그 부분에 대한 초본을 붙이고, 문서가 많을 때에는 그 문서를 표시하면 된다.\n③제1항 및 제2항의 문서는 상대방이 요구하면 그 원본을 보여주어야 한다."}, {"no": 276, "no_str": "제276조", "title": "준비서면에 적지 아니한 효과", "body": "준비서면에 적지 아니한 사실은 상대방이 출석하지 아니한 때에는 변론에서 주\n장하지 못한다. 다만, 제272조제2항 본문의 규정에 따라 준비서면을 필요로 하지 아니하는 경우에는 그러하지 아니\n하다."}, {"no": 277, "no_str": "제277조", "title": "번역문의 첨부", "body": "외국어로 작성된 문서에는 번역문을 붙여야 한다."}, {"no": 278, "no_str": "제278조", "title": "요약준비서면", "body": "재판장은 당사자의 공격방어방법의 요지를 파악하기 어렵다고 인정하는 때에는 변론을 종결하\n기에 앞서 당사자에게 쟁점과 증거의 정리 결과를 요약한 준비서면을 제출하도록 할 수 있다."}, {"no": 279, "no_str": "제279조", "title": "변론준비절차의 실시", "body": "①변론준비절차에서는 변론이 효율적이고 집중적으로 실시될 수 있도록 당사자의 주장\n과 증거를 정리하여야 한다. <개정 2008. 12. 26.>\n②재판장은 특별한 사정이 있는 때에는 변론기일을 연 뒤에도 사건을 변론준비절차에 부칠 수 있다."}, {"no": 280, "no_str": "제280조", "title": "변론준비절차의 진행", "body": "①변론준비절차는 기간을 정하여, 당사자로 하여금 준비서면, 그 밖의 서류를 제출하게\n하거나 당사자 사이에 이를 교환하게 하고 주장사실을 증명할 증거를 신청하게 하는 방법으로 진행한다.\n②변론준비절차의 진행은 재판장이 담당한다.\n③합의사건의 경우 재판장은 합의부원을 수명법관으로 지정하여 변론준비절차를 담당하게 할 수 있다.\n④재판장은 필요하다고 인정하는 때에는 변론준비절차의 진행을 다른 판사에게 촉탁할 수 있다."}, {"no": 281, "no_str": "제281조", "title": "변론준비절차에서의 증거조사", "body": "①변론준비절차를 진행하는 재판장, 수명법관, 제280조제4항의 판사(이하 “재\n판장등”이라 한다)는 변론의 준비를 위하여 필요하다고 인정하면 증거결정을 할 수 있다.\n②합의사건의 경우에 제1항의 증거결정에 대한 당사자의 이의신청에 관하여는 제138조의 규정을 준용한다.\n③재판장등은 제279조제1항의 목적을 달성하기 위하여 필요한 범위안에서 증거조사를 할 수 있다. 다만, 증인신문\n및 당사자신문은 제313조에 해당되는 경우에만 할 수 있다.\n④제1항 및 제3항의 경우에는 재판장등이 이 법에서 정한 법원과 재판장의 직무를 행한다."}, {"no": 282, "no_str": "제282조", "title": "변론준비기일", "body": "①재판장등은 변론준비절차를 진행하는 동안에 주장 및 증거를 정리하기 위하여 필요하다고\n인정하는 때에는 변론준비기일을 열어 당사자를 출석하게 할 수 있다.\n②사건이 변론준비절차에 부쳐진 뒤 변론준비기일이 지정됨이 없이 4월이 지난 때에는 재판장등은 즉시 변론준비\n기일을 지정하거나 변론준비절차를 끝내야 한다.\n③당사자는 재판장등의 허가를 얻어 변론준비기일에 제3자와 함께 출석할 수 있다.\n④당사자는 변론준비기일이 끝날 때까지 변론의 준비에 필요한 주장과 증거를 정리하여 제출하여야 한다.\n⑤재판장등은 변론준비기일이 끝날 때까지 변론의 준비를 위한 모든 처분을 할 수 있다."}, {"no": 283, "no_str": "제283조", "title": "변론준비기일의 조서", "body": "①변론준비기일의 조서에는 당사자의 진술에 따라 제274조제1항제4호와 제5호에 규정\n한 사항을 적어야 한다. 이 경우 특히 증거에 관한 진술은 명확히 하여야 한다.\n②변론준비기일의 조서에는 제152조 내지 제159조의 규정을 준용한다."}, {"no": 284, "no_str": "제284조", "title": "변론준비절차의 종결", "body": "①재판장등은 다음 각호 가운데 어느 하나에 해당하면 변론준비절차를 종결하여야 한\n다. 다만, 변론의 준비를 계속하여야 할 상당한 이유가 있는 때에는 그러하지 아니하다.\n1. 사건을 변론준비절차에 부친 뒤 6월이 지난 때\n2. 당사자가 제280조제1항의 규정에 따라 정한 기간 이내에 준비서면 등을 제출하지 아니하거나 증거의 신청을 하\n지 아니한 때\n3. 당사자가 변론준비기일에 출석하지 아니한 때\n②변론준비절차를 종결하는 경우에 재판장등은 변론기일을 미리 지정할 수 있다."}, {"no": 285, "no_str": "제285조", "title": "변론준비기일을 종결한 효과", "body": "①변론준비기일에 제출하지 아니한 공격방어방법은 다음 각호 가운데 어느 하\n나에 해당하여야만 변론에서 제출할 수 있다.\n1. 그 제출로 인하여 소송을 현저히 지연시키지 아니하는 때\n2. 중대한 과실 없이 변론준비절차에서 제출하지 못하였다는 것을 소명한 때\n3. 법원이 직권으로 조사할 사항인 때\n②제1항의 규정은 변론에 관하여 제276조의 규정을 적용하는 데에 영향을 미치지 아니한다.\n③소장 또는 변론준비절차전에 제출한 준비서면에 적힌 사항은 제1항의 규정에 불구하고 변론에서 주장할 수 있다.\n다만, 변론준비절차에서 철회되거나 변경된 때에는 그러하지 아니하다."}, {"no": 286, "no_str": "제286조", "title": "준용규정", "body": "변론준비절차에는 제135조 내지 제138조, 제140조, 제142조 내지 제151조, 제225조 내지 제232조,\n제268조 및 제278조의 규정을 준용한다."}, {"no": 287, "no_str": "제287조", "title": "변론준비절차를 마친 뒤의 변론", "body": "①법원은 변론준비절차를 마친 경우에는 첫 변론기일을 거친 뒤 바로 변론을\n종결할 수 있도록 하여야 하며, 당사자는 이에 협력하여야 한다.\n②당사자는 변론준비기일을 마친 뒤의 변론기일에서 변론준비기일의 결과를 진술하여야 한다.\n③법원은 변론기일에 변론준비절차에서 정리된 결과에 따라서 바로 증거조사를 하여야 한다."}, {"no": 287, "no_str": "제287조의2", "title": "비디오 등 중계장치 등에 의한 기일", "body": "① 재판장ㆍ수명법관 또는 수탁판사는 상당하다고 인정하는 때에는\n당사자의 신청을 받거나 동의를 얻어 비디오 등 중계장치에 의한 중계시설을 통하거나 인터넷 화상장치를 이용하여\n변론준비기일 또는 심문기일을 열 수 있다.\n② 법원은 교통의 불편 또는 그 밖의 사정으로 당사자가 법정에 직접 출석하기 어렵다고 인정하는 때에는 당사자의\n신청을 받거나 동의를 얻어 비디오 등 중계장치에 의한 중계시설을 통하거나 인터넷 화상장치를 이용하여 변론기\n일을 열 수 있다. 이 경우 법원은 심리의 공개에 필요한 조치를 취하여야 한다.\n③ 제1항과 제2항에 따른 기일에 관하여는 제327조의2제2항 및 제3항을 준용한다.\n[본조신설 2021. 8. 17.]"}, {"no": 288, "no_str": "제288조", "title": "불요증사실", "body": "법원에서 당사자가 자백한 사실과 현저한 사실은 증명을 필요로 하지 아니한다. 다만, 진실에 어\n긋나는 자백은 그것이 착오로 말미암은 것임을 증명한 때에는 취소할 수 있다."}, {"no": 289, "no_str": "제289조", "title": "증거의 신청과 조사", "body": "①증거를 신청할 때에는 증명할 사실을 표시하여야 한다.\n②증거의 신청과 조사는 변론기일전에도 할 수 있다."}, {"no": 290, "no_str": "제290조", "title": "증거신청의 채택여부", "body": "법원은 당사자가 신청한 증거를 필요하지 아니하다고 인정한 때에는 조사하지 아니할\n수 있다. 다만, 그것이 당사자가 주장하는 사실에 대한 유일한 증거인 때에는 그러하지 아니하다."}, {"no": 291, "no_str": "제291조", "title": "증거조사의 장애", "body": "법원은 증거조사를 할 수 있을지, 언제 할 수 있을지 알 수 없는 경우에는 그 증거를 조사하\n지 아니할 수 있다."}, {"no": 292, "no_str": "제292조", "title": "직권에 의한 증거조사", "body": "법원은 당사자가 신청한 증거에 의하여 심증을 얻을 수 없거나, 그 밖에 필요하다고 인\n정한 때에는 직권으로 증거조사를 할 수 있다."}, {"no": 293, "no_str": "제293조", "title": "증거조사의 집중", "body": "증인신문과 당사자신문은 당사자의 주장과 증거를 정리한 뒤 집중적으로 하여야 한다."}, {"no": 294, "no_str": "제294조", "title": "조사의 촉탁", "body": "법원은 공공기관ㆍ학교, 그 밖의 단체ㆍ개인 또는 외국의 공공기관에게 그 업무에 속하는 사항에\n관하여 필요한 조사 또는 보관중인 문서의 등본ㆍ사본의 송부를 촉탁할 수 있다."}, {"no": 295, "no_str": "제295조", "title": "당사자가 출석하지 아니한 경우의 증거조사", "body": "증거조사는 당사자가 기일에 출석하지 아니한 때에도 할 수 있다."}, {"no": 296, "no_str": "제296조", "title": "외국에서 시행하는 증거조사", "body": "①외국에서 시행할 증거조사는 그 나라에 주재하는 대한민국 대사ㆍ공사ㆍ영사\n또는 그 나라의 관할 공공기관에 촉탁한다.\n②외국에서 시행한 증거조사는 그 나라의 법률에 어긋나더라도 이 법에 어긋나지 아니하면 효력을 가진다."}, {"no": 297, "no_str": "제297조", "title": "법원밖에서의 증거조사", "body": "①법원은 필요하다고 인정할 때에는 법원밖에서 증거조사를 할 수 있다. 이 경우 합의\n부원에게 명하거나 다른 지방법원 판사에게 촉탁할 수 있다.\n②수탁판사는 필요하다고 인정할 때에는 다른 지방법원 판사에게 증거조사를 다시 촉탁할 수 있다. 이 경우 그 사유\n를 수소법원과 당사자에게 통지하여야 한다."}, {"no": 298, "no_str": "제298조", "title": "수탁판사의 기록송부", "body": "수탁판사는 증거조사에 관한 기록을 바로 수소법원에 보내야 한다."}, {"no": 299, "no_str": "제299조", "title": "소명의 방법", "body": "①소명은 즉시 조사할 수 있는 증거에 의하여야 한다.\n②법원은 당사자 또는 법정대리인으로 하여금 보증금을 공탁하게 하거나, 그 주장이 진실하다는 것을 선서하게 하\n여 소명에 갈음할 수 있다.\n③제2항의 선서에는 제320조, 제321조제1항ㆍ제3항ㆍ제4항 및 제322조의 규정을 준용한다."}, {"no": 300, "no_str": "제300조", "title": "보증금의 몰취", "body": "제299조제2항의 규정에 따라 보증금을 공탁한 당사자 또는 법정대리인이 거짓 진술을 한 때에\n법원은 결정으로 보증금을 몰취(沒取)한다."}, {"no": 301, "no_str": "제301조", "title": "거짓 진술에 대한 제재", "body": "제299조제2항의 규정에 따라 선서한 당사자 또는 법정대리인이 거짓 진술을 한 때에\n법원은 결정으로 200만원 이하의 과태료에 처한다."}, {"no": 302, "no_str": "제302조", "title": "불복신청", "body": "제300조 및 제301조의 결정에 대하여는 즉시항고를 할 수 있다."}, {"no": 303, "no_str": "제303조", "title": "증인의 의무", "body": "법원은 특별한 규정이 없으면 누구든지 증인으로 신문할 수 있다."}, {"no": 304, "no_str": "제304조", "title": "대통령ㆍ국회의장ㆍ대법원장ㆍ헌법재판소장의 신문", "body": "대통령ㆍ국회의장ㆍ대법원장 및 헌법재판소장 또는 그\n직책에 있었던 사람을 증인으로 하여 직무상 비밀에 관한 사항을 신문할 경우에 법원은 그의 동의를 받아야 한다."}, {"no": 305, "no_str": "제305조", "title": "국회의원ㆍ국무총리ㆍ국무위원의 신문", "body": "①국회의원 또는 그 직책에 있었던 사람을 증인으로 하여 직무상 비\n밀에 관한 사항을 신문할 경우에 법원은 국회의 동의를 받아야 한다.\n②국무총리ㆍ국무위원 또는 그 직책에 있었던 사람을 증인으로 하여 직무상 비밀에 관한 사항을 신문할 경우에 법\n원은 국무회의의 동의를 받아야 한다."}, {"no": 306, "no_str": "제306조", "title": "공무원의 신문", "body": "제304조와 제305조에 규정한 사람 외의 공무원 또는 공무원이었던 사람을 증인으로 하여 직\n무상 비밀에 관한 사항을 신문할 경우에 법원은 그 소속 관청 또는 감독 관청의 동의를 받아야 한다."}, {"no": 307, "no_str": "제307조", "title": "거부권의 제한", "body": "제305조와 제306조의 경우에 국회ㆍ국무회의 또는 제306조의 관청은 국가의 중대한 이익을\n해치는 경우를 제외하고는 동의를 거부하지 못한다."}, {"no": 308, "no_str": "제308조", "title": "증인신문의 신청", "body": "당사자가 증인신문을 신청하고자 하는 때에는 증인을 지정하여 신청하여야 한다."}, {"no": 309, "no_str": "제309조", "title": "출석요구서의 기재사항", "body": "증인에 대한 출석요구서에는 다음 각호의 사항을 적어야 한다.\n1. 당사자의 표시\n2. 신문 사항의 요지\n3. 출석하지 아니하는 경우의 법률상 제재"}, {"no": 310, "no_str": "제310조", "title": "증언에 갈음하는 서면의 제출", "body": "①법원은 증인과 증명할 사항의 내용 등을 고려하여 상당하다고 인정하는 때에\n는 출석ㆍ증언에 갈음하여 증언할 사항을 적은 서면을 제출하게 할 수 있다.\n②법원은 상대방의 이의가 있거나 필요하다고 인정하는 때에는 제1항의 증인으로 하여금 출석ㆍ증언하게 할 수 있\n다."}, {"no": 311, "no_str": "제311조", "title": "증인이 출석하지 아니한 경우의 과태료 등", "body": "①증인이 정당한 사유 없이 출석하지 아니한 때에 법원은 결정으\n로 증인에게 이로 말미암은 소송비용을 부담하도록 명하고 500만원 이하의 과태료에 처한다.\n②법원은 증인이 제1항의 규정에 따른 과태료의 재판을 받고도 정당한 사유 없이 다시 출석하지 아니한 때에는 결\n정으로 증인을 7일 이내의 감치(監置)에 처한다.\n③법원은 감치재판기일에 증인을 소환하여 제2항의 정당한 사유가 있는지 여부를 심리하여야 한다.\n④감치에 처하는 재판은 그 재판을 한 법원의 재판장의 명령에 따라 법원공무원 또는 경찰공무원이 경찰서유치장\nㆍ교도소 또는 구치소에 유치함으로써 집행한다.<개정 2006. 2. 21., 2020. 12. 22.>\n⑤감치의 재판을 받은 증인이 제4항에 규정된 감치시설에 유치된 때에는 당해 감치시설의 장은 즉시 그 사실을 법\n원에 통보하여야 한다.\n⑥법원은 제5항의 통보를 받은 때에는 바로 증인신문기일을 열어야 한다.\n⑦감치의 재판을 받은 증인이 감치의 집행중에 증언을 한 때에는 법원은 바로 감치결정을 취소하고 그 증인을 석방\n하도록 명하여야 한다.\n⑧제1항과 제2항의 결정에 대하여는 즉시항고를 할 수 있다. 다만, 제447조의 규정은 적용하지 아니한다.\n⑨제2항 내지 제8항의 규정에 따른 재판절차 및 그 집행 그 밖에 필요한 사항은 대법원규칙으로 정한다."}, {"no": 312, "no_str": "제312조", "title": "출석하지 아니한 증인의 구인", "body": "①법원은 정당한 사유 없이 출석하지 아니한 증인을 구인(拘引)하도록 명할 수\n있다.\n②제1항의 구인에는 형사소송법의 구인에 관한 규정을 준용한다."}, {"no": 313, "no_str": "제313조", "title": "수명법관ㆍ수탁판사에 의한 증인신문", "body": "법원은 다음 각호 가운데 어느 하나에 해당하면 수명법관 또는 수탁판\n사로 하여금 증인을 신문하게 할 수 있다.\n1. 증인이 정당한 사유로 수소법원에 출석하지 못하는 때\n2. 증인이 수소법원에 출석하려면 지나치게 많은 비용 또는 시간을 필요로 하는 때\n3. 그 밖의 상당한 이유가 있는 경우로서 당사자가 이의를 제기하지 아니하는 때"}, {"no": 314, "no_str": "제314조", "title": "증언거부권", "body": "증인은 그 증언이 자기나 다음 각호 가운데 어느 하나에 해당하는 사람이 공소제기되거나 유죄판\n결을 받을 염려가 있는 사항 또는 자기나 그들에게 치욕이 될 사항에 관한 것인 때에는 이를 거부할 수 있다. <개정\n2005. 3. 31.>\n1. 증인의 친족 또는 이러한 관계에 있었던 사람\n2. 증인의 후견인 또는 증인의 후견을 받는 사람"}, {"no": 315, "no_str": "제315조", "title": "증언거부권", "body": "①증인은 다음 각호 가운데 어느 하나에 해당하면 증언을 거부할 수 있다.\n1. 변호사ㆍ변리사ㆍ공증인ㆍ공인회계사ㆍ세무사ㆍ의료인ㆍ약사, 그 밖에 법령에 따라 비밀을 지킬 의무가 있는 직\n책 또는 종교의 직책에 있거나 이러한 직책에 있었던 사람이 직무상 비밀에 속하는 사항에 대하여 신문을 받을\n때\n2. 기술 또는 직업의 비밀에 속하는 사항에 대하여 신문을 받을 때\n②증인이 비밀을 지킬 의무가 면제된 경우에는 제1항의 규정을 적용하지 아니한다."}, {"no": 316, "no_str": "제316조", "title": "거부이유의 소명", "body": "증언을 거부하는 이유는 소명하여야 한다."}, {"no": 317, "no_str": "제317조", "title": "증언거부에 대한 재판", "body": "①수소법원은 당사자를 심문하여 증언거부가 옳은 지를 재판한다.\n②당사자 또는 증인은 제1항의 재판에 대하여 즉시항고를 할 수 있다."}, {"no": 318, "no_str": "제318조", "title": "증언거부에 대한 제재", "body": "증언의 거부에 정당한 이유가 없다고 한 재판이 확정된 뒤에 증인이 증언을 거부한 때\n에는 제311조제1항, 제8항 및 제9항의 규정을 준용한다."}, {"no": 319, "no_str": "제319조", "title": "선서의 의무", "body": "재판장은 증인에게 신문에 앞서 선서를 하게 하여야 한다. 다만, 특별한 사유가 있는 때에는 신문\n한 뒤에 선서를 하게 할 수 있다."}, {"no": 320, "no_str": "제320조", "title": "위증에 대한 벌의 경고", "body": "재판장은 선서에 앞서 증인에게 선서의 취지를 밝히고, 위증의 벌에 대하여 경고하여\n야 한다."}, {"no": 321, "no_str": "제321조", "title": "선서의 방식", "body": "①선서는 선서서에 따라서 하여야 한다.\n②선서서에는 “양심에 따라 숨기거나 보태지 아니하고 사실 그대로 말하며, 만일 거짓말을 하면 위증의 벌을 받기\n로 맹세합니다.”라고 적어야 한다.\n③재판장은 증인으로 하여금 선서서를 소리내어 읽고 기명날인 또는 서명하게 하며, 증인이 선서서를 읽지 못하거\n나 기명날인 또는 서명하지 못하는 경우에는 참여한 법원사무관등이나 그 밖의 법원공무원으로 하여금 이를 대신\n하게 한다.\n④증인은 일어서서 엄숙하게 선서하여야 한다."}, {"no": 322, "no_str": "제322조", "title": "선서무능력", "body": "다음 각호 가운데 어느 하나에 해당하는 사람을 증인으로 신문할 때에는 선서를 시키지 못한다.\n1. 16세 미만인 사람\n2. 선서의 취지를 이해하지 못하는 사람"}, {"no": 323, "no_str": "제323조", "title": "선서의 면제", "body": "제314조에 해당하는 증인으로서 증언을 거부하지 아니한 사람을 신문할 때에는 선서를 시키지\n아니할 수 있다."}, {"no": 324, "no_str": "제324조", "title": "선서거부권", "body": "증인이 자기 또는 제314조 각호에 규정된 어느 한 사람과 현저한 이해관계가 있는 사항에 관하여\n신문을 받을 때에는 선서를 거부할 수 있다."}, {"no": 325, "no_str": "제325조", "title": "조서에의 기재", "body": "선서를 시키지 아니하고 증인을 신문한 때에는 그 사유를 조서에 적어야 한다."}, {"no": 326, "no_str": "제326조", "title": "선서거부에 대한 제재", "body": "증인이 선서를 거부하는 경우에는 제316조 내지 제318조의 규정을 준용한다."}, {"no": 327, "no_str": "제327조", "title": "증인신문의 방식", "body": "①증인신문은 증인을 신청한 당사자가 먼저 하고, 다음에 다른 당사자가 한다.\n②재판장은 제1항의 신문이 끝난 뒤에 신문할 수 있다.\n③재판장은 제1항과 제2항의 규정에 불구하고 언제든지 신문할 수 있다.\n④재판장이 알맞다고 인정하는 때에는 당사자의 의견을 들어 제1항과 제2항의 규정에 따른 신문의 순서를 바꿀 수\n있다.\n⑤당사자의 신문이 중복되거나 쟁점과 관계가 없는 때, 그 밖에 필요한 사정이 있는 때에 재판장은 당사자의 신문을\n제한할 수 있다.\n⑥합의부원은 재판장에게 알리고 신문할 수 있다."}, {"no": 327, "no_str": "제327조의2", "title": "비디오 등 중계장치에 의한 증인신문", "body": "① 법원은 다음 각 호의 어느 하나에 해당하는 사람을 증인으로 신문\n하는 경우 상당하다고 인정하는 때에는 당사자의 의견을 들어 비디오 등 중계장치에 의한 중계시설을 통하거나 인\n터넷 화상장치를 이용하여 신문할 수 있다. <개정 2021. 8. 17.>\n1. 증인이 멀리 떨어진 곳 또는 교통이 불편한 곳에 살고 있거나 그 밖의 사정으로 말미암아 법정에 직접 출석하기\n어려운 경우\n2. 증인이 나이, 심신상태, 당사자나 법정대리인과의 관계, 신문사항의 내용, 그 밖의 사정으로 말미암아 법정에서\n당사자 등과 대면하여 진술하면 심리적인 부담으로 정신의 평온을 현저하게 잃을 우려가 있는 경우\n② 제1항에 따른 증인신문은 증인이 법정에 출석하여 이루어진 증인신문으로 본다.\n③ 제1항에 따른 증인신문의 절차와 방법, 그 밖에 필요한 사항은 대법원규칙으로 정한다.\n[본조신설 2016. 3. 29.]"}, {"no": 328, "no_str": "제328조", "title": "격리신문과 그 예외", "body": "①증인은 따로따로 신문하여야 한다.\n②신문하지 아니한 증인이 법정(法廷)안에 있을 때에는 법정에서 나가도록 명하여야 한다. 다만, 필요하다고 인정한\n때에는 신문할 증인을 법정안에 머무르게 할 수 있다."}, {"no": 329, "no_str": "제329조", "title": "대질신문", "body": "재판장은 필요하다고 인정한 때에는 증인 서로의 대질을 명할 수 있다."}, {"no": 330, "no_str": "제330조", "title": "증인의 행위의무", "body": "재판장은 필요하다고 인정한 때에는 증인에게 문자를 손수 쓰게 하거나 그 밖의 필요한 행\n위를 하게 할 수 있다."}, {"no": 331, "no_str": "제331조", "title": "증인의 진술원칙", "body": "증인은 서류에 의하여 진술하지 못한다. 다만, 재판장이 허가하면 그러하지 아니하다."}, {"no": 332, "no_str": "제332조", "title": "수명법관ㆍ수탁판사의 권한", "body": "수명법관 또는 수탁판사가 증인을 신문하는 경우에는 법원과 재판장의 직무를\n행한다."}, {"no": 333, "no_str": "제333조", "title": "증인신문규정의 준용", "body": "감정에는 제2절의 규정을 준용한다. 다만, 제311조제2항 내지 제7항, 제312조, 제321조\n제2항, 제327조 및 제327조의2는 그러하지
