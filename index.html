고 총리령으로 정하는 특허료 및 수수료를 감면할 수 있다.<개정 2016. 3. 29.,\n2021. 8. 17., 2025. 10. 1.>\n1. 「국민기초생활 보장법」에 따른 의료급여 수급자\n2. 「재난 및 안전관리 기본법」 제36조에 따른 재난사태 또는 같은 법 제60조에 따른 특별재난지역으로 선포된 지역\n에 거주하거나 주된 사무소를 두고 있는 자 중 총리령으로 정하는 요건을 갖춘 자\n3. 그 밖에 총리령으로 정하는 자\n③ 제2항에 따라 특허료 및 수수료를 감면받으려는 자는 총리령으로 정하는 서류를 지식재산처장에게 제출하여야\n한다.<개정 2025. 10. 1.>\n④ 지식재산처장은 제2항에 따른 특허료 및 수수료 감면을 거짓이나 그 밖의 부정한 방법으로 받은 자에 대하여는\n총리령으로 정하는 바에 따라 감면받은 특허료 및 수수료의 2배액을 징수할 수 있다. 이 경우 그 출원인 또는 특허\n권자가 하는 특허출원 또는 그 특허출원하여 받은 특허권에 대해서는 총리령으로 정하는 기간 동안 제2항을 적용하\n지 아니한다.<신설 2021. 8. 17., 2025. 10. 1.>\n[전문개정 2014. 6. 11.]"}, {"no": 84, "no_str": "제84조", "title": "특허료 등의 반환", "body": "① 납부된 특허료 및 수수료는 다음 각 호의 어느 하나에 해당하는 경우에만 납부한 자의 청\n구에 의하여 반환한다. <개정 2015. 5. 18., 2016. 2. 29., 2016. 3. 29., 2021. 8. 17., 2021. 10. 19.>\n1. 잘못 납부된 특허료 및 수수료\n2. 제132조의13제1항에 따른 특허취소결정이나 특허를 무효로 한다는 심결이 확정된 해의 다음 해부터의 특허료\n해당분\n3. 특허권의 존속기간의 연장등록을 무효로 한다는 심결이 확정된 해의 다음 해부터의 특허료 해당분\n4. 특허출원(분할출원, 분리출원, 변경출원 및 제61조에 따른 우선심사의 신청을 한 특허출원은 제외한다) 후 1개월\n이내에 그 특허출원을 취하하거나 포기한 경우에 이미 낸 수수료 중 특허출원료 및 특허출원의 우선권 주장 신청\n료\n5. 출원심사의 청구를 한 이후 다음 각 목 중 어느 하나가 있기 전까지 특허출원을 취하(제53조제4항 또는 제56조제\n1항 본문에 따라 취하된 것으로 보는 경우를 포함한다. 이하 이 조에서 같다)하거나 포기한 경우 이미 낸 심사청\n구료\n가. 제36조제6항에 따른 협의 결과 신고 명령(동일인에 의한 특허출원에 한정한다)\n나. 삭제<2021. 8. 17.>\n다. 제63조에 따른 거절이유통지\n라. 제67조제2항에 따른 특허결정의 등본 송달\n5의2. 출원심사의 청구를 한 이후 다음 각 목의 어느 하나에 해당하는 기간 내에 특허출원을 취하하거나 포기한 경\n우 이미 낸 심사청구료의 3분의 1에 해당하는 금액\n가. 제5호가목에 따른 신고 명령 후 신고기간 만료 전까지\n나. 제5호다목에 따른 거절이유통지(제47조제1항제1호에 해당하는 경우로 한정한다) 후 의견서 제출기간 만료 전\n까지\n6. 특허권을 포기한 해의 다음 해부터의 특허료 해당분\n7. 제176조제1항에 따라 특허거절결정 또는 특허권의 존속기간의 연장등록거절결정이 취소된 경우(제184조에 따라\n재심의 절차에서 준용되는 경우를 포함하되, 심판 또는 재심 중 제170조제1항에 따라 준용되는 제47조제1항제\n1호 또는 제2호에 따른 보정이 있는 경우는 제외한다)에 이미 낸 수수료 중 심판청구료(재심의 경우에는 재심청\n구료를 말한다. 이하 이 조에서 같다)\n8. 심판청구가 제141조제2항에 따라 결정으로 각하되고 그 결정이 확정된 경우(제184조에 따라 재심의 절차에서 준\n용되는 경우를 포함한다)에 이미 낸 심판청구료의 2분의 1에 해당하는 금액\n9. 심리의 종결을 통지받기 전까지 제155조제1항에 따른 참가신청을 취하한 경우(제184조에 따라 재심의 절차에서\n준용되는 경우를 포함한다)에 이미 낸 수수료 중 참가신청료의 2분의 1에 해당하는 금액\n10. 제155조제1항에 따른 참가신청이 결정으로 거부된 경우(제184조에 따라 재심의 절차에서 준용되는 경우를 포\n함한다)에 이미 낸 수수료 중 참가신청료의 2분의 1에 해당하는 금액\n11. 심리의 종결을 통지받기 전까지 심판청구를 취하한 경우(제184조에 따라 재심의 절차에서 준용되는 경우를 포\n함한다)에 이미 낸 수수료 중 심판청구료의 2분의 1에 해당하는 금액\n② 지식재산처장 또는 특허심판원장은 납부된 특허료 및 수수료가 제1항 각 호의 어느 하나에 해당하는 경우에는\n그 사실을 납부한 자에게 통지하여야 한다.<개정 2016. 3. 29., 2025. 10. 1.>\n③ 제1항에 따른 특허료 및 수수료의 반환청구는 제2항에 따른 통지를 받은 날부터 5년이 지나면 할 수 없다.<개정\n2022. 10. 18.>\n[전문개정 2014. 6. 11.]"}, {"no": 85, "no_str": "제85조", "title": "특허원부", "body": "① 지식재산처장은 지식재산처에 특허원부를 갖추어 두고 다음 각 호의 사항을 등록한다. <개정\n2025. 10. 1.>\n1. 특허권의 설정ㆍ이전ㆍ소멸ㆍ회복ㆍ처분의 제한 또는 존속기간의 연장\n2. 전용실시권 또는 통상실시권의 설정ㆍ보존ㆍ이전ㆍ변경ㆍ소멸 또는 처분의 제한\n3. 특허권ㆍ전용실시권 또는 통상실시권을 목적으로 하는 질권의 설정ㆍ이전ㆍ변경ㆍ소멸 또는 처분의 제한\n② 제1항에 따른 특허원부는 그 전부 또는 일부를 전자적 기록매체 등으로 작성할 수 있다.\n③ 제1항 및 제2항에서 규정한 사항 외에 등록사항 및 등록절차 등에 관하여 필요한 사항은 대통령령으로 정한다.\n④ 특허발명의 명세서 및 도면, 그 밖에 대통령령으로 정하는 서류는 특허원부의 일부로 본다.\n[전문개정 2014. 6. 11.]"}, {"no": 86, "no_str": "제86조", "title": "특허증의 발급", "body": "① 지식재산처장은 특허권의 설정등록을 한 경우에는 총리령으로 정하는 바에 따라 특허권자에\n게 특허증을 발급하여야 한다. <개정 2025. 10. 1.>\n② 지식재산처장은 특허증이 특허원부나 그 밖의 서류와 맞지 아니하면 신청에 따라 또는 직권으로 특허증을 회수\n하여 정정발급하거나 새로운 특허증을 발급하여야 한다.<개정 2025. 10. 1.>\n③ 지식재산처장은 다음 각 호의 어느 하나에 해당하는 경우에는 결정, 심결 또는 이전등록에 따른 새로운 특허증을\n발급하여야 한다.<개정 2016. 2. 29., 2025. 10. 1.>\n1. 특허발명의 명세서 또는 도면의 정정을 인정한다는 취지의 결정 또는 심결이 확정된 경우\n2. 제99조의2제2항에 따라 특허권이 이전등록된 경우\n[전문개정 2014. 6. 11.]"}, {"no": 87, "no_str": "제87조", "title": "특허권의 설정등록 및 등록공고", "body": "① 특허권은 설정등록에 의하여 발생한다.\n② 지식재산처장은 다음 각 호의 어느 하나에 해당하는 경우에는 특허권을 설정하기 위한 등록을 하여야 한다.<개\n정 2025. 10. 1.>\n1. 제79조제1항에 따라 특허료를 냈을 때\n2. 제81조제1항에 따라 특허료를 추가로 냈을 때\n3. 제81조의2제2항에 따라 특허료를 보전하였을 때\n4. 제81조의3제1항에 따라 특허료를 내거나 보전하였을 때\n5. 제83조제1항제1호 및 같은 조 제2항에 따라 그 특허료가 면제되었을 때\n③ 지식재산처장은 제2항에 따라 등록한 경우에는 다음 각 호의 사항을 특허공보에 게재하여 등록공고를 하여야 한\n다.<개정 2016. 2. 29., 2025. 10. 1.>\n1. 특허권자의 성명 및 주소(법인인 경우에는 그 명칭 및 영업소의 소재지를 말한다)\n2. 특허출원번호 및 출원연월일\n3. 발명자의 성명 및 주소\n4. 특허출원서에 첨부된 요약서\n5. 특허번호 및 설정등록연월일\n6. 등록공고연월일\n7. 제63조제1항 각 호 외의 부분 본문에 따라 통지한 거절이유에 선행기술에 관한 정보(선행기술이 적혀 있는 간행\n물의 명칭과 그 밖에 선행기술에 관한 정보의 소재지를 말한다)가 포함된 경우 그 정보\n8. 그 밖에 대통령령으로 정하는 사항\n④ 비밀취급이 필요한 특허발명에 대해서는 그 발명의 비밀취급이 해제될 때까지 그 특허의 등록공고를 보류하여\n야 하며, 그 발명의 비밀취급이 해제된 경우에는 지체 없이 제3항에 따라 등록공고를 하여야 한다.\n⑤ 삭제<2016. 2. 29.>\n[전문개정 2014. 6. 11.]"}, {"no": 88, "no_str": "제88조", "title": "특허권의 존속기간", "body": "① 특허권의 존속기간은 제87조제1항에 따라 특허권을 설정등록한 날부터 특허출원일 후\n20년이 되는 날까지로 한다.\n② 정당한 권리자의 특허출원이 제34조 또는 제35조에 따라 특허된 경우에는 제1항의 특허권의 존속기간은 무권리\n자의 특허출원일의 다음 날부터 기산한다.\n[전문개정 2014. 6. 11.]"}, {"no": 89, "no_str": "제89조", "title": "허가등에 따른 특허권의 존속기간의 연장", "body": "① 특허발명을 실시하기 위하여 다른 법령에 따라 허가를 받거나 등\n록 등을 하여야 하고, 그 허가 또는 등록 등(이하 “허가등”이라 한다)을 위하여 필요한 유효성ㆍ안전성 등의 시험으로\n인하여 장기간이 소요되는 대통령령으로 정하는 발명인 경우에는 제88조제1항에도 불구하고 그 실시할 수 없었던\n기간에 대하여 5년의 기간까지 그 특허권의 존속기간(제92조의5제2항에 따라 특허권의 존속기간의 연장이 등록된\n경우에는 그 연장된 날까지를 말한다 )을 한 차례만 연장할 수 있다. 다만, 허가등을 받은 날부터 14년을 초과하여 연\n장할 수 없다. <개정 2025. 1. 21.>\n② 제1항을 적용할 때 허가등을 받은 자에게 책임있는 사유로 소요된 기간은 제1항의 “실시할 수 없었던 기간”에 포\n함되지 아니한다.\n[전문개정 2014. 6. 11.]"}, {"no": 90, "no_str": "제90조", "title": "허가등에 따른 특허권의 존속기간의 연장등록출원", "body": "① 제89조제1항에 따라 특허권의 존속기간의 연장등록출원\n을 하려는 자(이하 이 조 및 제91조에서 “연장등록출원인”이라 한다)는 다음 각 호의 사항을 적은 특허권의 존속기간\n의 연장등록출원서를 지식재산처장에게 제출하여야 한다. <개정 2025. 10. 1.>\n1. 연장등록출원인의 성명 및 주소(법인인 경우에는 그 명칭 및 영업소의 소재지)\n2. 연장등록출원인의 대리인이 있는 경우에는 그 대리인의 성명 및 주소나 영업소의 소재지[대리인이 특허법인ㆍ특\n허법인(유한)인 경우에는 그 명칭, 사무소의 소재지 및 지정된 변리사의 성명]\n3. 연장대상특허권의 특허번호 및 연장대상청구범위의 표시\n4. 연장신청의 기간\n5. 제89조제1항에 따른 허가등의 내용\n6. 총리령으로 정하는 연장이유(이를 증명할 수 있는 자료를 첨부하여야 한다)\n② 제1항에 따른 특허권의 존속기간의 연장등록출원은 제89조제1항에 따른 허가등을 받은 날부터 3개월 이내에 출\n원하여야 한다. 다만, 제88조에 따른 특허권의 존속기간의 만료 전 6개월 이후에는 그 특허권의 존속기간의 연장등\n록출원을 할 수 없다.\n③ 특허권이 공유인 경우에는 공유자 모두가 공동으로 특허권의 존속기간의 연장등록출원을 하여야 한다.\n④ 제1항에 따른 특허권의 존속기간의 연장등록출원이 있으면 그 존속기간은 연장된 것으로 본다. 다만, 그 출원에\n관하여 제91조의 연장등록거절결정이 확정된 경우에는 그러하지 아니하다.\n⑤ 지식재산처장은 제1항에 따른 특허권의 존속기간의 연장등록출원이 있으면 제1항 각 호의 사항을 특허공보에\n게재하여야 한다.<개정 2025. 10. 1.>\n⑥ 연장등록출원인은 지식재산처장이 연장등록여부결정등본을 송달하기 전까지 연장등록출원서에 적혀 있는 사항\n중 제1항제3호부터 제6호까지의 사항(제3호 중 연장대상특허권의 특허번호는 제외한다)에 대하여 보정할 수 있다.\n다만, 제93조에 따라 준용되는 거절이유통지를 받은 후에는 해당 거절이유통지에 따른 의견서 제출기간에만 보정\n할 수 있다.<개정 2025. 10. 1.>\n⑦ 하나의 허가등에 대하여 둘 이상의 특허권이 있는 경우에는 연장등록출원인은 그 중 하나의 특허권에 대해서만\n존속기간의 연장등록출원을 하여야 하고, 하나의 허가등에 대하여 둘 이상의 특허권에 대한 존속기간의 연장등록출\n원이 있는 경우에는 어느 특허권의 존속기간도 연장할 수 없다.<신설 2025. 1. 21.>\n⑧ 특허권의 존속기간의 연장등록출원이 다음 각 호의 어느 하나에 해당하는 경우 그 출원은 제7항을 적용할 때는\n처음부터 없었던 것으로 본다.<신설 2025. 1. 21.>\n1. 포기, 무효 또는 취하된 경우\n2. 거절결정이나 거절한다는 취지의 심결이 확정된 경우\n[전문개정 2014. 6. 11.]"}, {"no": 91, "no_str": "제91조", "title": "허가등에 따른 특허권의 존속기간의 연장등록거절결정", "body": "심사관은 제90조에 따른 특허권의 존속기간의 연장등\n록출원이 다음 각 호의 어느 하나에 해당하는 경우에는 그 출원에 대하여 연장등록거절결정을 하여야 한다. <개정\n2025. 1. 21.>\n1. 그 특허발명의 실시가 제89조제1항에 따른 허가등을 받을 필요가 있는 것으로 인정되지 아니하는 경우\n2. 그 특허권자 또는 그 특허권의 전용실시권이나 등록된 통상실시권을 가진 자가 제89조제1항에 따른 허가등을 받\n지 아니한 경우\n3. 연장신청의 기간이 제89조에 따라 인정되는 연장의 기간을 초과하는 경우\n4. 연장등록출원인이 해당 특허권자가 아닌 경우\n5. 제90조제3항을 위반하여 연장등록출원을 한 경우\n6. 제90조제7항을 위반하여 하나의 허가등에 대하여 둘 이상의 특허권에 대한 존속기간의 연장등록출원을 한 경우\n[전문개정 2014. 6. 11.]"}, {"no": 92, "no_str": "제92조", "title": "허가등에 따른 특허권의 존속기간의 연장등록결정 등", "body": "① 심사관은 제90조에 따른 특허권의 존속기간의 연장등\n록출원에 대하여 제91조 각 호의 어느 하나에 해당하는 사유를 발견할 수 없을 때에는 연장등록결정을 하여야 한다.\n② 지식재산처장은 제1항에 따른 연장등록결정을 한 경우에는 특허권의 존속기간의 연장을 특허원부에 등록하여야\n한다.<개정 2025. 10. 1.>\n③ 지식재산처장은 제2항에 따른 등록을 한 경우에는 다음 각 호의 사항을 특허공보에 게재하여야 한다.<개정\n2025. 10. 1.>\n1. 특허권자의 성명 및 주소(법인인 경우에는 그 명칭 및 영업소의 소재지)\n2. 특허번호\n3. 연장등록의 연월일\n4. 연장기간\n5. 제89조제1항에 따른 허가등의 내용\n[전문개정 2014. 6. 11.]"}, {"no": 92, "no_str": "제92조의2", "title": "등록지연에 따른 특허권의 존속기간의 연장", "body": "① 특허출원에 대하여 특허출원일부터 4년과 출원심사 청구일\n부터 3년 중 늦은 날보다 지연되어 특허권의 설정등록이 이루어지는 경우에는 제88조제1항에도 불구하고 그 지연된\n기간만큼 해당 특허권의 존속기간을 연장할 수 있다.\n② 제1항의 규정을 적용함에 있어서 출원인으로 인하여 지연된 기간은 제1항에 따른 특허권의 존속기간의 연장에\n서 제외된다. 다만, 출원인으로 인하여 지연된 기간이 겹치는 경우에는 특허권의 존속기간의 연장에서 제외되는 기\n간은 출원인으로 인하여 실제 지연된 기간을 초과하여서는 아니된다.\n③ 제2항에서 “출원인으로 인하여 지연된 기간”에 관한 사항은 대통령령으로 정한다.\n④ 제1항에 따라 특허출원일부터 4년을 기산할 때에는 제34조, 제35조, 제52조제2항, 제52조의2제2항, 제53조제\n2항, 제199조제1항 및 제214조제4항에도 불구하고 다음 각 호에 해당하는 날을 특허출원일로 본다.<개정 2021. 10.\n19.>\n1. 제34조 또는 제35조에 따른 정당한 권리자의 특허출원의 경우에는 정당한 권리자가 출원을 한 날\n2. 제52조에 따른 분할출원의 경우에는 분할출원을 한 날\n2의2. 제52조의2에 따른 분리출원의 경우에는 분리출원을 한 날\n3. 제53조에 따른 변경출원의 경우에는 변경출원을 한 날\n4. 제199조제1항에 따라 특허출원으로 보는 국제출원의 경우에는 제203조제1항 각 호의 사항을 기재한 서면을 제\n출한 날\n5. 제214조에 따라 특허출원으로 보는 국제출원의 경우에는 국제출원의 출원인이 제214조제1항에 따라 결정을 신\n청한 날\n6. 제1호부터 제5호까지의 규정 중 어느 하나에 해당되지 아니하는 특허출원에 대하여는 그 특허출원일\n[본조신설 2011. 12. 2.]"}, {"no": 92, "no_str": "제92조의3", "title": "등록지연에 따른 특허권의 존속기간의 연장등록출원", "body": "① 제92조의2에 따라 특허권의 존속기간의 연장등록\n출원을 하려는 자(이하 이 조 및 제92조의4에서 “연장등록출원인”이라 한다)는 다음 각 호의 사항을 적은 특허권의\n존속기간의 연장등록출원서를 지식재산처장에게 제출하여야 한다. <개정 2013. 3. 23., 2013. 7. 30., 2025. 10. 1.>\n1. 연장등록출원인의 성명 및 주소(법인인 경우에는 그 명칭 및 영업소의 소재지)\n2. 연장등록출원인의 대리인이 있는 경우에는 그 대리인의 성명 및 주소나 영업소의 소재지(대리인이 특허법인ㆍ특\n허법인(유한)인 경우에는 그 명칭, 사무소의 소재지 및 지정된 변리사의 성명)\n3. 연장 대상 특허권의 특허번호\n4. 연장신청의 기간\n5. 총리령이 정하는 연장이유(이를 증명할 수 있는 자료를 첨부하여야 한다)\n② 제1항에 따른 특허권의 존속기간의 연장등록출원은 특허권의 설정등록일부터 3개월 이내에 출원하여야 한다.\n③ 특허권이 공유인 경우에는 공유자 전원이 공동으로 특허권의 존속기간의 연장등록출원을 하여야 한다.\n④ 연장등록출원인은 심사관이 특허권의 존속기간의 연장등록 여부결정 전까지 연장등록출원서에 기재된 사항 중\n제1항제4호 및 제5호의 사항에 대하여 보정할 수 있다. 다만, 제93조에 따라 준용되는 거절이유통지를 받은 후에는\n해당 거절이유통지에 따른 의견서 제출기간에만 보정할 수 있다.\n[본조신설 2011. 12. 2.]"}, {"no": 92, "no_str": "제92조의4", "title": "등록지연에 따른 특허권의 존속기간의 연장등록거절결정", "body": "심사관은 제92조의3에 따른 특허권의 존속기간의\n연장등록출원이 다음 각 호의 어느 하나에 해당하는 경우에는 그 출원에 대하여 연장등록거절결정을 하여야 한다.\n1. 연장신청의 기간이 제92조의2에 따라 인정되는 연장의 기간을 초과한 경우\n2. 연장등록출원인이 해당 특허권자가 아닌 경우\n3. 제92조의3제3항을 위반하여 연장등록출원을 한 경우\n[본조신설 2011. 12. 2.]"}, {"no": 92, "no_str": "제92조의5", "title": "등록지연에 따른 특허권의 존속기간의 연장등록결정 등", "body": "① 심사관은 제92조의3에 따른 특허권의 존속기간\n의 연장등록출원에 대하여 제92조의4 각 호의 어느 하나에 해당하는 사유를 발견할 수 없는 경우에는 연장등록결정\n을 하여야 한다.\n② 지식재산처장은 제1항의 연장등록결정이 있으면 특허권의 존속기간의 연장을 특허원부에 등록하여야 한다.<개\n정 2025. 10. 1.>\n③ 제2항에 따른 등록이 있으면 다음 각 호의 사항을 특허공보에 게재하여야 한다.\n1. 특허권자의 성명 및 주소(법인인 경우에는 그 명칭 및 영업소의 소재지)\n2. 특허번호\n3. 연장등록 연월일\n4. 연장 기간\n[본조신설 2011. 12. 2.]"}, {"no": 93, "no_str": "제93조", "title": "준용규정", "body": "특허권의 존속기간의 연장등록출원의 심사에 관하여는 제57조제1항, 제63조, 제67조, 제78조제1항ㆍ\n제3항, 제148조제1호부터 제5호까지 및 같은 조 제7호를 준용한다. 이 경우 제78조제1항 중 “특허취소신청에 대한\n결정”은 “제92조의4 및 제92조의5에 따른 연장등록거절결정 또는 연장등록결정”으로, “그 심사절차”는 “허가등에 따\n른 연장등록출원 심사 절차”로 본다. <개정 2025. 1. 21.>\n[전문개정 2011. 12. 2.]"}, {"no": 94, "no_str": "제94조", "title": "특허권의 효력", "body": "① 특허권자는 업으로서 특허발명을 실시할 권리를 독점한다. 다만, 그 특허권에 관하여 전용실\n시권을 설정하였을 때에는 제100조제2항에 따라 전용실시권자가 그 특허발명을 실시할 권리를 독점하는 범위에서\n는 그러하지 아니하다. <개정 2019. 12. 10.>\n② 특허발명의 실시가 제2조제3호나목에 따른 방법의 사용을 청약하는 행위인 경우 특허권의 효력은 그 방법의 사\n용이 특허권 또는 전용실시권을 침해한다는 것을 알면서 그 방법의 사용을 청약하는 행위에만 미친다.<신설 2019.\n12. 10.>\n[전문개정 2014. 6. 11.]"}, {"no": 95, "no_str": "제95조", "title": "허가등에 따른 존속기간이 연장된 경우의 특허권의 효력", "body": "제90조제4항에 따라 특허권의 존속기간이 연장된 특\n허권의 효력은 그 연장등록의 이유가 된 허가등의 대상물건(그 허가등에 있어 물건에 대하여 특정의 용도가 정하여\n져 있는 경우에는 그 용도에 사용되는 물건)에 관한 그 특허발명의 실시 행위에만 미친다.\n[전문개정 2014. 6. 11.]"}, {"no": 96, "no_str": "제96조", "title": "특허권의 효력이 미치지 아니하는 범위", "body": "① 특허권의 효력은 다음 각 호의 어느 하나에 해당하는 사항에는 미치\n지 아니한다.\n1. 연구 또는 시험(「약사법」에 따른 의약품의 품목허가ㆍ품목신고 및 「농약관리법」에 따른 농약의 등록을 위한 연\n구 또는 시험을 포함한다)을 하기 위한 특허발명의 실시\n2. 국내를 통과하는데 불과한 선박ㆍ항공기ㆍ차량 또는 이에 사용되는 기계ㆍ기구ㆍ장치, 그 밖의 물건\n3. 특허출원을 한 때부터 국내에 있는 물건\n② 둘 이상의 의약[사람의 질병의 진단ㆍ경감ㆍ치료ㆍ처치(處置) 또는 예방을 위하여 사용되는 물건을 말한다. 이하\n같다]이 혼합되어 제조되는 의약의 발명 또는 둘 이상의 의약을 혼합하여 의약을 제조하는 방법의 발명에 관한 특\n허권의 효력은 「약사법」에 따른 조제행위와 그 조제에 의한 의약에는 미치지 아니한다.\n[전문개정 2014. 6. 11.]"}, {"no": 97, "no_str": "제97조", "title": "특허발명의 보호범위", "body": "특허발명의 보호범위는 청구범위에 적혀 있는 사항에 의하여 정하여진다.\n[전문개정 2014. 6. 11.]"}, {"no": 98, "no_str": "제98조", "title": "타인의 특허발명 등과의 관계", "body": "특허권자ㆍ전용실시권자 또는 통상실시권자는 특허발명이 그 특허발명의 특허\n출원일 전에 출원된 타인의 특허발명ㆍ등록실용신안 또는 등록디자인이나 그 디자인과 유사한 디자인을 이용하거나\n특허권이 그 특허발명의 특허출원일 전에 출원된 타인의 디자인권 또는 상표권과 저촉되는 경우에는 그 특허권자ㆍ\n실용신안권자ㆍ디자인권자 또는 상표권자의 허락을 받지 아니하고는 자기의 특허발명을 업으로서 실시할 수 없다.\n[전문개정 2014. 6. 11.]"}, {"no": 99, "no_str": "제99조", "title": "특허권의 이전 및 공유 등", "body": "① 특허권은 이전할 수 있다.\n② 특허권이 공유인 경우에는 각 공유자는 다른 공유자 모두의 동의를 받아야만 그 지분을 양도하거나 그 지분을\n목적으로 하는 질권을 설정할 수 있다.\n③ 특허권이 공유인 경우에는 각 공유자는 계약으로 특별히 약정한 경우를 제외하고는 다른 공유자의 동의를 받지\n아니하고 그 특허발명을 자신이 실시할 수 있다.\n④ 특허권이 공유인 경우에는 각 공유자는 다른 공유자 모두의 동의를 받아야만 그 특허권에 대하여 전용실시권을\n설정하거나 통상실시권을 허락할 수 있다.\n[전문개정 2014. 6. 11.]"}, {"no": 99, "no_str": "제99조의2", "title": "특허권의 이전청구", "body": "① 특허가 제133조제1항제2호 본문에 해당하는 경우에 특허를 받을 수 있는 권리를 가\n진 자는 법원에 해당 특허권의 이전(특허를 받을 수 있는 권리가 공유인 경우에는 그 지분의 이전을 말한다)을 청구\n할 수 있다.\n② 제1항의 청구에 기초하여 특허권이 이전등록된 경우에는 다음 각 호의 권리는 그 특허권이 설정등록된 날부터\n이전등록을 받은 자에게 있는 것으로 본다.\n1. 해당 특허권\n2. 제65조제2항에 따른 보상금 지급 청구권\n3. 제207조제4항에 따른 보상금 지급 청구권\n③ 제1항의 청구에 따라 공유인 특허권의 지분을 이전하는 경우에는 제99조제2항에도 불구하고 다른 공유자의 동\n의를 받지 아니하더라도 그 지분을 이전할 수 있다.\n[본조신설 2016. 2. 29.]"}, {"no": 100, "no_str": "제100조", "title": "전용실시권", "body": "① 특허권자는 그 특허권에 대하여 타인에게 전용실시권을 설정할 수 있다.\n② 전용실시권을 설정받은 전용실시권자는 그 설정행위로 정한 범위에서 그 특허발명을 업으로서 실시할 권리를\n독점한다.\n③ 전용실시권자는 다음 각 호의 경우를 제외하고는 특허권자의 동의를 받아야만 전용실시권을 이전할 수 있다.\n1. 전용실시권을 실시사업(實施事業)과 함께 이전하는 경우\n2. 상속이나 그 밖의 일반승계의 경우\n④ 전용실시권자는 특허권자의 동의를 받아야만 그 전용실시권을 목적으로 하는 질권을 설정하거나 통상실시권을\n허락할 수 있다.\n⑤ 전용실시권에 관하여는 제99조제2항부터 제4항까지의 규정을 준용한다.\n[전문개정 2014. 6. 11.]"}, {"no": 101, "no_str": "제101조", "title": "특허권 및 전용실시권의 등록의 효력", "body": "① 다음 각 호의 어느 하나에 해당하는 사항은 등록하여야만 효력이 발\n생한다.\n1. 특허권의 이전(상속이나 그 밖의 일반승계에 의한 경우는 제외한다), 포기에 의한 소멸 또는 처분의 제한\n2. 전용실시권의 설정ㆍ이전(상속이나 그 밖의 일반승계에 의한 경우는 제외한다)ㆍ변경ㆍ소멸(혼동에 의한 경우는\n제외한다) 또는 처분의 제한\n3. 특허권 또는 전용실시권을 목적으로 하는 질권의 설정ㆍ이전(상속이나 그 밖의 일반승계에 의한 경우는 제외한\n다)ㆍ변경ㆍ소멸(혼동에 의한 경우는 제외한다) 또는 처분의 제한\n② 제1항 각 호에 따른 특허권ㆍ전용실시권 및 질권의 상속이나 그 밖의 일반승계의 경우에는 지체 없이 그 취지를\n지식재산처장에게 신고하여야 한다.<개정 2025. 10. 1.>\n[전문개정 2014. 6. 11.]"}, {"no": 102, "no_str": "제102조", "title": "통상실시권", "body": "① 특허권자는 그 특허권에 대하여 타인에게 통상실시권을 허락할 수 있다.\n② 통상실시권자는 이 법에 따라 또는 설정행위로 정한 범위에서 특허발명을 업으로서 실시할 수 있는 권리를 가진\n다.\n③ 제107조에 따른 통상실시권은 실시사업과 함께 이전하는 경우에만 이전할 수 있다.\n④ 제138조, 「실용신안법」 제32조 또는 「디자인보호법」 제123조에 따른 통상실시권은 그 통상실시권자의 해당 특\n허권ㆍ실용신안권 또는 디자인권과 함께 이전되고, 해당 특허권ㆍ실용신안권 또는 디자인권이 소멸되면 함께 소멸\n된다.\n⑤ 제3항 및 제4항에 따른 통상실시권 외의 통상실시권은 실시사업과 함께 이전하는 경우 또는 상속이나 그 밖의\n일반승계의 경우를 제외하고는 특허권자(전용실시권에 관한 통상실시권의 경우에는 특허권자 및 전용실시권자)의\n동의를 받아야만 이전할 수 있다.\n⑥ 제3항 및 제4항에 따른 통상실시권 외의 통상실시권은 특허권자(전용실시권에 관한 통상실시권의 경우에는 특\n허권자 및 전용실시권자)의 동의를 받아야만 그 통상실시권을 목적으로 하는 질권을 설정할 수 있다.\n⑦ 통상실시권에 관하여는 제99조제2항 및 제3항을 준용한다.\n[전문개정 2014. 6. 11.]"}, {"no": 103, "no_str": "제103조", "title": "선사용에 의한 통상실시권", "body": "특허출원 시에 그 특허출원된 발명의 내용을 알지 못하고 그 발명을 하거나 그 발\n명을 한 사람으로부터 알게 되어 국내에서 그 발명의 실시사업을 하거나 이를 준비하고 있는 자는 그 실시하거나 준\n비하고 있는 발명 및 사업목적의 범위에서 그 특허출원된 발명의 특허권에 대하여 통상실시권을 가진다.\n[전문개정 2014. 6. 11.]"}, {"no": 103, "no_str": "제103조의2", "title": "특허권의 이전청구에 따른 이전등록 전의 실시에 의한 통상실시권", "body": "① 다음 각 호의 어느 하나에 해당하는\n자가 제99조의2제2항에 따른 특허권의 이전등록이 있기 전에 해당 특허가 제133조제1항제2호 본문에 해당하는 것\n을 알지 못하고 국내에서 해당 발명의 실시사업을 하거나 이를 준비하고 있는 경우에는 그 실시하거나 준비를 하고\n있는 발명 및 사업목적의 범위에서 그 특허권에 대하여 통상실시권을 가진다.\n1. 이전등록된 특허의 원(原)특허권자\n2. 이전등록된 특허권에 대하여 이전등록 당시에 이미 전용실시권이나 통상실시권 또는 그 전용실시권에 대한 통상\n실시권을 취득하고 등록을 받은 자. 다만, 제118조제2항에 따른 통상실시권을 취득한 자는 등록을 필요로 하지\n아니한다.\n② 제1항에 따라 통상실시권을 가진 자는 이전등록된 특허권자에게 상당한 대가를 지급하여야 한다.\n[본조신설 2016. 2. 29.]"}, {"no": 104, "no_str": "제104조", "title": "무효심판청구 등록 전의 실시에 의한 통상실시권", "body": "① 다음 각 호의 어느 하나에 해당하는 자가 특허 또는 실용\n신안등록에 대한 무효심판청구의 등록 전에 자기의 특허발명 또는 등록실용신안이 무효사유에 해당하는 것을 알지\n못하고 국내에서 그 발명 또는 고안의 실시사업을 하거나 이를 준비하고 있는 경우에는 그 실시하거나 준비하고 있\n는 발명 또는 고안 및 사업목적의 범위에서 그 특허권에 대하여 통상실시권을 가지거나 특허나 실용신안등록이 무\n효로 된 당시에 존재하는 특허권의 전용실시권에 대하여 통상실시권을 가진다. <개정 2016. 2. 29.>\n1. 동일한 발명에 대한 둘 이상의 특허 중 그 하나의 특허를 무효로 한 경우 그 무효로 된 특허의 원특허권자\n2. 특허발명과 등록실용신안이 동일하여 그 실용신안등록을 무효로 한 경우 그 무효로 된 실용신안등록의 원(原)실\n용신안권자\n3. 특허를 무효로 하고 동일한 발명에 관하여 정당한 권리자에게 특허를 한 경우 그 무효로 된 특허의 원특허권자\n4. 실용신안등록을 무효로 하고 그 고안과 동일한 발명에 관하여 정당한 권리자에게 특허를 한 경우 그 무효로 된\n실용신안의 원실용신안권자\n5. 제1호부터 제4호까지의 경우에 있어서 그 무효로 된 특허권 또는 실용신안권에 대하여 무효심판청구 등록 당시\n에 이미 전용실시권이나 통상실시권 또는 그 전용실시권에 대한 통상실시권을 취득하고 등록을 받은 자. 다만, 제\n118조제2항에 따른 통상실시권을 취득한 자는 등록을 필요로 하지 아니한다.\n② 제1항에 따라 통상실시권을 가진 자는 특허권자 또는 전용실시권자에게 상당한 대가를 지급하여야 한다.\n[전문개정 2014. 6. 11.]"}, {"no": 105, "no_str": "제105조", "title": "디자인권의 존속기간 만료 후의 통상실시권", "body": "① 특허출원일 전 또는 특허출원일과 같은 날에 출원되어 등록된\n디자인권이 그 특허권과 저촉되는 경우 그 디자인권의 존속기간이 만료될 때에는 그 디자인권자는 그 디자인권의\n범위에서 그 특허권에 대하여 통상실시권을 가지거나 그 디자인권의 존속기간 만료 당시 존재하는 그 특허권의 전\n용실시권에 대하여 통상실시권을 가진다.\n② 특허출원일 전 또는 특허출원일과 같은 날에 출원되어 등록된 디자인권이 그 특허권과 저촉되는 경우 그 디자인\n권의 존속기간이 만료될 때에는 다음 각 호의 어느 하나에 해당하는 권리를 가진 자는 원(原)권리의 범위에서 그 특\n허권에 대하여 통상실시권을 가지거나 그 디자인권의 존속기간 만료 당시 존재하는 그 특허권의 전용실시권에 대\n하여 통상실시권을 가진다.\n1. 그 디자인권의 존속기간 만료 당시 존재하는 그 디자인권에 대한 전용실시권\n2. 그 디자인권이나 그 디자인권에 대한 전용실시권에 대하여 「디자인보호법」 제104조제1항에 따라 효력이 발생한\n통상실시권\n③ 제2항에 따라 통상실시권을 가진 자는 특허권자 또는 전용실시권자에게 상당한 대가를 지급하여야 한다.\n[전문개정 2014. 6. 11.]"}, {"no": 106, "no_str": "제106조", "title": "특허권의 수용", "body": "① 정부는 특허발명이 전시, 사변 또는 이에 준하는 비상시에 국방상 필요한 경우에는 특허권\n을 수용할 수 있다.\n② 특허권이 수용되는 경우에는 그 특허발명에 관한 특허권 외의 권리는 소멸된다.\n③ 정부는 제1항에 따라 특허권을 수용하는 경우에는 특허권자, 전용실시권자 또는 통상실시권자에 대하여 정당한\n보상금을 지급하여야 한다.\n④ 특허권의 수용 및 보상금의 지급에 필요한 사항은 대통령령으로 정한다.\n[전문개정 2014. 6. 11.]"}, {"no": 106, "no_str": "제106조의2", "title": "정부 등에 의한 특허발명의 실시", "body": "① 정부는 특허발명이 국가 비상사태, 극도의 긴급상황 또는 공공의 이익\n을 위하여 비상업적(非商業的)으로 실시할 필요가 있다고 인정하는 경우에는 그 특허발명을 실시하거나 정부 외의\n자에게 실시하게 할 수 있다.\n② 정부 또는 제1항에 따른 정부 외의 자는 타인의 특허권이 존재한다는 사실을 알았거나 알 수 있을 때에는 제1항\n에 따른 실시 사실을 특허권자, 전용실시권자 또는 통상실시권자에게 신속하게 알려야 한다.\n③ 정부 또는 제1항에 따른 정부 외의 자는 제1항에 따라 특허발명을 실시하는 경우에는 특허권자, 전용실시권자\n또는 통상실시권자에게 정당한 보상금을 지급하여야 한다.\n④ 특허발명의 실시 및 보상금의 지급에 필요한 사항은 대통령령으로 정한다.\n[전문개정 2014. 6. 11.]"}, {"no": 107, "no_str": "제107조", "title": "통상실시권 설정의 재정", "body": "① 특허발명을 실시하려는 자는 특허발명이 다음 각 호의 어느 하나에 해당하고, 그\n특허발명의 특허권자 또는 전용실시권자와 합리적인 조건으로 통상실시권 허락에 관한 협의(이하 이 조에서 “협의\n”라 한다)를 하였으나 합의가 이루어지지 아니하는 경우 또는 협의를 할 수 없는 경우에는 지식재산처장에게 통상실\n시권 설정에 관한 재정(裁定)(이하 “재정”이라 한다)을 청구할 수 있다. 다만, 공공의 이익을 위하여 비상업적으로 실\n시하려는 경우와 제4호에 해당하는 경우에는 협의 없이도 재정을 청구할 수 있다. <개정 2025. 10. 1.>\n1. 특허발명이 천재지변이나 그 밖의 불가항력 또는 대통령령으로 정하는 정당한 이유 없이 계속하여 3년 이상 국\n내에서 실시되고 있지 아니한 경우\n2. 특허발명이 정당한 이유 없이 계속하여 3년 이상 국내에서 상당한 영업적 규모로 실시되고 있지 아니하거나 적\n당한 정도와 조건으로 국내수요를 충족시키지 못한 경우\n3. 특허발명의 실시가 공공의 이익을 위하여 특히 필요한 경우\n4. 사법적 절차 또는 행정적 절차에 의하여 불공정거래행위로 판정된 사항을 바로잡기 위하여 특허발명을 실시할\n필요가 있는 경우\n5. 자국민 다수의 보건을 위협하는 질병을 치료하기 위하여 의약품(의약품 생산에 필요한 유효성분, 의약품 사용에\n필요한 진단키트를 포함한다)을 수입하려는 국가(이하 이 조에서 “수입국”이라 한다)에 그 의약품을 수출할 수 있\n도록 특허발명을 실시할 필요가 있는 경우\n② 특허출원일부터 4년이 지나지 아니한 특허발명에 관하여는 제1항제1호 및 제2호를 적용하지 아니한다.\n③ 지식재산처장은 재정을 하는 경우 청구별로 통상실시권 설정의 필요성을 검토하여야 한다.<개정 2025. 10. 1.>\n④ 지식재산처장은 제1항제1호부터 제3호까지 또는 제5호에 따른 재정을 하는 경우 재정을 받는 자에게 다음 각 호\n의 조건을 붙여야 한다.<개정 2025. 10. 1.>\n1. 제1항제1호부터 제3호까지의 규정에 따른 재정의 경우에는 통상실시권을 국내수요충족을 위한 공급을 주목적으\n로 실시할 것\n2. 제1항제5호에 따른 재정의 경우에는 생산된 의약품 전량을 수입국에 수출할 것\n⑤ 지식재산처장은 재정을 하는 경우 상당한 대가가 지급될 수 있도록 하여야 한다. 이 경우 제1항제4호 또는 제5호\n에 따른 재정을 하는 경우에는 다음 각 호의 사항을 대가 결정에 고려할 수 있다.<개정 2025. 10. 1.>\n1. 제1항제4호에 따른 재정의 경우에는 불공정거래행위를 바로잡기 위한 취지\n2. 제1항제5호에 따른 재정의 경우에는 그 특허발명을 실시함으로써 발생하는 수입국에서의 경제적 가치\n⑥ 반도체 기술에 대해서는 제1항제3호(공공의 이익을 위하여 비상업적으로 실시하는 경우만 해당한다) 또는 제4호\n의 경우에만 재정을 청구할 수 있다.\n⑦ 수입국은 세계무역기구회원국 중 세계무역기구에 다음 각 호의 사항을 통지한 국가 또는 세계무역기구회원국이\n아닌 국가 중 대통령령으로 정하는 국가로서 다음 각 호의 사항을 대한민국정부에 통지한 국가의 경우만 해당한다.\n1. 수입국이 필요로 하는 의약품의 명칭과 수량\n2. 국제연합총회의 결의에 따른 최빈개발도상국이 아닌 경우 해당 의약품의 생산을 위한 제조능력이 없거나 부족하\n다는 수입국의 확인\n3. 수입국에서 해당 의약품이 특허된 경우 강제적인 실시를 허락하였거나 허락할 의사가 있다는 그 국가의 확인\n⑧ 제1항제5호에 따른 의약품은 다음 각 호의 어느 하나에 해당하는 것으로 한다.\n1. 특허된 의약품\n2. 특허된 제조방법으로 생산된 의약품\n3. 의약품 생산에 필요한 특허된 유효성분\n4. 의약품 사용에 필요한 특허된 진단키트\n⑨ 재정을 청구하는 자가 제출하여야 하는 서류, 그 밖에 재정에 관하여 필요한 사항은 대통령령으로 정한다.\n[전문개정 2014. 6. 11.]"}, {"no": 108, "no_str": "제108조", "title": "답변서의 제출", "body": "지식재산처장은 재정의 청구가 있으면 그 청구서의 부본(副本)을 그 청구에 관련된 특허권자ㆍ\n전용실시권자, 그 밖에 그 특허에 관하여 등록을 한 권리를 가지는 자에게 송달하고, 기간을 정하여 답변서를 제출할\n수 있는 기회를 주어야 한다. <개정 2025. 10. 1.>\n[전문개정 2014. 6. 11.]"}, {"no": 109, "no_str": "제109조", "title": "산업재산권분쟁조정위원회 및 관계 부처의 장의 의견청취", "body": "지식재산처장은 재정을 할 때 필요하다고 인정하\n는 경우에는 「발명진흥법」 제41조에 따른 산업재산권분쟁조정위원회(이하 “조정위원회”라 한다) 및 관계 부처의 장\n의 의견을 들을 수 있고, 관계 행정기관이나 관계인에게 협조를 요청할 수 있다. <개정 2021. 8. 17., 2025. 10. 1.>\n[전문개정 2014. 6. 11.]"}, {"no": 110, "no_str": "제110조", "title": "재정의 방식 등", "body": "① 재정은 서면으로 하고, 그 이유를 구체적으로 적어야 한다.\n② 제1항에 따른 재정에는 다음 각 호의 사항을 구체적으로 적어야 한다.\n1. 통상실시권의 범위 및 기간\n2. 대가와 그 지급방법 및 지급시기\n3. 제107조제1항제5호에 따른 재정의 경우에는 그 특허발명의 특허권자ㆍ전용실시권자 또는 통상실시권자(재정에\n따른 경우는 제외한다)가 공급하는 의약품과 외관상 구분할 수 있는 포장ㆍ표시 및 재정에서 정한 사항을 공시할\n인터넷 주소\n4. 그 밖에 재정을 받은 자가 그 특허발명을 실시할 경우 법령 또는 조약에 따른 내용을 이행하기 위하여 필요한 준\n수사항\n③ 지식재산처장은 정당한 사유가 있는 경우를 제외하고는 재정청구일부터 6개월 이내에 재정에 관한 결정을 하여\n야 한다.<개정 2025. 10. 1.>\n④ 제107조제1항제5호에 따른 재정청구가 같은 조 제7항 및 제8항에 해당하고 같은 조 제9항에 따른 서류가 모두\n제출된 경우에는 지식재산처장은 정당한 사유가 있는 경우를 제외하고는 통상실시권 설정의 재정을 하여야 한다.\n<개정 2025. 10. 1.>\n[전문개정 2014. 6. 11.]"}, {"no": 111, "no_str": "제111조", "title": "재정서등본의 송달", "body": "① 지식재산처장은 재정을 한 경우에는 당사자 및 그 특허에 관하여 등록을 한 권리를 가\n지는 자에게 재정서등본을 송달하여야 한다. <개정 2025. 10. 1.>\n② 제1항에 따라 당사자에게 재정서등본이 송달되었을 때에는 재정서에 적혀 있는 바에 따라 당사자 사이에 협의가\n이루어진 것으로 본다.\n[전문개정 2014. 6. 11.]"}, {"no": 111, "no_str": "제111조의2", "title": "재정서의 변경", "body": "① 재정을 받은 자는 재정서에 적혀 있는 제110조제2항제3호의 사항에 관하여 변경이 필\n요하면 그 원인을 증명하는 서류를 첨부하여 지식재산처장에게 변경청구를 할 수 있다. <개정 2025. 10. 1.>\n② 지식재산처장은 제1항에 따른 청구가 이유있다고 인정되면 재정서에 적혀 있는 사항을 변경할 수 있다. 이 경우\n이해관계인의 의견을 들어야 한다.<개정 2025. 10. 1.>\n③ 제2항의 경우에 관하여는 제111조를 준용한다.\n[전문개정 2014. 6. 11.]"}, {"no": 112, "no_str": "제112조", "title": "대가의 공탁", "body": "제110조제2항제2호에 따른 대가를 지급하여야 하는 자는 다음 각 호의 어느 하나에 해당하는 경\n우에는 그 대가를 공탁(供託)하여야 한다.\n1. 대가를 받을 자가 수령을 거부하거나 수령할 수 없는 경우\n2. 대가에 대하여 제190조제1항에 따른 소송이 제기된 경우\n3. 해당 특허권 또는 전용실시권을 목적으로 하는 질권이 설정되어 있는 경우. 다만, 질권자의 동의를 받은 경우에는\n그러하지 아니하다.\n[전문개정 2014. 6. 11.]"}, {"no": 113, "no_str": "제113조", "title": "재정의 실효", "body": "재정을 받은 자가 제110조제2항제2호에 따른 지급시기까지 대가(대가를 정기 또는 분할하여 지\n급할 경우에는 최초의 지급분)를 지급하지 아니하거나 공탁을 하지 아니한 경우에는 그 재정은 효력을 잃는다.\n[전문개정 2014. 6. 11.]"}, {"no": 114, "no_str": "제114조", "title": "재정의 취소", "body": "① 지식재산처장은 재정을 받은 자가 다음 각 호의 어느 하나에 해당하는 경우에는 이해관계인\n의 신청에 따라 또는 직권으로 그 재정을 취소할 수 있다. 다만, 제2호의 경우에는 재정을 받은 통상실시권자의 정당\n한 이익이 보호될 수 있는 경우로 한정한다. <개정 2025. 10. 1.>\n1. 재정을 받은 목적에 적합하도록 그 특허발명을 실시하지 아니한 경우\n2. 통상실시권을 재정한 사유가 없어지고 그 사유가 다시 발생하지 아니할 것이라고 인정되는 경우\n3. 정당한 사유 없이 재정서에 적혀 있는 제110조제2항제3호 또는 제4호의 사항을 위반하였을 경우\n② 제1항의 경우에 관하여는 제108조ㆍ제109조ㆍ제110조제1항 및 제111조제1항을 준용한다.\n③ 제1항에 따라 재정이 취소되면 통상실시권은 그때부터 소멸된다.\n[전문개정 2014. 6. 11.]"}, {"no": 115, "no_str": "제115조", "title": "재정에 대한 불복이유의 제한", "body": "재정에 대하여 「행정심판법」에 따라 행정심판을 제기하거나 「행정소송법」에\n따라 취소소송을 제기하는 경우에는 그 재정으로 정한 대가는 불복이유로 할 수 없다.\n[전문개정 2014. 6. 11.]"}, {"no": 116, "no_str": "제116조", "title": "", "body": "삭제 <2011. 12. 2.>"}, {"no": 117, "no_str": "제117조", "title": "", "body": "삭제 <2001. 2. 3.>"}, {"no": 118, "no_str": "제118조", "title": "통상실시권의 등록의 효력", "body": "① 통상실시권을 등록한 경우에는 그 등록 후에 특허권 또는 전용실시권을 취득한\n자에 대해서도 그 효력이 발생한다.\n② 제81조의3제5항, 제103조부터 제105조까지, 제122조, 제182조, 제183조 및 「발명진흥법」 제10조제1항에 따른\n통상실시권은 등록이 없더라도 제1항에 따른 효력이 발생한다.\n③ 통상실시권의 이전ㆍ변경ㆍ소멸 또는 처분의 제한, 통상실시권을 목적으로 하는 질권의 설정ㆍ이전ㆍ변경ㆍ소\n멸 또는 처분의 제한은 이를 등록하여야만 제3자에게 대항할 수 있다.\n[전문개정 2014. 6. 11.]"}, {"no": 119, "no_str": "제119조", "title": "특허권 등의 포기의 제한", "body": "① 특허권자는 다음 각 호의 모두의 동의를 받아야만 특허권을 포기할 수 있다.\n1. 전용실시권자\n2. 질권자\n3. 제100조제4항에 따른 통상실시권자\n4. 제102조제1항에 따른 통상실시권자\n5. 「발명진흥법」 제10조제1항에 따른 통상실시권자\n② 전용실시권자는 질권자 또는 제100조제4항에 따른 통상실시권자의 동의를 받아야만 전용실시권을 포기할 수 있\n다.\n③ 통상실시권자는 질권자의 동의를 받아야만 통상실시권을 포기할 수 있다.\n[전문개정 2014. 6. 11.]"}, {"no": 120, "no_str": "제120조", "title": "포기의 효과", "body": "특허권ㆍ전용실시권 또는 통상실시권을 포기한 때에는 특허권ㆍ전용실시권 또는 통상실시권은\n그때부터 소멸된다.\n[전문개정 2014. 6. 11.]"}, {"no": 121, "no_str": "제121조", "title": "질권", "body": "특허권ㆍ전용실시권 또는 통상실시권을 목적으로 하는 질권을 설정하였을 때에는 질권자는 계약으로\n특별히 정한 경우를 제외하고는 해당 특허발명을 실시할 수 없다.\n[전문개정 2014. 6. 11.]"}, {"no": 122, "no_str": "제122조", "title": "질권행사 등으로 인한 특허권의 이전에 따른 통상실시권", "body": "특허권자(공유인 특허권을 분할청구한 경우에는 분\n할청구를 한 공유자를 제외한 나머지 공유자를 말한다)는 특허권을 목적으로 하는 질권설정 또는 공유인 특허권의\n분할청구 이전에 그 특허발명을 실시하고 있는 경우에는 그 특허권이 경매 등에 의하여 이전되더라도 그 특허발명\n에 대하여 통상실시권을 가진다. 이 경우 특허권자는 경매 등에 의하여 특허권을 이전받은 자에게 상당한 대가를 지\n급하여야 한다. <개정 2021. 10. 19.>\n[전문개정 2014. 6. 11.]\n[제목개정 2021. 10. 19.]"}, {"no": 123, "no_str": "제123조", "title": "질권의 물상대위", "body": "질권은 이 법에 따른 보상금이나 특허발명의 실시에 대하여 받을 대가나 물건에 대해서도\n행사할 수 있다. 다만, 그 보상금 등의 지급 또는 인도 전에 압류하여야 한다.\n[전문개정 2014. 6. 11.]"}, {"no": 124, "no_str": "제124조", "title": "상속인이 없는 경우 등의 특허권 소멸", "body": "①특허권의 상속이 개시된 때 상속인이 없는 경우에는 그 특허권은 소\n멸된다. <개정 2016. 2. 29.>\n② 청산절차가 진행 중인 법인의 특허권은 법인의 청산종결등기일(청산종결등기가 되었더라도 청산사무가 사실상\n끝나지 아니한 경우에는 청산사무가 사실상 끝난 날과 청산종결등기일부터 6개월이 지난 날 중 빠른 날로 한다. 이\n하 이 항에서 같다)까지 그 특허권의 이전등록을 하지 아니한 경우에는 청산종결등기일의 다음 날에 소멸한다.<신\n설 2016. 2. 29.>\n[전문개정 2014. 6. 11.]\n[제목개정 2016. 2. 29.]"}, {"no": 125, "no_str": "제125조", "title": "특허실시보고", "body": "지식재산처장은 특허권자ㆍ전용실시권자 또는 통상실시권자에게 특허발명의 실시 여부 및 그\n규모 등에 관하여 보고하게 할 수 있다. <개정 2025. 10. 1.>\n[전문개정 2014. 6. 11.]"}, {"no": 125, "no_str": "제125조의2", "title": "대가 및 보상금액에 대한 집행권원", "body": "이 법에 따라 지식재산처장이 정한 대가와 보상금액에 관하여 확정된\n결정은 집행력 있는 집행권원(執行權原)과 같은 효력을 가진다. 이 경우 집행력 있는 정본은 지식재산처 소속 공무원\n이 부여한다. <개정 2025. 10. 1.>\n[전문개정 2014. 6. 11.]"}, {"no": 126, "no_str": "제126조", "title": "권리침해에 대한 금지청구권 등", "body": "① 특허권자 또는 전용실시권자는 자기의 권리를 침해한 자 또는 침해할 우\n려가 있는 자에 대하여 그 침해의 금지 또는 예방을 청구할 수 있다.\n② 특허권자 또는 전용실시권자가 제1항에 따른 청구를 할 때에는 침해행위를 조성한 물건(물건을 생산하는 방법의\n발명인 경우에는 침해행위로 생긴 물건을 포함한다)의 폐기, 침해행위에 제공된 설비의 제거, 그 밖에 침해의 예방\n에 필요한 행위를 청구할 수 있다.\n[전문개정 2014. 6. 11.]"}, {"no": 126, "no_str": "제126조의2", "title": "구체적 행위의 내용ㆍ방식ㆍ형태 제시 의무", "body": "① 특허권 또는 전용실시권 침해소송에서 특허권자 또는 전용\n실시권자가 주장하는 침해행위의 구체적 내용ㆍ방식ㆍ형태를 부인하는 당사자는 자기의 구체적 행위의 내용ㆍ방식\nㆍ형태를 제시하여야 한다. <개정 2025. 5. 27.>\n② 법원은 당사자가 제1항에도 불구하고 자기의 구체적 행위의 내용ㆍ방식ㆍ형태를 제시할 수 없는 정당한 이유가\n있다고 주장하는 경우에는 그 주장의 당부를 판단하기 위하여 그 당사자에게 자료의 제출을 명할 수 있다. 다만, 그\n자료의 소지자가 그 자료의 제출을 거절할 정당한 이유가 있으면 그러하지 아니하다.<개정 2025. 5. 27.>\n③ 제2항에 따른 자료제출명령에 관하여는 제132조제2항 및 제3항을 준용한다. 이 경우 제132조제3항 중 “침해의\n증명 또는 손해액의 산정에 반드시 필요한 때”를 “구체적 행위의 내용ㆍ방식ㆍ형태를 제시할 수 없는 정당한 이유\n의 유무 판단에 반드시 필요한 때”로 한다.<개정 2025. 5. 27.>\n④ 당사자가 정당한 이유 없이 자기의 구체적 행위의 내용ㆍ방식ㆍ형태를 제시하지 않는 경우에는 법원은 특허권\n자 또는 전용실시권자가 주장하는 침해행위의 구체적 내용ㆍ방식ㆍ형태를 진실한 것으로 인정할 수 있다.<개정\n2025. 5. 27.>\n[본조신설 2019. 1. 8.]\n[제목개정 2025. 5. 27.]"}, {"no": 127, "no_str": "제127조", "title": "침해로 보는 행위", "body": "다음 각 호의 구분에 따른 행위를 업으로서 하는 경우에는 특허권 또는 전용실시권을 침해\n한 것으로 본다. <개정 2025. 1. 21.>\n1. 특허가 물건의 발명인 경우: 그 물건의 생산에만 사용하는 물건을 생산ㆍ양도ㆍ대여ㆍ수출 또는 수입하거나 그\n물건의 양도 또는 대여의 청약을 하는 행위\n2. 특허가 방법의 발명인 경우: 그 방법의 실시에만 사용하는 물건을 생산ㆍ양도ㆍ대여ㆍ수출 또는 수입하거나 그\n물건의 양도 또는 대여의 청약을 하는 행위\n[전문개정 2014. 6. 11.]"}, {"no": 128, "no_str": "제128조", "title": "손해배상청구권 등", "body": "① 특허권자 또는 전용실시권자는 고의 또는 과실로 자기의 특허권 또는 전용실시권을 침\n해한 자에 대하여 침해로 인하여 입은 손해의 배상을 청구할 수 있다. <신설 2016. 3. 29.>\n② 제1항에 따라 손해배상을 청구하는 경우 그 권리를 침해한 자가 그 침해행위를 하게 한 물건을 양도하였을 때에\n는 다음 각 호에 해당하는 금액의 합계액을 특허권자 또는 전용실시권자가 입은 손해액으로 할 수 있다.<개정\n2020. 6. 9.>\n1. 그 물건의 양도수량(특허권자 또는 전용실시권자가 그 침해행위 외의 사유로 판매할 수 없었던 사정이 있는 경우\n에는 그 침해행위 외의 사유로 판매할 수 없었던 수량을 뺀 수량) 중 특허권자 또는 전용실시권자가 생산할 수 있\n었던 물건의 수량에서 실제 판매한 물건의 수량을 뺀 수량을 넘지 않는 수량에 특허권자 또는 전용실시권자가 그\n침해행위가 없었다면 판매할 수 있었던 물건의 단위수량당 이익액을 곱한 금액\n2. 그 물건의 양도수량 중 특허권자 또는 전용실시권자가 생산할 수 있었던 물건의 수량에서 실제 판매한 물건의 수\n량을 뺀 수량을 넘는 수량 또는 그 침해행위 외의 사유로 판매할 수 없었던 수량이 있는 경우 이들 수량(특허권자\n또는 전용실시권자가 그 특허권자의 특허권에 대한 전용실시권의 설정, 통상실시권의 허락 또는 그 전용실시권자\n의 전용실시권에 대한 통상실시권의 허락을 할 수 있었다고 인정되지 않는 경우에는 해당 수량을 뺀 수량)에 대\n해서는 특허발명의 실시에 대하여 합리적으로 받을 수 있는 금액\n③ 삭제<2020. 6. 9.>\n④ 제1항에 따라 손해배상을 청구하는 경우 특허권 또는 전용실시권을 침해한 자가 그 침해행위로 인하여 얻은 이\n익액을 특허권자 또는 전용실시권자가 입은 손해액으로 추정한다.<개정 2016. 3. 29.>\n⑤ 제1항에 따라 손해배상을 청구하는 경우 그 특허발명의 실시에 대하여 합리적으로 받을 수 있는 금액을 특허권\n자 또는 전용실시권자가 입은 손해액으로 하여 손해배상을 청구할 수 있다.<개정 2016. 3. 29., 2019. 1. 8.>\n⑥ 제5항에도 불구하고 손해액이 같은 항에 따른 금액을 초과하는 경우에는 그 초과액에 대해서도 손해배상을 청구\n할 수 있다. 이 경우 특허권 또는 전용실시권을 침해한 자에게 고의 또는 중대한 과실이 없을 때에는 법원은 손해배\n상액을 산정할 때 그 사실을 고려할 수 있다.<개정 2016. 3. 29.>\n⑦ 법원은 특허권 또는 전용실시권의 침해에 관한 소송에서 손해가 발생된 것은 인정되나 그 손해액을 증명하기 위\n하여 필요한 사실을 증명하는 것이 해당 사실의 성질상 극히 곤란한 경우에는 제2항부터 제6항까지의 규정에도 불\n구하고 변론 전체의 취지와 증거조사의 결과에 기초하여 상당한 손해액을 인정할 수 있다.<개정 2016. 3. 29.>\n⑧ 법원은 타인의 특허권 또는 전용실시권을 침해한 행위가 고의적인 것으로 인정되는 경우에는 제1항에도 불구하\n고 제2항부터 제7항까지의 규정에 따라 손해로 인정된 금액의 5배를 넘지 아니하는 범위에서 배상액을 정할 수 있\n다.<신설 2019. 1. 8., 2024. 2. 20.>\n⑨ 제8항에 따른 배상액을 판단할 때에는 다음 각 호의 사항을 고려하여야 한다.<신설 2019. 1. 8.>\n1. 침해행위를 한 자의 우월적 지위 여부\n2. 고의 또는 손해 발생의 우려를 인식한 정도\n3. 침해행위로 인하여 특허권자 및 전용실시권자가 입은 피해규모\n4. 침해행위로 인하여 침해한 자가 얻은 경제적 이익\n5. 침해행위의 기간ㆍ횟수 등\n6. 침해행위에 따른 벌금\n7. 침해행위를 한 자의 재산상태\n8. 침해행위를 한 자의 피해구제 노력의 정도\n[전문개정 2014. 6. 11.]\n[제목개정 2016. 3. 29.]"}, {"no": 128, "no_str": "제128조의2", "title": "감정사항 설명의무", "body": "특허권 또는 전용실시권 침해소송에서 법원이 침해로 인한 손해액의 산정을 위하여 감\n정을 명한 때에는 당사자는 감정인에게 감정에 필요한 사항을 설명하여야 한다.\n[본조신설 2016. 3. 29.]"}, {"no": 129, "no_str": "제129조", "title": "생산방법의 추정", "body": "물건을 생산하는 방법의 발명에 관하여 특허가 된 경우에 그 물건과 동일한 물건은 그 특허\n된 방법에 의하여 생산된 것으로 추정한다. 다만, 그 물건이 다음 각 호의 어느 하나에 해당하는 경우에는 그러하지\n아니하다.\n1. 특허출원 전에 국내에서 공지되었거나 공연히 실시된 물건\n2. 특허출원 전에 국내 또는 국외에서 반포된 간행물에 게재되었거나 전기통신회선을 통하여 공중이 이용할 수 있\n는 물건\n[전문개정 2014. 6. 11.]"}, {"no": 130, "no_str": "제130조", "title": "과실의 추정", "body": "타인의 특허권 또는 전용실시권을 침해한 자는 그 침해행위에 대하여 과실이 있는 것으로 추정\n한다.\n[전문개정 2014. 6. 11.]"}, {"no": 131, "no_str": "제131조", "title": "특허권자 등의 신용회복", "body": "법원은 고의나 과실로 특허권 또는 전용실시권을 침해함으로써 특허권자 또는 전용\n실시권자의 업무상 신용을 떨어뜨린 자에 대해서는 특허권자 또는 전용실시권자의 청구에 의하여 손해배상을 갈음\n하여 또는 손해배상과 함께 특허권자 또는 전용실시권자의 업무상 신용회복을 위하여 필요한 조치를 명할 수 있다.\n[전문개정 2014. 6. 11.]"}, {"no": 132, "no_str": "제132조", "title": "자료의 제출", "body": "①법원은 특허권 또는 전용실시권 침해소송에서 당사자의 신청에 의하여 상대방 당사자에게 해\n당 침해의 증명 또는 침해로 인한 손해액의 산정에 필요한 자료의 제출을 명할 수 있다. 다만, 그 자료의 소지자가 그\n자료의 제출을 거절할 정당한 이유가 있으면 그러하지 아니하다. <개정 2016. 3. 29.>\n② 법원은 자료의 소지자가 제1항에 따른 제출을 거부할 정당한 이유가 있다고 주장하는 경우에는 그 주장의 당부\n를 판단하기 위하여 자료의 제시를 명할 수 있다. 이 경우 법원은 그 자료를 다른 사람이 보게 하여서는 아니 된다.\n<신설 2016. 3. 29.>\n③ 제1항에 따라 제출되어야 할 자료가 영업비밀(「부정경쟁방지 및 영업비밀보호에 관한 법률」 제2조제2호에 따른\n영업비밀을 말한다. 이하 같다)에 해당하나 침해의 증명 또는 손해액의 산정에 반드시 필요한 때에는 제1항 단서에\n따른 정당한 이유로 보지 아니한다. 이 경우 법원은 제출명령의 목적 내에서 열람할 수 있는 범위 또는 열람할 수\n있는 사람을 지정하여야 한다.<신설 2016. 3. 29.>\n④ 당사자가 정당한 이유 없이 자료제출명령에 따르지 아니한 때에는 법원은 자료의 기재에 대한 상대방의 주장을\n진실한 것으로 인정할 수 있다.<신설 2016. 3. 29.>\n⑤ 제4항에 해당하는 경우 자료의 제출을 신청한 당사자가 자료의 기재에 관하여 구체적으로 주장하기에 현저히 곤\n란한 사정이 있고 자료로 증명할 사실을 다른 증거로 증명하는 것을 기대하기도 어려운 때에는 법원은 그 당사자가\n자료의 기재에 의하여 증명하고자 하는 사실에 관한 주장을 진실한 것으로 인정할 수 있다.<신설 2016. 3. 29.>\n[전문개정 2014. 6. 11.]\n[제목개정 2016. 3. 29.]"}, {"no": 132, "no_str": "제132조의2", "title": "특허취소신청", "body": "① 누구든지 특허권의 설정등록일부터 등록공고일 후 6개월이 되는 날까지 그 특허가 다음\n각 호의 어느 하나에 해당하는 경우에는 특허심판원장에게 특허취소신청을 할 수 있다. 이 경우 청구범위의 청구항\n이 둘 이상인 경우에는 청구항마다 특허취소신청을 할 수 있다.\n1. 제29조(같은 조 제1항제1호에 해당하는 경우와 같은 호에 해당하는 발명에 의하여 쉽게 발명할 수 있는 경우는\n제외한다)에 위반된 경우\n2. 제36조제1항부터 제3항까지의 규정에 위반된 경우\n② 제1항에도 불구하고 특허공보에 게재된 제87조제3항제7호에 따른 선행기술에 기초한 이유로는 특허취소신청을\n할 수 없다.\n[본조신설 2016. 2. 29.]\n[종전 제132조의2는 제132조의16으로 이동 <2016. 2. 29.>]"}, {"no": 132, "no_str": "제132조의3", "title": "특허취소신청절차에서의 특허의 정정", "body": "① 특허취소신청절차가 진행 중인 특허에 대한 특허권자는 제136조\n제1항 각 호의 어느 하나에 해당하는 경우에만 제132조의13제2항에 따라 지정된 기간에 특허발명의 명세서 또는 도\n면에 대하여 정정청구를 할 수 있다.\n② 제1항에 따른 정정청구를 하였을 때에는 해당 특허취소신청절차에서 그 정정청구 전에 한 정정청구는 취하된 것\n으로 본다.\n③ 제1항에 따른 정정청구에 관하여는 제136조제3항부터 제6항까지, 제8항, 제10항부터 제13항까지, 제139조제3항\n및 제140조제1항ㆍ제2항ㆍ제5항을 준용한다. 이 경우 제136조제11항 중 “제162조제3항에 따른 심리의 종결이 통\n지되기 전(같은 조 제4항에 따라 심리가 재개된 경우에는 그 후 다시 같은 조 제3항에 따른 심리의 종결이 통지되기\n전)에”는 “제132조의13제2항 또는 제136조제6항에 따라 지정된 기간에”로 본다.\n④ 제1항에 따른 정정청구는 다음 각 호의 어느 하나에 해당하는 기간에만 취하할 수 있다.\n1. 제1항에 따라 정정을 청구할 수 있도록 지정된 기간과 그 기간의 만료일부터 1개월 이내의 기간\n2. 제3항에서 준용하는 제136조제6항에 따라 지정된 기간\n⑤ 제3항을 적용할 때 제132조의2에 따라 특허취소신청이 된 청구항을 정정하는 경우에는 제136조제5항을 준용하\n지 아니한다.\n[본조신설 2016. 2. 29.]\n[종전 제132조의3은 제132조의17로 이동 <2016. 2. 29.>]"}, {"no": 132, "no_str": "제132조의4", "title": "특허취소신청의 방식 등", "body": "① 특허취소신청을 하려는 자는 다음 각 호의 사항을 적은 특허취소신청서를 특\n허심판원장에게 제출하여야 한다.\n1. 신청인의 성명 및 주소(법인인 경우에는 그 명칭 및 영업소의 소재지)\n2. 대리인이 있는 경우에는 그 대리인의 성명 및 주소나 영업소의 소재지[대리인이 특허법인ㆍ특허법인(유한)인 경\n우에는 그 명칭, 사무소의 소재지 및 지정된 변리사의 성명]\n3. 특허취소신청의 대상이 되는 특허의 표시\n4. 특허취소신청의 이유 및 증거의 표시\n② 제1항에 따라 제출된 특허취소신청서의 보정은 그 요지를 변경할 수 없다. 다만, 제132조의2제1항에 따른 기간\n(그 기간 중 제132조의13제2항에 따른 통지가 있는 경우에는 통지한 때까지로 한정한다)에 제1항제4호의 사항을\n보정하는 경우에는 그러하지 아니하다.\n③ 심판장은 특허취소신청이 있으면 그 신청서의 부본을 특허권자에게 송달하여야 한다.\n④ 심판장은 특허취소신청이 있으면 그 사실을 해당 특허권의 전용실시권자나 그 밖에 그 특허에 관하여 등록을 한\n권리를 가지는 자에게 알려야 한다.\n[본조신설 2016. 2. 29.]"}, {"no": 132, "no_str": "제132조의5", "title": "특허취소신청서 등의 보정ㆍ각하", "body": "① 심판장은 다음 각 호의 어느 하나에 해당하는 경우에는 기간을 정하\n여 그 보정을 명하여야 한다.\n1. 특허취소신청서가 제132조의4제1항(같은 항 제4호는 제외한다)을 위반한 경우\n2. 특허취소신청에 관한 절차가 다음 각 목의 어느 하나에 해당하는 경우\n가. 제3조제1항 또는 제6조를 위반한 경우\n나. 이 법 또는 이 법에 따른 명령으로 정하는 방식을 위반한 경우\n다. 제82조에 따라 내야 할 수수료를 내지 아니한 경우\n② 심판장은 제1항에 따른 보정명령을 받은 자가 지정된 기간에 보정을 하지 아니하거나 보정한 사항이 제132조의\n4제2항을 위반한 경우에는 특허취소신청서 또는 해당 절차와 관련된 청구 또는 신청 등을 결정으로 각하하여야 한\n다.\n③ 제2항에 따른 각하결정은 서면으로 하여야 하며, 그 이유를 붙여야 한다.\n[본조신설 2016. 2. 29.]"}, {"no": 132, "no_str": "제132조의6", "title": "보정할 수 없는 특허취소신청의 각하결정", "body": "① 제132조의7제1항에 따른 합의체는 부적법한 특허취소신청으\n로서 그 흠을 보정할 수 없을 때에는 제132조의4제3항에도 불구하고 특허권자에게 특허취소신청서의 부본을 송달\n하지 아니하고, 결정으로 그 특허취소신청을 각하할 수 있다.\n② 제1항에 따른 각하결정에 대해서는 불복할 수 없다.\n[본조신설 2016. 2. 29.]"}, {"no": 132, "no_str": "제132조의7", "title": "특허취소신청의 합의체 등", "body": "① 특허취소신청은 3명 또는 5명의 심판관으로 구성되는 합의체가 심리하여\n결정한다.\n② 제1항의 합의체 및 이를 구성하는 심판관에 관하여는 제143조부터 제145조까지, 제146조제2항ㆍ제3항, 제\n148조부터 제153조까지 및 제153조의2를 준용한다. 이 경우 제148조제6호 중 “심결”은 “특허취소결정”으로 본다.\n[본조신설 2016. 2. 29.]"}, {"no": 132, "no_str": "제132조의8", "title": "심리의 방식 등", "body": "① 특허취소신청에 관한 심리는 서면으로 한다.\n② 공유인 특허권의 특허권자 중 1인에게 특허취소신청절차의 중단 또는 중지의 원인이 있으면 모두에게 그 효력이\n발생한다.\n[본조신설 2016. 2. 29.]"}, {"no": 132, "no_str": "제132조의9", "title": "참가", "body": "① 특허권에 관하여 권리를 가진 자 또는 이해관계를 가진 자는 특허취소신청에 대한 결정이 있을 때\n까지 특허권자를 보조하기 위하여 그 심리에 참가할 수 있다.\n② 제1항의 참가에 관하여는 제155조제4항ㆍ제5항 및 제156조를 준용한다.\n[본조신설 2016. 2. 29.]"}, {"no": 132, "no_str": "제132조의10", "title": "특허취소신청의 심리에서의 직권심리", "body": "① 심판관은 특허취소신청에 관하여 특허취소신청인, 특허권자 또\n는 참가인이 제출하지 아니한 이유에 대해서도 심리할 수 있다.\n② 심판관은 특허취소신청에 관하여 특허취소신청인이 신청하지 아니한 청구항에 대해서는 심리할 수 없다.\n[본조신설 2016. 2. 29.]"}, {"no": 132, "no_str": "제132조의11", "title": "특허취소신청의 병합 또는 분리", "body": "① 심판관 합의체는 하나의 특허권에 관한 둘 이상의 특허취소신청에 대\n해서는 특별한 사정이 있는 경우를 제외하고는 그 심리를 병합하여 결정하여야 한다.\n② 심판관 합의체는 특허취소신청의 심리에 필요하다고 인정하는 경우에는 제1항에 따라 병합된 심리를 분리할 수\n있다.\n[본조신설 2016. 2. 29.]"}, {"no": 132, "no_str": "제132조의12", "title": "특허취소신청의 취하", "body": "① 특허취소신청은 제132조의14제2항에 따라 결정등본이 송달되기 전까지만 취하\n할 수 있다. 다만, 제132조의13제2항에 따라 특허권자 및 참가인에게 특허의 취소이유가 통지된 후에는 취하할 수\n없다.\n② 둘 이상의 청구항에 관하여 특허취소신청이 있는 경우에는 청구항마다 취하할 수 있다.\n③ 제1항 또는 제2항에 따른 취하가 있으면 그 특허취소신청 또는 그 청구항에 대한 특허취소신청은 처음부터 없었\n던 것으로 본다.\n[본조신설 2016. 2. 29.]"}, {"no": 132, "no_str": "제132조의13", "title": "특허취소신청에 대한 결정", "body": "① 심판관 합의체는 특허취소신청이 이유 있다고 인정되는 때에는 그 특허를\n취소한다는 취지의 결정(이하 “특허취소결정”이라 한다)을 하여야 한다.\n② 심판장은 특허취소결정을 하려는 때에는 특허권자 및 참가인에게 특허의 취소이유를 통지하고 기간을 정하여\n의견서를 제출할 기회를 주어야 한다.\n③ 특허취소결정이 확정된 때에는 그 특허권은 처음부터 없었던 것으로 본다.\n④ 심판관 합의체는 특허취소신청이 제132조의2제1항 각 호의 어느 하나에 해당하지 아니하거나 같은 조 제2항을\n위반한 것으로 인정되는 경우에는 결정으로 그 특허취소신청을 기각하여야 한다.\n⑤ 제4항에 따른 기각결정에 대해서는 불복할 수 없다.\n[본조신설 2016. 2. 29.]"}, {"no": 132, "no_str": "제132조의14", "title": "특허취소신청의 결정 방식", "body": "① 특허취소신청에 대한 결정은 다음 각 호의 사항을 적은 서면으로 하여야\n하며, 결정을 한 심판관은 그 서면에 기명날인하여야 한다.\n1. 특허취소신청사건의 번호\n2. 특허취소신청인, 특허권자 및 참가인의 성명 및 주소(법인인 경우에는 그 명칭 및 영업소의 소재지)\n3. 대리인이 있는 경우에는 그 대리인의 성명 및 주소나 영업소의 소재지[대리인이 특허법인ㆍ특허법인(유한)인 경\n우에는 그 명칭, 사무소의 소재지 및 지정된 변리사의 성명]\n4. 결정에 관련된 특허의 표시\n5. 결정의 결론 및 이유\n6. 결정연월일\n② 심판장은 특허취소신청에 대한 결정이 있는 때에는 그 결정의 등본을 특허취소신청인, 특허권자, 참가인 및 그\n특허취소신청에 대한 심리에 참가를 신청하였으나 그 신청이 거부된 자에게 송달하여야 한다.\n[본조신설 2016. 2. 29.]"}, {"no": 132, "no_str": "제132조의15", "title": "심판규정의 특허취소신청에의 준용", "body": "특허취소신청의 심리ㆍ결정에 관하여는 제147조제3항, 제157조, 제\n158조, 제164조, 제165조제3항부터 제6항까지 및 제166조를 준용한다.\n[본조신설 2016. 2. 29.]"}, {"no": 132, "no_str": "제132조의16", "title": "특허심판원", "body": "① 특허ㆍ실용신안에 관한 취소신청, 특허ㆍ실용신안ㆍ디자인ㆍ상표에 관한 심판과 재심 및\n이에 관한 조사ㆍ연구 사무를 관장하게 하기 위하여 지식재산처장 소속으로 특허심판원을 둔다. <개정 2016. 2. 29.,\n2025. 10. 1.>\n② 특허심판원에 원장과 심판관을 둔다.\n③ 특허심판원에 제1항에 따른 조사ㆍ연구와 그 밖의 사무를 담당하는 인력을 둘 수 있다.<신설 2021. 8. 17.>\n④ 특허심판원의 조직과 정원 및 운영에 필요한 사항은 대통령령으로 정한다.<개정 2021. 8. 17.>\n[전문개정 2014. 6. 11.]\n[제132조의2에서 이동 <2016. 2. 29.>]"}, {"no": 132, "no_str": "제132조의17", "title": "특허거절결정 등에 대한 심판", "body": "특허거절결정 또는 특허권의 존속기간의 연장등록거절결정을 받은 자가\n결정에 불복할 때에는 그 결정등본을 송달받은 날부터 3개월 이내에 심판을 청구할 수 있다. <개정 2021. 10. 19.>\n[전문개정 2014. 6. 11.]\n[제132조의3에서 이동 <2016. 2. 29.>]"}, {"no": 133, "no_str": "제133조", "title": "특허의 무효심판", "body": "① 이해관계인(제2호 본문의 경우에는 특허를 받을 수 있는 권리를 가진 자만 해당한다) 또\n는 심사관은 특허가 다음 각 호의 어느 하나에 해당하는 경우에는 무효심판을 청구할 수 있다. 이 경우 청구범위의\n청구항이 둘 이상인 경우에는 청구항마다 청구할 수 있다. <개정 2016. 2. 29., 2021. 10. 19.>\n1. 제25조, 제29조, 제32조, 제36조제1항부터 제3항까지, 제42조제3항제1호 또는 같은 조 제4항을 위반한 경우\n2. 제33조제1항 본문에 따른 특허를 받을 수 있는 권리를 가지지 아니하거나 제44조를 위반한 경우. 다만, 제99조의\n2제2항에 따라 이전등록된 경우에는 제외한다.\n3. 제33조제1항 단서에 따라 특허를 받을 수 없는 경우\n4. 특허된 후 그 특허권자가 제25조에 따라 특허권을 누릴 수 없는 자로 되거나 그 특허가 조약을 위반한 경우\n5. 조약을 위반하여 특허를 받을 수 없는 경우\n6. 제47조제2항 전단에 따른 범위를 벗어난 보정인 경우\n7. 제52조제1항에 따른 범위를 벗어난 분할출원 또는 제52조의2제1항 각 호 외의 부분 전단에 따른 범위를 벗어난\n분리출원인 경우\n8. 제53조제1항에 따른 범위를 벗어난 변경출원인 경우\n② 제1항에 따른 심판은 특허권이 소멸된 후에도 청구할 수 있다.\n③ 특허를 무효로 한다는 심결이 확정된 경우에는 그 특허권은 처음부터 없었던 것으로 본다. 다만, 제1항제4호에\n따라 특허를 무효로 한다는 심결이 확정된 경우에는 특허권은 그 특허가 같은 호에 해당하게 된 때부터 없었던 것\n으로 본다.\n④ 심판장은 제1항에 따른 심판이 청구된 경우에는 그 취지를 해당 특허권의 전용실시권자나 그 밖에 특허에 관하\n여 등록을 한 권리를 가지는 자에게 알려야 한다.\n[전문개정 2014. 6. 11.]"}, {"no": 133, "no_str": "제133조의2", "title": "특허무효심판절차에서의 특허의 정정", "body": "① 제133조제1항에 따른 심판의 피청구인은 제136조제1항 각 호의\n어느 하나에 해당하는 경우에만 제147조제1항 또는 제159조제1항 후단에 따라 지정된 기간에 특허발명의 명세서\n또는 도면에 대하여 정정청구를 할 수 있다. 이 경우 심판장이 제147조제1항에 따라 지정된 기간 후에도 청구인이\n증거를 제출하거나 새로운 무효사유를 주장함으로 인하여 정정청구를 허용할 필요가 있다고 인정하는 경우에는 기\n간을 정하여 정정청구를 하게 할 수 있다. <개정 2016. 2. 29.>\n② 제1항에 따른 정정청구를 하였을 때에는 해당 무효심판절차에서 그 정정청구 전에 한 정정청구는 취하된 것으로\n본다.\n③ 심판장은 제1항에 따른 정정청구가 있을 때에는 그 청구서의 부본을 제133조제1항에 따른 심판의 청구인에게\n송달하여야 한다.\n④ 제1항에 따른 정정청구에 관하여는 제136조제3항부터 제6항까지, 제8항 및 제10항부터 제13항까지, 제139조제\n3항 및 제140조제1항ㆍ제2항ㆍ제5항을 준용한다. 이 경우 제136조제11항 중 “제162조제3항에 따른 심리의 종결이\n통지되기 전(같은 조 제4항에 따라 심리가 재개된 경우에는 그 후 다시 같은 조 제3항에 따른 심리의 종결이 통지되\n기 전)에”는 “제133조의2제1항 또는 제136조제6항에 따라 지정된 기간에”로 본다.<개정 2016. 2. 29.>\n⑤ 제1항에 따른 정정청구는 다음 각 호의 어느 하나에 해당하는 기간에만 취하할 수 있다.<신설 2016. 2. 29.>\n1. 제1항에 따라 정정을 청구할 수 있도록 지정된 기간과 그 기간의 만료일부터 1개월 이내의 기간\n2. 제4항에서 준용하는 제136조제6항에 따라 지정된 기간\n⑥ 제4항을 적용할 때 제133조제1항에 따른 특허무효심판이 청구된 청구항을 정정하는 경우에는 제136조제5항을\n준용하지 아니한다.<개정 2016. 2. 29.>\n[전문개정 2014. 6. 11.]"}, {"no": 134, "no_str": "제134조", "title": "특허권 존속기간의 연장등록의 무효심판", "body": "① 이해관계인 또는 심사관은 제92조에 따른 특허권의 존속기간의\n연장등록이 다음 각 호의 어느 하나에 해당하는 경우에는 무효심판을 청구할 수 있다. <개정 2025. 1. 21.>\n1. 특허발명을 실시하기 위하여 제89조에 따른 허가등을 받을 필요가 없는 출원에 대하여 연장등록이 된 경우\n2. 특허권자 또는 그 특허권의 전용실시권 또는 등록된 통상실시권을 가진 자가 제89조에 따른 허가등을 받지 아니\n한 출원에 대하여 연장등록이 된 경우\n3. 연장등록에 따라 연장된 기간이 제89조에 따라 인정되는 연장의 기간을 초과하는 경우\n4. 해당 특허권자가 아닌 자의 출원에 대하여 연장등록이 된 경우\n5. 제90조제3항을 위반한 출원에 대하여 연장등록이 된 경우\n6. 제90조제7항을 위반하여 하나의 허가등에 대하여 둘 이상의 특허권의 존속기간이 연장등록된 경우\n② 이해관계인 또는 심사관은 제92조의5에 따른 특허권의 존속기간의 연장등록이 다음 각 호의 어느 하나에 해당\n하면 무효심판을 청구할 수 있다.\n1. 연장등록에 따라 연장된 기간이 제92조의2에 따라 인정되는 연장의 기간을 초과한 경우\n2. 해당 특허권자가 아닌 자의 출원에 대하여 연장등록이 된 경우\n3. 제92조의3제3항을 위반한 출원에 대하여 연장등록이 된 경우\n③ 제1항 및 제2항에 따른 심판의 청구에 관하여는 제133조제2항 및 제4항을 준용한다.\n④ 연장등록을 무효로 한다는 심결이 확정된 경우에는 그 연장등록에 따른 존속기간의 연장은 처음부터 없었던 것\n으로 본다. 다만, 연장등록이 다음 각 호의 어느 하나에 해당하는 경우에는 해당 기간에 대해서만 연장이 없었던 것\n으로 본다.<개정 2025. 1. 21.>\n1. 연장등록이 제1항제3호에 해당하여 무효로 된 경우: 제89조에 따라 인정되는 연장의 기간을 초과하여 연장된 기\n간\n2. 연장등록이 제2항제1호에 해당하여 무효로 된 경우: 제92조의2에 따라 인정되는 연장의 기간을 초과하여 연장된\n기간\n⑤ 연장등록이 제1항제6호에 해당하여 무효로 한다는 심결이 확정된 경우에는 그 특허권의 존속기간의 연장등록출\n원은 처음부터 없었던 것으로 본다.<신설 2025. 1. 21.>\n[전문개정 2014. 6. 11.]"}, {"no": 135, "no_str": "제135조", "title": "권리범위 확인심판", "body": "① 특허권자 또는 전용실시권자는 자신의 특허발명의 보호범위를 확인하기 위하여 특허\n권의 권리범위 확인심판을 청구할 수 있다. <개정 2016. 2. 29.>\n② 이해관계인은 타인의 특허발명의 보호범위를 확인하기 위하여 특허권의 권리범위 확인심판을 청구할 수 있다.\n<신설 2016. 2. 29.>\n③ 제1항 또는 제2항에 따른 특허권의 권리범위 확인심판을 청구하는 경우에 청구범위의 청구항이 둘 이상인 경우\n에는 청구항마다 청구할 수 있다.<개정 2016. 2. 29.>\n[전문개정 2014. 6. 11.]"}, {"no": 136, "no_str": "제136조", "title": "정정심판", "body": "① 특허권자는 다음 각 호의 어느 하나에 해당하는 경우에는 특허발명의 명세서 또는 도면에 대하\n여 정정심판을 청구할 수 있다. <개정 2016. 2. 29.>\n1. 청구범위를 감축하는 경우\n2. 잘못 기재된 사항을 정정하는 경우\n3. 분명하지 아니하게 기재된 사항을 명확하게 하는 경우\n② 제1항에도 불구하고 다음 각 호의 어느 하나에 해당하는 기간에는 정정심판을 청구할 수 없다.<신설 2016. 2.\n29.>\n1. 특허취소신청이 특허심판원에 계속 중인 때부터 그 결정이 확정될 때까지의 기간. 다만, 특허무효심판의 심결 또\n는 정정의 무효심판의 심결에 대한 소가 특허법원에 계속 중인 경우에는 특허법원에서 변론이 종결(변론 없이 한\n판결의 경우에는 판결의 선고를 말한다)된 날까지 정정심판을 청구할 수 있다.\n2. 특허무효심판 또는 정정의 무효심판이 특허심판원에 계속 중인 기간\n③ 제1항에 따른 명세서 또는 도면의 정정은 특허발명의 명세서 또는 도면에 기재된 사항의 범위에서 할 수 있다.\n다만, 제1항제2호에 따라 잘못된 기재를 정정하는 경우에는 출원서에 최초로 첨부된 명세서 또는 도면에 기재된 사\n항의 범위에서 할 수 있다.<개정 2016. 2. 29.>\n④ 제1항에 따른 명세서 또는 도면의 정정은 청구범위를 실질적으로 확장하거나 변경할 수 없다.<개정 2016. 2.\n29.>\n⑤ 제1항에 따른 정정 중 같은 항 제1호 또는 제2호에 해당하는 정정은 정정 후의 청구범위에 적혀 있는 사항이 특\n허출원을 하였을 때에 특허를 받을 수 있는 것이어야 한다.<개정 2016. 2. 29.>\n⑥ 심판관은 제1항에 따른 심판청구가 다음 각 호의 어느 하나에 해당한다고 인정하는 경우에는 청구인에게 그 이\n유를 통지하고, 기간을 정하여 의견서를 제출할 수 있는 기회를 주어야 한다.<개정 2016. 2. 29.>\n1. 제1항 각 호의 어느 하나에 해당하지 아니한 경우\n2. 제3항에 따른 범위를 벗어난 경우\n3. 제4항 또는 제5항을 위반한 경우\n⑦ 제1항에 따른 정정심판은 특허권이 소멸된 후에도 청구할 수 있다. 다만, 특허취소결정이 확정되거나 특허를 무\n효(제133조제1항제4호에 의한 무효는 제외한다)로 한다는 심결이 확정된 후에는 그러하지 아니하다.<개정 2016. 2.\n29.>\n⑧ 특허권자는 전용실시권자, 질권자와 제100조제4항ㆍ제102조제1항 및 「발명진흥법」 제10조제1항에 따른 통상\n실시권을 갖는 자의 동의를 받아야만 제1항에 따른 정정심판을 청구할 수 있다. 다만, 특허권자가 정정심판을 청구\n하기 위하여 동의를 받아야 하는 자가 무효심판을 청구한 경우에는 그러하지 아니하다.<개정 2016. 2. 29.>\n⑨ 제1항에 따른 정정심판에는 제147조제1항ㆍ제2항, 제155조 및 제156조를 적용하지 아니한다.<신설 2016. 2.\n29.>\n⑩ 특허발명의 명세서 또는 도면에 대하여 정정을 한다는 심결이 확정되었을 때에는 그 정정 후의 명세서 또는 도\n면에 따라 특허출원, 출원공개, 특허결정 또는 심결 및 특허권의 설정등록이 된 것으로 본다.<개정 2016. 2. 29.>\n⑪ 청구인은 제162조제3항에 따른 심리의 종결이 통지되기 전(같은 조 제4항에 따라 심리가 재개된 경우에는 그 후\n다시 같은 조 제3항에 따른 심리의 종결이 통지되기 전)에 제140조제5항에 따른 심판청구서에 첨부된 정정한 명세\n서 또는 도면에 대하여 보정할 수 있다.<개정 2016. 2. 29.>\n⑫ 특허발명의 명세서 또는 도면에 대한 정정을 한다는 심결이 있는 경우 특허심판원장은 그 내용을 지식재산처장\n에게 알려야 한다.<개정 2016. 2. 29., 2025. 10. 1.>\n⑬ 지식재산처장은 제12항에 따른 통보가 있으면 이를 특허공보에 게재하여야 한다.<개정 2016. 2. 29., 2025. 10.\n1.>\n[전문개정 2014. 6. 11.]"}, {"no": 137, "no_str": "제137조", "title": "정정의 무효심판", "body": "① 이해관계인 또는 심사관은 제132조의3제1항, 제133조의2제1항, 제136조제1항 또는 이\n조 제3항에 따른 특허발명의 명세서 또는 도면에 대한 정정이 다음 각 호의 어느 하나의 규정을 위반한 경우에는 정\n정의 무효심판을 청구할 수 있다. <개정 2016. 2. 29.>\n1. 제136조제1항 각 호의 어느 하나의 규정\n2. 제136조제3항부터 제5항까지의 규정(제132조의3제3항 또는 제133조의2제4항에 따라 준용되는 경우를 포함한다\n)\n② 제1항에 따른 심판청구에 관하여는 제133조제2항 및 제4항을 준용한다.\n③ 제1항에 따른 무효심판의 피청구인은 제136조제1항 각 호의 어느 하나에 해당하는 경우에만 제147조제1항 또\n는 제159조제1항 후단에 따라 지정된 기간에 특허발명의 명세서 또는 도면의 정정을 청구할 수 있다. 이 경우 심판\n장이 제147조제1항에 따라 지정된 기간 후에도 청구인이 증거를 제출하거나 새로운 무효사유를 주장함으로 인하여\n정정의 청구를 허용할 필요가 있다고 인정하는 경우에는 기간을 정하여 정정청구를 하게 할 수 있다.<개정 2016. 2.\n29.>\n④ 제3항에 따른 정정청구에 관하여는 제133조의2제2항부터 제5항까지의 규정을 준용한다. 이 경우 제133조의2제\n3항 중 “제133조제1항”은 “제137조제1항”으로 보고, 같은 조 제4항 후단 중 “제133조의2제1항”을 “제137조제3항\n”으로 보며, 같은 조 제5항 각 호 외의 부분 및 같은 항 제1호 중 “제1항”을 각각 “제3항”으로 본다.<개정 2016. 2.\n29.>\n⑤ 제1항에 따라 정정을 무효로 한다는 심결이 확정되었을 때에는 그 정정은 처음부터 없었던 것으로 본다.\n[전문개정 2014. 6. 11.]"}, {"no": 138, "no_str": "제138조", "title": "통상실시권 허락의 심판", "body": "① 특허권자, 전용실시권자 또는 통상실시권자는 해당 특허발명이 제98조에 해당하\n여 실시의 허락을 받으려는 경우에 그 타인이 정당한 이유 없이 허락하지 아니하거나 그 타인의 허락을 받을 수 없\n을 때에는 자기의 특허발명의 실시에 필요한 범위에서 통상실시권 허락의 심판을 청구할 수 있다.\n② 제1항에 따른 청구가 있는 경우에 그 특허발명이 그 특허출원일 전에 출원된 타인의 특허발명 또는 등록실용신\n안과 비교하여 상당한 경제적 가치가 있는 중요한 기술적 진보를 가져오는 것이 아니면 통상실시권을 허락하여서\n는 아니 된다.\n③ 제1항에 따른 심판에 따라 통상실시권을 허락한 자가 그 통상실시권을 허락받은 자의 특허발명을 실시할 필요가\n있는 경우 그 통상실시권을 허락받은 자가 실시를 허락하지 아니하거나 실시의 허락을 받을 수 없을 때에는 통상실\n시권을 허락받아 실시하려는 특허발명의 범위에서 통상실시권 허락의 심판을 청구할 수 있다.\n④ 제1항 및 제3항에 따라 통상실시권을 허락받은 자는 특허권자, 실용신안권자, 디자인권자 또는 그 전용실시권자\n에게 대가를 지급하여야 한다. 다만, 자기가 책임질 수 없는 사유로 지급할 수 없는 경우에는 그 대가를 공탁하여야\n한다.\n⑤ 제4항에 따른 통상실시권자는 그 대가를 지급하지 아니하거나 공탁을 하지 아니하면 그 특허발명, 등록실용신안\n또는 등록디자인이나 이와 유사한 디자인을 실시할 수 없다.\n[전문개정 2014. 6. 11.]"}, {"no": 139, "no_str": "제139조", "title": "공동심판의 청구 등", "body": "① 동일한 특허권에 관하여 제133조제1항, 제134조제1항ㆍ제2항 또는 제137조제1항의\n무효심판이나 제135조제1항ㆍ제2항의 권리범위 확인심판을 청구하는 자가 2인 이상이면 모두가 공동으로 심판을\n청구할 수 있다. <개정 2016. 2. 29.>\n② 공유인 특허권의 특허권자에 대하여 심판을 청구할 때에는 공유자 모두를 피청구인으로 하여야 한다.\n③ 특허권 또는 특허를 받을 수 있는 권리의 공유자가 그 공유인 권리에 관하여 심판을 청구할 때에는 공유자 모두\n가 공동으로 청구하여야 한다.\n④ 제1항 또는 제3항에 따른 청구인이나 제2항에 따른 피청구인 중 1인에게 심판절차의 중단 또는 중지의 원인이\n있으면 모두에게 그 효력이 발생한다.\n[전문개정 2014. 6. 11.]"}, {"no": 139, "no_str": "제139조의2", "title": "국선대리인", "body": "① 특허심판원장은 총리령으로 정하는 요건을 갖춘 심판 당사자의 신청에 따라 대리인(이하\n“국선대리인”이라 한다)을 선임하여 줄 수 있다. 다만, 심판청구가 이유 없음이 명백하거나 권리의 남용이라고 인정\n되는 경우에는 그러하지 아니하다. <개정 2025. 10. 1.>\n② 국선대리인이 선임된 당사자에 대하여 심판절차와 관련된 수수료를 감면할 수 있다.\n③ 국선대리인의 신청절차 및 수수료 감면 등 국선대리인 운영에 필요한 사항은 총리령으로 정한다.<개정 2025.\n10. 1.>\n[본조신설 2019. 1. 8.]"}, {"no": 140, "no_str": "제140조", "title": "심판청구방식", "body": "① 심판을 청구하려는 자는 다음 각 호의 사항을 적은 심판청구서를 특허심판원장에게 제출하\n여야 한다.\n1. 당사자의 성명 및 주소(법인인 경우에는 그 명칭 및 영업소의 소재지)\n2. 대리인이 있는 경우에는 그 대리인의 성명 및 주소나 영업소의 소재지[대리인이 특허법인ㆍ특허법인(유한)인 경\n우에는 그 명칭, 사무소의 소재지 및 지정된 변리사의 성명]\n3. 심판사건의 표시\n4. 청구의 취지 및 그 이유\n② 제1항에 따라 제출된 심판청구서의 보정은 그 요지를 변경할 수 없다. 다만, 다음 각 호의 어느 하나에 해당하는\n경우에는 그러하지 아니하다.<개정 2016. 2. 29.>\n1. 제1항제1호에 따른 당사자 중 특허권자의 기재를 바로잡기 위하여 보정(특허권자를 추가하는 것을 포함하되, 청\n구인이 특허권자인 경우에는 추가되는 특허권자의 동의가 있는 경우로 한정한다)하는 경우\n2. 제1항제4호에 따른 청구의 이유를 보정하는 경우\n3. 제135조제1항에 따른 권리범위 확인심판에서 심판청구서의 확인대상 발명(청구인이 주장하는 피청구인의 발명\n을 말한다)의 설명서 또는 도면에 대하여 피청구인이 자신이 실제로 실시하고 있는 발명과 비교하여 다르다고 주\n장하는 경우에 청구인이 피청구인의 실시 발명과 동일하게 하기 위하여 심판청구서의 확인대상 발명의 설명서\n또는 도면을 보정하는 경우\n③ 제135조제1항ㆍ제2항에 따른 권리범위 확인심판을 청구할 때에는 특허발명과 대비할 수 있는 설명서 및 필요한\n도면을 첨부하여야 한다.<개정 2016. 2. 29.>\n④ 제138조제1항에 따른 통상실시권 허락의 심판의 심판청구서에는 제1항 각 호의 사항 외에 다음 사항을 추가로\n적어야 한다.\n1. 실시하려는 자기의 특허의 번호 및 명칭\n2. 실시되어야 할 타인의 특허발명ㆍ등록실용신안 또는 등록디자인의 번호ㆍ명칭 및 특허나 등록 연월일\n3. 특허발명ㆍ등록실용신안 또는 등록디자인의 통상실시권의 범위ㆍ기간 및 대가\n⑤ 제136조제1항에 따른 정정심판을 청구할 때에는 심판청구서에 정정한 명세서 또는 도면을 첨부하여야 한다.\n[전문개정 2014. 6. 11.]"}, {"no": 140, "no_str": "제140조의2", "title": "특허거절결정에 대한 심판청구방식", "body": "① 제132조의17에 따라 특허거절결정에 대한 심판을 청구하려는 자는\n제140조제1항에도 불구하고 다음 각 호의 사항을 적은 심판청구서를 특허심판원장에게 제출하여야 한다. <개정\n2016. 2. 29.>\n1. 청구인의 성명 및 주소(법인인 경우에는 그 명칭 및 영업소의 소재지)\n2. 대리인이 있는 경우에는 그 대리인의 성명 및 주소나 영업소의 소재지[대리인이 특허법인ㆍ특허법인(유한)인 경\n우에는 그 명칭, 사무소의 소재지 및 지정된 변리사의 성명]\n3. 출원일 및 출원번호\n4. 발명의 명칭\n5. 특허거절결정일\n6. 심판사건의 표시\n7. 청구의 취지 및 그 이유\n② 제1항에 따라 제출된 심판청구서를 보정하는 경우에는 그 요지를 변경할 수 없다. 다만, 다음 각 호의 어느 하나\n에 해당하는 경우에는 그러하지 아니하다.\n1. 제1항제1호에 따른 청구인의 기재를 바로잡기 위하여 보정(청구인을 추가하는 것을 포함하되, 그 청구인의 동의\n가 있는 경우로 한정한다)하는 경우\n2. 제1항제7호에 따른 청구의 이유를 보정하는 경우\n[전문개정 2014. 6. 11.]"}, {"no": 141, "no_str": "제141조", "title": "심판청구서 등의 각하", "body": "① 심판장은 다음 각 호의 어느 하나에 해당하는 경우에는 기간을 정하여 그 보정을 명\n하여야 한다. 다만, 보정할 사항이 경미하고 명확한 경우에는 직권으로 보정할 수 있다. <개정 2023. 9. 14.>\n1. 심판청구서가 제140조제1항 및 제3항부터 제5항까지 또는 제140조의2제1항을 위반한 경우\n2. 심판에 관한 절차가 다음 각 목의 어느 하나에 해당하는 경우\n가. 제3조제1항 또는 제6조를 위반한 경우\n나. 제82조에 따라 내야 할 수수료를 내지 아니한 경우\n다. 이 법 또는 이 법에 따른 명령으로 정하는 방식을 위반한 경우\n② 심판장은 제1항 본문에 따른 보정명령을 받은 자가 지정된 기간에 보정을 하지 아니하거나 보정한 사항이 제\n140조제2항 또는 제140조의2제2항을 위반한 경우에는 심판청구서 또는 해당 절차와 관련된 청구나 신청 등을 결\n정으로 각하하여야 한다.<개정 2016. 2. 29., 2023. 9. 14.>\n③ 제2항에 따른 결정은 서면으로 하여야 하며, 그 이유를 붙여야 한다.\n④ 심판장은 제1항 단서에 따라 직권보정을 하려면 그 직권보정 사항을 청구인에게 통지하여야 한다.<신설 2023.\n9. 14.>\n⑤ 청구인은 제1항 단서에 따른 직권보정 사항을 받아들일 수 없으면 직권보정 사항의 통지를 받은 날부터 7일 이\n내에 그 직권보정 사항에 대한 의견서를 심판장에게 제출하여야 한다.<신설 2023. 9. 14.>\n⑥ 청구인이 제5항에 따라 의견서를 제출한 경우에는 해당 직권보정 사항은 처음부터 없었던 것으로 본다.<신설\n2023. 9. 14.>\n⑦ 제1항 단서에 따른 직권보정이 명백히 잘못된 경우 그 직권보정은 처음부터 없었던 것으로 본다.<신설 2023. 9.\n14.>\n[전문개정 2014. 6. 11.]\n[제목개정 2016. 2. 29.]"}, {"no": 142, "no_str": "제142조", "title": "보정할 수 없는 심판청구의 심결각하", "body": "부적법한 심판청구로서 그 흠을 보정할 수 없을 때에는 피청구인에게\n답변서 제출의 기회를 주지 아니하고, 심결로써 그 청구를 각하할 수 있다.\n[전문개정 2014. 6. 11.]"}, {"no": 143, "no_str": "제143조", "title": "심판관", "body": "① 특허심판원장은 심판이 청구되면 심판관에게 심판하게 한다.\n② 심판관의 자격은 대통령령으로 정한다.\n③ 심판관은 직무상 독립하여 심판한다.\n[전문개정 2014. 6. 11.]"}, {"no": 144, "no_str": "제144조", "title": "심판관의 지정", "body": "① 특허심판원장은 각 심판사건에 대하여 제146조에 따른 합의체를 구성할 심판관을 지정하\n여야 한다.\n② 특허심판원장은 제1항의 심판관 중 심판에 관여하는 데 지장이 있는 사람이 있으면 다른 심판관에게 심판하게\n할 수 있다.\n[전문개정 2014. 6. 11.]"}, {"no": 145, "no_str": "제145조", "title": "심판장", "body": "① 특허심판원장은 제144조제1항에 따라 지정된 심판관 중에서 1명을 심판장으로 지정하여야 한다.\n② 심판장은 그 심판사건에 관한 사무를 총괄한다.\n[전문개정 2014. 6. 11.]"}, {"no": 146, "no_str": "제146조", "title": "심판의 합의체", "body": "① 심판은 3명 또는 5명의 심판관으로 구성되는 합의체가 한다.\n② 제1항의 합의체의 합의는 과반수로 결정한다.\n③ 심판의 합의는 공개하지 아니한다.\n[전문개정 2014. 6. 11.]"}, {"no": 147, "no_str": "제147조", "title": "답변서 제출 등", "body": "① 심판장은 심판이 청구되면 심판청구서 부본을 피청구인에게 송달하고, 기간을 정하여 답변\n서를 제출할 수 있는 기회를 주어야 한다.\n② 심판장은 제1항의 답변서를 받았을 때에는 그 부본을 청구인에게 송달하여야 한다.\n③ 심판장은 심판에 관하여 당사자를 심문할 수 있다.\n[전문개정 2014. 6. 11.]"}, {"no": 148, "no_str": "제148조", "title": "심판관의 제척", "body": "심판관은 다음 각 호의 어느 하나에 해당하는 경우에는 그 심판에서 제척된다. <개정 2016. 2.\n29.>\n1. 심판관 또는 그 배우자이거나 배우자이었던 사람이 사건의 당사자, 참가인 또는 특허취소신청인인 경우\n2. 심판관이 사건의 당사자, 참가인 또는 특허취소신청인의 친족이거나 친족이었던 경우\n3. 심판관이 사건의 당사자, 참가인 또는 특허취소신청인의 법정대리인이거나 법정대리인이었던 경우\n4. 심판관이 사건에 대한 증인, 감정인이거나 감정인이었던 경우\n5. 심판관이 사건의 당사자, 참가인 또는 특허취소신청인의 대리인이거나 대리인이었던 경우\n6. 심판관이 사건에 대하여 심사관 또는 심판관으로서 특허여부결정 또는 심결에 관여한 경우\n7. 심판관이 사건에 관하여 직접 이해관계를 가진 경우\n[전문개정 2014. 6. 11.]"}, {"no": 149, "no_str": "제149조", "title": "제척신청", "body": "제148조에 따른 제척의 원인이 있으면 당사자 또는 참가인은 제척신청을 할 수 있다.\n[전문개정 2014. 6. 11.]"}, {"no": 150, "no_str": "제150조", "title": "심판관의 기피", "body": "① 심판관에게 공정한 심판을 기대하기 어려운 사정이 있으면 당사자 또는 참가인은 기피신청\n을 할 수 있다.\n② 당사자 또는 참가인은 사건에 대하여 심판관에게 서면 또는 구두로 진술을 한 후에는 기피신청을 할 수 없다. 다\n만, 기피의 원인이 있는 것을 알지 못한 경우 또는 기피의 원인이 그 후에 발생한 경우에는 그러하지 아니하다.\n[전문개정 2014. 6. 11.]"}, {"no": 151, "no_str": "제151조", "title": "제척 또는 기피의 소명", "body": "① 제149조 또는 제150조에 따라 제척 또는 기피 신청을 하려는 자는 그 원인을 적은\n서면을 특허심판원장에게 제출하여야 한다. 다만, 구술심리를 할 때에는 구술로 할 수 있다.\n② 제척 또는 기피의 원인은 신청한 날부터 3일 이내에 소명하여야 한다.\n[전문개정 2014. 6. 11.]"}, {"no": 152, "no_str": "제152조", "title": "제척 또는 기피 신청에 관한 결정", "body": "① 제척 또는 기피 신청이 있으면 심판으로 결정하여야 한다.\n② 제척 또는 기피 신청의 대상이 된 심판관은 그 제척 또는 기피에 대한 심판에 관여할 수 없다. 다만, 의견을 진술\n할 수 있다.\n③ 제1항에 따른 결정은 서면으로 하여야 하며, 그 이유를 붙여야 한다.\n④ 제1항에 따른 결정에 대해서는 불복할 수 없다.\n[전문개정 2014. 6. 11.]"}, {"no": 153, "no_str": "제153조", "title": "심판절차의 중지", "body": "제척 또는 기피 신청이 있으면 그 신청에 대한 결정이 있을 때까지 심판절차를 중지하여야\n한다. 다만, 긴급한 경우에는 그러하지 아니하다.\n[전문개정 2014. 6. 11.]"}, {"no": 153, "no_str": "제153조의2", "title": "심판관의 회피", "body": "심판관이 제148조 또는 제150조에 해당하는 경우에는 특허심판원장의 허가를 받아 그 사\n건에 대한 심판을 회피할 수 있다.\n[전문개정 2014. 6. 11.]"}, {"no": 154, "no_str": "제154조", "title": "심리 등", "body": "① 심판은 구술심리 또는 서면심리로 한다. 다만, 당사자가 구술심리를 신청하였을 때에는 서면심리\n만으로 결정할 수 있다고 인정되는 경우 외에는 구술심리를 하여야 한다. <개정 2014. 6. 11.>\n② 삭제<2001. 2. 3.>\n③ 구술심리는 공개하여야 한다. 다만, 공공의 질서 또는 선량한 풍속에 어긋날 우려가 있으면 그러하지 아니하다.\n<개정 2014. 6. 11.>\n④ 심판장은 제1항에 따라 구술심리로 심판을 할 경우에는 그 기일 및 장소를 정하고, 그 취지를 적은 서면을 당사\n자 및 참가인에게 송달하여야 한다. 다만, 해당 사건의 이전 심리에 출석한 당사자 및 참가인에게 알렸을 때에는 그\n러하지 아니하다.<개정 2014. 6. 11.>\n⑤ 심판장은 제1항에 따라 구술심리로 심판을 할 경우에는 특허심판원장이 지정한 직원에게 기일마다 심리의 요지\n와 그 밖에 필요한 사항을 적은 조서를 작성하게 하여야 한다.<개정 2014. 6. 11.>\n⑥ 제5항의 조서에는 심판의 심판장 및 조서를 작성한 직원이 기명날인하여야 한다.<개정 2014. 6. 11.>\n⑦ 제5항의 조서에 관하여는 「민사소송법」 제153조ㆍ제154조 및 제156조부터 제160조까지의 규정을 준용한다.\n<개정 2014. 6. 11.>\n⑧ 심판에 관하여는 「민사소송법」 제143조ㆍ제259조ㆍ제299조 및 제367조를 준용한다.<개정 2014. 6. 11.>\n⑨ 심판장은 구술심리 중 심판정 내의 질서를 유지한다.<신설 2014. 6. 11.>\n[제목개정 2014. 6. 11.]"}, {"no": 154, "no_str": "제154조의2", "title": "전문심리위원", "body": "① 심판장은 직권에 따른 결정으로 전문심리위원을 지정하여 심판절차에 참여하게 할 수 있\n다.\n② 심판장은 제1항에 따라 전문심리위원을 심판절차에 참여시키는 경우 당사자의 의견을 들어 각 사건마다 1명 이\n상의 전문심리위원을 지정하여야 한다.\n③ 전문심리위원에게는 총리령으로 정하는 바에 따라 수당을 지급하고, 필요한 경우에는 그 밖의 여비, 일당 및 숙\n박료를 지급할 수 있다.<개정 2025. 10. 1.>\n④ 전문심리위원의 지정에 관하여 그 밖에 필요한 사항은 총리령으로 정한다.<개정 2025. 10. 1.>\n⑤ 제1항에 따른 전문심리위원에 관하여는 「민사소송법」 제164조의2제2항부터 제4항까지 및 제164조의3을 준용\n한다. 이 경우 “법원”은 “심판장”으로 본다.\n⑥ 제1항에 따른 전문심리위원의 제척 및 기피에 관하여는 제148조부터 제152조까지의 규정을 준용한다. 이 경우\n“심판관”은 “전문심리위원”으로 본다.\n[본조신설 2021. 4. 20.]"}, {"no": 154, "no_str": "제154조의3", "title": "참고인 의견서의 제출", "body": "① 심판장은 산업에 미치는 영향 등을 고려하여 사건 심리에 필요하다고 인정되는\n경우 공공단체, 그 밖의 참고인에게 심판사건에 관한 의견서를 제출하게 할 수 있다.\n② 국가기관과 지방자치단체는 공익과 관련된 사항에 관하여 특허심판원에 심판사건에 관한 의견서를 제출할 수\n있다.\n③ 심판장은 제1항 또는 제2항에 따라 참고인이 제출한 의견서에 대하여 당사자에게 구술 또는 서면에 의한 의견진\n술의 기회를 주어야 한다.\n④ 제1항 또는 제2항에 따른 참고인의 선정 및 비용, 준수사항 등 참고인 의견서 제출에 필요한 사항은 총리령으로\n정한다.<개정 2025. 10. 1.>\n[본조신설 2023. 9. 14.]"}, {"no": 155, "no_str": "제155조", "title": "참가", "body": "① 제139조제1항에 따라 심판을 청구할 수 있는 자는 심리가 종결될 때까지 그 심판에 참가할 수 있다.\n② 제1항에 따른 참가인은 피참가인이 그 심판의 청구를 취하한 후에도 심판절차를 속행할 수 있다.\n③ 심판의 결과에 대하여 이해관계를 가진 자는 심리가 종결될 때까지 당사자의 어느 한쪽을 보조하기 위하여 그\n심판에 참가할 수 있다.\n④ 제3항에 따른 참가인은 모든 심판절차를 밟을 수 있다.\n⑤ 제1항 또는 제3항에 따른 참가인에게 심판절차의 중단 또는 중지의 원인이 있으면 그 중단 또는 중지는 피참가\n인에 대해서도 그 효력이 발생한다.\n[전문개정 2014. 6. 11.]"}, {"no": 156, "no_str": "제156조", "title": "참가의 신청 및 결정", "body": "① 심판에 참가하려는 자는 참가신청서를 심판장에게 제출하여야 한다.\n② 심판장은 참가신청이 있는 경우에는 참가신청서 부본을 당사자 및 다른 참가인에게 송달하고, 기간을 정하여 의\n견서를 제출할 수 있는 기회를 주어야 한다.\n③ 참가신청이 있는 경우에는 심판으로 그 참가 여부를 결정하여야 한다.\n④ 제3항에 따른 결정은 서면으로 하여야 하며, 그 이유를 붙여야 한다.\n⑤ 제3항에 따른 결정에 대해서는 불복할 수 없다.\n[전문개정 2014. 6. 11.]"}, {"no": 157, "no_str": "제157조", "title": "증거조사 및 증거보전", "body": "① 심판에서는 당사자, 참가인 또는 이해관계인의 신청에 의하여 또는 직권으로 증거조\n사나 증거보전을 할 수 있다.\n② 제1항에 따른 증거조사 및 증거보전에 관하여는 「민사소송법」 중 증거조사 및 증거보전에 관한 규정을 준용한\n다. 다만, 심판관은 다음 각 호의 행위는 하지 못한다.\n1. 과태료의 결정\n2. 구인(拘引)을 명하는 행위\n3. 보증금을 공탁하게 하는 행위\n③ 증거보전신청은 심판청구 전에는 특허심판원장에게 하고, 심판계속 중에는 그 사건의 심판장에게 하여야 한다.\n④ 특허심판원장은 심판청구 전에 제1항에 따른 증거보전신청이 있으면 그 신청에 관여할 심판관을 지정한다.\n⑤ 심판장은 제1항에 따라 직권으로 증거조사나 증거보전을 하였을 때에는 그 결과를 당사자, 참가인 또는 이해관\n계인에게 통지하고, 기간을 정하여 의견서를 제출할 수 있는 기회를 주어야 한다.\n[전문개정 2014. 6. 11.]"}, {"no": 158, "no_str": "제158조", "title": "심판의 진행", "body": "심판장은 당사자 또는 참가인이 법정기간 또는 지정기간에 절차를 밟지 아니하거나 제154조제\n4항에 따른 기일에 출석하지 아니하여도 심판을 진행할 수 있다.\n[전문개정 2014. 6. 11.]"}, {"no": 158, "no_str": "제158조의2", "title": "적시제출주의", "body": "심판절차에서의 주장이나 증거의 제출에 관하여는 「민사소송법」 제146조, 제147조 및 제\n149조를 준용한다.\n[본조신설 2021. 8. 17.]"}, {"no": 159, "no_str": "제159조", "title": "직권심리", "body": "① 심판에서는 당사자 또는 참가인이 신청하지 아니한 이유에 대해서도 심리할 수 있다. 이 경우 당\n사자 및 참가인에게 기간을 정하여 그 이유에 대하여 의견을 진술할 수 있는 기회를 주어야 한다.\n② 심판에서는 청구인이 신청하지 아니한 청구의 취지에 대해서는 심리할 수 없다.\n[전문개정 2014. 6. 11.]"}, {"no": 160, "no_str": "제160조", "title": "심리ㆍ심결의 병합 또는 분리", "body": "심판관은 당사자 양쪽 또는 어느 한쪽이 동일한 둘 이상의 심판에 대하여 심리\n또는 심결을 병합하거나 분리할 수 있다.\n[전문개정 2014. 6. 11.]"}, {"no": 161, "no_str": "제161조", "title": "심판청구의 취하", "body": "① 심판청구는 심결이 확정될 때까지 취하할 수 있다. 다만, 답변서가 제출된 후에는 상대방\n의 동의를 받아야 한다.\n② 둘 이상의 청구항에 관하여 제133조제1항의 무효심판 또는 제135조의 권리범위 확인심판을 청구하였을 때에는\n청구항마다 취하할 수 있다.\n③ 제1항 또는 제2항에 따른 취하가 있으면 그 심판청구 또는 그 청구항에 대한 심판청구는 처음부터 없었던 것으\n로 본다.\n[전문개정 2014. 6. 11.]"}, {"no": 162, "no_str": "제162조", "title": "심결", "body": "① 심판은 특별한 규정이 있는 경우를 제외하고는 심결로써 종결한다.\n② 제1항의 심결은 다음 각 호의 사항을 적은 서면으로 하여야 하며, 심결을 한 심판관은 그 서면에 기명날인하여야\n한다.\n1. 심판의 번호\n2. 당사자 및 참가인의 성명 및 주소(법인인 경우에는 그 명칭 및 영업소의 소재지)\n3. 대리인이 있는 경우에는 그 대리인의 성명 및 주소나 영업소의 소재지[대리인이 특허법인ㆍ특허법인(유한)인 경\n우에는 그 명칭, 사무소의 소재지 및 지정된 변리사의 성명]\n4. 심판사건의 표시\n5. 심결의 주문(제138조에 따른 심판의 경우에는 통상실시권의 범위ㆍ기간 및 대가를 포함한다)\n6. 심결의 이유(청구의 취지 및 그 이유의 요지를 포함한다)\n7. 심결연월일\n③ 심판장은 사건이 심결을 할 정도로 성숙하였을 때에는 심리의 종결을 당사자 및 참가인에게 통지하여야 한다.\n④ 심판장은 필요하다고 인정하면 제3항에 따라 심리종결을 통지한 후에도 당사자 또는 참가인의 신청에 의하여 또\n는 직권으로 심리를 재개할 수 있다.\n⑤ 심결은 제3항에 따른 심리종결통지를 한 날부터 20일 이내에 한다.\n⑥ 심판장은 심결 또는 결정이 있으면 그 등본을 당사자, 참가인 및 심판에 참가신청을 하였으나 그 신청이 거부된\n자에게 송달하여야 한다.\n[전문개정 2014. 6. 11.]"}, {"no": 163, "no_str": "제163조", "title": "일사부재리", "body": "이 법에 따른 심판의 심결이 확정되었을 때에는 그 사건에 대해서는 누구든지 동일 사실 및 동일\n증거에 의하여 다시 심판을 청구할 수 없다. 다만, 확정된 심결이 각하심결인 경우에는 그러하지 아니하다.\n[전문개정 2014. 6. 11.]"}, {"no": 164, "no_str": "제164조", "title": "소송과의 관계", "body": "① 심판장은 심판에서 필요하면 직권 또는 당사자의 신청에 따라 그 심판사건과 관련되는 특\n허취소신청에 대한 결정 또는 다른 심판의 심결이 확정되거나 소송절차가 완결될 때까지 그 절차를 중지할 수 있다.\n<개정 2016. 2. 29.>\n② 법원은 소송절차에서 필요하면 직권 또는 당사자의 신청에 따라 특허취소신청에 대한 결정이나 특허에 관한 심\n결이 확정될 때까지 그 소송절차를 중지할 수 있다.<개정 2016. 2. 29.>\n③ 법원은 특허권 또는 전용실시권의 침해에 관한 소가 제기된 경우에는 그 취지를 특허심판원장에게 통보하여야\n한다. 그 소송절차가 끝났을 때에도 또한 같다.\n④ 특허심판원장은 제3항에 따른 특허권 또는 전용실시권의 침해에 관한 소에 대응하여 그 특허권에 관한 무효심판\n등이 청구된 경우에는 그 취지를 제3항에 해당하는 법원에 통보하여야 한다. 그 심판청구서의 각하결정, 심결 또는\n청구의 취하가 있는 경우에도 또한 같다.\n[전문개정 2014. 6. 11.]"}, {"no": 164, "no_str": "제164조의2", "title": "조정위원회 회부", "body": "① 심판장은 심판사건을 합리적으로 해결하기 위하여 필요하다고 인정되면 당사자의 동\n의를 받아 해당 심판사건의 절차를 중지하고 결정으로 해당 사건을 조정위원회에 회부할 수 있다.\n② 심판장은 제1항에 따라 조정위원회에 회부한 때에는 해당 심판사건의 기록을 조정위원회에 송부하여야 한다.\n③ 심판장은 조정위원회의 조정절차가 조정 불성립으로 종료되면 제1항에 따른 중지 결정을 취소하고 심판을 재개\n하며, 조정이 성립된 경우에는 해당 심판청구는 취하된 것으로 본다.\n[본조신설 2021. 8. 17.]"}, {"no": 165, "no_str": "제165조", "title": "심판비용", "body": "① 제133조제1항, 제134조제1항ㆍ제2항, 제135조 및 제137조제1항의 심판비용의 부담은 심판이 심\n결에 의하여 종결될 때에는 그 심결로써 정하고, 심판이 심결에 의하지 아니하고 종결될 때에는 결정으로써 정하여\n야 한다.\n② 제1항의 심판비용에 관하여는 「민사소송법」 제98조부터 제103조까지, 제107조제1항ㆍ제2항, 제108조, 제111조\n, 제112조 및 제116조를 준용한다.\n③ 제132조의17, 제136조 또는 제138조에 따른 심판비용은 청구인이 부담한다.<개정 2016. 2. 29.>\n④ 제3항에 따라 청구인이 부담하는 비용에 관하여는 「민사소송법」 제102조를 준용한다.\n⑤ 심판비용액은 심결 또는 결정이 확정된 후 당사자의 청구에 따라 특허심판원장이 결정한다.\n⑥ 심판비용의 범위ㆍ금액ㆍ납부 및 심판에서 절차상의 행위를 하기 위하여 필요한 비용의 지급에 관하여는 그 성\n질에 반하지 아니하는 범위에서 「민사소송비용법」 중 해당 규정의 예에 따른다.\n⑦ 심판의 대리를 한 변리사에게 당사자가 지급하였거나 지급할 보수는 지식재산처장이 정하는 금액의 범위에서\n심판비용으로 본다. 이 경우 여러 명의 변리사가 심판의 대리를 한 경우라도 1명의 변리사가 심판대리를 한 것으로\n본다.<개정 2025. 10. 1.>\n[전문개정 2014. 6. 11.]"}, {"no": 166, "no_str": "제166조", "title": "심판비용액 또는 대가에 대한 집행권원", "body": "이 법에 따라 특허심판원장이 정한 심판비용액 또는 심판관이 정한\n대가에 관하여 확정된 결정은 집행력 있는 집행권원과 같은 효력을 가진다. 이 경우 집행력 있는 정본은 특허심판원\n소속 공무원이 부여한다.\n[전문개정 2014. 6. 11.]"}, {"no": 167, "no_str": "제167조", "title": "", "body": "삭제 <1995. 1. 5.>"}, {"no": 168, "no_str": "제168조", "title": "", "body": "삭제 <1995. 1. 5.>"}, {"no": 169, "no_str": "제169조", "title": "", "body": "삭제 <1995. 1. 5.>"}, {"no": 170, "no_str": "제170조", "title": "심사규정의 특허거절결정에 대한 심판에의 준용", "body": "① 특허거절결정에 대한 심판에 관하여는 제47조제1항제1호\nㆍ제2호, 같은 조 제4항, 제51조, 제63조, 제63조의2 및 제66조를 준용한다. 이 경우 제51조제1항 본문 중 “제47조제\n1항제2호 및 제3호에 따른 보정”은 “제47조제1항제2호에 따른 보정(제132조의17의 특허거절결정에 대한 심판청구\n전에 한 것은 제외한다)”으로, 제63조의2 본문 중 “지식재산처장”은 “특허심판원장”으로 본다. <개정 2016. 2. 29.,\n2025. 10. 1.>\n② 제1항에 따라 준용되는 제63조는 특허거절결정의 이유와 다른 거절이유를 발견한 경우에만 적용한다.\n[전문개정 2014. 6. 11.]"}, {"no": 171, "no_str": "제171조", "title": "특허거절결정에 대한 심판의 특칙", "body": "특허거절결정 또는 특허권의 존속기간의 연장등록거절결정에 대한 심판에\n는 제147조제1항ㆍ제2항, 제155조 및 제156조를 적용하지 아니한다.\n[전문개정 2009. 1. 30.]"}, {"no": 172, "no_str": "제172조", "title": "심사의 효력", "body": "심사에서 밟은 특허에 관한 절차는 특허거절결정 또는 특허권의 존속기간의 연장등록거절결정\n에 대한 심판에서도 그 효력이 있다.\n[전문개정 2014. 6. 11.]"}, {"no": 173, "no_str": "제173조", "title": "", "body": "삭제 <2009. 1. 30.>"}, {"no": 174, "no_str": "제174조", "title": "", "body": "삭제 <2009. 1. 30.>"}, {"no": 175, "no_str": "제175조", "title": "", "body": "삭제 <2009. 1. 30.>"}, {"no": 176, "no_str": "제176조", "title": "특허거절결정 등의 취소", "body": "① 심판관은 제132조의17에 따른 심판이 청구된 경우에 그 청구가 이유 있다고 인정\n할 때에는 심결로써 특허거절결정 또는 특허권의 존속기간의 연장등록거절결정을 취소하여야 한다. <개정 2016. 2.\n29.>\n② 심판에서 제1항에 따라 특허거절결정 또는 특허권의 존속기간의 연장등록거절결정을 취소할 경우에는 심사에\n부칠 것이라는 심결을 할 수 있다.\n③ 제1항 및 제2항에 따른 심결에서 취소의 기본이 된 이유는 그 사건에 대하여 심사관을 기속한다.\n[전문개정 2014. 6. 11.]"}, {"no": 177, "no_str": "제177조", "title": "", "body": "삭제 <1995. 1. 5.>"}, {"no": 178, "no_str": "제178조", "title": "재심의 청구", "body": "① 당사자는 확정된 특허취소결정 또는 확정된 심결에 대하여 재심을 청구할 수 있다. <개정\n2016. 2. 29.>\n② 제1항의 재심청구에 관하여는 「민사소송법」 제451조 및 제453조를 준용한다.\n[전문개정 2014. 6. 11.]"}, {"no": 179, "no_str": "제179조", "title": "제3자에 의한 재심청구", "body": "① 심판의 당사자가 공모하여 제3자의 권리나 이익을 사해(詐害)할 목적으로 심결을\n하게 하였을 때에는 제3자는 그 확정된 심결에 대하여 재심을 청구할 수 있다.\n② 제1항의 재심청구의 경우에는 심판의 당사자를 공동피청구인으로 한다.\n[전문개정 2014. 6. 11.]"}, {"no": 180, "no_str": "제180조", "title": "재심청구의 기간", "body": "① 당사자는 특허취소결정 또는 심결 확정 후 재심사유를 안 날부터 30일 이내에 재심을 청\n구하여야 한다. <개정 2016. 2. 29.>\n② 대리권의 흠을 이유로 재심을 청구하는 경우에 제1항의 기간은 청구인 또는 법정대리인이 특허취소결정등본 또\n는 심결등본의 송달에 의하여 특허취소결정 또는 심결이 있는 것을 안 날의 다음 날부터 기산한다.<개정 2016. 2.\n29.>\n③ 특허취소결정 또는 심결 확정 후 3년이 지나면 재심을 청구할 수 없다.<개정 2016. 2. 29.>\n④ 재심사유가 특허취소결정 또는 심결 확정 후에 생겼을 때에는 제3항의 기간은 그 사유가 발생한 날의 다음 날부\n터 기산한다.<개정 2016. 2. 29.>\n⑤ 제1항 및 제3항은 해당 심결 이전의 확정심결에 저촉된다는 이유로 재심을 청구하는 경우에는 적용하지 아니한\n다.\n[전문개정 2014. 6. 11.]"}, {"no": 181, "no_str": "제181조", "title": "재심에 의하여 회복된 특허권의 효력 제한", "body": "① 다음 각 호의 어느 하나에 해당하는 경우에 특허권의 효력은 해\n당 특허취소결정 또는 심결이 확정된 후 재심청구 등록 전에 선의로 수출 또는 수입하거나 국내에서 생산 또는 취득\n한 물건에는 미치지 아니한다. <개정 2016. 2. 29., 2025. 1. 21.>\n1. 무효가 된 특허권(존속기간이 연장등록된 특허권을 포함한다)이 재심에 의하여 회복된 경우\n2. 특허권의 권리범위에 속하지 아니한다는 심결이 확정된 후 재심에 의하여 그 심결과 상반되는 심결이 확정된 경\n우\n3. 거절한다는 취지의 심결이 있었던 특허출원 또는 특허권의 존속기간의 연장등록출원이 재심에 의하여 특허권의\n설정등록 또는 특허권의 존속기간의 연장등록이 된 경우\n4. 취소된 특허권이 재심에 의하여 회복된 경우\n② 제1항 각 호의 어느 하나에 해당하는 경우의 특허권의 효력은 다음 각 호의 어느 하나의 행위에 미치지 아니한\n다.<개정 2016. 2. 29., 2025. 1. 21.>\n1. 해당 특허취소결정 또는 심결이 확정된 후 재심청구 등록 전에 한 해당 발명의 선의의 실시\n2. 특허가 물건의 발명인 경우에는 그 물건의 생산에만 사용하는 물건을 해당 특허취소결정 또는 심결이 확정된 후\n재심청구 등록 전에 선의로 생산ㆍ양도ㆍ대여ㆍ수출 또는 수입하거나 양도 또는 대여의 청약을 하는 행위\n3. 특허가 방법의 발명인 경우에는 그 방법의 실시에만 사용하는 물건을 해당 특허취소결정 또는 심결이 확정된 후\n재심청구 등록 전에 선의로 생산ㆍ양도ㆍ대여ㆍ수출 또는 수입하거나 양도 또는 대여를 청약하는 행위\n[전문개정 2014. 6. 11.]"}, {"no": 182, "no_str": "제182조", "title": "재심에 의하여 회복한 특허권에 대한 선사용자의 통상실시권", "body": "제181조제1항 각 호의 어느 하나에 해당하는 경\n우에 해당 특허취소결정 또는 심결이 확정된 후 재심청구 등록 전에 국내에서 선의로 그 발명의 실시사업을 하고 있\n는 자 또는 그 사업을 준비하고 있는 자는 실시하고 있거나 준비하고 있는 발명 및 사업목적의 범위에서 그 특허권\n에 관하여 통상실시권을 가진다. <개정 2016. 2. 29.>\n[전문개정 2014. 6. 11.]"}, {"no": 183, "no_str": "제183조", "title": "재심에 의하여 통상실시권을 상실한 원권리자의 통상실시권", "body": "① 제138조제1항 또는 제3항에 따라 통상실시권\n을 허락한다는 심결이 확정된 후 재심에서 그 심결과 상반되는 심결이 확정된 경우에는 재심청구 등록 전에 선의로\n국내에서 그 발명의 실시사업을 하고 있는 자 또는 그 사업을 준비하고 있는 자는 원(原)통상실시권의 사업목적 및\n발명의 범위에서 그 특허권 또는 재심의 심결이 확정된 당시에 존재하는 전용실시권에 대하여 통상실시권을 가진다.\n② 제1항에 따라 통상실시권을 가진 자는 특허권자 또는 전용실시권자에게 상당한 대가를 지급하여야 한다.\n[전문개정 2014. 6. 11.]"}, {"no": 184, "no_str": "제184조", "title": "재심에서의 심판규정 등의 준용", "body": "특허취소결정 또는 심판에 대한 재심의 절차에 관하여는 그 성질에 반하지\n아니하는 범위에서 특허취소신청 또는 심판의 절차에 관한 규정을 준용한다. <개정 2016. 2. 29.>\n[전문개정 2014. 6. 11.]\n[제목개정 2016. 2. 29.]"}, {"no": 185, "no_str": "제185조", "title": "「민사소송법」의 준용", "body": "재심청구에 관하여는 「민사소송법」 제459조제1항을 준용한다.\n[전문개정 2014. 6. 11.]"}, {"no": 186, "no_str": "제186조", "title": "심결 등에 대한 소", "body": "① 특허취소결정 또는 심결에 대한 소 및 특허취소신청서ㆍ심판청구서ㆍ재심청구서의 각\n하결정에 대한 소는 특허법원의 전속관할로 한다. <개정 2016. 2. 29.>\n② 제1항에 따른 소는 다음 각 호의 자만 제기할 수 있다.<개정 2016. 2. 29.>\n1. 당사자\n2. 참가인\n3. 해당 특허취소신청의 심리, 심판 또는 재심에 참가신청을 하였으나 신청이 거부된 자\n③ 제1항에 따른 소는 심결 또는 결정의 등본을 송달받은 날부터 30일 이내에 제기하여야 한다.\n④ 제3항의 기간은 불변기간으로 한다.\n⑤ 심판장은 주소 또는 거소가 멀리 떨어진 곳에 있거나 교통이 불편한 지역에 있는 자를 위하여 직권으로 제4항의\n불변기간에 대하여 부가기간을 정할 수 있다.\n⑥ 특허취소를 신청할 수 있는 사항 또는 심판을 청구할 수 있는 사항에 관한 소는 특허취소결정이나 심결에 대한\n것이 아니면 제기할 수 없다.<개정 2016. 2. 29.>\n⑦ 제162조제2항제5호에 따른 대가의 심결 및 제165조제1항에 따른 심판비용의 심결 또는 결정에 대해서는 독립\n하여 제1항에 따른 소를 제기할 수 없다.\n⑧ 제1항에 따른 특허법원의 판결에 대해서는 대법원에 상고할 수 있다.\n[전문개정 2014. 6. 11.]"}, {"no": 187, "no_str": "제187조", "title": "피고적격", "body": "제186조제1항에 따라 소를 제기하는 경우에는 지식재산처장을 피고로 하여야 한다. 다만, 제133조\n제1항, 제134조제1항ㆍ제2항, 제135조제1항ㆍ제2항, 제137조제1항 또는 제138조제1항ㆍ제3항에 따른 심판 또는 그\n재심의 심결에 대한 소를 제기하는 경우에는 그 청구인 또는 피청구인을 피고로 하여야 한다. <개정 2016. 2. 29.,\n2025. 10. 1.>\n[전문개정 2014. 6. 11.]"}, {"no": 188, "no_str": "제188조", "title": "소 제기 통지 및 재판서 정본 송부", "body": "① 법원은 제186조제1항에 따른 소 또는 같은 조 제8항에 따른 상고가 제\n기되었을 때에는 지체 없이 그 취지를 특허심판원장에게 통지하여야 한다.\n② 법원은 제187조 단서에 따른 소에 관하여 소송절차가 완결되었을 때에는 지체 없이 그 사건에 대한 각 심급(審\n級)의 재판서 정본을 특허심판원장에게 보내야 한다.\n[전문개정 2014. 6. 11.]"}, {"no": 188, "no_str": "제188조의2", "title": "기술심리관의 제척ㆍ기피ㆍ회피", "body": "① 「법원조직법」 제54조의2에 따른 기술심리관의 제척ㆍ기피에 관하여\n는 제148조, 「민사소송법」 제42조부터 제45조까지, 제47조 및 제48조를 준용한다.\n② 제1항에 따른 기술심리관에 대한 제척ㆍ기피의 재판은 그 소속 법원이 결정으로 하여야 한다.\n③ 기술심리관은 제척 또는 기피의 사유가 있다고 인정하면 특허법원장의 허가를 받아 회피할 수 있다.\n[전문개정 2014. 6. 11.]"}, {"no": 189, "no_str": "제189조", "title": "심결 또는 결정의 취소", "body": "① 법원은 제186조제1항에 따라 소가 제기된 경우에 그 청구가 이유 있다고 인정할 때\n에는 판결로써 해당 심결 또는 결정을 취소하여야 한다.\n② 심판관은 제1항에 따라 심결 또는 결정의 취소판결이 확정되었을 때에는 다시 심리를 하여 심결 또는 결정을 하\n여야 한다.\n③ 제1항에 따른 판결에서 취소의 기본이 된 이유는 그 사건에 대하여 특허심판원을 기속한다.\n[전문개정 2014. 6. 11.]"}, {"no": 190, "no_str": "제190조", "title": "보상금 또는 대가에 관한 불복의 소", "body": "① 제41조제3항ㆍ제4항, 제106조제3항, 제106조의2제3항, 제110조제2항\n제2호 및 제138조제4항에 따른 보상금 및 대가에 대하여 심결ㆍ결정 또는 재정을 받은 자가 그 보상금 또는 대가에\n불복할 때에는 법원에 소송을 제기할 수 있다.\n② 제1항에 따른 소송은 심결ㆍ결정 또는 재정의 등본을 송달받은 날부터 30일 이내에 제기하여야 한다.\n③ 제2항에 따른 기간은 불변기간으로 한다.\n[전문개정 2014. 6. 11.]"}, {"no": 191, "no_str": "제191조", "title": "보상금 또는 대가에 관한 소송에서의 피고", "body": "제190조에 따른 소송에서는 다음 각 호의 어느 하나에 해당하는\n자를 피고로 하여야 한다.\n1. 제41조제3항 및 제4항에 따른 보상금에 대해서는 보상금을 지급하여야 하는 중앙행정기관의 장 또는 출원인\n2. 제106조제3항 및 제106조의2제3항에 따른 보상금에 대해서는 보상금을 지급하여야 하는 중앙행정기관의 장, 특\n허권자, 전용실시권자 또는 통상실시권자\n3. 제110조제2항제2호 및 제138조제4항에 따른 대가에 대해서는 통상실시권자ㆍ전용실시권자ㆍ특허권자ㆍ실용신\n안권자 또는 디자인권자\n[전문개정 2014. 6. 11.]"}, {"no": 191, "no_str": "제191조의2", "title": "변리사의 보수와 소송비용", "body": "소송을 대리한 변리사의 보수에 관하여는 「민사소송법」 제109조를 준용한다.\n이 경우 “변호사”는 “변리사”로 본다.\n[전문개정 2014. 6. 11.]"}, {"no": 192, "no_str": "제192조", "title": "국제출원을 할 수 있는 자", "body": "지식재산처장에게 국제출원을 할 수 있는 자는 다음 각 호의 어느 하나에 해당하는\n자로 한다. <개정 2025. 10. 1.>\n1. 대한민국 국민\n2. 국내에 주소 또는 영업소를 가진 외국인\n3. 제1호 또는 제2호에 해당하는 자가 아닌 자로서 제1호 또는 제2호에 해당하는 자를 대표자로 하여 국제출원을\n하는 자\n4. 총리령으로 정하는 요건에 해당하는 자\n[전문개정 2014. 6. 11.]"}, {"no": 193, "no_str": "제193조", "title": "국제출원", "body": "① 국제출원을 하려는 자는 총리령으로 정하는 언어로 작성한 출원서와 발명의 설명ㆍ청구범위ㆍ\n필요한 도면 및 요약서를 지식재산처장에게 제출하여야 한다. <개정 2025. 10. 1.>\n② 제1항의 출원서에는 다음 각 호의 사항을 적어야 한다.\n1. 해당 출원이 「특허협력조약」에 따른 국제출원이라는 표시\n2. 해당 출원된 발명의 보호가 필요한 「특허협력조약」 체약국(締約國)의 지정\n3. 제2호에 따라 지정된 체약국(이하 “지정국”이라 한다) 중 「특허협력조약」 제2조(iv)의 지역특허를 받으려는 경우\n에는 그 취지\n4. 출원인의 성명이나 명칭ㆍ주소나 영업소 및 국적\n5. 대리인이 있으면 그 대리인의 성명 및 주소나 영업소\n6. 발명의 명칭\n7. 발명자의 성명 및 주소(지정국의 법령에서 발명자에 관한 사항을 적도록 규정되어 있는 경우만 해당한다)\n③ 제1항의 발명의 설명은 그 발명이 속하는 기술분야에서 통상의 지식을 가진 사람이 쉽게 실시할 수 있도록 명확\n하고 상세하게 적어야 한다.\n④ 제1항의 청구범위는 보호를 받으려는 사항을 명확하고 간결하게 적어야 하며, 발명의 설명에 의하여 충분히 뒷\n받침되어야 한다.\n⑤ 제1항부터 제4항까지에서 규정한 사항 외에 국제출원에 관하여 필요한 사항은 총리령으로 정한다.<개정 2025.\n10. 1.>\n[전문개정 2014. 6. 11.]"}, {"no": 194, "no_str": "제194조", "title": "국제출원일의 인정 등", "body": "① 지식재산처장은 국제출원이 지식재산처에 도달한 날을 「특허협력조약」 제11조의\n국제출원일(이하 “국제출원일”이라 한다)로 인정하여야 한다. 다만, 다음 각 호의 어느 하나에 해당하는 경우에는 그\n러하지 아니하다. <개정 2025. 10. 1.>\n1. 출원인이 제192조 각 호의 어느 하나에 해당하지 아니하는 경우\n2. 제193조제1항에 따른 언어로 작성되지 아니한 경우\n3. 제193조제1항에 따른 발명의 설명 또는 청구범위가 제출되지 아니한 경우\n4. 제193조제2항제1호ㆍ제2호에 따른 사항 및 출원인의 성명이나 명칭을 적지 아니한 경우\n② 지식재산처장은 국제출원이 제1항 각 호의 어느 하나에 해당하는 경우에는 기간을 정하여 서면으로 절차를 보완\n할 것을 명하여야 한다.<개정 2025. 10. 1.>\n③ 지식재산처장은 국제출원이 도면에 관하여 적고 있으나 그 출원에 도면이 포함되어 있지 아니하면 그 취지를 출\n원인에게 통지하여야 한다.<개정 2025. 10. 1.>\n④ 지식재산처장은 제2항에 따른 절차의 보완명령을 받은 자가 지정된 기간에 보완을 한 경우에는 그 보완에 관계\n되는 서면의 도달일을, 제3항에 따른 통지를 받은 자가 총리령으로 정하는 기간에 도면을 제출한 경우에는 그 도면\n의 도달일을 국제출원일로 인정하여야 한다. 다만, 제3항에 따른 통지를 받은 자가 총리령으로 정하는 기간에 도면\n을 제출하지 아니한 경우에는 그 도면에 관한 기재는 없는 것으로 본다.<개정 2025. 10. 1.>\n[전문개정 2014. 6. 11.]"}, {"no": 195, "no_str": "제195조", "title": "보정명령", "body": "지식재산처장은 국제출원이 다음 각 호의 어느 하나에 해당하는 경우에는 기간을 정하여 보정을 명\n하여야 한다. <개정 2025. 10. 1.>\n1. 발명의 명칭이 적혀 있지 아니한 경우\n2. 요약서가 제출되지 아니한 경우\n3. 제3조 또는 제197조제3항을 위반한 경우\n4. 총리령으로 정하는 방식을 위반한 경우\n[전문개정 2014. 6. 11.]"}, {"no": 196, "no_str": "제196조", "title": "취하된 것으로 보는 국제출원 등", "body": "① 다음 각 호의 어느 하나에 해당하는 국제출원은 취하된 것으로 본다. <개\n정 2025. 10. 1.>\n1. 제195조에 따른 보정명령을 받은 자가 지정된 기간에 보정을 하지 아니한 경우\n2. 국제출원에 관한 수수료를 총리령으로 정하는 기간에 내지 아니하여 「특허협력조약」 제14조(3)(a)에 해당하게\n된 경우\n3. 제194조에 따라 국제출원일이 인정된 국제출원에 관하여 총리령으로 정하는 기간에 그 국제출원이 제194조제\n1항 각 호의 어느 하나에 해당하는 것이 발견된 경우\n② 국제출원에 관하여 내야 할 수수료의 일부를 총리령으로 정하는 기간에 내지 아니하여 「특허협력조약」 제14조\n(3)(b)에 해당하게 된 경우에는 수수료를 내지 아니한 지정국의 지정은 취하된 것으로 본다.<개정 2025. 10. 1.>\n③ 지식재산처장은 제1항 및 제2항에 따라 국제출원 또는 지정국의 일부가 취하된 것으로 보는 경우에는 그 사실을\n출원인에게 알려야 한다.<개정 2025. 10. 1.>\n[전문개정 2014. 6. 11.]"}, {"no": 197, "no_str": "제197조", "title": "대표자 등", "body": "① 2인 이상이 공동으로 국제출원을 하는 경우에 제192조부터 제196조까지 및 제198조에 따른 절\n차는 출원인의 대표자가 밟을 수 있다.\n② 2인 이상이 공동으로 국제출원을 하는 경우에 출원인이 대표자를 정하지 아니한 경우에는 총리령으로 정하는 방\n법에 따라 대표자를 정할 수 있다.<개정 2025. 10. 1.>\n③ 제1항의 절차를 대리인에 의하여 밟으려는 자는 제3조에 따른 법정대리인을 제외하고는 변리사를 대리인으로\n하여야 한다.\n[전문개정 2014. 6. 11.]"}, {"no": 198, "no_str": "제198조", "title": "수수료", "body": "① 국제출원을 하려는 자는 수수료를 내야 한다.\n② 제1항에 따른 수수료, 그 납부방법 및 납부기간 등에 관하여 필요한 사항은 총리령으로 정한다.<개정 2025. 10.\n1.>\n[전문개정 2014. 6. 11.]"}, {"no": 198, "no_str": "제198조의2", "title": "국제조사 및 국제예비심사", "body": "① 지식재산처는 「특허협력조약」 제2조(xix)의 국제사무국(이하 “국제사무국\n”이라 한다)과 체결하는 협정에 따라 국제출원에 대한 국제조사기관 및 국제예비심사기관으로서의 업무를 수행한다.\n<개정 2025. 10. 1.>\n② 제1항에 따른 업무수행에 필요한 사항은 총리령으로 정한다.<개정 2025. 10. 1.>\n[전문개정 2014. 6. 11.]"}, {"no": 199, "no_str": "제199조", "title": "국제출원에 의한 특허출원", "body": "① 「특허협력조약」에 따라 국제출원일이 인정된 국제출원으로서 특허를 받기 위\n하여 대한민국을 지정국으로 지정한 국제출원은 그 국제출원일에 출원된 특허출원으로 본다.\n② 제1항에 따라 특허출원으로 보는 국제출원(이하 “국제특허출원”이라 한다)에 관하여는 제42조의2, 제42조의3 및\n제54조를 적용하지 아니한다.\n[전문개정 2014. 6. 11.]"}, {"no": 200, "no_str": "제200조", "title": "공지 등이 되지 아니한 발명으로 보는 경우의 특례", "body": "국제특허출원된 발명에 관하여 제30조제1항제1호를 적용\n받으려는 자는 그 취지를 적은 서면 및 이를 증명할 수 있는 서류를 같은 조 제2항에도 불구하고 총리령으로 정하는\n기간에 지식재산처장에게 제출할 수 있다. <개정 2025. 10. 1.>\n[전문개정 2014. 6. 11.]"}, {"no": 200, "no_str": "제200조의2", "title": "국제특허출원의 출원서 등", "body": "① 국제특허출원의 국제출원일까지 제출된 출원서는 제42조제1항에 따라 제출\n된 특허출원서로 본다.\n② 국제특허출원의 국제출원일까지 제출된 발명의 설명, 청구범위 및 도면은 제42조제2항에 따른 특허출원서에 최\n초로 첨부된 명세서 및 도면으로 본다.\n③ 국제특허출원에 대해서는 다음 각 호의 구분에 따른 요약서 또는 국어번역문을 제42조제2항에 따른 요약서로\n본다.\n1. 국제특허출원의 요약서를 국어로 적은 경우: 국제특허출원의 요약서\n2. 국제특허출원의 요약서를 외국어로 적은 경우: 제201조제1항에 따라 제출된 국제특허출원의 요약서의 국어번역\n문(제201조제3항 본문에 따라 새로운 국어번역문을 제출한 경우에는 마지막에 제출한 국제특허출원의 요약서의\n국어번역문을 말한다)\n[본조신설 2014. 6. 11.]"}, {"no": 201, "no_str": "제201조", "title": "국제특허출원의 국어번역문", "body": "① 국제특허출원을 외국어로 출원한 출원인은 「특허협력조약」 제2조(xi)의 우선\n일(이하 “우선일”이라 한다)부터 2년 7개월(이하 “국내서면제출기간”이라 한다) 이내에 다음 각 호의 국어번역문을\n지식재산처장에게 제출하여야 한다. 다만, 국어번역문의 제출기간을 연장하여 달라는 취지를 제203조제1항에 따른\n서면에 적어 국내서면제출기간 만료일 전 1개월부터 그 만료일까지 제출한 경우(그 서면을 제출하기 전에 국어번역\n문을 제출한 경우는 제외한다)에는 국내서면제출기간 만료일부터 1개월이 되는 날까지 국어번역문을 제출할 수 있\n다. <개정 2025. 10. 1.>\n1. 국제출원일까지 제출한 발명의 설명, 청구범위 및 도면(도면 중 설명부분에 한정한다)의 국어번역문\n2. 국제특허출원의 요약서의 국어번역문\n② 제1항에도 불구하고 국제특허출원을 외국어로 출원한 출원인이 「특허협력조약」 제19조(1)에 따라 청구범위에\n관한 보정을 한 경우에는 국제출원일까지 제출한 청구범위에 대한 국어번역문을 보정 후의 청구범위에 대한 국어\n번역문으로 대체하여 제출할 수 있다.\n③ 제1항에 따라 국어번역문을 제출한 출원인은 국내서면제출기간(제1항 단서에 따라 취지를 적은 서면이 제출된\n경우에는 연장된 국어번역문 제출 기간을 말한다. 이하 이 조에서 같다)에 그 국어번역문을 갈음하여 새로운 국어번\n역문을 제출할 수 있다. 다만, 출원인이 출원심사의 청구를 한 후에는 그러하지 아니하다.\n④ 제1항에 따른 출원인이 국내서면제출기간에 제1항에 따른 발명의 설명 및 청구범위의 국어번역문을 제출하지\n아니하면 그 국제특허출원을 취하한 것으로 본다.\n⑤ 특허출원인이 국내서면제출기간의 만료일(국내서면제출기간에 출원인이 출원심사의 청구를 한 경우에는 그 청\n구일을 말하며, 이하 “기준일”이라 한다)까지 제1항에 따라 발명의 설명, 청구범위 및 도면(도면 중 설명부분에 한정\n한다)의 국어번역문(제3항 본문에 따라 새로운 국어번역문을 제출한 경우에는 마지막에 제출한 국어번역문을 말한\n다. 이하 이 조에서 “최종 국어번역문”이라 한다)을 제출한 경우에는 국제출원일까지 제출한 발명의 설명, 청구범위\n및 도면(도면 중 설명부분에 한정한다)을 최종 국어번역문에 따라 국제출원일에 제47조제1항에 따른 보정을 한 것\n으로 본다.\n⑥ 특허출원인은 제47조제1항 및 제208조제1항에 따라 보정을 할 수 있는 기간에 최종 국어번역문의 잘못된 번역\n을 총리령으로 정하는 방법에 따라 정정할 수 있다. 이 경우 정정된 국어번역문에 관하여는 제5항을 적용하지 아니\n한다.<개정 2025. 10. 1.>\n⑦ 제6항 전단에 따라 제47조제1항제1호 또는 제2호에 따른 기간에 정정을 하는 경우에는 마지막 정정 전에 한 모\n든 정정은 처음부터 없었던 것으로 본다.<신설 2016. 2. 29.>\n⑧ 제2항에 따라 보정 후의 청구범위에 대한 국어번역문을 제출하는 경우에는 제204조제1항 및 제2항을 적용하지\n아니한다.<개정 2016. 2. 29.>\n[전문개정 2014. 6. 11.]"}, {"no": 202, "no_str": "제202조", "title": "특허출원 등에 의한 우선권 주장의 특례", "body": "① 국제특허출원에 관하여는 제55조제2항 및 제56조제2항을 적용하\n지 아니한다.\n② 제55조제4항을 적용할 때 우선권 주장을 수반하는 특허출원이 국제특허출원인 경우에는 같은 항 중 “특허출원\n의 출원서에 최초로 첨부된 명세서 또는 도면”은 “국제출원일까지 제출된 발명의 설명, 청구범위 또는 도면”으로,\n“출원공개되거나”는 “출원공개 또는 「특허협력조약」 제21조에 따라 국제공개되거나”로 본다. 다만, 그 국제특허출\n원이 제201조제4항에 따라 취하한 것으로 보는 경우에는 제55조제4항을 적용하지 아니한다.\n③ 제55조제1항, 같은 조 제3항부터 제5항까지 및 제56조제1항을 적용할 때 선출원이 국제특허출원 또는 「실용신\n안법」 제34조제2항에 따른 국제실용신안등록출원인 경우에는 다음 각 호에 따른다.\n1. 제55조제1항 각 호 외의 부분 본문, 같은 조 제3항 및 제5항 각 호 외의 부분 중 “출원서에 최초로 첨부된 명세서\n또는 도면”은 다음 각 목의 구분에 따른 것으로 본다.\n가. 선출원이 국제특허출원인 경우: “국제출원일까지 제출된 국제출원의 발명의 설명, 청구범위 또는 도면”\n나. 선출원이 「실용신안법」 제34조제2항에 따른 국제실용신안등록출원인 경우: “국제출원일까지 제출된 국제출\n원의 고안의 설명, 청구범위 또는 도면”\n2. 제55조제4항 중 “선출원의 출원서에 최초로 첨부된 명세서 또는 도면”은 다음 각 목의 구분에 따른 것으로 보고,\n“선출원에 관하여 출원공개”는 “선출원에 관하여 출원공개 또는 「특허협력조약」 제21조에 따른 국제공개”로 본\n다.\n가. 선출원이 국제특허출원인 경우: “선출원의 국제출원일까지 제출된 국제출원의 발명의 설명, 청구범위 또는 도\n면”\n나. 선출원이 「실용신안법」 제34조제2항에 따른 국제실용신안등록출원인 경우: “선출원의 국제출원일까지 제출\n된 국제출원의 고안의 설명, 청구범위 또는 도면”\n3. 제56조제1항 각 호 외의 부분 본문 중 “그 출원일부터 1년 3개월이 지난 때”는 “국제출원일부터 1년 3개월이 지\n난 때 또는 제201조제5항이나 「실용신안법」 제35조제5항에 따른 기준일 중 늦은 때”로 본다.\n④ 제55조제1항, 같은 조 제3항부터 제5항까지 및 제56조제1항을 적용할 때 제55조제1항에 따른 선출원이 제214조\n제4항 또는 「실용신안법」 제40조제4항에 따라 특허출원 또는 실용신안등록출원으로 되는 국제출원인 경우에는 다\n음 각 호에 따른다.\n1. 제55조제1항 각 호 외의 부분 본문, 같은 조 제3항 및 제5항 각 호 외의 부분 중 “출원서에 최초로 첨부된 명세서\n또는 도면”은 다음 각 목의 구분에 따른 것으로 본다.\n가. 선출원이 제214조제4항에 따라 특허출원으로 되는 국제출원인 경우: “제214조제4항에 따라 국제출원일로 인\n정할 수 있었던 날의 국제출원의 발명의 설명, 청구범위 또는 도면”\n나. 선출원이 「실용신안법」 제40조제4항에 따라 실용신안등록출원으로 되는 국제출원인 경우: “「실용신안법」 제\n40조제4항에 따라 국제출원일로 인정할 수 있었던 날의 국제출원의 고안의 설명, 청구범위 또는 도면”\n2. 제55조제4항 중 “선출원의 출원서에 최초로 첨부된 명세서 또는 도면”은 다음 각 목의 구분에 따른 것으로 본다.\n가. 선출원이 제214조제4항에 따라 특허출원으로 되는 국제출원인 경우: “제214조제4항에 따라 국제출원일로 인\n정할 수 있었던 날의 선출원의 국제출원의 발명의 설명, 청구범위 또는 도면”\n나. 선출원이 「실용신안법」 제40조제4항에 따라 실용신안등록출원으로 되는 국제출원인 경우: “「실용신안법」 제\n40조제4항에 따라 국제출원일로 인정할 수 있었던 날의 선출원의 국제출원의 고안의 설명, 청구범위 또는 도\n면”\n3. 제56조제1항 각 호 외의 부분 본문 중 “그 출원일부터 1년 3개월이 지난 때”는 “제214조제4항 또는 「실용신안법\n」 제40조제4항에 따라 국제출원일로 인정할 수 있었던 날부터 1년 3개월이 지난 때 또는 제214조제4항이나 「실\n용신안법」 제40조제4항에 따른 결정을 한 때 중 늦은 때”로 본다.\n[전문개정 2014. 6. 11.]"}, {"no": 203, "no_str": "제203조", "title": "서면의 제출", "body": "① 국제특허출원의 출원인은 국내서면제출기간에 다음 각 호의 사항을 적은 서면을 지식재산처\n장에게 제출하여야 한다. 이 경우 국제특허출원을 외국어로 출원한 출원인은 제201조제1항에 따른 국어번역문을 함\n께 제출하여야 한다. <개정 2025. 10. 1.>\n1. 출원인의 성명 및 주소(법인인 경우에는 그 명칭 및 영업소의 소재지)\n2. 출원인의 대리인이 있는 경우에는 그 대리인의 성명 및 주소나 영업소의 소재지[대리인이 특허법인ㆍ특허법인\n(유한)인 경우에는 그 명칭, 사무소의 소재지 및 지정된 변리사의 성명]\n3. 발명의 명칭\n4. 발명자의 성명 및 주소\n5. 국제출원일 및 국제출원번호\n② 제1항 후단에도 불구하고 제201조제1항 단서에 따라 국어번역문의 제출기간을 연장하여 달라는 취지를 적어 제\n1항 전단에 따른 서면을 제출하는 경우에는 국어번역문을 함께 제출하지 아니할 수 있다.\n③ 지식재산처장은 다음 각 호의 어느 하나에 해당하는 경우에는 보정기간을 정하여 보정을 명하여야 한다.<개정\n2025. 10. 1.>\n1. 제1항 전단에 따른 서면을 국내서면제출기간에 제출하지 아니한 경우\n2. 제1항 전단에 따라 제출된 서면이 이 법 또는 이 법에 따른 명령으로 정하는 방식에 위반되는 경우\n④ 제3항에 따른 보정명령을 받은 자가 지정된 기간에 보정을 하지 아니하면 지식재산처장은 해당 국제특허출원을\n무효로 할 수 있다.<개정 2025. 10. 1.>\n[전문개정 2014. 6. 11.]"}, {"no": 204, "no_str": "제204조", "title": "국제조사보고서를 받은 후의 보정", "body": "① 국제특허출원의 출원인은 「특허협력조약」 제19조(1)에 따라 국제조사\n보고서를 받은 후에 국제특허출원의 청구범위에 관하여 보정을 한 경우 기준일까지(기준일이 출원심사의 청구일인\n경우 출원심사의 청구를 한 때까지를 말한다. 이하 이 조 및 제205조에서 같다) 다음 각 호의 구분에 따른 서류를 지\n식재산처장에게 제출하여야 한다. <개정 2025. 10. 1.>\n1. 외국어로 출원한 국제특허출원인 경우: 그 보정서의 국어번역문\n2. 국어로 출원한 국제특허출원인 경우: 그 보정서의 사본\n② 제1항에 따라 보정서의 국어번역문 또는 사본이 제출되었을 때에는 그 보정서의 국어번역문 또는 사본에 따라\n제47조제1항에 따른 청구범위가 보정된 것으로 본다. 다만, 「특허협력조약」 제20조에 따라 기준일까지 그 보정서\n(국어로 출원한 국제특허출원인 경우에 한정한다)가 지식재산처에 송달된 경우에는 그 보정서에 따라 보정된 것으\n로 본다.<개정 2025. 10. 1.>\n③ 국제특허출원의 출원인은 「특허협력조약」 제19조(1)에 따른 설명서를 국제사무국에 제출한 경우 다음 각 호의\n구분에 따른 서류를 기준일까지 지식재산처장에게 제출하여야 한다.<개정 2025. 10. 1.>\n1. 외국어로 출원한 국제특허출원인 경우: 그 설명서의 국어번역문\n2. 국어로 출원한 국제특허출원인 경우: 그 설명서의 사본\n④ 국제특허출원의 출원인이 기준일까지 제1항 또는 제3항에 따른 절차를 밟지 아니하면 「특허협력조약」 제19조\n(1)에 따른 보정서 또는 설명서는 제출되지 아니한 것으로 본다. 다만, 국어로 출원한 국제특허출원인 경우에 「특허\n협력조약」 제20조에 따라 기준일까지 그 보정서 또는 그 설명서가 지식재산처에 송달된 경우에는 그러하지 아니하\n다.<개정 2025. 10. 1.>\n[전문개정 2014. 6. 11.]"}, {"no": 205, "no_str": "제205조", "title": "국제예비심사보고서 작성 전의 보정", "body": "① 국제특허출원의 출원인은 「특허협력조약」 제34조(2)(b)에 따라 국제\n특허출원의 발명의 설명, 청구범위 및 도면에 대하여 보정을 한 경우 기준일까지 다음 각 호의 구분에 따른 서류를\n지식재산처장에게 제출하여야 한다. <개정 2025. 10. 1.>\n1. 외국어로 작성된 보정서인 경우: 그 보정서의 국어번역문\n2. 국어로 작성된 보정서인 경우: 그 보정서의 사본\n② 제1항에 따라 보정서의 국어번역문 또는 사본이 제출되었을 때에는 그 보정서의 국어번역문 또는 사본에 따라\n제47조제1항에 따른 명세서 및 도면이 보정된 것으로 본다. 다만, 「특허협력조약」 제36조(3)(a)에 따라 기준일까지\n그 보정서(국어로 작성된 보정서의 경우만 해당한다)가 지식재산처에 송달된 경우에는 그 보정서에 따라 보정된 것\n으로 본다.<개정 2025. 10. 1.>\n③ 국제특허출원의 출원인이 기준일까지 제1항에 따른 절차를 밟지 아니하면 「특허협력조약」 제34조(2)(b)에 따른\n보정서는 제출되지 아니한 것으로 본다. 다만, 「특허협력조약」 제36조(3)(a)에 따라 기준일까지 그 보정서(국어로 작\n성된 보정서의 경우만 해당한다)가 지식재산처에 송달된 경우에는 그러하지 아니하다.<개정 2025. 10. 1.>\n[전문개정 2014. 6. 11.]"}, {"no": 206, "no_str": "제206조", "title": "재외자의 특허관리인의 특례", "body": "① 재외자인 국제특허출원의 출원인은 기준일까지는 제5조제1항에도 불구하고\n특허관리인에 의하지 아니하고 특허에 관한 절차를 밟을 수 있다.\n② 제201조제1항에 따라 국어번역문을 제출한 재외자는 총리령으로 정하는 기간에 특허관리인을 선임하여 지식재\n산처장에게 신고하여야 한다.<개정 2025. 10. 1.>\n③ 제2항에 따른 선임신고가 없으면 그 국제특허출원은 취하된 것으로 본다.\n[전문개정 2014. 6. 11.]"}, {"no": 207, "no_str": "제207조", "title": "출원공개시기 및 효과의 특례", "body": "① 국제특허출원의 출원공개에 관하여 제64조제1항을 적용하는 경우에는 “다\n음 각 호의 구분에 따른 날부터 1년 6개월이 지난 후”는 “국내서면제출기간(제201조제1항 각 호 외의 부분 단서에\n따라 국어번역문의 제출기간을 연장해 달라는 취지를 적은 서면이 제출된 경우에는 연장된 국어번역문 제출 기간을\n말한다. 이하 이 항에서 같다)이 지난 후(국내서면제출기간에 출원인이 출원심사의 청구를 한 국제특허출원으로서 「\n특허협력조약」 제21조에 따라 국제공개된 경우에는 우선일부터 1년 6개월이 되는 날 또는 출원심사의 청구일 중 늦\n은 날이 지난 후)”로 본다.\n② 제1항에도 불구하고 국어로 출원한 국제특허출원에 관하여 제1항에 따른 출원공개 전에 이미 「특허협력조약」\n제21조에 따라 국제공개가 된 경우에는 그 국제공개가 된 때에 출원공개가 된 것으로 본다.\n③ 국제특허출원의 출원인은 국제특허출원에 관하여 출원공개(국어로 출원한 국제특허출원인 경우 「특허협력조약\n」 제21조에 따른 국제공개를 말한다. 이하 이 조에서 같다)가 있은 후 국제특허출원된 발명을 업으로 실시한 자에게\n국제특허출원된 발명인 것을 서면으로 경고할 수 있다.\n④ 국제특허출원의 출원인은 제3항에 따른 경고를 받거나 출원공개된 발명임을 알고도 그 국제특허출원된 발명을\n업으로서 실시한 자에게 그 경고를 받거나 출원공개된 발명임을 안 때부터 특허권의 설정등록 시까지의 기간 동안\n그 특허발명의 실시에 대하여 합리적으로 받을 수 있는 금액에 상당하는 보상금의 지급을 청구할 수 있다. 다만, 그\n청구권은 해당 특허출원이 특허권의 설정등록된 후에만 행사할 수 있다.<개정 2019. 1. 8.>\n[전문개정 2014. 6. 11.]"}, {"no": 208, "no_str": "제208조", "title": "보정의 특례 등", "body": "① 국제특허출원에 관하여는 다음 각 호의 요건을 모두 갖추지 아니하면 제47조제1항에도 불\n구하고 보정(제204조제2항 및 제205조제2항에 따른 보정은 제외한다)을 할 수 없다. <개정 2014. 6. 11.>\n1. 제82조제1항에 따른 수수료를 낼 것\n2. 제201조제1항에 따른 국어번역문을 제출할 것. 다만, 국어로 출원된 국제특허출원인 경우는 그러하지 아니하다.\n3. 기준일(기준일이 출원심사의 청구일인 경우 출원심사를 청구한 때를 말한다)이 지날 것\n② 삭제<2001. 2. 3.>\n③ 외국어로 출원된 국제특허출원의 보정할 수 있는 범위에 관하여 제47조제2항 전단을 적용할 때에는 “특허출원\n서에 최초로 첨부한 명세서 또는 도면”은 “국제출원일까지 제출한 발명의 설명, 청구범위 또는 도면”으로 본다.<개\n정 2014. 6. 11.>\n④ 외국어로 출원된 국제특허출원의 보정할 수 있는 범위에 관하여 제47조제2항 후단을 적용할 때에는 “외국어특\n허출원”은 “외국어로 출원된 국제특허출원”으로, “최종 국어번역문(제42조의3제6항 전단에 따른 정정이 있는 경우\n에는 정정된 국어번역문을 말한다) 또는 특허출원서에 최초로 첨부한 도면(도면 중 설명부분은 제외한다)”은 “제\n201조제5항에 따른 최종 국어번역문(제201조제6항 전단에 따른 정정이 있는 경우에는 정정된 국어번역문을 말한\n다) 또는 국제출원일까지 제출한 도면(도면 중 설명부분은 제외한다)”으로 본다.<신설 2014. 6. 11.>\n⑤ 삭제<2001. 2. 3.>\n[제목개정 2014. 6. 11.]"}, {"no": 209, "no_str": "제209조", "title": "변경출원시기의 제한", "body": "「실용신안법」 제34조제1항에 따라 국제출원일에 출원된 실용신안등록출원으로 보는\n국제출원을 기초로 하여 특허출원으로 변경출원을 하는 경우에는 이 법 제53조제1항에도 불구하고 「실용신안법」\n제17조제1항에 따른 수수료를 내고 같은 법 제35조제1항에 따른 국어번역문(국어로 출원된 국제실용신안등록출원\n의 경우는 제외한다)을 제출한 후(「실용신안법」 제40조제4항에 따라 국제출원일로 인정할 수 있었던 날에 출원된\n것으로 보는 국제출원을 기초로 하는 경우에는 같은 항에 따른 결정이 있은 후)에만 변경출원을 할 수 있다.\n[전문개정 2014. 6. 11.]"}, {"no": 210, "no_str": "제210조", "title": "출원심사청구시기의 제한", "body": "국제특허출원에 관하여는 제59조제2항에도 불구하고 다음 각 호의 어느 하나에 해\n당하는 때에만 출원심사의 청구를 할 수 있다.\n1. 국제특허출원의 출원인은 제201조제1항에 따라 국어번역문을 제출하고(국어로 출원된 국제특허출원의 경우는\n제외한다) 제82조제1항에 따른 수수료를 낸 후\n2. 국제특허출원의 출원인이 아닌 자는 국내서면제출기간(제201조제1항 각 호 외의 부분 단서에 따라 국어번역문의\n제출기간을 연장하여 달라는 취지를 적은 서면이 제출된 경우에는 연장된 국어번역문 제출 기간을 말한다)이 지\n난후\n[전문개정 2014. 6. 11.]"}, {"no": 211, "no_str": "제211조", "title": "국제조사보고서 등에 기재된 문헌의 제출명령", "body": "지식재산처장은 국제특허출원의 출원인에 대하여 기간을 정하\n여 「특허협력조약」 제18조의 국제조사보고서 또는 같은 조약 제35조의 국제예비심사보고서에 적혀 있는 문헌의 사\n본을 제출하게 할 수 있다. <개정 2025. 10. 1.>\n[전문개정 2014. 6. 11.]"}, {"no": 212, "no_str": "제212조", "title": "", "body": "삭제 <2006. 3. 3.>"}, {"no": 213, "no_str": "제213조", "title": "", "body": "삭제 <2014. 6. 11.>"}, {"no": 214, "no_str": "제214조", "title": "결정에 의하여 특허출원으로 되는 국제출원", "body": "① 국제출원의 출원인은 「특허협력조약」 제4조(1)(ii)의 지정국에\n대한민국을 포함하는 국제출원(특허출원만 해당한다)이 다음 각 호의 어느 하나에 해당하는 경우 총리령으로 정하는\n기간에 총리령으로 정하는 바에 따라 지식재산처장에게 같은 조약 제25조(2)(a)에 따른 결정을 하여줄 것을 신청할\n수 있다. <개정 2025. 10. 1.>\n1. 「특허협력조약」 제2조(xv)의 수리관청이 그 국제출원에 대하여 같은 조약 제25조(1)(a)에 따른 거부를 한 경우\n2. 「특허협력조약」 제2조(xv)의 수리관청이 그 국제출원에 대하여 같은 조약 제25조(1)(a) 또는 (b)에 따른 선언을\n한 경우\n3. 국제사무국이 그 국제출원에 대하여 같은 조약 제25조(1)(a)에 따른 인정을 한 경우\n② 제1항의 신청을 하려는 자는 그 신청 시 발명의 설명, 청구범위 또는 도면(도면 중 설명부분에 한정한다), 그 밖\n에 총리령으로 정하는 국제출원에 관한 서류의 국어번역문을 지식재산처장에게 제출하여야 한다.<개정 2025. 10.\n1.>\n③ 지식재산처장은 제1항의 신청이 있으면 그 신청에 관한 거부ㆍ선언 또는 인정이 「특허협력조약」 및 같은 조약\n규칙에 따라 정당하게 된 것인지에 관하여 결정을 하여야 한다.<개정 2025. 10. 1.>\n④ 지식재산처장은 제3항에 따라 그 거부ㆍ선언 또는 인정이 「특허협력조약」 및 같은 조약규칙에 따라 정당하게\n된 것이 아니라고 결정을 한 경우에는 그 결정에 관한 국제출원은 그 국제출원에 대하여 거부ㆍ선언 또는 인정이\n없었다면 국제출원일로 인정할 수 있었던 날에 출원된 특허출원으로 본다.<개정 2025. 10. 1.>\n⑤ 지식재산처장은 제3항에 따른 정당성 여부의 결정을 하는 경우에는 그 결정의 등본을 국제출원의 출원인에게 송\n달하여야 한다.<개정 2025. 10. 1.>\n⑥ 제4항에 따라 특허출원으로 보는 국제출원에 관하여는 제199조제2항, 제200조, 제200조의2, 제201조제5항부터\n제8항까지, 제202조제1항ㆍ제2항, 제208조 및 제210조를 준용한다.<개정 2016. 2. 29.>\n⑦ 제4항에 따라 특허출원으로 보는 국제출원에 관한 출원공개에 관하여는 제64조제1항 중 “다음 각 호의 구분에\n따른 날”을 “제201조제1항의 우선일”로 본다.\n[전문개정 2014. 6. 11.]"}, {"no": 215, "no_str": "제215조", "title": "둘 이상의 청구항이 있는 특허 또는 특허권에 관한 특칙", "body": "둘 이상의 청구항이 있는 특허 또는 특허권에 관하여\n제65조제6항, 제84조제1항제2호ㆍ제6호, 제85조제1항제1호(소멸의 경우만 해당한다), 제101조제1항제1호, 제104조\n제1항제1호ㆍ제3호ㆍ제5호, 제119조제1항, 제132조의13제3항, 제133조제2항ㆍ제3항, 제136조제7항, 제139조제1항\n, 제181조, 제182조 또는 「실용신안법」 제26조제1항제2호ㆍ제4호ㆍ제5호를 적용할 때에는 청구항마다 특허가 되거\n나 특허권이 있는 것으로 본다. <개정 2016. 2. 29., 2016. 3. 29.>\n[전문개정 2014. 6. 11.]"}, {"no": 215, "no_str": "제215조의2", "title": "둘 이상의 청구항이 있는 특허출원의 등록에 관한 특칙", "body": "① 둘 이상의 청구항이 있는 특허출원에 대한 특허\n결정을 받은 자가 특허료를 낼 때에는 청구항별로 이를 포기할 수 있다.\n② 제1항에 따른 청구항의 포기에 관하여 필요한 사항은 총리령으로 정한다.<개정 2025. 10. 1.>\n[전문개정 2014. 6. 11.]"}, {"no": 216, "no_str": "제216조", "title": "서류의 열람 등", "body": "① 특허출원, 특허취소신청, 심판 등에 관한 증명, 서류의 등본 또는 초본의 발급, 특허원부 및\n서류의 열람 또는 복사가 필요한 자는 지식재산처장 또는 특허심판원장에게 서류의 열람 등의 허가를 신청할 수 있\n다. <개정 2016. 2. 29., 2025. 10. 1.>\n② 지식재산처장 또는 특허심판원장은 제1항의 신청이 있더라도 다음 각 호의 어느 하나에 해당하는 서류를 비밀로\n유지할 필요가 있다고 인정하는 경우에는 그 서류의 열람 또는 복사를 허가하지 아니할 수 있다.<개정 2016. 2. 29.,\n2025. 10. 1.>\n1. 출원공개 또는 설정등록되지 아니한 특허출원(제55조제1항에 따른 우선권 주장을 수반하는 특허출원이 출원공\n개 또는 설정등록된 경우에는 그 선출원은 제외한다)에 관한 서류\n2. 출원공개 또는 설정등록되지 아니한 특허출원의 제132조의17에 따른 특허거절결정에 대한 심판에 관한 서류\n3. 공공의 질서 또는 선량한 풍속에 어긋나거나 공중의 위생을 해칠 우려가 있는 서류\n[전문개정 2014. 6. 11.]"}, {"no": 217, "no_str": "제217조", "title": "특허출원 등에 관한 서류 등의 반출 및 감정 등의 금지", "body": "① 특허출원ㆍ심사ㆍ특허취소신청ㆍ심판ㆍ재심에 관\n한 서류 또는 특허원부는 다음 각 호의 어느 하나에 해당하는 경우에만 외부로 반출할 수 있다. <개정 2016. 2. 29.,\n2016. 12. 2., 2017. 11. 28., 2018. 4. 17., 2021. 8. 17., 2024. 2. 6., 2025. 10. 1.>\n1. 제
