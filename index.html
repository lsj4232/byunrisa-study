58조제1항, 제3항 또는 제4항에 따른 선행기술의 조사 등을 위하여 특허출원 또는 심사에 관한 서류를 반출하\n는 경우\n1의2. 제164조의2제2항에 따른 조정을 위하여 특허출원ㆍ심사ㆍ특허취소신청ㆍ심판ㆍ재심에 관한 서류 또는 특허\n원부를 반출하는 경우\n2. 「산업재산 정보의 관리 및 활용 촉진에 관한 법률」 제12조제1항에 따른 산업재산문서 전자화업무의 위탁을 위하\n여 특허출원ㆍ심사ㆍ특허취소신청ㆍ심판ㆍ재심에 관한 서류 또는 특허원부를 반출하는 경우\n3. 「전자정부법」 제32조제2항에 따른 온라인 원격근무를 위하여 특허출원ㆍ심사ㆍ특허취소신청ㆍ심판ㆍ재심에 관\n한 서류 또는 특허원부를 반출하는 경우\n4. 외국 특허담당 정부기관 또는 국제기구와의 업무협약을 이행하기 위하여 특허출원 또는 심사에 관한 서류를 반\n출하는 경우\n② 특허출원ㆍ심사ㆍ특허취소신청ㆍ심판 또는 재심으로 계속 중인 사건의 내용이나 특허여부결정ㆍ심결 또는 결\n정의 내용에 관하여는 감정ㆍ증언하거나 질의에 응답할 수 없다.<개정 2016. 2. 29.>\n③ 제1항제4호에 따른 반출 요건ㆍ절차, 서류의 종류 등에 필요한 사항은 총리령으로 정한다.<신설 2017. 11. 28.,\n2025. 10. 1.>\n[전문개정 2014. 6. 11.]"}, {"no": 217, "no_str": "제217조의2", "title": "", "body": "삭제 <2024. 2. 6.>"}, {"no": 218, "no_str": "제218조", "title": "서류의 송달", "body": "이 법에 규정된 서류의 송달절차 등에 관하여 필요한 사항은 대통령령으로 정한다.\n[전문개정 2014. 6. 11.]"}, {"no": 219, "no_str": "제219조", "title": "공시송달", "body": "① 서류를 송달받을 자의 주소나 영업소가 분명하지 아니하여 송달할 수 없는 경우에는 공시송달\n(公示送達)을 하여야 한다.\n② 공시송달은 서류를 송달받을 자에게 어느 때라도 발급한다는 뜻을 특허공보에 게재하는 것으로 한다.\n③ 최초의 공시송달은 특허공보에 게재한 날부터 2주일이 지나면 그 효력이 발생한다. 다만, 같은 당사자에 대한 이\n후의 공시송달은 특허공보에 게재한 날의 다음 날부터 효력이 발생한다.\n[전문개정 2014. 6. 11.]"}, {"no": 220, "no_str": "제220조", "title": "재외자에 대한 송달", "body": "① 재외자로서 특허관리인이 있으면 그 재외자에게 송달할 서류는 특허관리인에게 송달\n하여야 한다.\n② 재외자로서 특허관리인이 없으면 그 재외자에게 송달할 서류는 항공등기우편으로 발송할 수 있다.\n③ 제2항에 따라 서류를 항공등기우편으로 발송한 경우에는 그 발송일에 송달된 것으로 본다.\n[전문개정 2014. 6. 11.]"}, {"no": 221, "no_str": "제221조", "title": "특허공보", "body": "① 지식재산처장은 대통령령으로 정하는 바에 따라 특허공보를 발행하여야 한다. <개정 2025. 10.\n1.>\n② 특허공보는 총리령으로 정하는 바에 따라 전자적 매체로 발행할 수 있다.<개정 2025. 10. 1.>\n③ 지식재산처장은 전자적 매체로 특허공보를 발행하는 경우에는 정보통신망을 활용하여 특허공보의 발행사실ㆍ\n주요목록 및 공시송달에 관한 사항을 알려야 한다.<개정 2025. 10. 1.>\n[전문개정 2014. 6. 11.]"}, {"no": 222, "no_str": "제222조", "title": "서류의 제출 등", "body": "지식재산처장 또는 심사관은 당사자에게 특허취소신청, 심판 또는 재심에 관한 절차 외의 절\n차를 처리하기 위하여 필요한 서류나 그 밖의 물건의 제출을 명할 수 있다. <개정 2016. 2. 29., 2025. 10. 1.>\n[전문개정 2014. 6. 11.]"}, {"no": 223, "no_str": "제223조", "title": "특허표시 및 특허출원표시", "body": "①특허권자, 전용실시권자 또는 통상실시권자는 다음 각 호의 구분에 따른 방법으\n로 특허표시를 할 수 있다. <개정 2016. 2. 29., 2017. 3. 21.>\n1. 물건의 특허발명의 경우: 그 물건에 “특허”라는 문자와 그 특허번호를 표시\n2. 물건을 생산하는 방법의 특허발명의 경우: 그 방법에 따라 생산된 물건에 “방법특허”라는 문자와 그 특허번호를\n표시\n3. 삭제<2017. 3. 21.>\n② 특허출원인은 다음 각 호의 구분에 따른 방법으로 특허출원의 표시(이하 “특허출원표시”라 한다)를 할 수 있다.\n<개정 2017. 3. 21.>\n1. 물건의 특허출원의 경우: 그 물건에 “특허출원(심사중)”이라는 문자와 그 출원번호를 표시\n2. 물건을 생산하는 방법의 특허출원의 경우: 그 방법에 따라 생산된 물건에 “방법특허출원(심사중)”이라는 문자와\n그 출원번호를 표시\n③ 제1항 또는 제2항에 따른 특허표시 또는 특허출원표시를 할 수 없는 물건의 경우에는 그 물건의 용기 또는 포장\n에 특허표시 또는 특허출원표시를 할 수 있다.<신설 2017. 3. 21.>\n④ 그 밖에 특허표시 또는 특허출원표시에 필요한 사항은 총리령으로 정한다.<신설 2017. 3. 21., 2025. 10. 1.>\n[전문개정 2014. 6. 11.]\n[제목개정 2017. 3. 21.]"}, {"no": 224, "no_str": "제224조", "title": "허위표시의 금지", "body": "누구든지 다음 각 호의 어느 하나에 해당하는 행위를 하여서는 아니 된다.\n1. 특허된 것이 아닌 물건, 특허출원 중이 아닌 물건, 특허된 것이 아닌 방법이나 특허출원 중이 아닌 방법에 의하여\n생산한 물건 또는 그 물건의 용기나 포장에 특허표시 또는 특허출원표시를 하거나 이와 혼동하기 쉬운 표시를 하\n는 행위\n2. 제1호의 표시를 한 것을 양도ㆍ대여 또는 전시하는 행위\n3. 제1호의 물건을 생산ㆍ사용ㆍ양도 또는 대여하기 위하여 광고ㆍ간판 또는 표찰에 그 물건이 특허나 특허출원된\n것 또는 특허된 방법이나 특허출원 중인 방법에 따라 생산한 것으로 표시하거나 이와 혼동하기 쉬운 표시를 하는\n행위\n4. 특허된 것이 아닌 방법이나 특허출원 중이 아닌 방법을 사용ㆍ양도 또는 대여하기 위하여 광고ㆍ간판 또는 표찰\n에 그 방법이 특허 또는 특허출원된 것으로 표시하거나 이와 혼동하기 쉬운 표시를 하는 행위\n[전문개정 2014. 6. 11.]"}, {"no": 224, "no_str": "제224조의2", "title": "불복의 제한", "body": "① 보정각하결정, 특허여부결정, 특허취소결정, 심결이나 특허취소신청서ㆍ심판청구서ㆍ재심\n청구서의 각하결정에 대해서는 다른 법률에 따른 불복을 할 수 없으며, 이 법에 따라 불복할 수 없도록 규정되어 있\n는 처분에 대해서는 다른 법률에 따라 불복을 할 수 없다. <개정 2016. 2. 29.>\n② 제1항에 따른 처분 외의 처분의 불복에 대해서는 「행정심판법」 또는 「행정소송법」에 따른다.\n[전문개정 2014. 6. 11.]"}, {"no": 224, "no_str": "제224조의3", "title": "비밀유지명령", "body": "① 법원은 특허권 또는 전용실시권의 침해에 관한 소송에서 그 당사자가 보유한 영업비밀에\n대하여 다음 각 호의 사유를 모두 소명한 경우에는 그 당사자의 신청에 따라 결정으로 다른 당사자(법인인 경우에는\n그 대표자), 당사자를 위하여 소송을 대리하는 자, 그 밖에 그 소송으로 인하여 영업비밀을 알게 된 자에게 그 영업비\n밀을 그 소송의 계속적인 수행 외의 목적으로 사용하거나 그 영업비밀에 관계된 이 항에 따른 명령을 받은 자 외의\n자에게 공개하지 아니할 것을 명할 수 있다. 다만, 그 신청 시점까지 다른 당사자(법인인 경우에는 그 대표자), 당사자\n를 위하여 소송을 대리하는 자, 그 밖에 그 소송으로 인하여 영업비밀을 알게 된 자가 제1호에 규정된 준비서면의 열\n람이나 증거조사 외의 방법으로 그 영업비밀을 이미 취득하고 있는 경우에는 그러하지 아니하다. <개정 2016. 3.\n29.>\n1. 이미 제출하였거나 제출하여야 할 준비서면, 이미 조사하였거나 조사하여야 할 증거 또는 제132조제3항에 따라\n제출하였거나 제출하여야 할 자료에 영업비밀이 포함되어 있다는 것\n2. 제1호의 영업비밀이 해당 소송 수행 외의 목적으로 사용되거나 공개되면 당사자의 영업에 지장을 줄 우려가 있\n어 이를 방지하기 위하여 영업비밀의 사용 또는 공개를 제한할 필요가 있다는 것\n② 제1항에 따른 명령(이하 “비밀유지명령”이라 한다)의 신청은 다음 각 호의 사항을 적은 서면으로 하여야 한다.\n1. 비밀유지명령을 받을 자\n2. 비밀유지명령의 대상이 될 영업비밀을 특정하기에 충분한 사실\n3. 제1항 각 호의 사유에 해당하는 사실\n③ 법원은 비밀유지명령이 결정된 경우에는 그 결정서를 비밀유지명령을 받은 자에게 송달하여야 한다.\n④ 비밀유지명령은 제3항의 결정서가 비밀유지명령을 받은 자에게 송달된 때부터 효력이 발생한다.\n⑤ 비밀유지명령의 신청을 기각하거나 각하한 재판에 대해서는 즉시항고를 할 수 있다.\n[전문개정 2014. 6. 11.]"}, {"no": 224, "no_str": "제224조의4", "title": "비밀유지명령의 취소", "body": "① 비밀유지명령을 신청한 자 또는 비밀유지명령을 받은 자는 제224조의3제1항에\n따른 요건을 갖추지 못하였거나 갖추지 못하게 된 경우 소송기록을 보관하고 있는 법원(소송기록을 보관하고 있는\n법원이 없는 경우에는 비밀유지명령을 내린 법원)에 비밀유지명령의 취소를 신청할 수 있다.\n② 법원은 비밀유지명령의 취소신청에 대한 재판이 있는 경우에는 그 결정서를 그 신청을 한 자 및 상대방에게 송\n달하여야 한다.\n③ 비밀유지명령의 취소신청에 대한 재판에 대해서는 즉시항고를 할 수 있다.\n④ 비밀유지명령을 취소하는 재판은 확정되어야 효력이 발생한다.\n⑤ 비밀유지명령을 취소하는 재판을 한 법원은 비밀유지명령의 취소신청을 한 자 또는 상대방 외에 해당 영업비밀\n에 관한 비밀유지명령을 받은 자가 있는 경우에는 그 자에게 즉시 비밀유지명령의 취소 재판을 한 사실을 알려야\n한다.\n[전문개정 2014. 6. 11.]"}, {"no": 224, "no_str": "제224조의5", "title": "소송기록 열람 등의 청구 통지 등", "body": "① 비밀유지명령이 내려진 소송(모든 비밀유지명령이 취소된 소송은 제\n외한다)에 관한 소송기록에 대하여 「민사소송법」 제163조제1항의 결정이 있었던 경우, 당사자가 같은 항에서 규정\n하는 비밀 기재부분의 열람 등의 청구를 하였으나 그 청구 절차를 해당 소송에서 비밀유지명령을 받지 아니한 자가\n밟은 경우에는 법원서기관, 법원사무관, 법원주사 또는 법원주사보(이하 이 조에서 “법원사무관등”이라 한다)는 「민\n사소송법」 제163조제1항의 신청을 한 당사자(그 열람 등의 청구를 한 자는 제외한다. 이하 제3항에서 같다)에게 그\n청구 직후에 그 열람 등의 청구가 있었다는 사실을 알려야 한다.\n② 제1항의 경우에 법원사무관등은 제1항의 청구가 있었던 날부터 2주일이 지날 때까지(그 청구 절차를 밟은 자에\n대한 비밀유지명령 신청이 그 기간 내에 이루어진 경우에는 그 신청에 대한 재판이 확정되는 시점까지) 그 청구 절\n차를 밟은 자에게 제1항의 비밀 기재부분의 열람 등을 하게 하여서는 아니 된다.\n③ 제2항은 제1항의 열람 등의 청구를 한 자에게 제1항의 비밀 기재부분의 열람 등을 하게 하는 것에 대하여 「민사\n소송법」 제163조제1항의 신청을 한 당사자 모두가 동의하는 경우에는 적용되지 아니한다.\n[전문개정 2014. 6. 11.]"}, {"no": 225, "no_str": "제225조", "title": "침해죄", "body": "① 특허권 또는 전용실시권을 침해한 자는 7년 이하의 징역 또는 1억원 이하의 벌금에 처한다.\n② 제1항의 죄는 피해자의 명시적인 의사에 반하여 공소(公訴)를 제기할 수 없다.<개정 2020. 10. 20.>\n[전문개정 2014. 6. 11.]"}, {"no": 226, "no_str": "제226조", "title": "비밀누설죄 등", "body": "① 지식재산처 또는 특허심판원 소속 직원이거나 직원이었던 사람이 특허출원 중인 발명(국제\n출원 중인 발명을 포함한다)에 관하여 직무상 알게 된 비밀을 누설하거나 도용한 경우에는 5년 이하의 징역 또는\n5천만원 이하의 벌금에 처한다. <개정 2021. 4. 20., 2025. 10. 1.>\n② 전문심리위원 또는 전문심리위원이었던 자가 그 직무수행 중에 알게 된 다른 사람의 비밀을 누설하는 경우에는\n2년 이하의 징역이나 금고 또는 1천만원 이하의 벌금에 처한다.<신설 2021. 4. 20.>\n[전문개정 2014. 6. 11.]"}, {"no": 226, "no_str": "제226조의2", "title": "전문기관 등의 임직원에 대한 공무원 의제", "body": "① 제58조제2항에 따른 전문기관 또는 제58조제3항에 따른 전\n담기관의 임직원이거나 임직원이었던 사람은 제226조제1항을 적용하는 경우에는 지식재산처 소속 직원 또는 직원\n이었던 사람으로 본다. <개정 2016. 12. 2., 2018. 4. 17., 2021. 4. 20., 2024. 2. 6., 2025. 10. 1.>\n② 전문심리위원은 「형법」 제129조부터 제132조까지의 규정을 적용할 때에는 공무원으로 본다.<신설 2021. 4.\n20.>\n[전문개정 2014. 6. 11.]"}, {"no": 227, "no_str": "제227조", "title": "위증죄", "body": "① 이 법에 따라 선서한 증인, 감정인 또는 통역인이 특허심판원에 대하여 거짓으로 진술ㆍ감정 또는\n통역을 한 경우에는 5년 이하의 징역 또는 5천만원 이하의 벌금에 처한다. <개정 2017. 3. 21.>\n② 제1항에 따른 죄를 범한 자가 그 사건의 특허취소신청에 대한 결정 또는 심결이 확정되기 전에 자수한 경우에는\n그 형을 감경 또는 면제할 수 있다.<개정 2016. 2. 29.>\n[전문개정 2014. 6. 11.]"}, {"no": 228, "no_str": "제228조", "title": "허위표시의 죄", "body": "제224조를 위반한 자는 3년 이하의 징역 또는 3천만원 이하의 벌금에 처한다. <개정 2017. 3.\n21.>\n[전문개정 2014. 6. 11.]"}, {"no": 229, "no_str": "제229조", "title": "거짓행위의 죄", "body": "거짓이나 그 밖의 부정한 행위로 특허, 특허권의 존속기간의 연장등록, 특허취소신청에 대한\n결정 또는 심결을 받은 자는 3년 이하의 징역 또는 3천만원 이하의 벌금에 처한다. <개정 2016. 2. 29., 2017. 3. 21.>\n[전문개정 2014. 6. 11.]"}, {"no": 229, "no_str": "제229조의2", "title": "비밀유지명령 위반죄", "body": "① 국내외에서 정당한 사유 없이 제224조의3제1항에 따른 비밀유지명령을 위반한\n자는 5년 이하의 징역 또는 5천만원 이하의 벌금에 처한다.\n② 제1항의 죄는 비밀유지명령을 신청한 자의 고소가 없으면 공소를 제기할 수 없다.\n[본조신설 2011. 12. 2.]"}, {"no": 229, "no_str": "제229조의3", "title": "외국에의 특허출원 금지 또는 비밀취급명령 위반죄", "body": "제41조제1항에 따른 외국에의 특허출원 금지 또는 비\n밀취급명령을 위반한 자는 5년 이하의 징역 또는 5천만원 이하의 벌금에 처한다.\n[본조신설 2025. 1. 21.]"}, {"no": 230, "no_str": "제230조", "title": "양벌규정", "body": "법인의 대표자나 법인 또는 개인의 대리인, 사용인, 그 밖의 종업원이 그 법인 또는 개인의 업무에\n관하여 제225조제1항, 제228조, 제229조 또는 제229조의3의 어느 하나에 해당하는 위반행위를 하면 그 행위자를 벌\n하는 외에 그 법인에는 다음 각 호의 구분에 따른 벌금형을, 그 개인에게는 해당 조문의 벌금형을 과(科)한다. 다만,\n법인 또는 개인이 그 위반행위를 방지하기 위하여 해당 업무에 관하여 상당한 주의와 감독을 게을리하지 아니한 경\n우에는 그러하지 아니하다. <개정 2025. 1. 21.>\n1. 제225조제1항의 경우: 3억원 이하의 벌금\n2. 제228조 또는 제229조의 경우: 6천만원 이하의 벌금\n3. 제229조의3의 경우: 1억원 이하의 벌금\n[전문개정 2014. 6. 11.]"}, {"no": 231, "no_str": "제231조", "title": "몰수 등", "body": "① 제225조제1항에 해당하는 침해행위를 조성한 물건 또는 그 침해행위로부터 생긴 물건은 몰수하거\n나 피해자의 청구에 따라 그 물건을 피해자에게 교부할 것을 선고하여야 한다.\n② 피해자는 제1항에 따른 물건을 받은 경우에는 그 물건의 가액을 초과하는 손해액에 대해서만 배상을 청구할 수\n있다.\n[전문개정 2014. 6. 11.]"}, {"no": 232, "no_str": "제232조", "title": "과태료", "body": "① 다음 각 호의 어느 하나에 해당하는 자에게는 50만원 이하의 과태료를 부과한다.\n1. 「민사소송법」 제299조제2항 및 같은 법 제367조에 따라 선서를 한 자로서 특허심판원에 대하여 거짓 진술을 한\n자\n2. 특허심판원으로부터 증거조사 또는 증거보전에 관하여 서류나 그 밖의 물건 제출 또는 제시의 명령을 받은 자로\n서 정당한 이유 없이 그 명령에 따르지 아니한 자\n3. 특허심판원으로부터 증인ㆍ감정인 또는 통역인으로 소환된 자로서 정당한 이유 없이 소환에 따르지 아니하거나\n선서ㆍ진술ㆍ증언ㆍ감정 또는 통역을 거부한 자\n② 제1항에 따른 과태료는 대통령령으로 정하는 바에 따라 지식재산처장이 부과ㆍ징수한다.<개정 2025. 10. 1.>\n[전문개정 2014. 6. 11.]\n부칙 <제21134호,2025. 11. 11.>(노동절 제정에 관한 법률)"}]};

// ── State ──────────────────────────────────────────────────
let allItems = [];   // flat list of all {problem, sq} pairs
let filtered = [];   // filtered by exam
let order = [];      // indices into filtered (shuffled or sequential)
let cursor = 0;      // current position in order
let answerRevealed = false;
let activeExam = 'all';
let activeSubject = '민사소송법';
let hintOn = false;
let hintEditMode = false;
let currentPassageRanges = [];
let currentSubqRanges = [];

const HL_AREAS = ['passage', 'subq', 'answer'];
const currentHighlights = { passage: [], subq: [], answer: [] };

// ── Custom hints (user-edited, stored per sub-question in localStorage) ─
function customHintsKey(prob, sq) {
  return `customhints:${prob.exam}:${prob.problemNo}:${sq.no}`;
}
function loadCustomHints(prob, sq) {
  const raw = localStorage.getItem(customHintsKey(prob, sq));
  if (raw === null) return null;        // never set
  try { return JSON.parse(raw); } catch { return null; }
}
function saveCustomHints(prob, sq, hints) {
  localStorage.setItem(customHintsKey(prob, sq), JSON.stringify(hints));
}
function effectiveHints(prob, sq) {
  const custom = loadCustomHints(prob, sq);
  // An explicitly stored empty array means "user wiped them" — honor it
  // even though [] is truthy in JavaScript.
  if (custom !== null) return custom;
  return sq.hints || [];
}

// ── Init ───────────────────────────────────────────────────
function init() {
  buildFlatList();
  // Default to whichever subject the data starts with (likely 민사소송법)
  const subs = listSubjects();
  if (subs.length > 0 && !subs.find(s => s.name === activeSubject)) {
    activeSubject = subs[0].name;
  }
  setSubject(activeSubject);
  bindEvents();
}

function buildFlatList() {
  allItems = [];
  for (const prob of EXAM_DATA) {
    for (const sq of prob.subquestions) {
      allItems.push({ prob, sq });
    }
  }
}

// All sub-questions for the currently selected subject
function subjectItems(subject) {
  return allItems.filter(it => (it.prob.subject || '민사소송법') === subject);
}

// Subjects present in the data, with counts
function listSubjects() {
  const seen = new Map();
  for (const it of allItems) {
    const s = it.prob.subject || '민사소송법';
    seen.set(s, (seen.get(s) || 0) + 1);
  }
  return [...seen.entries()].map(([name, count]) => ({ name, count }));
}

function applyFilter(exam) {
  activeExam = exam;
  const pool = subjectItems(activeSubject);
  filtered = exam === 'all' ? pool : pool.filter(item => item.prob.exam === exam);
  order = shuffle([...Array(filtered.length).keys()]);
  cursor = 0;
  showCurrent();
}

function setSubject(subject) {
  activeSubject = subject;
  document.getElementById('appTitle').textContent = `변리사 ${subject} 기출 학습`;
  renderSubjectList();
  renderExamFilter();
  // Refresh statute panel title + list (cached index keyed by activeSubject)
  const stTitle = document.querySelector('.statute-title-text');
  if (stTitle) stTitle.textContent = `${subject} 조문`;
  const stSearch = document.getElementById('statuteSearch');
  if (stSearch) stSearch.value = '';
  if (document.getElementById('statuteList')) renderStatuteList('', null);
  applyFilter('all');
}

function renderSubjectList() {
  const subs = listSubjects();
  const list = document.getElementById('subjectList');
  list.innerHTML = subs.map(s => `
    <div class="subject-item${s.name === activeSubject ? ' active' : ''}" data-subject="${escHtml(s.name)}">
      ${escHtml(s.name)}
      <span class="subject-item-count">${s.count}개 설문</span>
    </div>`).join('');
}

function renderExamFilter() {
  const exams = [];
  const seen = new Set();
  for (const it of subjectItems(activeSubject)) {
    if (!seen.has(it.prob.exam)) { seen.add(it.prob.exam); exams.push(it.prob.exam); }
  }
  exams.sort();  // 56회 < 57회 < ...
  const fg = document.getElementById('filterGroup');
  fg.innerHTML = '<span class="filter-label">회차:</span>'
    + `<button class="filter-btn${activeExam === 'all' ? ' active' : ''}" data-exam="all">전체</button>`
    + exams.map(e =>
        `<button class="filter-btn${activeExam === e ? ' active' : ''}" data-exam="${escHtml(e)}">${escHtml(e)}</button>`
      ).join('');
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ── Render ─────────────────────────────────────────────────
function showCurrent() {
  if (filtered.length === 0) {
    showEmpty();
    return;
  }

  const { prob, sq } = filtered[order[cursor]];

  // Badges
  document.getElementById('badgeExam').textContent = `${prob.exam} (${prob.year})`;
  document.getElementById('badgeProb').textContent = `문제-${prob.problemNo}`;
  document.getElementById('badgeSq').textContent = `설문(${sq.no})`;
  document.getElementById('badgePts').textContent = `${sq.points}점`;

  // Always exit quiz mode when moving to a new sub-question
  if (quizMode) endQuiz();

  // Restart the per-question stopwatch
  resetStopwatch();

  // Reset hint state on every navigation; recompute ranges for this problem
  hintOn = false;
  document.getElementById('btnHint').classList.remove('active');
  const hintsForThis = effectiveHints(prob, sq);
  if (hintsForThis && hintsForThis.length) {
    currentPassageRanges = locateHints(prob.passage, hintsForThis);
    currentSubqRanges = locateHints(sq.question, hintsForThis);
  } else {
    const answerKeywords = extractAnswerKeywords(sq.answer);
    currentPassageRanges = findHintRanges(prob.passage, answerKeywords);
    currentSubqRanges = findHintRanges(sq.question, answerKeywords);
  }

  // Load saved user highlights (per area)
  loadAllHighlights(prob, sq);

  // Passage
  document.getElementById('passageText').innerHTML =
    textToHtml(prob.passage, null, currentHighlights.passage);

  // Sub-question
  document.getElementById('subqText').innerHTML =
    textToHtml(sq.question, null, currentHighlights.subq);

  // Hint button always enabled (user can also add hints in edit mode)
  const btnHint = document.getElementById('btnHint');
  btnHint.disabled = false;
  btnHint.style.opacity = 1;
  btnHint.style.cursor = 'pointer';

  // Reset the hint-card list and edit mode when navigating
  document.getElementById('hintCards').classList.remove('shown');
  hintEditMode = false;
  document.getElementById('btnHintEdit').classList.remove('active');
  document.getElementById('addHintBtn').style.display = 'none';

  // Answer (always reset to hidden)
  renderAnswer(sq.answer, currentHighlights.answer);
  renderExtracts(sq.answer, sq.categories);
  loadNotes(prob, sq);
  resetInlineAnswers();
  hideAnswer();

  // Navigation
  document.getElementById('navPos').textContent = `${cursor + 1} / ${filtered.length}`;
  document.getElementById('progressInfo').textContent = `${cursor + 1} / ${filtered.length}개`;
  document.getElementById('btnPrev').disabled = cursor === 0;
  document.getElementById('btnNext').disabled = cursor === filtered.length - 1;
}

function showEmpty() {
  document.getElementById('passageText').textContent = '선택된 회차에 문제가 없습니다.';
  document.getElementById('subqText').textContent = '';
  document.getElementById('answerContent').innerHTML = '';
  document.getElementById('navPos').textContent = '0 / 0';
  document.getElementById('progressInfo').textContent = '';
}

function escHtmlInline(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// Build inline HTML for a single line, applying any number of typed range
// sets (e.g. hint sentences + user highlights). Each `rangeSet` is
// `{ ranges: [[start,end],...], cls: 'classname' }`.
// Char positions are absolute over the full original text.
function _renderLine(text, lineStart, lineEnd, rangeSets) {
  // Collect intersecting segments with their classes.
  // A range is either [start, end] or [start, end, reason] (reason → tooltip).
  const segs = [];
  for (const set of rangeSets) {
    for (const r of set.ranges) {
      const hs = r[0], he = r[1], reason = r[2] || null;
      if (he <= lineStart || hs >= lineEnd) continue;
      segs.push({
        s: Math.max(hs, lineStart),
        e: Math.min(he, lineEnd),
        cls: set.cls,
        origStart: hs,
        origEnd: he,
        reason,
      });
    }
  }
  if (segs.length === 0) return escHtmlInline(text.slice(lineStart, lineEnd));

  segs.sort((a, b) => a.s - b.s || a.e - b.e);

  let cursor = lineStart;
  let html = '';
  for (const seg of segs) {
    if (seg.s < cursor) continue;
    if (seg.s > cursor) html += escHtmlInline(text.slice(cursor, seg.s));
    let attrs = '';
    if (seg.cls === 'user-hl') {
      attrs = ` data-hl-start="${seg.origStart}" data-hl-end="${seg.origEnd}"`;
    } else if (seg.cls === 'hint-mark' && seg.reason) {
      attrs = ` data-reason="${escHtmlInline(seg.reason).replace(/"/g, '&quot;')}"`;
    }
    html += `<span class="${seg.cls}"${attrs}>${escHtmlInline(text.slice(seg.s, seg.e))}</span>`;
    cursor = seg.e;
  }
  if (cursor < lineEnd) html += escHtmlInline(text.slice(cursor, lineEnd));
  return html;
}

// Find each hint phrase inside `text`; return ranges [start, end, reason].
// Match strategy (in order):
//   1. literal `text.indexOf`
//   2. whitespace-flexible regex (handles wrapped lines)
//   3. fuzzy: locate the longest 5+ char Hangul substring of the phrase
//      that appears in `text` — preserves the hint's reason even when the
//      phrase was paraphrased from the answer.
function locateHints(text, hints) {
  if (!text || !hints) return [];
  const ranges = [];
  for (const h of hints) {
    if (!h.text) continue;
    let idx = text.indexOf(h.text);
    let len = h.text.length;

    if (idx < 0) {
      const flexPattern = h.text
        .replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
        .replace(/\s+/g, '\\s+');
      const m = text.match(new RegExp(flexPattern));
      if (m && m.index >= 0) { idx = m.index; len = m[0].length; }
    }
    if (idx < 0) {
      // Pull substring candidates from the hint phrase, longest first.
      // Include CJK ideographs (한자: 一-鿿) so 甲乙丙丁 attach to
      // neighbouring Hangul, and lower the floor to 3 chars so short
      // legal terms (자백, 진술, 철회 …) still match.
      const cands = [];
      const reCand = /[가-힣A-Za-z0-9一-鿿]{3,}/g;
      let mm;
      while ((mm = reCand.exec(h.text)) !== null) cands.push(mm[0]);
      cands.sort((a, b) => b.length - a.length);
      for (const c of cands) {
        let p = text.indexOf(c);
        if (p < 0) {
          // Try whitespace-flex variant of the candidate too
          const fp = c.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/(.)/g, '$1\\s*');
          const m2 = text.match(new RegExp(fp));
          if (m2 && m2.index >= 0) { p = m2.index; len = m2[0].length; }
        } else {
          len = c.length;
        }
        if (p >= 0) { idx = p; break; }
      }
    }
    if (idx < 0) continue;
    ranges.push([idx, idx + len, h.reason || '']);
  }
  ranges.sort((a, b) => a[0] - b[0]);
  const merged = [];
  for (const r of ranges) {
    if (merged.length && merged[merged.length - 1][1] >= r[0]) {
      const prev = merged[merged.length - 1];
      prev[1] = Math.max(prev[1], r[1]);
      // Keep both reasons if both have one — concatenate with " | "
      if (r[2] && prev[2] && r[2] !== prev[2]) prev[2] = prev[2] + ' | ' + r[2];
      else if (r[2] && !prev[2]) prev[2] = r[2];
    } else {
      merged.push([r[0], r[1], r[2]]);
    }
  }
  return merged;
}

// Render text into <span class="ans-line"> per line, applying optional hint
// ranges (sentence-level hints) and user highlight ranges.
// Each ans-line carries data-line-start so selections can be mapped back to
// absolute character offsets in the source text.
function textToHtml(text, hintRanges, hlRanges) {
  if (!text) return '';
  const sets = [];
  if (hintRanges && hintRanges.length) sets.push({ ranges: hintRanges, cls: 'hint-mark' });
  if (hlRanges && hlRanges.length)     sets.push({ ranges: hlRanges,   cls: 'user-hl' });

  const lines = text.split('\n');
  let pos = 0;
  const out = [];
  for (const line of lines) {
    const lineStart = pos;
    const lineEnd = pos + line.length;
    const inner = _renderLine(text, lineStart, lineEnd, sets) || '&nbsp;';
    out.push(`<span class="ans-line" data-line-start="${lineStart}">${inner}</span>`);
    pos = lineEnd + 1;
  }
  return out.join('');
}

// Korean function words / overly-generic legal vocabulary that would otherwise
// dominate sentence-overlap matching and cause every sentence to be highlighted.
// Only filter pure function words and ultra-generic legal frame words.
// We keep concrete nouns like 원고/피고/채권자/채무자 — they often anchor
// the fact pattern that the answer references.
const HINT_STOPWORDS = new Set([
  '있다','없다','한다','된다','이다','같다','대한','대하여','관하여','관한','대해',
  '이를','이러한','그러한','다음','함께','아울러','따라','따른','의해','으로',
  '있는','없는','있을','없을','때문','때문에','있어','없어','되어','되며',
  '하면','한바','하여','하지','하고','하며','한다고','한다는','한다면',
  '된다고','이다고','이라는','이라고','이라','이며','이고','이는','이를',
  '것이다','것이고','것을','것으로','하는','부분',
]);

const PARTICLE_RE = /(은는|이가|을를|에서|에게|으로|로부터|에게서|이라고|이라는|이라|에는|에서는|에서도|에서만|이며|이고|이지|으면|으로서|으로써|보다|에도|에만|로는|로도|로만|마저|조차|까지|부터|와|과|이|가|은|는|을|를|의|에|로|도|만|이라|이고)$/;

function tokenizeForOverlap(text) {
  // Split on whitespace + Korean punctuation; strip trailing particles; drop short / stop tokens.
  return text.split(/[\s,.\(\)\[\]"'·•●–—\-?!:;"'「」『』〈〉《》、。…]+/)
    .filter(t => t.length >= 2)
    .map(t => t.replace(PARTICLE_RE, ''))
    .filter(t => t.length >= 2 && !HINT_STOPWORDS.has(t));
}

// Build a hint profile from the answer's 사안 (subsumption) section:
//   - keywords: Set of content tokens (with particles stripped)
//   - phrases: list of 4+ char Hangul/digit substrings extracted from the section,
//     used for phrase-level overlap matching
function extractAnswerKeywords(answer) {
  const empty = { keywords: new Set(), phrases: [] };
  if (!answer) return empty;

  const lines = answer.split('\n');
  let sectionStart = -1;

  for (let i = 0; i < lines.length; i++) {
    if (/^\d+\..*(?:사안|설문해결|사안해결)/.test(lines[i].trim())) { sectionStart = i; break; }
  }
  if (sectionStart < 0) {
    for (let i = lines.length - 1; i >= 0; i--) {
      if (/^\d+\.\s/.test(lines[i].trim())) { sectionStart = i; break; }
    }
  }
  if (sectionStart < 0) return empty;

  const section = lines.slice(sectionStart).join('\n');
  const keywords = new Set(tokenizeForOverlap(section));

  // Extract 5+ char Hangul/digit phrases for verbatim phrase matching.
  // (Run is only Hangul + digits, no punctuation — keeps phrases tight.)
  const phrases = [];
  for (const m of section.matchAll(/[가-힣0-9]{5,}/g)) {
    phrases.push(m[0]);
  }

  return { keywords, phrases };
}

// For a given question text and answer hint profile, find sentence ranges to
// highlight using a weighted score that combines token overlap with phrase
// containment from the answer's 사안 section.
function findHintRanges(text, hintProfile) {
  if (!text || !hintProfile) return [];
  const { keywords: answerKeywords, phrases: answerPhrases } = hintProfile;
  if (!answerKeywords || answerKeywords.size === 0) return [];

  // Sentence boundary: 다. / 요. / 음. (Korean declarative endings) or ? / !
  // followed by whitespace / newline / end-of-string.
  const sentRe = /(?:[다요음]\.|[?!])(?=[\s\n]|$)/g;
  const ranges = [];
  let lastEnd = 0;
  let m;

  const tryAdd = (rawStart, rawEnd) => {
    const sent = text.slice(rawStart, rawEnd);
    if (!sent.trim()) return;
    const toks = new Set(tokenizeForOverlap(sent));
    // Weighted hits: a 3+ char overlap is "strong" (worth 2), 2-char is "weak"
    let score = 0;
    for (const t of toks) {
      if (!answerKeywords.has(t)) continue;
      score += t.length >= 3 ? 2 : 1;
    }
    // Also check substring matches: 3-char rolling windows from the answer
    // section that appear verbatim in this sentence count as strong hits.
    for (const phrase of answerPhrases) {
      if (sent.includes(phrase)) { score += 2; break; }
    }
    if (score >= 2) {
      let s = rawStart;
      while (s < rawEnd && /\s/.test(text[s])) s++;
      let e = rawEnd;
      while (e > s && /\s/.test(text[e - 1])) e--;
      if (e > s) ranges.push([s, e]);
    }
  };

  while ((m = sentRe.exec(text)) !== null) {
    const end = m.index + m[0].length;
    tryAdd(lastEnd, end);
    lastEnd = end;
  }
  if (lastEnd < text.length) tryAdd(lastEnd, text.length);

  return ranges;
}

function renderAnswer(text, hlRanges) {
  if (!text) {
    document.getElementById('answerContent').innerHTML =
      '<span style="color:var(--text-muted);font-family:\'Noto Sans KR\',sans-serif;font-size:0.85rem">답안 정보가 없습니다.</span>';
    return;
  }

  const sets = [];
  if (hlRanges && hlRanges.length) sets.push({ ranges: hlRanges, cls: 'user-hl' });

  const lines = text.split('\n');
  let pos = 0;
  let html = '';

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const lineStart = pos;
    const lineEnd = pos + line.length;
    const trimmed = line.trim();

    // For headers, we render the (trimmed) header but track the original
    // line span for offset purposes. Highlights don't apply inside headers
    // (they'd visually clash with the colored header style anyway).
    if (!trimmed) {
      html += `<span class="ans-blank" data-line-start="${lineStart}"></span>`;
    } else if (/^\d+\./.test(trimmed)) {
      const cls = (trimmed.includes('사안해결') || trimmed.includes('설문해결'))
        ? 'ans-resolution' : 'ans-section-header';
      html += `<div class="${cls}" data-line-start="${lineStart}">${escHtml(trimmed)}</div>`;
    } else {
      const subMatch = trimmed.match(/^(\([0-9]+\)|[ⅠⅡⅢⅣⅤ])\s*(.*)$/);
      const subItemRe = /([ⅰⅱⅲⅳⅴⅵⅶⅷⅸ]\)|①|②|③|④|⑤|⑥|⑦|⑧|⑨)/;
      let handled = false;

      if (subMatch) {
        const marker = subMatch[1];
        const rest = subMatch[2];
        const m = rest.match(subItemRe);
        if (m && m.index >= 0) {
          const headerText = rest.slice(0, m.index).trim();
          const bodyText = rest.slice(m.index).trim();
          const headerLine = headerText ? `${marker} ${headerText}` : marker;
          html += `<div class="ans-subsection" data-line-start="${lineStart}">${escHtml(headerLine)}</div>`;
          // Locate bodyText's absolute character offset inside the source so
          // the body span's data-line-start points to the body's real start.
          // This keeps selection→offset accurate and lets highlights apply.
          let bodyOffInLine = line.indexOf(bodyText);
          if (bodyOffInLine < 0) bodyOffInLine = line.length - bodyText.length;
          const bodyAbsStart = lineStart + bodyOffInLine;
          const bodyAbsEnd = bodyAbsStart + bodyText.length;
          const inner = _renderLine(text, bodyAbsStart, bodyAbsEnd, sets) || '&nbsp;';
          html += `<span class="ans-line" data-line-start="${bodyAbsStart}">${inner}</span>`;
          handled = true;
        } else {
          html += `<div class="ans-subsection" data-line-start="${lineStart}">${escHtml(trimmed)}</div>`;
          handled = true;
        }
      }

      if (!handled) {
        const inner = _renderLine(text, lineStart, lineEnd, sets) || '&nbsp;';
        html += `<span class="ans-line" data-line-start="${lineStart}">${inner}</span>`;
      }
    }
    pos = lineEnd + 1;
  }

  // Wrap "제N조" / "제N조의M" article mentions in clickable spans.
  // Apply to the assembled HTML — _renderLine has already escaped text.
  html = linkifyArticles(html);
  document.getElementById('answerContent').innerHTML = html;
}

function escHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ── Per-question stopwatch ─────────────────────────────────
let stopwatchStart = 0;
let stopwatchInterval = null;
let stopwatchAdvanceFired = false;
let stopwatchPaused = false;
let stopwatchPausedElapsed = 0;
const STOPWATCH_LIMIT_MS = 3 * 60 * 1000;

function _formatStopwatch(ms) {
  const total = Math.floor(ms / 1000);
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  const pad = (n) => n.toString().padStart(2, '0');
  return h > 0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}

function _renderStopwatchText(elapsed) {
  const el = document.getElementById('stopwatch');
  if (!el) return;
  const icon = stopwatchPaused ? '⏸' : '⏱';
  el.textContent = `${icon} ${_formatStopwatch(elapsed)}`;
  el.classList.toggle('long', !stopwatchPaused && elapsed > STOPWATCH_LIMIT_MS - 30 * 1000);
  el.classList.toggle('paused', stopwatchPaused);
}

function _tickStopwatch() {
  if (stopwatchPaused) return;  // safety — interval should be stopped while paused
  const elapsed = Date.now() - stopwatchStart;
  _renderStopwatchText(elapsed);

  if (!stopwatchAdvanceFired && elapsed >= STOPWATCH_LIMIT_MS) {
    stopwatchAdvanceFired = true;
    if (filtered.length > 0 && cursor < filtered.length - 1) {
      cursor++;
      showCurrent();
    } else {
      if (stopwatchInterval) { clearInterval(stopwatchInterval); stopwatchInterval = null; }
    }
  }
}

function pauseStopwatch() {
  if (stopwatchPaused) return;
  stopwatchPausedElapsed = Date.now() - stopwatchStart;
  if (stopwatchInterval) { clearInterval(stopwatchInterval); stopwatchInterval = null; }
  stopwatchPaused = true;
  _renderStopwatchText(stopwatchPausedElapsed);
}
function resumeStopwatch() {
  if (!stopwatchPaused) return;
  stopwatchStart = Date.now() - stopwatchPausedElapsed;
  stopwatchPaused = false;
  _renderStopwatchText(stopwatchPausedElapsed);
  stopwatchInterval = setInterval(_tickStopwatch, 1000);
}
function toggleStopwatch() {
  if (stopwatchPaused) resumeStopwatch();
  else pauseStopwatch();
}

function resetStopwatch() {
  if (stopwatchInterval) clearInterval(stopwatchInterval);
  stopwatchStart = Date.now();
  stopwatchAdvanceFired = false;
  stopwatchPaused = false;
  stopwatchPausedElapsed = 0;
  _renderStopwatchText(0);
  stopwatchInterval = setInterval(_tickStopwatch, 1000);
}

// ── Cloze quiz ─────────────────────────────────────────────
let quizMode = false;
let currentBlanks = [];

// Generic Korean nouns / framing words that wouldn't make for useful blanks.
const QUIZ_STOPWORDS = new Set([
  '문제의소재','사안해결','설문해결','문제점','검토','학설','판례',
  '사안','검토및사안','학설및판례','판단','결론','내용','경우','부분',
  '있다고','없다고','한다고','된다고','이라고','이라는','때문에','대하여',
  '관하여','관한','대한','이를','이러한','그러한','다음','함께','아울러',
]);

function buildQuizBlanks(answerText) {
  // Quiz uses ONLY the spans the user has yellow-highlighted on the answer.
  // Each highlight range becomes one blank.
  if (!answerText) return [];
  const ranges = currentHighlights.answer || [];
  return ranges
    .filter(([s, e]) => e > s)
    .map(([s, e]) => ({ start: s, end: e, text: answerText.slice(s, e) }))
    .sort((a, b) => a.start - b.start);
}

function renderQuiz(answerText, blanks) {
  if (!answerText) { document.getElementById('answerContent').innerHTML = ''; return; }
  let html = '';
  let cursor = 0;
  for (let i = 0; i < blanks.length; i++) {
    const b = blanks[i];
    html += escHtml(answerText.slice(cursor, b.start));
    const w = Math.max(3, Math.min(b.text.length + 2, 12));
    html += `<input class="quiz-blank" data-idx="${i}" size="${w}" autocomplete="off" />`;
    html += `<span class="quiz-answer" data-idx="${i}"></span>`;
    cursor = b.end;
  }
  html += escHtml(answerText.slice(cursor));
  // Convert newlines into ans-line spans for layout
  const lines = html.split('\n');
  document.getElementById('answerContent').innerHTML =
    lines.map(l => `<span class="ans-line">${l || '&nbsp;'}</span>`).join('');
}

function startQuiz() {
  if (filtered.length === 0) return;
  const { sq } = filtered[order[cursor]];
  if (!sq.answer) return;
  currentBlanks = buildQuizBlanks(sq.answer);
  if (currentBlanks.length === 0) {
    alert('답안에 형광펜으로 칠한 부분이 없습니다.\n먼저 답안 텍스트를 마우스로 선택해 🖍 형광펜 버튼으로 칠해주세요. 칠한 부분이 빈칸이 됩니다.');
    return;
  }
  quizMode = true;
  document.getElementById('btnQuiz').classList.add('active');
  document.getElementById('quizBar').classList.add('shown');
  document.getElementById('quizScore').textContent = `0 / ${currentBlanks.length}`;
  // Reveal the answer area while in quiz mode
  revealAnswer();
  renderQuiz(sq.answer, currentBlanks);
}

function endQuiz() {
  quizMode = false;
  currentBlanks = [];
  document.getElementById('btnQuiz').classList.remove('active');
  document.getElementById('quizBar').classList.remove('shown');
  document.getElementById('quizScore').textContent = '';
  // Re-render the regular answer
  if (filtered.length > 0) {
    const { sq } = filtered[order[cursor]];
    renderAnswer(sq.answer, currentHighlights.answer);
  }
}

function checkQuiz() {
  if (!quizMode) return;
  let correct = 0;
  document.querySelectorAll('.quiz-blank').forEach(inp => {
    const idx = parseInt(inp.dataset.idx, 10);
    const expected = currentBlanks[idx]?.text || '';
    const userAns = inp.value.trim();
    const ansEl = document.querySelector(`.quiz-answer[data-idx="${idx}"]`);
    inp.classList.remove('correct', 'wrong');
    if (userAns && userAns === expected) {
      inp.classList.add('correct');
      correct++;
    } else {
      inp.classList.add('wrong');
    }
    if (ansEl) {
      ansEl.textContent = expected;
      ansEl.classList.add('shown');
    }
  });
  document.getElementById('quizScore').textContent = `${correct} / ${currentBlanks.length}`;
}

// ── Statute side panel ─────────────────────────────────────
// STATUTE_DATA is either the legacy array (single subject) or a
// { subject: [articles...] } object. Pick the array for the active subject.
function currentStatuteList() {
  if (Array.isArray(STATUTE_DATA)) return STATUTE_DATA;
  return STATUTE_DATA[activeSubject] || [];
}
const _statuteIdxCache = {};
function getStatuteByMarker(marker) {
  const key = (marker || '').replace(/\s+/g, '');
  if (!_statuteIdxCache[activeSubject]) {
    const m = {};
    for (const a of currentStatuteList()) m[a.no_str] = a;
    _statuteIdxCache[activeSubject] = m;
  }
  return _statuteIdxCache[activeSubject][key] || null;
}

function renderStatuteList(query, openMarker) {
  const list = document.getElementById('statuteList');
  const q = (query || '').trim();
  const all = currentStatuteList();
  let items = all;
  if (q) {
    const numMatch = q.match(/^\d+$/) ? `제${q}조` : null;
    items = all.filter(a =>
      a.no_str.includes(q)
      || (numMatch && a.no_str.startsWith(numMatch))
      || a.title.includes(q)
      || a.body.includes(q)
    );
  }
  if (items.length === 0) {
    list.innerHTML = '<div class="statute-empty">검색 결과가 없습니다.</div>';
    return;
  }
  list.innerHTML = items.map(a => `
    <div class="statute-item${openMarker === a.no_str ? ' active' : ''}" data-marker="${a.no_str}">
      <div class="statute-item-no">${escHtml(a.no_str)}</div>
      <div class="statute-item-title">${escHtml(a.title || '')}</div>
      <div class="statute-item-body">${escHtml(a.body)}</div>
    </div>`).join('');

  if (openMarker) {
    const el = list.querySelector(`.statute-item[data-marker="${openMarker}"]`);
    if (el) el.scrollIntoView({ block: 'start' });
  }
}

// Wrap in-text article references like 제78조 / 제82조 제2항 / 제3조의2 / [제78조]
// with clickable spans. Operates on already-escaped HTML.
function linkifyArticles(escapedHtml) {
  // (1) Korean form: "제N조" / "제N조의M" / "제N조 제M항" / "제N조 제M호"
  let html = escapedHtml.replace(
    /제\s*(\d+)조(?:의\s*\d+)?(?:\s*제?\s*\d+항)?(?:\s*제?\s*\d+호)?/g,
    (m) => {
      const norm = m.replace(/\s+/g, '');
      const baseMatch = norm.match(/제\d+조(?:의\d+)?/);
      if (!baseMatch) return m;
      const baseMarker = baseMatch[0];
      if (!getStatuteByMarker(baseMarker)) return m;
      return `<span class="article-link" data-marker="${baseMarker}">${m}</span>`;
    }
  );
  // (2) Hanja form used in 특허법 answers: "法100", "法101①(2)", "法128"
  // Map "法N" → "제N조" for the side-panel lookup.
  html = html.replace(
    /法\s*(\d+)(?:의\s*\d+)?(?:[①②③④⑤⑥⑦⑧⑨⑩])?(?:\s*\(\s*[\d, ]+\s*\))?/g,
    (m, num) => {
      const baseMarker = `제${num}조`;
      if (!getStatuteByMarker(baseMarker)) return m;
      return `<span class="article-link" data-marker="${baseMarker}">${m}</span>`;
    }
  );
  return html;
}

// ── Category extraction from answer text ───────────────────
// Header levels:
//   1 = top section "1. 문제의 소재"
//   2 = mid section "(1) ..." or roman "Ⅰ. ..."
//   3 = item "ⅰ)" / "①" / "1)"
function _hdrLevel(line) {
  if (/^\d+\.\s/.test(line)) return 1;
  if (/^\(\d+\)/.test(line) || /^[ⅠⅡⅢⅣⅤ]\.\s/.test(line)) return 2;
  // Level 3 markers: ⅰ) ⅱ) ① ② or "1) 학설" / "2) 판례" (Arabic + paren)
  if (/^[ⅰⅱⅲⅳⅴⅵⅶⅷⅸ]\)/.test(line)
      || /^[①②③④⑤⑥⑦⑧⑨]/.test(line)
      || /^\d+\)\s*\S/.test(line)) return 3;
  return 0;
}

// Pull out every section whose own header matches `keywordRe`.
// A section ends at the next header of the same or shallower level.
function extractSectionsByKeyword(answer, keywordRe) {
  if (!answer) return '';
  const lines = answer.split('\n');
  const blocks = [];
  let inBlock = false;
  let blockLevel = 0;
  let buf = [];

  const flush = () => {
    if (inBlock && buf.length) blocks.push(buf.join('\n').trim());
    inBlock = false;
    buf = [];
  };

  for (const raw of lines) {
    const line = raw.trim();
    if (!line) { if (inBlock) buf.push(''); continue; }
    const level = _hdrLevel(line);

    if (level > 0) {
      if (inBlock && level <= blockLevel) flush();
      if (!inBlock && keywordRe.test(line)) {
        inBlock = true;
        blockLevel = level;
        buf.push(line);
        continue;
      }
    }
    if (inBlock) buf.push(line);
  }
  flush();
  return blocks.join('\n\n');
}

function extractAnswerCategories(answer, prebuilt) {
  // Hand-curated LLM-style categories baked into data.json take priority
  // over the deterministic regex extraction below.
  if (prebuilt && typeof prebuilt === 'object') {
    return {
      toc: prebuilt.toc || '',
      purpose: prebuilt.purpose || '',
      article: prebuilt.article || '',
      elements: prebuilt.elements || '',
      theory: prebuilt.theory || '',
      cases: prebuilt.cases || '',
      resolution: prebuilt.resolution || '',
    };
  }
  const out = { toc:'', purpose:'', article:'', elements:'', theory:'', cases:'', resolution:'' };
  if (!answer) return out;

  // 1. 목차 — every top-level "N. ..." header, with trailing point counts stripped
  const lines = answer.split('\n');
  const tocLines = [];
  for (const raw of lines) {
    const m = raw.trim().match(/^(\d+)\.\s+(.+)$/);
    if (!m) continue;
    let title = m[2];
    title = title.replace(/\s+[\d.]+\s*$/, ''); // trim trailing 0.5 / 1.5 / 4 etc.
    tocLines.push(`${m[1]}. ${title}`);
  }
  out.toc = tocLines.join('\n');

  // 2. 의의·취지
  out.purpose = extractSectionsByKeyword(answer, /의의|취지/);

  // 3. 조문번호 — collect every article reference, dedupe, preserve order
  const seen = new Set();
  const articles = [];
  const articleRe = /(?:\[?\(?\s*(?:민법|민사소송법|민소법|상법|형법)?\s*제\s*\d+조(?:\s*의\s*\d+)?(?:\s*제?\s*\d+항)?(?:\s*제?\s*\d+호)?\s*\]?\)?)/g;
  for (const m of answer.matchAll(articleRe)) {
    const norm = m[0].replace(/[\[\]\(\)]/g, '').replace(/\s+/g, ' ').trim();
    if (!/제\s*\d+조/.test(norm)) continue;
    if (seen.has(norm)) continue;
    seen.add(norm);
    articles.push(norm);
  }
  out.article = articles.join(', ');

  // 4. 요건
  out.elements = extractSectionsByKeyword(answer, /요건/);

  // 5. 학설
  out.theory = extractSectionsByKeyword(answer, /학설/);

  // 6. 판례 (判例 in Hanja, 판례 in Hangul)
  out.cases = extractSectionsByKeyword(answer, /判例|판례/);

  // 7. 사안의 해결 — both 사안해결 (older) and 설문해결 (62회)
  out.resolution = extractSectionsByKeyword(answer, /사안해결|설문해결|사안의\s*해결/);

  return out;
}

// ── User highlights (yellow marker) ────────────────────────
function hlKey(prob, sq, area) {

}
function loadAllHighlights(prob, sq) {
  for (const area of HL_AREAS) {
    const raw = localStorage.getItem(hlKey(prob, sq, area));
    try { currentHighlights[area] = raw ? JSON.parse(raw) : []; }
    catch { currentHighlights[area] = []; }
  }
}
function saveHighlightsFor(area, prob, sq) {
  if (currentHighlights[area].length === 0) {
    localStorage.removeItem(hlKey(prob, sq, area));
  } else {
    localStorage.setItem(hlKey(prob, sq, area), JSON.stringify(currentHighlights[area]));
  }
}

// Insert a [start, end) range, merging with any existing overlapping ranges.
function addHighlightRange(area, start, end) {
  if (start >= end) return;
  const arr = currentHighlights[area].slice();
  arr.push([start, end]);
  arr.sort((a, b) => a[0] - b[0]);
  const merged = [];
  for (const [s, e] of arr) {
    if (merged.length && merged[merged.length - 1][1] >= s) {
      merged[merged.length - 1][1] = Math.max(merged[merged.length - 1][1], e);
    } else {
      merged.push([s, e]);
    }
  }
  currentHighlights[area] = merged;
}

function removeHighlightRange(area, start, end) {
  currentHighlights[area] = currentHighlights[area].filter(
    ([s, e]) => !(s === start && e === end)
  );
}

function rerenderHlArea(area) {
  if (filtered.length === 0) return;
  const { prob, sq } = filtered[order[cursor]];
  if (area === 'passage') {
    document.getElementById('passageText').innerHTML =
      textToHtml(prob.passage, hintOn ? currentPassageRanges : null, currentHighlights.passage);
  } else if (area === 'subq') {
    document.getElementById('subqText').innerHTML =
      textToHtml(sq.question, hintOn ? currentSubqRanges : null, currentHighlights.subq);
  } else if (area === 'answer') {
    renderAnswer(sq.answer, currentHighlights.answer);
  }
}

// Walk text nodes within `lineEl` to compute the offset corresponding to
// (node, offset) within the line, then add the line's data-line-start to get
// an absolute offset over the original source string.
function getCharOffsetFromPoint(rootEl, node, offset) {
  let lineEl = node.nodeType === Node.TEXT_NODE ? node.parentElement : node;
  while (lineEl && lineEl !== rootEl) {
    if (lineEl.dataset && lineEl.dataset.lineStart != null) break;
    lineEl = lineEl.parentElement;
  }
  if (!lineEl || lineEl === rootEl || !rootEl.contains(lineEl)) return -1;
  const lineStart = parseInt(lineEl.dataset.lineStart, 10);
  if (isNaN(lineStart)) return -1;
  let withinLine = 0;
  const walker = document.createTreeWalker(lineEl, NodeFilter.SHOW_TEXT);
  let curr;
  while ((curr = walker.nextNode())) {
    if (curr === node) return lineStart + withinLine + offset;
    withinLine += curr.nodeValue.length;
  }
  // Selection ended after all text inside the line (e.g. at element end)
  return lineStart + withinLine;
}

function renderHintCards() {
  const cards = document.getElementById('hintCards');
  const body = document.getElementById('hintCardsBody');
  if (filtered.length === 0) { cards.classList.remove('shown'); return; }
  const { prob, sq } = filtered[order[cursor]];
  const list = effectiveHints(prob, sq);
  if (!hintOn || (list.length === 0 && !hintEditMode)) {
    cards.classList.remove('shown');
    return;
  }
  cards.classList.add('shown');

  if (hintEditMode) {
    const inner = list.map((h, i) => `
      <div class="hint-card">
        <div class="hint-card-text">· ${escHtml(h.text)}</div>
        <textarea class="hint-card-reason-edit" data-idx="${i}" rows="2">${escHtml(h.reason || '')}</textarea>
        <div class="hint-card-actions">
          <button class="hint-card-del" data-idx="${i}">삭제</button>
        </div>
      </div>`).join('');
    body.innerHTML = inner + `
      <div style="margin-top:8px;font-size:0.75rem;color:#7c2d12;">
        💡 문제 본문에서 텍스트를 드래그한 뒤 우측 상단에 뜨는 <b>'💡 힌트로 추가'</b> 버튼을 누르면 새 힌트가 추가됩니다.
      </div>`;
  } else {
    body.innerHTML = list.map(h => `
      <div class="hint-card">
        <div class="hint-card-text">· ${escHtml(h.text)}</div>
        <div class="hint-card-reason">→ ${escHtml(h.reason || '')}</div>
      </div>`).join('') || '<div class="hint-card-reason">힌트가 없습니다. 편집 모드에서 추가하세요.</div>';
  }
}

function rebuildHintRanges() {
  if (filtered.length === 0) return;
  const { prob, sq } = filtered[order[cursor]];
  const list = effectiveHints(prob, sq);
  if (list && list.length) {
    currentPassageRanges = locateHints(prob.passage, list);
    currentSubqRanges = locateHints(sq.question, list);
  } else {
    currentPassageRanges = [];
    currentSubqRanges = [];
  }
  rerenderHlArea('passage');
  rerenderHlArea('subq');
}

function findHlAreaContainingRange(range) {
  const start = range.startContainer;
  const end = range.endContainer;
  const startEl = start.nodeType === Node.TEXT_NODE ? start.parentElement : start;
  const endEl = end.nodeType === Node.TEXT_NODE ? end.parentElement : end;
  const startArea = startEl && startEl.closest && startEl.closest('[data-hl-area]');
  const endArea = endEl && endEl.closest && endEl.closest('[data-hl-area]');
  if (startArea && startArea === endArea) return startArea;
  return null;
}

// ── Answer visibility ──────────────────────────────────────
function hideAnswer() {
  answerRevealed = false;
  document.getElementById('overlay').classList.remove('gone');
  document.getElementById('btnToggle').textContent = '정답 보기';
  document.getElementById('btnToggle').classList.remove('revealed');
}

function revealAnswer() {
  answerRevealed = true;
  document.getElementById('overlay').classList.add('gone');
  document.getElementById('btnToggle').textContent = '정답 숨기기';
  document.getElementById('btnToggle').classList.add('revealed');
}

// ── Events ─────────────────────────────────────────────────
function bindEvents() {
  document.getElementById('btnRandom').addEventListener('click', () => {
    order = shuffle([...Array(filtered.length).keys()]);
    cursor = 0;
    showCurrent();
  });

  document.getElementById('btnPrev').addEventListener('click', () => {
    if (cursor > 0) { cursor--; showCurrent(); }
  });

  document.getElementById('btnNext').addEventListener('click', () => {
    if (cursor < filtered.length - 1) { cursor++; showCurrent(); }
  });

  document.getElementById('btnToggle').addEventListener('click', () => {
    answerRevealed ? hideAnswer() : revealAnswer();
  });

  document.getElementById('btnHint').addEventListener('click', () => {
    const btn = document.getElementById('btnHint');
    if (btn.disabled) return;
    hintOn = !hintOn;
    btn.classList.toggle('active', hintOn);
    rerenderHlArea('passage');
    rerenderHlArea('subq');
    if (!hintOn) {
      document.getElementById('hintCards').classList.remove('shown');
      hintEditMode = false;
      document.getElementById('btnHintEdit').classList.remove('active');
    } else {
      renderHintCards();
    }
  });

  // ── Hint edit mode ──
  document.getElementById('btnHintEdit').addEventListener('click', () => {
    hintEditMode = !hintEditMode;
    document.getElementById('btnHintEdit').classList.toggle('active', hintEditMode);
    if (hintEditMode && !hintOn) {
      // Auto-turn the hint view on so the user can see what they're editing
      hintOn = true;
      document.getElementById('btnHint').classList.add('active');
      rerenderHlArea('passage');
      rerenderHlArea('subq');
    }
    renderHintCards();
  });

  // Edit-mode interactions inside the card list
  document.getElementById('hintCardsBody').addEventListener('click', e => {
    if (!hintEditMode) return;
    const delBtn = e.target.closest('.hint-card-del');
    if (!delBtn) return;
    const idx = parseInt(delBtn.dataset.idx, 10);
    const { prob, sq } = filtered[order[cursor]];
    const list = effectiveHints(prob, sq).slice();
    list.splice(idx, 1);
    saveCustomHints(prob, sq, list);
    rebuildHintRanges();
    renderHintCards();
  });
  document.getElementById('hintCardsBody').addEventListener('input', e => {
    if (!hintEditMode) return;
    const ta = e.target.closest('.hint-card-reason-edit');
    if (!ta) return;
    const idx = parseInt(ta.dataset.idx, 10);
    const { prob, sq } = filtered[order[cursor]];
    const list = effectiveHints(prob, sq).slice();
    if (!list[idx]) return;
    list[idx] = { ...list[idx], reason: ta.value };
    saveCustomHints(prob, sq, list);
  });

  // ── Clear all hints for the current sub-question ──
  document.getElementById('btnHintClear').addEventListener('click', () => {
    if (filtered.length === 0) return;
    const { prob, sq } = filtered[order[cursor]];
    const list = effectiveHints(prob, sq);
    if (list.length === 0) {
      alert('이 설문에는 등록된 힌트가 없습니다.');
      return;
    }
    if (!confirm(`이 설문의 힌트 ${list.length}개를 모두 지울까요?`)) return;
    // Persist an empty list (effectiveHints honors stored empty arrays) AND
    // wipe the runtime sq.hints so nothing slips through.
    saveCustomHints(prob, sq, []);
    sq.hints = [];
    currentPassageRanges = [];
    currentSubqRanges = [];
    rerenderHlArea('passage');
    rerenderHlArea('subq');
    renderHintCards();
  });

  // ── Stopwatch click → pause / resume ──
  document.getElementById('stopwatch').addEventListener('click', toggleStopwatch);

  // ── Highlight reset for the answer area ──
  document.getElementById('btnHlResetAnswer').addEventListener('click', () => {
    if (filtered.length === 0) return;
    if (currentHighlights.answer.length === 0) return;
    if (!confirm('이 설문의 모범답안에 친 형광펜을 모두 지울까요?')) return;
    const { prob, sq } = filtered[order[cursor]];
    currentHighlights.answer = [];
    saveHighlightsFor('answer', prob, sq);
    rerenderHlArea('answer');
  });

  document.getElementById('overlay').addEventListener('click', revealAnswer);

  // Filter buttons are re-rendered each time the subject changes — use delegation
  document.getElementById('filterGroup').addEventListener('click', e => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    document.querySelectorAll('#filterGroup .filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyFilter(btn.dataset.exam);
  });

  // Subject panel: toggle, handle, item selection
  const sToggle = document.getElementById('subjectToggle');
  const sPanel = document.getElementById('subjectPanel');
  const sHandle = document.getElementById('subjectHandle');
  function openSubjectPanel() { sPanel.classList.add('open'); }
  function closeSubjectPanel() { sPanel.classList.remove('open'); }
  sToggle.addEventListener('click', () =>
    sPanel.classList.contains('open') ? closeSubjectPanel() : openSubjectPanel());
  sHandle.addEventListener('click', () =>
    sPanel.classList.contains('open') ? closeSubjectPanel() : openSubjectPanel());
  document.getElementById('subjectList').addEventListener('click', e => {
    const item = e.target.closest('.subject-item');
    if (!item) return;
    const subj = item.dataset.subject;
    if (subj && subj !== activeSubject) setSubject(subj);
    closeSubjectPanel();
  });
  document.addEventListener('mousedown', e => {
    if (!sPanel.classList.contains('open')) return;
    if (e.target.closest('#subjectPanel')) return;
    if (e.target.closest('#subjectToggle')) return;
    if (e.target.closest('#subjectHandle')) return;
    closeSubjectPanel();
  });

  // Persist study notes whenever an input changes
  document.getElementById('studyInputBlock').addEventListener('input', e => {
    if (!e.target.classList.contains('study-input')) return;
    if (filtered.length === 0) return;
    const { prob, sq } = filtered[order[cursor]];
    saveNote(prob, sq, e.target.dataset.cat, e.target.value);
  });

  // Submit button reveals the extracted answer for that single category
  document.getElementById('studyInputBlock').addEventListener('click', e => {
    if (!e.target.classList.contains('study-submit')) return;
    showInlineAnswer(e.target.dataset.cat);
  });

  // Reset all study notes for the current sub-question
  document.getElementById('btnResetNotes').addEventListener('click', () => {
    if (filtered.length === 0) return;
    if (!confirm('이 설문의 학습 노트를 모두 지울까요?')) return;
    const { prob, sq } = filtered[order[cursor]];
    document.querySelectorAll('#studyInputBlock .study-input').forEach(t => {
      localStorage.removeItem(noteKey(prob, sq, t.dataset.cat));
      t.value = '';
    });
    resetInlineAnswers();
  });

  // Keyboard shortcuts (skip when typing in inputs/textareas)
  document.addEventListener('keydown', e => {
    const tag = e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (e.key === 'ArrowLeft') document.getElementById('btnPrev').click();
    if (e.key === 'ArrowRight') document.getElementById('btnNext').click();
    if (e.key === ' ') { e.preventDefault(); answerRevealed ? hideAnswer() : revealAnswer(); }
    if (e.key === 'r' || e.key === 'R') document.getElementById('btnRandom').click();
  });

  // ── Highlight: floating button when text is selected inside a hl-area ──
  const floatBtn = document.getElementById('hlFloatBtn');

  const addHintBtn = document.getElementById('addHintBtn');

  document.addEventListener('mouseup', e => {
    if (e.target.closest('#hlFloatBtn') || e.target.closest('#addHintBtn')) return;
    setTimeout(() => {
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0 || sel.isCollapsed || sel.toString().trim() === '') {
        floatBtn.style.display = 'none';
        addHintBtn.style.display = 'none';
        return;
      }
      const range = sel.getRangeAt(0);
      const areaEl = findHlAreaContainingRange(range);
      if (!areaEl) { floatBtn.style.display = 'none'; addHintBtn.style.display = 'none'; return; }

      const startOff = getCharOffsetFromPoint(areaEl, range.startContainer, range.startOffset);
      const endOff = getCharOffsetFromPoint(areaEl, range.endContainer, range.endOffset);
      if (startOff < 0 || endOff < 0 || startOff === endOff) {
        floatBtn.style.display = 'none';
        addHintBtn.style.display = 'none';
        return;
      }

      const rect = range.getBoundingClientRect();
      const area = areaEl.dataset.hlArea;
      floatBtn.style.left = `${rect.right + 6 + window.scrollX}px`;
      floatBtn.style.top = `${rect.top - 34 + window.scrollY}px`;
      floatBtn.style.display = 'block';
      floatBtn.dataset.area = area;
      floatBtn.dataset.startOff = String(Math.min(startOff, endOff));
      floatBtn.dataset.endOff = String(Math.max(startOff, endOff));

      // Show "add hint" button only in edit mode and only on passage / subq
      if (hintEditMode && (area === 'passage' || area === 'subq')) {
        addHintBtn.style.left = `${rect.right + 6 + window.scrollX}px`;
        addHintBtn.style.top = `${rect.bottom + 4 + window.scrollY}px`;
        addHintBtn.style.display = 'block';
        addHintBtn.dataset.text = sel.toString();
      } else {
        addHintBtn.style.display = 'none';
      }
    }, 0);
  });

  addHintBtn.addEventListener('mousedown', e => e.preventDefault());
  addHintBtn.addEventListener('click', () => {
    if (filtered.length === 0) return;
    const text = (addHintBtn.dataset.text || '').trim();
    if (!text) return;
    const reason = prompt('이 사실관계가 왜 중요한지 (이유)를 입력하세요:', '') || '';
    const { prob, sq } = filtered[order[cursor]];
    const list = effectiveHints(prob, sq).slice();
    list.push({ text, reason });
    saveCustomHints(prob, sq, list);
    window.getSelection().removeAllRanges();
    addHintBtn.style.display = 'none';
    floatBtn.style.display = 'none';
    rebuildHintRanges();
    renderHintCards();
  });

  // Don't lose the user's selection when they mousedown on the floating button
  floatBtn.addEventListener('mousedown', e => e.preventDefault());

  floatBtn.addEventListener('click', () => {
    if (filtered.length === 0) return;
    const area = floatBtn.dataset.area;
    const start = parseInt(floatBtn.dataset.startOff, 10);
    const end = parseInt(floatBtn.dataset.endOff, 10);
    if (!area || isNaN(start) || isNaN(end)) return;
    addHighlightRange(area, start, end);
    const { prob, sq } = filtered[order[cursor]];
    saveHighlightsFor(area, prob, sq);
    rerenderHlArea(area);
    window.getSelection().removeAllRanges();
    floatBtn.style.display = 'none';
  });

  // ── Statute side panel ──
  document.getElementById('statuteToggle').addEventListener('click', () => {
    const panel = document.getElementById('statutePanel');
    if (panel.classList.contains('open')) closeStatutePanel();
    else openStatutePanel();
  });
  document.getElementById('statuteClose').addEventListener('click', closeStatutePanel);
  // Side handle on the panel's left edge — also collapses/expands
  document.getElementById('statuteHandle').addEventListener('click', () => {
    const panel = document.getElementById('statutePanel');
    if (panel.classList.contains('open')) closeStatutePanel();
    else openStatutePanel();
  });
  document.getElementById('statuteSearch').addEventListener('input', e => {
    renderStatuteList(e.target.value, null);
  });
  document.getElementById('statuteList').addEventListener('click', e => {
    const item = e.target.closest('.statute-item');
    if (!item) return;
    const marker = item.dataset.marker;
    document.querySelectorAll('#statuteList .statute-item').forEach(el => el.classList.toggle('active', el === item));
  });
  // Article reference inside the answer → open panel + reveal
  document.addEventListener('click', e => {
    const link = e.target.closest('.article-link');
    if (!link) return;
    e.preventDefault();
    openStatutePanel(link.dataset.marker);
  });
  // Click outside the panel to close it (handle, toggle, links excluded)
  document.addEventListener('mousedown', e => {
    const panel = document.getElementById('statutePanel');
    if (!panel.classList.contains('open')) return;
    if (e.target.closest('#statutePanel')) return;
    if (e.target.closest('#statuteToggle')) return;
    if (e.target.closest('#statuteHandle')) return;
    if (e.target.closest('.article-link')) return;
    closeStatutePanel();
  });
  // ESC closes the panel
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    const panel = document.getElementById('statutePanel');
    if (panel.classList.contains('open')) {
      e.stopPropagation();
      closeStatutePanel();
    }
  });

  // ── Cloze quiz ──
  document.getElementById('btnQuiz').addEventListener('click', () => {
    if (quizMode) endQuiz();
    else startQuiz();
  });
  document.getElementById('btnQuizCheck').addEventListener('click', checkQuiz);
  document.getElementById('btnQuizEnd').addEventListener('click', endQuiz);

  // Click on a yellow highlight span to remove that range
  document.addEventListener('click', e => {
    const span = e.target.closest('.user-hl');
    if (!span) return;
    const start = parseInt(span.dataset.hlStart, 10);
    const end = parseInt(span.dataset.hlEnd, 10);
    if (isNaN(start) || isNaN(end)) return;
    const areaEl = span.closest('[data-hl-area]');
    if (!areaEl) return;
    const area = areaEl.dataset.hlArea;
    removeHighlightRange(area, start, end);
    if (filtered.length === 0) return;
    const { prob, sq } = filtered[order[cursor]];
    saveHighlightsFor(area, prob, sq);
    rerenderHlArea(area);
  });
}

      <div style="font-size:2rem">⚠️</div>
      <div style="font-size:1rem;color:#666">데이터가 없습니다. 먼저 parse_pdfs.py를 실행하세요.</div>
      <div style="font-size:0.85rem;color:#999;background:#f4f4f4;padding:10px 18px;border-radius:6px;font-family:monospace">
        cd /Users/iseongjae/Desktop/기출 &amp;&amp; python3 parse_pdfs.py
      </div>
    </div>`;
} else {
  init();
}
